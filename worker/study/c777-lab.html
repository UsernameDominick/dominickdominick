// ===== Unit 5: Forms and Validation =====
Q(5,'Form basics','What is an HTML form used for?',['Collecting input from users and sending it to a server or script'],['Styling pages','Playing media','Drawing graphics'],'Forms contain controls such as text fields, checkboxes and buttons.');
Q(5,'Form basics','Which element wraps the controls of a form?',['`<form>`'],['`<input>`','`<fieldset>`','`<formdata>`'],'`<form action="/submit" method="post"> ... <\/form>`');
Q(5,'Form basics','What does the `action` attribute of `<form>` specify?',['The URL that receives the submitted data'],['The HTTP method','The button label','The form\'s name'],'If it is omitted the form is submitted to the current page URL.');
Q(5,'Form basics','What does the `method` attribute of `<form>` specify?',['The HTTP method used to send the data (GET or POST)'],['The URL to submit to','How the form is validated','The form\'s encoding only'],'The default is GET.');
Q(5,'Form basics','What is the default `method` of a form?',['GET'],['POST','PUT','DELETE'],'If `method` is omitted, GET is used.');
Q(5,'Form basics','Which is true of the GET method? (select all that apply)',['Form data is appended to the URL','The result can be bookmarked','It should not be used for sensitive data like passwords'],['It hides data in the request body','It has no limit on the amount of data'],'GET puts data in the query string. POST sends it in the body.');
Q(5,'Form basics','Which is true of the POST method? (select all that apply)',['Data is sent in the request body, not shown in the URL','It is better for sensitive or large data'],['The results can always be bookmarked','It is the default method'],'POST is not a replacement for HTTPS encryption.');
Q(5,'Form basics','Which input does NOT appear in the URL when the form is submitted?',['A form sent with POST'],['A form sent with GET','Any form','Only password fields in a GET form'],'GET exposes values in the query string, even for password fields.');
Q(5,'Form basics','Which attribute identifies an input so its value is sent to the server with that name?',['`name`'],['`id`','`class`','`label`'],'Controls without a `name` are not included in the submitted data.');
Q(5,'Form basics','What is the purpose of the `id` attribute on an input?',['To uniquely identify it so a label or script can refer to it'],['To name the value sent to the server','To make it required','To style it blue'],'`<label for="email">` matches `<input id="email">`.');
Q(5,'Form basics','Which attribute pre-fills an input with a starting value?',['`value`'],['`default`','`text`','`start`'],'`<input type="text" value="Ann">`');
Q(5,'Form basics','Which attribute shows hint text inside an empty input?',['`placeholder`'],['`hint`','`tip`','`prompt`'],'Placeholder text disappears when typing starts and is not a replacement for a label.');
Q(5,'Form basics','Which `enctype` must be used on a form that uploads files?',['`multipart/form-data`'],['`text/plain`','`application/json`','`application/x-www-form-urlencoded`'],'File uploads also require `method="post"`.');
Q(5,'Form basics','What does `target="_blank"` on a form do?',['Shows the response in a new tab or window'],['Blanks the form','Validates it','Resets the fields'],'The `target` attribute works the same way as for links.');
Q(5,'Input types','Which element creates most form fields?',['`<input>`'],['`<field>`','`<control>`','`<entry>`'],'The `type` attribute chooses the kind of input.');
Q(5,'Input types','Which input type is the default if `type` is missing or invalid?',['`text`'],['`password`','`search`','`button`'],'An unknown type falls back to text.');
Q(5,'Input types','Which input type hides the characters typed?',['`password`'],['`secret`','`hidden`','`mask`'],'`hidden` is not shown at all.');
Q(5,'Input types','Which input type creates a one-of-many choice with the same `name`?',['`radio`'],['`checkbox`','`select`','`option`'],'Radios sharing a name are mutually exclusive.');
Q(5,'Input types','Which input type allows zero or more independent choices?',['`checkbox`'],['`radio`','`toggle`','`switch`'],'Each checkbox can be on or off.');
Q(5,'Input types','Which attribute pre-selects a checkbox or radio button?',['`checked`'],['`selected`','`on`','`default`'],'`<input type="checkbox" checked>`');
Q(5,'Input types','Which input types are new in HTML5? (select all that apply)',['`email`','`date`','`range`'],['`text`','`password`'],'Others: number, tel, url, color, search, time, week, month, datetime-local.');
Q(5,'Input types','Which input type shows a slider?',['`range`'],['`slide`','`number`','`slider`'],'`<input type="range" min="0" max="10">`');
Q(5,'Input types','Which input type accepts only numbers and may show up/down arrows?',['`number`'],['`digits`','`numeric`','`integer`'],'Use `min`, `max` and `step`.');
Q(5,'Input types','Which input type shows a color picker?',['`color`'],['`palette`','`colour`','`hex`'],'The value is a hex color string.');
Q(5,'Input types','Which input type shows a calendar date picker?',['`date`'],['`calendar`','`day`','`datepicker`'],'Also `time`, `month`, `week` and `datetime-local`.');
Q(5,'Input types','Which input type is intended for a telephone number?',['`tel`'],['`phone`','`number`','`call`'],'On phones it brings up a numeric keypad.');
Q(5,'Input types','Which input type is intended for a web address and checks the URL format?',['`url`'],['`link`','`web`','`href`'],'`type="url"` checks the format when the form is submitted.');
Q(5,'Input types','Which input type is intended for a web address and brings up an email-friendly keyboard on phones?',['`email`'],['`mail`','`address`','`text`'],'It also checks for an `@` format on submit.');
Q(5,'Input types','Which input type creates a search box?',['`search`'],['`find`','`query`','`lookup`'],'It may show a clear button.');
Q(5,'Input types','Which input type lets the user pick a file?',['`file`'],['`upload`','`attach`','`document`'],'Use `multiple` and `accept` as needed.');
Q(5,'Input types','Which input type creates a button that submits the form?',['`submit`'],['`send`','`post`','`go`'],'`<input type="submit" value="Send">`; `<button type="submit">` also works.');
Q(5,'Input types','Which input type resets all fields to their initial values?',['`reset`'],['`clear`','`undo`','`restart`'],'It does not clear fields that had a starting value.');
Q(5,'Input types','Which input type holds data that the user does not see but is submitted?',['`hidden`'],['`secret`','`password`','`invisible`'],'Never put secrets in hidden fields because users can read the page source.');
Q(5,'Input types','Which input type is a clickable button that does nothing by default (used with JavaScript)?',['`button`'],['`submit`','`reset`','`action`'],'`type="button"` does not submit the form.');
Q(5,'Input types','Which input type shows a button that displays an image to submit the form?',['`image`'],['`picture`','`img`','`graphic`'],'`<input type="image" src="go.png" alt="Go">`');
Q(5,'Form controls','Which element creates a drop-down list?',['`<select>`'],['`<dropdown>`','`<list>`','`<input type="select">`'],'Items are `<option>` elements.');
Q(5,'Form controls','Which element defines one choice inside a `<select>`?',['`<option>`'],['`<choice>`','`<item>`','`<li>`'],'`<option value="1">One<\/option>`');
Q(5,'Form controls','Which element groups related options inside a `<select>`?',['`<optgroup>`'],['`<group>`','`<fieldset>`','`<optset>`'],'`<optgroup label="Fruits">`.');
Q(5,'Form controls','Which attribute allows selecting multiple options in a `<select>`?',['`multiple`'],['`many`','`multi`','`checkbox`'],'`<select multiple>`');
Q(5,'Form controls','Which element creates a multi-line text box?',['`<textarea>`'],['`<input type="textarea">`','`<multiline>`','`<textbox>`'],'Use `rows` and `cols` (or CSS) to size it.');
Q(5,'Form controls','Where does the default content of a `<textarea>` go?',['Between the opening and closing tags'],['In the value attribute','In the placeholder attribute only','In the name attribute'],'`<textarea>Default text<\/textarea>`');
Q(5,'Form controls','Which element creates a clickable button that can contain HTML content?',['`<button>`'],['`<btn>`','`<click>`','`<press>`'],'Unlike `<input type="button">`, it can hold images and formatting.');
Q(5,'Form controls','What is the default type of a `<button>` inside a form?',['`submit`'],['`button`','`reset`','`none`'],'Set `type="button"` to prevent submission.');
Q(5,'Form controls','Which element, with `<datalist>`, offers suggested values for an input?',['`<input list="id">` paired with `<datalist id="id">`'],['`<input suggest>`','`<select list>`','`<input options>`'],'Users can pick a suggestion or type their own.');
Q(5,'Form controls','Which element shows the result of a calculation or script in a form?',['`<output>`'],['`<result>`','`<calc>`','`<display>`'],'`<output name="total"><\/output>`');
Q(5,'Labeling','Which element groups related controls in a form and draws a box around them?',['`<fieldset>`'],['`<formgroup>`','`<group>`','`<box>`'],'It improves organization and accessibility.');
Q(5,'Labeling','Which element provides a caption for a `<fieldset>`?',['`<legend>`'],['`<caption>`','`<title>`','`<label>`'],'`<legend>` must be the first child of `<fieldset>`.');
Q(5,'Labeling','Which element connects a text description to a form control?',['`<label>`'],['`<caption>`','`<text>`','`<name>`'],'Clicking the label focuses the control.');
Q(5,'Labeling','How do you link a `<label>` to an input explicitly?',['Give the label a `for` attribute equal to the input\'s `id`'],['Give the input a `for` attribute','Give both the same `class`','Wrap them in a `<div>`'],'`<label for="email">` and `<input id="email">`.');
Q(5,'Labeling','Which is another way to associate a label with an input?',['Place the input inside the `<label>` element'],['Place the label inside the input','Use the same name attribute','Use `<label rel>`'],'`<label>Name <input name="n"><\/label>`');
Q(5,'Labeling','Why are labels important? (select all that apply)',['Screen readers announce them','Clicking the label focuses the input','They enlarge the click target'],['They validate the input','They encrypt the data'],'Labels aid accessibility and usability.');
Q(5,'Labeling','Is the `placeholder` attribute a good replacement for a `<label>`?',['No, it disappears when typing and is not reliably read by assistive technology'],['Yes, always','Yes, for passwords only','Yes, if the text is short'],'Use a visible label and use placeholder only for hints.');
Q(5,'Global attributes','Which global attribute makes an element\'s content user-editable?',['`contenteditable`'],['`editable`','`edit`','`writeable`'],'`<p contenteditable="true">`');
Q(5,'Global attributes','Which global attribute sets the tab order of focusable elements?',['`tabindex`'],['`taborder`','`tabnum`','`focusorder`'],'`tabindex="0"` places an element in natural order. `-1` removes it from tabbing.');
Q(5,'Global attributes','Which global attribute defines a keyboard shortcut to activate or focus an element?',['`accesskey`'],['`hotkey`','`shortcut`','`key`'],'The modifier keys vary by browser.');
Q(5,'Global attributes','Which global attribute sets the text direction (left-to-right or right-to-left)?',['`dir`'],['`direction`','`flow`','`align`'],'`dir="rtl"` for languages such as Arabic or Hebrew.');
Q(5,'Global attributes','Which global attribute declares the language of an element\'s content?',['`lang`'],['`language`','`locale`','`speak`'],'`<p lang="fr">`');
Q(5,'Global attributes','Which global attribute controls spell checking on editable content?',['`spellcheck`'],['`check`','`proof`','`spell`'],'`spellcheck="true"` or `"false"`.');
Q(5,'Global attributes','Which global attribute stores custom data on an element for scripts?',['`data-*` attributes'],['`custom-*` attributes','`store` attribute','`meta-*` attributes'],'Example: `data-user-id="42"`, read with `el.dataset.userId`.');
Q(5,'Global attributes','Which are global attributes, valid on any HTML element? (select all that apply)',['`id`','`class`','`style`'],['`href`','`src`'],'`href` and `src` apply only to certain elements.');
Q(5,'Global attributes','Which global attribute can mark an element as draggable?',['`draggable`'],['`movable`','`dragging`','`dnd`'],'Part of the HTML5 drag and drop API.');
Q(5,'Global attributes','Which global attribute hides an element and removes it from the layout?',['`hidden`'],['`invisible`','`display`','`collapse`'],'The `hidden` attribute applies `display: none` by default.');
Q(5,'Validation','What does the `required` attribute do?',['Prevents submission if the field is empty'],['Makes the field bold','Hides the field','Fills it with a default'],'The browser shows a message when a required field is empty.');
Q(5,'Validation','Which attributes limit a number input between 1 and 10? (select all that apply)',['`min="1"`','`max="10"`'],['`low="1"`','`high="10"`'],'`step` also controls allowed increments.');
Q(5,'Validation','Which attribute limits the number of characters in a text field?',['`maxlength`'],['`size`','`limit`','`max`'],'`size` only sets the visible width.');
Q(5,'Validation','Which attribute sets a minimum number of characters?',['`minlength`'],['`min`','`size`','`least`'],'`minlength="8"` for a password, for example.');
Q(5,'Validation','Which attribute checks a value against a regular expression?',['`pattern`'],['`regex`','`match`','`format`'],'`<input pattern="[0-9]{5}">` requires 5 digits.');
Q(5,'Validation','What does `pattern="[A-Za-z]{3}"` allow?',['Exactly three letters'],['At least three letters','Three digits','Any text'],'The whole value must match the pattern.');
Q(5,'Validation','Which pattern requires exactly five digits (a US ZIP code)?',['`[0-9]{5}`'],['`[0-9]{1,5}`','`[a-z]{5}`','`\\d*`'],'`{5}` means exactly five.');
Q(5,'Validation','Which attribute disables HTML5 browser validation for a whole form?',['`novalidate`'],['`noverify`','`disablevalidate`','`skipvalidation`'],'`<form novalidate>`; `formnovalidate` on a button does it for that submit.');
Q(5,'Validation','Which attribute adds a title that helps explain the required pattern?',['`title`'],['`hint`','`help`','`about`'],'Many browsers show the title text with the validation message.');
Q(5,'Validation','Which is NOT a reliable way to protect a site on its own?',['Client-side (browser) validation alone'],['Server-side validation','Validating and escaping on the server','Parameterized queries'],'Users can bypass browser checks, so always validate again on the server.');
Q(5,'Validation','Why validate on BOTH the client and the server?',['The client gives fast feedback; the server enforces security'],['The server is faster','They always give different results','Browsers require it'],'Client checks improve usability. Server checks cannot be bypassed.');
Q(5,'Validation','Which CSS pseudo-classes style fields by validation state? (select all that apply)',['`:valid`','`:invalid`','`:required`'],['`:checked-ok`','`:error`'],'Also `:optional`, `:in-range` and `:out-of-range`.');
Q(5,'Validation','Which JavaScript method on a form or input checks whether it passes HTML5 validation?',['`checkValidity()`'],['`isValid()`','`validate()`','`verify()`'],'`form.checkValidity()` returns true or false.');
Q(5,'Validation','Which JavaScript method lets script set a custom validation error message on an input?',['`setCustomValidity()`'],['`setError()`','`customMessage()`','`validity.message()`'],'An empty string clears the error.');
Q(5,'Validation','Which JavaScript event lets you validate before the form is sent?',['`submit`'],['`load`','`focus`','`change` only'],'Call `event.preventDefault()` if validation fails.');
Q(5,'Validation','In a form validation function, what does `return false` from an `onsubmit` handler do?',['Cancels the submission'],['Submits the form','Reloads the page','Clears the fields'],'`<form onsubmit="return check()">`');
Q(5,'Validation','What is wrong with this check for an empty name?',['Nothing, it correctly rejects an empty value'],['It should use `=`','It should use `isNaN`','`value` is not a property'],'`value` is the text in the input. An empty string is falsy.','var name = document.forms["f"]["name"].value;\nif (name == "") {\n  alert("Name must be filled out");\n  return false;\n}');
Q(5,'Validation','Which JavaScript expression reads the text a user typed into `<input id="age">`?',['`document.getElementById("age").value`'],['`document.getElementById("age").text`','`document.getElementById("age").innerHTML`','`document.age.content`'],'`value` holds the field\'s current content.');
Q(5,'Regular expressions','What is a regular expression?',['A pattern used to match text'],['A CSS selector','A type of loop','A server language'],'Used in `pattern` attributes and in JavaScript.');
Q(5,'Regular expressions','What does `^` mean at the start of a regex?',['The match must start at the beginning of the text'],['Not','Any character','Zero or more'],'`$` anchors the end.');
Q(5,'Regular expressions','What does `$` mean at the end of a regex?',['The match must end at the end of the text'],['A dollar sign must follow','Repeat','Optional'],'`^abc$` matches exactly "abc".');
Q(5,'Regular expressions','What does `\\d` match?',['A single digit'],['A single letter','A whitespace','Any character'],'`\\d` is the same as `[0-9]`.');
Q(5,'Regular expressions','What does `\\w` match?',['A letter, digit or underscore'],['Only a letter','A space','Any symbol'],'`\\W` is the opposite.');
Q(5,'Regular expressions','What does `\\s` match?',['A whitespace character'],['A string','A symbol','A digit'],'Spaces, tabs and line breaks.');
Q(5,'Regular expressions','What does `.` match?',['Any single character (except a line break)'],['A literal period only','Zero characters','A digit'],'Escape it as `\\.` to match a literal dot.');
Q(5,'Regular expressions','What does `*` mean in a regex?',['Zero or more of the previous item'],['One or more','Zero or one','Exactly one'],'`a*` matches "", "a", "aaa".');
Q(5,'Regular expressions','What does `+` mean in a regex?',['One or more of the previous item'],['Zero or more','Zero or one','Exactly two'],'`a+` needs at least one a.');
Q(5,'Regular expressions','What does `?` mean in a regex?',['Zero or one of the previous item (optional)'],['One or more','Any character','End of text'],'`colou?r` matches color and colour.');
Q(5,'Regular expressions','What does `{3}` mean in a regex?',['Exactly three of the previous item'],['At most three','At least three','Three different items'],'`{2,4}` means two to four.');
Q(5,'Regular expressions','What does `[abc]` match?',['One character that is a, b or c'],['The text "abc"','Any character but a, b or c','Zero or more of them'],'Square brackets define a character class.');
Q(5,'Regular expressions','What does `[^abc]` match?',['One character that is NOT a, b or c'],['The start of text then a, b or c','The text "^abc"','Anything'],'`^` inside brackets negates the class.');
Q(5,'Regular expressions','What does `[A-Z]` match?',['One uppercase letter'],['The letters A and Z only','One lowercase letter','One digit'],'A range inside brackets.');
Q(5,'Regular expressions','What does the `|` do in a regex?',['Alternation: matches either the left or the right part'],['Escapes a character','Groups items','Repeats'],'`cat|dog` matches cat or dog.');
Q(5,'Regular expressions','Which regex matches a simple 3-digit area code followed by a dash and 4 digits, for example 555-1234?',['`^\\d{3}-\\d{4}$`'],['`^\\d{3,4}$`','`^\\w{7}$`','`^[0-9]{3}[0-9]{4}$`'],'The dash is a literal and the anchors force a full match.');
Q(5,'Regular expressions','Which JavaScript method tests whether a string matches a regex and returns true or false?',['`regex.test(string)`'],['`regex.find(string)`','`regex.match(string)` returns a boolean','`string.has(regex)`'],'`/^\\d+$/.test("123")` is true. `string.match()` returns the matches or null.');
Q(5,'Regular expressions','How is a regex literal written in JavaScript?',['Between forward slashes, like `/abc/`'],['Between quotes only like `"abc"`','Between angle brackets like `<abc>`','Between hashes like `#abc#`'],'Flags go after the closing slash, for example `/abc/i`.');
Q(5,'Regular expressions','What does the `i` flag do in `/hello/i`?',['Makes the match case-insensitive'],['Ignores spaces','Matches only once','Inverts the match'],'`g` is global (find all matches).');
Q(5,'Regular expressions','Which HTML5 pattern would accept a lowercase username of 4 to 12 letters or digits?',['`[a-z0-9]{4,12}`'],['`[a-z0-9]{4-12}`','`[a-z0-9]*4,12`','`[a-z0-9]+{4,12}`'],'`{min,max}` is the repetition syntax.');
Q(5,'Cross-browser','What is cross-browser compatibility?',['A page working consistently across different browsers and versions'],['Using one browser only','Speed of the server','A CSS color feature'],'Browsers may support features differently.');
Q(5,'Cross-browser','Which resource helps check whether a browser supports a given feature?',['caniuse.com'],['w3.org/validate only','wikipedia.org','google.com/maps'],'"Can I use" tracks browser support for web technologies.');
Q(5,'Cross-browser','What does a CSS vendor prefix such as `-webkit-` or `-moz-` indicate?',['A browser-specific implementation of an experimental feature'],['A color','A shortcut to a file','A comment'],'`-webkit-` (Chrome, Safari), `-moz-` (Firefox), `-ms-` (old Edge/IE), `-o-` (old Opera).');
Q(5,'Cross-browser','Which prefix targets Firefox?',['`-moz-`'],['`-webkit-`','`-ms-`','`-o-`'],'Moz stands for Mozilla.');
Q(5,'Cross-browser','Which prefix is used by Chrome and Safari?',['`-webkit-`'],['`-moz-`','`-ms-`','`-chrome-`'],'WebKit-based browsers use it.');
Q(5,'Cross-browser','What is a good practice when a feature is not supported by a browser?',['Provide a fallback or graceful degradation'],['Ignore those users','Block the browser','Remove all CSS'],'Progressive enhancement starts from a basic working version and adds features.');
Q(5,'Cross-browser','What is progressive enhancement?',['Starting with basic content that works everywhere and adding advanced features for capable browsers'],['Making the page slower in older browsers','Only supporting new browsers','Adding Flash'],'The opposite of building for only the newest browsers.');
Q(5,'Cross-browser','What does a polyfill do?',['Adds a missing feature to older browsers using JavaScript'],['Removes errors','Compresses images','Encrypts data'],'It lets you use a modern API while supporting older browsers.');
Q(5,'Cross-browser','Which approach is recommended to adapt to browser differences?',['Feature detection'],['Browser sniffing by user-agent only','Ignoring differences','Testing only in one browser'],'Check whether a feature exists rather than guessing from the browser name.');
Q(5,'Cross-browser','Which statement is true about HTML5 input types like `date` in older browsers that do not support them?',['They fall back to a plain text input'],['They crash the page','They are removed from the page','They become a button'],'Unknown types are treated as `text`.');
Q(5,'Cross-browser','Why test pages in several browsers and devices?',['Rendering and feature support can differ'],['All browsers render identically','Only one browser matters','Testing is only for servers'],'Test at least Chrome, Firefox, Safari and Edge.');
Q(5,'Submitting','Which HTTP method is best for a login form?',['POST'],['GET','HEAD','TRACE'],'POST keeps the credentials out of the URL. HTTPS is also needed.');
Q(5,'Submitting','Which HTTP method is best for a search form whose results should be bookmarkable?',['GET'],['POST','PUT','DELETE'],'The search terms appear in the URL.');
Q(5,'Submitting','What does the browser send for a GET form with `name="q"` and the user types "css"?',['The URL has `?q=css` added to the action address'],['The body contains `q=css` only','Nothing','A cookie named q'],'Query string: `action?name=value&name2=value2`.');
Q(5,'Submitting','Which characters separate multiple name/value pairs in a query string?',['`&`'],['`;`','`,`','`+`'],'`?first=Ann&last=Lee`');
Q(5,'Submitting','Which character starts a query string in a URL?',['`?`'],['`&`','`#`','`/`'],'The `#` starts the fragment.');
Q(5,'Submitting','What encoding turns a space into `%20` or `+` in form data?',['URL (percent) encoding'],['Base64','Unicode escape','Gzip'],'Special characters are encoded so they travel safely in a URL.');
Q(5,'Submitting','Which element is the standard way to give users a button that sends the form?',['`<button type="submit">` or `<input type="submit">`'],['`<input type="send">`','`<a submit>`','`<form submit>`'],'Both submit the form.');
Q(5,'Submitting','Which method submits a form from JavaScript?',['`form.submit()`'],['`form.send()`','`form.post()`','`form.go()`'],'Note: `submit()` does not trigger the `submit` event or validation. `requestSubmit()` does.');
Q(5,'Submitting','Which attribute on a submit button can send the form to a different URL?',['`formaction`'],['`action`','`url`','`target`'],'`<button formaction="/draft">Save draft<\/button>`');
Q(5,'Submitting','Why should you use HTTPS for a form that collects sensitive data?',['It encrypts the data in transit'],['It makes validation unnecessary','It makes the form faster','It hides the form code'],'POST alone does not encrypt data.');
Q(5,'Submitting','What kind of program typically receives and processes a submitted form?',['A server-side script or application'],['A CSS file','An image','A web font'],'Examples: PHP, Python, Node.js, ASP.NET.');
Q(5,'Submitting','Which HTML control is NOT submitted with the form?',['A control without a `name` attribute'],['A text input with a name','A checked checkbox with a name','A selected option'],'Also, unchecked checkboxes and disabled controls are not sent.');
Q(5,'Submitting','What is submitted for a checkbox with no `value` attribute that is checked?',['`on`'],['`true`','`1`','Nothing'],'The default value is `on`.');
Q(5,'Submitting','Which attribute prevents a field from being edited but still submits it?',['`readonly`'],['`disabled`','`locked`','`frozen`'],'`disabled` fields are not submitted.');
Q(5,'Submitting','Which attribute prevents a field from being used and from being submitted?',['`disabled`'],['`readonly`','`hidden`','`frozen`'],'Disabled controls are greyed out.');
Q(5,'Submitting','Which attribute focuses a field automatically when the page loads?',['`autofocus`'],['`focus`','`autostart`','`first`'],'Use it on only one element per page.');
Q(5,'Submitting','Which attribute helps browsers fill a field with saved information, for example `autocomplete="email"`?',['`autocomplete`'],['`autofill`','`remember`','`prefill`'],'`autocomplete="off"` disables suggestions.');

// ===== Unit 6: Designing for Mobile Devices =====
Q(6,'Responsive design','Who coined the term "responsive web design"?',['Ethan Marcotte'],['Tim Berners-Lee','Jeffrey Zeldman','Brendan Eich'],'He described it in an article in 2010.');
Q(6,'Responsive design','What are the three core ingredients of responsive web design? (select all that apply)',['Fluid (flexible) grids','Flexible images and media','Media queries'],['Frames','Flash animations'],'These make one layout work across sizes.');
Q(6,'Responsive design','What is a mobile-first approach?',['Designing for small screens first, then adding enhancements for larger screens'],['Designing only for phones','Designing for desktops first','Ignoring tablets'],'Use `min-width` media queries to add layout as the screen grows.');
Q(6,'Responsive design','Which is a benefit of mobile-first design?',['It forces focus on essential content and performance'],['It removes the need for CSS','It guarantees top search rankings','It works without HTML'],'Starting small keeps the base page light.');
Q(6,'Responsive design','What is the difference between a mobile website, a mobile app and responsive design?',['A mobile site is a separate site for phones; an app is installed software; responsive design adapts one site to all devices'],['They are all the same thing','An app runs only in a browser','A responsive site must be installed from an app store'],'Responsive design is one codebase for every screen size.');
Q(6,'Responsive design','Which is an advantage of responsive design over a separate mobile site?',['One URL and one codebase to maintain'],['It needs no testing','It never needs images','It only works on desktops'],'A single URL is also better for sharing and search.');
Q(6,'Responsive design','Which is a typical advantage of a native mobile APP over a responsive website?',['Deeper access to device features and offline use'],['No installation is needed','It works on any browser','It is cheaper to build for all platforms'],'Apps are installed through a store and can use hardware features directly.');
Q(6,'Viewport','What does the viewport meta tag do?',['Controls how the page is sized and scaled on a mobile device'],['Sets the page title','Loads a stylesheet','Sets the language'],'Without it, phones often render the page at about 980px wide and shrink it.');
Q(6,'Viewport','Which is the standard viewport meta tag?',['`<meta name="viewport" content="width=device-width, initial-scale=1.0">`'],['`<meta name="viewport" content="width=1000, scale=0">`','`<meta viewport="device-width">`','`<viewport width="device">`'],'It goes in the `<head>`.');
Q(6,'Viewport','What does `width=device-width` mean?',['The page width matches the screen width of the device'],['The page is exactly 1000px','The width is half the screen','The page ignores the screen'],'It makes CSS pixels follow the device width.');
Q(6,'Viewport','What does `initial-scale=1.0` do?',['Sets the initial zoom level to 100%'],['Doubles the text','Hides the page','Locks scrolling'],'It sets the relationship between CSS pixels and device-independent pixels.');
Q(6,'Viewport','Why is `user-scalable=no` discouraged?',['It prevents users who need zoom from enlarging the page'],['It breaks the doctype','It slows the page','It is not valid HTML'],'Accessibility guidelines say not to block zooming.');
Q(6,'Viewport','What is the "viewport"?',['The visible area of the page in the browser window or screen'],['The whole web page including hidden parts','The server','The page title'],'On mobile it can differ from the layout viewport.');
Q(6,'Viewport','Which CSS unit equals 1% of the viewport height?',['`vh`'],['`vw`','`em`','`%` of the parent only'],'`100vh` is the full height of the viewport.');
Q(6,'Viewport','Which CSS unit equals 1% of the viewport width?',['`vw`'],['`vh`','`rem`','`pt`'],'`50vw` is half the viewport width.');
Q(6,'Media queries','What does a CSS media query do?',['Applies styles only when conditions like screen width are met'],['Plays a media file','Queries a database','Loads a video'],'`@media (max-width: 600px) { ... }`');
Q(6,'Media queries','When do the styles inside `@media (max-width: 600px)` apply?',['When the viewport is 600px wide or narrower'],['When the viewport is 600px wide or wider','Only at exactly 600px','Never'],'`max-width` is an upper limit.');
Q(6,'Media queries','When do the styles inside `@media (min-width: 768px)` apply?',['When the viewport is 768px wide or wider'],['When the viewport is 768px wide or narrower','Only on tablets','Only on phones'],'`min-width` is a lower limit.');
Q(6,'Media queries','Which media query targets landscape orientation?',['`@media (orientation: landscape)`'],['`@media (rotate: wide)`','`@media (screen: landscape)`','`@media (landscape)`'],'The other value is `portrait`.');
Q(6,'Media queries','Which media query applies only to printing?',['`@media print`'],['`@media paper`','`@media (print: true)`','`@media output`'],'It is used for print stylesheets.');
Q(6,'Media queries','Which keyword in a media query combines two conditions that must both be true?',['`and`'],['`or`','`with`','`both`'],'`@media (min-width: 600px) and (max-width: 900px)`');
Q(6,'Media queries','Which separator lets either of two media queries apply (logical OR)?',['A comma'],['The word `or`','A plus sign','A semicolon'],'`@media (max-width: 400px), (orientation: portrait)`');
Q(6,'Media queries','Which media feature detects a high-density (retina) screen?',['`min-resolution` (or `-webkit-min-device-pixel-ratio`)'],['`dpi-high`','`screen-sharp`','`pixel-density: high`'],'Used to serve higher resolution images.');
Q(6,'Media queries','Which HTML attribute loads a stylesheet only when a media condition is met?',['`media` on `<link>`'],['`query`','`when`','`device`'],'`<link rel="stylesheet" href="small.css" media="(max-width: 600px)">`');
Q(6,'Media queries','What is a "breakpoint"?',['A viewport width at which the layout changes'],['A bug in the CSS','A page error','A video pause point'],'Common breakpoints are near 480px, 768px and 1024px, but content should drive them.');
Q(6,'Media queries','What does this CSS do on a narrow screen?',['Stacks the two columns on top of each other'],['Hides all content','Makes the columns wider','Does nothing'],'The columns are floats or flex items that become full width.','.col { width: 50%; float: left; }\n@media (max-width: 600px) {\n  .col { width: 100%; float: none; }\n}');
Q(6,'Media queries','Which is the usual position of media query rules in a stylesheet?',['After the base rules they override'],['Before everything','In the HTML only','Inside comments'],'Later rules win at equal specificity.');
Q(6,'Fluid layout','What is a fluid (flexible) layout?',['A layout using relative units like percentages so it scales with the window'],['A layout fixed at 960px','A layout made of images','A layout that animates'],'Percent widths adapt to the container.');
Q(6,'Fluid layout','Which unit makes a layout fluid?',['`%`'],['`px`','`pt`','`cm`'],'Fixed units like px do not scale with the window.');
Q(6,'Fluid layout','Which CSS keeps an image from becoming wider than its container?',['`max-width: 100%;`'],['`min-width: 100%;`','`width: 1000px;`','`overflow: scroll;`'],'Add `height: auto` to keep proportions.');
Q(6,'Fluid layout','What does `height: auto;` do for a responsive image?',['Keeps the aspect ratio as the width changes'],['Hides the image','Sets the height to 0','Stretches it'],'Pair it with `max-width: 100%`.');
Q(6,'Fluid layout','Which `<img>` attributes let the browser choose an image file for the screen width?',['`srcset` and `sizes`'],['`media` and `query`','`device` and `size`','`responsive` and `scale`'],'The browser picks the best candidate.');
Q(6,'Fluid layout','Which element lets you provide different images for different media conditions (art direction)?',['`<picture>`'],['`<figure>`','`<media>`','`<canvas>`'],'`<source media="(min-width: 800px)" srcset="wide.jpg">` inside `<picture>`.');
Q(6,'Fluid layout','How can you make an embedded video scale down on small screens?',['`max-width: 100%; height: auto;`'],['`width: 1200px;`','`position: fixed;`','`display: none;`'],'Responsive video is scaled like images.');
Q(6,'Fluid layout','Which CSS function picks a value between a minimum and maximum, useful for fluid type?',['`clamp()`'],['`fit()`','`range()`','`between()`'],'`font-size: clamp(1rem, 2.5vw, 2rem);`');
Q(6,'Fluid layout','Which CSS unit is relative to the user\'s root font size and good for scalable layouts?',['`rem`'],['`px`','`mm`','`pc`'],'`1rem` equals the root font size, usually 16px.');
Q(6,'Grid view','What is a grid-based layout?',['A layout that places content in columns and rows based on a grid'],['A layout made of tables only','A random layout','A single column'],'A responsive grid view often has 12 columns.');
Q(6,'Grid view','In a typical 12-column responsive grid, what width is a column that spans 6 columns?',['50%'],['25%','75%','6%'],'6 of 12 is half. Width = columns / 12 × 100%.');
Q(6,'Grid view','What width is a column spanning 4 of 12 columns?',['33.33%'],['25%','50%','40%'],'4 / 12 = one third.');
Q(6,'Grid view','What width is a column spanning 3 of 12 columns?',['25%'],['33.33%','30%','12.5%'],'3 / 12 = one quarter.');
Q(6,'Grid view','Which property makes padding and border count inside the width, simplifying grid math?',['`box-sizing: border-box;`'],['`box-sizing: content-box;`','`grid-sizing: border;`','`width: fit;`'],'Common reset: `* { box-sizing: border-box; }`');
Q(6,'Grid view','Which CSS property creates a CSS Grid layout container?',['`display: grid;`'],['`grid: true;`','`layout: grid;`','`position: grid;`'],'Then use `grid-template-columns`.');
Q(6,'Grid view','What does `grid-template-columns: repeat(3, 1fr);` create?',['Three equal-width columns'],['Three rows','One column three times as wide','A 1px grid'],'`fr` is a fraction of the available space.');
Q(6,'Grid view','What does `fr` stand for in CSS Grid?',['Fraction of the available space'],['Frame','Fixed ratio','Fill row'],'`1fr 2fr` gives the second column twice the space of the first.');
Q(6,'Grid view','Which function creates as many columns as fit, a responsive grid with no media queries?',['`repeat(auto-fit, minmax(200px, 1fr))`'],['`repeat(auto, 200px)`','`grid(fit, 200px)`','`columns(auto-fit)`'],'Columns are at least 200px and share the extra space.');
Q(6,'Grid view','Which property sets the space between grid or flex items?',['`gap`'],['`space`','`spacing`','`gutter-size`'],'`gap: 16px;` works in grid and flexbox.');
Q(6,'Flexbox','Which CSS makes flex items wrap onto new lines when they run out of room?',['`flex-wrap: wrap;`'],['`flex-flow: none;`','`wrap: true;`','`display: wrap;`'],'The default is `nowrap`.');
Q(6,'Flexbox','What does `flex: 1;` on an item do?',['Lets it grow to share the remaining space equally'],['Hides it','Fixes it at 1px','Reverses its order'],'It is a shorthand for grow, shrink and basis.');
Q(6,'Flexbox','In a row flex container, which property centers items vertically?',['`align-items: center;`'],['`justify-content: center;`','`text-align: center;`','`vertical-align: all;`'],'`align-items` works on the cross axis.');
Q(6,'Flexbox','Which layout approach is best for a one-dimensional row or column of items?',['Flexbox'],['CSS Grid only','Tables','Frames'],'Grid is for two dimensions.');
Q(6,'Frameworks','What is a CSS framework?',['A prebuilt library of CSS (and sometimes JavaScript) for layouts and components'],['A browser plugin','A server','An image format'],'Examples: Bootstrap, Foundation, Tailwind CSS.');
Q(6,'Frameworks','Which is a popular responsive, mobile-first CSS framework?',['Bootstrap'],['jQuery','Photoshop','Apache'],'Bootstrap provides a grid and ready-made components.');
Q(6,'Frameworks','What is an advantage of using a framework such as Bootstrap?',['Tested, consistent responsive components save development time'],['It removes the need for HTML','It makes pages smaller always','It needs no learning'],'The downside can be extra weight and a generic look.');
Q(6,'Frameworks','What does a CSS reset or normalize stylesheet do?',['Reduces browser default style differences'],['Deletes all CSS','Compresses images','Validates the page'],'It helps consistency across browsers.');
Q(6,'Mobile design','Which is a key consideration for touch interfaces?',['Touch targets must be large enough and spaced apart'],['Make links as small as possible','Rely on hover menus','Use tiny fonts'],'A common minimum is about 44 by 44 pixels (or 48 dp).');
Q(6,'Mobile design','Why is relying on `:hover` a problem on mobile?',['Touch screens have no true hover state'],['Phones cannot show colors','Hover is not valid CSS','It uses too much memory'],'Important actions must not depend on hover.');
Q(6,'Mobile design','Which is a good practice for mobile page performance? (select all that apply)',['Compress and resize images','Minimize the number of requests','Minify CSS and JavaScript'],['Use very large images and scale them down in CSS','Load every script in the head'],'Mobile connections can be slow and limited.');
Q(6,'Mobile design','Which input attribute helps show the right keyboard on a phone?',['`type` (such as `email`, `tel` or `number`)'],['`keyboard`','`device`','`phone`'],'Specific types bring up tailored keyboards.');
Q(6,'Mobile design','Which is a common mobile navigation pattern for limited space?',['A collapsed "hamburger" menu'],['A 20-item always-visible bar','A hover mega menu','A table of links'],'It reveals the menu on tap.');
Q(6,'Mobile design','Which is a good approach to text on a mobile page?',['Readable font size (at least about 16px) with enough line spacing'],['Very small text to fit more','All capitals','Justified tiny text'],'Avoid forcing users to zoom to read.');
Q(6,'Mobile design','What should be avoided on mobile because it is not supported on most devices?',['Flash content and plugins'],['Responsive images','Media queries','Semantic HTML'],'Mobile browsers do not support Flash.');
Q(6,'Mobile design','Which is a typical difference between mobile and desktop users?',['Mobile users often have smaller screens, touch input and slower connections'],['Mobile users always have faster connections','Mobile users use mice','There are no differences'],'Design with these constraints in mind.');
Q(6,'Mobile design','Which is true about `position: fixed` headers on small screens?',['They can take up too much of the limited screen space'],['They are required','They are not supported','They always improve usability'],'Test fixed elements carefully on phones.');
Q(6,'Mobile design','Which is a way to save space by letting users show or hide content?',['Collapsible sections (accordions)'],['Larger images','More columns','Longer paragraphs'],'Accordions keep a page short.');
Q(6,'Mobile design','Which are types of mobile web design approaches? (select all that apply)',['Responsive design','Adaptive design','A separate mobile site'],['Flash design','Table-based design'],'Adaptive design serves fixed layouts for certain screen sizes.');
Q(6,'Mobile design','What is adaptive web design?',['Using several fixed layouts and picking the one that matches the device'],['One fluid layout that stretches','A design with no CSS','Designing in Flash'],'Responsive design is fluid. Adaptive uses distinct layouts at set sizes.');
Q(6,'Testing','Which is the best way to test a mobile page?',['On real devices as well as emulators'],['Only on your desktop browser at full size','Never, because CSS handles it','Only in one browser'],'Emulation is a good start but real devices find real problems.');
Q(6,'Testing','Which browser tool simulates mobile screen sizes?',['Device mode in the developer tools'],['The bookmarks bar','The history page','The downloads page'],'Chrome, Firefox and Safari all include one.');
Q(6,'Testing','What is a simple way to see how a layout responds without a device?',['Resize the browser window'],['Print the page','Change the title','Disable CSS'],'Watch the layout at breakpoints.');
Q(6,'Testing','What is mobiReady?',['A tool that tests how well a page is built for mobile devices'],['A CSS framework','A phone brand','A photo editor'],'It gave a score and report on mobile best practices.');
Q(6,'Testing','What does the W3C mobileOK checker (and mobiReady-style tools) evaluate?',['How well a page follows mobile web best practices'],['Server speed only','The page\'s keywords','Copyright status'],'These tools check size, markup, images and usability on mobile.');
Q(6,'Testing','Which free Google tool reports on page performance and mobile usability?',['Lighthouse (PageSpeed Insights)'],['Microsoft Paint','Notepad','FTP client'],'Lighthouse is built into Chrome DevTools.');
Q(6,'Testing','Which should be validated for a mobile page as well as a desktop page?',['The HTML and CSS'],['Only the images','Nothing','Only the title'],'The W3C Markup Validation Service works for any page.');
Q(6,'Testing','What does the W3C CSS Validation Service check?',['CSS for syntax and standards errors'],['HTML structure','Image sizes','Server speed'],'There is a separate service for HTML.');
Q(6,'Testing','Which device features should you test on mobile? (select all that apply)',['Portrait and landscape orientation','Touch interaction','Different screen sizes'],['Only the mouse wheel','Only print preview'],'Orientation changes can break layouts.');
Q(6,'Testing','Why test on a slow network connection?',['Many mobile users have slow or limited connections'],['Networks do not matter','Phones are always on fast networks','Only for desktop'],'Browser tools can throttle the connection.');
Q(6,'Testing','What is a favicon (and touch icon) used for?',['A small icon that represents the site in tabs, bookmarks and home screens'],['A server setting','A video thumbnail','A font'],'Specified with `<link rel="icon">`.');

// ===== Added to cover every learning objective listed for the course =====
Q(1,'Standards','Which organization publishes the web standards for HTML and CSS as W3C Recommendations?',['The World Wide Web Consortium (W3C)'],['The Internet Engineering Task Force only','Microsoft','The International Olympic Committee'],'The W3C, founded by Tim Berners-Lee, develops web standards. The WHATWG maintains the HTML Living Standard.');
Q(1,'Standards','Who is credited with inventing the World Wide Web and HTML?',['Tim Berners-Lee'],['Brendan Eich','Bill Gates','Steve Jobs'],'He proposed the web and wrote the first HTML at CERN around 1989 to 1991.');
Q(1,'Standards','Why is a universal (standardized) markup language important?',['Any browser or device can interpret the same document consistently'],['It makes every page look identical','It removes the need for CSS','It speeds up the user\'s internet connection'],'Standards keep pages working across browsers, platforms and devices.');
Q(1,'Standards','What is one difference between HTML5 and XHTML syntax rules?',['HTML5 is more forgiving and does not need strict XML syntax like quoted attributes and closed empty tags'],['HTML5 requires every tag to be uppercase','HTML5 cannot use CSS','HTML5 only works in Internet Explorer'],'XHTML required well-formed XML. HTML5 allows looser syntax, though clean markup is still best.');
Q(1,'Standards','Which describes the history of HTML?',['HTML 4.01, then XHTML, then HTML5'],['HTML5, then HTML 4.01, then XHTML','XHTML, then HTML5, then HTML 2','HTML 2, then HTML5, then HTML 3.2'],'HTML5 became a W3C Recommendation in 2014.');
Q(1,'Standards','Which are common elements of HTML5 APIs? (select all that apply)',['They are exposed to JavaScript','They are built into the browser','They add features such as drawing, location and drag and drop'],['They require a browser plugin like Flash','They run only on the web server'],'HTML5 APIs are scripted features the browser provides without plugins.');
Q(1,'Platforms','Which tools can package an HTML, CSS and JavaScript app as a native mobile app?',['Apache Cordova (PhoneGap)'],['Adobe Flash Player','W3C Validator','jQuery UI'],'Cordova wraps a web app in a native shell for iOS, Android and other platforms.');
Q(1,'Platforms','Which is a benefit of building an app with HTML5 skills instead of separate native code for each platform?',['One codebase can run on many devices'],['It always runs faster than native code','It needs no testing','It has full access to every device feature with no extra tools'],'Reuse is the main advantage. Native apps can still be faster or reach more device features.');
Q(1,'Platforms','Which kinds of devices can display pages built with HTML5? (select all that apply)',['Desktop computers','Smartphones and tablets','Smart TVs'],['Only desktop browsers','Only devices with Flash'],'HTML5 targets traditional and non-traditional delivery platforms.');
Q(1,'Trifecta','Which statement about the relationship between HTML, CSS and JavaScript is true?',['They work together, each with its own job: structure, presentation and behavior'],['CSS creates the structure and HTML creates behavior','JavaScript replaces both HTML and CSS','They cannot be used on the same page'],'Keeping the three separate makes pages easier to maintain.');
Q(1,'Multimedia','Which attribute makes a `<video>` play without sound so it is allowed to autoplay in most browsers?',['`muted`'],['`silent`','`nosound`','`volume="0"`'],'Browsers usually only autoplay media that is muted.');
Q(1,'Multimedia','Which attribute on `<video>` sets its displayed size? (select all that apply)',['`width`','`height`'],['`size`','`scale`'],'Both attributes accept pixel values.');
Q(1,'Multimedia','What does `preload="none"` tell the browser about a `<video>`?',['Do not download the video until the user starts it'],['Never play the video','Delete the video after playing','Download the whole file immediately'],'Other values are `metadata` and `auto`.');
Q(1,'Validation','Which is the correct order of the steps to validate HTML with the W3C Markup Validation Service?',['Open the validator, choose URL, file upload or direct input, run the check, read the errors and warnings, fix them and revalidate'],['Fix the errors, then open the validator','Run the check, then choose the input method','Upload the page, then delete all warnings'],'You supply the document, check it, review the results and fix the code. Then run it again.');
Q(1,'Validation','What are the three ways to submit a document to the W3C Markup Validation Service? (select all that apply)',['Validate by URI','Validate by file upload','Validate by direct input'],['Validate by phone call','Validate by email attachment only'],'You give it a web address, upload a file, or paste the markup.');
Q(1,'Validation','When you validate a page with many errors, why should you fix the first errors first and revalidate?',['One mistake, like a missing closing tag, can cause many later errors'],['Later errors are always more important','The validator only shows the first error','Errors are fixed automatically'],'Fixing early errors often clears a long list of follow-on errors.');
Q(1,'Validation','What is the practical value of validating code? (select all that apply)',['Finds errors that cause unpredictable rendering','Helps accessibility and consistency across browsers','Makes the code easier to maintain'],['Guarantees the page will rank first in search results','Makes the page load faster automatically'],'Validation checks syntax and standards. It does not guarantee ranking or speed.');
Q(2,'Style guides','What is a style guide?',['A set of rules for the look, writing and code conventions a site or team follows'],['A list of browsers','A CSS framework file','A kind of image format'],'It covers things like colors, fonts, spacing, naming and code formatting.');
Q(2,'Style guides','Why use a style guide when designing a site? (select all that apply)',['Keeps the look consistent across pages','Helps teams work together','Makes later changes easier'],['Removes the need for CSS','Makes every site look the same as every other site'],'Consistency and teamwork are the main goals.');
Q(2,'Style guides','Which belongs in a design style guide? (select all that apply)',['Brand colors','Font choices','Logo usage rules'],['The database password','The visitor\'s IP address'],'A style guide records brand and layout decisions.');
Q(2,'Style guides','Which is a coding style guide convention?',['A consistent naming scheme for classes and ids, such as lowercase with hyphens'],['Using a different naming style on each page','Using only inline styles','Never adding comments'],'Conventions like `main-nav` keep CSS readable.');
Q(2,'CSS3','Which are new features added in CSS3? (select all that apply)',['`border-radius`','`box-shadow`','Transitions and animations'],['`<table>` layouts','The `<font>` tag'],'CSS3 added rounded corners, shadows, gradients, transforms, transitions, animations and more.');
Q(2,'CSS3','Which CSS3 property splits text into newspaper-style columns?',['`column-count`'],['`text-columns`','`split`','`newspaper`'],'`column-count: 3;` flows content into three columns. `column-gap` sets the space between.');
Q(2,'CSS3','Which CSS3 feature lets you use multiple background images on one element?',['A comma-separated list in `background-image`'],['Several `background` tags','The `layer` property','It is not possible'],'`background-image: url(a.png), url(b.png);`');
Q(2,'CSS3','Which CSS function performs a calculation to set a value, such as `calc(100% - 20px)`?',['`calc()`'],['`math()`','`compute()`','`sum()`'],'It can mix units.');
Q(2,'CSS3','Which CSS3 selector picks every second list item?',['`li:nth-child(2n)` (or `li:nth-child(even)`)'],['`li:second`','`li:every(2)`','`li[2]`'],'`:nth-child()` accepts numbers, `odd`, `even` or formulas.');

<script>

  window.__appReady = false;
  window.addEventListener('error', function (e) {
    if (window.__appReady) return;
    var h = document.getElementById('app');

<script>
// ============================================================
// C777 Web Development Drill: app logic
// ============================================================
const UNITS = {
  1: 'HTML Essentials', 2: 'CSS3 Techniques', 3: 'JavaScript',
  4: 'HTML APIs', 5: 'Forms & Validation', 6: 'Mobile Design'
};
const WEAK_MASTERED_STREAK = 3;
const WEAK_SET_SIZE = 25;
const SECONDS_PER_QUESTION = 72;

function hashText(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
}
QS.forEach(function (q) { q.id = 'u' + q.u + '-' + hashText(q.s + '|' + q.c[0]); });
const BY_ID = {};
QS.forEach(function (q) { BY_ID[q.id] = q; });

var state = {
  screen: 'home',
  unit: 'ALL',
  count: 20,
  shuffle: true,
  examMode: false,
  timed: false,
  timeLeft: 0,
  queue: [],
  idx: 0,
  order: [],
  sel: [],
  checked: false,
  results: [],
  title: '',
  browseUnit: 'ALL',
  browseSearch: ''
};
const WEAK = { v: 1, q: {} };
var clockHandle = null;
var weakTimer = null;

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
// Backtick pairs in a question or explanation become inline code.
function rich(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function shuffleArr(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function choicesOf(q) { return q.c.concat(q.w); }
function isRight(q, idx) { return idx < q.c.length; }
function fmt(sec) { sec = Math.max(0, sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

// ---------- what the reader has missed (kept by the popup, apart from saved progress) ----------
function weakRecord(id, correct) {
  let e = WEAK.q[id];
  if (!e) { if (Object.keys(WEAK.q).length >= 4000) return; e = WEAK.q[id] = { s: 0, m: 0, c: 0, d: 0 }; }
  e.s++;
  if (correct) e.c++; else { e.m++; e.c = 0; }
  e.d = Math.floor(Date.now() / 86400000);
  if (weakTimer) clearTimeout(weakTimer);
  weakTimer = setTimeout(weakPost, 600);
}
function weakPost() {
  weakTimer = null;
  if (window.parent === window) return;
  try { window.parent.postMessage({ study: 'weak-save', data: WEAK }, '*'); } catch (e) { /* not essential */ }
}
function weakRestore(data) {
  const out = {};
  if (data && typeof data === 'object' && data.v === 1 && data.q && typeof data.q === 'object' && !Array.isArray(data.q)) {
    Object.keys(data.q).forEach(function (k) {
      if (!BY_ID[k]) return;
      const e = data.q[k];
      if (!e || typeof e !== 'object') return;
      const s = Math.floor(Number(e.s)), m = Math.floor(Number(e.m)), c = Math.floor(Number(e.c)), d = Math.floor(Number(e.d));
      if (![s, m, c, d].every(Number.isFinite) || s < 1 || s > 100000 || m < 0 || m > s || c < 0 || c > s || d < 0) return;
      out[k] = { s: s, m: m, c: c, d: d };
    });
  }
  WEAK.q = out;
  if (state.screen === 'home') render();
}
function isWeak(e) { return e.m > 0 && e.c < WEAK_MASTERED_STREAK; }
function weakScore(e) { return e.m / e.s + (e.c === 0 ? 0.35 : 0) - e.c * 0.1; }
function weakIds() {
  return Object.keys(WEAK.q).filter(function (k) { return isWeak(WEAK.q[k]); })
    .sort(function (a, b) { return weakScore(WEAK.q[b]) - weakScore(WEAK.q[a]); });
}
function unitStats(u) {
  const ids = QS.filter(function (q) { return u === 'ALL' || q.u === u; });
  let seen = 0, good = 0;
  ids.forEach(function (q) { const e = WEAK.q[q.id]; if (e) { seen++; if (e.c >= WEAK_MASTERED_STREAK || (e.m === 0 && e.s >= 1)) good++; } });
  return { total: ids.length, seen: seen, good: good };
}

// ---------- starting and running a quiz ----------
function stopClock() { if (clockHandle) { clearInterval(clockHandle); clockHandle = null; } }
function startClock() {
  stopClock();
  clockHandle = setInterval(function () {
    state.timeLeft--;
    if (state.timeLeft <= 0) { state.timeLeft = 0; stopClock(); finish(); return; }
    const el = document.getElementById('clock');
    if (el) el.textContent = fmt(state.timeLeft);
  }, 1000);
}
function startQuiz(ids, title) {
  if (!ids.length) return;
  state.queue = ids;
  state.title = title;
  state.idx = 0;
  state.results = [];
  state.screen = 'quiz';
  prepare();
  if (state.timed) { state.timeLeft = Math.round(ids.length * SECONDS_PER_QUESTION); startClock(); }
  render(); window.scrollTo(0, 0);
}
function pool() { return QS.filter(function (q) { return state.unit === 'ALL' || q.u === Number(state.unit); }); }
function pickFrom(list) {
  const ids = (state.shuffle ? shuffleArr(list) : list).map(function (q) { return q.id; });
  return state.count > 0 ? ids.slice(0, state.count) : ids;
}
function startPractice() {
  const label = state.unit === 'ALL' ? 'All units' : 'Unit ' + state.unit + ': ' + UNITS[state.unit];
  startQuiz(pickFrom(pool()), label);
}
function startWeak() {
  const ids = weakIds().slice(0, WEAK_SET_SIZE);
  state.examMode = false; state.timed = false;
  startQuiz(ids, 'Your weak spots');
}
function startUnseen() {
  const list = pool().filter(function (q) { return !WEAK.q[q.id]; });
  startQuiz(pickFrom(list), 'Not seen yet');
}
function prepare() {
  const q = BY_ID[state.queue[state.idx]];
  const idxs = choicesOf(q).map(function (_, i) { return i; });
  state.order = state.shuffle ? shuffleArr(idxs) : idxs;
  state.sel = [];
  state.checked = false;
}
function toggle(pos) {
  if (state.checked) return;
  const q = BY_ID[state.queue[state.idx]];
  const at = state.sel.indexOf(pos);
  if (q.c.length === 1) state.sel = at >= 0 ? [] : [pos];
  else if (at >= 0) state.sel.splice(at, 1);
  else state.sel.push(pos);
  render();
}
function grade() {
  const q = BY_ID[state.queue[state.idx]];
  const picked = state.sel.map(function (p) { return state.order[p]; });
  const right = picked.length === q.c.length && picked.every(function (i) { return isRight(q, i); });
  return { id: q.id, ok: right, picked: picked };
}
function check() {
  if (!state.sel.length || state.checked) return;
  const g = grade();
  state.results.push(g);
  weakRecord(g.id, g.ok);
  if (state.examMode) { next(); return; }
  state.checked = true;
  render();
}
function next() {
  if (state.idx + 1 >= state.queue.length) { finish(); return; }
  state.idx++;
  prepare();
  render(); window.scrollTo(0, 0);
}
function finish() {
  stopClock();
  // Questions left blank when time runs out count as missed.
  for (let i = state.results.length; i < state.queue.length; i++) {
    if (i === state.results.length && state.sel.length && !state.checked && i === state.idx) {
      const g = grade(); state.results.push(g); weakRecord(g.id, g.ok);
    } else { state.results.push({ id: state.queue[i], ok: false, picked: [] }); weakRecord(state.queue[i], false); }
  }
  state.screen = 'results';
  render(); window.scrollTo(0, 0);
}
function quit() { stopClock(); state.screen = 'home'; render(); window.scrollTo(0, 0); }
function retakeMissed() {
  const ids = state.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.id; });
  state.timed = false;
  startQuiz(ids, 'Retake: missed');
}
function canResume() {
  return state.screen === 'quiz' && state.queue.length > 0 && state.idx < state.queue.length &&
    state.queue.every(function (id) { return BY_ID[id]; });
}

// ---------- screens ----------
function render() {
  document.title = 'C777 Web Development Drill';
  const host = document.getElementById('app');
  let html = '';
  if (state.screen === 'quiz') html = renderQuiz();
  else if (state.screen === 'results') html = renderResults();
  else if (state.screen === 'browse') html = renderBrowse();
  else html = renderHome();
  host.innerHTML = html;
  window.__appReady = true;
}
function opt(on, js, label) { return '<button type="button" class="opt' + (on ? ' on' : '') + '" onclick="' + js + '">' + label + '</button>'; }
function renderHome() {
  const all = unitStats('ALL');
  const rows = Object.keys(UNITS).map(function (u) {
    const st = unitStats(Number(u));
    const pct = st.total ? Math.round(100 * st.good / st.total) : 0;
    return '<div class="unit-row"><span><b>U' + u + '</b>' + esc(UNITS[u]) + ' <span class="dim">(' + st.total + ')</span></span><div class="meter"><i style="width:' + pct + '%"></i></div><span class="pct">' + pct + '%</span></div>';
  }).join('');
  const unitBtns = opt(state.unit === 'ALL', "setUnit('ALL')", 'All units') + Object.keys(UNITS).map(function (u) {
    return opt(String(state.unit) === u, "setUnit('" + u + "')", 'Unit ' + u);
  }).join('');
  const counts = [10, 20, 40, 0].map(function (n) { return opt(state.count === n, 'setCount(' + n + ')', n === 0 ? 'Every question' : String(n)); }).join('');
  const weak = weakIds();
  const poolSize = pool().length;
  const weakPanel = weak.length
    ? '<div class="panel"><div class="panel-title">Your weak spots</div><p class="sub">' + weak.length + ' question' + (weak.length === 1 ? '' : 's') + ' you keep missing. One leaves the list after ' + WEAK_MASTERED_STREAK + ' right answers in a row.</p><button type="button" class="btn wide" onclick="startWeak()">Practice weak spots</button></div>'
    : '';
  return '<div class="eyebrow">WGU C777</div><h1>Web Development Drill</h1>' +
    '<p class="sub">' + QS.length + ' questions across the six units of the study guide: HTML, CSS3, JavaScript, HTML APIs, forms and mobile design. Your answers are remembered on this device.</p>' +
    '<div class="panel"><div class="panel-title">Progress &middot; ' + all.good + ' of ' + all.total + ' solid</div>' + rows + '</div>' +
    '<div class="panel"><div class="panel-title">Build a quiz</div>' +
    '<label class="field">Unit</label><div class="row">' + unitBtns + '</div>' +
    '<label class="field">How many questions</label><div class="row">' + counts + '</div>' +
    '<label class="field">Options</label><div class="row">' +
    opt(state.shuffle, 'toggleOpt(\'shuffle\')', 'Shuffle') +
    opt(state.examMode, 'toggleOpt(\'examMode\')', 'Exam mode (answers at the end)') +
    opt(state.timed, 'toggleOpt(\'timed\')', 'Timed') + '</div>' +
    '<button type="button" class="btn wide" onclick="startPractice()"' + (poolSize ? '' : ' disabled') + '>Start (' + (state.count > 0 ? Math.min(state.count, poolSize) : poolSize) + ' questions)</button>' +
    '<button type="button" class="btn ghost wide" onclick="startUnseen()">Only questions I have not seen</button></div>' +
    weakPanel +
    '<div class="panel"><div class="panel-title">Look things up</div><button type="button" class="btn ghost wide" style="margin-top:0" onclick="goBrowse()">Browse every question and answer</button></div>';
}
function setUnit(u) { state.unit = u; render(); }
function setCount(n) { state.count = n; render(); }
function toggleOpt(k) { state[k] = !state[k]; render(); }

function renderQuiz() {
  const q = BY_ID[state.queue[state.idx]];
  const total = state.queue.length;
  const multi = q.c.length > 1;
  const letters = 'ABCDEFGH';
  const list = choicesOf(q);
  const body = state.order.map(function (orig, pos) {
    let cls = 'choice';
    const picked = state.sel.indexOf(pos) >= 0;
    if (state.checked) {
      if (isRight(q, orig)) cls += picked ? ' right' : ' missed';
      else if (picked) cls += ' wrong';
    } else if (picked) cls += ' sel';
    return '<button type="button" class="' + cls + '" onclick="toggle(' + pos + ')"' + (state.checked ? ' disabled' : '') + '><span class="let">' + letters[pos] + '</span><span>' + rich(list[orig]) + '</span></button>';
  }).join('');
  let foot;
  if (state.checked) {
    const last = state.results[state.results.length - 1];
    foot = '<div class="verdict ' + (last.ok ? 'good' : 'bad') + '">' + (last.ok ? 'Correct' : 'Not quite') + '</div>' +
      (q.x ? '<div class="why">' + rich(q.x) + '</div>' : '') +
      '<button type="button" class="btn wide" onclick="next()">' + (state.idx + 1 >= total ? 'See results' : 'Next') + '</button>';
  } else {
    foot = '<button type="button" class="btn wide" onclick="check()"' + (state.sel.length ? '' : ' disabled') + '>' + (state.examMode ? (state.idx + 1 >= total ? 'Finish' : 'Next') : 'Check answer') + '</button>';
  }
  return '<div class="top"><button type="button" onclick="quit()">&larr; Quit</button><span>' + esc(state.title) + '</span>' +
    (state.timed ? '<span class="clock" id="clock">' + fmt(state.timeLeft) + '</span>' : '<span>' + (state.idx + 1) + ' / ' + total + '</span>') + '</div>' +
    '<div class="bar"><i style="width:' + Math.round(100 * state.idx / total) + '%"></i></div>' +
    '<span class="tag">UNIT ' + q.u + ' &middot; ' + esc(q.t) + '</span>' +
    '<p class="stem">' + rich(q.s) + '</p>' +
    (q.k ? '<pre class="code">' + esc(q.k) + '</pre>' : '') +
    '<p class="hint">' + (multi ? 'Choose ' + q.c.length + '.' : 'Choose one.') + (state.timed ? ' ' + (state.idx + 1) + ' of ' + total + '.' : '') + '</p>' +
    body + foot;
}

function renderResults() {
  const n = state.results.length;
  const right = state.results.filter(function (r) { return r.ok; }).length;
  const pct = n ? Math.round(100 * right / n) : 0;
  const perUnit = {};
  state.results.forEach(function (r) { const u = BY_ID[r.id].u; (perUnit[u] = perUnit[u] || { n: 0, r: 0 }).n++; if (r.ok) perUnit[u].r++; });
  const unitRows = Object.keys(perUnit).sort().map(function (u) {
    const p = Math.round(100 * perUnit[u].r / perUnit[u].n);
    return '<div class="unit-row"><span><b>U' + u + '</b>' + esc(UNITS[u]) + '</span><div class="meter"><i style="width:' + p + '%"></i></div><span class="pct">' + perUnit[u].r + '/' + perUnit[u].n + '</span></div>';
  }).join('');
  const missed = state.results.filter(function (r) { return !r.ok; });
  const letters = 'ABCDEFGH';
  const missedHtml = missed.map(function (r) {
    const q = BY_ID[r.id]; const list = choicesOf(q);
    return '<div class="card"><div class="q">' + rich(q.s) + '</div>' + (q.k ? '<pre class="code">' + esc(q.k) + '</pre>' : '') +
      '<div class="y">' + (r.picked.length ? 'You chose: ' + r.picked.map(function (i) { return rich(list[i]); }).join('; ') : 'No answer') + '</div>' +
      '<div class="a">Answer: ' + q.c.map(function (i) { return rich(list[i]); }).join('; ') + '</div>' +
      (q.x ? '<div class="e">' + rich(q.x) + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="eyebrow">' + esc(state.title).toUpperCase() + '</div><div class="score">' + pct + '%</div>' +
    '<p class="sub">' + right + ' of ' + n + ' right.</p>' +
    '<div class="panel"><div class="panel-title">By unit</div>' + unitRows + '</div>' +
    (missed.length ? '<button type="button" class="btn wide" onclick="retakeMissed()">Retake the ' + missed.length + ' I missed</button>' : '') +
    '<button type="button" class="btn ghost wide" onclick="quit()">Back to the start</button>' +
    (missed.length ? '<div class="panel-title" style="margin-top:22px">What you missed</div>' + missedHtml : '');
}

function goBrowse() { state.screen = 'browse'; render(); window.scrollTo(0, 0); }
function setBrowseUnit(u) { state.browseUnit = u; render(); }
function setBrowseSearch(v) {
  state.browseSearch = v; render();
  const el = document.getElementById('bsearch');
  if (el) { el.focus(); el.setSelectionRange(v.length, v.length); }
}
function renderBrowse() {
  const needle = state.browseSearch.trim().toLowerCase();
  const list = QS.filter(function (q) {
    if (state.browseUnit !== 'ALL' && String(q.u) !== String(state.browseUnit)) return false;
    if (!needle) return true;
    return (q.s + ' ' + q.t + ' ' + q.k + ' ' + q.c.join(' ') + ' ' + q.w.join(' ')).toLowerCase().indexOf(needle) >= 0;
  });
  const btns = opt(state.browseUnit === 'ALL', "setBrowseUnit('ALL')", 'All') + Object.keys(UNITS).map(function (u) {
    return opt(String(state.browseUnit) === u, "setBrowseUnit('" + u + "')", 'U' + u);
  }).join('');
  const cards = list.slice(0, 80).map(function (q) {
    return '<div class="card"><span class="tag">UNIT ' + q.u + ' &middot; ' + esc(q.t) + '</span><div class="q">' + rich(q.s) + '</div>' + (q.k ? '<pre class="code">' + esc(q.k) + '</pre>' : '') +
      '<div class="a">' + q.c.map(rich).join('; ') + '</div>' +
      '<div class="dim" style="font-size:13px;margin-top:4px">Not: ' + q.w.map(rich).join('; ') + '</div>' +
      (q.x ? '<div class="e">' + rich(q.x) + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="top"><button type="button" onclick="quit()">&larr; Back</button><span>' + list.length + ' questions</span></div>' +
    '<div class="row" style="margin-bottom:10px">' + btns + '</div>' +
    '<input id="bsearch" type="search" placeholder="Search questions and answers" value="' + esc(state.browseSearch) + '" oninput="setBrowseSearch(this.value)">' +
    '<div style="height:12px"></div>' + cards + (list.length > 80 ? '<p class="sub">Showing the first 80. Narrow it with the search box.</p>' : '');
}

window.addEventListener('keydown', function (e) {
  if (state.screen !== 'quiz' || e.target.tagName === 'INPUT') return;
  const n = e.key >= '1' && e.key <= '9' ? Number(e.key) - 1 : 'abcdefgh'.indexOf(e.key.toLowerCase());
  if (n >= 0 && n < state.order.length) toggle(n);
  else if (e.key === 'Enter') { if (state.checked) next(); else check(); }
});

render();
if (state.timed && state.screen === 'quiz') startClock();
</script>
