<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>C777 Web Development Drill</title>
<style>
:root {
  --bg:#10141b; --panel:#1a2029; --panel-2:#212936; --border:#2c3542; --border-soft:#232b37;
  --text:#e9ecf1; --text-dim:#8b96a5; --text-faint:#6a7585; --amber:#e8a33d; --amber-dim:#6b551f;
  --good:#5fd87a; --good-dim:#1e3324; --bad:#f0665a; --bad-dim:#3a2323;
  --mono: ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme: dark;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
#app { max-width:640px; margin:0 auto; padding:20px 16px 64px; }
button { font-family:inherit; cursor:pointer; }
.eyebrow { font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--amber); font-weight:600; }
h1 { font-size:30px; line-height:1.1; margin:8px 0 10px; letter-spacing:-.02em; font-weight:800; }
.sub { color:var(--text-dim); font-size:14.5px; line-height:1.5; margin:0; }
.panel { background:var(--panel); border:1px solid var(--border-soft); border-radius:10px; padding:16px; margin-top:14px; }
.panel-title { font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--text-faint); margin-bottom:12px; font-weight:600; text-transform:uppercase; }
.unit-row { display:grid; grid-template-columns:1fr 80px 38px; align-items:center; gap:10px; padding:6px 0; font-size:13px; }
.unit-row b { color:var(--amber); font-family:var(--mono); margin-right:6px; }
.meter { height:6px; background:var(--border-soft); border-radius:4px; overflow:hidden; }
.meter i { display:block; height:100%; background:var(--amber); border-radius:4px; }
.pct { font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:right; }
.row { display:flex; flex-wrap:wrap; gap:8px; }
.opt { background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:9px 13px; font-size:13px; min-height:40px; }
.opt.on { background:var(--amber-dim); border-color:var(--amber); color:var(--text); }
.btn { background:var(--amber); color:#1a1305; border:0; border-radius:9px; padding:13px 18px; font-size:15px; font-weight:700; min-height:46px; }
.btn.ghost { background:var(--panel-2); color:var(--text); border:1px solid var(--border); font-weight:600; }
.btn.wide { width:100%; margin-top:10px; }
.btn:disabled { opacity:.4; cursor:default; }
label.field { display:block; font-size:12.5px; color:var(--text-dim); margin:12px 0 6px; }
input[type=search] { width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:11px 12px; font-size:14px; }
.top { display:flex; justify-content:space-between; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:10px; }
.top button { background:none; border:0; color:var(--text-dim); font-family:var(--mono); font-size:12px; padding:8px 4px; min-height:40px; }
.bar { height:4px; background:var(--border-soft); border-radius:3px; overflow:hidden; margin-bottom:16px; }
.bar i { display:block; height:100%; background:var(--amber); }
.tag { display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--text-dim); background:var(--panel-2); border-radius:5px; padding:3px 7px; margin-bottom:10px; }
.stem { font-size:16.5px; line-height:1.5; margin:0 0 6px; font-weight:600; }
.hint { color:var(--text-faint); font-size:12.5px; margin:0 0 14px; }
pre.code { background:#0b0e13; border:1px solid var(--border-soft); border-radius:8px; padding:12px; overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.55; margin:10px 0 14px; white-space:pre; color:#cfd6e0; }
.choice { display:flex; gap:11px; width:100%; text-align:left; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:13px; margin-bottom:9px; font-size:14.5px; line-height:1.45; align-items:flex-start; }
.choice .let { font-family:var(--mono); font-weight:700; color:var(--text-faint); min-width:18px; }
.choice.sel { border-color:var(--amber); background:#2a2417; }
.choice.right { border-color:var(--good); background:var(--good-dim); }
.choice.wrong { border-color:var(--bad); background:var(--bad-dim); }
.choice.missed { border-color:var(--good); border-style:dashed; }
.choice code, .stem code, .why code { font-family:var(--mono); font-size:.92em; background:#0b0e13; padding:1px 5px; border-radius:4px; }
.why { background:var(--panel); border-left:3px solid var(--amber); border-radius:6px; padding:12px 14px; margin:12px 0; font-size:14px; line-height:1.55; color:var(--text-dim); }
.verdict { font-weight:800; font-size:15px; margin:14px 0 4px; }
.verdict.good { color:var(--good); } .verdict.bad { color:var(--bad); }
.score { font-size:54px; font-weight:800; letter-spacing:-.03em; margin:8px 0 2px; }
.card { background:var(--panel); border:1px solid var(--border-soft); border-radius:10px; padding:14px; margin-bottom:10px; font-size:14px; line-height:1.5; }
.card .q { font-weight:600; margin-bottom:6px; }
.card .a { color:var(--good); font-size:13.5px; }
.card .y { color:var(--bad); font-size:13.5px; }
.card .e { color:var(--text-dim); font-size:13px; margin-top:6px; }
.dim { color:var(--text-dim); }
.clock { color:var(--amber); }
.boot { padding:40px 8px; color:var(--text-dim); }
@media (max-width:420px){ h1{font-size:26px;} .unit-row{grid-template-columns:1fr 60px 36px;} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>
<body>
<div id="app"><div class="boot">Loading C777 Web Development Drill…</div></div>
<noscript><div class="boot"><strong>JavaScript is off.</strong> This study app needs it.</div></noscript>
<script>
// Question bank. Q(unit, topic, question, [right answers], [wrong answers], why, optional code to show).
const QS = [];
function Q(u, t, s, c, w, x, k) { QS.push({ u: u, t: t, s: s, c: [].concat(c), w: w, x: x || '', k: k || '' }); }

// ===== Unit 1: HTML Essentials =====
Q(1,'Trifecta','Which three technologies make up the web development "trifecta"?',['HTML, CSS and JavaScript'],['HTML, PHP and SQL','XML, CSS and Java','HTML, JSON and Python'],'HTML gives a page its structure and content, CSS its presentation, and JavaScript its behavior.');
Q(1,'Trifecta','In the web development trifecta, which technology controls how a page LOOKS (colors, fonts, spacing)?',['CSS'],['HTML','JavaScript','HTTP'],'CSS handles presentation. HTML is the content and structure, JavaScript is behavior.');
Q(1,'Trifecta','In the web development trifecta, which technology is responsible for the page\'s STRUCTURE and content?',['HTML'],['CSS','JavaScript','jQuery'],'HTML marks up headings, paragraphs, lists, links, images and so on.');
Q(1,'Trifecta','Which technology adds interactivity and dynamic behavior to a web page?',['JavaScript'],['HTML','CSS','XML'],'JavaScript responds to events, changes the DOM and talks to servers.');
Q(1,'HTML basics','What does HTML stand for?',['Hypertext Markup Language'],['Hyperlinks and Text Markup Language','Home Tool Markup Language','High Transfer Markup Language'],'HTML is Hypertext Markup Language.');
Q(1,'HTML basics','HTML is best described as a:',['markup language'],['programming language','database language','compiled language'],'HTML describes content with tags. It has no variables, loops or logic of its own.');
Q(1,'HTML basics','What is the purpose of an HTML tag such as `<p>`?',['To tell the browser what kind of content it surrounds'],['To run a calculation','To connect to a database','To style the page with colors only'],'Tags mark up content so a browser knows how to treat it.');
Q(1,'HTML basics','An HTML element is made of:',['an opening tag, content and a closing tag'],['only an attribute','only the text between tags','a selector and a declaration'],'For example `<p>Hello<\/p>` is an element: opening tag, content, closing tag.');
Q(1,'HTML basics','Which of these is an EMPTY (void) element with no closing tag?',['`<br>`'],['`<p>`','`<div>`','`<h1>`'],'`<br>`, `<hr>`, `<img>` and `<input>` have no content and no closing tag.');
Q(1,'HTML basics','Which of these are void elements?',['`<img>`','`<hr>`'],['`<ul>`','`<table>`'],'Void elements contain no content: `<img>`, `<hr>`, `<br>`, `<input>`, `<meta>`, `<link>`.');
Q(1,'HTML basics','What is an attribute in HTML?',['Extra information placed in an opening tag, written as name="value"'],['A block of text between tags','A CSS rule','A JavaScript variable'],'Example: `<a href="page.html">` has the attribute `href`.');
Q(1,'HTML basics','Which file extension is used for a standard web page?',['.html'],['.css','.js','.exe'],'`.html` (or `.htm`) files hold HTML markup.');
Q(1,'HTML basics','Which tag defines the largest, most important heading?',['`<h1>`'],['`<h6>`','`<head>`','`<header>`'],'`<h1>` is the top-level heading, `<h6>` the smallest.');
Q(1,'HTML basics','Which tag creates a paragraph?',['`<p>`'],['`<par>`','`<para>`','`<pg>`'],'Use `<p>` for a paragraph of text.');
Q(1,'HTML basics','Which tag inserts a line break?',['`<br>`'],['`<lb>`','`<break>`','`<nl>`'],'`<br>` forces the text onto a new line.');
Q(1,'HTML basics','Which tag draws a horizontal rule (a thematic break line)?',['`<hr>`'],['`<line>`','`<rule>`','`<hl>`'],'`<hr>` is a void element.');
Q(1,'HTML basics','Which tags make text bold and italic with meaning (importance and emphasis)?',['`<strong>` and `<em>`'],['`<big>` and `<small>`','`<bold>` and `<ital>`','`<b>` and `<i>` only'],'`<strong>` marks importance, `<em>` marks emphasis. `<b>` and `<i>` are only visual.');
Q(1,'HTML basics','Which tag makes an UNORDERED (bulleted) list?',['`<ul>`'],['`<ol>`','`<dl>`','`<list>`'],'`<ul>` holds `<li>` items shown with bullets.');
Q(1,'HTML basics','Which tag makes an ORDERED (numbered) list?',['`<ol>`'],['`<ul>`','`<nl>`','`<num>`'],'`<ol>` holds `<li>` items shown with numbers.');
Q(1,'HTML basics','Which element is a list item inside both `<ul>` and `<ol>`?',['`<li>`'],['`<item>`','`<it>`','`<ls>`'],'Each entry is an `<li>`.');
Q(1,'HTML basics','Which tag is used for a description list term/definition pair? (select two)',['`<dt>`','`<dd>`'],['`<li>`','`<th>`'],'A `<dl>` holds `<dt>` terms and `<dd>` descriptions.');
Q(1,'Comments','Which is the correct way to write an HTML comment?',['`<!-- note -->`'],['`// note`','`/* note */`','`# note`'],'HTML comments start with `<!--` and end with `-->`. The others belong to JavaScript, CSS and other languages.');
Q(1,'Structure','Which element holds ALL the visible content of a page?',['`<body>`'],['`<head>`','`<title>`','`<meta>`'],'Everything shown in the browser window lives inside `<body>`.');
Q(1,'Structure','Which element contains metadata such as the title, character set and linked stylesheets?',['`<head>`'],['`<body>`','`<header>`','`<section>`'],'`<head>` is not shown on the page itself. Do not confuse it with `<header>`.');
Q(1,'Structure','Which element is the root of an HTML document?',['`<html>`'],['`<body>`','`<root>`','`<doc>`'],'`<html>` wraps the whole document, containing `<head>` and `<body>`.');
Q(1,'Structure','Where does the text of the `<title>` element appear?',['In the browser tab or title bar and in search results'],['As a heading in the page body','At the bottom of the page','Nowhere'],'The title is shown on the tab, in bookmarks and search results, not in the page body.');
Q(1,'Structure','Which tag sets the character encoding of a page?',['`<meta charset="UTF-8">`'],['`<link charset="UTF-8">`','`<body charset="UTF-8">`','`<title charset="UTF-8">`'],'`<meta charset="UTF-8">` goes in the head.');
Q(1,'Structure','Which attribute on `<html>` declares the page language?',['`lang`'],['`language`','`locale`','`type`'],'`<html lang="en">` helps screen readers and search engines.');
Q(1,'Structure','Put the structural elements in the correct order, from outside to inside:',['`html` contains `head` and `body`'],['`body` contains `html` and `head`','`head` contains `html` and `body`','`html` contains `body`, and `body` contains `head`'],'`<html>` is the root with `<head>` and `<body>` as its two children.');
Q(1,'Structure','What belongs in the `<head>` element? (select all that apply)',['`<title>`','`<meta>`','`<link>`'],['`<p>`','`<table>`'],'Head holds metadata and resources. Visible content goes in the body.');
Q(1,'Structure','Which tag links an external CSS file to a page?',['`<link rel="stylesheet" href="style.css">`'],['`<style src="style.css">`','`<css href="style.css">`','`<script href="style.css">`'],'Use `<link>` in the head with `rel="stylesheet"`.');
Q(1,'Structure','Which tag includes an external JavaScript file?',['`<script src="app.js"><\/script>`'],['`<js src="app.js">`','`<link href="app.js">`','`<javascript file="app.js">`'],'`<script src>` loads an external script.');
Q(1,'DOCTYPE','What does `<!DOCTYPE html>` do?',['Tells the browser the page is written in HTML5'],['Creates the page title','Loads the CSS file','Starts a JavaScript block'],'The doctype triggers standards mode so the page renders consistently.');
Q(1,'DOCTYPE','Where must `<!DOCTYPE html>` appear?',['On the very first line of the document, before `<html>`'],['Inside the `<head>`','Inside the `<body>`','At the end of the file'],'It must come before the `<html>` element.');
Q(1,'DOCTYPE','Is `<!DOCTYPE html>` an HTML tag?',['No, it is a declaration (an instruction to the browser)'],['Yes, it is a container element','Yes, it is a void element with attributes','It is a JavaScript statement'],'It is not an element at all and is not case sensitive.');
Q(1,'DOCTYPE','Compared with older HTML 4 doctypes, the HTML5 doctype is:',['much shorter and simpler'],['longer and must include a URL','identical','only valid for mobile'],'HTML5 uses just `<!DOCTYPE html>`.');
Q(1,'Semantic','What does a "semantic" element do?',['Describes the meaning and role of its content'],['Only changes how content looks','Runs scripts','Stores data'],'Examples: `<nav>`, `<article>`, `<footer>`. Non-semantic ones like `<div>` and `<span>` say nothing about content.');
Q(1,'Semantic','Which are semantic elements? (select all that apply)',['`<header>`','`<nav>`','`<footer>`'],['`<div>`','`<span>`'],'`<div>` and `<span>` are generic containers with no meaning.');
Q(1,'Semantic','Which element is meant for a major block of NAVIGATION links?',['`<nav>`'],['`<menu>`','`<aside>`','`<links>`'],'`<nav>` marks the main navigation.');
Q(1,'Semantic','Which element holds self-contained content that could stand alone, such as a blog post?',['`<article>`'],['`<section>`','`<aside>`','`<div>`'],'`<article>` is independent and reusable on its own.');
Q(1,'Semantic','Which element groups related content under a heading within a page, such as a chapter?',['`<section>`'],['`<article>`','`<footer>`','`<span>`'],'`<section>` is a thematic grouping of content.');
Q(1,'Semantic','Which element holds content tangentially related to the main content, like a sidebar?',['`<aside>`'],['`<side>`','`<nav>`','`<main>`'],'`<aside>` is for sidebars, pull quotes and related links.');
Q(1,'Semantic','Which element contains the dominant, unique content of the page? There should be only one visible.',['`<main>`'],['`<body>`','`<section>`','`<article>`'],'Use one `<main>` per page.');
Q(1,'Semantic','Which element normally holds a page or section\'s introductory content such as a logo and title?',['`<header>`'],['`<head>`','`<top>`','`<title>`'],'`<header>` is visible content. `<head>` is metadata.');
Q(1,'Semantic','Which element normally holds copyright, contact and related links at the bottom of a page?',['`<footer>`'],['`<bottom>`','`<end>`','`<aside>`'],'`<footer>` is for closing information.');
Q(1,'Semantic','Which pair marks up a figure and its caption?',['`<figure>` and `<figcaption>`'],['`<img>` and `<caption>`','`<picture>` and `<label>`','`<fig>` and `<title>`'],'`<figcaption>` goes inside `<figure>`.');
Q(1,'Semantic','Which is a benefit of using semantic elements? (select two)',['Better accessibility for screen readers','Easier for search engines to understand the page'],['Pages load twice as fast','They replace the need for CSS'],'Semantics help assistive technology, SEO and maintainability. They do not change speed or replace CSS.');
Q(1,'Semantic','Which element marks up a date or time in a machine-readable way?',['`<time>`'],['`<date>`','`<clock>`','`<datetime>`'],'`<time datetime="2024-05-01">` is the semantic way to mark a time.');
Q(1,'Semantic','What is the difference between `<div>` and `<span>`?',['`div` is a block-level container and `span` is inline'],['`div` is inline and `span` is block-level','They are identical','`div` is only for text and `span` only for images'],'`<div>` starts on a new line and fills the width. `<span>` flows within a line of text.');
Q(1,'Links','Which element creates a hyperlink?',['`<a>`'],['`<link>`','`<href>`','`<url>`'],'The anchor element: `<a href="page.html">Text<\/a>`.');
Q(1,'Links','Which attribute holds the destination of a link?',['`href`'],['`src`','`link`','`target`'],'`href` stands for hypertext reference.');
Q(1,'Links','How do you make a link open in a NEW tab or window?',['`target="_blank"`'],['`target="_self"`','`new="true"`','`open="tab"`'],'`_blank` opens a new browsing context. `_self` is the default.');
Q(1,'Links','What is an ABSOLUTE URL?',['A full address including the protocol, such as https://example.com/page.html'],['A path from the current folder like page.html','A link to a spot on the same page','A link that opens an email'],'Absolute URLs include the scheme and domain. Relative URLs depend on the current page\'s location.');
Q(1,'Links','What does the link `<a href="images/logo.png">` point to?',['A file in the images folder relative to the current page'],['A file at the root of another site','Something on the same line','A section on the page'],'No scheme or leading slash, so it is relative to the current document.');
Q(1,'Links','How do you link to an element with `id="top"` on the same page?',['`<a href="#top">`'],['`<a href="top">`','`<a href="id:top">`','`<a href="@top">`'],'A fragment identifier `#id` jumps to the element with that id.');
Q(1,'Links','Which link opens the visitor\'s email program?',['`<a href="mailto:me@example.com">`'],['`<a href="email:me@example.com">`','`<a href="mail=me@example.com">`','`<a href="send:me@example.com">`'],'The `mailto:` scheme starts an email.');
Q(1,'Links','Which link starts a phone call on a smartphone?',['`<a href="tel:5551234567">`'],['`<a href="call:5551234567">`','`<a href="phone=5551234567">`','`<a href="dial:5551234567">`'],'The `tel:` scheme dials a number.');
Q(1,'Links','Which attribute makes the browser download the linked file instead of opening it?',['`download`'],['`save`','`target="_download"`','`rel="download"`'],'`<a href="file.pdf" download>`.');
Q(1,'Links','Which attribute should be added with `target="_blank"` to prevent the new page from accessing `window.opener`?',['`rel="noopener"`'],['`rel="nofollow"`','`rel="stylesheet"`','`rel="external"`'],'`noopener` is a security measure for links opened in new tabs.');
Q(1,'Images','Which tag displays an image?',['`<img src="photo.jpg" alt="A photo">`'],['`<image href="photo.jpg">`','`<picture src="photo.jpg">`','`<img href="photo.jpg">`'],'`<img>` uses `src` for the file and `alt` for the text alternative.');
Q(1,'Images','Why is the `alt` attribute important on images?',['It gives a text alternative for screen readers and when the image cannot load'],['It sets the image size','It makes the image load faster','It adds a border'],'`alt` helps accessibility and is shown if the file is missing.');
Q(1,'Images','Which attributes set the displayed size of an image in HTML?',['`width` and `height`'],['`size` and `length`','`w` and `h`','`x` and `y`'],'Setting both also lets the browser reserve space while the image loads.');
Q(1,'Images','Which image format supports transparency and is best for logos and simple graphics with a lossless result?',['PNG'],['JPEG','BMP','MP3'],'PNG is lossless and supports alpha transparency. JPEG is best for photos but has no transparency.');
Q(1,'Images','Which image format is best for photographs because of its small file size?',['JPEG'],['PNG','GIF','SVG'],'JPEG uses lossy compression suited to photos.');
Q(1,'Images','Which image format supports simple animation?',['GIF'],['JPEG','PNG-8 only','BMP'],'Animated GIFs show a short loop of frames.');
Q(1,'Images','Which image type scales to any size without losing quality because it is described with shapes?',['SVG'],['JPEG','GIF','PNG'],'SVG is vector based and can be styled with CSS.');
Q(1,'Images','What does the `<picture>` element let you do?',['Offer different image sources for different screens or formats'],['Draw a picture with code','Embed a video','Add a caption'],'`<picture>` with `<source>` elements supports responsive images.');
Q(1,'Images','What does the `srcset` attribute on `<img>` provide?',['Several image files so the browser can choose the best one'],['A list of captions','A slideshow','A way to loop an animation'],'`srcset` lets the browser pick based on screen density and width.');
Q(1,'Images','Which attribute makes an image a clickable region map reference?',['`usemap`'],['`map`','`area`','`clickmap`'],'`<img usemap="#name">` pairs with a `<map name="name">`.');
Q(1,'Tables','Which tag creates a table?',['`<table>`'],['`<tab>`','`<grid>`','`<tbl>`'],'A table holds rows made of `<tr>`.');
Q(1,'Tables','Which tag creates a table ROW?',['`<tr>`'],['`<td>`','`<th>`','`<row>`'],'`<tr>` is a table row.');
Q(1,'Tables','Which tag creates a standard table DATA cell?',['`<td>`'],['`<th>`','`<tr>`','`<cell>`'],'`<td>` is a data cell.');
Q(1,'Tables','Which tag creates a table HEADER cell (bold and centered by default)?',['`<th>`'],['`<td>`','`<thead>`','`<hd>`'],'`<th>` marks a header cell.');
Q(1,'Tables','Which attribute makes a cell span multiple COLUMNS?',['`colspan`'],['`rowspan`','`span`','`cols`'],'`colspan="2"` merges the cell across two columns.');
Q(1,'Tables','Which attribute makes a cell span multiple ROWS?',['`rowspan`'],['`colspan`','`rows`','`merge`'],'`rowspan="3"` stretches the cell down three rows.');
Q(1,'Tables','Which tag adds a title or description to a table?',['`<caption>`'],['`<title>`','`<legend>`','`<figcaption>`'],'`<caption>` should be the first child of `<table>`.');
Q(1,'Tables','Which elements group the header, body and footer rows of a table?',['`<thead>`, `<tbody>` and `<tfoot>`'],['`<head>`, `<body>` and `<foot>`','`<th>`, `<tb>` and `<tf>`','`<header>`, `<main>` and `<footer>`'],'These grouping elements add structure and accessibility.');
Q(1,'Tables','Tables should be used for:',['tabular data'],['page layout','positioning the navigation','overlapping text and images'],'Use CSS for layout. Tables are for rows and columns of data.');
Q(1,'Tables','What does this markup produce?',['A table with two rows and two cells in each row'],['A table with one row and four cells','A list of four items','A table with two columns and one row'],'Each `<tr>` is a row and each has two `<td>` cells.','<table>\n  <tr><td>A<\/td><td>B<\/td><\/tr>\n  <tr><td>C<\/td><td>D<\/td><\/tr>\n<\/table>');
Q(1,'Multimedia','Which element embeds a video in HTML5?',['`<video>`'],['`<movie>`','`<media>`','`<embed video>`'],'`<video controls src="clip.mp4"><\/video>`.');
Q(1,'Multimedia','Which element embeds audio in HTML5?',['`<audio>`'],['`<sound>`','`<mp3>`','`<music>`'],'`<audio controls src="song.mp3"><\/audio>`.');
Q(1,'Multimedia','Which attribute shows play, pause and volume buttons on a `<video>` or `<audio>` element?',['`controls`'],['`buttons`','`player`','`show`'],'Without `controls` no interface is shown.');
Q(1,'Multimedia','Which attribute starts media again from the beginning automatically when it ends?',['`loop`'],['`repeat`','`replay`','`again`'],'`loop` restarts playback.');
Q(1,'Multimedia','Which attribute starts playback as soon as possible? Browsers often block it unless the media is muted.',['`autoplay`'],['`start`','`play`','`auto`'],'`autoplay` is restricted by many browsers to protect users.');
Q(1,'Multimedia','Which element lets you supply multiple file formats for one `<video>` or `<audio>` so the browser picks one it supports?',['`<source>`'],['`<format>`','`<track>`','`<option>`'],'List several `<source src type>` children. The browser uses the first it can play.');
Q(1,'Multimedia','What goes between `<video>` and `<\/video>` that the browser shows only if it cannot play video?',['Fallback text or content'],['The video file data','CSS rules','The controls'],'Old browsers display the fallback message.');
Q(1,'Multimedia','Which element adds captions or subtitles to a video?',['`<track>`'],['`<caption>`','`<subtitle>`','`<text>`'],'`<track kind="captions" src="en.vtt" srclang="en">`.');
Q(1,'Multimedia','Which video file format is most widely supported across browsers?',['MP4 (H.264)'],['AVI','MOV only','WMV'],'MP4 is supported by all major browsers. WebM and Ogg are also supported by some.');
Q(1,'Multimedia','Which audio file format is supported by all major browsers? (select two)',['MP3','WAV'],['WMA','MIDI'],'MP3, WAV and Ogg are widely supported. WMA is not.');
Q(1,'Multimedia','What does the `poster` attribute of `<video>` set?',['An image shown before the video plays'],['The video title','A caption','The loop count'],'`poster` is the preview image.');
Q(1,'Multimedia','Which element embeds another web page (such as a YouTube player) inside a page?',['`<iframe>`'],['`<frame>`','`<embed page>`','`<include>`'],'`<iframe src="...">` embeds another document.');
Q(1,'Responsive','What is responsive web design?',['Design that adapts the layout to different screen sizes and devices'],['Design that responds only to form submissions','A site that loads very quickly','Design only for desktop'],'It uses flexible grids, flexible images and media queries.');
Q(1,'Responsive','Which meta tag is the key to responsive layout on mobile?',['`<meta name="viewport" content="width=device-width, initial-scale=1.0">`'],['`<meta name="mobile" content="true">`','`<meta charset="mobile">`','`<meta name="responsive">`'],'The viewport meta tag makes the page match the device width.');
Q(1,'Responsive','Which CSS makes an image shrink to fit a narrower container?',['`max-width: 100%; height: auto;`'],['`width: 1000px;`','`float: none;`','`position: fixed;`'],'This keeps the image from overflowing and maintains its aspect ratio.');
Q(1,'Validation','What is the purpose of the W3C Markup Validation Service?',['To check HTML for syntax and standards errors'],['To host a website','To minify JavaScript','To test page speed'],'The W3C validator reports unclosed tags, bad nesting, missing attributes and so on.');
Q(1,'Validation','Which is a common HTML error the validator finds?',['A missing closing tag'],['A too-short page title','A page with only one image','Using lowercase tags'],'Unclosed or incorrectly nested elements are typical errors.');
Q(1,'Validation','Which of these is correctly nested HTML?',['`<p><strong>Hello<\/strong><\/p>`'],['`<p><strong>Hello<\/p><\/strong>`','`<strong><p>Hello<\/strong><\/p>`','`<p><strong>Hello<\/p>`'],'Elements must close in the reverse order they opened.');
Q(1,'Validation','Which statements about well-formed HTML5 are true? (select all that apply)',['Tag names are case-insensitive but lowercase is the convention','Attribute values should be in quotes','IDs should be unique on a page'],['Every element must have an id','Elements may overlap each other freely'],'Valid pages use proper nesting, unique IDs and quoted values.');
Q(1,'Validation','Why does validating HTML matter?',['It helps ensure pages work consistently across browsers and devices'],['It makes images smaller','It encrypts the page','It guarantees top search ranking'],'Valid markup reduces rendering surprises and accessibility problems.');
Q(1,'Validation','Which of these can the W3C validator check? (select two)',['Pasted HTML code','A URL'],['The speed of your server','Your CSS font choices'],'It can validate by URI, by file upload or by direct input.');
Q(1,'HTML basics','Which character entity displays the less-than sign `<` as text?',['`&lt;`'],['`&gt;`','`&amp;`','`&nbsp;`'],'`&lt;` is less than, `&gt;` greater than, `&amp;` ampersand.');
Q(1,'HTML basics','Which entity creates a non-breaking space?',['`&nbsp;`'],['`&sp;`','`&space;`','`&nb;`'],'`&nbsp;` is a space that does not collapse or wrap.');
Q(1,'HTML basics','Which entity shows the copyright symbol?',['`&copy;`'],['`&cr;`','`&c;`','`&right;`'],'`&copy;` renders the (c) symbol.');
Q(1,'HTML basics','Browsers treat multiple spaces in HTML text as:',['a single space'],['as many spaces as typed','an error','a line break'],'HTML collapses whitespace. Use `&nbsp;` or CSS for extra spacing.');
Q(1,'HTML basics','Which tag preserves spacing and line breaks, usually in a monospaced font?',['`<pre>`'],['`<code>`','`<tt>`','`<space>`'],'`<pre>` shows text exactly as typed.');
Q(1,'HTML basics','Which attribute provides a unique identifier for an element?',['`id`'],['`class`','`name`','`key`'],'`id` must be unique per page. `class` can be reused.');
Q(1,'HTML basics','Which attribute can be shared by many elements to apply the same styling?',['`class`'],['`id`','`style`','`group`'],'A class can be used on many elements.');
Q(1,'HTML basics','Which attribute adds inline CSS to a single element?',['`style`'],['`css`','`font`','`design`'],'Example: `<p style="color:red">`.');

// ===== Unit 2: CSS3 Techniques =====
Q(2,'Basics','What does CSS stand for?',['Cascading Style Sheets'],['Computer Style Sheets','Creative Style System','Colorful Style Sheets'],'CSS is Cascading Style Sheets.');
Q(2,'Basics','What is the main purpose of CSS?',['To control the presentation and layout of HTML content'],['To store data','To add server logic','To define the page structure'],'CSS separates presentation from content.');
Q(2,'Basics','What is the main benefit of separating CSS from HTML?',['One stylesheet can restyle many pages'],['Pages become invisible','HTML no longer needs tags','Browsers load pages slower'],'External stylesheets keep style consistent and easy to change.');
Q(2,'Adding CSS','Which are the three ways to add CSS to a page? (select all that apply)',['Inline','Internal (in a style element)','External (a linked file)'],['Embedded in a PHP file only','Inside a comment'],'Inline uses the style attribute, internal uses `<style>`, external uses `<link>` to a .css file.');
Q(2,'Adding CSS','Which is the best choice for styling an entire website consistently?',['An external stylesheet'],['Inline styles on every tag','A style attribute only on the body','Comments'],'External stylesheets are shared by all pages and cached by the browser.');
Q(2,'Adding CSS','Where does an INTERNAL stylesheet go?',['In a `<style>` element, usually inside `<head>`'],['In the `<body>` after the text','In a `<css>` tag','In the doctype'],'`<style> ... <\/style>` in the head holds page-level CSS.');
Q(2,'Adding CSS','What does an INLINE style look like?',['`<p style="color: blue;">`'],['`<p css="color: blue;">`','`p { color: blue; }` in the body','`<style p="color:blue">`'],'The style attribute applies directly to one element.');
Q(2,'Adding CSS','In the normal cascade (without !important), which source of style has the highest priority?',['Inline styles'],['External stylesheets','Browser defaults','Internal stylesheets'],'Inline styles override selectors from stylesheets (unless `!important` is used).');
Q(2,'Adding CSS','Which tag correctly links an external stylesheet?',['`<link rel="stylesheet" href="styles.css">`'],['`<style src="styles.css">`','`<stylesheet>styles.css<\/stylesheet>`','`<link href="styles.css" type="javascript">`'],'The link element goes in the head.');
Q(2,'Syntax','In `h1 { color: red; }` what is `h1`?',['The selector'],['The property','The value','The declaration'],'The selector chooses which elements the rule applies to.');
Q(2,'Syntax','In `h1 { color: red; }` what is `color`?',['The property'],['The selector','The value','The rule set'],'A property is what you want to change.');
Q(2,'Syntax','In `h1 { color: red; }` what is `red`?',['The value'],['The selector','The property','The declaration block'],'The value is the setting for the property.');
Q(2,'Syntax','What is `color: red;` called?',['A declaration'],['A selector','A rule set','A comment'],'A declaration is a property and value pair. Declarations sit inside curly braces.');
Q(2,'Syntax','Which separates a property from its value in a CSS declaration?',['A colon'],['An equals sign','A semicolon','A comma'],'Syntax: `property: value;`');
Q(2,'Syntax','Which ends a CSS declaration?',['A semicolon'],['A colon','A period','A comma'],'Each declaration ends with `;`.');
Q(2,'Syntax','Which are valid ways to write a CSS color? (select all that apply)',['`red`','`#ff0000`','`rgb(255, 0, 0)`'],['`color(red)`','`<red>`'],'Colors can be names, hex, RGB, HSL and more.');
Q(2,'Syntax','What color is `#000000`?',['Black'],['White','Red','Transparent'],'`#000000` is no light at all: black. `#ffffff` is white.');
Q(2,'Syntax','Which property changes the text color?',['`color`'],['`text-color`','`font-color`','`fgcolor`'],'`color` sets the foreground (text) color.');
Q(2,'Syntax','Which property sets the background color?',['`background-color`'],['`bgcolor`','`color-background`','`back-color`'],'`background-color: #fff;`');
Q(2,'Comments','Which is the correct CSS comment?',['`/* comment */`'],['`// comment`','`<!-- comment -->`','`# comment`'],'CSS only has block comments written `/* ... */`.');
Q(2,'Comments','Can a CSS comment span multiple lines?',['Yes'],['No, only one line','Only inside a style attribute','Only in external files'],'`/* ... */` can span as many lines as you need.');
Q(2,'Selectors','Which selector targets ALL `<p>` elements?',['`p`'],['`.p`','`#p`','`*p`'],'A bare name is an element (type) selector.');
Q(2,'Selectors','Which selector targets elements with `class="note"`?',['`.note`'],['`#note`','`note`','`*note`'],'A dot targets a class.');
Q(2,'Selectors','Which selector targets the element with `id="header"`?',['`#header`'],['`.header`','`header#`','`$header`'],'A hash targets an id.');
Q(2,'Selectors','What does the universal selector `*` do?',['Selects every element'],['Selects only the first element','Selects comments','Selects ids'],'`* { margin: 0; }` applies to everything.');
Q(2,'Selectors','What does `h1, h2, h3 { color: navy; }` do?',['Applies the rule to all three heading types'],['Applies only to h1 inside h2','Applies only to h3','Is invalid syntax'],'A comma groups selectors.');
Q(2,'Selectors','What does `div p` select?',['Every `p` that is a descendant of a `div`'],['Only `p` that are direct children of `div`','Every `div` and every `p`','The `div` that follows a `p`'],'A space is the descendant combinator.');
Q(2,'Selectors','What does `div > p` select?',['Only `p` elements that are direct children of a `div`'],['Every `p` anywhere inside a `div`','Every `div` and `p`','Siblings of a `div`'],'`>` is the child combinator.');
Q(2,'Selectors','What does `h1 + p` select?',['The first `p` immediately after an `h1`'],['Every `p` inside an `h1`','All `p` elements on the page','The `h1` before a `p`'],'`+` selects the adjacent sibling.');
Q(2,'Selectors','What does `h1 ~ p` select?',['Every `p` sibling that follows an `h1`'],['Only the first sibling `p`','Any `p` inside an `h1`','Nothing'],'`~` is the general sibling combinator.');
Q(2,'Selectors','What does `a:hover` do?',['Styles a link while the pointer is over it'],['Styles visited links','Styles links in focus only','Styles every link permanently'],':hover is a pseudo-class for a hovered element.');
Q(2,'Selectors','Which pseudo-class styles a link that has been visited?',['`a:visited`'],['`a:seen`','`a:old`','`a:history`'],'The link pseudo-classes are :link, :visited, :hover and :active.');
Q(2,'Selectors','What is the correct order for the link pseudo-classes so that they all work?',[':link, :visited, :hover, :active'],[':hover, :active, :link, :visited',':active, :hover, :visited, :link',':visited, :link, :active, :hover'],'Remember LoVe HAte (LVHA).');
Q(2,'Selectors','Which selects the first `<li>` in a list?',['`li:first-child`'],['`li:first`','`li::first`','`li:one`'],':first-child matches an element that is the first child of its parent.');
Q(2,'Selectors','What does `p::first-line` style?',['The first line of text in a paragraph'],['The first paragraph','The first letter','The first word'],'`::first-line` and `::first-letter` are pseudo-elements.');
Q(2,'Selectors','What does `input[type="text"]` select?',['Input elements whose type attribute is text'],['All elements with text','Only the first input','An element with the id text'],'Attribute selectors use square brackets.');
Q(2,'Selectors','Which is true about class and id selectors? (select all that apply)',['An id should be unique on a page','A class can be used on many elements','An element can have more than one class'],['An id may be reused for many elements','Classes can only be used once'],'IDs identify one element. Classes are reusable and combinable.');
Q(2,'Cascade','When two rules conflict, which has the highest specificity?',['An id selector'],['A class selector','An element selector','The universal selector'],'Specificity order: inline, id, class/attribute/pseudo-class, element.');
Q(2,'Cascade','What does `!important` do?',['Overrides normal specificity for that declaration'],['Makes the text bold','Hides the rule','Marks a comment'],'`color: red !important;` wins over normal declarations. Use it sparingly.');
Q(2,'Cascade','The "cascade" in CSS refers to:',['How conflicting rules are resolved by origin, specificity and order'],['Water-themed animation','Stacking pages vertically','Loading CSS in parallel'],'Later rules win when specificity is equal.');
Q(2,'Cascade','Two rules have the same specificity. Which wins?',['The one that appears LAST'],['The one that appears first','The shorter one','Neither, it is an error'],'Source order is the final tiebreaker.');
Q(2,'Cascade','What is inheritance in CSS?',['Child elements receive some property values from their parent'],['A class copies another class','Browsers copy the stylesheet','Rules inherit from `<head>`'],'Text properties like `color` and `font-family` inherit by default. Box properties like `border` do not.');
Q(2,'Box model','From the inside out, what are the layers of the CSS box model?',['Content, padding, border, margin'],['Content, margin, border, padding','Margin, border, padding, content','Padding, content, margin, border'],'Content is surrounded by padding, then the border, then the margin.');
Q(2,'Box model','What is the space BETWEEN the content and the border called?',['Padding'],['Margin','Outline','Spacing-gap'],'Padding is inside the border.');
Q(2,'Box model','What is the space OUTSIDE the border, separating the element from others?',['Margin'],['Padding','Gutter','Content'],'Margin is transparent space outside the border.');
Q(2,'Box model','Which shorthand sets padding of 10px top, 20px right, 30px bottom, 40px left?',['`padding: 10px 20px 30px 40px;`'],['`padding: 40px 30px 20px 10px;`','`padding: 10 20 30 40;`','`padding: 10px, 20px, 30px, 40px;`'],'Four values go clockwise: top, right, bottom, left.');
Q(2,'Box model','What does `margin: 10px 20px;` mean?',['10px top and bottom, 20px left and right'],['10px left and right, 20px top and bottom','10px top, 20px everything else','10px all around'],'Two values: vertical then horizontal.');
Q(2,'Box model','What does `margin: 0 auto;` do on a block element with a set width?',['Centers it horizontally'],['Centers it vertically','Removes the border','Hides it'],'Automatic left and right margins split the remaining space equally.');
Q(2,'Box model','Which shorthand sets a 2px solid red border?',['`border: 2px solid red;`'],['`border: red solid 2px 1;`','`border: solid;` only','`border-style: 2px red;`'],'Width, style and color in any order, but style is required.');
Q(2,'Box model','Which property gives a box rounded corners?',['`border-radius`'],['`corner-radius`','`round`','`border-curve`'],'`border-radius: 8px;`. `50%` on a square makes a circle.');

Q(2,'Box model','With `box-sizing: border-box`, a box has `width: 200px; padding: 10px; border: 5px solid`. What is its total width?',['200px'],['230px','215px','220px'],'`border-box` includes padding and border within the stated width.');
Q(2,'Box model','What do the `width` and `height` properties set under the default box model?',['The size of the content area'],['The size including margin','The size including border','The viewport size'],'Padding, border and margin are added on top.');
Q(2,'Box model','Which property controls what happens when content is too big for its box?',['`overflow`'],['`clip-content`','`spill`','`max-content`'],'Values: visible, hidden, scroll, auto.');

Q(2,'Box model','Which property draws a line outside the border and does NOT take up space?',['`outline`'],['`margin`','`padding`','`border-image`'],'`outline` does not change layout.');
Q(2,'Positioning','What is the default `position` value?',['`static`'],['`relative`','`absolute`','`fixed`'],'Static elements follow normal document flow and ignore top/left/right/bottom.');

Q(2,'Positioning','Which `position` value toggles between relative and fixed depending on scroll position?',['`sticky`'],['`stuck`','`float`','`pinned`'],'`position: sticky; top: 0;` sticks when the scroll reaches that offset.');
Q(2,'Positioning','To make an absolutely positioned child sit relative to its parent, the parent should have:',['`position: relative;`'],['`display: block;`','`float: left;`','`overflow: auto;`'],'The nearest positioned ancestor is used as the reference.');
Q(2,'Positioning','Which property controls which overlapping element appears on top?',['`z-index`'],['`stack`','`layer`','`top-order`'],'Higher z-index sits above, and it applies to positioned elements.');
Q(2,'Positioning','Which properties offset a positioned element? (select all that apply)',['`top`','`left`','`bottom`'],['`margin-flow`','`indent-size`'],'`top`, `right`, `bottom` and `left` are the offset properties.');
Q(2,'Positioning','What does `float: left;` do?',['Moves the element to the left and lets text wrap around it'],['Positions it at left: 0','Hides the element','Centers it'],'Floated elements are taken out of normal flow so inline content wraps around them.');
Q(2,'Positioning','Which property stops an element from wrapping around floated elements?',['`clear`'],['`stop`','`unfloat`','`wrap: none`'],'`clear: both;` moves the element below any floats.');
Q(2,'Positioning','What is the difference between `display: none` and `visibility: hidden`?',['`none` removes the element from layout; `hidden` hides it but keeps its space'],['They are identical','`hidden` removes it from layout; `none` keeps its space','Only `none` works on images'],'`display: none` collapses the space. `visibility: hidden` leaves an empty gap.');
Q(2,'Positioning','Which `display` value makes an element behave like a block-level element?',['`display: block;`'],['`display: inline;`','`display: run-in;`','`display: text;`'],'Block elements start on a new line and fill the available width.');
Q(2,'Positioning','Which `display` value lets elements sit side by side and accept width and height?',['`inline-block`'],['`inline`','`block`','`none`'],'`inline-block` flows like text but respects box sizing.');
Q(2,'Positioning','Which `display` value turns an element into a one-dimensional layout container for rows or columns?',['`flex`'],['`grid-line`','`table-cell`','`inline`'],'Flexbox lays out items along a main axis.');
Q(2,'Positioning','Which `display` value creates a two-dimensional layout with rows and columns?',['`grid`'],['`flex`','`column`','`table-flow`'],'CSS Grid handles rows and columns together.');
Q(2,'Positioning','In a flex container, which property aligns items along the MAIN axis?',['`justify-content`'],['`align-content` only','`flex-grow`','`float`'],'`align-items` handles the cross axis.');
Q(2,'Positioning','Which property sets the direction of the main axis in flexbox?',['`flex-direction`'],['`flex-wrap`','`main-axis`','`align-items`'],'Values: row, row-reverse, column, column-reverse.');
Q(2,'Text','Which property sets the font?',['`font-family`'],['`font-style`','`text-font`','`type-face`'],'`font-family: Arial, sans-serif;` lists fallbacks.');
Q(2,'Text','Why list several fonts in `font-family`?',['If the first is missing the browser tries the next one'],['The browser mixes them','To load them in parallel','It is required by CSS3'],'End the list with a generic family such as `serif` or `sans-serif`.');
Q(2,'Text','Which property sets the text size?',['`font-size`'],['`text-size`','`size`','`font-height`'],'`font-size: 16px;` or `1rem`.');
Q(2,'Text','Which unit is relative to the font size of the ROOT element?',['`rem`'],['`em`','`px`','`vh`'],'`rem` is relative to `<html>`. `em` is relative to the element\'s (or parent\'s) font size.');
Q(2,'Text','Which unit is relative to the font size of the current element or its parent?',['`em`'],['`rem`','`pt`','`vw`'],'`2em` is twice the element\'s font size.');
Q(2,'Text','Which property makes text bold?',['`font-weight: bold;`'],['`text-weight: bold;`','`font-style: bold;`','`bold: true;`'],'`font-weight` takes keywords or 100 to 900.');
Q(2,'Text','Which property makes text italic?',['`font-style: italic;`'],['`font-weight: italic;`','`text-style: italic;`','`text-decoration: italic;`'],'`font-style` handles italic and oblique.');
Q(2,'Text','Which property aligns text left, right, center or justify?',['`text-align`'],['`align-text`','`text-position`','`font-align`'],'`text-align: center;`');
Q(2,'Text','Which property removes the underline from links?',['`text-decoration: none;`'],['`text-underline: none;`','`link-style: none;`','`font-decoration: none;`'],'`text-decoration` also supports underline, overline and line-through.');
Q(2,'Text','Which property changes text to uppercase without retyping it?',['`text-transform: uppercase;`'],['`font-case: upper;`','`text-case: upper;`','`text-style: caps;`'],'`text-transform` can also use lowercase and capitalize.');
Q(2,'Text','Which property sets the space between lines of text?',['`line-height`'],['`letter-spacing`','`word-spacing`','`text-indent`'],'`line-height: 1.5;` is a common, readable value.');
Q(2,'Text','Which property sets the space between characters?',['`letter-spacing`'],['`word-spacing`','`line-height`','`text-space`'],'`word-spacing` affects the gaps between words.');
Q(2,'Text','Which property indents the first line of a paragraph?',['`text-indent`'],['`margin-first`','`first-line`','`padding-first`'],'`text-indent: 2em;`');
Q(2,'Text','Which property adds a shadow to text?',['`text-shadow`'],['`font-shadow`','`box-shadow`','`shadow-text`'],'`text-shadow: 2px 2px 4px #000;`');
Q(2,'Text','Which property adds a shadow to a box?',['`box-shadow`'],['`text-shadow`','`border-shadow`','`drop-box`'],'`box-shadow: 0 2px 6px rgba(0,0,0,.3);`');
Q(2,'Text','Which rule lets you use a custom font file you host yourself?',['`@font-face`'],['`@import-font`','`@typeface`','`@custom-font`'],'`@font-face` defines the family name and the font file source.');
Q(2,'Text','What is a generic font family? (select all that apply)',['`serif`','`sans-serif`','`monospace`'],['`Arial`','`Times New Roman`'],'Generic families are categories. Arial and Times New Roman are specific fonts.');
Q(2,'Backgrounds','Which property places an image behind an element?',['`background-image`'],['`image-bg`','`bg-src`','`back-img`'],'`background-image: url("photo.jpg");`');
Q(2,'Backgrounds','Which property stops a background image from tiling?',['`background-repeat: no-repeat;`'],['`background-tile: none;`','`background-loop: off;`','`image-repeat: none;`'],'By default backgrounds repeat in both directions.');

Q(2,'Backgrounds','Which function creates a smooth color transition for a background?',['`linear-gradient()`'],['`blend()`','`fade()`','`mix()`'],'`background: linear-gradient(to right, red, blue);`');
Q(2,'Backgrounds','Which property controls the transparency of the whole element and its content?',['`opacity`'],['`alpha`','`transparency`','`visible`'],'`opacity: 0.5;` ranges from 0 (invisible) to 1.');
Q(2,'Backgrounds','Which color value has a transparency channel?',['`rgba(255, 0, 0, 0.5)`'],['`rgb(255, 0, 0)`','`#ff0000`','`red`'],'The a is alpha: 0 transparent, 1 opaque.');
Q(2,'Animations','Which at-rule defines the steps of a CSS animation?',['`@keyframes`'],['`@animate`','`@motion`','`@frames`'],'Keyframes describe the style at points in the animation.');
Q(2,'Animations','Which property applies a keyframes animation to an element?',['`animation` (or `animation-name`)'],['`keyframes`','`motion-name`','`animate-with`'],'`animation: slide 2s ease-in-out;`');
Q(2,'Animations','What does this CSS do?',['Moves the box from left 0 to left 100px over 2 seconds'],['Makes it fade out','Rotates it 100 degrees','Nothing, the animation is not applied'],'The `@keyframes` is applied by the `animation` property. The element must be positioned for `left` to work.','@keyframes slide {\n  from { left: 0; }\n  to   { left: 100px; }\n}\n.box {\n  position: relative;\n  animation: slide 2s;\n}');
Q(2,'Animations','Which property sets how long one cycle of an animation takes?',['`animation-duration`'],['`animation-time`','`animation-length`','`animation-speed`'],'Example: `animation-duration: 3s;`');
Q(2,'Animations','Which property makes an animation repeat forever?',['`animation-iteration-count: infinite;`'],['`animation-loop: true;`','`animation-repeat: always;`','`animation-count: all;`'],'The count can also be a number.');
Q(2,'Animations','Which property delays the start of an animation?',['`animation-delay`'],['`animation-wait`','`animation-start`','`animation-pause`'],'`animation-delay: 1s;`');
Q(2,'Animations','Which property makes an animation play forward then backward?',['`animation-direction: alternate;`'],['`animation-direction: bounce;`','`animation-flip: both;`','`animation-mode: reverse-loop;`'],'Values: normal, reverse, alternate, alternate-reverse.');
Q(2,'Animations','Which property keeps the final keyframe styles after the animation ends?',['`animation-fill-mode: forwards;`'],['`animation-hold: true;`','`animation-end: keep;`','`animation-persist: yes;`'],'Without it the element snaps back to its original style.');
Q(2,'Animations','In keyframes, which two keywords stand for 0% and 100%?',['`from` and `to`'],['`start` and `end`','`begin` and `finish`','`first` and `last`'],'You can also use percentages for in-between steps.');
Q(2,'Transforms','Which property applies a 2D or 3D transformation?',['`transform`'],['`transition`','`translate-all`','`morph`'],'`transform: rotate(45deg);`');
Q(2,'Transforms','Which are 2D transform functions? (select all that apply)',['`rotate()`','`scale()`','`translate()`'],['`rotateX()`','`perspective()`'],'`rotateX()` and `perspective()` are used for 3D.');
Q(2,'Transforms','What does `translate(50px, 100px)` do?',['Moves the element 50px right and 100px down'],['Moves it 50px down and 100px right','Rotates it','Scales it'],'The first value is X (horizontal), the second is Y (vertical).');
Q(2,'Transforms','What does `scale(2)` do?',['Doubles the size of the element'],['Halves the size','Rotates 2 degrees','Moves it 2px'],'`scale(0.5)` would halve it.');
Q(2,'Transforms','What does `rotate(90deg)` do?',['Rotates the element clockwise by 90 degrees'],['Rotates it counterclockwise','Flips it vertically','Skews it 90px'],'Positive angles turn clockwise.');
Q(2,'Transforms','Which function slants an element along an axis?',['`skew()`'],['`slant()`','`tilt()`','`lean()`'],'`skew(20deg)` slants it.');
Q(2,'Transforms','Which are 3D transform functions? (select all that apply)',['`rotateX()`','`rotateY()`','`translateZ()`'],['`rotate()`','`skew()`'],'3D adds a Z axis.');
Q(2,'Transforms','Which property sets the point an element rotates or scales around?',['`transform-origin`'],['`rotate-center`','`pivot`','`origin-point`'],'The default is the center of the element (50% 50%).');
Q(2,'Transforms','Which property gives a 3D scene its depth effect?',['`perspective`'],['`depth`','`z-view`','`3d-mode`'],'Set on the parent: `perspective: 800px;`');
Q(2,'Transforms','Does a transform change the layout space the element occupies?',['No, other elements do not move to make room'],['Yes, always','Only scale does','Only rotate does'],'Transforms are applied visually after layout.');
Q(2,'Transitions','What does a CSS transition do?',['Animates a property change smoothly over time'],['Loads a new page','Hides the element','Plays a video'],'Transitions need a trigger such as :hover and two states.');
Q(2,'Transitions','Which property sets how long a transition takes?',['`transition-duration`'],['`transition-time`','`transition-length`','`transition-speed`'],'`transition-duration: 0.3s;`');
Q(2,'Transitions','Which property sets the speed curve of a transition?',['`transition-timing-function`'],['`transition-speed`','`transition-curve`','`transition-ease`'],'Values include ease, linear, ease-in, ease-out and ease-in-out.');
Q(2,'Transitions','Which property delays the start of a transition?',['`transition-delay`'],['`transition-wait`','`transition-pause`','`transition-after`'],'`transition-delay: 1s;`');
Q(2,'Transitions','Which property selects WHAT will animate in a transition?',['`transition-property`'],['`transition-target`','`transition-style`','`transition-name`'],'`transition-property: width;` or `all`.');
Q(2,'Transitions','What does the `linear` timing function mean?',['Constant speed from start to finish'],['Starts slow, ends fast','Starts fast, ends slow','Bounces'],'`ease` (the default) starts slowly, speeds up and then slows at the end.');
Q(2,'Transitions','Which declaration is a valid transition shorthand?',['`transition: width 0.5s ease 1s;`'],['`transition: 0.5s width;;`','`transition: ease width;`','`transition = width 0.5s;`'],'Order: property duration timing-function delay.');
Q(2,'Transitions','Where should the `transition` property usually be placed so it works both ways (hover in and out)?',['On the element in its normal state'],['Only in the `:hover` rule','Only on the body','In a comment'],'Placed on the base rule, it animates entering and leaving the hover state.');
Q(2,'Transitions','What is the difference between a transition and an animation?',['An animation can run automatically with many keyframes; a transition needs a state change and goes from one value to another'],['They are the same thing','Transitions use @keyframes','Animations only work on text'],'Animations use `@keyframes`. Transitions interpolate between two states.');
Q(2,'Responsive CSS','Which at-rule applies styles only at certain screen widths?',['`@media`'],['`@screen-size`','`@responsive`','`@viewport-rule`'],'`@media (max-width: 600px) { ... }`');
Q(2,'Responsive CSS','Which unit is a percentage of the viewport WIDTH?',['`vw`'],['`vh`','`rem`','`pt`'],'`1vw` is 1% of the viewport width. `vh` is of the height.');
Q(2,'Responsive CSS','Which is a relative (flexible) unit? (select all that apply)',['`%`','`em`','`vw`'],['`px`','`cm`'],'Pixels and centimeters are fixed (absolute).');
Q(2,'Accessibility','Which CSS practice improves accessibility?',['Using sufficient color contrast between text and background'],['Removing focus outlines','Using tiny text','Hiding all alt text'],'Good contrast helps low-vision users. Do not remove focus indicators without a replacement.');
Q(2,'Accessibility','Why avoid removing `outline` from focused elements?',['Keyboard users need to see where they are'],['It makes pages slower','Outlines are required by HTML','It breaks the cascade'],'The focus indicator is essential to keyboard navigation.');
Q(2,'Accessibility','Which relative unit best helps users who change their default browser font size?',['`rem` or `em`'],['`px`','`pt`','`cm`'],'Relative units scale with the user\'s preferred size.');

// ===== Unit 3: JavaScript =====
Q(3,'Basics','What is JavaScript?',['A scripting language that adds behavior and interactivity to web pages'],['A markup language','A stylesheet language','A database'],'JavaScript runs in the browser (and elsewhere) and can change the page, react to events and talk to servers.');
Q(3,'Basics','Is JavaScript the same as Java?',['No, they are different languages'],['Yes, JavaScript is a lightweight Java','Yes, Java runs inside JavaScript','Java is a subset of JavaScript'],'They share part of a name and some syntax, but are unrelated languages.');
Q(3,'Basics','Where does client-side JavaScript normally run?',['In the user\'s web browser'],['Only on the web server','In the database','In the router'],'The browser has a JavaScript engine.');
Q(3,'Including JS','Which element holds JavaScript inside an HTML page?',['`<script>`'],['`<js>`','`<javascript>`','`<code>`'],'`<script> ... <\/script>`');
Q(3,'Including JS','How do you include an external JavaScript file?',['`<script src="app.js"><\/script>`'],['`<script href="app.js"><\/script>`','`<link src="app.js">`','`<js file="app.js">`'],'Use the `src` attribute. The tag still needs a closing tag.');
Q(3,'Including JS','What is the file extension for a JavaScript file?',['.js'],['.java','.jscript','.script'],'External scripts are `.js` files.');
Q(3,'Including JS','Can an external `<script src="...">` element also contain inline code?',['No, the inline code is ignored when src is present'],['Yes, both run','Yes, inline runs first','It causes a syntax error'],'Use separate script elements.');
Q(3,'Including JS','Which attribute tells the browser to run an external script after the HTML has been parsed, in order?',['`defer`'],['`wait`','`later`','`hold`'],'`defer` downloads in parallel and runs after parsing. `async` runs as soon as downloaded, in any order.');
Q(3,'Including JS','Where is the traditional best place for a script that uses page elements, if you are not using defer?',['At the end of `<body>`'],['In the doctype','Before `<html>`','Inside a CSS rule'],'Elements must exist before the script tries to find them.');
Q(3,'Including JS','How do you write a single-line JavaScript comment?',['`// comment`'],['`<!-- comment -->`','`# comment`','`-- comment`'],'`/* ... */` is the multi-line form.');
Q(3,'Including JS','How do you write a multi-line JavaScript comment?',['`/* comment */`'],['`// comment //`','`<!-- comment -->`','`** comment **`'],'Same style as CSS block comments.');
Q(3,'Output','Which method writes a message to the browser console for debugging?',['`console.log()`'],['`print()`','`debug.write()`','`echo()`'],'Open the developer tools console to view it.');
Q(3,'Output','Which method shows a dialog with a message and an OK button?',['`alert()`'],['`prompt()`','`confirm()`','`message()`'],'`alert("Hello")`');
Q(3,'Output','Which method shows a dialog with OK and Cancel and returns true or false?',['`confirm()`'],['`alert()`','`prompt()`','`ask()`'],'OK returns true and Cancel returns false.');
Q(3,'Output','Which method shows a dialog with a text box and returns what the user typed?',['`prompt()`'],['`alert()`','`confirm()`','`input()`'],'`prompt("Name?")` returns a string, or null if cancelled.');
Q(3,'Output','What does `prompt()` return if the user presses Cancel?',['`null`'],['An empty string','`false`','`undefined`'],'Pressing OK with an empty box returns an empty string.');
Q(3,'Output','Which method writes content directly into the HTML document?',['`document.write()`'],['`window.print()`','`console.print()`','`page.write()`'],'Calling `document.write()` after the page has loaded replaces the whole page, so it is mostly used for teaching.');
Q(3,'Output','What happens if `document.write()` is called AFTER the page has finished loading?',['It overwrites the existing page content'],['It appends to the end of the body','Nothing','It writes to the console'],'This is one reason to avoid it.');
Q(3,'Variables','Which keywords declare a variable? (select all that apply)',['`var`','`let`','`const`'],['`int`','`string`'],'JavaScript is loosely typed, so there are no `int` or `string` declarations.');
Q(3,'Variables','What is `const` used for?',['Declaring a variable that cannot be reassigned'],['Declaring a constant string only','Declaring a global function','Importing a module'],'A `const` binding cannot be reassigned, though an object it points to can still be changed.');
Q(3,'Variables','Which is a valid variable name?',['`_total`'],['`2total`','`my-total`','`my total`'],'Names can contain letters, digits, `_` and `$` but cannot start with a digit or include hyphens or spaces.');
Q(3,'Variables','Is `myVar` the same variable as `myvar`?',['No, JavaScript is case sensitive'],['Yes','Only inside functions','Only with `var`'],'Case matters in variable names and keywords.');
Q(3,'Variables','Which is a reserved word that cannot be used as a variable name?',['`class`'],['`name`','`total`','`data`'],'Reserved words include `class`, `function`, `var`, `if` and `return`.');
Q(3,'Variables','What value does a declared but unassigned variable hold?',['`undefined`'],['`null`','`0`','An empty string'],'`let x;` gives `undefined`.');
Q(3,'Variables','What is the scope of a variable declared with `var` inside a function?',['The function'],['The whole program','The nearest block only','The page'],'`var` is function-scoped. `let` and `const` are block-scoped.');
Q(3,'Variables','A variable declared OUTSIDE any function is:',['Global'],['Local','Private','Constant'],'Global variables are visible everywhere in the script.');
Q(3,'Variables','What is the scope of a `let` variable declared inside an `if` block?',['That block only'],['The enclosing function','The whole page','Nothing, it is an error'],'`let` and `const` are block-scoped.');
Q(3,'Data types','Which are primitive data types in JavaScript? (select all that apply)',['number','string','boolean'],['array','object'],'Arrays and objects are reference types. The primitives are number, string, boolean, null, undefined (plus symbol and bigint).');
Q(3,'Data types','Which operator returns the type of a value as a string?',['`typeof`'],['`typeis`','`kindof`','`gettype`'],'`typeof "hi"` is `"string"`.');
Q(3,'Data types','What does `typeof 42` return?',['`"number"`'],['`"integer"`','`"int"`','`"numeric"`'],'JavaScript has one number type for integers and decimals.');
Q(3,'Data types','What does `typeof "42"` return?',['`"string"`'],['`"number"`','`"text"`','`"char"`'],'Anything in quotes is a string.');
Q(3,'Data types','What does `typeof true` return?',['`"boolean"`'],['`"bool"`','`"logical"`','`"number"`'],'Booleans are `true` and `false`.');
Q(3,'Data types','What does `typeof undefined` return?',['`"undefined"`'],['`"null"`','`"object"`','`"void"`'],'`undefined` has its own type.');
Q(3,'Data types','What does `typeof null` return (a long-standing quirk)?',['`"object"`'],['`"null"`','`"undefined"`','`"empty"`'],'This is a historical bug kept for compatibility.');
Q(3,'Data types','Which data type represents "no value" assigned on purpose?',['`null`'],['`undefined`','`NaN`','`0`'],'`null` is assigned deliberately. `undefined` means not assigned.');
Q(3,'Data types','What does `NaN` stand for?',['Not a Number'],['No actual Number','Null and Nothing','Negative and Numeric'],'`NaN` is the result of an invalid numeric operation like `"abc" * 2`.');
Q(3,'Data types','Which function checks whether a value is `NaN` after conversion?',['`isNaN()`'],['`isNumber()`','`isNull()`','`notNumber()`'],'`isNaN("abc")` is true, `isNaN("12")` is false.');
Q(3,'Data types','What does `isNaN("hello")` return?',['`true`'],['`false`','`undefined`','An error'],'"hello" cannot be converted to a number.');
Q(3,'Data types','What does `isNaN("25")` return?',['`false`'],['`true`','`NaN`','An error'],'"25" converts to a number, so it is not NaN.');
Q(3,'Data types','Which are Boolean values?',['`true` and `false`'],['`yes` and `no`','`1` and `0` only','`on` and `off`'],'These are the only two boolean literals.');
Q(3,'Data types','Which of these values is FALSY? (select all that apply)',['`0`','`""` (empty string)','`null`'],['`"false"`','`[]` (empty array)'],'Falsy values: false, 0, "", null, undefined, NaN. A non-empty string, even "false", and an empty array are truthy.');
Q(3,'Conversion','Which function converts a string to an integer?',['`parseInt()`'],['`toInteger()`','`parseNumber()`','`int()`'],'`parseInt("42px")` returns 42.');
Q(3,'Conversion','Which function converts a string to a decimal number?',['`parseFloat()`'],['`parseDecimal()`','`toFloat()`','`float()`'],'`parseFloat("3.14abc")` returns 3.14.');
Q(3,'Conversion','What does `parseInt("42.9")` return?',['`42`'],['`43`','`42.9`','`NaN`'],'`parseInt` stops at the decimal point and does not round.');
Q(3,'Conversion','What does `parseFloat("3.14")` return?',['`3.14`'],['`3`','`"3.14"`','`NaN`'],'It returns a number with the decimal part.');
Q(3,'Conversion','What does `parseInt("hello")` return?',['`NaN`'],['`0`','`undefined`','`null`'],'It cannot find any digits, so the result is not a number.');
Q(3,'Conversion','What does `parseInt("12abc")` return?',['`12`'],['`NaN`','`"12"`','`12abc`'],'Parsing stops at the first non-numeric character.');
Q(3,'Conversion','What does `Number("")` return?',['`0`'],['`NaN`','`null`','`undefined`'],'An empty string converts to 0 with `Number()`.');
Q(3,'Conversion','Which method converts a number to a string?',['`toString()`'],['`parseString()`','`toText()`','`stringify()`'],'`(42).toString()` gives `"42"`.');
Q(3,'Conversion','Why must you convert a value from `prompt()` before doing math with it?',['`prompt()` always returns a string'],['`prompt()` returns a boolean','`prompt()` returns undefined','It does not, it returns a number'],'`"5" + "5"` gives `"55"`, not 10.');
Q(3,'Operators','Which operator assigns a value?',['`=`'],['`==`','`===`','`=>`'],'`x = 5` assigns. `==` and `===` compare.');
Q(3,'Operators','Which operators are arithmetic operators? (select all that apply)',['`+`','`*`','`%`'],['`&&`','`==`'],'`%` is the remainder (modulus).');
Q(3,'Operators','What is `10 % 3`?',['`1`'],['`3`','`0`','`3.33`'],'The remainder of 10 divided by 3 is 1.');
Q(3,'Operators','What is `7 / 2` in JavaScript?',['`3.5`'],['`3`','`4`','`3.0` as an integer'],'JavaScript division produces a decimal result.');
Q(3,'Operators','What does `x++` do?',['Adds 1 to x'],['Doubles x','Adds 2 to x','Squares x'],'`++` is the increment operator. `--` decrements.');
Q(3,'Operators','What is the value of `x` after `let x = 5; x += 3;`?',['`8`'],['`3`','`53`','`15`'],'`+=` adds and assigns.');
Q(3,'Operators','What is the value of `2 + 3 * 4`?',['`14`'],['`20`','`24`','`10`'],'Multiplication happens before addition.');
Q(3,'Operators','What is the value of `(2 + 3) * 4`?',['`20`'],['`14`','`24`','`11`'],'Parentheses change the order.');
Q(3,'Operators','Which operator compares value AND type?',['`===`'],['`==`','`=`','`!=`'],'`5 === "5"` is false, but `5 == "5"` is true because `==` converts the type.');
Q(3,'Operators','What does `5 == "5"` evaluate to?',['`true`'],['`false`','`undefined`','An error'],'Loose equality converts the string to a number.');
Q(3,'Operators','What does `5 === "5"` evaluate to?',['`false`'],['`true`','`undefined`','An error'],'Strict equality requires the same type.');
Q(3,'Operators','Which operator means "not equal" in value?',['`!=`'],['`<>`','`=!`','`!==` only'],'`!==` is the strict (value and type) form.');
Q(3,'Operators','Which are comparison operators? (select all that apply)',['`>`','`<=`','`!==`'],['`&&`','`+=`'],'Comparison operators produce true or false.');
Q(3,'Operators','Which are logical operators? (select all that apply)',['`&&`','`||`','`!`'],['`==`','`++`'],'AND, OR and NOT.');
Q(3,'Operators','What does `true && false` evaluate to?',['`false`'],['`true`','`undefined`','`null`'],'AND needs both sides true.');
Q(3,'Operators','What does `true || false` evaluate to?',['`true`'],['`false`','`undefined`','`null`'],'OR needs at least one side true.');
Q(3,'Operators','What does `!true` evaluate to?',['`false`'],['`true`','`undefined`','`0`'],'`!` negates a boolean.');
Q(3,'Concatenation','Which operator joins two strings?',['`+`'],['`&`','`.`','`concat` keyword'],'`"Hello " + "World"`');
Q(3,'Concatenation','What is the result of `"5" + 5`?',['`"55"`'],['`10`','`55` as a number','`NaN`'],'If one side is a string, `+` concatenates.');
Q(3,'Concatenation','What is the result of `"5" - 2`?',['`3`'],['`"52"`','`"3"`','`NaN`'],'`-` only does math, so the string is converted to a number.');
Q(3,'Concatenation','What is the result of `1 + 2 + "3"`?',['`"33"`'],['`"123"`','`6`','`15`'],'1 + 2 = 3 first, then `3 + "3"` concatenates to `"33"`.');
Q(3,'Concatenation','What is the result of `"3" + 1 + 2`?',['`"312"`'],['`6`','`"33"`','`15`'],'Left to right: `"3" + 1` is `"31"`, then `"31" + 2` is `"312"`.');
Q(3,'Concatenation','Which string syntax lets you insert a variable\'s value with `${name}`?',['Backticks (a template literal)'],['Double quotes','Single quotes','Parentheses'],'Template literals use backticks. Quotes treat `${name}` as plain text.');
Q(3,'Concatenation','What does `"abc".length` return?',['`3`'],['`2`','`"3"`','`undefined`'],'`length` is a property that holds the number of characters.');
Q(3,'Methods','Which method converts a string to uppercase?',['`toUpperCase()`'],['`upperCase()`','`toUpper()`','`makeUpper()`'],'`"hi".toUpperCase()` is `"HI"`.');
Q(3,'Methods','Which method converts a string to lowercase?',['`toLowerCase()`'],['`lowerCase()`','`toLower()`','`downCase()`'],'`"HI".toLowerCase()` is `"hi"`.');
Q(3,'Methods','Does `toUpperCase()` change the original string?',['No, it returns a new string'],['Yes, it modifies it in place','Only for const','Only for var'],'Strings are immutable.');
Q(3,'Methods','Which method returns the position of text within a string?',['`indexOf()`'],['`findIndex()` for strings','`position()`','`locate()`'],'`"hello".indexOf("l")` is 2, or -1 if not found.');
Q(3,'Methods','Which method extracts part of a string?',['`substring()` or `slice()`'],['`cut()`','`extract()`','`part()`'],'`"hello".slice(1, 3)` is `"el"`.');
Q(3,'Methods','Which method removes whitespace from both ends of a string?',['`trim()`'],['`strip()`','`clean()`','`cut()`'],'`"  hi ".trim()` is `"hi"`.');
Q(3,'Methods','Which method replaces text in a string?',['`replace()`'],['`swap()`','`substitute()`','`change()`'],'`"cat".replace("c","b")` is `"bat"`.');
Q(3,'Methods','Which method rounds a number to the nearest integer?',['`Math.round()`'],['`Math.near()`','`round()` alone','`Math.int()`'],'`Math.round(2.5)` is 3. `Math.floor` rounds down and `Math.ceil` rounds up.');
Q(3,'Methods','What does `Math.floor(4.9)` return?',['`4`'],['`5`','`4.9`','`0`'],'`floor` rounds down.');
Q(3,'Methods','What does `Math.ceil(4.1)` return?',['`5`'],['`4`','`4.1`','`0`'],'`ceil` rounds up.');
Q(3,'Methods','What does `Math.random()` return?',['A decimal number from 0 up to but not including 1'],['An integer from 1 to 10','A decimal from 1 to 100','A random string'],'Multiply and floor it to get an integer range.');
Q(3,'Methods','Which method returns the larger of numbers?',['`Math.max()`'],['`Math.big()`','`Math.top()`','`Math.most()`'],'`Math.max(3, 9, 4)` is 9.');
Q(3,'Methods','Which method rounds a number to a fixed number of decimal places and returns a string?',['`toFixed()`'],['`toDecimal()`','`round()`','`toPlaces()`'],'`(3.14159).toFixed(2)` is `"3.14"`.');
Q(3,'Objects','How do you create an object literal?',['`let car = { make: "Ford", year: 2020 };`'],['`let car = [make: "Ford"];`','`let car = (make = "Ford");`','`let car = <make="Ford">;`'],'Curly braces hold property: value pairs.');
Q(3,'Objects','How do you read the `make` property of `car`?',['`car.make`'],['`car->make`','`car::make`','`car[make]` without quotes'],'Dot notation, or `car["make"]` with bracket notation.');
Q(3,'Objects','What is a method in JavaScript?',['A function stored as a property of an object'],['A variable','A CSS rule','A comment'],'Example: `obj.greet = function() { ... }`.');
Q(3,'Objects','What is the difference between a property and a method?',['A property holds data; a method is a function'],['They are the same','A method holds data; a property is a function','Properties only exist on arrays'],'Methods are called with parentheses.');
Q(3,'Objects','What does `this` refer to inside an object\'s method?',['The object the method belongs to'],['The window always','The previous function','The HTML body'],'In a method call `obj.fn()`, `this` is `obj`.');
Q(3,'Objects','How do you create an array?',['`let items = ["a", "b", "c"];`'],['`let items = {"a", "b", "c"};`','`let items = ("a", "b", "c");`','`let items = <a, b, c>;`'],'Arrays use square brackets.');
Q(3,'Objects','What is the index of the FIRST item in an array?',['`0`'],['`1`','`-1`','`first`'],'Arrays are zero-indexed.');
Q(3,'Objects','Which method adds an item to the END of an array?',['`push()`'],['`pop()`','`shift()`','`add()`'],'`pop()` removes the last item. `shift()` removes the first.');
Q(3,'Objects','Which method removes the LAST item from an array?',['`pop()`'],['`push()`','`shift()`','`remove()`'],'`pop()` returns the removed item.');
Q(3,'Objects','Which property gives the number of items in an array?',['`length`'],['`size`','`count`','`items`'],'`arr.length`');
Q(3,'DOM','What does DOM stand for?',['Document Object Model'],['Data Object Method','Display Output Mode','Document Order Map'],'The DOM represents the page as a tree of objects.');
Q(3,'DOM','What is the DOM?',['A tree-like representation of the page that scripts can read and change'],['A CSS file','A type of server','A browser plugin'],'JavaScript uses the DOM to modify HTML and CSS.');

Q(4,'API basics','What does API stand for?',['Application Programming Interface'],['Applied Program Integration','Automated Page Interaction','Application Process Index'],'An API is a defined way for software to talk to other software.');

Q(4,'XMLHttpRequest','Which property holds the server\'s response as text?',['`responseText`'],['`responseData`','`textResult`','`result`'],'`responseXML` holds a parsed XML document.');
Q(4,'XMLHttpRequest','Which event handler runs each time the request\'s state changes?',['`onreadystatechange`'],['`onstatechange`','`onchange`','`onrequest`'],'Check `readyState` and `status` inside it.');
Q(4,'XMLHttpRequest','What `readyState` value means the request is complete and the response is ready?',['`4`'],['`0`','`1`','`2`'],'0 unsent, 1 opened, 2 headers received, 3 loading, 4 done.');
Q(4,'XMLHttpRequest','Which HTTP status code means success?',['`200`'],['`404`','`500`','`301`'],'404 not found, 500 server error, 301 moved.');
Q(4,'XMLHttpRequest','Which HTTP status code means the resource was NOT found?',['`404`'],['`200`','`500`','`403`'],'403 is forbidden and 500 is a server error.');
Q(4,'XMLHttpRequest','When should the response be used inside `onreadystatechange`?',['When `readyState` is 4 and `status` is 200'],['When `readyState` is 0','Always','When `status` is 404'],'That means done and OK.');
Q(4,'XMLHttpRequest','Which HTTP method is normally used to REQUEST data without changing anything on the server?',['GET'],['POST','DELETE','PUT'],'GET reads. POST usually sends data to be processed.');
Q(4,'XMLHttpRequest','What is the same-origin policy?',['A browser rule that restricts a script from reading responses from a different origin'],['A rule that all pages use the same CSS','A rule for image sizes','A rule that URLs must be lowercase'],'Origin means protocol, host and port. CORS can relax it.');
Q(4,'AJAX','Which is a benefit of AJAX?',['Part of a page can update without a full reload'],['It removes the need for a server','It makes HTML valid','It replaces CSS'],'Examples: live search suggestions, chat, form checks.');
Q(4,'AJAX','Which data format is most commonly returned by modern APIs?',['JSON'],['BMP','PDF','MP3'],'JSON is lightweight and works well with JavaScript.');
Q(4,'AJAX','Which method converts a JSON string into a JavaScript object?',['`JSON.parse()`'],['`JSON.stringify()`','`JSON.decode()` only','`JSON.make()`'],'`JSON.stringify()` does the reverse.');
Q(4,'AJAX','Which method converts a JavaScript object into a JSON string?',['`JSON.stringify()`'],['`JSON.parse()`','`JSON.encode()`','`JSON.toString()` for objects'],'Use it before storing or sending an object.');
Q(4,'AJAX','Is this valid JSON?',['Yes'],['No, keys must be in double quotes','No, strings must use single quotes','No, braces are not allowed'],'JSON keys and strings use double quotes, which this has.','{ "name": "Ann", "age": 30 }');
Q(4,'AJAX','Is this valid JSON?',['No'],['Yes','Yes, if wrapped in a function','Yes, with a semicolon'],'JSON requires double-quoted keys and strings.','{ name: \'Ann\' }');
Q(4,'AJAX','Which modern browser API makes network requests and returns Promises?',['`fetch()`'],['`getData()`','`request()`','`load()`'],'`fetch(url).then(r => r.json())`');
Q(4,'jQuery AJAX','Which jQuery method loads data from a server into a selected element?',['`.load()`'],['`.fetch()`','`.pull()`','`.ajaxLoad()`'],'`$("#box").load("page.html")`');
Q(4,'jQuery AJAX','Which jQuery method performs a general asynchronous request?',['`$.ajax()`'],['`$.request()`','`$.send()`','`$.async()`'],'`$.get()` and `$.post()` are shortcuts.');
Q(4,'jQuery','What is one benefit of loading jQuery from a CDN?',['The file may already be cached in the visitor\'s browser'],['It is required by browsers','It removes the need for HTML','It encrypts the script'],'A CDN (content delivery network) serves it fast from nearby servers.');
Q(4,'jQuery','Which jQuery method fades an element out?',['`.fadeOut()`'],['`.fade(0)`','`.disappear()`','`.dim()`'],'`.fadeIn()` and `.fadeToggle()` also exist.');
Q(4,'jQuery','Which jQuery method slides an element up to hide it?',['`.slideUp()`'],['`.slideHide()`','`.up()`','`.collapse()`'],'`.slideDown()` shows.');
Q(4,'jQuery','Which jQuery method runs a custom animation of CSS properties?',['`.animate()`'],['`.move()`','`.tween()`','`.motion()`'],'`$("#box").animate({left: "250px"})`');
