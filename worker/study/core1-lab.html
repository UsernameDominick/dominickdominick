e the RAM","explanation":"Since memory utilization is low, we can rule out any out-of-memory conditions. Bad RAM would cause the system to crash and perform erratically, but the hard drive access would not be affected."},{"letter":"B","text":"Replace the hard drive","explanation":"Slow file access and a low amount of memory and CPU utilization indicates a problem with the hard drive. Performing a backup and replacing the drive should return the system to normal operation"},{"letter":"C","text":"Upgrade the BIOS","explanation":"A problem with the BIOS version would not cause drive access failures. Upgrading the BIOS would have no impact on file access issue in this scenario."},{"letter":"D","text":"Boot to Safe Mode","explanation":"It would be uncommon for an application or service to cause such a dramatic impact to the hard drive performance, so starting in Safe Mode would not provide any significant advantage."},{"letter":"E","text":"Upgrade the power supply","explanation":"There's no evidence that the power supply is faulty. Since the rest of the computer is working properly, it's unlikely that a new power supply would resolve this issue."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"C85","stem":"A user in the marketing department was using their computer to send some email messages. The computer made an unexpected loud pop and immediately powered down. The computer would not respond to additional attempts to power it back on. Which of the following would be the most likely cause of this issue?","choices":[{"letter":"A","text":"Incorrect video refresh rate","explanation":"Setting a video adapter to a different refresh rate than the monitor will result in either a blank screen or very distorted screen images. An incorrect refresh rate will not make popping noises or power down a computer."},{"letter":"B","text":"Faulty capacitor","explanation":"Not all capacitors pop when they fail, but often a loud pop inside of a computer is related to a blown capacitor. The second symptom of the immediate powering off of the system also helps make the case that a capacitor is to blame"},{"letter":"C","text":"Incomplete software update","explanation":"An incomplete software update isn't going to make any noises inside of your computer. An incomplete update may cause your computer to fail after a reboot, but it won't power down your system."},{"letter":"D","text":"Bad memory module","explanation":"Bad RAM (Random Access Memory) will usually cause applications or the operating system to show faults, including error messages and Windows Stop screens."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"C86","stem":"A manager in the shipping department needs to connect their laptop to wireless portable speakers while in the office. Which of these should be configured on their laptop?","choices":[{"letter":"A","text":"Tethering","explanation":"Tethering is used when a laptop needs to use resources that would normally be accessible from a smart phone, such as Internet access. The laptop would first connect to the mobile device using a USB cable or Bluetooth. Once connected, the laptop could access the Internet over this tethered link."},{"letter":"B","text":"Bluetooth","explanation":"Most external portable speakers use Bluetooth to receive audio signals from a mobile device. Bluetooth has the best fit for connectivity options, distance requirements, and bandwidth for sending audio data"},{"letter":"C","text":"NFC","explanation":"NFC (Near Field Communication) is a short-distance low-bandwidth network connection designed for temporary use. For example, the NFC connection in a smart phone or smart watch at a store checkout can be used as a payment method."},{"letter":"D","text":"RFID","explanation":"RFID (Radio Frequency Identification) is a tracking technology used in access badges, inventory management, and even animal identification. RFID technology is not used for wireless audio connections."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"C87","stem":"A technician has two hard disk drives that need to be configured redundantly, and all information should be duplicated across physical drives. Which of the following should be configured?","choices":[{"letter":"A","text":"RAID 5","explanation":"RAID level 5 provides redundancy through the use of parity. RAID 5 does not duplicate information across physical drives."},{"letter":"B","text":"RAID 1","explanation":"A RAID 1 (Redundant Array of Independent Disks) array keeps an exact duplicate of data across multiple drives. If one drive fails, the other drive containing the duplicated data continues to provide access to the data"},{"letter":"C","text":"RAID 6","explanation":"RAID 6 provides redundancy by striping data across multiple physical drives in a method very similar to RAID 5. Unlike RAID 5, RAID 6 uses an additional parity block to add redundancy for two potential drive failures."},{"letter":"D","text":"RAID 0","explanation":"RAID 0 does not provide any redundancy or duplication of data. If a single drive in RAID 0 was to fail, the data on the array would be unavailable and recovery of the data would require a recent backup."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","source":"book"},{"id":"C88","stem":"A system administrator has connected a desktop computer to a new LCD. After connecting the monitor, all of the desktop icons and windows appear oversized and the display appears to be fuzzy and out of focus. Which of the following would be the best way to correct this issue?","choices":[{"letter":"A","text":"Modify the display resolution","explanation":"The display resolution determines how many horizontal and vertical pixels are used when displaying information on a screen. If the resolution is set relatively low, the screen information will appear larger than a higher resolution and the output would appear blurry or fuzzy. To correct this oversized view, the system administrator will need to configure a higher resolution setting on the desktop computer"},{"letter":"B","text":"Use a different LCD display","explanation":"Although it's possible a different LCD display with a different native resolution may resolve this issue of oversized text and graphics, it's a much more cumbersome solution than the few seconds it would take to configure a different display resolution on the computer."},{"letter":"C","text":"Replace the monitor cable","explanation":"A bad monitor cable would cause the image to dropout or appear difficult to read, and it would not cause the display images to be oversized."},{"letter":"D","text":"Restart the desktop computer","explanation":"Restarting the desktop computer would show the same resolution after the restart. The desktop operating system would need to be configured with a different resolution before the image on the screen would change."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"C89","stem":"The camera on a user's smartphone works properly when at home, but the user is not able to take pictures while at their desk at work. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"NFC","explanation":"NFC (Near-Field Communication) is a networking technology used to transfer data over a very short distance. Enabling NFC would not disable any of the camera features."},{"letter":"B","text":"Biometrics","explanation":"Biometrics are commonly used as an authentication method to validate the physical characteristics of the user. This authentication factor does not commonly enable or disable camera features on a smartphone or mobile device."},{"letter":"C","text":"Bluetooth pairing","explanation":"The Bluetooth pairing process is used to wirelessly connect an external peripheral to a smartphone, tablet, or other mobile device. Pairing a Bluetooth device does not affect the use of the built-in camera on the smartphone."},{"letter":"D","text":"MDM","explanation":"An MDM (Mobile Device Manager) is a centralized administration tool for mobile devices. The administrator can enable or disable certain features, and some of those features can be disabled based on the device's current location"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Management","link":"https://professormesser.link/1201010302","source":"book"},{"id":"C90","stem":"A system administrator is installing a new LCD projector in the company conference room. Which of the following would most likely be used with this projector?","choices":[{"letter":"A","text":"Lightning","explanation":"The Apple Lightning connector is used for mobile devices to connect to external peripherals. Although the lightning connector could be used to connect an Apple mobile device to an LCD projector, it's much more common to use an HDMI connector."},{"letter":"B","text":"UTP","explanation":"UTP (Unshielded Twisted-Pair) cabling is commonly used for Ethernet networks, and it is not a common cable type for video output."},{"letter":"C","text":"Coaxial","explanation":"Coaxial cables can be used for some video output formats, but a much more common video interface type would be HDMI."},{"letter":"D","text":"HDMI","explanation":"HDMI (High-Definition Multimedia Interface) is a common interface for transmitting audio and video to televisions, displays, and projectors"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.2 - Video Cables","link":"https://professormesser.link/1201030205","source":"book"}],"H":[{"id":"X1","tier":"moderate","stem":"A company needs a storage array that can survive the failure of any ONE drive while still using drive space efficiently, rather than losing half of all capacity to duplication. Which RAID level best fits?","choices":[{"letter":"A","text":"RAID 0","explanation":"RAID 0 stripes data across drives for speed but provides NO redundancy at all - a single drive failure loses the entire array."},{"letter":"B","text":"RAID 1","explanation":"RAID 1 mirrors data and does survive one drive failure, but it duplicates everything, so exactly half of the total raw capacity is consumed - which the question rules out."},{"letter":"C","text":"RAID 5","explanation":"Correct. RAID 5 stripes with distributed parity, surviving any single drive failure while sacrificing only one drive's worth of capacity to parity - far more efficient than mirroring."},{"letter":"D","text":"JBOD","explanation":"JBOD (Just a Bunch Of Disks) simply concatenates drives with no redundancy - a drive failure results in data loss."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","source":"original"},{"id":"X3","tier":"moderate","stem":"A video editing workstation needs the fastest possible read and write throughput from two drives, and all working files are backed up elsewhere so redundancy is not a concern. Which RAID level is the best fit?","choices":[{"letter":"A","text":"RAID 0","explanation":"Correct. RAID 0 stripes data across drives with no parity or mirroring overhead, delivering the highest performance - acceptable here because redundancy isn't needed and backups exist elsewhere."},{"letter":"B","text":"RAID 1","explanation":"RAID 1 mirrors data for redundancy, but write performance gains nothing from mirroring and half the capacity is lost - unnecessary when redundancy isn't a requirement."},{"letter":"C","text":"RAID 5","explanation":"RAID 5 must calculate and write parity on every write, which adds overhead compared to a pure stripe - slower than RAID 0 for this use case."},{"letter":"D","text":"RAID 6","explanation":"RAID 6 writes double parity, adding even more write overhead than RAID 5 - the slowest option here for a pure-performance requirement."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","source":"original"},{"id":"X6","tier":"moderate","stem":"A technician needs to connect a modern external SSD that supports high-speed data transfer AND can be plugged in without regard to orientation. Which connector meets both requirements?","choices":[{"letter":"A","text":"USB-C","explanation":"Correct. USB-C supports high-speed data transfer and is physically reversible, so it can be inserted in either orientation."},{"letter":"B","text":"Micro-USB","explanation":"Micro-USB is not reversible - it only inserts one way - and supports considerably lower transfer speeds than USB-C."},{"letter":"C","text":"Lightning","explanation":"Lightning is reversible, but it's an Apple proprietary connector for mobile devices, not the standard high-speed external SSD interface."},{"letter":"D","text":"USB-A","explanation":"Standard USB-A is not reversible and its rectangular shape only inserts in one orientation."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Peripheral Cables","source":"original"},{"id":"X9","tier":"moderate","stem":"A technician needs to allow encrypted remote command-line access to a Linux server through the firewall. Which port should be permitted?","choices":[{"letter":"A","text":"tcp/22","explanation":"Correct. SSH (Secure Shell) uses tcp/22 to provide encrypted terminal/console access to a remote device."},{"letter":"B","text":"tcp/23","explanation":"tcp/23 is Telnet, which provides remote console access but transmits everything in clear text - it is not encrypted."},{"letter":"C","text":"tcp/443","explanation":"tcp/443 is HTTPS for encrypted web traffic, not command-line/terminal access."},{"letter":"D","text":"tcp/3389","explanation":"tcp/3389 is RDP, which provides a remote graphical desktop for Windows rather than a Linux command line."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.1 - Common Ports","source":"original"},{"id":"X25","tier":"moderate","stem":"A device forwards traffic between two different IP networks based on the destination IP address. Which device is this?","choices":[{"letter":"A","text":"Router","explanation":"Correct. A router forwards traffic between separate IP networks by making decisions based on the destination IP address."},{"letter":"B","text":"Switch","explanation":"A switch forwards frames within a single network based on the destination MAC address, not between different IP networks."},{"letter":"C","text":"Patch panel","explanation":"A patch panel is a passive termination point for physically organizing cable runs - it makes no forwarding decisions at all."},{"letter":"D","text":"Repeater","explanation":"A repeater regenerates a signal to extend its distance; it doesn't examine addresses or route between networks."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","source":"original"},{"id":"A25","stem":"Which of these technologies do not require a backlight to provide a viewable display?","choices":[{"letter":"A","text":"LCD","explanation":"An LCD (Liquid Crystal Display) screen does not produce any light, so a backlight is required to see the screen contents. Most LCD displays use LEDs (Light Emitting Diodes) or CCFLs (Cold Cathode Fluorescent Lamps) as a backlight."},{"letter":"B","text":"IPS","explanation":"IPS (In Plane Switching) LCD monitors provide excellent color representation, but they are still LCDs and require a backlight."},{"letter":"C","text":"OLED","explanation":"An OLED (Organic Light Emitting Diode) display emits light when a current is provided to an organic compound. A backlight would not be necessary with an OLED display"},{"letter":"D","text":"Mini LED","explanation":"Mini LED is a type of backlight commonly used on LCD displays to distribute many small backlight LEDs across the entire display area."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","tier":"hard","source":"book"},{"id":"A77","stem":"An engineering firm is upgrading their storage array to include additional drive space for documents and designs. The primary goal is to provide high performance and uptime, even if two drives were to fail. Which of the following would be the best choice for this firm?","choices":[{"letter":"A","text":"RAID 1","explanation":"RAID 1 is also called mirroring, because file blocks are duplicated between two or more physical drives. Losing a single drive in a RAID 1 array will still allow access to the data on the other mirrored drive, but losing two drives would cause the data to be inaccessible."},{"letter":"B","text":"RAID 5","explanation":"RAID 5 is striping with parity, where file blocks are striped across multiple storage drives and one storage drive maintains parity data. Data would still be available after a single drive failure in RAID 5, but two failed drives would cause data loss."},{"letter":"C","text":"RAID 0","explanation":"RAID 0 is also called striping, where file blocks are split across multiple physical drives. However, RAID 0 does not include any redundancy features. A single drive failure in RAID 0 results in data loss."},{"letter":"D","text":"RAID 10","explanation":"RAID (Redundant Array of Independent Disks) is a method of combining storage drives together to add speed and/or redundancy. A RAID 10 array is a nested RAID configuration that creates a mirrored set of RAID 0 drives. As long as only one drive fails in each RAID 0 mirror, the redundancy will remain valid and the user's data will continue to be available"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","tier":"hard","source":"book"},{"id":"A79","stem":"A company needs to purchase a new printer for an open work area. The primary requirement of this printer is to be as quiet as possible. Which of these printer types would be the best fit for this requirement?","choices":[{"letter":"A","text":"Dot-matrix","explanation":"Dot matrix printers are probably the loudest option in this list. The metal pins in a dot matrix print head are impacting the page, and that printing process makes a significant amount of noise."},{"letter":"B","text":"Inkjet","explanation":"An inkjet printer's printing process is a bit quieter than a dot matrix printer, but it's not as quiet as thermal printing. The sound of the carriage moving the print heads across the page and the printing process itself would not provide the quietest printing option given the available options."},{"letter":"C","text":"Laser","explanation":"A laser printer uses many moving parts, high voltages, and a large motor to print a single page. This process makes more noise than a thermal printer, so it wouldn't fit the requirements."},{"letter":"D","text":"Thermal","explanation":"Of the available options, thermal printers are the quietest. The only moving parts in a thermal printer are the motors that push the paper through the printer, and those motors are small and run almost silently"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.8 - Thermal Printers","link":"https://professormesser.link/1201030805","tier":"hard","source":"book"},{"id":"A86","stem":"Which of the following can be used to forward traffic based on a destination MAC address?","choices":[{"letter":"A","text":"Unmanaged switch","explanation":"Switches determine how traffic is forwarded based on the destination MAC (Media Access Control) address in the frame. The qualification of managed or unmanaged is not important in this case, since both types of switches make forwarding decisions the same way. The difference between a managed and unmanaged switch are based on features not associated with the forwarding process"},{"letter":"B","text":"PoE injector","explanation":"A PoE (Power over Ethernet) injector sits inline in an Ethernet link and adds voltage to support PoE devices at the end of the wire."},{"letter":"C","text":"Router","explanation":"A router makes forwarding decisions based on the destination IP (Internet Protocol) address of a packet."},{"letter":"D","text":"Firewall","explanation":"A firewall controls the flow of traffic based on a set of predefined security policies. If the traffic flow matches one of the policies, the firewall can be configured to allow or block that traffic flow."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","tier":"hard","source":"book"},{"id":"B6","stem":"A server administrator has four identical drives to install into a database server. Which of these RAID types would provide both redundancy and the most available storage space?","choices":[{"letter":"A","text":"RAID 5","explanation":"With RAID 5, three drives would contain user data and the fourth drive would store parity information. This efficient use of space and the included redundancy make RAID 5 the best option"},{"letter":"B","text":"RAID 10","explanation":"A RAID 10 array can be created with four drives, but two of those drives will be mirrored drives, effectively limiting the available storage space by 50 percent."},{"letter":"C","text":"RAID 0","explanation":"RAID 0, or striping, does not provide any redundancy and would not meet the requirements in this question."},{"letter":"D","text":"RAID 1","explanation":"RAID 1 is mirroring, and half of the available storage space would be dedicated to storing redundant data."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","tier":"hard","source":"book"},{"id":"B40","stem":"What cloud-based service provides hardware, but still requires the user to setup, configure, and manage the operating system and applications?","choices":[{"letter":"A","text":"SaaS","explanation":"SaaS (Software as a Service) is a complete application offering in the cloud. The customer does not install, manage, or support the applications used with a SaaS deployment."},{"letter":"B","text":"PaaS","explanation":"PaaS (Platform as a Service) is a cloud model for an application framework in the cloud. The customer is responsible for developing their own application based on this cloud-based framework."},{"letter":"C","text":"IaaS","explanation":"IaaS (Infrastructure as a Service) is an option that provides CPU, memory, network connections, and storage, and the customer installs and manages all of the software running on the infrastructure hardware"},{"letter":"D","text":"DaaS","explanation":"DaaS (Desktop as a Service) provides cloud-based desktop access and centralized workstation management."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","tier":"hard","source":"book"},{"id":"B48","stem":"A system administrator needs to install an access point using PoE. However, the installed Ethernet switch does not support any PoE interfaces. Which of the following would be the best way to provide PoE functionality?","choices":[{"letter":"A","text":"Use a different access point","explanation":"The goal of PoE is to provide power to a device in an area where a traditional power connection would be difficult or impossible. Replacing the access point would not solve the problem of powering the access point."},{"letter":"B","text":"Replace the switch with a router","explanation":"Switches and routers manage different parts of the communication process, and it's not possible to simply replace a router with a switch without making some changes to the underlying network infrastructure. Adding a router would also not generally provide any PoE functionality."},{"letter":"C","text":"Upgrade the switch's power supply","explanation":"The power supply of a switch is almost always configured to support all features of the switch without requiring an upgrade. Upgrading or modifying the switch power supply would not add PoE functionality to the switch."},{"letter":"D","text":"Add an injector","explanation":"An injector sits inline with an existing wired Ethernet connection to add PoE (Power over Ethernet) voltage to the existing Ethernet cable"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","tier":"hard","source":"book"},{"id":"B63","stem":"An organization has recently implemented a browser- based email system that requires no additional software on the user devices. Which of the following would describe this type of application?","choices":[{"letter":"A","text":"SaaS","explanation":"SaaS (Software as a Service) is on-demand software. The client does not maintain a local software installation, and the application support is managed by the service provider. Google Mail is an example of SaaS"},{"letter":"B","text":"IaaS","explanation":"IaaS (Infrastructure as a Service) provides hardware resources to the end user, and the user is responsible for installing an operating system and an application. A web hosting provider offering a bare metal server would be an example of IaaS."},{"letter":"C","text":"HaaS","explanation":"HaaS (Hardware as a Service) is another term for IaaS. A user is provided CPU, memory, and storage with HaaS, and will usually install an operating system and application on the hosted hardware infrastructure."},{"letter":"D","text":"PaaS","explanation":"PaaS (Platform as a Service) provides the building blocks for application developers. The servers and software are managed by the service provider, and the user is responsible for putting together the application modules to fit their needs. SalesForce.com offers a number of PaaS products."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","tier":"hard","source":"book"},{"id":"B84","stem":"A user in the shipping department needs a charging cable for their Android phone. Which of the following connectors would be the most likely to work on this phone?","choices":[{"letter":"A","text":"USB-C","explanation":"Android devices commonly used the USB standard for connectivity, and USB-C is a common connector for many mobile devices"},{"letter":"B","text":"Lightning","explanation":"Lightning connectors are proprietary to Apple. You'll see Lightning connections used exclusively on iOS devices."},{"letter":"C","text":"RJ45","explanation":"RJ45 (Registered Jack 45) is a standard connector type most commonly seen on Ethernet network cables. RJ45 would not commonly be used on mobile phones."},{"letter":"D","text":"Thunderbolt","explanation":"Thunderbolt connectors are common on desktop computers, but the Thunderbolt technology isn't used on smartphone connectors."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","tier":"hard","source":"book"},{"id":"C17","stem":"Which of these devices would be used to configure an 802.1Q trunk?","choices":[{"letter":"A","text":"Router","explanation":"A router does not connect to other routers with 802.1Q trunks."},{"letter":"B","text":"Repeater","explanation":"Repeaters are relatively straightforward devices that do not have complex connectivity to other devices."},{"letter":"C","text":"Managed switch","explanation":"A managed switch includes features not found in an unmanaged switch, such as traffic prioritization, redundancy support, remote management, and VLAN (Virtual Local Area Network) support for connectivity to other switches via 802.1Q"},{"letter":"D","text":"Cable modem","explanation":"Cable modems are designed to convert signals from coax cable networks to Ethernet. Cable modems do not interconnect VLANs with other switches using 802.1Q."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","tier":"hard","source":"book"},{"id":"C32","stem":"A user is replacing an empty paper roll in a printer with one that was purchased to match the model of the printer. Which of the following would best describe this printer type?","choices":[{"letter":"A","text":"Thermal","explanation":"Thermal printers require a specialized paper type which turns dark when heat is applied. There are many different sizes of thermal printers, so the paper is often purchased to match the specific thermal printer model"},{"letter":"B","text":"Laser","explanation":"A laser printer applies heat and pressure to toner particles during the printing process, and a laser printer commonly works with any type of copier or printer paper."},{"letter":"C","text":"Impact","explanation":"An impact printer commonly uses a ribbon to transfer an image to a page. The paper used on an impact printer is common across many printer types."},{"letter":"D","text":"Inkjet","explanation":"Inkjet printers create the final output by placing fine dots of ink from a storage container inside of the printer. Inkjet printers effectively use the same printer paper as laser and impact printers."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.8 - Thermal Printer Maintenance","link":"https://professormesser.link/1201030806","tier":"hard","source":"book"},{"id":"C42","stem":"An Android user needs to transfer some presentations from their desktop computer to their smartphone. Which of the following would be the best choice?","choices":[{"letter":"A","text":"Lightning","explanation":"Lightning interfaces are exclusive to Apple iOS devices. Android devices do not use lightning connectors."},{"letter":"B","text":"RJ45","explanation":"RJ45 connectors are common on Ethernet cables, but they're too large for today's thin smartphones."},{"letter":"C","text":"USB-C","explanation":"USB-C is a connection type used on many Android-based devices"},{"letter":"D","text":"Thunderbolt","explanation":"Thunderbolt interfaces are common on desktop computers. Android and iOS devices do not use Thunderbolt connections."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","tier":"hard","source":"book"},{"id":"C46","stem":"What type of proprietary Apple connector can be plugged in face up or face down?","choices":[{"letter":"A","text":"Lightning","explanation":"The Apple lightning connector is only found on Apple devices, and it allows for a higher power output to charge larger phone and tablets. The connector can also be plugged in either face up or face down"},{"letter":"B","text":"Thunderbolt","explanation":"Thunderbolt connectors are common on Apple devices, but they are not proprietary to Apple and are also found on many other manufacturer's devices."},{"letter":"C","text":"SATA","explanation":"A SATA (Serial ATA) connector is an internal motherboard storage connector. SATA connectors are not specific to Apple devices, and they do not allow for different connection orientations."},{"letter":"D","text":"USB-C","explanation":"USB-C is an industry standard used by many different manufacturers, and the USB-C connector can be plugged in either face up or face down."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","tier":"hard","source":"book"},{"id":"C63","stem":"A server administrator is building a web server with three hard disk drives. The storage for the server requires the fastest possible access and redundancy is not a primary requirement. Which of the following would be the best choice for this server?","choices":[{"letter":"A","text":"RAID 10","explanation":"RAID 10 combines both striping and mirroring to provide a redundant data array. However, RAID 10 requires four drives and the web server in this question only has three."},{"letter":"B","text":"RAID 1","explanation":"RAID 1 is also known as mirroring, and RAID 1 information is duplicated between separate physical drives. The process of duplicating this data makes the efficiency of RAID 1 to be a bit less efficient than RAID 0 striping."},{"letter":"C","text":"RAID 0","explanation":"RAID (Redundant Array of Independent Disks) level 0 does not provide any redundancy, but it will efficiently stripe data across multiple drives. RAID 0 does not require the duplication of data or calculation of parity, so it's commonly considered the fastest access of the RAID levels"},{"letter":"D","text":"RAID 5","explanation":"RAID 5 provides redundancy by calculating a parity and storing that parity along with the original data. This parity calculation is not a significant performance issue, but it does make RAID 5 generally perform a bit less efficiently than RAID 0."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","tier":"hard","source":"book"},{"id":"C76","stem":"Which of the following would be most associated with M.2?","choices":[{"letter":"A","text":"HDD","explanation":"HDDs (Hard Disk Drives) are mechanical storage devices using spinning magnetic platters to store data. HDD form factors are 3.5\" wide for desktop computers and 2.5\" wide for laptop computers. HDD storage is not available in a M.2 form factor."},{"letter":"B","text":"eSATA","explanation":"The eSATA standard provides a method for connecting SATA drives through an external interface. An M.2 interface is internal to the system and would not be found externally."},{"letter":"C","text":"RAID","explanation":"RAID (Redundant Array of Independent Disks) arrays are commonly created with HDD or SSD devices. M.2 storage is not commonly associated with RAID."},{"letter":"D","text":"SSD","explanation":"SSDs (Solid State Drives) are storage devices with non-volatile memory and have no moving parts. The M.2 interface is a small form factor interface allowing for high-throughput storage in a smaller footprint than a 2.5-inch storage drive"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.4 - Storage Devices","link":"https://professormesser.link/1201030401","tier":"hard","source":"book"},{"id":"C87","stem":"A technician has two hard disk drives that need to be configured redundantly, and all information should be duplicated across physical drives. Which of the following should be configured?","choices":[{"letter":"A","text":"RAID 5","explanation":"RAID level 5 provides redundancy through the use of parity. RAID 5 does not duplicate information across physical drives."},{"letter":"B","text":"RAID 1","explanation":"A RAID 1 (Redundant Array of Independent Disks) array keeps an exact duplicate of data across multiple drives. If one drive fails, the other drive containing the duplicated data continues to provide access to the data"},{"letter":"C","text":"RAID 6","explanation":"RAID 6 provides redundancy by striping data across multiple physical drives in a method very similar to RAID 5. Unlike RAID 5, RAID 6 uses an additional parity block to add redundancy for two potential drive failures."},{"letter":"D","text":"RAID 0","explanation":"RAID 0 does not provide any redundancy or duplication of data. If a single drive in RAID 0 was to fail, the data on the array would be unavailable and recovery of the data would require a recent backup."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","tier":"hard","source":"book"},{"id":"X2","tier":"hard","stem":"A storage array must remain online even if TWO drives fail at the same time, and the company specifically does not want a mirrored-pair-based solution. Which RAID level meets this?","choices":[{"letter":"A","text":"RAID 5","explanation":"RAID 5 uses single distributed parity and can only survive ONE drive failure - a second simultaneous failure loses the array."},{"letter":"B","text":"RAID 6","explanation":"Correct. RAID 6 uses double distributed parity, allowing the array to survive two simultaneous drive failures without relying on mirrored pairs."},{"letter":"C","text":"RAID 0","explanation":"RAID 0 has no redundancy whatsoever - it cannot survive even one drive failure, let alone two."},{"letter":"D","text":"RAID 1","explanation":"RAID 1 mirroring can survive a failure within a mirrored pair, but the question explicitly excludes mirror-based solutions, and a standard two-drive mirror can't guarantee surviving any two failures."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","source":"original"},{"id":"X4","tier":"hard","stem":"A network run must span 300 meters between two buildings and pass through an area with significant electrical interference from industrial machinery. Which cable type is the best choice?","choices":[{"letter":"A","text":"Cat 6 UTP","explanation":"Copper twisted pair is limited to roughly 100 meters and, being copper, remains susceptible to electromagnetic interference - failing both requirements here."},{"letter":"B","text":"Fiber optic","explanation":"Correct. Fiber carries light rather than electrical signals, making it completely immune to electromagnetic interference, and it easily supports runs far beyond copper's ~100 meter limit."},{"letter":"C","text":"Coaxial","explanation":"Coax has better shielding than UTP but is still a copper conductor subject to interference, and it isn't the standard choice for a long inter-building Ethernet run."},{"letter":"D","text":"Cat 5e UTP","explanation":"Cat 5e is copper twisted pair with the same ~100 meter distance limitation and interference susceptibility - even less capable than Cat 6."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.2 - Optical Fiber","source":"original"},{"id":"X5","tier":"hard","stem":"Network cable must be installed in the open space above a suspended ceiling that is used to circulate building air. Which cable characteristic is required by fire code for this installation?","choices":[{"letter":"A","text":"Plenum-rated jacket","explanation":"Correct. Plenum-rated cable uses a fire-retardant jacket that produces less toxic smoke when burning, which is required in air-handling spaces like the plenum above a suspended ceiling."},{"letter":"B","text":"Shielded (STP) construction","explanation":"Shielding protects against electromagnetic interference - it's an electrical consideration, not a fire-safety rating for air-handling spaces."},{"letter":"C","text":"Higher category rating (Cat 6a instead of Cat 6)","explanation":"Category rating governs bandwidth and speed capability - it says nothing about the jacket's fire behavior in a plenum space."},{"letter":"D","text":"Stranded rather than solid conductors","explanation":"Stranded conductors add flexibility for patch cables, but conductor construction is unrelated to plenum fire-code requirements."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Network Cables","source":"original"},{"id":"X7","tier":"hard","stem":"A technician is terminating fiber runs into a network device and needs the connector type that uses a square, push-pull latching design commonly found on building fiber terminations. Which connector is this?","choices":[{"letter":"A","text":"SC","explanation":"Correct. The SC (Subscriber Connector) uses a square body with a push-pull latching mechanism, commonly used to attach fiber runs to network devices."},{"letter":"B","text":"RJ45","explanation":"RJ45 is an 8P8C copper connector used for wired Ethernet - it is not a fiber connector at all."},{"letter":"C","text":"DB-9","explanation":"DB-9 is a 9-pin serial connector used for console interfaces, modems, and other serial devices - not fiber."},{"letter":"D","text":"BNC","explanation":"BNC is a bayonet-style coaxial connector, used with copper coax rather than optical fiber."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Fiber Connectors","source":"original"},{"id":"X10","tier":"hard","stem":"Users can reach websites by typing an IP address directly, but not by typing the site's name. Which service is most likely failing, and on which port does it normally operate?","choices":[{"letter":"A","text":"DNS on udp/53","explanation":"Correct. DNS resolves names to IP addresses. If direct IP access works but names do not, name resolution is failing - DNS commonly operates over udp/53."},{"letter":"B","text":"DHCP on udp/67 and udp/68","explanation":"DHCP assigns IP addressing. If DHCP had failed, the device likely wouldn't have working IP connectivity at all - but direct IP browsing is confirmed working here."},{"letter":"C","text":"HTTP on tcp/80","explanation":"If HTTP itself were broken, browsing by direct IP address would also fail - but the scenario states IP-based browsing works fine."},{"letter":"D","text":"SMB on tcp/445","explanation":"SMB handles Windows file and print sharing - it has no role in resolving website names or in web browsing."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.4 - DNS Configuration","source":"original"},{"id":"X11","tier":"hard","stem":"An email client is configured to leave messages on the server so the same mailbox stays synchronized across a phone, tablet, and laptop. Which protocol and port is the client most likely using to retrieve mail?","choices":[{"letter":"A","text":"IMAP on tcp/143","explanation":"Correct. IMAP keeps messages on the server and synchronizes mailbox state across multiple devices, which is exactly the described behavior. Unencrypted IMAP uses tcp/143."},{"letter":"B","text":"POP3 on tcp/110","explanation":"POP3 traditionally downloads messages to a single device and often removes them from the server, which does not keep multiple devices synchronized the way this scenario requires."},{"letter":"C","text":"SMTP on tcp/25","explanation":"SMTP is used to SEND mail, not to retrieve it - it doesn't govern how a mailbox synchronizes across devices."},{"letter":"D","text":"SNMP on udp/161","explanation":"SNMP is used to monitor and manage network devices - it has nothing to do with email retrieval."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.1 - Port Numbers","source":"original"},{"id":"X12","tier":"hard","stem":"A workstation reports an IP address of 169.254.88.10 and cannot reach the network. What does this indicate?","choices":[{"letter":"A","text":"The device could not reach a DHCP server and self-assigned an APIPA address","explanation":"Correct. The 169.254.x.x range is APIPA (Automatic Private IP Addressing), which a device assigns itself when no DHCP server responds - explaining both the address and the lack of connectivity."},{"letter":"B","text":"The device received a valid address from the DHCP server","explanation":"A successful DHCP lease would produce an address from the network's configured scope, not an address in the reserved 169.254.x.x self-assignment range."},{"letter":"C","text":"The device is configured with a valid public IP address","explanation":"169.254.x.x is a reserved link-local range and is never routable as a public IP address on the internet."},{"letter":"D","text":"The device has a duplicate IP address conflict","explanation":"An address conflict typically produces a specific duplicate-address warning while the device still holds an address from the normal subnet - not an APIPA fallback address."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.6 - Assigning IP Addresses","source":"original"},{"id":"X14","tier":"hard","stem":"A company wants a cloud provider to supply virtual machines, storage, and networking, while the company itself remains responsible for installing and maintaining the operating systems and applications on them. Which cloud service model is this?","choices":[{"letter":"A","text":"IaaS","explanation":"Correct. IaaS (Infrastructure as a Service) provides the underlying compute, storage, and networking, while the customer installs and manages the operating systems and applications on top."},{"letter":"B","text":"PaaS","explanation":"PaaS (Platform as a Service) provides a managed development platform including the OS and runtime, so the customer would NOT be maintaining the operating systems themselves."},{"letter":"C","text":"SaaS","explanation":"SaaS (Software as a Service) delivers finished applications where the provider manages everything - the customer manages neither operating systems nor applications."},{"letter":"D","text":"On-premises hosting","explanation":"On-premises means the company owns and operates the physical infrastructure itself, which is not a cloud service model at all."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Characteristics","source":"original"},{"id":"X15","tier":"hard","stem":"A hypervisor runs directly on the physical server hardware with no underlying general-purpose operating system beneath it. Which type of hypervisor is this?","choices":[{"letter":"A","text":"Type 1 (bare metal)","explanation":"Correct. A Type 1 hypervisor installs directly onto the physical hardware without a host operating system underneath, which is why it's called a bare-metal hypervisor."},{"letter":"B","text":"Type 2 (hosted)","explanation":"A Type 2 hypervisor runs as an application ON TOP of an existing host operating system - the opposite of the arrangement described here."},{"letter":"C","text":"Container runtime","explanation":"Containers share the host operating system's kernel rather than virtualizing full machines, making this a different technology from a hypervisor entirely."},{"letter":"D","text":"Emulator","explanation":"An emulator reproduces one hardware architecture on top of a different one, which is a distinct concept from a bare-metal hypervisor partitioning native hardware."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Concepts","source":"original"},{"id":"X17","tier":"hard","stem":"A printer produces output by heating elements against specially coated paper, uses no ink or toner, and is commonly used for receipts. Which printer type is this?","choices":[{"letter":"A","text":"Thermal","explanation":"Correct. Thermal printers apply heat to specially coated thermal paper to create the image, requiring no ink or toner - the standard technology for receipt printers."},{"letter":"B","text":"Inkjet","explanation":"Inkjet printers spray liquid ink onto ordinary paper, so they very much do use a consumable ink supply."},{"letter":"C","text":"Laser","explanation":"Laser printers fuse powdered toner to the page with heat and pressure - they consume toner, unlike a thermal printer."},{"letter":"D","text":"Impact","explanation":"Impact printers physically strike an inked ribbon against the paper, consuming ribbon and producing carbon-copy output."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.8 - Thermal Printers","source":"original"},{"id":"X19","tier":"hard","stem":"Printed pages from a laser printer smudge easily and toner rubs off when touched. Which component is the most likely cause?","choices":[{"letter":"A","text":"The fuser assembly","explanation":"Correct. The fuser uses heat and pressure to permanently bond toner to the page. If it isn't fusing properly, toner sits loose on the paper and smudges when touched."},{"letter":"B","text":"The pickup rollers","explanation":"Pickup rollers feed paper from the tray into the printer. Failing rollers cause jams or misfeeds, not toner that fails to bond to the page."},{"letter":"C","text":"The toner cartridge is low","explanation":"Low toner produces faded or light output, but the toner that IS applied would still be properly fused and wouldn't rub off."},{"letter":"D","text":"The page description language is misconfigured","explanation":"A page description language mismatch produces garbled text or strange characters - it doesn't affect whether toner physically adheres to the paper."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.8 - Laser Printer Maintenance","source":"original"},{"id":"X20","tier":"hard","stem":"A server must stay running through brief power outages long enough to shut down safely, AND must be protected from voltage spikes. Which device provides both?","choices":[{"letter":"A","text":"An uninterruptible power supply (UPS)","explanation":"Correct. A UPS provides battery backup power during an outage so systems can shut down gracefully, and also includes surge protection against voltage spikes."},{"letter":"B","text":"A surge suppressor","explanation":"A surge suppressor protects against voltage spikes, but provides NO battery backup - the server would still lose power immediately during an outage."},{"letter":"C","text":"A power strip","explanation":"A basic power strip only multiplies available outlets. It provides neither battery backup nor guaranteed surge protection."},{"letter":"D","text":"A higher-wattage power supply","explanation":"A larger PSU provides more power capacity to internal components, but does nothing to keep the system running when incoming utility power fails."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.6 - Computer Power","source":"original"},{"id":"X22","tier":"hard","stem":"A computer powers on, fans spin, but there is no video output and the system emits a repeating pattern of beeps during startup. What does this most directly indicate?","choices":[{"letter":"A","text":"POST has detected a hardware fault and is reporting it via beep codes","explanation":"Correct. The POST (Power On Self Test) runs at startup and uses beep codes to report hardware faults when it cannot display an error on screen - commonly memory or video related."},{"letter":"B","text":"The operating system is corrupted","explanation":"POST beep codes occur before the operating system loads at all, so an OS problem couldn't produce them - OS corruption typically shows errors after POST completes successfully."},{"letter":"C","text":"The network cable is unplugged","explanation":"A disconnected network cable affects connectivity only and would never prevent video output or trigger startup beep codes."},{"letter":"D","text":"The printer driver is misconfigured","explanation":"A printer driver is an operating-system-level component and has no involvement in POST or system startup diagnostics."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","source":"original"},{"id":"X23","tier":"hard","stem":"A server requires memory that can detect and correct single-bit errors automatically to prevent data corruption. Which memory type is required?","choices":[{"letter":"A","text":"ECC memory","explanation":"Correct. ECC (Error Correcting Code) memory detects and corrects single-bit errors on the fly, which is why it's standard in servers where silent data corruption is unacceptable."},{"letter":"B","text":"Standard non-ECC DDR5","explanation":"Standard non-ECC memory provides no error detection or correction - a bit flip would silently corrupt data."},{"letter":"C","text":"SODIMM","explanation":"SODIMM describes the smaller physical form factor used in laptops, not whether the memory performs error correction."},{"letter":"D","text":"Virtual memory","explanation":"Virtual memory is an operating system technique using disk space to extend RAM - it isn't a physical memory type and provides no hardware error correction."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.3 - Memory Technologies","source":"original"},{"id":"X26","tier":"hard","stem":"Security cameras need to be installed where no electrical outlets are available, but Ethernet cable can be run to each location. Which technology solves the power problem?","choices":[{"letter":"A","text":"Power over Ethernet (PoE)","explanation":"Correct. PoE delivers electrical power over the same Ethernet cable that carries data, allowing devices like cameras to operate where no separate power outlet exists."},{"letter":"B","text":"An uninterruptible power supply at the camera","explanation":"A UPS still requires an existing power source to charge from - it doesn't solve the problem of having no outlet at the camera location."},{"letter":"C","text":"A longer Cat 6 cable","explanation":"Cable length affects the data run distance but provides no electrical power to the connected device on its own."},{"letter":"D","text":"A network tap","explanation":"A network tap copies traffic for monitoring and analysis - it has no power delivery function whatsoever."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","source":"original"},{"id":"X28","tier":"hard","stem":"A company wants to logically separate its guest Wi-Fi traffic from internal corporate traffic while using the same physical switching hardware. Which technology accomplishes this?","choices":[{"letter":"A","text":"VLAN","explanation":"Correct. A VLAN logically segments a single physical network into separate broadcast domains, keeping guest and corporate traffic isolated without requiring separate physical switches."},{"letter":"B","text":"VPN","explanation":"A VPN creates an encrypted tunnel across an untrusted network for remote access - it doesn't segment local traffic on shared switching hardware."},{"letter":"C","text":"NAT","explanation":"NAT translates private addresses to public ones for internet access - it doesn't logically separate two internal traffic types from one another."},{"letter":"D","text":"PoE","explanation":"PoE delivers electrical power over Ethernet cabling and has no role in logically segmenting network traffic."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.4 - VLANs and VPNs","source":"original"},{"id":"X29","tier":"hard","stem":"A laptop's screen is completely black, but when a flashlight is shined at the panel a very faint image is visible. Which component has most likely failed?","choices":[{"letter":"A","text":"The backlight or inverter","explanation":"Correct. A faint image visible under external light means the LCD panel is still producing an image, but it isn't being illuminated - pointing to the backlight (or on older displays, the inverter that powers it)."},{"letter":"B","text":"The video card has completely failed","explanation":"A total video card failure would produce no image at all, so nothing would be visible even under a flashlight - the faint image proves video output is still working."},{"letter":"C","text":"The hard drive is failing","explanation":"A failing hard drive affects data access and boot behavior, not whether the display panel is illuminated."},{"letter":"D","text":"The digitizer is damaged","explanation":"The digitizer handles touch input. A damaged digitizer affects touch responsiveness, not display brightness or illumination."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","source":"original"},{"id":"A21","stem":"A user needs to connect their laptop to the wired Ethernet network, but the laptop does not have an integrated Ethernet interface. Which of the following would allow the laptop to connect to an Ethernet network? (Pick TWO)","choices":[{"letter":"A","text":"Docking station","explanation":"There are a few options for creating a wired Ethernet connection on a laptop computer. Using a docking station is a common solution to provide many different interfaces, and docking stations often include the option to install a full-size PCI Express (Peripheral Component Interconnect Express) adapter. A USB (Universal Serial Bus) to Ethernet adapter is a simpler solution which only provides an Ethernet interface, but it's much more portable than a docking station"},{"letter":"B","text":"VGA interface","explanation":"A VGA (Video Graphics Array) interface is an interface for video output and does not provide Ethernet connectivity."},{"letter":"C","text":"USB to Ethernet adapter","explanation":"There are a few options for creating a wired Ethernet connection on a laptop computer. Using a docking station is a common solution to provide many different interfaces, and docking stations often include the option to install a full-size PCI Express (Peripheral Component Interconnect Express) adapter. A USB (Universal Serial Bus) to Ethernet adapter is a simpler solution which only provides an Ethernet interface, but it's much more portable than a docking station"},{"letter":"D","text":"DisplayPort to HDMI cable","explanation":"Both DisplayPort and HDMI (High-Definition Multimedia Interface) provide video output and are not used for Ethernet on a laptop computer."},{"letter":"E","text":"DVI to HDMI adapter","explanation":"DVI (Digital Visual Interface) and HDMI are video interfaces and do not provide a wired Ethernet link."},{"letter":"F","text":"Bluetooth","explanation":"Bluetooth is a wireless PAN (Personal Area Network), and it does not provide wired Ethernet connectivity."}],"correct":["A","C"],"multi":true,"objective":"220-1201, Objective 3.2 - Adapters and Converters","link":"https://professormesser.link/1201030207","tier":"expert","source":"book"},{"id":"A24","stem":"Which of the following ports are used for file transfers? (Select TWO)","choices":[{"letter":"A","text":"21","explanation":"FTP (File Transfer Protocol) is a standard method of transferring files across different operating systems. FTP uses TCP (Transmission Control Protocol) port 21 for control messages and port 20 to transfer data"},{"letter":"B","text":"110","explanation":"Port 110 is the default port for POP3 (Post Office Protocol version 3). POP3 is commonly used to retrieve email messages from an email server to a local email client application."},{"letter":"C","text":"25","explanation":"Another common email protocol is SMTP (Simple Mail Transfer Protocol), which uses port 25 for sending mail to a mail server and to transfer email messages between mail servers."},{"letter":"D","text":"23","explanation":"Non-encrypted (in-the-clear) terminal communication is provided with the Telnet (Telecommunication Network) protocol over port 23."},{"letter":"E","text":"20","explanation":"FTP (File Transfer Protocol) is a standard method of transferring files across different operating systems. FTP uses TCP (Transmission Control Protocol) port 21 for control messages and port 20 to transfer data"},{"letter":"F","text":"53","explanation":"Port 53 is the default port for DNS (Domain Name System). DNS is commonly used to convert fully qualified domain names to IP addresses."}],"correct":["A","E"],"multi":true,"objective":"220-1201, Objective 2.1 - Port Numbers","link":"https://professormesser.link/1201020102","tier":"expert","source":"book"},{"id":"A34","stem":"A help desk technician needs to use different Windows versions to study for an industry certification exam. The technician currently uses a Windows desktop computer with 4 GB of RAM and a 750 GB free on the hard drive. Which of the following would be the best way to perform this task? (Choose TWO)","choices":[{"letter":"A","text":"Install a second monitor","explanation":"Multiple monitors can certainly improve overall efficiency and can expand the working desktop of a computer, but it doesn't provide any features specific to multiple operating systems or virtual machines."},{"letter":"B","text":"Install an additional hard drive","explanation":"The available hard drive is large enough to support the installation of multiple virtual machines."},{"letter":"C","text":"Create a Windows Recovery Environment boot drive","explanation":"A Windows Recovery Environment drive is useful for troubleshooting the existing Windows installation, but it won't help with multiple operating systems."},{"letter":"D","text":"Upgrade the system RAM","explanation":"The easiest way to use multiple operating systems on a single machine is to run them as virtual machines. Although 750 GB (Gigabytes) is plenty of storage space for multiple virtual machines, the 4 GB of RAM (Random Access Memory) on the host computer is too small to support multiple Windows operating systems at the same time. Once the memory upgrade is complete, it's a relatively easy process to install the guest virtual machines on the existing hard drive"},{"letter":"E","text":"Install Windows guest VMs","explanation":"The easiest way to use multiple operating systems on a single machine is to run them as virtual machines. Although 750 GB (Gigabytes) is plenty of storage space for multiple virtual machines, the 4 GB of RAM (Random Access Memory) on the host computer is too small to support multiple Windows operating systems at the same time. Once the memory upgrade is complete, it's a relatively easy process to install the guest virtual machines on the existing hard drive"}],"correct":["D","E"],"multi":true,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","tier":"expert","source":"book"},{"id":"A57","stem":"A user in the accounting department is connecting to their monitor using HDMI. The video appears normal, but the user does not hear any audio through the monitor's speakers. Which of the following would be the two most likely reasons for this audio issue? (Select TWO)","choices":[{"letter":"A","text":"Video output does not match the native resolution","explanation":"To get the sharpest image, the output from the computer should match the native resolution of the LCD (Liquid Crystal Display) monitor. However, this configuration setting does not disable or prevent the audio output."},{"letter":"B","text":"Audio controls are muted","explanation":"If the audio controls are muted, then no audio will be heard on any output device. The muted controls may be on the monitor or the operating system, so both will need to be checked during the troubleshooting process. The operating system will also need to be configured with the correct audio output location, and in this example the audio output should be configured for the HDMI (High-Definition Multimedia Interface) link"},{"letter":"C","text":"Not enough bandwidth for audio","explanation":"The HDMI connection has dedicated bandwidth for audio, so the audio signal will always be available to the monitor."},{"letter":"D","text":"Internet connectivity is unavailable","explanation":"The network connectivity from the computer does not have any impact on the monitor's ability to play audio."},{"letter":"E","text":"OS is not configured for HDMI audio output","explanation":"If the audio controls are muted, then no audio will be heard on any output device. The muted controls may be on the monitor or the operating system, so both will need to be checked during the troubleshooting process. The operating system will also need to be configured with the correct audio output location, and in this example the audio output should be configured for the HDMI (High-Definition Multimedia Interface) link"},{"letter":"F","text":"Display has a dead pixel","explanation":"A dead pixel on the display will always show as a blank dot, even if the rest of the monitor is showing a white page. However, this visual issue does not cause any problems with the audio output over HDMI."}],"correct":["B","E"],"multi":true,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","tier":"expert","source":"book"},{"id":"B28","stem":"A company is building an ARM-based IoT device for the consumer market. Which of the following would be an advantage of using the ARM architecture for this product? (Choose TWO)","choices":[{"letter":"A","text":"Redundancy","explanation":"Although redundancy is an important consideration for any product, the ARM processor does not inherently provide duplicate systems."},{"letter":"B","text":"High speed networking","explanation":"An ARM processor is not a requirement for high speed network connections."},{"letter":"C","text":"Low power use","explanation":"ARM (Advanced RISC [Reduced Instruction Set Computer] Machine) processors use a simplified instruction set for efficient processing using relatively minimal power and heat"},{"letter":"D","text":"NAS","explanation":"A NAS (Network Attached Storage) system usually provides file storage that can be accessed across the network. An ARM processor isn't required for NAS services."},{"letter":"E","text":"Load balancing","explanation":"Load balancing separates a load into multiple instances for redundancy and performance. The ARM architecture does not inherently provide load balancing functionality."},{"letter":"F","text":"Minimal heat","explanation":"ARM (Advanced RISC [Reduced Instruction Set Computer] Machine) processors use a simplified instruction set for efficient processing using relatively minimal power and heat"}],"correct":["C","F"],"multi":true,"objective":"220-1201, Objective 3.5 - CPU Features","link":"https://professormesser.link/1201030508","tier":"expert","source":"book"},{"id":"C20","stem":"A systems administrator needs to configure a smartphone to retrieve email messages from the corporate mail server. Which of the following protocols could be configured for this purpose? (Pick TWO)","choices":[{"letter":"A","text":"IMAP","explanation":"Two common protocols used to retrieve email messages are IMAP (Internet Message Access Protocol) and POP3 (Post Office Protocol 3)"},{"letter":"B","text":"SSH","explanation":"SSH (Secure Shell) is used to connect a terminal console across an encrypted network connection. SSH is not commonly used for sending or receiving email messages."},{"letter":"C","text":"SMTP","explanation":"SMTP (Simple Mail Transfer Protocol) is a common email protocol used for sending mail and is not used for retrieving mail."},{"letter":"D","text":"LDAP","explanation":"LDAP (Lightweight Directory Access Protocol) is used to store and retrieve information in a network directory. One common use of LDAP is to centralize authentication on a large distributed network."},{"letter":"E","text":"POP3","explanation":"Two common protocols used to retrieve email messages are IMAP (Internet Message Access Protocol) and POP3 (Post Office Protocol 3)"},{"letter":"F","text":"FTP","explanation":"FTP (File Transfer Protocol) is commonly used to transfer files between different systems. FTP does not support the retrieval of email messages from a mail server."},{"letter":"G","text":"SMB","explanation":"SMB (Server Message Block) is a common file and printer sharing protocol on Microsoft Windows devices."}],"correct":["A","E"],"multi":true,"objective":"220-1201, Objective 2.1 - Common Ports","link":"https://professormesser.link/1201020102","tier":"expert","source":"book"},{"id":"C29","stem":"A user in the shipping department would like to connect multiple displays to a desktop computer. Which of the following would support this requirement? (Pick TWO)","choices":[{"letter":"A","text":"RJ45","explanation":"RJ45 (Registered Jack 45) is the common copper wire interface for Ethernet networks. Video displays don't commonly use RJ45 connectors."},{"letter":"B","text":"Lightning","explanation":"Apple's Lightning connectors can be used to send video from a mobile device, but desktop computers don't use the Lightning interface."},{"letter":"C","text":"Fiber","explanation":"Fiber optic connections are commonly used for long-distance network connections. Fiber optics are not commonly used for video links."},{"letter":"D","text":"HDMI","explanation":"HDMI (High-Definition Multimedia Interface) and DVI-D (Digital Visual Interface-Digital) are two common video connection types. Some video adapters will provide multiple video connection types and allow different video outputs for each interface"},{"letter":"E","text":"DB-9","explanation":"DB-9 (D-subminiature Size B - 9 pin) is an interface also called DE-9 to specify its size E connector. DB-9/DE-9 is designed for the slower speeds of serial connections and is not used for video interfaces."},{"letter":"F","text":"DVI-D","explanation":"HDMI (High-Definition Multimedia Interface) and DVI-D (Digital Visual Interface-Digital) are two common video connection types. Some video adapters will provide multiple video connection types and allow different video outputs for each interface"}],"correct":["D","F"],"multi":true,"objective":"220-1201, Objective 3.2 - Video Cables","link":"https://professormesser.link/1201030205","tier":"expert","source":"book"},{"id":"X8","tier":"expert","stem":"A technician crimps a patch cable using T568B on one end and T568A on the other, then uses it to connect a laptop directly to another laptop with no switch between them. What is the practical result?","choices":[{"letter":"A","text":"It functions as a crossover cable, which can allow the two devices to communicate directly","explanation":"Correct. Mixing T568A on one end with T568B on the other swaps the transmit and receive pairs, producing a crossover cable - historically required to connect two like devices directly without a switch."},{"letter":"B","text":"The cable will not pass any signal at all","explanation":"The cable is still electrically continuous; the pairs are simply crossed rather than straight-through, so it does pass signal - just in a crossover configuration."},{"letter":"C","text":"It becomes a rollover cable for console access","explanation":"A rollover cable reverses the entire pin order end to end and is used for console connections - that's a different wiring scheme from an A-to-B crossover."},{"letter":"D","text":"The cable only works at 10 Mbit/s regardless of category","explanation":"Crossing the pairs changes which pins transmit and receive; it does not impose a fixed 10 Mbit/s speed cap on an otherwise capable cable."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Copper Connectors","source":"original"},{"id":"X13","tier":"expert","stem":"A device is configured with the IP address 192.168.10.50 and subnet mask 255.255.255.0, with a default gateway of 192.168.11.1. The device can reach other devices on its own subnet, but nothing beyond it. What is the most likely cause?","choices":[{"letter":"A","text":"The default gateway is on a different subnet than the device","explanation":"Correct. With a /24 mask, the device's subnet is 192.168.10.x, but the gateway is 192.168.11.1 - a different subnet. The device can't reach its own gateway, so local traffic works while everything off-subnet fails."},{"letter":"B","text":"The subnet mask is too restrictive for local communication","explanation":"Local communication is confirmed working, so the mask is functioning correctly for the local subnet - the failure is specifically with traffic leaving the subnet."},{"letter":"C","text":"The device needs a DNS server configured","explanation":"A missing DNS server would break name resolution, but the device would still be able to route traffic off-subnet by IP address - here nothing off-subnet is reachable at all."},{"letter":"D","text":"The IP address is in a reserved range","explanation":"192.168.x.x is a standard private address range intended for internal networks - using it is completely normal and not the cause of this problem."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.6 - Assigning IP Addresses","source":"original"},{"id":"X16","tier":"expert","stem":"A cloud customer is billed based on exactly how much compute time and storage they consume each month, with no fixed monthly commitment. Which cloud characteristic does this describe?","choices":[{"letter":"A","text":"Metered utilization","explanation":"Correct. Metered (measured) service means resource usage is tracked and billed according to actual consumption, rather than a flat recurring fee."},{"letter":"B","text":"High availability","explanation":"High availability describes designing a service to minimize downtime through redundancy - it has nothing to do with how the customer is billed."},{"letter":"C","text":"Resource pooling","explanation":"Resource pooling means the provider serves many customers from a shared pool of physical resources - it's about how capacity is shared, not how usage is billed."},{"letter":"D","text":"Rapid elasticity","explanation":"Rapid elasticity is the ability to quickly scale resources up or down on demand. It often pairs with metered billing, but elasticity itself describes scaling, not the consumption-based charging model."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Characteristics","source":"original"},{"id":"X18","tier":"expert","stem":"A business needs to print multi-part carbon-copy forms where the impression must transfer through several stacked sheets at once. Which printer technology is required?","choices":[{"letter":"A","text":"Impact (dot matrix)","explanation":"Correct. Impact printers physically strike the page through an inked ribbon, and that mechanical force is what transfers the impression through multiple carbon-copy layers - something non-contact technologies cannot do."},{"letter":"B","text":"Laser","explanation":"Laser printing fuses toner onto the top sheet only with no physical striking force, so it cannot produce an impression through stacked multi-part forms."},{"letter":"C","text":"Inkjet","explanation":"Inkjet sprays ink onto the surface of the top sheet without any impact, so nothing transfers to the sheets beneath."},{"letter":"D","text":"Thermal","explanation":"Thermal printing uses heat on specially coated paper with no striking mechanism, so it cannot mark multiple stacked carbon-copy sheets."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.8 - Impact Printer Maintenance","source":"original"},{"id":"X21","tier":"expert","stem":"A technician adds a second high-end graphics card to a workstation. The system now shuts off unexpectedly under heavy graphics load, but runs fine when idle. What is the most likely cause?","choices":[{"letter":"A","text":"The power supply cannot deliver enough wattage under full load","explanation":"Correct. A PSU near its capacity limit can handle idle draw but fails when demand spikes under load, causing sudden shutdowns - exactly matching a symptom that appears only under heavy graphics use after adding a power-hungry card."},{"letter":"B","text":"The hard drive is failing","explanation":"A failing drive causes read/write errors, slow performance, or boot problems - it wouldn't produce shutdowns correlated specifically with graphics load."},{"letter":"C","text":"The network adapter driver is outdated","explanation":"A network driver issue would affect connectivity, and has no relationship to power draw or shutdowns under graphics load."},{"letter":"D","text":"The system has too much RAM installed","explanation":"Excess RAM doesn't cause load-correlated shutdowns; if memory were incompatible, problems would typically appear at POST or during general use, not specifically under GPU load."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.6 - Power","source":"original"},{"id":"X24","tier":"expert","stem":"A technician needs the fastest possible internal storage for a new workstation, connecting directly to the PCI Express bus rather than through a legacy storage interface. Which should be selected?","choices":[{"letter":"A","text":"An NVMe SSD in an M.2 slot","explanation":"Correct. NVMe drives communicate directly over the PCI Express bus, bypassing the bandwidth ceiling of the older SATA interface and delivering substantially higher throughput."},{"letter":"B","text":"A SATA SSD","explanation":"A SATA SSD is much faster than a spinning drive, but it's still limited by the SATA interface's bandwidth ceiling rather than connecting over PCI Express."},{"letter":"C","text":"A 7200 RPM hard drive","explanation":"A mechanical hard drive is dramatically slower than any SSD due to its moving platters and heads, regardless of interface."},{"letter":"D","text":"An external USB flash drive","explanation":"An external flash drive is limited by the USB interface and is not intended as a high-performance internal system drive."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.4 - Storage Devices","source":"original"},{"id":"X27","tier":"expert","stem":"A wireless network must support the highest throughput available while operating in the 5 GHz band and remaining backward compatible with older 5 GHz clients. Which 802.11 standard best fits, given only these options?","choices":[{"letter":"A","text":"802.11ac","explanation":"Correct. 802.11ac operates exclusively in the 5 GHz band with significantly higher throughput than earlier standards, and maintains backward compatibility with 802.11a/n clients on 5 GHz."},{"letter":"B","text":"802.11b","explanation":"802.11b operates only in the 2.4 GHz band at very low throughput - it cannot meet either the 5 GHz or high-throughput requirement."},{"letter":"C","text":"802.11g","explanation":"802.11g also operates only in 2.4 GHz, so despite improving on 802.11b speeds, it can't satisfy the 5 GHz requirement."},{"letter":"D","text":"802.11a","explanation":"802.11a does use 5 GHz, but its maximum throughput is far lower than later standards - it isn't the highest-throughput option available here."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.2 - Wireless Network Technologies","source":"original"},{"id":"X30","tier":"expert","stem":"A user's smartphone battery is swollen enough to visibly separate the device's back panel from its frame. What is the correct immediate action?","choices":[{"letter":"A","text":"Stop using and charging the device, and follow proper hazardous-material handling for safe battery disposal","explanation":"Correct. A swollen lithium-ion battery is a fire and rupture hazard. The device should be taken out of service immediately and the battery handled and disposed of per hazardous-material procedures - never punctured or thrown in regular trash."},{"letter":"B","text":"Press the back panel firmly closed and continue using the device","explanation":"Applying pressure to a swollen lithium-ion battery risks puncturing it, which can cause a fire or violent rupture - this is one of the most dangerous possible responses."},{"letter":"C","text":"Charge the device fully to recalibrate the battery","explanation":"Charging a physically swollen battery increases heat and internal pressure, significantly raising the risk of fire - the opposite of what should be done."},{"letter":"D","text":"Place the device in a freezer to reduce the swelling","explanation":"Freezing does not reverse the chemical process causing the swelling, and introduces condensation and thermal stress that can make the hazard worse."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","source":"original"}]},"pb":{"A":[{"id":"A1","type":"imagematch","source":"book","prompt":"Match the connector name and most common use to each pictured interface (pictures 1 to 6).","columns":["Interface name","Common use"],"pools":[["HDMI","DB-9","Lightning","USB-C","RJ45","SC"],["Use an external SSD","Charge an older iPad","Run fiber to a building","Connect to a monitor","Use a console interface","Connect to wired Ethernet"]],"rows":[{"label":"Picture 1","correct":["Lightning","Charge an older iPad"],"explanation":"Lightning connectors are proprietary to Apple devices, providing an 8-pin digital signal between a mobile device and a computer."},{"label":"Picture 2","correct":["RJ45","Connect to wired Ethernet"],"explanation":"RJ45 connectors are 8P
