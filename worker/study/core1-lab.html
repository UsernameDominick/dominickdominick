<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>A+ Core 1 Drill</title>
<style>
:root {
  --bg: #10141b;
  --panel: #1a2029;
  --panel-2: #212936;
  --raised: #262f3d;
  --border: #2c3542;
  --border-soft: #232b37;
  --text: #e9ecf1;
  --text-dim: #8b96a5;
  --text-faint: #5c6675;
  --amber: #e8a33d;
  --amber-dim: #6b551f;
  --good: #5fd87a;
  --good-dim: #1e3324;
  --bad: #f0665a;
  --bad-dim: #3a2323;
  --d1: #5b9bd5;
  --d2: #e8a33d;
  --d3: #e8734a;
  --d4: #4fbdb6;
  --radius: 10px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,163,61,0.07), transparent 60%);
}

#app {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 16px 64px;
}

button {
  font-family: inherit;
  cursor: pointer;
}

::selection { background: var(--amber-dim); }

/* ---------- Home screen ---------- */
.hero { padding: 22px 2px 6px; }
.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  color: var(--amber);
  font-weight: 600;
}
.hero h1 {
  font-size: 32px;
  line-height: 1.1;
  margin: 8px 0 10px;
  letter-spacing: -0.02em;
  font-weight: 800;
}
.hero .sub {
  color: var(--text-dim);
  font-size: 14.5px;
  line-height: 1.5;
  margin: 0;
  max-width: 46ch;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 14px;
}
.panel-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  margin-bottom: 12px;
  font-weight: 600;
}

.domain-row {
  display: grid;
  grid-template-columns: 1fr 90px 30px;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  padding: 5px 0;
}
.domain-label { color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; }
.meter { height: 6px; background: var(--border-soft); border-radius: 4px; overflow: hidden; }
.meter-fill { height: 100%; border-radius: 4px; }
.meter-fill.domain-1, .domain-tag.domain-1 { background: var(--d1); }
.meter-fill.domain-2, .domain-tag.domain-2 { background: var(--d2); }
.meter-fill.domain-3, .domain-tag.domain-3 { background: var(--d3); }
.meter-fill.domain-4, .domain-tag.domain-4 { background: var(--d4); }
.domain-pct { font-family: var(--mono); font-size: 11px; color: var(--text-faint); text-align: right; }

.btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.opt-btn:hover { border-color: var(--amber-dim); color: var(--text); }
.opt-btn.active {
  background: var(--amber);
  border-color: var(--amber);
  color: #241a05;
}

.shuffle-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 16px 2px 0;
  color: var(--text-dim);
  font-size: 13.5px;
  user-select: none;
}
.shuffle-row input { width: 16px; height: 16px; accent-color: var(--amber); }

.start-btn {
  display: block;
  width: 100%;
  margin-top: 20px;
  background: var(--amber);
  color: #241a05;
  border: none;
  border-radius: var(--radius);
  padding: 16px;
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: 0.01em;
  box-shadow: 0 8px 24px -8px rgba(232,163,61,0.5);
}
.start-btn:active { transform: translateY(1px); }

/* ---------- Quiz screen ---------- */
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-faint);
  padding: 6px 2px;
  letter-spacing: 0.03em;
  flex-wrap: wrap;
  gap: 4px;
}
.quiz-tag { color: var(--amber); font-weight: 700; }
.quiz-score { color: var(--good); }
.progress-track {
  height: 4px;
  background: var(--border-soft);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 2px 18px;
}
.progress-fill { height: 100%; background: var(--amber); transition: width 0.25s ease; }

.card {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: 14px;
  padding: 20px 18px 18px;
  animation: rise 0.22s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  .card, .choice, .feedback { animation: none !important; transition: none !important; }
}

.pb-type-tag {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: var(--amber);
  font-weight: 700;
  margin-bottom: 10px;
}

.stem {
  font-size: 16.5px;
  line-height: 1.5;
  white-space: pre-line;
  margin-bottom: 16px;
}

.hint {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-faint);
  background: var(--panel-2);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 14px;
  line-height: 1.5;
}

.choices { display: flex; flex-direction: column; gap: 9px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  text-align: left;
  background: var(--panel-2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 13px;
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.45;
  position: relative;
  transition: border-color 0.12s, background 0.12s;
}
.choice:disabled { cursor: default; }
.choice.selected { border-color: var(--amber); background: rgba(232,163,61,0.08); }
.choice.good { border-color: var(--good); background: var(--good-dim); }
.choice.bad { border-color: var(--bad); background: var(--bad-dim); }
.choice.muted { opacity: 0.5; }
.choice-letter {
  font-family: var(--mono);
  font-weight: 700;
  color: var(--text-faint);
  flex-shrink: 0;
  width: 18px;
}
.choice.selected .choice-letter { color: var(--amber); }
.choice.good .choice-letter { color: var(--good); }
.choice.bad .choice-letter { color: var(--bad); }
.choice-text { flex: 1; }
.choice-icon { font-weight: 800; margin-left: 6px; }
.choice.good .choice-icon { color: var(--good); }
.choice.bad .choice-icon { color: var(--bad); }

.check-btn, .next-btn {
  display: block;
  width: 100%;
  margin-top: 16px;
  background: var(--raised);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px;
  font-size: 14.5px;
  font-weight: 700;
}
.check-btn:disabled { opacity: 0.4; cursor: default; }
.check-btn:not(:disabled):hover { border-color: var(--amber); }
.next-btn { background: var(--amber); color: #241a05; border: none; }

.feedback {
  margin-top: 16px;
  padding: 13px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  animation: rise 0.18s ease;
}
.feedback.good { background: var(--good-dim); border-color: rgba(95,216,122,0.35); }
.feedback.bad { background: var(--bad-dim); border-color: rgba(240,102,90,0.35); }
.feedback-title { font-weight: 800; margin-bottom: 6px; font-size: 14px; }
.feedback.good .feedback-title { color: var(--good); }
.feedback.bad .feedback-title { color: var(--bad); }
.feedback p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 4px 8px;
  border-radius: 5px;
  background: rgba(255,255,255,0.06);
  color: var(--text-dim);
}
.domain-tag { color: #0d1015; font-weight: 700; }
.obj-tag { color: var(--text-faint); }

/* ---------- PB: order ---------- */
.order-list { list-style: none; margin: 0 0 4px; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.order-list li {
  background: var(--panel-2);
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 10px 12px;
}
.order-list li.good { border-color: var(--good); background: var(--good-dim); }
.order-list li.bad { border-color: var(--bad); background: var(--bad-dim); }
.order-item-head { display: flex; align-items: center; gap: 10px; }
.order-num { font-family: var(--mono); color: var(--text-faint); font-weight: 700; width: 16px; flex-shrink: 0; }
.order-text { flex: 1; font-size: 14px; }
.order-step-explain { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin-top: 7px; padding-left: 26px; }
.order-controls { display: flex; gap: 5px; }
.order-controls button {
  background: var(--raised); border: 1px solid var(--border); color: var(--text-dim);
  width: 36px; height: 36px; border-radius: 7px; font-size: 13px;
}
.order-controls button:disabled { opacity: 0.3; }

/* ---------- PB: match ---------- */
.match-list { display: flex; flex-direction: column; gap: 12px; }
.match-row {
  background: var(--panel-2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
}
.match-row.good { border-color: var(--good); background: var(--good-dim); }
.match-row.bad { border-color: var(--bad); background: var(--bad-dim); }
.match-text { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
.match-row select {
  width: 100%;
  background: var(--raised);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 10px;
  font-size: 16px;
  font-family: var(--sans);
}
.match-feedback { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }

/* ---------- PB: grid ---------- */
.grid-table { display: flex; flex-direction: column; gap: 2px; }
.grid-header, .grid-row {
  display: grid;
  grid-template-columns: 1fr repeat(var(--cols, 3), 56px);
  align-items: center;
  gap: 4px;
}
.grid-header span:not(:first-child) {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-faint);
  text-align: center;
}
.grid-row {
  background: var(--panel-2);
  border: 1.5px solid var(--border);
  border-radius: 9px;
  padding: 10px 8px;
  margin-top: 6px;
}
.grid-row.good { border-color: var(--good); background: var(--good-dim); }
.grid-row.bad { border-color: var(--bad); background: var(--bad-dim); }
.grid-row-label { font-size: 13px; padding-right: 6px; }
.grid-cell { display: flex; justify-content: center; align-items: center; padding: 8px 0; cursor: pointer; }
.grid-cell input { width: 21px; height: 21px; accent-color: var(--amber); pointer-events: none; }
.grid-explain { font-size: 12px; color: var(--text-dim); padding: 4px 8px 2px; line-height: 1.5; }

/* ---------- PB: command ---------- */
.subtask { margin-bottom: 16px; }
.subtask-label { font-family: var(--mono); font-size: 11.5px; color: var(--amber); font-weight: 700; margin-bottom: 3px; }
.subtask-prompt { font-size: 13.5px; color: var(--text-dim); margin-bottom: 8px; line-height: 1.5; }
.cmd-line {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #0b0e13;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.prompt-chevron { font-family: var(--mono); color: var(--good); font-size: 13px; flex-shrink: 0; }
.cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 16px;
}
.cmd-input::placeholder { color: var(--text-faint); }
.cmd-answer { margin-top: 10px; padding: 10px 12px; background: var(--panel-2); border-radius: 8px; }
.cmd-answer-label { font-size: 12px; color: var(--text-faint); }
.cmd-answer code {
  font-family: var(--mono);
  background: rgba(232,163,61,0.13);
  color: var(--amber);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13.5px;
}
.cmd-output {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-dim);
  background: #0b0e13;
  border-radius: 6px;
  padding: 8px 10px;
  margin-top: 8px;
  white-space: pre-line;
}
.cmd-answer p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 8px 0 0; }

.self-grade {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  color: var(--text-dim);
  flex-wrap: wrap;
}
.sg-btn {
  border-radius: 8px;
  padding: 9px 14px;
  font-weight: 700;
  font-size: 13.5px;
  border: 1.5px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
}
.sg-btn.good:hover, .sg-btn.good:active { border-color: var(--good); color: var(--good); }
.sg-btn.bad:hover, .sg-btn.bad:active { border-color: var(--bad); color: var(--bad); }

/* ---------- Results ---------- */
.score-hero { text-align: center; padding: 26px 0 6px; }
.score-num { font-family: var(--mono); font-size: 52px; font-weight: 800; letter-spacing: -0.02em; }
.score-of { color: var(--text-faint); font-size: 28px; }
.score-pct { font-family: var(--mono); color: var(--amber); font-size: 16px; font-weight: 700; margin-top: 2px; }

.result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.result-actions .opt-btn { flex: 1; text-align: center; min-width: 120px; }

.review-list { display: flex; flex-direction: column; gap: 8px; }
.review-card {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.review-card.good { border-left-color: var(--good); }
.review-card.bad { border-left-color: var(--bad); }
.review-card summary {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12.5px;
  list-style: none;
}
.review-card summary::-webkit-details-marker { display: none; }
.review-icon { font-weight: 800; width: 14px; }
.review-card.good .review-icon { color: var(--good); }
.review-card.bad .review-icon { color: var(--bad); }
.review-title { color: var(--text-dim); }
.review-stem { font-size: 13.5px; margin: 10px 0 8px; line-height: 1.5; white-space: pre-line; }
.review-answer { font-size: 12.5px; color: var(--amber); margin-bottom: 6px; line-height: 1.5; }
.review-rationale { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }

@media (max-width: 380px) {
  .hero h1 { font-size: 27px; }
  .score-num { font-size: 44px; }
  .grid-header, .grid-row { grid-template-columns: 1fr repeat(var(--cols, 3), 46px); }
}

/* ---------- Timer ---------- */
.quiz-timer {
  font-family: var(--mono);
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.quiz-timer.warn { color: var(--amber); }
.quiz-timer.urgent { color: var(--bad); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

/* ---------- Wrong-pick explanation ---------- */
.wrong-pick {
  margin: 10px 0 0;
  padding-top: 10px;
  border-top: 1px solid rgba(240,102,90,0.25);
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--text);
}
.wrong-pick strong { color: var(--bad); }

/* ---------- Browse link on home ---------- */
.browse-link {
  display: block;
  width: 100%;
  margin-top: 10px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 13.5px;
  font-weight: 600;
  padding: 10px;
  text-align: center;
}
.browse-link:hover { color: var(--amber); }

/* ---------- Browse screen ---------- */
.browse-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 2px 4px;
}
.back-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
}
.browse-title { font-size: 20px; font-weight: 800; }
.browse-search {
  display: block;
  width: 100%;
  margin-top: 12px;
  background: var(--panel-2);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 12px 13px;
  font-size: 16px;
  font-family: var(--sans);
}
.browse-search::placeholder { color: var(--text-faint); }
.browse-search:focus { outline: none; border-color: var(--amber); }
.browse-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.browse-exam-header {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-faint);
  font-weight: 700;
  margin: 14px 2px 2px;
}
.browse-exam-header:first-child { margin-top: 2px; }

.browse-card {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 4px 12px;
}
.browse-card summary {
  display: flex;
  align-items: baseline;
  gap: 8px;
  cursor: pointer;
  padding: 10px 0;
  list-style: none;
  flex-wrap: wrap;
}
.browse-card summary::-webkit-details-marker { display: none; }
.browse-id { font-family: var(--mono); font-weight: 700; color: var(--amber); font-size: 13px; flex-shrink: 0; }
.browse-preview { font-size: 13px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.browse-body { padding: 4px 0 14px; border-top: 1px solid var(--border-soft); margin-top: 2px; padding-top: 12px; }
.browse-choices { display: flex; flex-direction: column; gap: 8px; }
.browse-choice { background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 9px; padding: 10px 12px; }
.browse-choice.good { border-color: var(--good); background: var(--good-dim); }
.browse-choice-head { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; }
.browse-choice.good .choice-letter { color: var(--good); }
.browse-choice.good .choice-icon { color: var(--good); font-weight: 800; margin-left: auto; }
.browse-choice-exp { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin-top: 6px; padding-left: 28px; }

.match-answer-static {
  display: inline-block;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--good);
  background: var(--good-dim);
  border-radius: 6px;
  padding: 5px 9px;
  margin-bottom: 6px;
}
.grid-cell-static {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--good);
  font-weight: 800;
}

.review-card.unanswered { border-left-color: var(--text-faint); }
.review-card.unanswered .review-icon { color: var(--text-faint); }

/* ---------- Per-choice expandable explanation (post-check) ---------- */
.choice-caret {
  font-size: 10px;
  color: var(--text-faint);
  margin-left: auto;
  flex-shrink: 0;
}
.choice.good .choice-caret { color: var(--good); }
.choice.bad .choice-caret { color: var(--bad); }
.choice-explain {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-dim);
  background: var(--panel-2);
  border: 1px solid var(--border-soft);
  border-left: 3px solid var(--border);
  border-radius: 0 8px 8px 0;
  padding: 10px 12px;
  margin: -3px 0 0;
  animation: rise 0.15s ease;
}
.choice-explain.good { border-left-color: var(--good); }
.choice-explain.bad { border-left-color: var(--bad); }
.choice.muted:hover { opacity: 0.85; }

/* ---------- Quiz screen nav row (exit / browse) ---------- */
.quiz-nav {
  display: flex;
  gap: 8px;
  padding: 4px 2px 10px;
}
.nav-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--mono);
}
.nav-btn:hover { border-color: var(--amber); color: var(--text); }

/* ---------- Study Game ---------- */
.game-panel { border-color: rgba(232,163,61,0.3); }
.game-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px; }
.game-start-btn {
  background: linear-gradient(135deg, var(--amber), #f0b559);
  font-size: 16px;
}

.game-hud {
  background: var(--panel);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
.game-hud-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--mono);
  font-size: 13px;
}
.game-hud-row + .game-hud-row { margin-top: 8px; }
.hearts { letter-spacing: 3px; font-size: 16px; }
.heart.alive { color: var(--bad); }
.heart.lost { color: var(--border); }
.game-timer { font-weight: 800; color: var(--text); }
.game-timer.urgent { color: var(--bad); animation: pulse 0.6s infinite; }
.streak { color: var(--amber); font-weight: 700; }
.best-streak { color: var(--text-faint); font-weight: 400; }
.game-score { color: var(--good); font-weight: 700; }
.game-quit {
  display: block;
  width: 100%;
  margin-top: 14px;
  text-align: center;
}

.game-over-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.game-missed-item {
  font-size: 12.5px;
  color: var(--text-dim);
  padding: 8px 0;
  border-bottom: 1px solid var(--border-soft);
  line-height: 1.5;
}
.game-missed-item:last-child { border-bottom: none; }

/* ---------- Difficulty tier badge ---------- */
.tier-badge {
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 6px;
  border-radius: 4px;
  vertical-align: middle;
}
.tier-badge.tier-moderate { background: rgba(95,216,122,0.16); color: var(--good); }
.tier-badge.tier-hard { background: rgba(232,163,61,0.16); color: var(--amber); }
.tier-badge.tier-expert { background: rgba(240,102,90,0.16); color: var(--bad); }

/* ---------- Core 1 has a 5th domain ---------- */
:root { --d5: #b07ee8; }
.meter-fill.domain-5, .domain-tag.domain-5 { background: var(--d5); }

/* ---------- Source badge (book vs added) ---------- */
.src-badge {
  font-size: 9px; font-weight: 800; letter-spacing: 0.06em;
  padding: 2px 5px; border-radius: 4px; vertical-align: middle;
}
.src-badge.src-book { background: rgba(91,155,213,0.18); color: var(--d1); }
.src-badge.src-orig { background: rgba(176,126,232,0.18); color: #b07ee8; }

/* ---------- Image performance-based questions ---------- */
.pbq-img {
  display: block; width: 100%; height: auto;
  border-radius: 8px; margin: 10px 0;
  background: #fff; border: 1px solid var(--border);
}

/* ---------- PB: fill-in graded rows ---------- */
.subtask.good .cmd-line { border-color: var(--good); background: var(--good-dim); }
.subtask.bad .cmd-line { border-color: var(--bad); background: var(--bad-dim); }
.subtask.good .cmd-answer { border-left: 3px solid var(--good); }
.subtask.bad .cmd-answer { border-left: 3px solid var(--bad); }

/* ---------- Boot placeholder / load-failure card ---------- */
.boot { margin: 16vh auto 0; max-width: 420px; padding: 18px 18px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--text); font-size: 15px; line-height: 1.5; }
.boot span, .boot p { display: block; margin: 8px 0 0; color: var(--text-dim); font-size: 13px; }
.boot-error { border-color: var(--bad); }
.boot-error strong { color: var(--bad); }


/* ============================================================
   Resume panel, Study Lab, connector gallery
   ============================================================ */

/* ----- Home: resume + lab panels ----- */
.resume-panel { border-color: rgba(95,216,122,0.4); background: linear-gradient(180deg, rgba(95,216,122,0.08), var(--panel) 75%); }
.resume-panel .panel-title { color: var(--good); }
.resume-panel .game-desc { margin-bottom: 4px; }
.start-btn.resume-btn { background: var(--good); color: #0b2314; box-shadow: 0 8px 24px -8px rgba(95,216,122,0.55); margin-top: 12px; }
.resume-panel .browse-link { margin-top: 4px; padding: 8px; }
.back-btn.resume-back { background: var(--amber); border-color: var(--amber); color: #241a05; font-weight: 800; }
.lab-panel { border-color: rgba(176,126,232,0.4); }
.lab-run-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 10px; padding: 8px 10px; border: 1px solid rgba(176,126,232,0.4); border-radius: 10px; background: var(--panel); }
.lab-run-pos { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; color: #b07ee8; font-weight: 800; }
.lab-run-next { flex: 1; min-width: 120px; font-size: 12.5px; color: var(--text-dim); }
.lab-run-go { border-color: #b07ee8; }
.lab-run-select { max-width: 100%; min-width: 0; flex: 1 1 200px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font: inherit; font-size: 13px; }
.lab-run-start { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 12px; }
.lab-run-start .lab-start-btn { margin-top: 0; flex: 1 1 220px; }
.lab-run-from { display: flex; flex-direction: column; gap: 4px; flex: 2 1 260px; font-size: 12px; color: var(--text-dim); }
.choice.picked { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
.lab-panel .panel-title { color: #b07ee8; }
.start-btn.lab-start-btn { background: linear-gradient(135deg, #b07ee8, #9566d6); color: #fff; box-shadow: 0 8px 24px -8px rgba(176,126,232,0.55); margin-top: 12px; }

/* ----- Numbered connector gallery (image performance questions) ----- */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; margin: 8px 0 6px; }
.gal-item { position: relative; margin: 0; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 84px; }
.gal-item img { display: block; width: 100%; height: auto; }
.gal-label { position: absolute; top: 6px; left: 6px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--amber); color: #241a05; font: 800 13px/24px var(--mono); text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }

/* ----- Lab menu ----- */
.lab-group-title { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.12em; color: var(--amber); font-weight: 800; margin: 26px 2px 4px; text-transform: uppercase; }
.lab-group-blurb { font-size: 12.5px; color: var(--text-dim); margin: 0 2px 10px; line-height: 1.5; }
.lab-card-list { display: flex; flex-direction: column; gap: 8px; }
.lab-card { display: flex; flex-direction: column; gap: 5px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 12px; padding: 13px 14px; color: var(--text); transition: border-color 0.12s, background 0.12s; }
.lab-card:hover, .lab-card:active { border-color: var(--amber-dim); background: var(--panel-2); }
.lab-card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.lab-card-title { font-size: 15px; font-weight: 800; margin-right: 2px; }
.lab-card-sub { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }
.lab-card-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.03em; }
.src-badge.src-extra { background: rgba(232,163,61,0.18); color: var(--amber); }

/* ----- Sort board: header ----- */
.lab-top { display: flex; align-items: center; gap: 10px; padding: 4px 0 6px; }
.lab-title { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; line-height: 1.2; }
.lab-clock { font-family: var(--mono); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 64px; text-align: center; }
.lab-clock.stopped { color: var(--good); border-color: rgba(95,216,122,0.4); }
.lab-blurb { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 4px 2px 12px; }

/* ----- Sort board: columns / rows ----- */
.lab-cols { display: grid; gap: 10px; margin-top: 4px; }
.lab-cols.lay-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lab-cols.lay-cols > .lab-col:last-child:nth-child(odd) { grid-column: 1 / -1; }
.lab-cols.lay-rows { grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (min-width: 560px) {
  .lab-cols.lay-cols.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lab-cols.lay-cols.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lab-cols.lay-cols.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .lab-cols.lay-cols.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lab-cols.lay-cols.n7, .lab-cols.lay-cols.n8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lab-cols.lay-cols > .lab-col:last-child:nth-child(odd) { grid-column: auto; }
}

.lab-col { background: var(--panel); border: 1.5px solid var(--border-soft); border-radius: 12px; padding: 8px; min-width: 0; transition: border-color 0.12s, background 0.12s, box-shadow 0.12s; }
.lab-col.target { border-color: var(--amber); border-style: dashed; background: rgba(232,163,61,0.07); box-shadow: 0 0 0 3px rgba(232,163,61,0.12); cursor: pointer; }
.lab-col.over { border-color: var(--amber); border-style: solid; background: rgba(232,163,61,0.14); }
.lab-col.full:not(.target) { border-color: var(--border); }
.lab-col-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; padding: 2px 4px 8px; }
.lab-col-label { font-weight: 800; font-size: 14.5px; line-height: 1.2; }
.lab-col-sub { font-size: 11px; color: var(--text-faint); font-family: var(--mono); line-height: 1.3; }
.lab-col-count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
.lab-col.full .lab-col-count { color: var(--good); }
.lab-slots { display: flex; flex-direction: column; gap: 6px; }
.lab-slot { min-height: 44px; border: 1.5px dashed var(--border); border-radius: 9px; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }

/* rows layout (matching / ordering boards): label on the left, slot on the right */
.lab-col.row { display: grid; grid-template-columns: minmax(88px, 34%) minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 8px; }
.lab-col.row .lab-col-head { flex-direction: column; align-items: flex-start; gap: 1px; padding: 0 2px; }
.lab-col.row .lab-col-label { font-size: 14px; }
.lab-col.row .lab-col-sub { font-size: 10.5px; }
.lab-col.row .lab-slot { min-height: 40px; }

/* ----- Tiles ----- */
.lab-tile { position: relative; display: block; text-align: left; font: 600 13px/1.3 var(--sans); color: #1b2230; border: 2px solid transparent; border-radius: 9px; padding: 9px 10px; min-height: 40px; cursor: grab; box-shadow: 0 1px 0 rgba(0,0,0,0.25), 0 3px 8px -3px rgba(0,0,0,0.5); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 0.1s, box-shadow 0.1s, border-color 0.1s; }
.lab-slots .lab-tile { width: 100%; }
.lab-tile:active { transform: scale(0.985); }
.lab-tile:disabled { color: #1b2230; opacity: 1; cursor: default; }
.tc0 { background: #ffd8a8; }
.tc1 { background: #fff3a6; }
.tc2 { background: #c4f1c9; }
.tc3 { background: #a8eefb; }
.tc4 { background: #b4cdfd; }
.tc5 { background: #d3c6ff; }
.tc6 { background: #ffc8ee; }
.tc7 { background: #d9f2a6; }
.lab-tile.sel { border-color: #fff; box-shadow: 0 0 0 3px var(--amber), 0 6px 14px -4px rgba(0,0,0,0.6); transform: translateY(-1px); }
.lab-tile.flash { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); }
.lab-tile.locked { border-color: var(--good); cursor: default; box-shadow: none; }
.lab-tile.revealed { border-color: var(--good); }
.lab-check { color: #0b6b2a; font-weight: 800; margin-right: 6px; }

/* T568 wire-colour tiles */
.lab-tile.wire { color: #111; padding: 8px; border-color: rgba(0,0,0,0.35); }
.lab-tile.wire.sel { border-color: #fff; }
.lab-tile.wire.locked, .lab-tile.wire.revealed { border-color: var(--good); }
.lab-tile.wire.flash { border-color: var(--bad); }
.wire-text { display: inline-block; background: rgba(255,255,255,0.93); padding: 1px 7px; border-radius: 6px; font-weight: 700; }
.wire-OW { background: repeating-linear-gradient(135deg, #ffffff 0 9px, #f59a23 9px 18px); }
.wire-O { background: #f59a23; }
.wire-GW { background: repeating-linear-gradient(135deg, #ffffff 0 9px, #2fa84f 9px 18px); }
.wire-G { background: #2fa84f; }
.wire-BW { background: repeating-linear-gradient(135deg, #ffffff 0 9px, #2f6fe0 9px 18px); }
.wire-B { background: #2f6fe0; }
.wire-BrW { background: repeating-linear-gradient(135deg, #ffffff 0 9px, #8a5a2b 9px 18px); }
.wire-Br { background: #8a5a2b; }

/* ----- Sticky tray + Submit ----- */
.lab-tray { position: sticky; bottom: 0; z-index: 30; margin: 18px -16px -64px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(21,26,35,0.97); border-top: 1px solid var(--border); box-shadow: 0 -12px 28px rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.lab-tray.target { border-top-color: var(--amber); }
.lab-tray.over { background: rgba(58,47,20,0.97); }
.lab-tray-head { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 8px; }
.lab-tray-title { color: var(--amber); font-weight: 800; }
.lab-msg { font-size: 12.5px; color: var(--amber); background: rgba(232,163,61,0.1); border-radius: 7px; padding: 7px 9px; margin-bottom: 8px; line-height: 1.4; }
.lab-tray-tiles { display: flex; flex-wrap: wrap; gap: 7px; max-height: min(30vh, 260px); overflow-y: auto; padding: 2px 2px 4px; overscroll-behavior: contain; }
.lab-tray-tiles .lab-tile { width: auto; max-width: 100%; flex: 0 1 auto; }
.lab-tray-empty { font-size: 13px; color: var(--good); padding: 8px 4px; }
.lab-actions { display: flex; gap: 8px; margin-top: 9px; align-items: stretch; }
.lab-submit { flex: 1 1 auto; background: var(--amber); color: #241a05; border: none; border-radius: 10px; padding: 12px 14px; font-weight: 800; font-size: 15px; }
.lab-submit:disabled { background: var(--raised); color: var(--text-faint); cursor: not-allowed; }
.lab-minor { background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; font-size: 12px; font-weight: 700; }
.lab-minor:hover { border-color: var(--amber-dim); color: var(--text); }

/* ----- Result card + memory hooks ----- */
.lab-result { border-radius: 12px; padding: 14px; margin: 6px 0 14px; border: 1px solid var(--border); background: var(--panel); }
.lab-result.good { border-color: rgba(95,216,122,0.45); background: var(--good-dim); }
.lab-result.neutral { border-color: rgba(232,163,61,0.35); }
.lab-result-title { font-weight: 800; font-size: 16px; margin-bottom: 6px; }
.lab-result.good .lab-result-title { color: var(--good); }
.lab-result-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }
.lab-result-line { margin: 4px 0 8px; font-size: 13px; color: var(--text-dim); line-height: 1.5; }
.lab-result-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.lab-result-actions .opt-btn { flex: 1; text-align: center; min-width: 110px; }
.lab-missed { margin-top: 6px; }
.lab-missed-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 6px; }
.lab-missed-item { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12.5px; padding: 5px 0; border-top: 1px solid rgba(255,255,255,0.06); }
.lab-missed-tile { color: var(--text); }
.lab-missed-arrow { color: var(--text-faint); }
.lab-missed-col { color: var(--amber); font-weight: 700; }
.lab-hooks .lab-hook-main { font-size: 13.5px; line-height: 1.55; margin: 0 0 10px; }
.lab-hook { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border-soft); font-size: 12.5px; line-height: 1.5; }
.lab-hook-label { flex: 0 0 84px; font-weight: 800; color: var(--amber); font-family: var(--mono); font-size: 11.5px; }
.lab-hook-text { color: var(--text-dim); min-width: 0; }

/* ----- Quick quizzes (connector photos / ports / acronyms) ----- */
.lq-img { display: block; max-width: 100%; width: 270px; height: auto; margin: 0 auto 14px; border-radius: 10px; background: #fff; border: 1px solid var(--border); }
.lq-auto { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-dim); margin-left: auto; user-select: none; }
.lq-auto input { width: 16px; height: 16px; accent-color: var(--amber); }
.lq-answer { color: var(--good); }
.lq-why { margin-top: 3px; color: var(--text-faint); font-size: 12px; }
.lq-missed-photo { opacity: 0.8; }

@media (max-width: 380px) {
  .lab-title { font-size: 15.5px; }
  .lab-tile { font-size: 12.5px; padding: 8px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .lab-tile, .lab-col { transition: none !important; }
}

<script>
const QUIZ_DATA = {"mc":{"A":[{"id":"A6","stem":"The printer in the accounting department has stopped all printing processes. The print queue shows seven jobs in the queue waiting to be printed. Which of the following would be the best next troubleshooting step?","choices":[{"letter":"A","text":"Send a test job to the printer and move it to the top of the queue","explanation":"Since the print spooler is the issue, it won't matter where a print job might be in the queue. A test print job will sit at the top of the queue just like any other print job."},{"letter":"B","text":"Restart the printer's spooler","explanation":"The print spooler is the software responsible for storing print jobs and sending them to the printer. If the printer spooler has failed or has stopped, then none of the print jobs will be sent to the printer"},{"letter":"C","text":"Install an updated version of the printer driver","explanation":"The printer driver on a client workstation is responsible for formatting the print job in a way the printer can properly interpret during the printing process. Changing the print driver won't fix problems with the print spooler."},{"letter":"D","text":"Delete everything in the queue and resend the print jobs","explanation":"If the spooler is having problems, then deleting the print jobs will only require users to resend the print requests, which will then sit in the queue and not print."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"A7","stem":"A system administrator has connected an external USB drive to a computer to transfer some documents. When booting the computer, the system tries to boot from the external drive and gives an error message. Which of the following would be the best way to prevent the USB drive from booting?","choices":[{"letter":"A","text":"Modify the BIOS to boot from the internal hard drive","explanation":"The boot order is managed in the system BIOS, and one way to avoid the computer from attempting to boot from an external storage device is to move the internal drive to have a higher boot priority"},{"letter":"B","text":"Modify the boot order in Windows Disk Management","explanation":"Windows Disk Management is not used to configure the boot order of the computer. By the time Windows has loaded, the boot order has already been determined. The boot order is configured in the system BIOS."},{"letter":"C","text":"Rebuild the MBR on the external hard drive","explanation":"Rebuilding the MBR (Master Boot Record) of the external hard drive will not prevent the computer from attempting to boot to the drive. Rebuilding the MBR would only be necessary if the boot record was erased or damaged."},{"letter":"D","text":"Disable the external drive in Device Manager","explanation":"Since Windows Device Manager is only active after the system boots, disabling the external drive would not prevent the boot process. Disabling the drive in Device Manager would only prevent Windows from accessing the drive once the system was booted."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"A8","stem":"A user's print jobs to a new multifunction printer produce pages of garbled text, but jobs from other users are printing normally. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"Printer driver specifies secured prints","explanation":"Secured printing allows the user to associated their print job with a PIN (Personal Identification Number), and the job will not print until the PIN is entered at the printer console. This process does not cause the output to appear garbled or corrupted."},{"letter":"B","text":"Faulty network cable","explanation":"A faulty cable would cause the printer to receive data slowly or not at all. The output of the printer would not be affected by a faulty Ethernet cable."},{"letter":"C","text":"Print driver is configured for PCL","explanation":"The page description language configured in a printer driver must match the language on the printer. If a device prints to a PostScript printer using Hewlett-Packard's PCL (Printer Command Language), the output will appear garbled and unreadable"},{"letter":"D","text":"Application is not authorized to print","explanation":"A print authorization is commonly determined by the user's rights and permissions and is not based on the application. If a user did not have rights to print, then no print job would be queued and no output would be created."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"A9","stem":"A network connection in a conference room was installed years ago, and there’s no documentation for the cable run. Connecting a device to the cable results in a successful Ethernet connection, so the other end of the cable should terminate somewhere in the wiring closet. Which of these tools would be the best choice to find the other end of the network connection?","choices":[{"letter":"A","text":"Cable tester","explanation":"A cable tester could be used to confirm the wire map of the cable, but you would first need to locate both ends before this would be possible. A cable tester doesn't provide a way to locate both ends of a cable."},{"letter":"B","text":"Tone generator","explanation":"A tone generator is used to produce an analog tone on the cable, and an inductive probe is used to \"listen\" for the tone on the other end of the cable"},{"letter":"C","text":"Multimeter","explanation":"A multimeter could be used to verify continuity and the wire map of the cable, but both ends of the cable would need to be close to the multimeter. A multimeter can't be used to locate both ends of a cable."},{"letter":"D","text":"Crimper","explanation":"If the RJ45 connector on the cable was faulty, a crimper could be used to attach a new connector to the cable."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"A10","stem":"A network administrator has received a ticket complaining of port flapping on an Ethernet switch. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"Firewall rule is blocking traffic","explanation":"Denying or allowing traffic on a firewall would not cause an Ethernet interface to physically disconnect or connect itself from the network."},{"letter":"B","text":"Faulty crimp on an Ethernet connector","explanation":"Port flapping describes a network interface which constantly transitions between connected and disconnected. This can sometimes be related to software or firmware, but is most likely associated with a hardware issue. For example, a faulty cable or connector could cause intermittent connectivity and create a flapping Ethernet port"},{"letter":"C","text":"Excessive jitter measurements","explanation":"Jitter measures the time between network frames, and excessive jitter could disrupt real-time voice or video communication. However, excessive jitter would not cause an Ethernet interface to physically disconnect or connect."},{"letter":"D","text":"Duplex mismatch","explanation":"A duplex mismatch would certainly cause performance issues and slowdowns, but it would not cause an Ethernet link to constantly disconnect and reconnect."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"A11","stem":"A user has powered on their computer and received the message “Operating system not found.” A check of the system shows the SATA drive cables are properly connected. Which of the following would be the next best troubleshooting step?","choices":[{"letter":"A","text":"Boot to Safe Mode","explanation":"Safe Mode is a Windows mode used to launch the operating system with minimal services and OS requirements. Safe Mode requires a bootable drive, so the error message in this question would prevent Safe Mode from starting."},{"letter":"B","text":"Replace the boot drive","explanation":"There's not enough information to determine if the boot drive is bad or faulty, so immediately replacing it would be premature. If there aren't any removable storage devices connected to the system, then running hardware diagnostics of the drive would be a good next step before considering a hardware replacement."},{"letter":"C","text":"Restore from a known good backup","explanation":"This question doesn't provide enough information about the state of the primary boot drive, so making any significant changes to the data on the drive would not be the best next step."},{"letter":"D","text":"Check for removable drives","explanation":"If a USB (Universal Serial Bus) storage device is connected to a computer and the BIOS (Basic Input/Output System) is checking USB devices before the primary storage drive, the \"Operating system not found\" error could appear with some USB devices. To avoid this error, the boot order in the BIOS can be changed, or the USB device can be disconnected during the boot process and reconnected after the operating system has started"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"A12","stem":"A user is having an issue with a smartphone battery bulging and physically pushing the screen away from the phone. The rest of the phone appears to be operating normally. Which of the following should be the best next troubleshooting step?","choices":[{"letter":"A","text":"Power off the phone and contact support","explanation":"A swollen battery indicates damage to the battery and could potentially be a fire hazard. The phone should be powered down and the damaged battery should be removed by a trained smartphone support technician"},{"letter":"B","text":"Upgrade to the latest OS version","explanation":"Upgrading software on the smartphone will not fix a damaged battery. The best practice with a bulging or swollen battery is to power down the device and replace the battery."},{"letter":"C","text":"Replace the screen","explanation":"Although a bulging battery may damage other components, there's nothing in this question which indicates any damage to the screen. Any necessary repairs should take place after the damaged battery is replaced."},{"letter":"D","text":"Perform a factory reset","explanation":"A factory reset is a good option for troubleshooting unknown software issues, but it won't correct the damage to a battery. The smartphone should be powered off immediately and repaired."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"A13","stem":"A client’s laptop appears to boot normally, but nothing ever appears on the LCD. After closer inspection, you notice the output is visible but it's too faint to clearly see anything. What is the most likely cause of this issue?","choices":[{"letter":"A","text":"Video card","explanation":"A faulty video card might cause the video display to stop working completely, or the information on the screen may be corrupted. A faulty video adapter does not commonly cause the display to have a decreased backlight setting."},{"letter":"B","text":"Inverter","explanation":"The inverter powers the CCFL (Cold Cathode Fluorescent Lamp) LCD (Liquid Crystal Display) backlight, allowing you to easily view the pixels on the display. Most newer laptops will use LED (Light Emitting Diode) backlights with existing DC (Direct Current) power and these LED lights don’t require an inverter"},{"letter":"C","text":"Video driver","explanation":"Bad video drivers often cause issues with resolution settings or aspect ratios, but a bad video driver does not commonly affect the backlight settings."},{"letter":"D","text":"Power adapter","explanation":"A bad power adapter would cause a laptop to fail during the boot process or fail to properly charge a battery. A bad power supply would not usually cause everything to work properly except for the backlight."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","source":"book"},{"id":"A14","stem":"A graphics designer is experiencing increasing delays when accessing files on her hard drive. The user maintains a daily backup of all data on the drive. Which of these would be the best next troubleshooting step for this issue?","choices":[{"letter":"A","text":"Reinstall Windows","explanation":"Reinstalling Windows won't help if the hard drive is not operating properly. The installation process is also a time-consuming and significant change, so it's important to know if the underlying hardware is working."},{"letter":"B","text":"Perform a hard drive diagnostic","explanation":"Before making any changes, it would be useful to gather more information about this problem. A hardware diagnostic would determine if the hard drive itself is working properly. If the hard drive is operating normally, the troubleshooting process can then focus on the operating system and software"},{"letter":"C","text":"Restore from the daily backup","explanation":"The root cause of this issue hasn't been identified, so any significant change to the user's data would be premature. The user may have also modified some of this data since the backup was taken, so restoring the backup could potentially result in the loss of user data."},{"letter":"D","text":"Boot to Safe Mode","explanation":"Safe Mode will start Windows with a minimal configuration, and this could help troubleshoot software issues with the operating system itself. Before analyzing the software, it would be important to know if the underlying hardware is working properly."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"A15","stem":"Which of the following would be most likely found on an optical disc?","choices":[{"letter":"A","text":"Document archive","explanation":"An optical disc such as a DVD-ROM (Digital Versatile Disc - Read Only Memory) has the advantage of a relatively large storage area and the ability to write once and never worry about an accidental deletion. The storage of documents and other files is a common use of optical discs"},{"letter":"B","text":"Operating system boot files","explanation":"Although it is possible to boot an operating system from an optical disc, it's not a common use of the format. It's much more common to store operating system files on a local storage drive with a higher storage capacity and throughput, such as a hard drive or SSD (Solid-State Drive)."},{"letter":"C","text":"RAID parity files","explanation":"A RAID (Redundant Array of Independent Disks) array requires all of the data and parity information reside on the local storage drives. Parity information would not be stored on an optical disc."},{"letter":"D","text":"BIOS configurations","explanation":"BIOS configurations need to be accessible from the motherboard of a computer, and not from other storage devices. BIOS configurations would not be found on an optical disc."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.4 - Storage Devices","link":"https://professormesser.link/1201030401","source":"book"},{"id":"A16","stem":"When a user starts their computer, the screen remains blank and the computer beeps twice. Which of these would be the most likely cause of this issue?","choices":[{"letter":"A","text":"The boot device is not connected","explanation":"A missing boot device would display the normal BIOS startup and display a message on the screen for \"No Boot Device Found.\""},{"letter":"B","text":"The memory is faulty","explanation":"The POST (Power On Self Test) is the initial hardware check during the startup process. If a major hardware component is faulty, the computer will beep and a message will be displayed on the screen. If the issue is related to a critical component, the computer will not be able to display a message on the screen and instead will beep a certain number of times as a code to specify the error"},{"letter":"C","text":"The operating system has become corrupted","explanation":"A bad operating system would display the normal BIOS startup messages. When the operating system tries to load, the OS will provide error messages on the screen for any issues related to the corrupted files."},{"letter":"D","text":"The PC is infected with malware","explanation":"A malware infection would not commonly cause a system to boot with a blank screen and a beep code. Malware would be identified once the operating system has started."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"A17","stem":"A firewall is configured to block email transfers from a remote server. Which of the following ports is the firewall blocking?","choices":[{"letter":"A","text":"443","explanation":"Port 443 is commonly used by web browsers to transfer information using SSL (Secure Sockets Layer) or TLS (Transport Layer Security) encryption protocols."},{"letter":"B","text":"22","explanation":"The SSH (Secure Shell) protocol uses port 22 as encrypted terminal communication. SSH is commonly used to access the command line terminal of remote devices and servers."},{"letter":"C","text":"23","explanation":"Port 23 is used by Telnet for non-encrypted terminal communication between devices."},{"letter":"D","text":"25","explanation":"Port 25 is used by SMTP (Simple Mail Transfer Protocol) to send email messages from devices and transfer those messages between SMTP email servers"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.1 - Common Ports","link":"https://professormesser.link/1201020102","source":"book"},{"id":"A18","stem":"A technician is connecting a laptop to an LCD projector in a conference room. The display on the laptop works properly, but the projector image is constantly flickering and pixelating. The technician has modified the resolution and refresh rates, but the projector image continues to flicker. Which of the following would be the best next troubleshooting step?","choices":[{"letter":"A","text":"Replace the video cable","explanation":"A display issue associated with flickering and poor video quality would commonly point to the connection between the video adapter and the display device. In the case of an LCD (Liquid Crystal Display) projector, there's sometimes a very long (and very worn) cable which can cause signal issues to show on the projected image"},{"letter":"B","text":"Disable the laptop display","explanation":"Disabling the laptop display won't help with any signal problems. This would probably also hinder the troubleshooting process because you wouldn't be able to properly see the display information due to all of the flickering and pixelating."},{"letter":"C","text":"Replace the projector bulb","explanation":"The bulb in an LCD projector either works or doesn't, so it will be very obvious if the bulb is faulty. In this example, the projector bulb is working, but the information displayed on the projector is difficult to see."},{"letter":"D","text":"Power cycle the projector","explanation":"The projector itself would not commonly cause any display flickering or image problems, so power cycling the projector wouldn't normally resolve this type of problem. If all other troubleshooting tasks fail, then power cycling everything might be an option, but it wouldn't be the first troubleshooting step."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"A19","stem":"The stylus on an Android tablet will no longer interact with the user interface. Which of these would be the most likely cause of this issue?","choices":[{"letter":"A","text":"Digitizer","explanation":"The digitizer is the component in a touch screen to convert analog input from a fingerprint or stylus into a digital input. If the digitizer is having an issue, then problems will occur with any direct screen input"},{"letter":"B","text":"Backlight","explanation":"An LCD (Liquid Crystal Display) screen does not produce any light, so a backlight is used to make the screen bright enough to see. The brightness of the screen does not have any effect on the stylus."},{"letter":"C","text":"Contrast","explanation":"The contrast and brightness controls do not effect the use of a stylus on an LCD."},{"letter":"D","text":"Inverter","explanation":"An inverter is used in older LCDs to invert DC (Direct Current) power into AC (Alternating Current) power. This AC power is used by CCFL (Cold Cathode Fluorescent Lamp) backlights. Most of the newer LCDs contain LED (Light Emitting Diode) backlights which use the existing DC power and do not require an inverter."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","source":"book"},{"id":"A20","stem":"A user in the accounting department needs to print a form on the laser printer on both sides of the page. Which of the following options should be configured in the accounting software?","choices":[{"letter":"A","text":"Tray settings","explanation":"A printer's tray settings can be used to select the right paper type or different paper sizes. The tray settings would not generally provide an option to print on both sides of the page."},{"letter":"B","text":"Orientation","explanation":"The orientation setting will change the output between portrait or landscape. The orientation option will not change which sides of the page are used during the printing process."},{"letter":"C","text":"Duplex","explanation":"The duplex setting prints the output on both sides of the page, and a printer which supports duplexing will flip the page over without any manual intervention from the user"},{"letter":"D","text":"Resolution","explanation":"The resolution setting will modify the number of dots per inch used for the output. A larger number of dots per inch will increase the resolution and make the text and images appear sharper on the page."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"A21","stem":"A user needs to connect their laptop to the wired Ethernet network, but the laptop does not have an integrated Ethernet interface. Which of the following would allow the laptop to connect to an Ethernet network? (Pick TWO)","choices":[{"letter":"A","text":"Docking station","explanation":"There are a few options for creating a wired Ethernet connection on a laptop computer. Using a docking station is a common solution to provide many different interfaces, and docking stations often include the option to install a full-size PCI Express (Peripheral Component Interconnect Express) adapter. A USB (Universal Serial Bus) to Ethernet adapter is a simpler solution which only provides an Ethernet interface, but it's much more portable than a docking station"},{"letter":"B","text":"VGA interface","explanation":"A VGA (Video Graphics Array) interface is an interface for video output and does not provide Ethernet connectivity."},{"letter":"C","text":"USB to Ethernet adapter","explanation":"There are a few options for creating a wired Ethernet connection on a laptop computer. Using a docking station is a common solution to provide many different interfaces, and docking stations often include the option to install a full-size PCI Express (Peripheral Component Interconnect Express) adapter. A USB (Universal Serial Bus) to Ethernet adapter is a simpler solution which only provides an Ethernet interface, but it's much more portable than a docking station"},{"letter":"D","text":"DisplayPort to HDMI cable","explanation":"Both DisplayPort and HDMI (High-Definition Multimedia Interface) provide video output and are not used for Ethernet on a laptop computer."},{"letter":"E","text":"DVI to HDMI adapter","explanation":"DVI (Digital Visual Interface) and HDMI are video interfaces and do not provide a wired Ethernet link."},{"letter":"F","text":"Bluetooth","explanation":"Bluetooth is a wireless PAN (Personal Area Network), and it does not provide wired Ethernet connectivity."}],"correct":["A","C"],"multi":true,"objective":"220-1201, Objective 3.2 - Adapters and Converters","link":"https://professormesser.link/1201030207","source":"book"},{"id":"A22","stem":"A server administrator has received an alert showing one drive in a RAID 1 array has failed. Which of the following would be the best way to resolve this alert?","choices":[{"letter":"A","text":"Replace the bad drive and resync the array","explanation":"A RAID 1 (Redundant Array of Independent Disks, level 1) array is a mirrored array, which means all of the information on one physical drive is also copied and maintained on a separate drive. If one drive fails, the drive with the redundant data continues to be available. To repair the array, the bad drive needs to be replaced and the data from the redundant drive is synchronized to the new drive"},{"letter":"B","text":"Replace all drives in the array and resync the array","explanation":"A RAID 1 array continues to run after a drive outage, and all data continues to be available. There's no reason to replace all of the drives in the array, and if all drives were replaced there would be nothing to resync."},{"letter":"C","text":"Replace the bad drive and restore from backup","explanation":"Since no data is lost after a single drive failure in a RAID 1 array, restoring from backup is not necessary."},{"letter":"D","text":"Convert the array to RAID 0 and replace the drive","explanation":"RAID 0 is striping data across drives, and there is no redundancy in a RAID 0 array. It's unusual to convert arrays between RAID levels, and a conversion is not necessary to restore full functionality to this RAID 1 array."},{"letter":"E","text":"Replace all drives in the array and restore from backup","explanation":"There's no need to restore from backup when replacing a single drive in a RAID 1 array."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"A23","stem":"A system administrator is building a server for a data center in another country. The server will manage a print queue and provide a local storage partition for temporary file transfers. Which of the following power supply specifications will be the most important for this server?","choices":[{"letter":"A","text":"Voltage input options","explanation":"Connecting to the power source in a different country is an important consideration when selecting a power supply. If the voltage specifications are incorrect, the server may not operate at all or components in the server may be damaged. Servers using auto-switching power supplies are compatible with the power systems in other countries"},{"letter":"B","text":"Number of PCIe connectors","explanation":"PCIe (Peripheral Component Interconnect Express) is a standard bus type, and some of the adapters on this bus may require additional power. However, none of the requirements of this server would need more PCIe connectors than a standard power supply."},{"letter":"C","text":"Modular cabling","explanation":"Using a power supply with modular cables can help with airflow, but this modularity isn't a requirement for most systems. Most data centers are climate controlled, so it shouldn't be difficult to maintain a reasonable temperature with a non-modular power supply."},{"letter":"D","text":"Fan noise rating","explanation":"A data center is usually quite noisy, so the noise rating of a power supply is not going to be a significant concern."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.6 - Power","link":"https://professormesser.link/1201030601","source":"book"},{"id":"A24","stem":"Which of the following ports are used for file transfers? (Select TWO)","choices":[{"letter":"A","text":"21","explanation":"FTP (File Transfer Protocol) is a standard method of transferring files across different operating systems. FTP uses TCP (Transmission Control Protocol) port 21 for control messages and port 20 to transfer data"},{"letter":"B","text":"110","explanation":"Port 110 is the default port for POP3 (Post Office Protocol version 3). POP3 is commonly used to retrieve email messages from an email server to a local email client application."},{"letter":"C","text":"25","explanation":"Another common email protocol is SMTP (Simple Mail Transfer Protocol), which uses port 25 for sending mail to a mail server and to transfer email messages between mail servers."},{"letter":"D","text":"23","explanation":"Non-encrypted (in-the-clear) terminal communication is provided with the Telnet (Telecommunication Network) protocol over port 23."},{"letter":"E","text":"20","explanation":"FTP (File Transfer Protocol) is a standard method of transferring files across different operating systems. FTP uses TCP (Transmission Control Protocol) port 21 for control messages and port 20 to transfer data"},{"letter":"F","text":"53","explanation":"Port 53 is the default port for DNS (Domain Name System). DNS is commonly used to convert fully qualified domain names to IP addresses."}],"correct":["A","E"],"multi":true,"objective":"220-1201, Objective 2.1 - Port Numbers","link":"https://professormesser.link/1201020102","source":"book"},{"id":"A25","stem":"Which of these technologies do not require a backlight to provide a viewable display?","choices":[{"letter":"A","text":"LCD","explanation":"An LCD (Liquid Crystal Display) screen does not produce any light, so a backlight is required to see the screen contents. Most LCD displays use LEDs (Light Emitting Diodes) or CCFLs (Cold Cathode Fluorescent Lamps) as a backlight."},{"letter":"B","text":"IPS","explanation":"IPS (In Plane Switching) LCD monitors provide excellent color representation, but they are still LCDs and require a backlight."},{"letter":"C","text":"OLED","explanation":"An OLED (Organic Light Emitting Diode) display emits light when a current is provided to an organic compound. A backlight would not be necessary with an OLED display"},{"letter":"D","text":"Mini LED","explanation":"Mini LED is a type of backlight commonly used on LCD displays to distribute many small backlight LEDs across the entire display area."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","source":"book"},{"id":"A26","stem":"A system administrator has tripped over an Ethernet cable and the cable’s RJ45 connector has broken. Which of the following should be used to resolve this issue?","choices":[{"letter":"A","text":"Punch-down tool","explanation":"A punch-down tool is used to connect wires to punch-down blocks, such as a 110 block. A punch-down tool can't be used to attach a new RJ45 connector to a cable."},{"letter":"B","text":"Tone generator and probe","explanation":"Tone generators and inductive probes are used to find both ends of a cable. Toner probes are not used to connect RJ45 connectors."},{"letter":"C","text":"Cable tester","explanation":"Cable testers can be used to determine the wire map of a cable. Once the crimper has been used to attach the RJ45 connector, the cable tester can confirm the connector is properly wired. Cable testers are not used to connect modular connectors to a cable."},{"letter":"D","text":"Crimper","explanation":"A crimper is used to attach a modular connector to a cable. In this example, a new connector can be reattached to the cable using an RJ45 (Registered Jack type 45) crimper"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"A27","stem":"A system administrator hears an audible alarm when they walk in the door of the data center. Which of the following would be the most likely reason for this alarm?","choices":[{"letter":"A","text":"An operating system has failed to boot","explanation":"Although a non-booting system can be a significant issue, it doesn't commonly cause data loss. A boot problem with an operating system will not commonly be associated with an audible alarm."},{"letter":"B","text":"A RAID array has failed","explanation":"Most RAID arrays will provide an audible alarm if a drive has failed. This loud alert informs anyone nearby that a serious error has occurred and needs to be addressed immediately to avoid any potential data loss"},{"letter":"C","text":"A backup drive is full","explanation":"A full drive will often cause errors with operating systems and applications, but it does not include any type of audible feedback. Although the full storage drive condition will most likely need to be resolved, it does not include an audible alert."},{"letter":"D","text":"A network uplink is disconnected","explanation":"A network uplink is used to connect multiple network devices together, and often will link one switch to another. If this link fails, the communications link between the devices will stop forwarding data. This type of disconnection does not commonly cause an audible alarm, however."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"A28","stem":"A newly installed multifunction device provides an option to \"scan to SMB.\" Which of the following would best describe this feature?","choices":[{"letter":"A","text":"Print jobs can be sent from mobile devices","explanation":"Many mobile devices can send jobs to a local printer, but this feature isn't part of the scanning process."},{"letter":"B","text":"All scans are checked for malware","explanation":"Although it's important to protect against all sources of malware, it would be unusual for a newly scanned document on a local multifunction device to contain any malicious software."},{"letter":"C","text":"Files are stored on a Microsoft share","explanation":"SMB (Server Message Block) is the protocol used by Microsoft operating systems to share files, print jobs, and other information between other Microsoft OS devices. Many multifunction devices can scan a document and store the scanned file on a central network share using SMB"},{"letter":"D","text":"Documents are scanned from the cloud","explanation":"Many multifunction devices can support input from different sources, but the scan to SMB feature describes the location of the output file once the original document has been scanned."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"A29","stem":"A network administrator is powering their access points using voltage provided through the existing Ethernet cables. Which of the following technologies is associated with this power source?","choices":[{"letter":"A","text":"UPS","explanation":"A UPS (Uninterruptible Power Supply) is used to maintain a battery backup if the main power connection fails. A UPS does not commonly power devices over Ethernet cables."},{"letter":"B","text":"PoE switch","explanation":"A PoE (Power over Ethernet) switch provides voltage over the Ethernet cable itself. This allows devices to power and communicate using voltage added to the Ethernet cable at a PoE switch or using an PoE injector"},{"letter":"C","text":"Router","explanation":"A router is used to forward traffic from one IP subnet to another. Power over an Ethernet cable is not commonly associated with a router."},{"letter":"D","text":"Surge protector","explanation":"A surge protector is responsible for filtering any high or low voltages over an existing power connection. A surge protector does not provide power to systems over an Ethernet connection."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"A30","stem":"In which of the following would a Lightning cable most likely be used?","choices":[{"letter":"A","text":"Connect a server to a display monitor","explanation":"Although there are video output adapters available for Lightning connectors, these options tend to be used exclusively for Apple's phones and tablets and are not commonly used on standalone computers or servers."},{"letter":"B","text":"Increase the available memory of a device","explanation":"Although there are options to provide external storage using a lightning connection, the memory used in an Apple mobile device is limited to the installed internal RAM (Random Access Memory)."},{"letter":"C","text":"Remotely control a mobile device","explanation":"Although there are remote control options available for Apple devices, these solutions use an existing network connection and do not use the Lightning interface."},{"letter":"D","text":"Charge a mobile device","explanation":"The Lightning interface is a proprietary interface used exclusively on mobile devices from Apple. The Lightning interface is a common connection for data transfers and power charging for many Apple mobile devices"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.2 - Copper Connectors","link":"https://professormesser.link/1201030208","source":"book"},{"id":"A31","stem":"A network administrator would like to enable DHCP on a laptop, but they would like the same IP address to be assigned to the laptop each time it starts. Which of the following would provide this functionality?","choices":[{"letter":"A","text":"Create an IP reservation on the DHCP server","explanation":"A DHCP (Dynamic Host Configuration Protocol) server will automatically assign IP (Internet Protocol) addresses to devices on the network from an available pool. This means the IP address for a device may change over time based on the addresses currently available in the pool. To force the same IP address assignment each time, the network administrator can create an IP reservation in the DHCP server to associate a specific IP address to the MAC (Media Access Control) address of the laptop"},{"letter":"B","text":"Administratively configure the laptop’s MAC address","explanation":"The MAC address of a device will rarely need to be changed through an administrative configuration, and administratively configuring the MAC address will not permanently assign a particular IP address."},{"letter":"C","text":"Use APIPA addressing","explanation":"APIPA (Automatic Private IP Addressing) can provide limited networking when a DHCP server is not available, but APIPA addressing does not provide any static or permanent IP addressing on a device."},{"letter":"D","text":"Assign the laptop to a static IP VLAN","explanation":"VLANs (Virtual Local Area Networks) are commonly used to segment the network into individual broadcast domains. Assigning a device to a particular VLAN does not provide a method of static or permanent IP addressing on a device."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.4 - DHCP","link":"https://professormesser.link/1201020402","source":"book"},{"id":"A32","stem":"A user is complaining about slow network performance from their workstation. A network technician checks the data closet and finds the wires are not properly seated in the 110 block. Which of the following should the technician use to correct this issue?","choices":[{"letter":"A","text":"Crimper","explanation":"A crimper is used to fasten a modular connector onto the end of a cable. For Ethernet, a crimper attaches the RJ45 connector used by the workstation or laptop."},{"letter":"B","text":"Multimeter","explanation":"A multimeter can be used to check for voltages or continuity, but it won't connect wires to a 110 block."},{"letter":"C","text":"Punch-down tool","explanation":"A punch-down tool is used to firmly \"punch\" a wire into a wiring block. These blocks are usually located in a wiring closet or on a patch panel"},{"letter":"D","text":"Cable tester","explanation":"Cable testers can identify the wire map on a cable to ensure the punch-down or crimping process has been performed properly. After punching down this connection, the technician could use a cable tester to validate all of the wires are now properly connected."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"A33","stem":"A user has just connected to a new wireless network, but they cannot view any Internet web sites. Their network configuration shows the IP address as 169.254.228.109, the subnet mask is 255.255.0.0, and they have not been assigned a default gateway. Which of these is the most likely cause of this issue?","choices":[{"letter":"A","text":"The subnet mask is not correct","explanation":"The subnet mask has been configured through APIPA, and the mask of 255.255.0.0 is normal for an APIPA configuration. The subnet mask is not the cause of the browsing issues on the workstation."},{"letter":"B","text":"The Internet provider is experiencing a temporary outage","explanation
