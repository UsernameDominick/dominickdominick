"note":"Book A90 picks a flatbed scanner for capturing an image from a printed page."},{"id":"adf","label":"ADF","cap":2,"sub":"automatic document feeder","note":"ADF = automatic document feeder. Book B46 uses it as a wrong answer."}],"tiles":[{"id":"t01","text":"The scanned files are stored on a Microsoft share","col":"smb"},{"id":"t02","text":"A page scanner drops its images into a folder on a Windows file server","col":"smb"},{"id":"t03","text":"The scan arrives as an attachment in the user's mailbox","col":"email"},{"id":"t04","text":"The device sends each scan out through the company mail server","col":"email"},{"id":"t05","text":"Scans are uploaded straight to an online storage account","col":"cloud"},{"id":"t06","text":"Documents reach a cloud storage service without passing through a PC","col":"cloud"},{"id":"t07","text":"Capturing an image of a single printed page and saving it on a computer","col":"flatbed"},{"id":"t08","text":"Scanning a bound book or a fragile photo that cannot be fed through rollers","col":"flatbed"},{"id":"t09","text":"A stack of pages is pulled through the scanner without placing each one on the glass","col":"adf"},{"id":"t10","text":"Scanning a long, multipage contract unattended","col":"adf"}],"objective":"220-1201, Objective 3.7 - Multifunction Devices","hook":"Windows share = SMB. Inbox = email. Online storage = cloud. One page or a book = flatbed. A stack of pages = ADF."},{"id":"psu-connectors","group":"hardware","title":"Power supply connectors","blurb":"Which power plug feeds which part?","columns":[{"id":"atx24","label":"24-pin ATX","cap":1,"sub":"main power","note":"Carries 12 V, 5 V and 3.3 V DC (book B51)."},{"id":"eps","label":"4 / 8-pin +12 V","cap":1,"sub":"CPU power","note":"The extra plug near the CPU socket."},{"id":"pcie","label":"6 / 8-pin PCIe","cap":1,"sub":"graphics power","note":"A new GPU on an undersized supply can shut the PC down under load (book B71)."},{"id":"sata","label":"SATA power","cap":2,"sub":"15-pin","note":"Flat L-shaped plug for modern drives."},{"id":"molex","label":"Molex","cap":1,"sub":"4-pin","note":"The chunky old-style plug (book B2)."}],"tiles":[{"id":"t01","text":"The motherboard itself","col":"atx24"},{"id":"t02","text":"The CPU's power regulators","col":"eps"},{"id":"t03","text":"A power-hungry graphics card","col":"pcie"},{"id":"t04","text":"A 2.5-inch SATA SSD","col":"sata"},{"id":"t05","text":"A SATA hard drive","col":"sata"},{"id":"t06","text":"Legacy IDE drives and some case fans","col":"molex"}],"objective":"220-1201, Objective 3.6 - Computer Power","hook":"Motherboard = 24-pin. CPU = 4/8-pin. Graphics card = 6/8-pin PCIe. Drives = SATA power (or Molex for old stuff)."},{"id":"display-panels","group":"hardware","title":"IPS, TN, VA and OLED","blurb":"Match the trait to the display technology.","columns":[{"id":"ips","label":"IPS","cap":2,"sub":"LCD","note":"The pick when the question says \"LCD with the best color\" (book B8)."},{"id":"tn","label":"TN","cap":2,"sub":"LCD","note":"Cheap and quick, but colors wash out off-axis."},{"id":"va","label":"VA","cap":2,"sub":"LCD","note":"The deep-black LCD."},{"id":"oled","label":"OLED","cap":2,"sub":"self-lit pixels","note":"No backlight at all (book A25)."}],"tiles":[{"id":"t01","text":"Best color accuracy of the LCD types","col":"ips"},{"id":"t02","text":"Widest viewing angles of the LCD types","col":"ips"},{"id":"t03","text":"Fast response time at a low price","col":"tn"},{"id":"t04","text":"Narrowest viewing angles of the LCD types","col":"tn"},{"id":"t05","text":"Highest contrast ratio of the LCD types","col":"va"},{"id":"t06","text":"Fast-moving dark scenes can smear","col":"va"},{"id":"t07","text":"Needs no backlight, because each pixel makes its own light","col":"oled"},{"id":"t08","text":"Shows true black by switching pixels off, but can suffer burn-in","col":"oled"}],"objective":"220-1201, Objective 3.1 - Display Types","hook":"IPS = color and angles. TN = speed and price. VA = contrast. OLED = no backlight."},{"id":"laptop-display","group":"hardware","title":"Laptop display parts","blurb":"Which part of the lid is to blame?","columns":[{"id":"inverter","label":"Inverter","cap":2,"sub":"powers a CCFL backlight","note":"A faulty inverter makes the screen hard to see (book A13, C15). LED and OLED panels do not use one."},{"id":"digitizer","label":"Digitizer","cap":2,"sub":"touch layer","note":"Test it after replacing the LCD on a touch-screen laptop (book B11). A stylus that stops responding also points to the digitizer (book A19, B69)."},{"id":"antenna","label":"Wi-Fi antenna","cap":2,"sub":"runs through the lid","note":"After replacing a cracked LCD, test the wireless network (book C75, which the book files under 1.1 - Laptop Hardware)."}],"tiles":[{"id":"t01","text":"The laptop boots, the image is there, but it is almost too dim to see","col":"inverter"},{"id":"t02","text":"Feeds power to an older fluorescent (CCFL) backlight","col":"inverter"},{"id":"t03","text":"The stylus no longer interacts with the screen","col":"digitizer"},{"id":"t04","text":"Touch input stops after a repair, but the picture is fine","col":"digitizer"},{"id":"t05","text":"Wireless gets weak after the LCD was replaced","col":"antenna"},{"id":"t06","text":"Its wires run up beside the display, so a screen swap can disturb it","col":"antenna"}],"objective":"220-1201, Objective 3.1 - Display Types","hook":"Dim on an older CCFL laptop = inverter. No touch = digitizer. Weak Wi-Fi after a screen repair = antenna."},{"id":"bios-settings","group":"hardware","title":"BIOS / UEFI and security chips","blurb":"Which setting or chip solves which problem?","columns":[{"id":"secure","label":"Secure Boot","cap":2,"sub":"UEFI","note":"Book A87: after BIOS changes Windows 11 said the drive could only boot in UEFI mode, and the book's answer is to enable Secure Boot, since UEFI mode with Secure Boot is required on that system. Secure Boot only works in UEFI mode, so an answer that says to switch to UEFI mode would also fit."},{"id":"tpm","label":"TPM","cap":2,"sub":"security chip","note":"A dedicated HSM is the heavier-duty answer for storing keys (book A83)."},{"id":"order","label":"Boot order","cap":2,"note":"Book A7. \"Operating system not found\" can also mean a stray removable drive (book A11)."},{"id":"virt","label":"Virtualization support","cap":2,"sub":"VT-x / AMD-V","note":"Book C70."},{"id":"jumper","label":"BIOS reset jumper","cap":2,"sub":"on the motherboard","note":"Book B31. Some boards have a separate password jumper, and many business laptops have none, so check the board manual."}],"tiles":[{"id":"t01","text":"Only lets operating systems with trusted signatures start","col":"secure"},{"id":"t02","text":"The book's answer when a Windows 11 PC says \"This drive can only boot in UEFI mode\"","col":"secure"},{"id":"t03","text":"A chip on the motherboard that stores encryption keys","col":"tpm"},{"id":"t04","text":"Lets BitLocker release its key only if the boot files have not been tampered with","col":"tpm"},{"id":"t05","text":"Decides which drive the BIOS tries to start from first","col":"order"},{"id":"t06","text":"The fix when a PC tries to boot from a USB drive left plugged in","col":"order"},{"id":"t07","text":"Must be enabled in the BIOS before virtual machines will run","col":"virt"},{"id":"t08","text":"Called VT-x on Intel and AMD-V on AMD","col":"virt"},{"id":"t09","text":"On many desktop boards, moving it resets a forgotten BIOS password","col":"jumper"},{"id":"t10","text":"The reset method for previously leased PCs that ask for an unknown password","col":"jumper"}],"objective":"220-1201, Objective 3.5 - BIOS Settings","hook":"Settings live in the BIOS/UEFI. A forgotten BIOS password can often be cleared with a motherboard jumper (book B31)."},{"id":"memory-terms","group":"hardware","title":"Memory terms","blurb":"ECC, SO-DIMM or multi-channel: sort the facts.","columns":[{"id":"ecc","label":"ECC","cap":2,"sub":"error correcting","note":"Book C74 and A84 (new ECC modules that were not compatible: beeps and a blank screen)."},{"id":"sodimm","label":"SO-DIMM","cap":2,"sub":"laptop memory","note":"Book B35."},{"id":"multi","label":"Multi-channel","cap":2,"sub":"dual / quad","note":"Book A49."}],"tiles":[{"id":"t01","text":"Detects and corrects single-bit errors, so it suits database servers","col":"ecc"},{"id":"t02","text":"Needs a motherboard that supports it; unsupported modules can keep the PC from starting","col":"ecc"},{"id":"t03","text":"The small memory module used in laptops","col":"sodimm"},{"id":"t04","text":"About half the length of a desktop DIMM","col":"sodimm"},{"id":"t05","text":"Installing matched modules lets the CPU reach RAM over several paths at once","col":"multi"},{"id":"t06","text":"Maximizes memory bandwidth on a database server","col":"multi"}],"objective":"220-1201, Objective 3.3 - Memory Technologies","hook":"ECC = accuracy. SO-DIMM = laptop. Multi-channel = bandwidth."},{"id":"mobile-connect","group":"mobile","title":"Mobile connections","blurb":"Bluetooth, NFC, hotspot or airplane mode: sort the situation.","columns":[{"id":"bt","label":"Bluetooth","cap":2,"sub":"short-range","note":"Pairing steps in order: enable Bluetooth, enable pairing, find the device, enter the PIN, test (book C4)."},{"id":"nfc","label":"NFC","cap":2,"sub":"tap range","note":"Book A47."},{"id":"hotspot","label":"Hotspot","cap":2,"sub":"shares cellular over Wi-Fi","note":"The phone uses 802.11 Wi-Fi to share its cellular connection (book A40, B33, B61). Sharing it over a USB cable or Bluetooth is called tethering (book C86)."},{"id":"airplane","label":"Airplane mode","cap":2,"sub":"radios off","note":"Book B45: with airplane mode on you can still turn Bluetooth back on for a wireless headset."}],"tiles":[{"id":"t01","text":"Pairing a wireless headset or speaker with a PIN","col":"bt"},{"id":"t02","text":"A small personal area network around one person","col":"bt"},{"id":"t03","text":"Tap-to-pay at a store checkout","col":"nfc"},{"id":"t04","text":"Only works when the two devices nearly touch","col":"nfc"},{"id":"t05","text":"Shares the phone's cellular data with a laptop over Wi-Fi","col":"hotspot"},{"id":"t06","text":"The phone acts as a Wi-Fi access point so a laptop at a remote site can get online","col":"hotspot"},{"id":"t07","text":"One toggle that turns off the cellular radio, and normally Wi-Fi and Bluetooth too, for a flight","col":"airplane"},{"id":"t08","text":"Blocks cellular calls, texts and mobile data until you switch it off","col":"airplane"}],"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","hook":"Headset = Bluetooth. Checkout = NFC. Laptop online through the phone = hotspot."},{"id":"cloud-service","group":"cloud","title":"IaaS, PaaS and SaaS","blurb":"Who manages what? Sort each statement under the service model it describes.","columns":[{"id":"iaas","label":"IaaS","cap":2,"sub":"infrastructure","note":"Book B18, B40, C6."},{"id":"paas","label":"PaaS","cap":2,"sub":"platform","note":"The in-between model."},{"id":"saas","label":"SaaS","cap":2,"sub":"software","note":"Book B63."}],"tiles":[{"id":"t01","text":"You install the operating system, applications and data yourself","col":"iaas"},{"id":"t02","text":"The provider supplies the hardware, but you still configure and manage the OS","col":"iaas"},{"id":"t03","text":"Developers deploy code without managing the servers or operating system","col":"paas"},{"id":"t04","text":"The provider runs the OS and runtime; you supply just your application and its data","col":"paas"},{"id":"t05","text":"Browser-based email that needs no software on the user's device","col":"saas"},{"id":"t06","text":"You just use the application while the provider runs everything else","col":"saas"}],"objective":"220-1201, Objective 4.2 - Cloud Models","hook":"The more you manage, the lower the letter: IaaS (most work), PaaS, SaaS (least)."},{"id":"cloud-deploy","group":"cloud","title":"Public, private, hybrid, community","blurb":"Sort each description under the cloud deployment model.","columns":[{"id":"public","label":"Public","cap":2,"note":"Book B50."},{"id":"private","label":"Private","cap":2},{"id":"hybrid","label":"Hybrid","cap":2},{"id":"community","label":"Community","cap":2,"note":"Book C22."}],"tiles":[{"id":"t01","text":"Third-party data center, available to anyone on the Internet","col":"public"},{"id":"t02","text":"Pay-as-you-go from a major provider such as AWS or Azure","col":"public"},{"id":"t03","text":"Built for one organization only","col":"private"},{"id":"t04","text":"Often runs in the company's own data center","col":"private"},{"id":"t05","text":"Combines a private cloud with a public cloud","col":"hybrid"},{"id":"t06","text":"Keeps sensitive data in-house but borrows public capacity for peaks","col":"hybrid"},{"id":"t07","text":"Shared by several organizations with common needs","col":"community"},{"id":"t08","text":"A group of hospitals or agencies splitting the cost of one cloud","col":"community"}],"objective":"220-1201, Objective 4.2 - Cloud Models","hook":"One company = private. Anyone = public. Both = hybrid. A shared club of similar organizations = community."},{"id":"cloud-traits","group":"cloud","title":"Cloud characteristics","blurb":"Sort each scenario under the cloud characteristic it shows. These are the six characteristics on the 220-1201 list; ingress and egress sit under metered utilization there.","columns":[{"id":"elastic","label":"Elasticity","cap":2,"sub":"scale up and down","note":"Book A81, B25, C47."},{"id":"avail","label":"Availability","cap":2,"sub":"stays up","note":"Book A48, C80. Often called high availability."},{"id":"metered","label":"Metered utilization","cap":3,"sub":"pay for use","note":"Book A58. CompTIA lists ingress / egress under metered utilization: ingress = data coming in, egress = data exiting, and it is egress that usually costs money."},{"id":"shared","label":"Shared vs dedicated resources","cap":2,"sub":"common pool","note":"Book C65 counts a new test server allocated from the cloud console as shared resources: it comes out of the provider's central pool. Dedicated resources are the opposite: in a private cloud they are reserved for one organization."},{"id":"sync","label":"File synchronization","cap":2,"sub":"identical copies","note":"On the 220-1201 objectives. The book only uses it as a wrong answer (A58, B25, C65, C80), always meaning data kept identical between sites. Identical copies = synchronization; staying up through an outage = availability."},{"id":"multi","label":"Multitenancy","cap":2,"sub":"many tenants, kept apart","note":"On the 220-1201 objectives as its own characteristic. The book calls a community cloud a multi-tenant model (C22). \"Tenants\" = multitenancy; \"common pool or reserved hardware\" = shared vs dedicated resources."}],"tiles":[{"id":"t01","text":"Adds servers during the busy day and removes them at night","col":"elastic"},{"id":"t02","text":"Resources grow or shrink automatically with demand","col":"elastic"},{"id":"t03","text":"Redundant servers in different data centers keep the app running","col":"avail"},{"id":"t04","text":"The application keeps working through a data-center outage","col":"avail"},{"id":"t05","text":"Usage is measured and billed by how much you consume","col":"metered"},{"id":"t06","text":"Monitoring tracks consumption so the invoice matches what was actually used","col":"metered"},{"id":"t07","text":"Data in (ingress) and out (egress) of the provider's network is measured, and outbound data is often billed","col":"metered"},{"id":"t08","text":"A new server is created from the cloud console, and its CPU and memory come from the provider's central pool","col":"shared"},{"id":"t09","text":"In a private cloud, every resource is reserved for one organization and not shared with other customers","col":"shared"},{"id":"t10","text":"Changes made at one site are copied automatically, so every site works from identical data","col":"sync"},{"id":"t11","text":"A file edited on a laptop shows up, updated, on the user's phone","col":"sync"},{"id":"t12","text":"Many customers (tenants) use the same platform, with each one's data kept separate","col":"multi"},{"id":"t13","text":"One copy of a SaaS application serves thousands of companies, and each company sees only its own data","col":"multi"}],"objective":"220-1201, Objective 4.2 - Cloud Characteristics","hook":"Up and down = elasticity. Stays on = availability. Billed by use, including data in and out (ingress / egress) = metered. Common pool or reserved hardware = shared vs dedicated resources. Identical copies in every place = file synchronization. Many tenants kept apart = multitenancy."},{"id":"virt-types","group":"cloud","title":"Hypervisors and containers","blurb":"Type 1, Type 2 or container? Sort the facts.","columns":[{"id":"type1","label":"Type 1 hypervisor","cap":2,"sub":"bare metal","note":"Book B16. Examples: VMware ESXi and Microsoft Hyper-V (Hyper-V loads underneath Windows even though you turn it on from Windows). A hypervisor is what lets a VM start at all (book A68)."},{"id":"type2","label":"Type 2 hypervisor","cap":2,"sub":"hosted","note":"Book A34: to run several Windows versions on a desktop with 4 GB of RAM, upgrade the RAM and install guest VMs."},{"id":"container","label":"Container","cap":2,"sub":"lightweight","note":"Book C62."}],"tiles":[{"id":"t01","text":"Installed straight onto the hardware instead of onto Windows or Linux","col":"type1"},{"id":"t02","text":"Runs with no host operating system underneath it","col":"type1"},{"id":"t03","text":"Installed like an app on top of Windows, macOS or Linux","col":"type2"},{"id":"t04","text":"VirtualBox or VMware Workstation running as a program on a desktop","col":"type2"},{"id":"t05","text":"A lightweight package holding an app and everything it depends on","col":"container"},{"id":"t06","text":"Shares the host's kernel, so it skips a full guest OS","col":"container"}],"objective":"220-1201, Objective 4.1 - Virtualization Services","hook":"On the bare hardware = Type 1. On top of an OS = Type 2. An app plus its dependencies, sharing the host kernel = container."},{"id":"ts-hardware","group":"trouble","title":"Hardware symptoms: what is the cause?","blurb":"Read the clue, then pick the most likely culprit. Three of them look alike on purpose.","columns":[{"id":"psu","label":"Power supply","cap":3,"sub":"fault or too small","note":"A PC that dies and stays dead (power button does nothing, no fans, no lights), a low rail voltage, or shutdowns right after a new graphics card point at the power supply (book A70, A61, B71). Book C2 uses a quiet PC with a blank screen for it."},{"id":"ram","label":"Memory (RAM)","cap":2,"sub":"POST and compatibility","note":"Beep codes depend on the BIOS maker, so check its chart. In book A16, A84 and C2 the beeps pointed at the memory."},{"id":"cool","label":"Cooling failure","cap":2,"sub":"heat","note":"Blocked case fans or a dead CPU fan make a PC shut itself down: after an hour of heavy CPU work (book B14), after a few minutes of graphics testing (book C78), or at random several times a day (book C2). Right after a new graphics card, suspect the power supply instead (book B71)."},{"id":"cmos","label":"CMOS battery","cap":2,"sub":"motherboard battery","note":"The small coin cell keeps the clock running while the PC is unplugged (book A56). Book C2 asks about a laptop that sometimes shows the wrong date and time. On many boards the cell also holds the BIOS settings."},{"id":"cap","label":"Failed capacitor","cap":2,"sub":"pop, bulge or leak","note":"Book C85. Book C2 has the same clue: a popping noise, then an immediate shutdown. The capacitor can be on the motherboard or inside the power supply; the book's answer for a pop is the capacitor."},{"id":"cord","label":"Power cord or voltage switch","cap":2,"sub":"just installed or moved","note":"Just installed or moved, and totally dead? Start with the power cable (book B44) and the 115 V / 230 V input-voltage switch (book C58, C16)."}],"tiles":[{"id":"t01","text":"A working desktop shuts off abruptly and will not restart: no fans, no lights, nothing on screen","col":"psu"},{"id":"t02","text":"The power light comes on, but the 12 V pin on the motherboard connector reads 6 V","col":"psu"},{"id":"t03","text":"Fine for browsing, but it shuts down after a few minutes of gaming right after a graphics card was added","col":"psu"},{"id":"t04","text":"Blank screen and two beeps at startup","col":"ram"},{"id":"t05","text":"New ECC modules make the PC beep with a blank screen, and the old RAM boots fine","col":"ram"},{"id":"t06","text":"Powers itself off after about an hour of heavy CPU work in design software","col":"cool"},{"id":"t07","text":"The computer randomly powers itself off several times a day","col":"cool"},{"id":"t08","text":"A \"Date and Time not set\" message at power-on","col":"cmos"},{"id":"t09","text":"The clock and BIOS settings reset every time the power cord is pulled","col":"cmos"},{"id":"t10","text":"A loud pop from inside the case, then the PC powers down and will not start again","col":"cap"},{"id":"t11","text":"The tops of capacitors on the motherboard are bulging or leaking","col":"cap"},{"id":"t12","text":"A server moved into a data center rack will not power on, and none of its lights are on","col":"cord"},{"id":"t13","text":"A brand-new server does not respond to the power button: no lights and no fans","col":"cord"}],"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","hook":"Dies and stays dead (power button does nothing, no fans, no lights) = power supply. Shuts down under load right after a new graphics card = power supply. Randomly powers off, or shuts down under load with nothing new = heat. Beeps and blank = RAM. Clock lost = CMOS battery. Pop = capacitor. Just installed or moved and totally dead = cord and voltage switch."},{"id":"ts-network","group":"trouble","title":"Network symptoms: what is the cause?","blurb":"Sort the clue under the most likely network problem.","columns":[{"id":"dhcp","label":"DHCP server down","cap":2,"note":"A 169.254.x.x address means the PC could not get an address from DHCP (book A33, A85, B60)."},{"id":"dns","label":"DNS failure","cap":2,"note":"IP works, names do not = DNS (book C50)."},{"id":"wifi","label":"Wireless interference","cap":2,"note":"Check channel interference levels first (book B72, A63)."},{"id":"duplex","label":"Duplex mismatch","cap":2,"note":"Book C40 reaches duplex mismatch by ruling out SSID, APIPA, gateway and RFC 1918 answers."},{"id":"cable","label":"Bad cable or crimp","cap":2,"note":"Port flapping most likely means a faulty crimp or cable (book A10); dark lights = no signal on the cable (book C81)."}],"tiles":[{"id":"t01","text":"The address is 169.254.228.109 with a 255.255.0.0 mask and no default gateway","col":"dhcp"},{"id":"t02","text":"A laptop on a DSL router shows 169.254.228.109 and cannot reach the Internet","col":"dhcp"},{"id":"t03","text":"The gateway and 8.8.8.8 answer a ping, but google.com will not load","col":"dns"},{"id":"t04","text":"Sites open by IP address but never by name","col":"dns"},{"id":"t05","text":"A new access point went into a crowded downtown office building, and users report intermittent connectivity","col":"wifi"},{"id":"t06","text":"A visitor's laptop is much slower on the office Wi-Fi than at their home site","col":"wifi"},{"id":"t07","text":"A new laptop on the same wired Ethernet jack is much slower than the PC it replaced","col":"duplex"},{"id":"t08","text":"The link is up, but copies crawl ever since the adapter's Speed & Duplex was changed from Auto","col":"duplex"},{"id":"t09","text":"A switch port keeps going up and down (port flapping)","col":"cable"},{"id":"t10","text":"The link lights stay dark on a brand-new copper gigabit connection","col":"cable"}],"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","hook":"169.254 = DHCP. IP works but names do not = DNS. Wi-Fi only = signal or interference. Slow wired link = duplex. Flapping or dark lights = the cable."},{"id":"ts-display","group":"trouble","title":"Display symptoms: what is the cause?","blurb":"Sort the symptom under the most likely cause.","columns":[{"id":"pixel","label":"Dead pixel","cap":1,"note":"Book B70."},{"id":"burn","label":"Burn-in","cap":1,"note":"Extensive burn-in cannot be reversed, so the display is replaced (book A5)."},{"id":"res","label":"Wrong resolution","cap":2,"sub":"non-native","note":"Set the display to its native resolution (book A76, C88, A5)."},{"id":"cable","label":"Bad video cable","cap":3,"note":"Replace the video cable (book B38, A18). Book A5 has the three-second black screen: digital video needs a solid connection, and a bad cable can make the picture blocky or turn the screen black."},{"id":"cooling","label":"Projector cooling","cap":2,"sub":"overheating","note":"A projector shuts its lamp off to protect itself when it cannot cool (book B23, C13). For a projector that turns off in under five minutes, book A5 says to clean the dust from the air filters."},{"id":"input","label":"Wrong input selected","cap":1,"note":"Monitors have several inputs (HDMI, DisplayPort, VGA). Switch to the one the PC is plugged into. In book A53 the only clue is a completely black screen that a power cycle does not fix, and the answer is still the monitor input (see also A5)."},{"id":"screen","label":"Failed screen panel","cap":1,"note":"Replace the laptop screen (book B68)."}],"tiles":[{"id":"t01","text":"Small dots stay solid black no matter what the picture is","col":"pixel"},{"id":"t02","text":"A faint ghost of an old image stays on the screen, even over spreadsheets","col":"burn"},{"id":"t03","text":"Everything looks fuzzy and hard to read on the connected LCD","col":"res"},{"id":"t04","text":"Icons and windows look oversized after connecting a new LCD","col":"res"},{"id":"t05","text":"The projector picture flickers and breaks into blocky pieces","col":"cable"},{"id":"t06","text":"The image pixelates and flickers even after changing resolution and refresh rate","col":"cable"},{"id":"t07","text":"A monitor goes completely black for about three seconds every now and then","col":"cable"},{"id":"t08","text":"The projector lamp turns off after about 30 minutes while the fans keep running","col":"cooling"},{"id":"t09","text":"The lamp cuts out after five minutes and comes back ten minutes later","col":"cooling"},{"id":"t10","text":"Black screen and a \"No signal on HDMI 1\" message, but the PC is cabled to the DisplayPort jack","col":"input"},{"id":"t11","text":"The laptop's built-in screen is completely covered with colored lines and flashing colors","col":"screen"}],"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","hook":"Dots = dead pixel. Ghost image = burn-in. Fuzzy or oversized = resolution. Flicker and blocks = cable. Lamp cuts out = cooling. \"No signal\" on a port the PC is not plugged into = wrong input. Color lines = panel."},{"id":"ts-printers","group":"trouble","title":"Printer symptoms: what is the cause?","blurb":"Sort the symptom under the most likely cause.","columns":[{"id":"spooler","label":"Print spooler","cap":2,"sub":"stalled queue","note":"Jobs stuck in the queue while the printer itself is healthy: restart the spooler (book A6, C73, B1)."},{"id":"driver","label":"Printer driver","cap":3,"sub":"wrong driver or language","note":"When options are missing or output is garbled, look at the driver and its page description language (book C12, A62, B34, A8)."},{"id":"drum","label":"Imaging drum","cap":2,"sub":"dirty or scratched","note":"Book B57 (scratched drum) and C51 (drum not clean)."},{"id":"toner","label":"Toner","cap":2,"sub":"empty or faulty","note":"Book C57. Fading output usually means the toner is running low (book B1)."},{"id":"hardware","label":"Printer hardware","cap":1,"sub":"failed","note":"If the front-panel test page never prints a single page, the problem is the printer itself (book B75)."}],"tiles":[{"id":"t01","text":"Several jobs sit in the queue, nothing prints, and the printer shows no message","col":"spooler"},{"id":"t02","text":"Seven jobs are stuck in the queue, but the printer is online and its own test page prints fine","col":"spooler"},{"id":"t03","text":"Every page comes out as garbled characters","col":"driver"},{"id":"t04","text":"No third-tray option appears in the print dialog","col":"driver"},{"id":"t05","text":"The finisher punches two holes instead of three","col":"driver"},{"id":"t06","text":"A solid line runs down every printed page","col":"drum"},{"id":"t07","text":"Specks and small dots appear randomly on the page","col":"drum"},{"id":"t08","text":"Every page prints completely blank","col":"toner"},{"id":"t09","text":"The output gets progressively fainter until it is hard to read","col":"toner"},{"id":"t10","text":"Jobs are stuck in the queue, and even the printer's own front-panel test print never comes out","col":"hardware"}],"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","hook":"Queue stuck = spooler. Garbled or missing options = driver. Line or specks = drum. Blank or faded = toner. Front-panel test fails = hardware."},{"id":"ts-mobile","group":"trouble","title":"Mobile symptoms: what is the cause?","blurb":"Sort the symptom under the most likely cause.","columns":[{"id":"battery","label":"Swollen battery","cap":1,"note":"Power it off and contact support; never charge it or poke it (book A12)."},{"id":"liquid","label":"Liquid damage","cap":1,"note":"The red label is the liquid contact indicator (LCI), a passive strip that changes color when it gets wet (book A38)."},{"id":"port","label":"Damaged charging port","cap":2,"note":"A good cable that fails on one phone points at the port (book B7, C30)."},{"id":"digitizer","label":"Faulty digitizer","cap":1,"note":"Book B69."},{"id":"storage","label":"Low storage space","cap":1,"note":"Book A73."},{"id":"bluetooth","label":"Bluetooth off or not pairing","cap":2,"note":"Turn Bluetooth on and put the accessory in pairing mode (book C77, C18)."},{"id":"app","label":"Runaway app","cap":1,"sub":"heat","note":"An app using a large amount of CPU makes the phone overheat (book C83)."}],"tiles":[{"id":"t01","text":"The battery bulges and pushes the screen away from the phone","col":"battery"},{"id":"t02","text":"A black, unresponsive phone with a red label showing at the SIM slot","col":"liquid"},{"id":"t03","text":"No charging icon appears, even with a known-good cable","col":"port"},{"id":"t04","text":"The charging icon never appears and the battery does not charge through the phone's built-in USB port","col":"port"},{"id":"t05","text":"A laptop stopped responding to the stylus after coming back from repair","col":"digitizer"},{"id":"t06","text":"Apps that normally update automatically have shown no new updates in over two weeks","col":"storage"},{"id":"t07","text":"The smartwatch will not appear in the phone's list of devices","col":"bluetooth"},{"id":"t08","text":"A headset is missing from the list of available Bluetooth devices","col":"bluetooth"},{"id":"t09","text":"Shuts off after an hour with a \"High temperature detected\" message, indoors and out of the sun","col":"app"}],"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","hook":"Bulge = battery (stop using it). Red SIM label = liquid. Good cable, no charge = port. No stylus = digitizer. No updates = storage. Hot indoors and out of the sun = runaway app."},{"id":"ts-storage","group":"trouble","title":"Storage symptoms: what is the cause?","blurb":"Sort the symptom under the most likely cause.","columns":[{"id":"fail","label":"Failing hard drive","cap":4,"note":"A SMART warning (book B47), or clicking and slowing down (book C84, A60), means the drive is failing: back up first (A60), then replace it (C84). Book C2 adds grinding when files are saved: a hard drive has many moving parts, and the noise appears when it is accessed."},{"id":"boot","label":"Boot order or removable drive","cap":2,"note":"Remove stray drives or fix the boot order in the BIOS (book A11, A7)."},{"id":"cable","label":"Loose drive cable","cap":1,"note":"Reseat the drive cables you disturbed (book C14)."},{"id":"raid","label":"RAID array failure","cap":2,"note":"The book answers \"RAID array failed\" for an alarm in the data center (A27) and says to check the array status first when a SAN loses its files (B78)."},{"id":"script","label":"Login script did not run","cap":1,"note":"Mapped drives are usually created by a login script (book B82)."},{"id":"led","label":"Normal drive activity","cap":1,"note":"That light just shows the drive being accessed (book C24)."}],"tiles":[{"id":"t01","text":"\"SMART Failure Predicted\" appears at startup","col":"fail"},{"id":"t02","text":"Opening a file takes 60 seconds, and clicking is audible when the data is accessed","col":"fail"},{"id":"t03","text":"A series of clicks comes from inside the case, and the server has been slowing down over time","col":"fail"},{"id":"t04","text":"A grinding noise comes from the computer every time a document is saved","col":"fail"},{"id":"t05","text":"\"Operating system not found\" while a USB stick is still plugged in","col":"boot"},{"id":"t06","text":"The PC tries to start from the external USB drive that was left plugged in","col":"boot"},{"id":"t07","text":"\"Boot Device Not Found\" right after a memory upgrade, and the BIOS lists no drives","col":"cable"},{"id":"t08","text":"An audible alarm sounds as you walk into the data center","col":"raid"},{"id":"t09","text":"Every file on the SAN is suddenly inaccessible","col":"raid"},{"id":"t10","text":"The user's mapped network drive H: is missing from File Explorer after logging on","col":"script"},{"id":"t11","text":"A light on the front of the desktop flashes constantly","col":"led"}],"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","hook":"SMART or clicking = dying drive. OS not found = check for a stray USB drive first. Boot device missing after opening the case = cable. Data-center alarm or a SAN with no files = check the RAID array. Mapped drive missing = login script. Flashing light = normal."}],"quizzes":[{"id":"conn-photos","group":"cables","title":"Connector photo quiz","blurb":"Name each connector from its photo. Eighteen photos, taken from the book.","items":[{"p":"Which connector is pictured?","o":["Lightning","USB-C","Micro-USB","USB-A"],"a":0,"w":"Lightning is Apple's own 8-pin connector for charging and syncing older iPhones and iPads (newer models use USB-C). It plugs in either way up.","img":"conn_lightning"},{"p":"Which connector is pictured?","o":["USB-C","Lightning","Micro-USB","USB-A"],"a":0,"w":"USB-C is the small reversible oval connector used for Android charging, data and external SSDs.","img":"conn_usbc"},{"p":"Which connector is pictured?","o":["USB-A","USB-C","Lightning","Micro-USB"],"a":0,"w":"USB-A is the flat rectangular port for keyboards, mice, printers and flash drives.","img":"conn_usba"},{"p":"Which connector is pictured?","o":["RJ45","RJ11","F-connector","DB-9"],"a":0,"w":"RJ45 is the 8-pin plug on a copper Ethernet patch cable.","img":"conn_rj45"},{"p":"Which connector is pictured?","o":["RJ11","RJ45","F-connector","DB-9"],"a":0,"w":"RJ11 is the smaller telephone jack, narrower than RJ45 and with fewer contacts. DSL modems connect to the phone line with it.","img":"conn_rj11"},{"p":"Which connector is pictured?","o":["F-connector","BNC","RJ45","RJ11"],"a":0,"w":"The screw-on threaded F-connector carries coax to a cable modem or TV. BNC twists and locks instead.","img":"conn_f"},{"p":"Which connector is pictured?","o":["DB-9","VGA","DVI-D","RJ45"],"a":0,"w":"DB-9 is the 9-pin serial connector, often used for the console port on routers and switches. This is the female end (9 holes in two rows); VGA has 15 in three rows.","img":"conn_db9_f"},{"p":"Which connector is pictured?","o":["DB-9","VGA","DVI-D","RJ45"],"a":0,"w":"This is a male DB-9 serial port: 9 pins in two rows inside a D-shaped shell.","img":"conn_db9_m"},{"p":"Which connector is pictured?","o":["SC","LC","ST","RJ45"],"a":0,"w":"SC is the square, push-pull fiber optic connector.","img":"conn_sc"},{"p":"Which connector is pictured?","o":["LC","SC","ST","RJ45"],"a":0,"w":"LC is the small, clip-latched fiber connector common on switches, routers and servers.","img":"conn_lc"},{"p":"Which connector is pictured?","o":["HDMI","DisplayPort","VGA","DVI-D"],"a":0,"w":"HDMI carries digital video and audio to TVs, monitors and projectors.","img":"conn_hdmi_plug"},{"p":"Which connector is pictured?","o":["HDMI","DisplayPort","VGA","DVI-D"],"a":0,"w":"This is an HDMI port: digital video and audio. Its opening narrows at both bottom corners; DisplayPort has only one angled corner.","img":"conn_hdmi_port"},{"p":"Which connector is pictured?","o":["DisplayPort","HDMI","VGA","DVI-D"],"a":0,"w":"DisplayPort is an all-digital video connector with a latching plug and one angled corner.","img":"conn_displayport"},{"p":"Which connector is pictured?","o":["VGA","HDMI","DisplayPort","DVI-D"],"a":0,"w":"VGA is the 15-pin analog video connector (three rows, often blue). It is legacy, but projectors still use it.","img":"conn_vga"},{"p":"Which connector is pictured?","o":["SATA","Molex","USB-A","RJ45"],"a":0,"w":"These are SATA data connectors on a motherboard, one per drive. Note the L-shaped key; the external eSATA port has none.","img":"conn_sata"},{"p":"Which connector is pictured?","o":["eSATA","USB-A","HDMI","RJ45"],"a":0,"w":"eSATA is SATA for drives outside the case. The port is a flat, shielded slot with small guides on both sides and no L-shaped key (internal SATA has the L), so it can pass for USB at a glance.","img":"conn_esata"},{"p":"Which connector is pictured?","o":["Molex","SATA","ATX 24-pin","eSATA"],"a":0,"w":"Molex is the old chunky 4-pin power plug for drives and case fans.","img":"conn_molex_black"},{"p":"Which connector is pictured?","o":["Molex","SATA","ATX 24-pin","eSATA"],"a":0,"w":"Another look at the Molex 4-pin power plug: yellow (12 V), red (5 V) and two black grounds.","img":"conn_molex_wires"}],"objective":"220-1201, Objective 3.2 - Cables and Connectors","photos":true},{"id":"conn-scenarios","group":"cables","title":"Connector and cable scenarios","blurb":"Which connector or cable fits the job? Based on how the book words its questions.","items":[{"p":"Which connector goes on the end of a copper Ethernet patch cable?","o":["RJ45","RJ11","F-connector","DB-9"],"a":0,"w":"RJ45 terminates copper Ethernet cable (book B67)."},{"p":"A DSL modem connects to the phone line with which connector?","o":["RJ11","RJ45","F-connector","SC"],"a":0,"w":"DSL runs over telephone wiring, so it uses RJ11 (book A89)."},{"p":"A cable modem gets its Internet signal over coax. Which connector is on the end of that cable?","o":["F-connector","RJ11","SC","DB-9"],"a":0,"w":"Cable broadband arrives on coax, which ends in a screw-on F-connector (book C33, A55). The modem's Ethernet side is RJ45."},{"p":"You are configuring a router over a direct console cable. Which connector is commonly on that cable?","o":["DB-9","RJ11","F-connector","HDMI"],"a":0,"w":"A DB-9 serial connection is the classic console/management link on routers and switches (book B21, C49)."},{"p":"Which connector is Apple's proprietary one that can be plugged in face up or face down?","o":["Lightning","USB-C","Micro-USB","Thunderbolt"],"a":0,"w":"Lightning is Apple's reversible connector (book C46)."},{"p":"A graphics designer needs a Mac to drive a second monitor and an external storage drive. Which interface fits best?","o":["Thunderbolt","VGA","eSATA","DB-9"],"a":0,"w":"Thunderbolt carries video and storage data on one fast port (book B39)."},{"p":"Which connector attaches a storage drive outside the computer case?","o":["eSATA","SATA","Molex","DB-9"],"a":0,"w":"eSATA is the external version of SATA (book B30)."},{"p":"Which fiber connector is square and pushes in and pulls out?","o":["SC","LC","RJ45","F-connector"],"a":0,"w":"SC is the square push-pull connector (book B56, C36)."},{"p":"A fiber link between buildings ends in a small clip-latched connector common on switches and routers. Which is it?","o":["LC","SC","F-connector","DB-9"],"a":0,"w":"LC is the small fiber connector (book C60)."},{"p":"A video card outputs DVI-D, but the projector only has HDMI. What should you use?","o":["A DVI-D to HDMI adapter","A VGA cable","A Molex splitter","An RJ45 coupler"],"a":0,"w":"DVI-D and HDMI are both digital, so an adapter bridges them (book C41)."},{"p":"Which video connector is the only analog one in this list?","o":["VGA","HDMI","DisplayPort","DVI-D"],"a":0,"w":"VGA is analog. HDMI, DisplayPort and DVI-D are digital (book C3, C41)."},{"p":"Which of these is the usual connector for an LCD projector in a conference room?","o":["HDMI","RJ45","Molex","eSATA"],"a":0,"w":"Projectors usually take HDMI (book C90)."},{"p":"An Android phone needs a charging cable. Which connector is most likely to fit?","o":["USB-C","Lightning","RJ11","DB-9"],"a":0,"w":"Modern Android phones use USB-C for charging (book B84) and for moving files (book C42)."},{"p":"Which power plug feeds older drives and case fans from the power supply?","o":["Molex","SATA data","RJ45","eSATA"],"a":0,"w":"Molex is the legacy 4-pin power plug (book B2)."},{"p":"Which Ethernet cable type is built to go through the air-handling space above a ceiling?","o":["Plenum-rated","Direct burial","Coaxial","Patch cable"],"a":0,"w":"Plenum cable limits flame and smoke (book B37)."},{"p":"An Ethernet cable containing gel and a ground wire is meant for which job?","o":["Direct burial","Plenum","Patch cord","Crossover"],"a":0,"w":"Direct burial cable can go straight in the ground (book C53)."},{"p":"Two buildings across a parking lot need an Ethernet link longer than copper's 100-meter limit. What do you run?","o":["Fiber","Cat 5e","Coax","Plenum copper"],"a":0,"w":"Fiber reaches far past copper's 100-meter limit (book C19), and it is also immune to electrical interference."},{"p":"Which fiber connector locks with a push-and-twist bayonet?","o":["ST","SC","LC","RJ45"],"a":0,"w":"ST (Straight Tip) is the round one you push in and twist. SC is square and push-pull, and LC is small with a clip. The book only uses ST as a wrong answer (B30, C49)."},{"p":"Which tool attaches an RJ45 connector to a cable?","o":["Crimper","Punch-down tool","Tone generator","Cable tester"],"a":0,"w":"A crimper fastens the connector (book A26, B3). This one is a Network Tools topic (objective 2.8)."}],"objective":"220-1201, Objective 3.2 - Cables and Connectors"},{"id":"port-sprint","group":"ports","title":"Port sprint","blurb":"Rapid-fire questions on all fourteen core ports: name to number, number to name, TCP or UDP, and book-style scenarios.","items":[{"p":"Which port numbers does FTP use?","o":["20/21","445","22","389"],"a":0,"w":"FTP uses TCP 20/21. It transfers files (data and control)."},{"p":"Which port number does SSH use?","o":["22","23","3389","445"],"a":0,"w":"SSH uses TCP 22. It gives an encrypted terminal (and carries SFTP)."},{"p":"Which port number does Telnet use?","o":["23","22","3389","445"],"a":0,"w":"Telnet uses TCP 23. It gives an unencrypted terminal."},{"p":"Which port number does SMTP use?","o":["25","110","143","80"],"a":0,"w":"SMTP uses TCP 25. It sends email, from clients to servers and between servers."},{"p":"Which port number does DNS use?","o":["53","67/68","389","25"],"a":0,"w":"DNS uses UDP 53. It turns names into IP addresses."},{"p":"Which port numbers does DHCP use?","o":["67/68","53","389","25"],"a":0,"w":"DHCP uses UDP 67/68. It hands out IP addresses automatically."},{"p":"Which port number does HTTP use?","o":["80","443","22","25"],"a":0,"w":"HTTP uses TCP 80. It carries unencrypted web traffic."},{"p":"Which port number does POP3 use?","o":["110","25","143","80"],"a":0,"w":"POP3 uses TCP 110. It downloads email from a server."},{"p":"Which port number does IMAP use?","o":["143","25","110","80"],"a":0,"w":"IMAP uses TCP 143. It syncs email and leaves it on the server."},{"p":"Which port number does LDAP use?","o":["389","53","67/68","25"],"a":0,"w":"LDAP uses TCP 389. It looks things up in a directory."},{"p":"Which port number does HTTPS use?","o":["443","80","22","25"],"a":0,"w":"HTTPS uses TCP 443. It carries encrypted web traffic."},{"p":"Which port number does SMB use?","o":["445","20/21","22","389"],"a":0,"w":"SMB uses TCP 445. It shares Windows files and printers (CompTIA also writes SMB/CIFS)."},{"p":"Which port number does RDP use?","o":["3389","22","23","445"],"a":0,"w":"RDP uses TCP 3389. It controls a remote Windows desktop."},{"p":"Which port numbers does NetBIOS use?","o":["137-139","53","389","3389"],"a":0,"w":"NetBIOS uses UDP and TCP 137-139. It is the older Windows name and session service (NetBT)."},{"p":"Which protocol uses TCP ports 20/21?","o":["FTP","SMB","SSH","LDAP"],"a":0,"w":"TCP 20/21 is FTP. It transfers files (data and control)."},{"p":"Which protocol uses TCP port 22?","o":["SSH","Telnet","RDP","SMB"],"a":0,"w":"TCP 22 is SSH. It gives an encrypted terminal (and carries SFTP)."},{"p":"Which protocol uses TCP port 23?","o":["Telnet","SSH","RDP","SMB"],"a":0,"w":"TCP 23 is Telnet. It gives an unencrypted terminal."},{"p":"Which protocol uses TCP port 25?","o":["SMTP","POP3","IMAP","HTTP"],"a":0,"w":"TCP 25 is SMTP. It sends email, from clients to servers and between servers."},{"p":"Which protocol uses UDP port 53?","o":["DNS","DHCP","LDAP","SMTP"],"a":0,"w":"UDP 53 is DNS. It turns names into IP addresses."},{"p":"Which protocol uses UDP ports 67/68?","o":["DHCP","DNS","LDAP","SMTP"],"a":0,"w":"UDP 67/68 is DHCP. It hands out IP addresses automatically."},{"p":"Which protocol uses TCP port 80?","o":["HTTP","HTTPS","SSH","SMTP"],"a":0,"w":"TCP 80 is HTTP. It carries unencrypted web traffic."},{"p":"Which protocol uses TCP port 110?","o":["POP3","SMTP","IMAP","HTTP"],"a":0,"w":"TCP 110 is POP3. It downloads email from a server."},{"p":"Which protocol uses TCP port 143?","o":["IMAP","SMTP","POP3","HTTP"],"a":0,"w":"TCP 143 is IMAP. It syncs email and leaves it on the server."},{"p":"Which protocol uses TCP port 389?","o":["LDAP","DNS","DHCP","SMTP"],"a":0,"w":"TCP 389 is LDAP. It looks things up in a directory."},{"p":"Which protocol uses TCP port 443?","o":["HTTPS","HTTP","SSH","SMTP"],"a":0,"w":"TCP 443 is HTTPS. It carries encrypted web traffic."},{"p":"Which protocol uses TCP port 445?","o":["SMB","FTP","SSH","LDAP"],"a":0,"w":"TCP 445 is SMB. It shares Windows files and printers (CompTIA also writes SMB/CIFS)."},{"p":"Which protocol uses TCP port 3389?","o":["RDP","SSH","Telnet","SMB"],"a":0,"w":"TCP 3389 is RDP. It controls a remote Windows desktop."},{"p":"Which protocol uses UDP and TCP ports 137-139?","o":["NetBIOS","DNS","LDAP","RDP"],"a":0,"w":"UDP and TCP 137-139 is NetBIOS. It is the older Windows name and session service (NetBT)."},{"p":"DHCP uses which transport protocol?","o":["UDP","TCP"],"a":0,"w":"DHCP runs over UDP 67 and 68 (book B5, C5)."},{"p":"DNS lookups normally use which transport protocol?","o":["UDP","TCP"],"a":0,"w":"The book shows DNS as udp/53. (TCP 53 is mainly used for large answers and zone transfers.)"},{"p":"HTTPS uses which transport protocol?","o":["TCP","UDP"],"a":0,"w":"The book lists HTTPS as tcp/443 (A3, C5). (HTTP/3 can also run over UDP 443, but the book lists HTTPS as TCP, and that is the answer to give.)"},{"p":"SSH uses which transport protocol?","o":["TCP","UDP"],"a":0,"w":"SSH is TCP 22, connection-oriented."},{"p":"Which pair of port numbers does DHCP use?","o":["67 and 68","20 and 21","22 and 23","161 and 162"],"a":0,"w":"Server 67, client 68, both UDP (book C5)."},{"p":"Which pair of port numbers does FTP use for file transfers?","o":["20 and 21","67 and 68","22 and 23","445 and 3389"],"a":0,"w":"FTP uses TCP 20 and 21 (book A24, C5)."},{"p":"A firewall is configured to block email transfers from a remote server. Which port is it blocking?","o":["25","443","22","23"],"a":0,"w":"SMTP is TCP 25 (book A17). POP3 (110) and IMAP (143) are for reading mail, not for servers handing mail to each other."},{"p":"Which port would you block on a firewall to stop secure terminal communication?","o":["22","23","443","110"],"a":0,"w":"SSH is TCP 22 (book C23). Telnet (23) is the unencrypted terminal."},{"p":"Which service provides Windows file and printer sharing?","o":["SMB","LDAP","IMAP","SSH"],"a":0,"w":"Windows file and printer sharing is SMB on TCP 445 (book B15)."},{"p":"Which port maps a drive to a remote Windows share?","o":["445","443","389","3389"],"a":0,"w":"SMB on TCP 445 (book C5)."},{"p":"Which port is used to connect to a console over an insecure connection?","o":["23","22","3389","25"],"a":0,"w":"Telnet on TCP 23 sends everything in clear text (book C5)."},{"p":"Which port views and controls a remote Windows computer?","o":["3389","445","22","23"],"a":0,"w":"RDP on TCP 3389 (book C5)."},{"p":"Which protocol should replace Telnet?","o":["SSH","FTP","SMTP","HTTP"],"a":0,"w":"SSH gives the same remote command line with encryption."},{"p":"Which protocol is the encrypted version of HTTP?","o":["HTTPS","SSH","FTP","IMAP"],"a":0,"w":"HTTPS wraps HTTP in TLS on TCP 443."},{"p":"A phone needs to read mail and keep every device's inbox in sync. Which protocol fits?","o":["IMAP","SMTP","POP3","FTP"],"a":0,"w":"IMAP leaves mail on the server, so every device sees the same inbox. POP3 downloads mail to one device, and SMTP only sends. (Book C20 accepts both IMAP and POP3 for simply reading mail on a phone.)"},{"p":"Which protocol sends mail from a client or between mail servers?","o":["SMTP","POP3","IMAP","LDAP"],"a":0,"w":"SMTP is the \"send\" protocol on TCP 25."},{"p":"A PC can ping 8.8.8.8 but cannot browse to google.com. Which service is failing?","o":["DNS","DHCP","LDAP","SMB"],"a":0,"w":"Names are not resolving (book C50)."},{"p":"A PC picks a 169.254.x.x address. Which service did not answer?","o":["DHCP","DNS","LDAP","SMTP"],"a":0,"w":"No DHCP reply means the PC self-assigns an APIPA address (book A33, A85)."},{"p":"Which protocol looks up users and resources in a directory such as Active Directory?","o":["LDAP","DNS","DHCP","SMB"],"a":0,"w":"LDAP (TCP 389) queries directories such as Active Directory, often for centralized logins (book B5)."}],"objective":"220-1201, Objective 2.1 - Common Ports"},{"id":"port-extra","group":"ports","title":"Extra ports quiz","blurb":"SNMP, TFTP, NTP, Syslog and the encrypted mail and directory ports. Not on the core list of fourteen.","items":[{"p":"Which port numbers does SNMP use?","o":["161/162","69","123","514"],"a":0,"w":"SNMP (161/162) monitors and manages network devices (162 carries traps)."},{"p":"Which port number does TFTP use?","o":["69","636","993","995"],"a":0,"w":"TFTP (69) moves files with no login, for firmware and network boot."},{"p":"Which port number does NTP use?","o":["123","587","161/162","69"],"a":0,"w":"NTP (123) keeps clocks in sync."},{"p":"Which port number does Syslog use?","o":["514","123","636","993"],"a":0,"w":"Syslog (514) collects device logs on a central server."},{"p":"Which port number does LDAPS use?","o":["636","995","587","161/162"],"a":0,"w":"LDAPS (636) is LDAP protected by TLS."},{"p":"Which port number does IMAPS use?","o":["993","69","123","514"],"a":0,"w":"IMAPS (993) is IMAP protected by TLS."},{"p":"Which port number does POP3S use?","o":["995","636","993","587"],"a":0,"w":"POP3S (995) is POP3 protected by TLS."},{"p":"Which port number does SMTP submission use?","o":["587","161/162","69","123"],"a":0,"w":"SMTP submission (587) lets mail clients hand mail to their server with STARTTLS."},{"p":"Which protocol uses ports 161/162?","o":["SNMP","NTP","Syslog","LDAPS"],"a":0,"w":"161/162 is SNMP. It monitors and manages network devices (162 carries traps)."},{"p":"Which protocol uses port 69?","o":["TFTP","IMAPS","POP3S","SMTP submission"],"a":0,"w":"69 is TFTP. It moves files with no login, for firmware and network boot."},{"p":"Which protocol uses port 123?","o":["NTP","SNMP","TFTP","Syslog"],"a":0,"w":"123 is NTP. It keeps clocks in sync."},{"p":"Which protocol uses port 514?","o":["Syslog","LDAPS","IMAPS","POP3S"],"a":0,"w":"514 is Syslog. It collects device logs on a central server."},{"p":"Which protocol uses port 636?","o":["LDAPS","SMTP submission","SNMP","TFTP"],"a":0,"w":"636 is LDAPS. It is LDAP protected by TLS."},{"p":"Which protocol uses port 993?","o":["IMAPS","NTP","Syslog","LDAPS"],"a":0,"w":"993 is IMAPS. It is IMAP protected by TLS."},{"p":"Which protocol uses port 995?","o":["POP3S","IMAPS","SMTP submission","SNMP"],"a":0,"w":"995 is POP3S. It is POP3 protected by TLS."},{"p":"Which protocol uses port 587?","o":["SMTP submission","TFTP","NTP","Syslog"],"a":0,"w":"587 is SMTP submission. It lets mail clients hand mail to their server with STARTTLS."}],"extra":true},{"id":"acronyms","group":"terms","title":"Acronym quiz","blurb":"What does it stand for? Core 1 acronyms that show up in questions and objectives. Where the book and CompTIA spell one differently, the explanation says so.","items":[{"p":"What does SATA stand for?","o":["Serial Advanced Technology Attachment","Serial Attached Transfer Adapter","Standard Advanced Terminal Access","Synchronous ATA Transfer Architecture"],"a":0,"w":"SATA = Serial Advanced Technology Attachment. The data interface for most internal HDDs and 2.5-inch SSDs. (The book writes \"Serial AT Attachment\"; AT stands for Advanced Technology.)"},{"p":"What does eSATA stand for?","o":["External Serial Advanced Technology Attachment","Enhanced Serial Advanced Technology Attachment","Embedded Serial Advanced Technology Attachment","Express Serial Advanced Technology Attachment"],"a":0,"w":"eSATA = External Serial Advanced Technology Attachment. SATA for drives outside the case. (The book writes \"External Serial AT Attachment\".)"},{"p":"What does NVMe stand for?","o":["Non-Volatile Memory Express","Network Virtual Memory Extension","New Volume Management Engine","Non-Volatile Module Enclosure"],"a":0,"w":"NVMe = Non-Volatile Memory Express. The fast SSD protocol that runs over PCIe."},{"p":"What does RAID stand for?","o":["Redundant Array of Independent Disks","Random Array of Integrated Drives","Redundant Access Index for Disks","Rapid Allocation of Independent Data"],"a":0,"w":"RAID = Redundant Array of Independent Disks. Combines drives for speed, redundancy or both."},{"p":"What does DIMM stand for?","o":["Dual In-line Memory Module","Direct Integrated Memory Module","Dynamic Internal Memory Matrix","Dual Interface Memory Mount"],"a":0,"w":"DIMM = Dual In-line Memory Module. The memory stick used in desktops."},{"p":"What does SO-DIMM stand for?","o":["Small Outline Dual In-line Memory Module","Single Output Direct Memory Module","Slim Open Dual Integrated Memory","Small Overhead Digital Memory Module"],"a":0,"w":"SO-DIMM = Small Outline Dual In-line Memory Module. The smaller memory stick used in laptops."},{"p":"What does DDR stand for?","o":["Double Data Rate","Dual Disk Redundancy","Direct Data Retrieval","Dynamic Display Refresh"],"a":0,"w":"DDR = Double Data Rate. Memory that transfers data on both clock edges. (One book explanation, B20, writes \"Dual Data Rate\"; CompTIA and the book's A49 say \"Double\".)"},{"p":"What does ECC stand for?","o":["Error Correcting Code","Extended Cache Control","Electronic Component Check","Enhanced Clock Calibration"],"a":0,"w":"ECC = Error Correcting Code. Memory that detects and fixes single-bit errors."},{"p":"What does BIOS stand for?","o":["Basic Input/Output System","Binary Integrated Operating System","Boot Instruction Output Standard","Basic Internal Operating Setup"],"a":0,"w":"BIOS = Basic Input/Output System. The firmware that starts the PC."},{"p":"What does UEFI stand for?","o":["Unified Extensible Firmware Interface","Universal Embedded Firmware Image","User Enabled Firmware Index","Unified External File Interface"],"a":0,"w":"UEFI = Unified Extensible Firmware Interface. The modern replacement for the legacy BIOS."},{"p":"What does CMOS stand for?","o":["Complementary Metal-Oxide Semiconductor","Central Memory Operating System","Compact Motherboard Output Storage","Controlled Module On Silicon"],"a":0,"w":"CMOS = Complementary Metal-Oxide Semiconductor. Holds BIOS settings and the clock, kept alive by the small battery."},{"p":"What does TPM stand for?","o":["Trusted Platform Module","Transfer Protocol Manager","Total Processor Memory","Trusted Peripheral Monitor"],"a":0,"w":"TPM = Trusted Platform Module. A chip that stores encryption keys."},{"p":"What does HSM stand for?","o":["Hardware Security Module","Host Storage Manager","High-Speed Memory","Hybrid Security Mechanism"],"a":0,"w":"HSM = Hardware Security Module. A dedicated device for storing and using encryption keys."},{"p":"What does PCIe stand for?","o":["Peripheral Component Interconnect Express","Primary Component Input Extension","Parallel Connection Interface Enhanced","Peripheral Computer Interface Express"],"a":0,"w":"PCIe = Peripheral Component Interconnect Express. The expansion slot for graphics cards and NVMe drives."},{"p":"What does ARM stand for?","o":["Advanced RISC Machine","Applied Resource Manager","Automated Register Module","Advanced Remote Management"],"a":0,"w":"ARM = Advanced RISC Machine. Low-power, low-heat processors used in phones, tablets and IoT devices."},{"p":"What does CCFL stand for?","o":["Cold Cathode Fluorescent Lamp","Compact Crystal Flat Light","Controlled Current Flow Lamp","Color Calibrated Fluorescent Layer"],"a":0,"w":"CCFL = Cold Cathode Fluorescent Lamp. The older LCD backlight that needs an inverter. (Not on CompTIA's 220-1201 acronym list; the book uses it, for example in A13 and C15.)"},{"p":"What does OLED stand for?","o":["Organic Light Emitting Diode","Optical Liquid Emission Display","Open LED Display","Organic Liquid Electronic Display"],"a":0,"w":"OLED = Organic Light Emitting Diode. A display where each pixel makes its own light, so no backlight."},{"p":"What does IPS (display) stand for?","o":["In-Plane Switching","Integrated Pixel Sensor","Intelligent Panel System","Inverted Polarized Screen"],"a":0,"w":"IPS (display) = In-Plane Switching. The LCD type with the best color and viewing angles."},{"p":"What does HDMI stand for?","o":["High-Definition Multimedia Interface","High-Density Media Input","Hybrid Digital Multimedia Interconnect","High-Definition Monitor Input"],"a":0,"w":"HDMI = High-Definition Multimedia Interface. Digital video and audio on one cable. (The book and the HDMI standard say \"Multimedia\"; CompTIA's acronym list prints \"High-definition Media Interface\".)"},{"p":"What does VGA stand for?","o":["Video Graphics Array","Variable Gradient Adapter","Visual Graphics Accelerator","Video Gateway Array"],"a":0,"w":"VGA = Video Graphics Array. The 15-pin analog video connector."},{"p":"What does DVI stand for?","o":["Digital Visual Interface","Direct Video Input","Dual Video Interconnect","Digital Video Integration"],"a":0,"w":"DVI = Digital Visual Interface. The video connector that came before HDMI: DVI-D is digital only, DVI-A is analog only, and DVI-I carries both."},{"p":"What does POST stand for?","o":["Power-On Self-Test","Primary Operating System Task","Processor Output Status Table","Pre-Operational Setup Test"],"a":0,"w":"POST = Power-On Self-Test. The check the BIOS runs at startup; beep codes come from it."},{"p":"What does SMART stand for?","o":["Self-Monitoring, Analysis and Reporting Technology","System Memory And Resource Tracking","Storage Maintenance And Repair Tool","Secure Monitoring And Reliability Test"],"a":0,"w":"SMART = Self-Monitoring, Analysis and Reporting Technology. \"SMART Failure Predicted\" means the drive expects to fail."},{"p":"What does IOPS stand for?","o":["Input/Output Operations Per Second","Internal Operating Process Speed","Interface Output Performance Standard","Input Output Protocol Stack"],"a":0,"w":"IOPS = Input/Output Operations Per Second. A measure of drive read and write performance (book B81)."},{"p":"What does DHCP stand for?","o":["Dynamic Host Configuration Protocol","Direct Host Connection Protocol","Dynamic Hardware Control Process","Distributed Host Configuration Path"],"a":0,"w":"DHCP = Dynamic Host Configuration Protocol. Hands out IP addresses automatically."},{"p":"What does DNS stand for?","o":["Domain Name System","Dynamic Naming Service","Data Network Switch","Domain Network Security"],"a":0,"w":"DNS = Domain Name System. Turns names into IP addresses."},{"p":"What does APIPA stand for?","o":["Automatic Private IP Addressing","Assigned Public IP Allocation","Automated Packet Inspection and Analysis","Alternate Primary IP Assignment"],"a":0,"w":"APIPA = Automatic Private IP Addressing. The 169.254.x.x address a PC gives itself when DHCP fails."},{"p":"What does VLAN stand for?","o":["Virtual Local Area Network","Variable Link Access Node","Verified LAN Address Name","Virtual Line Aggregation Network"],"a":0,"w":"VLAN = Virtual Local Area Network. Splits a physical switch into separate broadcast domains."},{"p":"What does VPN stand for?","o":["Virtual Private Network","Verified Packet Network","Virtual Port Node","Variable Public Network"],"a":0,"w":"VPN = Virtual Private Network. An encrypted tunnel over an untrusted network."},{"p":"What does NIC stand for?","o":["Network Interface Card","Network Input Controller","Node Interconnect Chip","Network Integrated Circuit"],"a":0,"w":"NIC = Network Interface Card. The adapter that connects a computer to the network and holds its MAC address."},{"p":"What does ONT stand for?","o":["Optical Network Terminal","Online Network Transceiver","Optical Node Translator","Open Network Terminal"],"a":0,"w":"ONT = Optical Network Terminal. Converts the ISP's fiber to copper Ethernet at the demarcation point."},{"p":"What does PoE stand for?","o":["Power over Ethernet","Port of Entry","Power on Endpoint","Packet over Ethernet"],"a":0,"w":"PoE = Power over Ethernet. Sends power over the same cable as data (book A29)."},{"p":"What does PAN stand for?","o":["Personal Area Network","Peripheral Access Network","Private Area Node","Packet Aggregation Network"],"a":0,"w":"PAN = Personal Area Network. A very small network, like a Bluetooth headset and phone."},{"p":"What does MAN stand for?","o":["Metropolitan Area Network","Managed Access Network","Multi-site Area Node","Main Area Network"],"a":0,"w":"MAN = Metropolitan Area Network. A network spanning a city."},{"p":"What does SAN stand for?","o":["Storage Area Network","Secure Access Network","Shared Application Node","Switched Access Network"],"a":0,"w":"SAN = Storage Area Network. A high-speed network for storage arrays."},{"p":"What does NetBIOS stand for?","o":["Network Basic Input/Output System","Network Binary Input/Output Service","Node-Based Internet Operating System","Networked Boot Information and Output Setup"],"a":0,"w":"NetBIOS = Network Basic Input/Output System. The older Windows name and session service, ports 137-139 (NetBIOS over TCP/IP is NetBT)."},{"p":"What does SMB stand for?","o":["Server Message Block","Secure Mail Boundary","Shared Memory Bus","Simple Message Broker"],"a":0,"w":"SMB = Server Message Block. Windows file and printer sharing."},{"p":"What does LDAP stand for?","o":["Lightweight Directory Access Protocol","Local Domain Authentication Protocol","Layered Data Access Process","Limited Directory Allocation Policy"],"a":0,"w":"LDAP = Lightweight Directory Access Protocol. Directory lookups for centralized logins."},{"p":"What does RDP stand for?","o":["Remote Desktop Protocol","Remote Data Packet","Routed Display Protocol","Resource Discovery Process"],"a":0,"w":"RDP = Remote Desktop Protoco ce Mode","Mobile Data Monitor","Multi-Device Manager"],"a":0,"w":"MDM = Mobile Device Management. Pushes policy and settings to phones. (Some book questions write \"Mobile Device Manager\"; CompTIA's list says \"Management\".)"},{"p":"What does BYOD stand for?","o":["Bring Your Own Device","Back Up Your Own Data","Build Your Own Desktop","Bring Your Own Domain"],"a":0,"w":"BYOD = Bring Your Own Device. Employees use their own phones for work."},{"p":"What does SIM stand for?","o":["Subscriber Identity Module","Secure Identity Memory","Signal Interface Module","Station Information Manager"],"a":0,"w":"SIM = Subscriber Identity Module. The card that identifies a phone to the cellular network."},{"p":"What does eSIM stand for?","o":["Embedded Subscriber Identity Module","Extended SIM","Encrypted Secure Identity Module","Electronic Signal Interface Module"],"a":0,"w":"eSIM = Embedded Subscriber Identity Module. A built-in SIM, so a second phone number can be added without a physical card (book A51)."},{"p":"What does GPS stand for?","o":["Global Positioning System","General Packet Service","Ground Position Signal","Geographic Pinpoint System"],"a":0,"w":"GPS = Global Positioning System. Satellite location."},{"p":"What does IaaS stand for?","o":["Infrastructure as a Service","Internet as a Service","Integration as a Service","Identity as a Service"],"a":0,"w":"IaaS = Infrastructure as a Service. You rent the hardware and manage the OS and apps."},{"p":"What does PaaS stand for?","o":["Platform as a Service","Process as a Service","Program as a Service","Packet as a Service"],"a":0,"w":"PaaS = Platform as a Service. You deploy code; the provider runs the platform."},{"p":"What does SaaS stand for?","o":["Software as a Service","Storage as a Service","Security as a Service","Server as a Service"],"a":0,"w":"SaaS = Software as a Service. You just use the application."},{"p":"What does VDI stand for?","o":["Virtual Desktop Infrastructure","Virtual Device Interface","Visual
