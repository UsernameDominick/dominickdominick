ed laser printer is scratched. Which of the following helped the technician identify this issue?","choices":[{"letter":"A","text":"Garbled text","explanation":"Laser printer output containing garbled text is likely due to a mismatch of the page description language. Garbled text would not indicate any issues with the photosensitive drum."},{"letter":"B","text":"Toner not sticking to the paper","explanation":"Toner is permanently attached to the paper using heat and pressure at the end of the printing process. Toner not sticking to the paper would indicate an issue with this fusing process and not with the photosensitive drum."},{"letter":"C","text":"Grinding noises","explanation":"Grinding noises usually indicate some type of mechanical problem inside of the printer, and this usually results in a paper jam or printing issue. A grinding noise would not commonly be associated with a scratch on a photosensitive drum."},{"letter":"D","text":"Solid line down the printed page","explanation":"A scratched photosensitive drum in a laser printer will cause toner to attach itself to that scratch. This additional toner appears as a single line running down the length of the laser printer output"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"B58","stem":"An application developer is designing an app which uses three servers running simultaneously as VMs on her desktop. An upgrade to the application will add three additional servers to the list of running VMs. Which of these hardware resources will be the most important for this upgrade?","choices":[{"letter":"A","text":"Video adapter","explanation":"There's no mention of additional video requirements, so the standard video used for the virtual machines would be sufficient, even when adding three additional servers."},{"letter":"B","text":"Network connection","explanation":"Network connectivity was not mentioned as a priority, and it's possible the new servers would only use a minimal amount of network resources."},{"letter":"C","text":"RAM","explanation":"Without any additional information about the applications, the most critical resource for these new servers will be the amount of RAM required to keep all of the operating systems running simultaneously"},{"letter":"D","text":"CPU","explanation":"CPU would probably be the second-most important resource for these new servers, but there was no information provided regarding CPU usage on these servers. In this example, it's possible that the individual servers operate with a minimal amount of CPU usage."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","source":"book"},{"id":"B59","stem":"A company has experienced a significant increase in printing costs over the last few months. Which of the following would provide the best way to track and manage these costs?","choices":[{"letter":"A","text":"Audit logs","explanation":"Audit logs can be used to provide detailed information about print jobs, number of pages printed, the usernames submitting the print jobs, and much more. Tracking printer resource usage can use logs from the user's operating systems or from the printer itself"},{"letter":"B","text":"Print spooler uptime","explanation":"A print spooler service is commonly used in Windows to manage the printing process, but monitoring the uptime of the service doesn't provide any specific information about the number of print jobs or resources used."},{"letter":"C","text":"Power usage monitor","explanation":"Printers certainly use power when printing, but it's not possible to correlate resource usage or printer costs by examining the power usage."},{"letter":"D","text":"Packet captures","explanation":"A packet capture can provide a great deal of information about data traversing the network, but it doesn't provide an easy way to monitor printer resources or printing costs."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"B60","stem":"A network engineer is troubleshooting an issue communicating to the Internet over a newly installed DSL connection. A laptop is connected to a DSL router over twisted pair copper. The IP configuration of the laptop is:\n\nIP address: 169.254.228.109\nSubnet mask: 255.255.0.0\nDNS: 9.9.9.9\n\nWhich of the following should be the next troubleshooting step?","choices":[{"letter":"A","text":"Reset the DSL modem","explanation":"There's nothing in the configuration settings that would indicate an issue with the DSL modem. If the DHCP service isn't available, then a similar APIPA address will still be assigned to the laptop."},{"letter":"B","text":"Modify the subnet mask","explanation":"The subnet mask in this exam has been assigned through the APIPA process, and changing the mask wouldn't solve the issue of communicating to the Internet."},{"letter":"C","text":"Change the DNS server address","explanation":"Because the APIPA addressing limits communication to the local subnet, changing the DNS server configuration would not solve this communications issue."},{"letter":"D","text":"Check the status of the DHCP server","explanation":"A DHCP (Dynamic Host Configuration Protocol) server automatically distributes IP addresses to new devices connecting to a network. If the DHCP server isn't available, a device will commonly auto-configure itself with an APIPA (Automatic Private IP Addressing) address. Addresses between the range of 169.254.1.0 through 169.254.254.255 are assigned to devices using APIPA"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.6 - Assigning IP addresses","link":"https://professormesser.link/1201030701","source":"book"},{"id":"B61","stem":"A user in the accounting department has configured their mobile phone as a hotspot. Which of these would best describe this configuration?","choices":[{"letter":"A","text":"Use the phone as a method of payment","explanation":"NFC (Near Field Communication) is a short-range wireless network commonly used to provide payments at a store's point of sale or credit card terminal."},{"letter":"B","text":"Fast-charge the phone","explanation":"Although some phones can be quickly charged with the right charger, a hotspot is not related to the battery charging process."},{"letter":"C","text":"Access the Internet through the phone","explanation":"Many smartphones include a hotspot feature, allowing a user to turn their phone into an Internet router. The phone provides access to the Internet over the cellular network, and other devices can use this Internet link by connecting to the smartphone over 802.11 wireless"},{"letter":"D","text":"Connect to external speakers","explanation":"Many mobile device external speakers are used with Bluetooth or through a direct cable connection. A hotspot is not related to external speakers or any audio output features."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"B62","stem":"A user has logged into their laptop using a fingerprint reader on the laptop's keyboard tray. Which of the following would best describe this technology?","choices":[{"letter":"A","text":"NFC","explanation":"NFC (Near-Field Communication) is a short-range networking technology used for payment systems, proximity activation, or small data transfers. NFC is not generally associated with fingerprint readers."},{"letter":"B","text":"GPS","explanation":"A GPS (Global Positioning System) feature in a smartphone can accurately display the device's location. This feature can sometimes be used during authentication to verify a location, but a GPS is not directly associated with a fingerprint reader."},{"letter":"C","text":"Screen digitizer","explanation":"A digitizer is designed to take an analog input and convert it to a digital signal to be used by the computing device. A digitizer on a display can allow direct input through touch or finger presses."},{"letter":"D","text":"Biometrics","explanation":"Biometrics provide a way to authenticate using something physical about a person. Some common biometric systems will evaluate a fingerprint, face recognition, or other physical trait to complete the authentication process"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.1 - Laptop Hardware","link":"https://professormesser.link/1201010101","source":"book"},{"id":"B63","stem":"An organization has recently implemented a browser- based email system that requires no additional software on the user devices. Which of the following would describe this type of application?","choices":[{"letter":"A","text":"SaaS","explanation":"SaaS (Software as a Service) is on-demand software. The client does not maintain a local software installation, and the application support is managed by the service provider. Google Mail is an example of SaaS"},{"letter":"B","text":"IaaS","explanation":"IaaS (Infrastructure as a Service) provides hardware resources to the end user, and the user is responsible for installing an operating system and an application. A web hosting provider offering a bare metal server would be an example of IaaS."},{"letter":"C","text":"HaaS","explanation":"HaaS (Hardware as a Service) is another term for IaaS. A user is provided CPU, memory, and storage with HaaS, and will usually install an operating system and application on the hosted hardware infrastructure."},{"letter":"D","text":"PaaS","explanation":"PaaS (Platform as a Service) provides the building blocks for application developers. The servers and software are managed by the service provider, and the user is responsible for putting together the application modules to fit their needs. SalesForce.com offers a number of PaaS products."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","source":"book"},{"id":"B64","stem":"What type of power supply can operate across countries using different voltages?","choices":[{"letter":"A","text":"High-voltage","explanation":"All power supplies are considered to be high-voltage. The type of power supply used with different voltages would best be described as auto voltage switching."},{"letter":"B","text":"Primary","explanation":"Infrastructure devices such as servers or switches may have multiple power supplies for redundancy. In these systems, one power supply may be the primary supply, and the other power supply would be the secondary supply."},{"letter":"C","text":"Modular","explanation":"A modular power supply does not have any cables permanently attached to the power supply unit. Cables can be added or removed as needed to maximize the airflow inside of the computer system."},{"letter":"D","text":"Voltage switching","explanation":"An auto voltage switching power supply can automatically detect and use different input voltages without the need to manually select an input voltage. This is especially useful when moving equipment in countries with 120 volts of AC (alternating current) to a country using 240 volts of AC"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.6 - Computer Power","link":"https://professormesser.link/1201030601","source":"book"},{"id":"B65","stem":"A user is reporting after starting their desktop, they receive the message “Windows has detected an IP address conflict.” Which of the following would be the best way to resolve this issue?","choices":[{"letter":"A","text":"Replace the Ethernet patch cable","explanation":"A bad patch cable might limit communication to a network, but it would not create an IP address conflict."},{"letter":"B","text":"Enable DHCP on the workstation","explanation":"One of the more useful features of a DHCP (Dynamic Host Configuration Protocol) server is the controlled assignment of IP (Internet Protocol) addresses. If the DHCP server is assigning all IP addresses, then a duplicate is unlikely. If a device is configured for manual addressing, then configuring the device to receive IP addresses via DHCP can avoid possible address duplication"},{"letter":"C","text":"Bounce the switch port","explanation":"\"Bouncing\" a switch port involves disabling and re-enabling the interface, and this is effectively the same thing as turning a computer off and back on again. If a manual IP address is configured, then the IP address conflict will still be in place when the computer restarts or the link is re-enabled."},{"letter":"D","text":"Reboot the default gateway","explanation":"An IP address conflict is an issue on the network devices, and restarting the default gateway will not resolve the conflict."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.6 - Assigning IP Addresses","link":"https://professormesser.link/1201020602","source":"book"},{"id":"B66","stem":"Each time a user logs in, they must insert their company ID card to a USB card reader to complete the authentication. Which of the following would best describe the technology used for this authentication?","choices":[{"letter":"A","text":"802.1","explanation":"802.11 wireless networks are commonly used for network communication, but the connection to the 802.11 network does not require an ID card or an external card reader."},{"letter":"B","text":"Bluetooth","explanation":"A Bluetooth connection would commonly consist of wireless connections to peripherals. In this example, the ID card is inserted into a physical card reader."},{"letter":"C","text":"SMB","explanation":"SMB (Server Message Block) is a protocol commonly used to share files and printers on a Microsoft network. SMB is not used to validate or scan information contained on a company ID card."},{"letter":"D","text":"RFID","explanation":"RFID (Radio Frequency Identification) uses a small electronic tag to provide an identification number to an RFID reader. Many company ID cards include an RFID chip inside of the card itself"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.2 - Wireless Network Technologies","link":"https://professormesser.link/1201020201","source":"book"},{"id":"B67","stem":"Which of the following connectors would be used to terminate a copper Ethernet patch cable?","choices":[{"letter":"A","text":"BNC","explanation":"BNC (Bayonet Neill–Concelman) connectors are commonly used for coaxial cables. The bayonet on a BNC connector twists and locks onto a BNC interface to ensure a solid connection."},{"letter":"B","text":"Lightning","explanation":"Lightning connectors are proprietary to Apple and are commonly found on legacy iPhone and iPad devices. Lightning connectors are not commonly associated with Ethernet connections."},{"letter":"C","text":"RJ45","explanation":"Copper Ethernet cables are commonly terminated with an 8P8C (Eight Position / Eight Conductor) RJ45 (Registered Jack 45) standard connector"},{"letter":"D","text":"DB-9","explanation":"DB-9 connections are technically DE-9 connections, although the industry has historically combined the names of the DB-25 and DE-9 to incorrectly name a DE-9 connector as DB-9. DB-9/DE-9 connectors are not used to terminate Ethernet connections, and are more commonly used for serial communication."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.2 - Copper Connectors","link":"https://professormesser.link/1201030208","source":"book"},{"id":"B68","stem":"A user has started their laptop, but the screen is completely covered with colored lines and flashing colors. Which of the following would best resolve this issue?","choices":[{"letter":"A","text":"Replace the laptop screen","explanation":"A damaged LCD display will often show colored lines, flashing colors, or have visible cracks on the screen. Unfortunately, the only way to resolve this type of issue is to completely replace the LCD screen"},{"letter":"B","text":"Enable the display's scaling option","explanation":"The scaling option will make the screen image smaller or larger, but it would not create colors lines or flashing colors."},{"letter":"C","text":"Change the output resolution","explanation":"The output resolution would change the size of the desktop and other screen items. Changing the resolution would not commonly cause the display to show flashing colors or colored lines."},{"letter":"D","text":"Disable the dynamic color temperature option","explanation":"Many operating systems will change color temperatures throughout the day to help with eye strain and minimize bright screens during evening hours. These features would not common cause a screen to show flashing colors or colored lines."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"B69","stem":"A system administrator has just received a laptop previously sent out for repair. However, after powering on the computer, the laptop no longer responds to the stylus. Which of the following is the most likely reason for this issue?","choices":[{"letter":"A","text":"The GPU requires an updated device driver","explanation":"Updating an existing device driver will not generally provide additional features or functionality such as finger or stylus input."},{"letter":"B","text":"The display needs a new inverter","explanation":"The inverter in a CCFL (Cold Cathode Fluorescent Lamp) LCD (Liquid Crystal Display) is used to convert DC (Direct Current) power to AC (Alternating Current) for the backlight. If the laptop had a bad inverter, the information on the screen would be almost impossible to read because of the missing backlight."},{"letter":"C","text":"The display needs to be paired to the laptop motherboard","explanation":"A laptop display is physically connected to the rest of the laptop and does not require any separate pairing process to use touch or stylus input."},{"letter":"D","text":"The digitizer is faulty","explanation":"The digitizer converts the touch of a finger or a stylus to digital signals used by the computer. If the digitizer is not operational, then the screen will not be able to interpret the input from a stylus"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"B70","stem":"A graphics designer has noticed that small dots on their screen remain a solid black color, even when the image should display a different color. Which of the following would describe this issue?","choices":[{"letter":"A","text":"Burn-in","explanation":"If a display shows a single image over a long period of time, it's possible for the image to remain visible on the screen when the output changes. This ghosting effect can sometimes be permanently \"burned-in\" to the display."},{"letter":"B","text":"Non-native resolution","explanation":"Using an LCD monitor at a non-native resolution will cause the image to appear skewed or blurry. A non-native resolution setting would not cause a single pixel to appear black."},{"letter":"C","text":"Incorrect data source","explanation":"Many monitors can support video input from different sources. If the source is not set correctly, the screen will often be completely black or a message will appear stating an input signal is not active on that interface."},{"letter":"D","text":"Dead pixel","explanation":"A dead pixel is a single dot (pixel) on the screen that always remains black and does not change with the image"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"B71","stem":"A gaming enthusiast has upgraded his home computer from integrated graphics to a separate video adapter card. The computer operates as expected for web browsing and word processing applications. However, playing a game results in the system shutting down after a few minutes of operation. Which of the following would be the most likely component causing this issue?","choices":[{"letter":"A","text":"CPU","explanation":"A common symptom of a bad CPU (Central Processing Unit) would be application and operating system errors. A faulty CPU would not commonly cause the entire computer to shut down."},{"letter":"B","text":"Power supply","explanation":"Adding additional components to a computer can often increase the power usage, and video adapter cards are one of the most power-hungry devices you can add to a computer. If a system is displaying errors or shutting down during periods of heavy use, then the issue is commonly related to heat or power"},{"letter":"C","text":"RAM","explanation":"Faulty RAM (Random Access Memory) can cause application and operating system errors, and it's common to see Windows Stop errors randomly appear with bad RAM. Bad memory would not commonly cause a computer to completely shut down."},{"letter":"D","text":"SSD","explanation":"A bad SSD (Solid State Drive) would show file system errors in the operating system or application. A problematic SSD would not commonly cause a computer to shut down."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":null,"source":"book"},{"id":"B72","stem":"A network administrator has just installed a new access point in a downtown office building, but now users are reporting intermittent connectivity to the Internet. Which of the following would be the first thing to check?","choices":[{"letter":"A","text":"SSID broadcast option","explanation":"The SSID (Service Set Identifier) broadcast is used to populate the list of available wireless networks. Enabling or disabling the SSID broadcasts would not cause intermittent connectivity over the wireless network."},{"letter":"B","text":"Firmware version","explanation":"A firmware update in the access point might offer a performance modification, security patch, or a bug fix. However, most normal wireless operations would not be changed through a firmware update, and a firmware update would most likely not resolve an issue with intermittent connectivity."},{"letter":"C","text":"MAC filter","explanation":"MAC (Media Access Control) filters are used to administratively control physical devices from accessing the wireless network. A MAC address would not cause intermittent connectivity for existing devices, however."},{"letter":"D","text":"Channel interference levels","explanation":"In areas with many different organizations located near each other, it's possible that the frequencies used on different wireless access points could conflict with each other and cause interference with wireless communication. In busy areas, it's recommended to perform an analysis of the frequencies in use before installing a new access point"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"B73","stem":"A company would like to advertise a list of email servers authorized to send messages on their behalf. Which of the following would be the best way to provide this information?","choices":[{"letter":"A","text":"APIPA","explanation":"An APIPA (Automatic Private IP Addressing) assignment is used to provide a link-local IP address when no other IP address configuration is available. The APIPA process is not associated with email authorizations."},{"letter":"B","text":"Proxy server","explanation":"A proxy server is a device that makes requests to a service on behalf of a user. The proxy performs the request and provides the results back to the client. Proxy servers are not used to advertise a list of authorized email servers."},{"letter":"C","text":"UTM","explanation":"A UTM (Unified Threat Management) device is the precursor to the modern NGFW (Next-Generation Firewall), and they often include many different functions in a single device. UTMs are not commonly used to advertise a list of authorized email servers."},{"letter":"D","text":"SPF record","explanation":"An SPF (Sender Policy Framework) record is part of a DNS (Domain Name System) server configuration, and it lists all servers authorized to send emails for a particular domain"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.4 - DNS Configuration","link":"https://professormesser.link/1201020401","source":"book"},{"id":"B74","stem":"A company assigns IP addresses automatically to each device, and those addresses will remain on the device for a minimum of 8 hours. Which of the following best describes this configuration?","choices":[{"letter":"A","text":"Subnet mask","explanation":"A subnet mask is used in conjunction with an IP address to associate a network device with a particular IP subnet. Subnet masks are not used to define the lease time for automatically assigned IP addresses."},{"letter":"B","text":"Lease","explanation":"A lease is used in DHCP (Dynamic Host Configuration Protocol) to automatically associate an IP address configuration with a specific device for a certain amount of time. The device usually has the option to renew the lease to extended the configuration settings for another interval"},{"letter":"C","text":"SDN","explanation":"An SDN (Software Defined Network) provides a method of implementing the functions of a physical infrastructure product into software. This process focuses on creating a software-based networking infrastructure in a cloud environment."},{"letter":"D","text":"Reservation","explanation":"An IP reservation is used by DHCP to always assign the same IP address to a specific device. DHCP reservations match the MAC (Media Access Control) address of a device to a reserved IP address."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.4 - DHCP","link":"https://professormesser.link/1201020402","source":"book"},{"id":"B75","stem":"Users in the marketing department are reporting that one network printer is not working. There are many print jobs in the queue, but none of the jobs are printing. A test print from the printer's front panel does not print any pages. What is the most likely reason for this printing issue?","choices":[{"letter":"A","text":"Printer drivers need to be updated","explanation":"The printer drivers are loaded on client workstations to properly format a print job for the printer. An incorrect printer driver would not prevent the test print from working properly."},{"letter":"B","text":"Network is disconnected","explanation":"A disconnected network would certainly cause all of the print jobs to be waiting in the print queue, but it would not prevent the printer from processing a test print from the front panel of the printer."},{"letter":"C","text":"Printer hardware has failed","explanation":"If the printer was operational, then a printer test from the front panel should provide some output. The test print bypasses the network and print spooler and provides a check for print quality. If the local test print isn't working, then the printer itself has some type of hardware failure"},{"letter":"D","text":"Print spooler needs to be restarted","explanation":"A failed print spooler would be another reason for jobs to be stuck in the queue, but the test prints should still work properly from the printer's front console panel."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"B76","stem":"A member of the accounting department would like to work remotely while attending a conference in another city. Which of these technologies would best provide this functionality?","choices":[{"letter":"A","text":"VLAN","explanation":"A VLAN (Virtual Local Area Network) is a common way to segment devices on a switched network. VLANs do not provide any remote access functionality."},{"letter":"B","text":"802.11","explanation":"802.11 wireless networks are commonly used at conferences and hotels, but the wireless network itself does not provide any remote access capabilities. A VPN would operate over a wired or wireless network to provide a secure remote access connection."},{"letter":"C","text":"VPN","explanation":"A VPN (Virtual Private Network) would allow a remote user to connect to the corporate office over a secure encrypted tunnel"},{"letter":"D","text":"PAN","explanation":"A PAN (Personal Area Network) is commonly associated with devices located in close proximity of each other. For example, the connection to a Bluetooth headset is a PAN."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.4 - VLANs and VPNs","link":"https://professormesser.link/1201020403","source":"book"},{"id":"B77","stem":"In which of the following situations would you be most likely to use a network tap?","choices":[{"letter":"A","text":"Attach an RJ45 connector to the end of an Ethernet cable","explanation":"A crimper is used to attach connectors to the end of a cable. A network tap does not attach connectors to a cable."},{"letter":"B","text":"Capture packets from a network link","explanation":"A network tap provides a physical connection for intercepting network traffic. The tap can send a copy of the intercepted traffic to a packet capture device or security tool"},{"letter":"C","text":"Test packet loss on a router interface","explanation":"A loopback cable or loopback connector can be used to troubleshoot problems with a physical interface. When data is sent out of the interface, the loopback cable redirects the signal back to the same interface."},{"letter":"D","text":"Locate a specific workstation connection on a punch-down block","explanation":"Finding the needle in a haystack of cables is made much easier by using a tone generator and an inductive probe."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"B78","stem":"A digital graphics department has been using a SAN to store their image files. The team now reports that all of the files on the SAN are no longer accessible. Which of the following should be the first thing to check on the SAN?","choices":[{"letter":"A","text":"RAID array status","explanation":"A SAN (Storage Area Network) is a network-connected storage array. If the SAN is unavailable, then it's possible that the drive array is having a technical issue. The first thing to check on the SAN is the RAID array health and network connectivity. Once those are verified to be working, the troubleshooting can continue"},{"letter":"B","text":"CPU utilization","explanation":"A high amount of CPU utilization on the SAN could cause the system to perform slowly, but the drive array would usually still be available on the network. A SAN is usually a single-purpose system, and it would not be common to experience high utilization."},{"letter":"C","text":"Input voltage","explanation":"The input voltage of a device is determined during the installation process, and it would be very unusual for the voltage to change. A power-related issue on a device might be a power supply failure or an issue with the power cable. An input voltage issue would not commonly be the first thing to check."},{"letter":"D","text":"Cache hits","explanation":"Caching is designed to improve performance when reading or writing to a drive. A caching problem may cause performance to suffer, but the data would still be available to users."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"B79","stem":"A network administrator is installing a new access point between buildings. Which of the following would determine the usable frequencies and maximum signal strength for this connection?","choices":[{"letter":"A","text":"End User License Agreement","explanation":"An End User License Agreement (EULA) is usually associated with the use of software. The developer will require the user to agree to a series of terms and conditions before the software can be used."},{"letter":"B","text":"Type of data transferred","explanation":"The type of data transferred over a wireless network does not determine which frequencies can be used or the power of the wireless signal."},{"letter":"C","text":"Acceptable Use Policy","explanation":"An Acceptable Use Policy (AUP) is used by companies to set guidelines on the use of technology in the organization. The AUP does not determine usable frequencies or signal strengths."},{"letter":"D","text":"Government regulations","explanation":"Most governments will regulate the usable frequencies and maximum power for the wireless spectrum. These regulations can vary depending on location, frequencies, or type of network"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.2 - Wireless Network Technologies","link":"https://professormesser.link/1201020201","source":"book"},{"id":"B80","stem":"A network administrator is pinging a site on the Internet and receives these results: C:\\Users\\professor>ping 9.9.9.9\n\nPinging 9.9.9.9 with 32 bytes of data:\nReply from 9.9.9.9: bytes=32 time=618ms TTL=128\nReply from 9.9.9.9: bytes=32 time=816ms TTL=128\nReply from 9.9.9.9: bytes=32 time=627ms TTL=128\nReply from 9.9.9.9: bytes=32 time=727ms TTL=128\n\nPing statistics for 9.9.9.9: Packets: Sent = 4, Received = 4, Lost = 0 (0% loss), Approximate round trip times in milli-seconds: Minimum = 618ms, Maximum = 816ms, Average = 697ms\n\nWhich of the following would best describe these state of this network connection?","choices":[{"letter":"A","text":"Dropped packets","explanation":"This ping output shows that four packets were sent and four were received, so no packets were dropped during this test."},{"letter":"B","text":"Excessive latency","explanation":"An average response time of 697 milliseconds is relatively long, especially considering that most local devices will respond in 1 or 2 milliseconds. This large response time indicates significant latency between the local device and the remote site"},{"letter":"C","text":"Port flapping","explanation":"Port flapping describes an Ethernet interface constantly disconnecting and reconnecting on a switch. This disconnection would most likely result in dropped packets."},{"letter":"D","text":"Network loop","explanation":"A loop on the network would commonly cause the TTL (Time to Live) value to decrease to zero and cause a router to drop the zero TTL packets. This would commonly cause the ping to fail with no replies from the remote location."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"B81","stem":"A system administrator needs to upgrade the hard drives in a RAID array. Which of the following would be the best measurement of read and write times on the new hard drives?","choices":[{"letter":"A","text":"S. M. A. R. T.","explanation":"S. M. A. R. T. (Self-Monitoring, Analysis, and Reporting Technology) statistics can provide information on the health and overall operation of a storage device, but S. M. A. R. T. does not provide extensive performance measurements."},{"letter":"B","text":"Jitter","explanation":"Jitter is a measurement of the delay between network frames. Jitter information does not provide any direct performance measurements of storage devices."},{"letter":"C","text":"IOPS","explanation":"IOPS (Input/Output Operations Per Second) is a measure of read and write performance, and it provides a good comparison of performance between different storage devices"},{"letter":"D","text":"RPM","explanation":"The RPM (Revolutions per Minute) of a storage drive can be a very broad measure of performance, but it doesn't provide any details about the speed of reading and writing data to the drive."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"B82","stem":"A user normally stores files in their H: drive, but the drive letter is not appearing in File Explorer. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"Local drive performance is slow","explanation":"Poor performance of a drive on a local computer might cause the system to be slower than other devices, but it wouldn't directly prevent the system from mapping drives during the login process."},{"letter":"B","text":"Login script did not run","explanation":"The login script is often used to configure a user's work environment, including the mapping of network shares to a drive letter"},{"letter":"C","text":"A drive in a RAID 1 array has failed","explanation":"A RAID 1 array mirrors the drive data, so losing a single drive would not have any affect on the data availability or the mapping of any network share drive letters."},{"letter":"D","text":"The share is already in use","explanation":"A single network share can be used by many devices simultaneously, and some computers might even include the same share on multiple drive letters."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"B83","stem":"A user’s desktop computer does not start in the morning when the power button is pressed. A technician notices that the screen remains dark, but fans are spinning inside of the computer case. No messages are displayed and no beeps are heard. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"Faulty RAM","explanation":"During POST (Power On Self Test), critical components like CPU (Central Processing Unit) and RAM (Random Access Memory) are tested. If the test fails, the system will beep and a message may appear on the screen. In this example, no messages are shown and there are no beep codes to signify a memory issue."},{"letter":"B","text":"No boot drive found","explanation":"A missing boot drive would display a message on the screen such as, \"Default Boot Device Missing,\" or similar information."},{"letter":"C","text":"The CPU is overheating","explanation":"This system is not starting up in the morning, so there's no opportunity for the CPU to become overheated. It would take a few minutes of operation for a faulty cooling system to cause the CPU to become too hot and shut down."},{"letter":"D","text":"Bad power supply","explanation":"A bad power supply can sometimes provide power for some voltages but not others. If the fans are running but no other devices are working, then a bad power supply should be a consideration"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"B84","stem":"A user in the shipping department needs a charging cable for their Android phone. Which of the following connectors would be the most likely to work on this phone?","choices":[{"letter":"A","text":"USB-C","explanation":"Android devices commonly used the USB standard for connectivity, and USB-C is a common connector for many mobile devices"},{"letter":"B","text":"Lightning","explanation":"Lightning connectors are proprietary to Apple. You'll see Lightning connections used exclusively on iOS devices."},{"letter":"C","text":"RJ45","explanation":"RJ45 (Registered Jack 45) is a standard connector type most commonly seen on Ethernet network cables. RJ45 would not commonly be used on mobile phones."},{"letter":"D","text":"Thunderbolt","explanation":"Thunderbolt connectors are common on desktop computers, but the Thunderbolt technology isn't used on smartphone connectors."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"B85","stem":"A company has installed a page scanner that outputs the scanned files to SMB. Which of the following would be the most likely destination for these scanned images?","choices":[{"letter":"A","text":"Cloud storage","explanation":"Because of the many operating systems used to access the files, cloud storage does not commonly use SMB for file transfers."},{"letter":"B","text":"Windows share","explanation":"Windows uses the SMB (Server Message Block) protocol to transfer files between other Windows devices. SMB is commonly used to transfer files to a Windows share"},{"letter":"C","text":"eSATA drive","explanation":"eSATA (External Serial AT Attachment) is a connection type for external removable storage drives. A network scanner would not commonly save files to an eSATA drive."},{"letter":"D","text":"Network printer","explanation":"Creating a digital image from a physical page and then printing the digital image is probably not the most efficient use of the scanning process."},{"letter":"E","text":"Email inbox","explanation":"Although it's common for network scanners to email the scanned images, the use of SMB as the output type would not be associated with email."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"B86","stem":"A workstation administrator has been asked to troubleshoot an issue with Internet connectivity on a laptop computer. The network status in the taskbar shows a yellow exclamation mark with the message “No Internet access.” When examining the Ethernet connection on the laptop, the cable sheath is an inch short and individual copper wires are visibly disconnected from the RJ45 connector. Which of the following should be used to correct this issue?","choices":[{"letter":"A","text":"Crimper","explanation":"A crimper is used to attach modular connectors to the end of cables. In this example, the cable would be cut back past the missing cable sheath and the wires would be attached to a new connector using an RJ45 crimper"},{"letter":"B","text":"Punch-down tool","explanation":"Punch-down tools are used to reconnect wires, but only to punch-down blocks such as 66 blocks or 110 blocks. For device connections, a crimper is the only way to attach a new RJ45 connector."},{"letter":"C","text":"Loopback plug","explanation":"A loopback plug is used to test the physical interface of a device when troubleshooting. A loopback plug isn't used to repair or replace the RJ45 connector on a cable."},{"letter":"D","text":"Cable tester","explanation":"A cable tester can check for continuity and may be able to build a wire map of a cable, but a cable tester cannot be used to correct or crimp a connector onto the end of an Ethernet cable."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"B87","stem":"A network administrator needs to connect two sites located on opposite sides of the city. Which of these network connections would be the most appropriate?","choices":[{"letter":"A","text":"MAN","explanation":"A MAN (Metropolitan Area Network) connects locations in the same city or metropolitan area. Once the distance is outside the scope of the immediate metro area, the connection is categorized as a WAN (Wide Area Network)"},{"letter":"B","text":"PAN","explanation":"A PAN (Personal Area Network) describes the connection between our mobile devices and other accessories. For example, the wireless connection between a mobile phone and a headset would be categorized as a PAN."},{"letter":"C","text":"LAN","explanation":"A LAN (Local Area Network) is the network in the immediate area. The network at home or work is best described as a LAN."},{"letter":"D","text":"WAN","explanation":"A WAN (Wide Area Network) can describe a network connection between cities, states, or countries. Communication over long distances is often generically categorized as a WAN."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.7 - Network Types","link":"https://professormesser.link/1201020702","source":"book"},{"id":"B88","stem":"Which of the following would be the BEST way to remove toner and paper dust from the inside of a laser printer?","choices":[{"letter":"A","text":"Use a chemical cleaner that removes toner particles","explanation":"Unused toner is not difficult to remove, so a chemical cleaner is both unnecessary and potentially damaging to the printer. A damp cloth with cold water will pick up the toner without melting it or releasing it into the air."},{"letter":"B","text":"Run a cleaning page through the printer","explanation":"Cleaning pages are useful for thermal printers, but they won't pick up loose toner particles or dust from inside of a laser printer."},{"letter":"C","text":"Wipe the inside with a damp cloth","explanation":"There can be a significant amount of dust and toner particles inside of a laser printer, and using a normal vacuum cleaner or compressed air would release the particles into the air. Instead, a damp cloth will capture the toner and dust without causing issues with airborne particles in the immediate area"},{"letter":"D","text":"Use compressed air to blow out the particles","explanation":"As mentioned above, compressed air will spread toner and dust around the area and make it very difficult to remove. Instead, a damp cloth with cold water will easily and quickly pick up the loose toner and dust."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.8 - Laser Printer Maintenance","link":"https://professormesser.link/1201030802","source":"book"},{"id":"B89","stem":"A system administrator is connecting a remote site to the Internet over a single pair of copper wires. Which of the following is the administrator using for this installation?","choices":[{"letter":"A","text":"PoE switch","explanation":"PoE (Power over Ethernet) switches commonly use all four pair of twisted pair wires with an RJ45 connector."},{"letter":"B","text":"Tap","explanation":"A network tap is used to physically attach to an existing network link. Taps are often used to place a monitoring device onto the network without changing the underlying infrastructure."},{"letter":"C","text":"DSL modem","explanation":"DSL (Digital Subscriber Line) Internet connections use the same single copper pair of wires that are traditionally used by POTS (Plain Old Telephone Service) lines. DSL modems connect to this pair of wires and convert the signal to an Ethernet connection for other devices"},{"letter":"D","text":"ONT","explanation":"An ONT (Optical Network Terminal) is the device that connects the fiber from the ISP (Internet Service Provider) to the copper-based connections in a home or business."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"B90","stem":"Which of the following would most commonly be associated with a thermal pad?","choices":[{"letter":"A","text":"Connect a heat sink to a processor","explanation":"A thermal pad can be used to improve thermal conductivity between a hot component and a heat sink. Thermal pads are somewhat easier to install than traditional thermal paste"},{"letter":"B","text":"Install a fan in a desktop computer case","explanation":"The installation of a fan in a computer case does not require a conductive surface to cool the system, so a thermal pad would not be required."},{"letter":"C","text":"Mount a radiator for liquid cooling","explanation":"Liquid cooling will cycle the liquid from the heat sink to a radiator. Cooler air passes through the radiator and cools the warmer liquid in the system. Thermal pads are not used with these radiators."},{"letter":"D","text":"Manage CPU speed based on the current temperature","explanation":"Many systems will slow the CPU if the internal temperatures become too warm. This allows the system to continue running and prevents any damage from excessive heat. The management of these CPU speeds does not require a thermal pad."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.5 - Cooling","link":"https://professormesser.link/1201030510","source":"book"}],"C":[{"id":"C6","stem":"A system administrator has been assigned the task of installing an operating system, application, and data onto a cloud-based server. Which of these best describes this scenario?","choices":[{"letter":"A","text":"Infrastructure as a Service","explanation":"IaaS (Infrastructure as a Service) provides the CPU, memory, storage, and other infrastructure components necessary for the installation of an operating system and application"},{"letter":"B","text":"Platform as a Service","explanation":"PaaS (Platform as a Service) is a cloud deployment model that provides a modular development platform. Users can create their own applications based on the hosted modules available from a PaaS deployment."},{"letter":"C","text":"Hybrid Cloud","explanation":"The combination of both public and private cloud deployments results in a hybrid model. This model allows organizations to provide both public services to their customers and private services to use internally."},{"letter":"D","text":"Software as a Service","explanation":"Software as a Service is a cloud deployment model that provides on- demand software. The user is not responsible for hosting, development, or ongoing management of a SaaS-based deployment."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","source":"book"},{"id":"C7","stem":"A network engineer is installing a device allowing wireless devices to access the wired Ethernet network. Which of the following would best describe this technology?","choices":[{"letter":"A","text":"DSL","explanation":"DSL (Digital Subscriber Line) is a technology commonly used to provide Internet connectivity to a home or office. DSL itself does not provide any connectivity between wireless and wired networks."},{"letter":"B","text":"Managed switch","explanation":"A managed switch provides connectivity for wired Ethernet devices, and some of the more advanced features of the managed switch allow for additional network configurations and monitoring options. However, a managed switch does not provide access to a wireless network."},{"letter":"C","text":"VLAN","explanation":"One of the features of a managed switch is the ability to assign interfaces to VLANs (Virtual Local Area Networks). VLANs provide a way to logically separate devices on the same physical switch, but they don't provide any access to wireless networks."},{"letter":"D","text":"Access point","explanation":"An access point bridges the 802.11 wireless network with a wired Ethernet network. Since the access point is acting as a bridge, it's making forwarding decisions based on the destination MAC (Media Access Control) address of the network frame"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"C8","stem":"A systems administrator has added a new video adapter to a desktop computer, installed the latest video driver, and rebooted the system. When the system starts, it shows a Windows Stop Error before it reaches the login prompt. Which of the following would be the best next troubleshooting step?","choices":[{"letter":"A","text":"Press F8 during startup and choose “Boot from last known working configuration”","explanation":"If a recent configuration causes a boot issue, Windows can restart the operating system using the last known working configuration. Each time Windows successfully boots, it makes a backup of that configuration. If the startup option to \"boot from last known working configuration\" is selected, that working backup is used instead of the current Windows configuration. This can help resolve Windows Stop Error issues like those detailed in this question"},{"letter":"B","text":"Upgrade the system BIOS using an update file from the motherboard manufacturer","explanation":"motherboard manufacturer There's nothing in this question that would indicate that the BIOS is causing any issues with the computer."},{"letter":"C","text":"Disconnect all USB storage devices and restart the system","explanation":"If Windows tries to boot from a USB storage device and a problem occurs, an error message will be provided on the screen. The computer does not continue to reboot when attempting to boot from a USB storage device."},{"letter":"D","text":"Reinstall the operating system","explanation":"Since the last change to the computer was the video driver upgrade, it would be unnecessary to reinstall the entire operating system."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"C9","stem":"A system administrator is configuring a lab computer that will run five server VMs at the same time. Which of the following hardware resources will be the most important for this configuration?","choices":[{"letter":"A","text":"CPU","explanation":"The CPU utilizations required by a server can vary, but five servers at low utilizations would not be as much of a resource requirement as the storage space for the VMs (Virtual Machines)."},{"letter":"B","text":"Storage space","explanation":"Adding five virtual machines to a single device would require as much storage space as five separate operating systems. Of the available options, the system storage will be used the most"},{"letter":"C","text":"Video adapter","explanation":"Servers don't often require extensive video resources, and some servers don't even use a graphical interface. Given what we know in this question, the video adapter resources are not going to be a large resource requirement."},{"letter":"D","text":"NIC","explanation":"The NIC (Network Interface Card) provides the network connectivity for the virtual machines. Multiple VMs can use the same physical NIC, so most environments won't need any additional physical network interfaces."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","source":"book"},{"id":"C10","stem":"A user's smartphone contains both personal and corporate data. When the user attempts to install a new app, the installation is halted and an error message appears. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"NFC","explanation":"NFC (Near Field Communication) is designed to send small amounts of data over a short distance. NFC is commonly used in smart phones and smart watches as a method of payment at a credit card terminal."},{"letter":"B","text":"Bluetooth","explanation":"Bluetooth is a useful high speed network to use over a relatively short distance, such as a single room. Bluetooth is not commonly used as a method of device management."},{"letter":"C","text":"MDM","explanation":"MDM (Mobile Device Management) provides centralized management for mobile devices. An MDM can be used to set policies on app use, data storage, camera use, and almost any other feature on the smartphone"},{"letter":"D","text":"GPS","explanation":"A smartphone using GPS (Global Positioning System) can provide location information, but the GPS results aren't associated with app installation unless the manager of the MDM creates a specific policy linking the two."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Management","link":"https://professormesser.link/1201010302","source":"book"},{"id":"C11","stem":"Which of the following would provide segmentation of broadcast domains on the same physical switch?","choices":[{"letter":"A","text":"VLAN","explanation":"A VLAN (Virtual Local Area Network) is used to segment interfaces on a single switch or across multiple switches. This allows a network administrator to separate networks on a single switch instead of installing multiple physical switches"},{"letter":"B","text":"DNS","explanation":"DNS (Domain Name System) is commonly used to translate between fully qualified domain names (FQDNs) and IP addresses. DNS does not provide a method of network segmentation."},{"letter":"C","text":"VPN","explanation":"VPN (Virtual Private Networks) are used to securely communicate over an encrypted tunnel across the network. VPNs are commonly used to provide remote access to an organization's network from an insecure network or location."},{"letter":"D","text":"DHCP","explanation":"DHCP (Dynamic Host Configuration Protocol) is used to automatically assign IP address configurations on network devices. DHCP is not used for network segmentation."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.4 - VLANs and VPNs","link":"https://professormesser.link/1201020403","source":"book"},{"id":"C12","stem":"A user is reporting every page printed from a networked laser printer appears as garbled graphics and text characters. Which of the following is the most likely cause of this issue?","choices":[{"letter":"A","text":"Incorrect printer driver","explanation":"The printer driver formats the print job into a language that the printer can understand. If the incorrect driver is used, the language sent to the printer may not be interpreted correctly and the output may appear very different than the original document. In extreme cases, the output may appear as unreadable pages of garbled text and graphics"},{"letter":"B","text":"Damaged network cable","explanation":"A bad network cable would limit the speed or prevent the transmission of print jobs to the printer. The network frames include error checking, so any data corrupted as it traverses the network would not be accepted by the printer. A bad cable would not cause the final output to be garbled or difficult to read."},{"letter":"C","text":"Printer is low on memory","explanation":"A printer low on memory would print part of the rendered page. The portion that was rendered would appear normal and would not be garbled or difficult to read."},{"letter":"D","text":"Toner is low","explanation":"Low toner would cause the output to appear faded. Low toner would not cause the final output to be garbled."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"C13","stem":"During a presentation in a conference room, the lamp in an LCD projector is turning off after five minutes of use and back on ten minutes later. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"The video cable is faulty","explanation":"A bad video cable would display corrupted or missing information on the screen, but it would not cause a projector to power down."},{"letter":"B","text":"The display lamp has failed","explanation":"If the lamp has failed, there will be no output from the projector. A bad bulb would not commonly cause the projector to rotate through five- minute use cycles."},{"letter":"C","text":"The cooling process is failing","explanation":"If an LCD (Liquid Crystal Display) projector becomes overheated, it will automatically turn off to protect the bulb and other components. This is similar to the automatic protections found in laptop and desktop computers, and once the system cools down it can be restarted. If the cooling fans are blocked or not working, this process may continue the cycle until the cooling problem is resolved"},{"letter":"D","text":"The display resolution is incorrect","explanation":"A bad display resolution may show a skewed or non-proportional output on the projected image. A bad display resolution would not cause the projector to power off."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"C14","stem":"A system administrator has just completed a memory upgrade on a database server. When starting the system, this message is displayed: “Boot Device Not Found.” The BIOS configuration does not show any hard drives in the system. Which of the following would be the next best troubleshooting step?","choices":[{"letter":"A","text":"Replace the hard drive","explanation":"Without knowing the exact reason for the error, a complete hard drive replacement would be premature. Before making such a drastic change, it would be useful to check cables and run diagnostics before determining any hard drive issue."},{"letter":"B","text":"Upgrade the BIOS","explanation":"An older BIOS (Basic Input Output System) can potentially cause issues with memory upgrades, but those issues would not affect the operation of the hard drive. In this scenario, upgrading the BIOS would not be the first troubleshooting choice, and it probably wouldn't be part of the overall troubleshooting process."},{"letter":"C","text":"Check the hard drive cables","explanation":"A memory upgrade would require work inside of a computer case, and it's very easy to accidentally unseat or disconnect other cables. Since the only change was the memory upgrade, a change to the storage subsystem would not be expected. The most likely cause would be a cable issue"},{"letter":"D","text":"Modify the BIOS boot sequence","explanation":"If one storage device was trying to boot before the hard drive, then modifying the boot sequence would be the correct course of action. In this example, the only change was to the memory and not the boot process."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"C15","stem":"If a laptop's inverter is faulty, which of the following would be the most likely result?","choices":[{"letter":"A","text":"The battery will not recharge","explanation":"Inverters are not used in the circuit that recharges a laptop battery."},{"letter":"B","text":"The system will not power on","explanation":"A bad power supply might cause the laptop to stay powered off, but a bad inverter will not affect the power-on process."},{"letter":"C","text":"The screen will be difficult to see","explanation":"The inverter is used to convert the DC (Direct Current) power inside of the laptop to AC (Alternating Current). The AC power is then used to power the CCFL (Cold Cathode Florescent Lamp) backlights found in older laptop computers. Without the backlight, it will be very difficult to see the information displayed on an LCD (Liquid Crystal Display) screen"},{"letter":"D","text":"The USB interfaces will not be powered","explanation":"The inverter is specific to the backlight power and is not used for powering the USB interfaces."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","source":"book"},{"id":"C16","stem":"What is the most common use for the switch on a computer’s power supply?","choices":[{"letter":"A","text":"Sets the input voltage","explanation":"The input voltage to a power supply should match the capabilities of the power supply unit. Many power supply units are voltage switching, and they will automatically adjust between 120 volts and 240 volts based on the input voltage. Alternatively, some power supply units have a switch that must be manually set to specify input voltage"},{"letter":"B","text":"Controls the speed of the CPU","explanation":"The speed of the CPU (Central Processing Unit) is controlled from the BIOS (Basic Input Output System). The CPU speed would not be based on a power supply switch."},{"letter":"C","text":"Sets the cooling fan speed","explanation":"The cooling fan speeds are often managed from a fan controller on the motherboard. Fan speeds are not configured from the power supply."},{"letter":"D","text":"Boots from different operating system partitions","explanation":"The boot manager of a computer determines which operating system will start during the booting process. The boot partition is not configured from the power supply."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.6 - Computer Power","link":"https://professormesser.link/1201030601","source":"book"},{"id":"C17","stem":"Which of these devices would be used to configure an 802.1Q trunk?","choices":[{"letter":"A","text":"Router","explanation":"A router does not connect to other routers with 802.1Q trunks."},{"letter":"B","text":"Repeater","explanation":"Repeaters are relatively straightforward devices that do not have complex connectivity to other devices."},{"letter":"C","text":"Managed switch","explanation":"A managed switch includes features not found in an unmanaged switch, such as traffic prioritization, redundancy support, remote management, and VLAN (Virtual Local Area Network) support for connectivity to other switches via 802.1Q"},{"letter":"D","text":"Cable modem","explanation":"Cable modems are designed to convert signals from coax cable networks to Ethernet. Cable modems do not interconnect VLANs with other switches using 802.1Q."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"C18","stem":"A user is trying to connect a Bluetooth headset to his smartphone, but the headset does not appear in a list of available Bluetooth devices. Which of the following would be the best next step?","choices":[{"letter":"A","text":"Upgrade the smartphone OS","explanation":"Although it's usually important to keep the smartphone OS updated to prevent any security issues and to fix bugs, upgrading the OS is not required to connect a Bluetooth device."},{"letter":"B","text":"Enable Bluetooth pairing on the headset","explanation":"A smartphone will often require the Bluetooth devices to be in paring mode for it to appear in the list of available Bluetooth devices"},{"letter":"C","text":"Connect to the headset with a USB cable","explanation":"Some Bluetooth devices support direct wired connections over a USB cable, but connecting wirelessly over Bluetooth requires an initial pairing process to allow communication."},{"letter":"D","text":"Replace the smartphone battery","explanation":"Replacing the smartphone battery would only be necessary if the battery is no longer reliably holding a charge or if a discharged battery is easily replaceable. The issue of not displaying an available Bluetooth device on the pairing screen would not be related to a battery."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Networks","link":"https://professormesser.link/1201010301","source":"book"},{"id":"C19","stem":"A network administrator needs to connect an Ethernet link between two buildings located across the parking lot from each other. The total distance between the buildings is approximately 400 meters. Which of the following technologies would be the best choice for this installation?","choices":[{"letter":"A","text":"Coax","explanation":"Copper coaxial cabling has similar Ethernet distance limitations to twisted-pair copper cabling. Fiber optics allows the signal to extend well beyond the limitations of copper."},{"letter":"B","text":"Category 6A","explanation":"Category 6A (Augmented) is a specification of twisted pair copper cabling, and the longest supported distance of Ethernet over Category 6A is one hundred meters."},{"letter":"C","text":"Fiber","explanation":"Fiber optic communication can extend over very long distances using light instead of radio frequencies. Since the maximum supported distance of most Ethernet connections using copper are one hundred meters, any type of connection needing additional distance would be a good candidate for fiber optic cabling"},{"letter":"D","text":"UTP","explanation":"UTP (Unshielded Twisted Pair) cabling can support up to one hundred meters of Ethernet signal, but fiber optics can extend well beyond this limitation."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.2 - Optical Fiber","link":"https://professormesser.link/1201030203","source":"book"},{"id":"C20","stem":"A systems administrator needs to configure a smartphone to retrieve email messages from the corporate mail server. Which of the following protocols could be configured for this purpose? (Pick TWO)","choices":[{"letter":"A","text":"IMAP","explanation":"Two common protocols used to retrieve email messages are IMAP (Internet Message Access Protocol) and POP3 (Post Office Protocol 3)"},{"letter":"B","text":"SSH","explanation":"SSH (Secure Shell) is used to connect a terminal console across an encrypted network connection. SSH is not commonly used for sending or receiving email messages."},{"letter":"C","text":"SMTP","explanation":"SMTP (Simple Mail Transfer Protocol) is a common email protocol used for sending mail and is not used for retrieving mail."},{"letter":"D","text":"LDAP","explanation":"LDAP (Lightweight Directory Access Protocol) is used to store and retrieve information in a network directory. One common use of LDAP is to centralize authentication on a large distributed network."},{"letter":"E","text":"POP3","explanation":"Two common protocols used to retrieve email messages are IMAP (Internet Message Access Protocol) and POP3 (Post Office Protocol 3)"},{"letter":"F","text":"FTP","explanation":"FTP (File Transfer Protocol) is commonly used to transfer files between different systems. FTP does not support the retrieval of email messages from a mail server."},{"letter":"G","text":"SMB","explanation":"SMB (Server Message Block) is a common file and printer sharing protocol on Microsoft Windows devices."}],"correct":["A","E"],"multi":true,"objective":"220-1201, Objective 2.1 - Common Ports","link":"https://professormesser.link/1201020102","source":"book"},{"id":"C21","stem":"A company manages the maintenance of farm equipment and grain silos, and this equipment is often miles away from the nearest Ethernet connection. Which of the following would be the best way to provide connectivity to the maintenance team?","choices":[{"letter":"A","text":"Bluetooth","explanation":"Bluetooth provides flexible wireless connectivity, but only over short distances. Bluetooth would not provide any Internet connectivity in remote areas."},{"letter":"B","text":"5G","explanation":"5G (Fifth generation cellular) provides data connectivity over cellular network technologies. This type of wireless connectivity provides access from almost anywhere using a hotspot or a smartphone with hotspot or tethering functionality"},{"letter":"C","text":"802.11","explanation":"The 802.11 wireless standards are common in our homes and businesses, but the usable range of an 802.11 network is limited and would not be accessible on the outskirts of a farm."},{"letter":"D","text":"NFC","explanation":"NFC (Near Field Communication) is designed for small data transfers in a very close area. This limited communications area would not provide network access across an extended distance."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Networks","link":"https://professormesser.link/1201010301","source":"book"},{"id":"C22","stem":"Which of these cloud computing architectures would best describe several organizations sharing the same resources?","choices":[{"letter":"A","text":"Community","explanation":"A community cloud model is often used by multiple organizations to build a pool of resources with their combined financial contributions. This multi-tenant model provides a shared cloud-based deployment to organizations with similar goals and objectives"},{"letter":"B","text":"IaaS","explanation":"IaaS (Infrastructure as a Service) is a cloud deployment model that provides processing power, memory, and storage. The user of this service would provide and manage the operating systems and applications."},{"letter":"C","text":"Public","explanation":"A public cloud-based service is one that is available to anyone on the Internet."},{"letter":"D","text":"Hybrid","explanation":"A hybrid cloud deployment model is a combination of both public and private clouds. Some organizations will deploy services used by anyone on the Internet, but may also require services used privately by internal users."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","source":"book"},{"id":"C23","stem":"What port should be configured in a firewall to block secure terminal communication?","choices":[{"letter":"A","text":"23","explanation":"Telnet (Telecommunications Network) is the protocol used for terminal communication, but Telnet communicates insecurely without encrypting the data."},{"letter":"B","text":"443","explanation":"Web servers commonly use port 443 to sent encrypted browser traffic using SSL (Secure Sockets Layer) or TLS (Transport Layer Security). Browser traffic is not commonly used for terminal communication."},{"letter":"C","text":"22","explanation":"Port 22 is used by SSH (Secure Shell), the encrypted terminal communication protocol"},{"letter":"D","text":"110","explanation":"POP3 (Post Office Protocol version 3) uses port 110 to retrieve messages from an email server."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.1 - Common Ports","link":"https://professormesser.link/1201020102","source":"book"},{"id":"C24","stem":"A user has opened a ticket complaining of a constantly flashing light on the front of their desktop computer. Which of the following is the most likely reason for this issue?","choices":[{"letter":"A","text":"Power supply status","explanation":"A power supply status light may be available on the computer, but the light should be solid and would not normally blink."},{"letter":"B","text":"Network communication","explanation":"Many network adapters will include status lights on the RJ45 interface connected to the wired Ethernet network. This light is usually on the back or side of the computer and would not commonly be one of the lights on the front of the PC."},{"letter":"C","text":"Storage drive access","explanation":"Most computers will provide status lights on the front of the computer. One of the more common lights is a solid light showing that power is available to the system. The other light usually blinks each time access is made to a storage device to visually show access to the drive"},{"letter":"D","text":"RAM module transfers","explanation":"Data is constantly being transferred between RAM, CPU, and storage drives, and it would be uncommon to include a status light for this communication process."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"C25","stem":"A desktop administrator is troubleshooting an LCD display that shows a faint image at the bottom right of the screen. The faint image is displayed even when spreadsheets or browser screens are shown. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"Dead pixels","explanation":"A dead pixel is a single pixel that remains black, even when the display is showing a different color. There's usually no more than one dead pixel on a display, and that single pixel would not be large enough to show a faint image."},{"letter":"B","text":"Incorrect resolution","explanation":"An incorrect resolution may show a skewed or incorrect aspect ratio, and it would not display a faint image on the screen."},{"letter":"C","text":"Bad video cable","explanation":"A bad video cable might cause noise or missing information on the display, but it would not cause a faint image to constantly appear in a single place on the screen."},{"letter":"D","text":"Burn-in","explanation":"If an image is shown on a screen for an extended period of time, the display may continue to show a faint \"ghost\" of the image after the display has changed. This burn-in may be temporary, but it can be permanent in extreme circumstances"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"C26","stem":"A systems administrator is troubleshooting a Windows laptop that boots normally but becomes sluggish after login. Which of the following would provide the best source of troubleshooting information?","choices":[{"letter":"A","text":"Beep codes during startup","explanation":"The BIOS (Basic Input/Output System) of the computer will beep if a problem is found during POST (Power On Self-Test). Since this issue occurs after the startup process is complete, there are most likely no beep codes to diagnose."},{"letter":"B","text":"Power supply voltages","explanation":"Power supply voltages are usually an issue when components are not working properly. In this example, the issue appears to be related to the overall performance of the operating system and not the use of a single component."},{"letter":"C","text":"Number of installed DIMMs","explanation":"The number of DIMMs (Dual Inline Memory Modules) can improve performance, but the total amount of RAM would be a much more important metric when troubleshooting performance issues."},{"letter":"D","text":"Task Manager statistics","explanation":"Task Manager can provide real-time performance information and can list the applications automatically launched during the startup process. The administrator can enable or disable startup applications to determine if they might be causing the sluggish performance"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"C27","stem":"A network administrator has installed a fifty meter network connection from one side of the building to the other, and now he would like to make sure that the punch-downs and crimps are connected to the correct pins on each side. Which of these tools would be the best way to confirm the wiring map?","choices":[{"letter":"A","text":"Network tap","explanation":"A network tap provides a physical connection into an existing network cable to copy traffic. The information captured from the network tap is often used by an analysis or security tool."},{"letter":"B","text":"Cable tester","explanation":"A cable tester can quickly perform a wire map to determine if all of the wires were properly crimped or punched down on both ends of the cable"},{"letter":"C","text":"Toner probe","explanation":"Tone generators and inductive probes are useful for identifying the ends of a cable across a long distance, but they won't provide any information about the wire map."},{"letter":"D","text":"Loopback plug","explanation":"A loopback plug can help when diagnosing a physical network interface, but loopback plugs can't provide any information about the wire map of an existing cable run."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"C28","stem":"An administrator is building a new server, and they would like the server to continue operating if th
