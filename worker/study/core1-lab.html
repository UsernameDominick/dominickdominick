function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function domainFromObjective(obj) {
  if (!obj) return null;
  const m = obj.match(/(\d)\.\d+/);
  return m ? parseInt(m[1], 10) : null;
}

// Images live once in a shared registry; questions reference them by key so
// the same picture isn't duplicated into the Hard Mode copy of the question.
function imgSrc(key) { return (QUIZ_DATA.images && QUIZ_DATA.images[key]) || ''; }
function qImages(q, which) {
  const keys = q[which + 'ImageKeys'] || [];
  return keys.map(imgSrc).filter(Boolean);
}

function examLabel(ex) {
  return ex === 'H' ? 'HARD MODE' : 'EXAM ' + ex;
}

// Every question is tagged by where it came from: the Professor Messer book,
// or written for this app. Book questions carry the book's own explanations.
function questionSource(q) {
  if (q && q.source) return q.source;
  return /^X/.test(q && q.id ? q.id : '') ? 'original' : 'book';
}

function sourceBadge(q) {
  const s = questionSource(q);
  return s === 'book'
    ? ' <span class="src-badge src-book" title="From the Professor Messer practice exam book">BOOK</span>'
    : ' <span class="src-badge src-orig" title="Written for this app, not from the book">ADDED</span>';
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function exams() { return state.exam === 'ALL' ? ['A','B','C'] : [state.exam]; }

function poolCount() {
  let n = 0;
  for (const ex of exams()) {
    if (state.qtype === 'mc' || state.qtype === 'both') n += QUIZ_DATA.mc[ex].length;
    if (state.qtype === 'pb' || state.qtype === 'both') n += QUIZ_DATA.pb[ex].length;
  }
  return n;
}

function buildQueue(fromItems) {
  let items = fromItems;
  if (!items) {
    items = [];
    for (const ex of exams()) {
      if (state.qtype === 'mc' || state.qtype === 'both') {
        for (const q of QUIZ_DATA.mc[ex]) items.push({type:'mc', exam: ex, id: q.id, domain: domainFromObjective(q.objective), data: q});
      }
      if (state.qtype === 'pb' || state.qtype === 'both') {
        for (const q of QUIZ_DATA.pb[ex]) items.push({type:'pb', exam: ex, id: q.id, domain: domainFromObjective(q.objective), data: q});
      }
    }
  }
  if (state.shuffle) items = shuffleArr(items);
  return items;
}

function findQuestion(type, exam, id) {
  const arr = type === 'mc' ? QUIZ_DATA.mc[exam] : QUIZ_DATA.pb[exam];
  return arr.find(q => q.id === id);
}

// ===== Home screen actions =====
function setExam(v) { state.exam = v; render(); }
function setQtype(v) { state.qtype = v; render(); }
function toggleShuffle() { state.shuffle = !state.shuffle; render(); }
function toggleTimedMode() { state.timedMode = !state.timedMode; render(); }

// ===== Timer (session-only, resets every quiz — never persisted) =====
function formatMMSS(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function startTimer() {
  stopTimer();
  state.timeRemaining = EXAM_TIME_LIMIT_SECONDS; // always the exam's real 90-minute limit, regardless of question count
  state.timerEnd = Date.now() + state.timeRemaining * 1000;
  state.timerHandle = setInterval(tickTimer, 1000);
}

// The clock runs off a deadline, not a tick count, so it stays right if the tab is
// throttled or the phone is locked for a while.
function stopTimer() {
  if (state.timerHandle) {
    clearInterval(state.timerHandle);
    state.timerHandle = null;
    if (state.timerEnd) state.timeRemaining = Math.max(0, Math.ceil((state.timerEnd - Date.now()) / 1000));
  }
  state.timerEnd = 0;
}

function tickTimer() {
  if (state.timerEnd) state.timeRemaining = Math.max(0, Math.ceil((state.timerEnd - Date.now()) / 1000));
  const el = document.getElementById('quiz-timer');
  if (el) {
    el.textContent = formatMMSS(state.timeRemaining);
    el.classList.remove('warn', 'urgent');
    if (state.timeRemaining <= 60) el.classList.add('urgent');
    else if (state.timeRemaining <= 300) el.classList.add('warn');
  }
  if (state.timeRemaining <= 0) {
    handleTimeout();
  }
}

function handleTimeout() {
  stopTimer();
  for (let i = state.results.length; i < state.queue.length; i++) {
    const q = state.queue[i];
    state.results.push({exam: q.exam, id: q.id, type: q.type, domain: q.domain, isCorrect: false, unanswered: true});
  }
  state.screen = 'results';
  state.sessionActive = false;
  render();
  scrollTop();
}

// ===== Auto-advance (skip straight to the next question on a correct answer) =====
function toggleAutoAdvance() { state.autoAdvance = !state.autoAdvance; render(); }

function clearAutoAdvance() {
  if (state.autoAdvanceHandle) {
    clearTimeout(state.autoAdvanceHandle);
    state.autoAdvanceHandle = null;
  }
}

function scheduleAutoAdvance() {
  clearAutoAdvance();
  state.autoAdvanceHandle = setTimeout(() => {
    state.autoAdvanceHandle = null;
    nextQuestion();
  }, 600);
}

function startQuiz() {
  state.queue = buildQueue();
  state.idx = 0;
  state.score = 0;
  state.results = [];
  state.screen = 'quiz';
  state.sessionActive = true;
  state.browseReturn = null;
  resetQuestionState();
  if (state.timedMode) startTimer();
  render();
  scrollTop();
}

// ===== Resume: leave a quiz (Exit / View All Questions) and come back to the same spot =====
// Everything about the current question (selection, checked state, order, dropdowns)
// already lives in `state`, so resuming only has to restart the clock where it stopped.
function resumeTimer() {
  stopTimer();
  if (state.timedMode && state.timeRemaining > 0) {
    state.timerEnd = Date.now() + state.timeRemaining * 1000;
    state.timerHandle = setInterval(tickTimer, 1000);
  }
}

function canResume() {
  return state.sessionActive && state.queue.length > 0 && state.idx < state.queue.length;
}

function resumeQuiz() {
  if (!canResume()) { goHome(); return; }
  clearGameTimers();
  state.browseReturn = null;
  state.screen = 'quiz';
  resumeTimer();
  render();
  scrollTop();
}

function discardSession() {
  clearAutoAdvance();
  stopTimer();
  state.sessionActive = false;
  state.browseReturn = null;
  render();
}

function resetQuestionState() {
  const cur = state.queue[state.idx];
  clearAutoAdvance();
  state.sel = [];
  state.checked = false;
  state.selfGrade = null;
  state.expandedChoices = [];
  if (!cur) return;
  if (cur.type === 'mc') {
    cur._choices = shuffleArr(cur.data.choices);
  } else if (cur.type === 'pb') {
    const d = cur.data;
    if (d.type === 'order') state.order = shuffleArr(d.items);
    else if (d.type === 'match') state.matchSel = d.prompts.map(() => '');
    else if (d.type === 'grid') state.gridSel = d.rows.map(() => []);
    else if (d.type === 'command') state.cmdVals = d.subtasks.map(() => '');
    else if (d.type === 'imagematch') state.imgSel = d.rows.map(() => d.columns.map(() => ''));
  }
}

function currentQuestion() { return state.queue[state.idx]; }

// ===== MC =====
function toggleChoice(letter) {
  if (state.checked) return;
  const cur = currentQuestion();
  if (cur.data.multi) {
    const i = state.sel.indexOf(letter);
    if (i >= 0) state.sel.splice(i, 1); else state.sel.push(letter);
  } else {
    state.sel = [letter];
  }
  render();
}

function checkMC() {
  const cur = currentQuestion();
  if (state.sel.length === 0) return;
  const correct = cur.data.correct.slice().sort().join(',') === state.sel.slice().sort().join(',');
  state.checked = true;
  // auto-open the correct choice(s) and whatever the user actually picked,
  // right or wrong - everything else stays collapsed but is still tappable
  state.expandedChoices = cur.data.correct.slice();
  state.sel.forEach(letter => {
    if (!state.expandedChoices.includes(letter)) state.expandedChoices.push(letter);
  });
  recordResult(correct);
  render();
  scrollTop();
  if (correct && state.autoAdvance) scheduleAutoAdvance();
}

function toggleChoiceExplain(letter) {
  if (!state.checked) return;
  clearAutoAdvance();
  const i = state.expandedChoices.indexOf(letter);
  if (i >= 0) state.expandedChoices.splice(i, 1); else state.expandedChoices.push(letter);
  render();
}

// ===== PB order =====
function moveItem(i, dir) {
  if (state.checked) return;
  const j = i + dir;
  if (j < 0 || j >= state.order.length) return;
  const tmp = state.order[i]; state.order[i] = state.order[j]; state.order[j] = tmp;
  render();
}

function checkOrder() {
  const cur = currentQuestion();
  const correct = JSON.stringify(state.order) === JSON.stringify(cur.data.correct);
  state.checked = true;
  recordResult(correct);
  render();
  scrollTop();
  if (correct && state.autoAdvance) scheduleAutoAdvance();
}

// ===== PB match =====
function setMatch(i, val) {
  state.matchSel[i] = val;
  render();
}

function checkMatch() {
  const cur = currentQuestion();
  const correct = cur.data.prompts.every((p, i) => state.matchSel[i] === p.correct);
  state.checked = true;
  recordResult(correct);
  render();
  scrollTop();
  if (correct && state.autoAdvance) scheduleAutoAdvance();
}

// ===== PB grid =====
function toggleGrid(r, col) {
  if (state.checked) return;
  const row = state.gridSel[r];
  const i = row.indexOf(col);
  if (i >= 0) row.splice(i, 1); else row.push(col);
  render();
}

function checkGrid() {
  const cur = currentQuestion();
  const correct = cur.data.rows.every((row, i) => row.correct.slice().sort().join(',') === state.gridSel[i].slice().sort().join(','));
  state.checked = true;
  recordResult(correct);
  render();
  scrollTop();
  if (correct && state.autoAdvance) scheduleAutoAdvance();
}

// ===== PB command =====
function setCmdVal(i, val) {
  state.cmdVals[i] = val;
  const b = document.getElementById('cmd-check');
  if (b) b.disabled = !cmdComplete();
}
function revealCommand() { state.checked = true; render(); scrollTop(); }

// Port-number fill-ins are graded automatically: "20, 21", "21 20" and "tcp 20/21" all count as 20 and 21.
function portKey(s) {
  const nums = String(s).match(/\d+/g) || [];
  return nums.map(n => parseInt(n, 10)).sort((a, b) => a - b).join(',');
}
function cmdRowRight(st, i) { return portKey(state.cmdVals[i]) === portKey(st.answer); }
function cmdComplete() { return state.cmdVals.every(v => String(v).trim() !== ''); }
function checkCommand() {
  const cur = currentQuestion();
  if (!cmdComplete()) return;
  const ok = cur.data.subtasks.every((st, i) => cmdRowRight(st, i));
  state.checked = true;
  recordResult(ok);
  render();
  scrollTop();
  if (ok && state.autoAdvance) scheduleAutoAdvance();
}
function gradeSelf(correct) { state.selfGrade = correct; recordResult(correct); render(); if (correct && state.autoAdvance) scheduleAutoAdvance(); }

function recordResult(correct) {
  const cur = currentQuestion();
  if (correct) state.score++;
  state.results.push({exam: cur.exam, id: cur.id, type: cur.type, domain: cur.domain, isCorrect: correct});
}

function nextQuestion() {
  clearAutoAdvance();
  if (state.idx < state.queue.length - 1) {
    state.idx++;
    resetQuestionState();
    render();
  } else {
    stopTimer();
    state.screen = 'results';
    state.sessionActive = false;
    render();
  }
  scrollTop();
}

// Leaving a quiz never throws it away: the session stays resumable from Home.
function goHome() { clearAutoAdvance(); stopTimer(); clearGameTimers(); state.browseReturn = null; state.screen = 'home'; render(); scrollTop(); }

function retakeMissed() {
  const missedKeys = new Set(state.results.filter(r => !r.isCorrect).map(r => r.type + r.exam + r.id));
  const items = state.queue.filter(q => missedKeys.has(q.type + q.exam + q.id));
  state.queue = buildQueue(items);
  state.idx = 0; state.score = 0; state.results = [];
  state.screen = 'quiz';
  state.sessionActive = true;
  state.browseReturn = null;
  resetQuestionState();
  if (state.timedMode) startTimer();
  render();
  scrollTop();
}

function retakeSame() {
  const items = state.queue.map(q => q);
  state.queue = buildQueue(items);
  state.idx = 0; state.score = 0; state.results = [];
  state.screen = 'quiz';
  state.sessionActive = true;
  state.browseReturn = null;
  resetQuestionState();
  if (state.timedMode) startTimer();
  render();
  scrollTop();
}

function scrollTop() {
  const el = document.getElementById('app');
  if (el) el.scrollIntoView({block:'start'});
  window.scrollTo(0,0);
}

// ============================================================
// Rendering
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (state.screen === 'browse') app.innerHTML = renderBrowse();
  else if (state.screen === 'game') app.innerHTML = renderGame();
  else if (state.screen === 'game-over') app.innerHTML = renderGameOver();
  else if (state.screen === 'lab') app.innerHTML = renderLab();
  else if (state.screen === 'lab-board') renderLabBoardInto(app);
  else if (state.screen === 'lab-quiz') app.innerHTML = renderLabQuiz();
  else if (state.screen === 'lab-quiz-over') app.innerHTML = renderLabQuizOver();
  else app.innerHTML = renderResults();
}

function renderHome() {
  const domainRows = [1,2,3,4,5].map(d => `
    <div class="domain-row">
      <span class="domain-label">${d}.0 ${DOMAIN_NAMES[d]}</span>
      <div class="meter"><div class="meter-fill domain-${d}" style="width:${DOMAIN_WEIGHT[d]}%"></div></div>
      <span class="domain-pct">${DOMAIN_WEIGHT[d]}%</span>
    </div>`).join('');

  const examBtns = ['A','B','C','H','ALL'].map(v => `<button class="opt-btn ${state.exam===v?'active':''}" onclick="setExam('${v}')">${v==='ALL'?'All 3':(v==='H'?'Hard Mode':'Exam '+v)}</button>`).join('');
  const qtypeBtns = [['mc','Multiple Choice'],['pb','Performance-Based'],['both','Both']].map(([v,l]) => `<button class="opt-btn ${state.qtype===v?'active':''}" onclick="setQtype('${v}')">${l}</button>`).join('');

  const resumeCur = canResume() ? state.queue[state.idx] : null;
  const resumePanel = resumeCur ? `
    <div class="panel resume-panel">
      <div class="panel-title">QUIZ IN PROGRESS</div>
      <p class="game-desc">${esc(examLabel(resumeCur.exam))} &middot; question ${state.idx + 1} of ${state.queue.length} &middot; ${state.score}/${state.results.length} correct so far${state.timedMode ? ' &middot; ' + formatMMSS(state.timeRemaining) + ' left' : ''}</p>
      <button class="start-btn resume-btn" onclick="resumeQuiz()">Resume where you left off &rarr;</button>
      <button class="browse-link" onclick="discardSession()">Discard this quiz</button>
    </div>` : '';
  const lab = (typeof QUIZ_DATA !== 'undefined' && QUIZ_DATA.lab) ? QUIZ_DATA.lab : {boards: [], quizzes: []};
  const countOf = (obj) => ['A','B','C'].reduce((n, k) => n + ((obj && obj[k]) ? obj[k].length : 0), 0);
  const bookMc = countOf(QUIZ_DATA.mc), bookPb = countOf(QUIZ_DATA.pb);

  return `
  <div class="screen home">
    <div class="hero">
      <div class="eyebrow">COMPTIA A+ &middot; 220-1201</div>
      <h1>Core 1 Drill</h1>
      <p class="sub">${bookMc} multiple-choice + ${bookPb} performance-based questions, pulled straight from Professor Messer's practice exams A, B and C. Hard Mode and the Study Lab are extras.</p>
    </div>
    ${resumePanel}

    <div class="panel">
      <div class="panel-title">DOMAIN LOAD</div>
      ${domainRows}
    </div>

    <div class="panel">
      <div class="panel-title">EXAM</div>
      <div class="btn-group">${examBtns}</div>
    </div>

    <div class="panel">
      <div class="panel-title">QUESTION TYPE</div>
      <div class="btn-group">${qtypeBtns}</div>
    </div>

    <label class="shuffle-row">
      <input type="checkbox" ${state.shuffle?'checked':''} onchange="toggleShuffle()">
      <span>Shuffle question order</span>
    </label>


    <label class="shuffle-row">
      <input type="checkbox" ${state.timedMode?'checked':''} onchange="toggleTimedMode()">
      <span>Timed mode &mdash; 90 min (real exam time limit, no matter how many questions)</span>
    </label>

    <label class="shuffle-row">
      <input type="checkbox" ${state.autoAdvance?'checked':''} onchange="toggleAutoAdvance()">
      <span>Auto-advance on correct &mdash; skips straight to the next question, no tapping Next</span>
    </label>

    <button class="start-btn" onclick="startQuiz()">Start &middot; ${poolCount()} question${poolCount()===1?'':'s'} &rarr;</button>

    <button class="browse-link" onclick="goBrowse()">Browse all questions &amp; answers &rarr;</button>

    <div class="panel lab-panel">
      <div class="panel-title">STUDY LAB</div>
      <p class="game-desc">Tap-to-sort boards for RAID, every port number, connectors, cables, printers, cloud and troubleshooting, plus connector-photo and port quizzes. ${lab.boards.length} boards &middot; ${lab.quizzes.length} quizzes. Nothing is saved.</p>
      <button class="start-btn lab-start-btn" onclick="openLab()">Open the Study Lab &rarr;</button>
    </div>

    <div class="panel game-panel">
      <div class="panel-title">STUDY GAME</div>
      <p class="game-desc">Survival mode &mdash; ${(QUIZ_DATA.mc.H||[]).length} Hard Mode questions, ${GAME_STARTING_LIVES} lives, ${GAME_QUESTION_SECONDS}s per question. Miss too many and it's game over.</p>
      <button class="start-btn game-start-btn" onclick="startGame()">\u{1F3AE} Play Study Game</button>
    </div>
  </div>`;
}

function renderQuiz() {
  const cur = currentQuestion();
  if (!cur) return renderResults();
  const pct = Math.round(((state.idx) / state.queue.length) * 100);
  const timerCls = state.timeRemaining <= 60 ? 'urgent' : (state.timeRemaining <= 300 ? 'warn' : '');
  const header = `
    <div class="quiz-nav">
      <button class="nav-btn" onclick="goHome()">&larr; Home</button>
      <button class="nav-btn" onclick="goBrowse()">View All Questions</button>
    </div>
    <div class="quiz-header">
      <div class="quiz-tag">${examLabel(cur.exam)} &middot; ${cur.id}${sourceBadge(cur.data)}${cur.data.tier ? ` <span class="tier-badge tier-${cur.data.tier}">${cur.data.tier}</span>` : ''}</div>
      <div class="quiz-progress">Q ${state.idx+1} / ${state.queue.length}</div>
      ${state.timedMode ? `<div class="quiz-timer ${timerCls}" id="quiz-timer">${formatMMSS(state.timeRemaining)}</div>` : ''}
      <div class="quiz-score">${state.score}/${state.results.length} correct</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
  let body;
  if (cur.type === 'mc') body = renderMC(cur);
  else if (cur.data.type === 'order') body = renderOrder(cur);
  else if (cur.data.type === 'match') body = renderMatch(cur);
  else if (cur.data.type === 'grid') body = renderGrid(cur);
  else if (cur.data.type === 'imagematch') body = renderImageMatch(cur);
  else body = renderCommand(cur);
  return `<div class="screen quiz">${header}${body}</div>`;
}

function domainTag(domain) {
  if (!domain) return '';
  return `<span class="tag domain-tag domain-${domain}">${domain}.0 ${DOMAIN_NAMES[domain]}</span>`;
}

function nextBtnHtml() {
  const isLast = state.idx === state.queue.length - 1;
  return `<button class="next-btn" onclick="nextQuestion()">${isLast ? 'See Results \u2192' : 'Next Question \u2192'}</button>`;
}

function renderMC(cur) {
  const q = cur.data;
  const choices = cur._choices || q.choices;
  const checked = state.checked;
  const lastCorrect = checked ? state.results[state.results.length-1].isCorrect : null;

  const choiceHtml = choices.map(c => {
    let cls = '';
    if (!checked) {
      cls = state.sel.includes(c.letter) ? 'selected' : '';
    } else {
      if (q.correct.includes(c.letter)) cls = 'good';
      else if (state.sel.includes(c.letter)) cls = 'bad';
      else cls = 'muted';
    }
    const expanded = checked && state.expandedChoices.includes(c.letter);
    const handler = checked ? `toggleChoiceExplain('${c.letter}')` : `toggleChoice('${c.letter}')`;
    return `<button class="choice ${cls}" onclick="${handler}">
      <span class="choice-letter">${c.letter}</span><span class="choice-text">${esc(c.text)}</span>
      ${checked && q.correct.includes(c.letter) ? '<span class="choice-icon">\u2713</span>' : ''}
      ${checked && cls==='bad' ? '<span class="choice-icon">\u2717</span>' : ''}
      ${checked ? `<span class="choice-caret">${expanded?'\u25B4':'\u25BE'}</span>` : ''}
    </button>${expanded ? `<div class="choice-explain ${cls}">${esc(c.explanation)}</div>` : ''}`;
  }).join('');

  const actions = !checked
    ? `<button class="check-btn" ${state.sel.length===0?'disabled':''} onclick="checkMC()">Check Answer</button>`
    : `<div class="feedback ${lastCorrect?'good':'bad'}">
         <div class="feedback-title">${lastCorrect?'\u2713 Correct':'\u2717 Not quite'}</div>
         <div class="tags">${domainTag(cur.domain)}${q.objective?`<span class="tag obj-tag">${esc(q.objective)}</span>`:''}</div>
       </div>
       ${nextBtnHtml()}`;

  return `<div class="card">
    <div class="stem">${esc(q.stem)}</div>
    ${q.multi ? '<div class="hint">Select TWO</div>' : ''}
    <div class="choices">${choiceHtml}</div>
    ${checked ? '<div class="hint" style="margin-top:2px">Tap any choice to see why it\u2019s right or wrong</div>' : ''}
    ${actions}
  </div>`;
}

function renderOrder(cur) {
  const q = cur.data;
  const checked = state.checked;
  const lastCorrect = checked ? state.results[state.results.length-1].isCorrect : null;
  const items = checked ? q.correct.map((text,i) => ({text, wasRight: state.order[i]===text})) : null;

  const listHtml = !checked
    ? state.order.map((item,i) => `
        <li>
          <div class="order-item-head">
            <span class="order-num">${i+1}</span><span class="order-text">${esc(item)}</span>
            <span class="order-controls">
              <button ${i===0?'disabled':''} onclick="moveItem(${i},-1)">\u25B2</button>
              <button ${i===state.order.length-1?'disabled':''} onclick="moveItem(${i},1)">\u25BC</button>
            </span>
          </div>
        </li>`).join('')
    : items.map((it,i) => `<li class="${it.wasRight?'good':'bad'}">
          <div class="order-item-head"><span class="order-num">${i+1}</span><span class="order-text">${esc(it.text)}</span></div>
          ${q.stepExplanations && q.stepExplanations[i] ? `<div class="order-step-explain">${esc(q.stepExplanations[i])}</div>` : ''}
        </li>`).join('');

  const yourOrderHtml = checked ? `<div class="hint" style="margin-top:14px">Your order was: ${state.order.map(esc).join(' \u2192 ')}</div>` : '';

  const actions = !checked
    ? `<button class="check-btn" onclick="checkOrder()">Check Order</button>`
    : `<div class="feedback ${lastCorrect?'good':'bad'}">
         <div class="feedback-title">${lastCorrect?'\u2713 Correct order':'\u2717 Correct order is shown above'}</div>
         <p>${esc(q.explanation)}</p>
         ${q.objective?`<div class="tags">${domainTag(cur.domain)}<span class="tag obj-tag">${esc(q.objective)}</span></div>`:''}
       </div>${yourOrderHtml}
       ${nextBtnHtml()}`;

  return `<div class="card pb-card">
    <div class="pb-type-tag">PERFORMANCE-BASED &middot; SEQUENCE</div>
    <div class="stem">${esc(q.prompt)}</div>
    <ol class="order-list">${listHtml}</ol>
    ${actions}
  </div>`;
}

function renderMatch(cur) {
  const q = cur.data;
  const checked = state.checked;
  const lastCorrect = checked ? state.results[state.results.length-1].isCorrect : null;

  const rows = q.prompts.map((p,i) => {
    const rowGood = state.matchSel[i] === p.correct;
    const cls = checked ? (rowGood ? 'good' : 'bad') : '';
    const options = [`<option value="">&mdash; choose &mdash;</option>`].concat(
      q.pool.map(opt => `<option value="${esc(opt)}" ${state.matchSel[i]===opt?'selected':''}>${esc(opt)}</option>`)
    ).join('');
    return `<div class="match-row ${cls}">
      <div class="match-text">${esc(p.text)}</div>
      <select ${checked?'disabled':''} onchange="setMatch(${i}, this.value)">${options}</select>
      ${checked ? `<div class="match-feedback">${rowGood?'':`Correct: <strong>${esc(p.correct)}</strong>. `}${esc(p.explanation)}</div>` : ''}
    </div>`;
  }).join('');

  const poolHint = `<div class="hint">Pool: ${q.pool.map(esc).join(', ')}${q.unused && q.unused.length ? ' &mdash; some will not be used' : ''}</div>`;

  const actions = !checked
    ? `<button class="check-btn" ${state.matchSel.some(v=>!v)?'disabled':''} onclick="checkMatch()">Check Matches</button>`
    : `<div class="feedback ${lastCorrect?'good':'bad'}">
         <div class="feedback-title">${lastCorrect?'\u2713 All matched correctly':'\u2717 Check the rows marked above'}</div>
         ${q.note?`<p>${esc(q.note)}</p>`:''}
         ${q.objective?`<div class="tags">${domainTag(cur.domain)}<span class="tag obj-tag">${esc(q.objective)}</span></div>`:''}
       </div>
       ${nextBtnHtml()}`;

  return `<div class="card pb-card">
    <div class="pb-type-tag">PERFORMANCE-BASED &middot; MATCHING</div>
    <div class="stem">${esc(q.prompt)}</div>
    ${poolHint}
    <div class="match-list">${rows}</div>
    ${actions}
  </div>`;
}

function renderGrid(cur) {
  const q = cur.data;
  const checked = state.checked;
  const lastCorrect = checked ? state.results[state.results.length-1].isCorrect : null;

  const colStyle = `style="--cols:${q.cols.length}"`;
  const header = `<div class="grid-header" ${colStyle}><span></span>${q.cols.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`;
  const rows = q.rows.map((row,i) => {
    const rowGood = row.correct.slice().sort().join(',') === state.gridSel[i].slice().sort().join(',');
    const cls = checked ? (rowGood?'good':'bad') : '';
    const cells = q.cols.map(c => `<label class="grid-cell"><input type="checkbox" ${checked?'disabled':''} ${state.gridSel[i].includes(c)?'checked':''} onchange="toggleGrid(${i},'${esc(c)}')"></label>`).join('');
    return `<div class="grid-row ${cls}" ${colStyle}><span class="grid-row-label">${esc(row.label)}</span>${cells}</div>` +
      (checked ? `<div class="grid-explain">${esc(row.explanation)}</div>` : '');
  }).join('');

  const actions = !checked
    ? `<button class="check-btn" onclick="checkGrid()">Check Answers</button>`
    : `<div class="feedback ${lastCorrect?'good':'bad'}">
         <div class="feedback-title">${lastCorrect?'\u2713 All rows correct':'\u2717 Check the rows marked above'}</div>
         ${q.objective?`<div class="tags">${domainTag(cur.domain)}<span class="tag obj-tag">${esc(q.objective)}</span></div>`:''}
       </div>
       ${nextBtnHtml()}`;

  return `<div class="card pb-card">
    <div class="pb-type-tag">PERFORMANCE-BASED &middot; SELECT ALL THAT APPLY</div>
    <div class="stem">${esc(q.prompt)}</div>
    <div class="grid-table">${header}${rows}</div>
    ${actions}
  </div>`;
}

// Question pictures: either a numbered gallery of individual photos (connector questions)
// or one or more figures (motherboard, RAID diagrams).
function questionPicturesHtml(q) {
  if (q.gallery && q.gallery.length) {
    return '<div class="gallery">' + q.gallery.map(g => {
      const src = imgSrc(g.key);
      return src ? `<figure class="gal-item"><span class="gal-label">${esc(g.label)}</span><img src="${src}" alt="Interface ${esc(g.label)}"></figure>` : '';
    }).join('') + '</div>';
  }
  return qImages(q, 'question').map(src => `<img class="pbq-img" src="${src}" alt="Question image">`).join('');
}

function setImgSel(r, col, val) {
  if (state.checked) return;
  state.imgSel[r][col] = val;
  render();
}

function imgMatchComplete() {
  return state.imgSel.every(row => row.every(v => v !== ''));
}

function checkImageMatch() {
  const cur = currentQuestion();
  if (!imgMatchComplete()) return;
  const correct = cur.data.rows.every((row, r) =>
    row.correct.every((ans, ci) => state.imgSel[r][ci] === ans));
  state.checked = true;
  recordResult(correct);
  render();
  scrollTop();
  if (correct && state.autoAdvance) scheduleAutoAdvance();
}

function renderImageMatch(cur) {
  const q = cur.data;
  const checked = state.checked;
  const lastCorrect = checked ? state.results[state.results.length-1].isCorrect : null;
  const qImgs = questionPicturesHtml(q);

  const rowsHtml = q.rows.map((row, r) => {
    const rowRight = row.correct.every((ans, ci) => state.imgSel[r][ci] === ans);
    const cls = checked ? (rowRight ? 'good' : 'bad') : '';
    const selects = q.columns.map((colName, ci) => {
      const opts = ['<option value="">&mdash; ' + esc(colName) + ' &mdash;</option>']
        .concat(q.pools[ci].map(o => `<option value="${esc(o)}" ${state.imgSel[r][ci]===o?'selected':''}>${esc(o)}</option>`))
        .join('');
      return `<select ${checked?'disabled':''} onchange="setImgSel(${r},${ci},this.value)">${opts}</select>`;
    }).join('');
    const fb = checked && !rowRight
      ? `<div class="match-feedback">Correct: <strong>${row.correct.map(esc).join(' + ')}</strong>. ${esc(row.explanation)}</div>`
      : (checked ? `<div class="match-feedback">${esc(row.explanation)}</div>` : '');
    return `<div class="match-row ${cls}">
      <div class="match-text">${esc(row.label)}</div>
      ${selects}
      ${fb}
    </div>`;
  }).join('');

  const actions = !checked
    ? `<button class="check-btn" ${imgMatchComplete()?'':'disabled'} onclick="checkImageMatch()">Check Answers</button>`
    : `<div class="feedback ${lastCorrect?'good':'bad'}">
         <div class="feedback-title">${lastCorrect?'\u2713 All correct':'\u2717 Check the rows marked above'}</div>
         ${q.objective?`<div class="tags">${domainTag(cur.domain)}<span class="tag obj-tag">${esc(q.objective)}</span></div>`:''}
       </div>
       ${nextBtnHtml()}`;

  return `<div class="card pb-card">
    <div class="pb-type-tag">PERFORMANCE-BASED &middot; IMAGE</div>
    <div class="stem">${esc(q.prompt)}</div>
    ${qImgs}
    <div class="match-list" style="margin-top:14px">${rowsHtml}</div>
    ${actions}
  </div>`;
}

function renderCommand(cur) {
  const q = cur.data;
  const checked = state.checked;
  const auto = q.autoCheck === 'ports';
  const lastCorrect = checked && auto ? state.results[state.results.length-1].isCorrect : null;

  const subtasks = q.subtasks.map((st,i) => {
    const right = checked && auto ? cmdRowRight(st, i) : null;
    const cls = right === null ? '' : (right ? 'good' : 'bad');
    return `
    <div class="subtask ${cls}">
      ${st.label ? `<div class="subtask-label">${esc(st.label)}</div>` : ''}
      ${st.prompt ? `<div class="subtask-prompt">${esc(st.prompt)}</div>` : ''}
      <div class="cmd-line">
        <span class="prompt-chevron">${auto ? '#' : 'C:\\&gt;'}</span>
        <input type="text" class="cmd-input" ${checked?'disabled':''} value="${esc(state.cmdVals[i])}" oninput="setCmdVal(${i}, this.value)" placeholder="${auto ? 'port number(s)' : 'type your answer'}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      </div>
      ${checked ? `<div class="cmd-answer">
          <div>${right === false ? '<span class="cmd-answer-label">Correct answer:</span> ' : '<span class="cmd-answer-label">Answer:</span> '}<code>${esc(st.answer)}</code></div>
          ${st.sample_output ? `<div class="cmd-output">${esc(st.sample_output)}</div>` : ''}
          <p>${esc(st.explanation)}</p>
        </div>` : ''}
    </div>`;
  }).join('');

  let actions;
  if (!checked) {
    actions = auto
      ? `<div class="hint">Two ports? Type both, like 20, 21.</div><button class="check-btn" id="cmd-check" ${cmdComplete()?'':'disabled'} onclick="checkCommand()">Check Answers</button>`
      : `<button class="check-btn" onclick="revealCommand()">Reveal Answer${q.subtasks.length>1?'s':''}</button>`;
  } else if (auto) {
    actions = `<div class="feedback ${lastCorrect?'good':'bad'}">
        <div class="feedback-title">${lastCorrect?'\u2713 All ports correct':'\u2717 Check the rows marked above'}</div>
        ${q.objective?`<div class="tags">${domainTag(cur.domain)}<span class="tag obj-tag">${esc(q.objective)}</span></div>`:''}
      </div>${nextBtnHtml()}`;
  } else if (state.selfGrade === null) {
    actions = `<div class="self-grade">
      <span>Did you get it right?</span>
      <button class="sg-btn good" onclick="gradeSelf(true)">\u2713 Yes</button>
      <button class="sg-btn bad" onclick="gradeSelf(false)">\u2717 No</button>
    </div>`;
  } else {
    actions = `<div class="feedback ${state.selfGrade?'good':'bad'}">
        ${q.objective?`<div class="tags">${domainTag(cur.domain)}<span class="tag obj-tag">${esc(q.objective)}</span></div>`:''}
      </div>${nextBtnHtml()}`;
  }

  return `<div class="card pb-card">
    <div class="pb-type-tag">PERFORMANCE-BASED &middot; ${auto ? 'FILL IN THE PORTS' : 'COMMAND LINE'}</div>
    <div class="stem">${esc(q.prompt)}</div>
    ${subtasks}
    ${actions}
  </div>`;
}

// ===== Results =====
function pbSummary(q) {
  if (q.type === 'command') return q.subtasks.map(s => s.answer).join('; ');
  if (q.type === 'order') return 'Correct sequence: ' + q.correct.join(' \u2192 ');
  if (q.type === 'match') return q.prompts.map(p => `${p.text.slice(0,28)}${p.text.length>28?'\u2026':''} \u2192 ${p.correct}`).join('; ');
  if (q.type === 'grid') return q.rows.map(r => `${r.label} \u2192 ${r.correct.join(', ')}`).join('; ');
  if (q.type === 'imagematch') return q.rows.map(r => `${r.label} \u2192 ${r.correct.join(' + ')}`).join('; ');
  return '';
}

function renderResults() {
  const total = state.results.length;
  const pct = total ? Math.round((state.score/total)*100) : 0;
  const missedCount = state.results.filter(r=>!r.isCorrect).length;

  const domainStats = {1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0},5:{c:0,t:0}};
  state.results.forEach(r => {
    if (!r.domain) return;
    domainStats[r.domain].t++;
    if (r.isCorrect) domainStats[r.domain].c++;
  });
  const domainRows = [1,2,3,4,5].map(d => {
    const s = domainStats[d];
    const pctD = s.t ? Math.round((s.c/s.t)*100) : null;
    return `<div class="domain-row">
      <span class="domain-label">${d}.0 ${DOMAIN_NAMES[d]}</span>
      <div class="meter"><div class="meter-fill domain-${d}" style="width:${pctD===null?0:pctD}%"></div></div>
      <span class="domain-pct">${pctD===null?'\u2013':pctD+'%'} ${s.t?`(${s.c}/${s.t})`:''}</span>
    </div>`;
  }).join('');

  const reviewCards = state.results.map((r,i) => {
    const q = findQuestion(r.type, r.exam, r.id);
    const title = `${examLabel(r.exam)} &middot; ${r.id}${r.unanswered ? ' &mdash; not reached' : ''}`;
    let detail;
    if (r.type === 'mc') {
      const correctChoices = q.choices.filter(c=>q.correct.includes(c.letter));
      const correctText = correctChoices.map(c=>`${c.letter}. ${esc(c.text)}`).join('; ');
      detail = `<div class="review-stem">${esc(q.stem)}</div><div class="review-answer">Correct: ${correctText}</div><div class="review-rationale">${esc(correctChoices[0] ? correctChoices[0].explanation : '')}</div>`;
    } else {
      detail = `<div class="review-stem">${esc(q.prompt)}</div><div class="review-answer">${esc(pbSummary(q))}</div>`;
    }
    const icon = r.unanswered ? '\u2013' : (r.isCorrect ? '\u2713' : '\u2717');
    return `<details class="review-card ${r.unanswered ? 'unanswered' : (r.isCorrect?'good':'bad')}">
      <summary><span class="review-icon">${icon}</span><span class="review-title">${title}</span></summary>
      ${detail}
    </details>`;
  }).join('');

  return `<div class="screen results">
    <div class="score-hero">
      <div class="score-num">${state.score}<span class="score-of">/${total}</span></div>
      <div class="score-pct">${pct}%</div>
    </div>

    <div class="panel">
      <div class="panel-title">SCORE BY DOMAIN</div>
      ${domainRows}
    </div>

    <div class="result-actions">
      ${missedCount ? `<button class="opt-btn" onclick="retakeMissed()">Retake ${missedCount} missed</button>` : ''}
      <button class="opt-btn" onclick="retakeSame()">Retake this set</button>
      <button class="opt-btn" onclick="goHome()">New session</button>
    </div>

    <div class="panel">
      <div class="panel-title">REVIEW</div>
      <div class="review-list">${reviewCards}</div>
    </div>
  </div>`;
}

// ===== Study Game (Survival Mode) =====
function startGame() {
  clearGameTimers();
  state.gameQueue = shuffleArr(QUIZ_DATA.mc.H || []);
  state.gameIdx = 0;
  state.gameLives = GAME_STARTING_LIVES;
  state.gameStreak = 0;
  state.gameBestStreak = 0;
  state.gameCorrect = 0;
  state.gameAttempted = 0;
  state.gameMissed = [];
  state.screen = 'game';
  gameResetQuestion();
  render();
  scrollTop();
}

function gameResetQuestion() {
  clearGameTimers();
  state.gameSel = [];
  state.gameChecked = false;
  state.gameLastCorrect = null;
  const cur = state.gameQueue[state.gameIdx];
  if (cur) {
    cur._choices = shuffleArr(cur.choices);
    startGameTimer();
  }
}

function startGameTimer() {
  stopGameTimer();
  state.gameTimeRemaining = GAME_QUESTION_SECONDS;
  state.gameTimerHandle = setInterval(gameTick, 1000);
}

function stopGameTimer() {
  if (state.gameTimerHandle) {
    clearInterval(state.gameTimerHandle);
    state.gameTimerHandle = null;
  }
}

function clearGameAdvance() {
  if (state.gameAdvanceHandle) {
    clearTimeout(state.gameAdvanceHandle);
    state.gameAdvanceHandle = null;
  }
}

function clearGameTimers() {
  stopGameTimer();
  clearGameAdvance();
  clearLabTimers();   // Study Lab stopwatch + quiz auto-next, so nothing keeps ticking after you leave
}

function gameTick() {
  state.gameTimeRemaining--;
  const el = document.getElementById('game-timer');
  if (el) {
    el.textContent = state.gameTimeRemaining + 's';
    el.classList.remove('urgent');
    if (state.gameTimeRemaining <= 8) el.classList.add('urgent');
  }
  if (state.gameTimeRemaining <= 0) {
    gameTimeUp();
  }
}

function gameTimeUp() {
  if (state.gameChecked) return;
  gameResolve(true);
}

function toggleGameChoice(letter) {
  if (state.gameChecked) return;
  const cur = state.gameQueue[state.gameIdx];
  const needed = cur.correct.length;
  if (needed > 1) {
    const i = state.gameSel.indexOf(letter);
    if (i >= 0) { state.gameSel.splice(i, 1); render(); return; }
    state.gameSel.push(letter);
  } else {
    state.gameSel = [letter];
  }
  render();
  if (state.gameSel.length === needed) {
    gameResolve(false);
  }
}

function gameResolve(timedOut) {
  if (state.gameChecked) return;
  stopGameTimer();
  const cur = state.gameQueue[state.gameIdx];
  const correct = timedOut ? false : (cur.correct.slice().sort().join(',') === state.gameSel.slice().sort().join(','));
  state.gameChecked = true;
  state.gameLastCorrect = correct;
  state.gameAttempted++;
  if (correct) {
    state.gameCorrect++;
    state.gameStreak++;
    if (state.gameStreak > state.gameBestStreak) state.gameBestStreak = state.gameStreak;
  } else {
    state.gameStreak = 0;
    state.gameLives--;
    state.gameMissed.push({id: cur.id, stem: cur.stem});
  }
  render();
  scheduleGameAdvance();
}

function scheduleGameAdvance() {
  clearGameAdvance();
  state.gameAdvanceHandle = setTimeout(() => {
    state.gameAdvanceHandle = null;
    gameAdvance();
  }, GAME_ADVANCE_DELAY_MS);
}

function gameAdvance() {
  clearGameTimers();
  if (state.gameLives <= 0 || state.gameIdx >= state.gameQueue.length - 1) {
    state.screen = 'game-over';
    render();
    scrollTop();
    return;
  }
  state.gameIdx++;
  gameResetQuestion();
  render();
}

function exitGame() {
  clearGameTimers();
  state.screen = 'home';
  render();
  scrollTop();
}

function playGameAgain() {
  startGame();
}

function renderGame() {
  const cur = state.gameQueue[state.gameIdx];
  if (!cur) return renderGameOver();
  const choices = cur._choices || cur.choices;
  const checked = state.gameChecked;
  const timerCls = state.gameTimeRemaining <= 8 ? 'urgent' : '';
  const hearts = Array.from({length: GAME_STARTING_LIVES}, (_, i) =>
    `<span class="heart ${i < state.gameLives ? 'alive' : 'lost'}">\u2665</span>`).join('');

  const choiceHtml = choices.map(c => {
    let cls = '';
    if (!checked) {
      cls = state.gameSel.includes(c.letter) ? 'selected' : '';
    } else {
      if (cur.correct.includes(c.letter)) cls = 'good';
      else if (state.gameSel.includes(c.letter)) cls = 'bad';
      else cls = 'muted';
    }
    return `<button class="choice ${cls}" ${checked?'disabled':''} onclick="toggleGameChoice('${c.letter}')">
      <span class="choice-letter">${c.letter}</span><span class="choice-text">${esc(c.text)}</span>
      ${checked && cur.correct.includes(c.letter) ? '<span class="choice-icon">\u2713</span>' : ''}
      ${checked && cls==='bad' ? '<span class="choice-icon">\u2717</span>' : ''}
    </button>`;
  }).join('');

  return `<div class="screen game">
    <div class="game-hud">
      <div class="game-hud-row">
        <span class="hearts">${hearts}</span>
        <span class="game-timer ${timerCls}" id="game-timer">${state.gameTimeRemaining}s</span>
      </div>
      <div class="game-hud-row">
        <span class="streak">\u{1F525} Streak: ${state.gameStreak} <span class="best-streak">(best ${state.gameBestStreak})</span></span>
        <span class="game-score">${state.gameCorrect}/${state.gameAttempted}</span>
      </div>
    </div>
    <div class="card">
      ${cur.multi ? '<div class="hint">Select TWO</div>' : ''}
      <div class="stem">${esc(cur.stem)}</div>
      <div class="choices">${choiceHtml}</div>
    </div>
    <button class="nav-btn game-quit" onclick="exitGame()">&larr; Quit Game</button>
  </div>`;
}

function renderGameOver() {
  const cleared = state.gameLives > 0;
  const missedHtml = state.gameMissed.length
    ? state.gameMissed.map(m => `<div class="game-missed-item"><span class="browse-id">${m.id}</span> ${esc(m.stem.slice(0,90))}${m.stem.length>90?'\u2026':''}</div>`).join('')
    : '<div class="hint">No misses \u2014 perfect run.</div>';

  return `<div class="screen game-over">
    <div class="score-hero">
      <div class="game-over-title">${cleared ? '\u{1F3C6} Cleared the pool!' : '\u{1F480} Game Over'}</div>
      <div class="score-num">${state.gameCorrect}<span class="score-of">/${state.gameAttempted}</span></div>
      <div class="score-pct">Best streak: ${state.gameBestStreak}</div>
    </div>
    <div class="result-actions">
      <button class="opt-btn" onclick="playGameAgain()">Play Again</button>
      <button class="opt-btn" onclick="goHome()">Back to Home</button>
    </div>
    <div class="panel">
      <div class="panel-title">MISSED (${state.gameMissed.length})</div>
      ${missedHtml}
    </div>
  </div>`;
}

// ===== Browse =====
// Opening Browse from a running quiz remembers where to come back to; the exam
// clock is paused while you look (resumeQuiz() restarts it from the time left).
function goBrowse() {
  const fromQuiz = state.screen === 'quiz' && canResume();
  clearAutoAdvance(); stopTimer(); clearGameTimers();
  state.browseReturn = fromQuiz ? 'quiz' : null;
  state.screen = 'browse';
  render(); scrollTop();
}
function setBrowseExam(v) { state.browseExam = v; render(); }
function setBrowseType(v) { state.browseType = v; render(); }

function setBrowseSearch(v) {

function matchesSearch(id, text) {
  const q = state.browseSearch.trim().toLowerCase();
  if (!q) return true;
  return id.toLowerCase().includes(q) || text.toLowerCase().includes(q);
}

function pbBrowseTypeLabel(t) {
  return {command:'COMMAND LINE', order:'SEQUENCE', match:'MATCHING', grid:'SELECT ALL THAT APPLY', imagematch:'IMAGE'}[t] || '';
}

function pbBrowseBody(q) {
  if (q.type === 'imagematch') {
    const qi = questionPicturesHtml(q);
    const rows = q.rows.map(r => `<div class="match-row good">
        <div class="match-text">${esc(r.label)}</div>
        <div class="match-answer-static">${r.correct.map(esc).join(' + ')}</div>
        <div class="match-feedback">${esc(r.explanation)}</div>
      </div>`).join('');
    return qi + `<div class="match-list" style="margin-top:12px">${rows}</div>`;
  }
  if (q.type === 'command') {
    return q.subtasks.map(st => `
      <div class="subtask">
        ${st.label ? `<div class="subtask-label">${esc(st.label)}</div>` : ''}
        ${st.prompt ? `<div class="subtask-prompt">${esc(st.prompt)}</div>` : ''}
        <div class="cmd-answer">
          <div><span class="cmd-answer-label">Answer:</span> <code>${esc(st.answer)}</code></div>
          ${st.sample_output ? `<div class="cmd-output">${esc(st.sample_output)}</div>` : ''}
          <p>${esc(st.explanation)}</p>
        </div>
      </div>`).join('');
  }
  if (q.type === 'order') {
    const list = q.correct.map((item,i) => `<li class="good">
        <div class="order-item-head"><span class="order-num">${i+1}</span><span class="order-text">${esc(item)}</span></div>
        ${q.stepExplanations && q.stepExplanations[i] ? `<div class="order-step-explain">${esc(q.stepExplanations[i])}</div>` : ''}
      </li>`).join('');
    return `<ol class="order-list">${list}</ol><div class="feedback good"><p>${esc(q.explanation)}</p></div>`;
  }
  if (q.type === 'match') {
    const poolHint = `<div class="hint">Pool: ${q.pool.map(esc).join(', ')}${q.unused && q.unused.length ? ' &mdash; some will not be used' : ''}</div>`;
    const rows = q.prompts.map(p => `<div class="match-row good">
        <div class="match-text">${esc(p.text)}</div>
        <div class="match-answer-static">${esc(p.correct)}</div>
        <div class="match-feedback">${esc(p.explanation)}</div>
      </div>`).join('');
    return poolHint + `<div class="match-list">${rows}</div>` + (q.note ? `<div class="feedback good"><p>${esc(q.note)}</p></div>` : '');
  }
  if (q.type === 'grid') {
    const colStyle = `style="--cols:${q.cols.length}"`;
    const header = `<div class="grid-header" ${colStyle}><span></span>${q.cols.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`;
    const rows = q.rows.map(row => {
      const cells = q.cols.map(c => `<span class="grid-cell-static">${row.correct.includes(c)?'\u2713':''}</span>`).join('');
      return `<div class="grid-row good" ${colStyle}><span class="grid-row-label">${esc(row.label)}</span>${cells}</div><div class="grid-explain">${esc(row.explanation)}</div>`;
    }).join('');
    return `<div class="grid-table">${header}${rows}</div>`;
  }
  return '';
}

function buildBrowseListHtml() {
  const exams = state.browseExam === 'ALL' ? ['A','B','C'] : [state.browseExam];
  // 'H' surfaces the Hard Mode pool, which is the only place the ADDED questions live
  let html = '';
  let total = 0;
  for (const ex of exams) {
    let examHtml = '';
    if (state.browseType === 'ALL' || state.browseType === 'pb') {
      for (const q of QUIZ_DATA.pb[ex]) {
        if (matchesSearch(q.id, q.prompt)) { examHtml += renderBrowseCardPB(q, ex); total++; }
      }
    }
    if (state.browseType === 'ALL' || state.browseType === 'mc') {
      for (const q of QUIZ_DATA.mc[ex]) {
        if (matchesSearch(q.id, q.stem)) { examHtml += renderBrowseCardMC(q, ex); total++; }
      }
    }
    if (examHtml) html += `<div class="browse-exam-header">${examLabel(ex)}</div>${examHtml}`;
  }
  if (total === 0) {
    return `<div class="hint" style="margin-top:14px">No questions match${state.browseSearch ? ` "${esc(state.browseSearch)}"` : ''}.</div>`;
  }
  return html;
}

  const typeBtns = [['ALL','All'],['mc','Multiple Choice'],['pb','Performance-Based']].map(([v,l]) => `<button class="opt-btn ${state.browseType===v?'active':''}" onclick="setBrowseType('${v}')">${l}</button>`).join('');
  return `<div class="screen browse">

    <input type="text" class="browse-search" placeholder="Jump to a question (e.g. B62) or search text&hellip;" value="${esc(state.browseSearch)}" oninput="setBrowseSearch(this.value)" autocomplete="off" autocapitalize="off" spellcheck="false">

// ============================================================
// Study Lab — tap-to-sort boards + quick quizzes
// Everything here is session-only. Nothing is stored anywhere:
// close the page and best times / scores are gone.
// ============================================================
const LAB_PALETTE = 8;

function labData() {
  return (typeof QUIZ_DATA !== 'undefined' && QUIZ_DATA.lab) ? QUIZ_DATA.lab : {groups: [], boards: [], quizzes: []};
}
function labBoard(id) { return labData().boards.find(b => b.id === id); }
function labQuizDef(id) { return labData().quizzes.find(q => q.id === id); }
function labCurBoard() { return labBoard(state.labBoardId); }
function labColDef(b, colId) { return b.columns.find(c => c.id === colId); }
function labTileDef(b, id) { return b.tiles.find(t => t.id === id); }
function labRealTiles(b) { return b.tiles.filter(t => t.col); }

function formatClock(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ---------- timers ----------
function clearLabClock() {
  if (state.labClockHandle) { clearInterval(state.labClockHandle); state.labClockHandle = null; }
}
function clearLq() {
  if (state.lqHandle) { clearTimeout(state.lqHandle); state.lqHandle = null; }
}
function clearLabTimers() { clearLabClock(); clearLq(); }

// The stopwatch measures real elapsed time (not ticks), so it stays right if the phone
// is locked or the tab is throttled while you work.
function startLabClock() {
  clearLabClock();
  state.labStartMs = Date.now();
  state.labElapsed = 0;
  state.labClockHandle = setInterval(labTick, 1000);
}
function labSyncElapsed() {
  if (state.labStartMs) state.labElapsed = Math.max(0, Math.floor((Date.now() - state.labStartMs) / 1000));
}
function labTick() {
  labSyncElapsed();
  const el = document.getElementById('lab-clock');
  if (el) el.textContent = formatClock(state.labElapsed);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (state.timerHandle) tickTimer();
  if (state.labClockHandle) labTick();
});

// ---------- navigation ----------
function openLab() {
  clearAutoAdvance(); stopTimer(); clearGameTimers();
  state.labRun = null;
  state.screen = 'lab';
  render(); scrollTop();
}
function labBack() {
  clearLabTimers();
  state.labRun = null;
  state.labSel = null; state.labDrag = null;
  state.screen = 'lab';
  render(); scrollTop();
}

// ---------- continuous mode: every lab in menu order, with Skip ----------
function labRunList() {
  const data = labData();
  const out = [];
  data.groups.forEach(g => {
    data.quizzes.filter(q => q.group === g.id).forEach(q => out.push({kind: 'quiz', id: q.id, title: q.title, group: g.title}));
    data.boards.filter(b => b.group === g.id).forEach(b => out.push({kind: 'board', id: b.id, title: b.title, group: g.title}));
  });
  return out;
}
function labRunOpen(i) {
  const r = state.labRun;
  if (!r || !r.list[i]) return;
  r.i = i;
  const it = r.list[i];
  if (it.kind === 'board') labStartBoard(it.id); else lqStart(it.id);
  scrollTop();
}
function labRunStart(from) {
  clearLabTimers();
  const list = labRunList();
  if (!list.length) return;
  const at = Math.max(0, Math.min(list.length - 1, parseInt(from, 10) || 0));
  state.labRun = {list: list, i: at};
  labRunOpen(at);
}
function labRunPrev() {
  const r = state.labRun;
  if (!r || r.i === 0) return;
  clearLabTimers();
  labRunOpen(r.i - 1);
}
function labRunJump(v) {
  if (!state.labRun) return;
  clearLabTimers();
  labRunOpen(Math.max(0, Math.min(state.labRun.list.length - 1, parseInt(v, 10) || 0)));
}
// A dropdown of every lab, grouped like the menu and numbered, so you can start (or jump) anywhere.
function labRunSelectHtml(selected, id, onchange, label) {
  const list = state.labRun ? state.labRun.list : labRunList();
  let html = '';
  let group = null;
  list.forEach((it, idx) => {
    if (it.group !== group) { if (group !== null) html += '</optgroup>'; html += '<optgroup label="' + esc(it.group) + '">'; group = it.group; }
    html += '<option value="' + idx + '"' + (idx === selected ? ' selected' : '') + '>' + (idx + 1) + '. ' + esc(it.title) + '</option>';
  });
  if (group !== null) html += '</optgroup>';
  return '<select class="lab-run-select" id="' + id + '" aria-label="' + label + '"' + (onchange ? ' onchange="' + onchange + '"' : '') + '>' + html + '</select>';
}
// Next lab (after finishing one) and Skip (before finishing) are the same move; after the last lab it returns to the menu.
function labRunNext() {
  const r = state.labRun;
  if (!r) return;
  clearLabTimers();
  if (r.i + 1 < r.list.length) labRunOpen(r.i + 1); else labBack();
}
function labRunBarHtml(done) {
  const r = state.labRun;
  if (!r) return '';
  const last = r.i === r.list.length - 1;
  const nxt = last ? null : r.list[r.i + 1];
  const label = done ? (last ? 'Finish' : 'Next lab &rarr;') : (last ? 'Skip &amp; finish' : 'Skip &rarr;');
  return `<div class="lab-run-bar" role="group" aria-label="Continuous mode">
    <span class="lab-run-pos">CONTINUOUS &middot; ${r.i + 1} of ${r.list.length}</span>
    <button class="opt-btn" onclick="labRunPrev()" ${r.i === 0 ? 'disabled' : ''}>&larr; Back</button>
    ${labRunSelectHtml(r.i, 'lab-run-jump', 'labRunJump(this.value)', 'Jump to a lab')}
    <span class="lab-run-next">${nxt ? 'Next: ' + esc(nxt.title) : 'This is the last one'}</span>
    <button class="opt-btn lab-run-go" onclick="labRunNext()">${label}</button>
    <button class="opt-btn" onclick="labBack()">Stop</button>
  </div>`;
}

// ---------- menu ----------
function labCardHtml(kind, item) {
  const isBoard = kind === 'board';
  const stats = isBoard ? state.labStats[item.id] : null;
  const bits = [];
  if (isBoard) bits.push(labRealTiles(item).length + ' tiles');
  else bits.push(item.items.length + ' questions');
  if (item.objective) bits.push(esc(item.objective.replace('220-1201, Objective ', 'Obj ').replace('220-1201 - Section ', 'Sec ')));
  if (stats && stats.best != null) bits.push('best ' + formatClock(stats.best) + (stats.bestFirst != null ? ' &middot; first try ' + stats.bestFirst : ''));
  const open = isBoard ? `labStartBoard('${item.id}')` : `lqStart('${item.id}')`;
  return `<button class="lab-card" onclick="${open}">
    <span class="lab-card-top"><span class="lab-card-title">${esc(item.title)}</span>
      <span class="src-badge src-orig" title="Written for this app, not from the book">ADDED</span>${item.extra ? ' <span class="src-badge src-extra" title="Beyond the core list: extra credit">EXTRA</span>' : ''}${item.photos ? ' <span class="src-badge src-book" title="Photos come from the Professor Messer book">BOOK PHOTOS</span>' : ''}</span>
    <span class="lab-card-sub">${esc(item.blurb || '')}</span>
    <span class="lab-card-meta">${bits.join(' &middot; ')}</span>
  </button>`;
}

function renderLab() {
  const data = labData();
  const groups = data.groups.map(g => {
    const boards = data.boards.filter(b => b.group === g.id).map(b => labCardHtml('board', b));
    const quizzes = data.quizzes.filter(q => q.group === g.id).map(q => labCardHtml('quiz', q));
    const cards = quizzes.concat(boards).join('');
    if (!cards) return '';
    return `<div class="lab-group-title">${esc(g.title)}</div>
      ${g.blurb ? `<div class="lab-group-blurb">${esc(g.blurb)}</div>` : ''}
      <div class="lab-card-list">${cards}</div>`;
  }).join('');
  return `<div class="screen lab">
    <div class="browse-topbar">
      <button class="back-btn" onclick="goHome()">&larr; Home</button>
      <span class="browse-title">Study Lab</span>
    </div>
    <div class="lab-run-start">
      <label class="lab-run-from">Start from ${labRunSelectHtml(0, 'lab-run-from', '', 'Start the continuous run from')}</label>
      <button class="start-btn lab-start-btn" onclick="labRunStart(document.getElementById('lab-run-from').value)">&#9654; Play every lab in order</button>
    </div>
    <div class="hint" style="margin-top:12px">Continuous mode goes through every lab below, top to bottom, with a Skip button for the ones you already know. Tap a tile, then tap the column or row where it belongs (on a computer you can also drag). Fill every slot, then Submit: right tiles lock in, wrong ones bounce back to the tray. The stopwatch runs from the moment a board opens. Nothing is saved &mdash; closing the page clears best times.</div>
    ${groups}
  </div>`;
}

// ============================================================
// Sort boards
// ============================================================
function labStartBoard(id) {
  const b = labBoard(id);
  if (!b) return;
  clearLabTimers();
  state.labBoardId = id;
  state.labCols = {};
  b.columns.forEach(c => { state.labCols[c.id] = []; });
  state.labTray = shuffleArr(b.tiles.map(t => t.id));
  state.labLocked = {}; state.labFlash = {}; state.labMissCount = {};
  state.labSel = null; state.labDrag = null;
  state.labElapsed = 0; state.labAttempts = 0; state.labFirstTry = null;
  state.labDone = false; state.labRevealed = false; state.labMsg = '';
  state.labTrayScroll = 0;
  // random colour per tile each play, so colour can never give the answer away
  const palette = shuffleArr(b.tiles.map((_, i) => i % LAB_PALETTE));
  state.labColors = {};
  b.tiles.forEach((t, i) => { state.labColors[t.id] = palette[i]; });
  state.labColOrder = b.shuffleCols ? shuffleArr(b.columns.map(c => c.id)) : b.columns.map(c => c.id);
  state.screen = 'lab-board';
  startLabClock();
  render(); scrollTop();
}

function labRestart() { labStartBoard(state.labBoardId); }

function labWhere(id) {
  for (const c in state.labCols) { if (state.labCols[c].indexOf(id) >= 0) return c; }
  return null; // in the tray
}
function labHasRoom(colId) {
  const b = labCurBoard();
  return state.labCols[colId].length < labColDef(b, colId).cap;
}
function labBoardActive() { return !state.labDone && !state.labRevealed; }

function labRemoveEverywhere(id) {
  const i = state.labTray.indexOf(id);
  if (i >= 0) state.labTray.splice(i, 1);
  for (const c in state.labCols) {
    const j = state.labCols[c].indexOf(id);
    if (j >= 0) state.labCols[c].splice(j, 1);
  }
}

// colId === null sends the tile back to the tray. Returns false if it could not move.
function labPlaceTile(id, colId) {
  if (!labBoardActive() || state.labLocked[id]) return false;
  const from = labWhere(id);
  if (colId === null) {
    if (from === null) return true;
    labRemoveEverywhere(id);
    state.labTray.push(id);
    return true;
  }
  if (from === colId) return true;
  if (!labHasRoom(colId)) return false;
  labRemoveEverywhere(id);
  state.labCols[colId].push(id);
  delete state.labFlash[id];
  return true;
}

// Exchange two unlocked tiles (used when the target column is full).
function labSwap(aId, bId) {
  if (!labBoardActive() || state.labLocked[aId] || state.labLocked[bId]) return false;
  const aWhere = labWhere(aId), bWhere = labWhere(bId);
  if (bWhere === null || aWhere === bWhere) return false;
  const bIdx = state.labCols[bWhere].indexOf(bId);
  if (aWhere === null) {
    const aIdx = state.labTray.indexOf(aId);
    state.labTray[aIdx] = bId;
  } else {
    const aIdx = state.labCols[aWhere].indexOf(aId);
    state.labCols[aWhere][aIdx] = bId;
  }
  state.labCols[bWhere][bIdx] = aId;
  delete state.labFlash[aId]; delete state.labFlash[bId];
  return true;
}

function labTileClick(id) {
  if (!labBoardActive() || state.labLocked[id]) return;
  state.labMsg = '';
  const sel = state.labSel;
  if (sel === null) { state.labSel = id; delete state.labFlash[id]; render(); return; }
  if (sel === id) { state.labSel = null; render(); return; }
  const where = labWhere(id);
  const selWhere = labWhere(sel);
  if (where === null || where === selWhere) {
    // another tray tile, or a neighbour in the same column: just move the selection
    state.labSel = id; delete state.labFlash[id]; render(); return;
  }
  if (labHasRoom(where)) labPlaceTile(sel, where);
  else labSwap(sel, id);
  state.labSel = null;
  render();
}

function labColClick(colId) {
  if (!labBoardActive()) return;
  const sel = state.labSel;
  if (sel === null) return;
  if (labWhere(sel) === colId) { state.labSel = null; render(); return; }
  if (labHasRoom(colId)) { labPlaceTile(sel, colId); state.labSel = null; state.labMsg = ''; }
  else { state.labMsg = 'That one is full — tap one of its tiles to swap.'; }
  render();
}

function labTrayClick() {
  if (!labBoardActive()) return;
  const sel = state.labSel;
  if (sel === null) return;
  if (labWhere(sel) !== null) labPlaceTile(sel, null);
  state.labSel = null; state.labMsg = '';
  render();
}

// ----- drag and drop (desktop; phones use tap-to-place) -----
function labDragStart(ev, id) {
  if (!labBoardActive() || state.labLocked[id]) { if (ev && ev.preventDefault) ev.preventDefault(); return; }
  state.labDrag = id;
  try { ev.dataTransfer.setData('text/plain', id); ev.dataTransfer.effectAllowed = 'move'; } catch (e) { /* some browsers need setData; ignore if blocked */ }
}
function labDragOver(ev, el) {
  if (ev && ev.preventDefault) ev.preventDefault();
  if (el && el.classList) el.classList.add('over');
}
function labDragLeave(ev, el) {
  if (el && el.classList && !(ev && el.contains && ev.relatedTarget && el.contains(ev.relatedTarget))) el.classList.remove('over');
}
function labDropCol(ev, colId) {
  if (ev && ev.preventDefault) ev.preventDefault();
  const id = state.labDrag; state.labDrag = null;
  if (id === null || id === undefined) return;
  state.labSel = null;
  if (labWhere(id) === colId) { render(); return; }
  if (labHasRoom(colId)) { labPlaceTile(id, colId); state.labMsg = ''; }
  else state.labMsg = 'That one is full — move one of its tiles out first.';
  render();
}
function labDropTray(ev) {
  if (ev && ev.preventDefault) ev.preventDefault();
  const id = state.labDrag; state.labDrag = null;
  if (id === null || id === undefined) return;
  state.labSel = null;
  labPlaceTile(id, null);
  state.labMsg = '';
  render();
}

function labCanSubmit() {
  const b = labCurBoard();
  if (!b || !labBoardActive()) return false;
  return b.columns.every(c => state.labCols[c.id].length >= c.cap);
}

function labSubmit() {
  if (!labCanSubmit()) return;
  const b = labCurBoard();
  state.labAttempts++;
  state.labSel = null;
  const sentBack = [];
  b.columns.forEach(c => {
    state.labCols[c.id].slice().forEach(id => {
      if (state.labLocked[id]) return;
      const t = labTileDef(b, id);
      if (t.col === c.id) state.labLocked[id] = true;
      else sentBack.push(id);
    });
  });
  sentBack.forEach(id => {
    labRemoveEverywhere(id);
    state.labTray.push(id);
    state.labFlash[id] = true;
    state.labMissCount[id] = (state.labMissCount[id] || 0) + 1;
  });
  const total = labRealTiles(b).length;
  const lockedCount = Object.keys(state.labLocked).length;
  if (state.labFirstTry === null) state.labFirstTry = {right: lockedCount, total: total};
  if (lockedCount === total) {
    state.labDone = true;
    labSyncElapsed();
    clearLabClock();
    const s = state.labStats[b.id] || {best: null, bestFirst: null};
    if (s.best === null || state.labElapsed < s.best) s.best = state.labElapsed;
    const first = state.labFirstTry.right + '/' + state.labFirstTry.total;
    if (s.bestFirst === null || state.labFirstTry.right > parseInt(String(s.bestFirst).split('/')[0], 10)) s.bestFirst = first;
    state.labStats[b.id] = s;
    state.labMsg = '';
  } else {
    state.labMsg = lockedCount + ' of ' + total + ' locked in — ' + sentBack.length + ' sent back to the tray (outlined in red).';
  }
  render();
}

function labReveal() {
  if (!labBoardActive()) return;
  const b = labCurBoard();
  clearLabClock();
  state.labRevealed = true;
  state.labSel = null;
  b.columns.forEach(c => { state.labCols[c.id] = b.tiles.filter(t => t.col === c.id).map(t => t.id); });
  state.labTray = b.tiles.filter(t => !t.col).map(t => t.id);
  state.labFlash = {};
  state.labMsg = '';
  render();
}

// ---------- board rendering ----------
function labTileHtml(b, t) {
  const id = t.id;
  const cls = ['lab-tile'];
  if (t.style) cls.push('wire', 'wire-' + t.style); else cls.push('tc' + (state.labColors[id] || 0));
  const locked = !!state.labLocked[id];
  if (locked) cls.push('locked');
  if (state.labSel === id) cls.push('sel');
  if (state.labFlash[id]) cls.push('flash');
  if (state.labRevealed && t.col) cls.push('revealed');
  const live = labBoardActive() && !locked;
  const drag = live ? ` draggable="true" ondragstart="labDragStart(event,'${id}')"` : '';
  const text = t.style ? `<span class="wire-text">${esc(t.text)}</span>` : esc(t.text);
  return `<button type="button" class="${cls.join(' ')}" data-tile="${id}"${drag} aria-pressed="${state.labSel === id}" ${live ? '' : 'disabled'} onclick="event.stopPropagation();labTileClick('${id}')">${locked ? '<span class="lab-check">✓</span>' : ''}${text}</button>`;
}

function labColHtml(b, col) {
  const ids = state.labCols[col.id] || [];
  const full = ids.length >= col.cap;
  const rows = b.layout === 'rows';
  const tiles = ids.map(id => labTileHtml(b, labTileDef(b, id))).join('');
  const remaining = col.cap - ids.length;
  let empties = '';
  if (remaining > 0) {
    empties = col.cap <= 5
      ? Array.from({length: remaining}, () => '<div class="lab-slot"></div>').join('')
      : `<div class="lab-slot more">${remaining} more</div>`;
  }
  const target = labBoardActive() && state.labSel !== null && !full && labWhere(state.labSel) !== col.id;
  const cls = ['lab-col', rows ? 'row' : 'colm'];
  if (target) cls.push('target');
  if (full) cls.push('full');
  return `<div class="${cls.join(' ')}" data-col="${col.id}" onclick="labColClick('${col.id}')"
      ondragover="labDragOver(event,this)" ondragleave="labDragLeave(event,this)" ondrop="labDropCol(event,'${col.id}')">
    <div class="lab-col-head"><span class="lab-col-label">${esc(col.label)}</span>${col.sub ? `<span class="lab-col-sub">${esc(col.sub)}</span>` : ''}${rows ? '' : `<span class="lab-col-count">${ids.length}/${col.cap}</span>`}</div>
    <div class="lab-slots">${tiles}${empties}</div>
  </div>`;
}

function labHooksHtml(b) {
  const notes = b.columns.filter(c => c.note);
  if (!notes.length && !b.hook) return '';
  return `<div class="panel lab-hooks">
    <div class="panel-title">MEMORY HOOKS</div>
    ${b.hook ? `<p class="lab-hook-main">${esc(b.hook)}</p>` : ''}
    ${notes.map(c => `<div class="lab-hook"><span class="lab-hook-label">${esc(c.label)}</span><span class="lab-hook-text">${esc(c.note)}</span></div>`).join('')}
  </div>`;
}

function labResultHtml(b) {
  const total = labRealTiles(b).length;
  if (state.labRevealed) {
    return `<div class="lab-result neutral">
      <div class="lab-result-title">Answers shown</div>
      <p class="lab-result-line">That run doesn&rsquo;t count. Read the hooks below, then play again from scratch.</p>
      <div class="lab-result-actions"><button class="opt-btn" onclick="labRestart()">Try again</button><button class="opt-btn" onclick="labBack()">Back to Lab</button></div>
    </div>`;
  }
  const missed = labRealTiles(b).filter(t => state.labMissCount[t.id]);
  const f = state.labFirstTry || {right: total, total: total};
  const missedHtml = missed.length
    ? `<div class="lab-missed"><div class="lab-missed-title">Tiles that bounced back</div>${missed.map(t => `<div class="lab-missed-item"><span class="lab-missed-tile">${esc(t.text)}</span><span class="lab-missed-arrow">→</span><span class="lab-missed-col">${esc(labColDef(b, t.col).label)}</span></div>`).join('')}</div>`
    : '<p class="lab-result-line">Perfect first try — nothing bounced back.</p>';
  return `<div class="lab-result good">
    <div class="lab-result-title">✓ Board cleared</div>
    <div class="lab-result-stats"><span>⏱ ${formatClock(state.labElapsed)}</span><span>${state.labAttempts} submit${state.labAttempts === 1 ? '' : 's'}</span><span>first try ${f.right}/${f.total}</span></div>
    ${missedHtml}
    <div class="lab-result-actions"><button class="opt-btn" onclick="labRestart()">Play again</button><button class="opt-btn" onclick="labBack()">Back to Lab</button></div>
  </div>`;
}

function renderLabBoard() {
  const b = labCurBoard();
  if (!b) return renderLab();
  const rows = b.layout === 'rows';
  const order = state.labColOrder.length ? state.labColOrder : b.columns.map(c => c.id);
  const cols = order.map(id => labColHtml(b, labColDef(b, id))).join('');
  const total = labRealTiles(b).length;
  const slotsTotal = b.columns.reduce((n, c) => n + c.cap, 0);
  const placed = Object.keys(state.labCols).reduce((n, c) => n + state.labCols[c].length, 0);
  const active = labBoardActive();
  const canSubmit = labCanSubmit();
  const trayTiles = state.labTray.map(id => labTileHtml(b, labTileDef(b, id))).join('');
  const trayLeft = state.labTray.length;

  const dock = active ? `
    <div class="lab-tray ${state.labSel !== null && labWhere(state.labSel) !== null ? 'target' : ''}" id="lab-tray"
         onclick="labTrayClick()" ondragover="labDragOver(event,this)" ondragleave="labDragLeave(event,this)" ondrop="labDropTray(event)">
      <div class="lab-tray-head">
        <span class="lab-tray-title">TILES &middot; ${trayLeft} left</span>
        <span class="lab-tray-progress">${placed}/${slotsTotal} placed</span>
      </div>
      ${state.labMsg ? `<div class="lab-msg">${esc(state.labMsg)}</div>` : ''}
      <div class="lab-tray-tiles" id="lab-tray-tiles">${trayTiles || '<div class="lab-tray-empty">Every slot is filled &mdash; hit Submit.</div>'}</div>
      <div class="lab-actions">
        <button class="lab-submit" ${canSubmit ? '' : 'disabled'} onclick="event.stopPropagation();labSubmit()">Submit Answers</button>
        <button class="lab-minor" onclick="event.stopPropagation();labReveal()">Show answers</button>
        <button class="lab-minor" onclick="event.stopPropagation();labRestart()">Restart</button>
      </div>
    </div>` : '';

  const leftovers = !active && state.labTray.length
    ? `<div class="hint" style="margin-top:12px">Not used on this board: ${state.labTray.map(id => esc(labTileDef(b, id).text)).join(' &middot; ')}</div>` : '';

  return `<div class="screen lab-board">
    <div class="lab-top">
      <button class="back-btn" onclick="labBack()">&larr; Lab</button>
      <div class="lab-title">${esc(b.title)}</div>
      <div class="lab-clock ${active ? '' : 'stopped'}" id="lab-clock" aria-label="Stopwatch">${formatClock(state.labElapsed)}</div>
    </div>
    ${labRunBarHtml(!active)}
    ${b.blurb ? `<div class="lab-blurb">${esc(b.blurb)}${b.extra ? ' <span class="src-badge src-extra">EXTRA</span>' : ''}</div>` : ''}
    ${active ? '' : labResultHtml(b)}
    <div class="lab-cols ${rows ? 'lay-rows' : 'lay-cols'} n${order.length}">${cols}</div>
    ${leftovers}
    ${!active ? labHooksHtml(b) : ''}
    ${b.objective ? `<div class="tags" style="margin:14px 2px 0"><span class="tag obj-tag">${esc(b.objective)}</span></div>` : ''}
    ${dock}
  </div>`;
}

// Keeps the tray's own scroll position when the board re-renders after a tap.
function renderLabBoardInto(app) {
  const old = document.getElementById('lab-tray-tiles');
  const keep = old ? old.scrollTop : 0;
  app.innerHTML = renderLabBoard();
  const fresh = document.getElementById('lab-tray-tiles');
  if (fresh && keep) fresh.scrollTop = keep;
}

// ============================================================
// Quick quizzes (photo quiz, port sprint, acronyms)
// ============================================================
function lqStart(id) {
  const def = labQuizDef(id);
  if (!def) return;
  lqBegin(id, def.items);
}

function lqBegin(id, items) {
  clearLabTimers();
  state.lqId = id;
  state.lqItems = shuffleArr(items).map(it => ({
    it: it,
    opts: shuffleArr(it.o.map((text, i) => ({text: text, ok: i === it.a})))
  }));
  state.lqIdx = 0; state.lqScore = 0; state.lqPick = null; state.lqChecked = false;
  state.lqMissed = []; state.lqStreak = 0; state.lqBestStreak = 0; state.lqHist = [];
  state.screen = 'lab-quiz';
  render(); scrollTop();
}

function lqToggleAuto() { state.lqAutoNext = !state.lqAutoNext; if (!state.lqAutoNext) clearLq(); render(); }

function lqToggleConfirm() {
  state.lqConfirm = !state.lqConfirm;
  if (!state.lqChecked) state.lqPick = null;
  render();
}
function lqPickOpt(i) {
  if (state.lqChecked) return;
  const cur = state.lqItems[state.lqIdx];
  if (!cur || !cur.opts[i]) return;
  if (state.lqConfirm) { state.lqPick = i; render(); return; }   // only select; Submit locks it in
  lqLock(i);
}
function lqSubmit() {
  if (state.lqChecked || state.lqPick === null) return;
  lqLock(state.lqPick);
}
function lqLock(i) {
  const cur = state.lqItems[state.lqIdx];
  if (state.lqChecked || !cur || !cur.opts[i]) return;
  state.lqPick = i;
  state.lqChecked = true;
  state.lqHist[state.lqIdx] = {pick: i};
  const right = cur.opts[i].ok;
  if (right) {
    state.lqScore++; state.lqStreak++;
    if (state.lqStreak > state.lqBestStreak) state.lqBestStreak = state.lqStreak;
  } else {
    state.lqStreak = 0;
    state.lqMissed.push(cur.it);
  }
  render();
  if (right && state.lqAutoNext) {
    clearLq();
    state.lqHandle = setTimeout(() => { state.lqHandle = null; lqNext(); }, 650);
  }
}

function lqNext() {
  clearLq();
  if (state.screen !== 'lab-quiz') return;
  if (state.lqIdx < state.lqItems.length - 1) {
    state.lqIdx++;
    const h = state.lqHist[state.lqIdx];
    state.lqPick = h ? h.pick : null; state.lqChecked = !!h;
    render(); scrollTop();
  } else {
    state.screen = 'lab-quiz-over';
    render(); scrollTop();
  }
}

// Go back to an earlier question (it shows what you picked and the explanation; answers are locked, so scores never change).
function lqPrev() {
  clearLq();
  if (state.screen !== 'lab-quiz' || state.lqIdx === 0) return;
  state.lqIdx--;
  const h = state.lqHist[state.lqIdx];
  state.lqPick = h ? h.pick : null; state.lqChecked = !!h;
  render(); scrollTop();
}
// From the results screen: back into the questions, on the last one, to read through what was missed.
function lqReview() {
  clearLq();
  if (!state.lqItems.length) return;
  state.lqIdx = state.lqItems.length - 1;
  const h = state.lqHist[state.lqIdx];
  state.lqPick = h ? h.pick : null; state.lqChecked = !!h;
  state.screen = 'lab-quiz';
  render(); scrollTop();
}
function lqRetryMissed() { lqBegin(state.lqId, state.lqMissed.slice()); }
function lqAgain() { lqStart(state.lqId); }

function renderLabQuiz() {
  const def = labQuizDef(state.lqId);
  const cur = state.lqItems[state.lqIdx];
  if (!def || !cur) return renderLab();
  const it = cur.it;
  const n = state.lqItems.length;
  const pct = Math.round((state.lqIdx / n) * 100);
  const img = it.img ? imgSrc(it.img) : '';
  const opts = cur.opts.map((o, i) => {
    let cls = '';
    if (state.lqChecked) cls = o.ok ? 'good' : (state.lqPick === i ? 'bad' : 'muted');
    else if (state.lqConfirm && state.lqPick === i) cls = 'picked';
    return `<button class="choice ${cls}" ${state.lqChecked ? 'disabled' : ''} ${!state.lqChecked && state.lqConfirm ? 'aria-pressed="' + (state.lqPick === i) + '"' : ''} onclick="lqPickOpt(${i})">
      <span class="choice-letter">${'ABCD'[i]}</span><span class="choice-text">${esc(o.text)}</span>
      ${state.lqChecked && o.ok ? '<span class="choice-icon">✓</span>' : ''}${state.lqChecked && cls === 'bad' ? '<span class="choice-icon">✗</span>' : ''}
    </button>`;
  }).join('');
  const right = state.lqChecked && cur.opts[state.lqPick] && cur.opts[state.lqPick].ok;
  const after = state.lqChecked
    ? `<div class="feedback ${right ? 'good' : 'bad'}">
         <div class="feedback-title">${right ? '✓ Correct' : '✗ Not quite'}</div>
         <p>${esc(it.w || '')}</p>
       </div>
       <button class="next-btn" onclick="lqNext()">${state.lqIdx === n - 1 ? 'See results →' : 'Next →'}</button>`
    : (state.lqConfirm ? `<button class="next-btn" ${state.lqPick === null ? 'disabled' : ''} onclick="lqSubmit()">Submit answer</button>` : '');
  return `<div class="screen lab-quiz">
    <div class="quiz-nav">
      <button class="nav-btn" onclick="labBack()">&larr; Lab</button>
      <button class="nav-btn" onclick="lqPrev()" ${state.lqIdx === 0 ? 'disabled' : ''}>&larr; Previous question</button>
      <label class="lq-auto"><input type="checkbox" ${state.lqAutoNext ? 'checked' : ''} onchange="lqToggleAuto()"> auto-next on correct</label>
      <label class="lq-auto"><input type="checkbox" ${state.lqConfirm ? 'checked' : ''} onchange="lqToggleConfirm()"> lock in with Submit</label>
    </div>
    ${labRunBarHtml(false)}
    <div class="quiz-header">
      <div class="quiz-tag">${esc(def.title)} <span class="src-badge src-orig">ADDED</span></div>
      <div class="quiz-progress">Q ${state.lqIdx + 1} / ${n}</div>
      <div class="quiz-score">${state.lqScore} right &middot; streak ${state.lqStreak}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      ${img ? `<img class="lq-img" src="${img}" alt="Connector photo">` : ''}
      <div class="stem">${esc(it.p)}</div>
      <div class="choices">${opts}</div>
      ${after}
    </div>
  </div>`;
}

function renderLabQuizOver() {
  const def = labQuizDef(state.lqId);
  const n = state.lqItems.length;
  const pct = n ? Math.round((state.lqScore / n) * 100) : 0;
  const missedHtml = state.lqMissed.length
    ? state.lqMissed.map(it => {
        const correct = it.o[it.a];
        return `<div class="game-missed-item">${it.img ? '<span class="lq-missed-photo">🖼</span> ' : ''}${esc(it.p)} <strong class="lq-answer">${esc(correct)}</strong>${it.w ? `<div class="lq-why">${esc(it.w)}</div>` : ''}</div>`;
      }).join('')
    : '<div class="hint">No misses — clean run.</div>';
  return `<div class="screen lab-quiz-over">
    ${labRunBarHtml(true)}
    <div class="score-hero">
      <div class="game-over-title">${esc(def ? def.title : 'Quiz')}</div>
      <div class="score-num">${state.lqScore}<span class="score-of">/${n}</span></div>
      <div class="score-pct">${pct}% &middot; best streak ${state.lqBestStreak}</div>
    </div>
    <div class="result-actions">
      <button class="opt-btn" onclick="lqReview()">Review questions</button>
      ${state.lqMissed.length ? `<button class="opt-btn" onclick="lqRetryMissed()">Retry ${state.lqMissed.length} missed</button>` : ''}
      <button class="opt-btn" onclick="lqAgain()">Play again</button>
      <button class="opt-btn" onclick="labBack()">Back to Lab</button>
    </div>
    <div class="panel">
      <div class="panel-title">MISSED (${state.lqMissed.length})</div>
      ${missedHtml}
    </div>
  </div>`;
}

render();
window.__appReady = true;
</script>
</body>
</html>
