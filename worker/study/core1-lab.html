ssormesser.link/1201020602","source":"book"},{"id":"A86","stem":"Which of the following can be used to forward traffic based on a destination MAC address?","choices":[{"letter":"A","text":"Unmanaged switch","explanation":"Switches determine how traffic is forwarded based on the destination MAC (Media Access Control) address in the frame. The qualification of managed or unmanaged is not important in this case, since both types of switches make forwarding decisions the same way. The difference between a managed and unmanaged switch are based on features not associated with the forwarding process"},{"letter":"B","text":"PoE injector","explanation":"A PoE (Power over Ethernet) injector sits inline in an Ethernet link and adds voltage to support PoE devices at the end of the wire."},{"letter":"C","text":"Router","explanation":"A router makes forwarding decisions based on the destination IP (Internet Protocol) address of a packet."},{"letter":"D","text":"Firewall","explanation":"A firewall controls the flow of traffic based on a set of predefined security policies. If the traffic flow matches one of the policies, the firewall can be configured to allow or block that traffic flow."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"A87","stem":"A system administrator made some BIOS changes to a desktop computer running Windows 11, and now this message appears when starting the computer:\n\n“This drive can only boot in UEFI mode.”\n\nWhich of the following would be the BEST next troubleshooting step?","choices":[{"letter":"A","text":"Modify the boot drive sequence","explanation":"Changing the boot drive sequence in the BIOS would not resolve the UEFI or Security Boot process."},{"letter":"B","text":"Enable Secure Boot","explanation":"Secure Boot is part of the UEFI (Unified Extensible Firmware Interface) standard for a computer BIOS (Basic Input Output System). Secure Boot ensures that the underlying operating system has not been modified by malware or any other process"},{"letter":"C","text":"Remove the BIOS password","explanation":"UEFI mode and Secure Boot do not require a boot or management password, and removing any of those passwords will not resolve the error message."},{"letter":"D","text":"Boot the system with the Windows setup media","explanation":"Booting with separate media would not resolve this issue when booting to the primary storage drive. UEFI mode with Secure Boot is required for this system."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.5 - BIOS Settings","link":"https://professormesser.link/1201030506","source":"book"},{"id":"A88","stem":"A new employee has been provided a corporate smartphone. After the initial login, all of the corporate email server configurations have been automatically installed and updated in real-time. Which of the\n\nfollowing is providing this functionality?","choices":[{"letter":"A","text":"ACL","explanation":"An ACL (Access Control List) broadly describes a security control which can allow or deny an operating system feature, network communication, or any other data flow. An ACL is not used to configure app settings on a smartphone or any other mobile device."},{"letter":"B","text":"SSID","explanation":"An SSID (Service Set Identifier) is the technical name of a wireless network. An access point's SSID defines the name of the wireless network and this name is usually displayed in the list of available wireless networks. An SSID is not used to make configuration changes to apps."},{"letter":"C","text":"SPICE","explanation":"SPICE (Simple Protocol for Independent Computing Environments) is a remote access protocol commonly used with virtual environments. SPICE is not used to configure apps or configuration settings."},{"letter":"D","text":"MDM","explanation":"A corporate MDM (Mobile Device Manager) is used to manage and control all of the smartphones and tablets used by the organization. The manager of the MDM can also configure email server settings, security parameters, and almost any other aspect of the mobile device"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Management","link":"https://professormesser.link/1201010302","source":"book"},{"id":"A89","stem":"A technician is installing a DSL modem in a data center. Which of the following connectors would be used to connect the DSL modem to the Internet provider line?","choices":[{"letter":"A","text":"DB-9","explanation":"DB-9 interfaces are associated with the transmission of serial data across a link. These are slower speed connections that are commonly used today to connect and manage infrastructure devices such as switches, routers, and firewalls. DB-9 interfaces are not used for DSL or any high-speed Internet connection."},{"letter":"B","text":"RJ11","explanation":"The RJ11 connector (Registered Jack 11) is the modular connector commonly associated with analog POTS (Plain Old Telephone System) lines. Since DSL (Digital Subscriber Line) uses the existing telephone lines, the DSL connection from an Internet Service Provider will also use those same lines with RJ11 connectors. These connectors will be the same for residential, large-scale commercial, and SOHO (Small Office / Home Office) use"},{"letter":"C","text":"Molex","explanation":"A molex connector is a reference to the four-pin power connections provided by a desktop computer's power supply. Molex connectors are not used to provide network connectivity."},{"letter":"D","text":"F-connector","explanation":"The F-connector is the screw-on connector commonly used to attach cable television or cable modem coax connections. F-connectors are not used with twisted-pair copper DSL installations."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.2 - Copper Connectors","link":"https://professormesser.link/1201030208","source":"book"},{"id":"A90","stem":"Which of the following would be the BEST choice for capturing an image from a printed page and saving it on a computer?","choices":[{"letter":"A","text":"Print server","explanation":"A print server is software responsible for accepting print jobs from a computer and sending them to an available printer. Print servers are part of the printing process, and they do not provide any image capture functionality."},{"letter":"B","text":"Optical drive","explanation":"Optical drives can store digital information onto optical discs. These discs can then be read by laser beams on the appropriate optical drive."},{"letter":"C","text":"Flatbed scanner","explanation":"A flatbed scanner is designed to capture images from paper and convert them into digital form"},{"letter":"D","text":"Webcam","explanation":"Webcams are designed to capture moving images and not printed pages."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"}],"B":[{"id":"B6","stem":"A server administrator has four identical drives to install into a database server. Which of these RAID types would provide both redundancy and the most available storage space?","choices":[{"letter":"A","text":"RAID 5","explanation":"With RAID 5, three drives would contain user data and the fourth drive would store parity information. This efficient use of space and the included redundancy make RAID 5 the best option"},{"letter":"B","text":"RAID 10","explanation":"A RAID 10 array can be created with four drives, but two of those drives will be mirrored drives, effectively limiting the available storage space by 50 percent."},{"letter":"C","text":"RAID 0","explanation":"RAID 0, or striping, does not provide any redundancy and would not meet the requirements in this question."},{"letter":"D","text":"RAID 1","explanation":"RAID 1 is mirroring, and half of the available storage space would be dedicated to storing redundant data."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","source":"book"},{"id":"B7","stem":"A user is attempting to charge their iPhone, but the charging icon does not appear when connecting the charging cable. A working cable from another iPhone exhibits the same symptoms. Which of the following is the most likely reason for this issue?","choices":[{"letter":"A","text":"The screen is locked","explanation":"A locked screen would prevent access to the phone's apps or data, but it would not prevent the phone from charging."},{"letter":"B","text":"An iOS update is pending","explanation":"It's important to stay up to date with the latest operating system version, but a pending update would not prevent the phone from charging."},{"letter":"C","text":"The iPhone has low signal","explanation":"A low signal on the cellular or Wi-Fi network could cause issues with phone or data communication, but it would not stop the phone from charging the battery when connecting the Lightning cable."},{"letter":"D","text":"The charging port is damaged","explanation":"A damaged physical interface would prevent the phone from charging, even while attempting to charge with different cables"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"B8","stem":"A user in the marketing department needs an LCD with the best possible color representation. Which of the following would be the best choice for this requirement?","choices":[{"letter":"A","text":"TN","explanation":"The response times of a TN (Twisted Nematic) display are relatively fast, making it a good choice for gaming. However, TN displays tend to have poor viewing angles and suffer from color shifts when viewed at an angle."},{"letter":"B","text":"CCFL","explanation":"Older displays use a CCFL (Cold Cathode Fluorescent Lamp) backlight on LCD (Liquid Crystal Display) monitors. This provides enough light to see the information on the display, but using a CCFL backlight does not directly affect the quality of the color on the screen."},{"letter":"C","text":"IPS","explanation":"An IPS (In Plane Switching) display provides excellent color representation and would be the best choice of the available options"},{"letter":"D","text":"VA","explanation":"A VA (Vertical Alignment) display is a good compromise between TN and IPS displays, but it doesn't quite meet the color representation of an IPS display."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","source":"book"},{"id":"B9","stem":"A company is receiving an increase in malware delivered to random employees through email attachments. Which of the following would be the best way to protect users against this malicious software?","choices":[{"letter":"A","text":"Spam gateway","explanation":"A spam gateway acts as a filter for unauthorized or unsolicited email messages. Most spam gateways can scan files for malicious software and filter those messages before delivery to the recipient"},{"letter":"B","text":"DHCP services","explanation":"DHCP (Dynamic Host Configuration Protocol) is used to automatically assign IP address settings. DHCP does not provide any filtering mechanism for malware or email messages."},{"letter":"C","text":"Syslog","explanation":"Syslog is a standard for transferring log information from devices on the network. This is commonly used to transfer switch, router, firewall, and other log files to a central database."},{"letter":"D","text":"VLANs","explanation":"VLANs (Virtual Local Area Networks) are used to create logical network segmentations by broadcast domains. This can allow the implementation of more specific security policies, but VLANs do not have any inherent filtering or malware identification features."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.3 - Network Services","link":"https://professormesser.link/1201020301","source":"book"},{"id":"B10","stem":"A user has reported their tablet is not able to retrieve or send mail, browse the Internet, or connect to video conferences. Apps on the device which do not require connectivity are working as expected. Which of these would be the most likely cause of this issue?","choices":[{"letter":"A","text":"Battery is very low","explanation":"A low battery could cause the tablet to enter a power conservation mode, but network connections are usually available when these low power modes are used."},{"letter":"B","text":"The Wi-Fi network is out of range","explanation":"A Wi-Fi network has limited range, and poor connectivity would result in communications issues, application faults, and other networking issues"},{"letter":"C","text":"The touch screen needs calibration","explanation":"Some older mobile devices need to be constantly calibrated to maintain an accurate digitizer input. This issue is not related to the user interface or touch screen, so a calibration would not resolve this problem."},{"letter":"D","text":"The tablet is overheated","explanation":"If a mobile device becomes overheated, the entire system will shut down until the internal temperature is lowered to a safe operational range. An overheating tablet would not disable independent features such as the network connection."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"B11","stem":"A PC technician has been asked to replace the LCD on a touch-screen laptop computer. Which of the following would be the most important component to test after this replacement?","choices":[{"letter":"A","text":"Digitizer","explanation":"A digitizer is built into the LCD display, and it would be the most likely component to have a problem after the entire display has been replaced"},{"letter":"B","text":"Keyboard","explanation":"Although the keyboard cables can be accidentally dislodged when working inside of a laptop computer, the display and keyboard are usually far enough apart that a keyboard problem would be uncommon."},{"letter":"C","text":"Audio controls","explanation":"Many laptops include audio controls and buttons on the top of the laptop keyboard, but these controls are not usually replaced or modified when a display is replaced."},{"letter":"D","text":"System memory","explanation":"The RAM of a computer is not commonly removed or reseated when working on the display, so you would not expect to see any issues with memory once the system is put back together."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Types","link":"https://professormesser.link/1201030101","source":"book"},{"id":"B12","stem":"The computers in the shipping department are receiving the message “No connectivity” on their computers. The ipconfig output on one of the computers provides this information:\n\nIPv4 Address: 192.168.1.22\nSubnet Mask: 255.255.255.0\nDefault Gateway: 192.168.1.1\n\nFrom this device, a technician is able to successfully ping 127.0.0.1 and 192.168.1.22. The technician can also ping other devices in the shipping department, but cannot receive a ping response from servers in the data center or from the 192.168.1.1 address.\n\nWhich of these would be the most likely cause of this issue?","choices":[{"letter":"A","text":"The DHCP server is down","explanation":"The IPv4 address assigned to the computer shows an IP address which was either assigned manually or through a DHCP (Dynamic Host Configuration Protocol) server. None of the output or symptoms appear to be related to a faulty DHCP server."},{"letter":"B","text":"The wireless network is experiencing interference","explanation":"Some ping responses are working normally, so there doesn't appear to be any evidence of wireless interference."},{"letter":"C","text":"The local router is down","explanation":"The default gateway is the local router for the IP subnet. If the default gateway address of 192.168.1.1 is not responding to a ping, then the router may not be operational"},{"letter":"D","text":"The Internet provider is experiencing an outage","explanation":"This issue did not appear to be related to any Internet connectivity, so the status of the Internet link would not be an issue."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"B13","stem":"Which of the following would be the best way to activate the screen of a smartphone without physically touching the display?","choices":[{"letter":"A","text":"Trackpad","explanation":"A trackpad is commonly used on laptops and tablets, but the size of a smartphone does not generally allow the use of a trackpad."},{"letter":"B","text":"Port replicator","explanation":"A port replicator is used by laptops to limit the amount of cable and power connections each time the laptop is moved. A port replicator would not be used with a smartphone."},{"letter":"C","text":"Smart card reader","explanation":"Smart card readers are usually integrated into a laptop or connected to a computer with a USB connection. Smart card readers are not commonly used with smartphones."},{"letter":"D","text":"Stylus","explanation":"A stylus provides for interaction of a touch screen without physically pressing the display with a fingertip. A stylus is often referenced as a touchscreen pen, touch screen stylus, or capacitive stylus"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.2 - Mobile Device Accessories","link":"https://professormesser.link/1201010202","source":"book"},{"id":"B14","stem":"A graphics designer is working on a computer that powers itself off after about an hour of work. The computer tends to power down when working on complex designs that require extensive CPU utilization. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"The case fans are blocked","explanation":"Most motherboards are designed to power off automatically if the temperatures become excessive. If the case fans are blocked, the inside of the computer will not be able to efficiently cool the system. Eventually, the heat from the heavily-worked CPU will cause the system to power down"},{"letter":"B","text":"The hard drive is failing","explanation":"A failing hard drive may appear to be working slower than normal, or file system errors may appear when working in an application. A bad hard drive will not commonly power off the computer."},{"letter":"C","text":"The graphics software is corrupted","explanation":"Problems with software will display an error message on the screen or cause the application to suddenly disappear. An application problem will not commonly cause a computer to power down."},{"letter":"D","text":"A device driver is outdated","explanation":"It can be important to keep device drivers updated, but an outdated driver will not commonly cause a system to power down. A problem with a device driver will cause an error message in the operating system or application."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"B15","stem":"Which of these services would be associated with a Windows file transfer?","choices":[{"letter":"A","text":"LDAP","explanation":"LDAP (Lightweight Directory Access Protocol) is a protocol used to access network directories, such as Microsoft's Active Directory database."},{"letter":"B","text":"SMB","explanation":"SMB (Server Message Block) is the protocol used by Microsoft Windows for file sharing, printer sharing, and other Windows services. SMB commonly uses port 445 to provide direct SMB communication between Windows devices"},{"letter":"C","text":"IMAP","explanation":"IMAP (Internet Message Access Protocol) is a popular email protocol used for retrieving message from an email server."},{"letter":"D","text":"SSH","explanation":"SSH (Secure Shell) provides an encrypted terminal connection across the network. SSH is not commonly used to transfer files from one Windows device to another."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.1 - Common Ports","link":"https://professormesser.link/1201020102","source":"book"},{"id":"B16","stem":"An administrator has installed a hypervisor on a server, but the administrator is not installing Windows or Linux. Which of the following would best describe this installation?","choices":[{"letter":"A","text":"VDI","explanation":"VDI (Virtual Desktop Infrastructure) provides cloud-based desktop access and management. VDI is often called Desktop as a Service (DaaS)."},{"letter":"B","text":"Containerization","explanation":"Application containerization uses a host operating system and separate application \"containers\" to run application instances in an isolated and portable image."},{"letter":"C","text":"Hybrid cloud","explanation":"A hybrid cloud consists of a combination of a public cloud services and private cloud services. Many organizations have some degree of hybrid cloud offerings for their company."},{"letter":"D","text":"Type 1","explanation":"Type 1 hypervisors are also called bare metal hypervisors because they are installed without any underlying Windows or Linux operating system. Type 2 hypervisors are installed on an existing operating system"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","source":"book"},{"id":"B17","stem":"A technician is removing a cover from the bottom of a Windows laptop. Which of the following would be the most likely reason for this task?","choices":[{"letter":"A","text":"Replace the thermal paste","explanation":"Thermal paste is usually added between a processor and a heat sink. Replacing the thermal paste usually requires significant disassembly of the laptop."},{"letter":"B","text":"Reset the operating system","explanation":"Fortunately, resetting the operating system is not managed from the access covers on a laptop. A hardware restart is usually provided through the existing power button on the top or side of the laptop."},{"letter":"C","text":"Connect an external display","explanation":"Connections to external displays using HDMI, DisplayPort, USB-C, and other video interfaces are commonly provided on the back of a laptop. The removal of an access cover is not required for this connection."},{"letter":"D","text":"Upgrade the memory","explanation":"Some laptop models provide options for easily upgrading RAM (Random Access Memory) through a small cover on the bottom of the laptop. Some covers also allow for easy upgrades of storage drives and other components"},{"letter":"E","text":"Add a stylus","explanation":"A stylus is usually provided as a separate external input option. Adding a stylus would not commonly require the removal of a laptop's access cover."}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.1 - Laptop Hardware","link":"https://professormesser.link/1201010101","source":"book"},{"id":"B18","stem":"A company is using a cloud-based service that provides a hardware platform and no additional software. Which of these would best describe this purchase?","choices":[{"letter":"A","text":"SaaS","explanation":"SaaS (Software as a Service) provides a fully developed application for end-user access. The cloud service provider handles the hosting, application development, support, and all other aspects of application services. The users only need to login and use the available service from a browser or app."},{"letter":"B","text":"Hybrid","explanation":"A hybrid cloud deployment model combines both public cloud and private cloud resources. Public cloud resources would be publicly available, usually across the Internet. Private cloud resources would be restricted to a single organization or small group of organizations."},{"letter":"C","text":"Metered","explanation":"A metered cloud service is measured and price based on usage. For example, uploading, storing, or downloading documents will be measured and billed based on the amount of use. This is in comparison to a non- metered cloud service, where storage or data transfer may be based on a fixed monthly cost."},{"letter":"D","text":"IaaS","explanation":"IaaS (Infrastructure as a Service) is a model that provides the computing platform, but no additional software. The user will usually configure the platform with the appropriate CPU, memory, and storage options, and the service provider is only responsible for the uptime and availability of the hardware platform. The user is generally responsible for all software administration"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","source":"book"},{"id":"B19","stem":"While working at their desk, a laptop user would like to use a full-size keyboard and external mouse. They would also like to connect to a monitor and wired network without connecting and disconnecting cables each time they leave the desk. Which of these would be the best way to provide this functionality?","choices":[{"letter":"A","text":"Use separate desktop and laptop computers","explanation":"Separate computers would introduce significant additional cost, and the user would need to manage multiple systems and synchronize applications and files between the systems. This would certainly not be the best of the available options."},{"letter":"B","text":"Install a docking station at the user’s desk","explanation":"A docking station provides the laptop with a single connection to video, network, keyboard, mouse, and other peripheral connections on their desk"},{"letter":"C","text":"Use a wireless access point at the user’s desk","explanation":"An access point is used to connect 802.11 wireless devices to a wired network. This particular question does not involve wireless network connectivity, and it would be more common to install an access point at a centralized high point of the work area."},{"letter":"D","text":"Install a USB hub for the laptop","explanation":"Unfortunately, a USB (Universal Serial Bus) hub wouldn't provide the connectivity required for video output, and it commonly wouldn't include wired network connectivity without additional adapters."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.2 - Mobile Device Accessories","link":"https://professormesser.link/1201010202","source":"book"},{"id":"B20","stem":"A server administrator needs to store gigabytes of server performance statistics for future analysis. The data needs to be always be available, even if a storage drive fails. Which of the following would be the best choice for this data?","choices":[{"letter":"A","text":"Optical drive","explanation":"An optical drive can provide access to a relatively large storage space, but it doesn't provide any redundancy if a drive was to fail."},{"letter":"B","text":"Flash drive","explanation":"A flash drive is a common storage type for mobile devices. Flash memory storage does not include any type of backup or redundancy features."},{"letter":"C","text":"RAID","explanation":"Most RAID (Redundant Array of Independent Disks) configurations support the use of multiple drives for redundancy, even if a single drive was to fail"},{"letter":"D","text":"DDR","explanation":"DDR (Dual Data Rate) describes a type of RAM (Random Access Memory) module commonly used on desktop or laptop computers. DDR memory does not provide an option for offline storage."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","source":"book"},{"id":"B21","stem":"In which of the following would a cable with a DB-9 connector be used?","choices":[{"letter":"A","text":"Attaching a mouse or keyboard to a desktop computer","explanation":"A mouse and keyboard commonly uses USB (Universal Serial Bus) interfaces for connectivity."},{"letter":"B","text":"Configuring a router","explanation":"A DB-9 connector, or less commonly, DE-9 (D-subminiature size E, 9 pin) is a connector used to send serial signals to another device. A DB-9 connector on a computer is commonly used to connect to the management interface of a switch, router, firewall, or another infrastructure device"},{"letter":"C","text":"Connecting an external storage device","explanation":"External storage devices can connect using many different interface types, including USB, Thunderbolt, eSATA (External Serial AT Attachment), and others. The serial connection of a DB-9 connector would be too slow to support the high throughput required from an external storage device."},{"letter":"D","text":"Attaching a video camera to a computer","explanation":"Video cameras or webcams commonly use USB connections to support a high-speed connection across devices. DB-9 serial connections would be too slow to support the throughput required of real-time audio and video."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.2 - Copper Connectors","link":"https://professormesser.link/1201030208","source":"book"},{"id":"B22","stem":"A workstation administrator is configuring a new system for graphics designers, and the users have requested the fastest possible storage speed for reading and writing data. Which of the following would be the best choice for this requirement?","choices":[{"letter":"A","text":"10 TB NAS","explanation":"The throughput of a NAS (Network Attached Storage) is limited by the speed of the network. SSD technology can transfer data at speed that far exceeds most network connections."},{"letter":"B","text":"8 TB HDD","explanation":"HDD (Hard Disk Drive) technology uses spinning disks to store and retrieve data. The mechanical nature of HDDs limit the throughput and are much slower relative to SSDs."},{"letter":"C","text":"5 TB SAN","explanation":"A SAN (Storage Area Network) is similar to a NAS, where the network limits the overall throughput of the storage subsystem. A locally attached SSD is generally many times faster than a NAS or SAN system."},{"letter":"D","text":"2 TB SSD","explanation":"The most important requirement for this new system is the speed of reading and writing data. Of the available options, the fastest throughput is an SSD (Solid-State Drive). Although the storage space is the lowest of the available options, the users didn't specify any minimum storage size requirements"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.4 - Storage Devices","link":"https://professormesser.link/1201030401","source":"book"},{"id":"B23","stem":"A user has connected a new laptop to an LCD projector in a conference room. About thirty minutes into the presentation, the projector light turns off but the projector fans continue to run. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"Incorrect laptop cable","explanation":"If the laptop cable was incorrect, then the first thirty minutes of the presentation would not have worked properly with the projector."},{"letter":"B","text":"Poor projector airflow","explanation":"The lamp in an LCD projector can get very hot, and there are often many fans used to keep the lamp cool enough to work properly. If the fans are not working properly or the airflow is blocked, the projector will automatically shut down to prevent any heat damage"},{"letter":"C","text":"Dead pixels","explanation":"Dead pixels are individual dots on the screen that remain black and do not show any color. In this question, the output was working properly until thirty minutes into the presentation, so a dead pixel would not be associated with this issue."},{"letter":"D","text":"Incorrect resolution setting","explanation":"An incorrect or incompatible resolution configuration on the laptop would result in a skewed display or blank output. Since this display was working for thirty minutes, the resolution setting would not have been the issue."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"B24","stem":"A marketing manager is printing a document on the company letterhead stored in one of the printer trays. However, the output is instead printed from a tray containing plain paper. Which of the following would be the best way to resolve this issue?","choices":[{"letter":"A","text":"Select the duplex print option","explanation":"The duplex print option would print the output on both sides of the page, but it would not change the type of paper used for the output."},{"letter":"B","text":"Enable collated output","explanation":"Collated output will print each page of a document before printing another copy of that same document. The option to collate the output would not change the type of paper used, however."},{"letter":"C","text":"Modify the output tray in the print dialog","explanation":"The printer dialog shown during the print process should provide an option to choose the tray for the print job. If the tray selection is available, the option should be available in the print driver properties"},{"letter":"D","text":"Change the output orientation","explanation":"The output orientation is normally configured for either portrait mode or landscape mode. Changing the orientation would not change the type of paper used by the printer."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"B25","stem":"A system administrator has noticed that their cloud implementation supports multiple application instances during the busy workday, but only one application instance is available during the slower evening shifts. Which of the following would best describe this functionality?","choices":[{"letter":"A","text":"Metered utilization","explanation":"A metered service commonly charges a fee based on the actual use of the service. For example, a cloud-based service that charges for each upload, download, and stored file is a metered service."},{"letter":"B","text":"Elasticity","explanation":"Elasticity is a cloud characteristic used to increase and decrease the available resources as the application load changes"},{"letter":"C","text":"Availability","explanation":"Highly available systems are designed to provide constant availability, even if one of the components of the system are temporarily unavailable."},{"letter":"D","text":"Shared resources","explanation":"A cloud-based infrastructure creates services by allocating a portion of an existing set of shared resources. The CPU, memory, and storage space used by a single cloud server is part of a much larger set of shared resources."},{"letter":"E","text":"File synchronization","explanation":"Many cloud-based services are shared across multiple locations. In these cases, it's useful to have critical databases and file systems synchronized so each location will be using the same application data."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Characteristics","link":"https://professormesser.link/1201040202","source":"book"},{"id":"B26","stem":"A security administrator would like to ensure that each login attempt from a smartphone is from someone physically located inside the corporate office. Which of the following would provide this functionality?","choices":[{"letter":"A","text":"Serial interface","explanation":"Serial interfaces are often found as management interfaces on switches, routers, and other infrastructure devices. A serial interface is not commonly used to identify the physical location of a device or person."},{"letter":"B","text":"GPS","explanation":"GPS (Global Positioning System) devices are very useful for mapping travel routes and destinations, and the GPS locations can be used by an application to identify the location of the device"},{"letter":"C","text":"VPN","explanation":"A VPN (Virtual Private Network) is normally used to connect securely across the network to a remote location. Someone using a VPN would not commonly be physically located in the same location as the VPN concentrator."},{"letter":"D","text":"Hotspot","explanation":"A hotspot is a device that provides access to the Internet, usually over an 802.11 link."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Networks","link":"https://professormesser.link/1201010301","source":"book"},{"id":"B27","stem":"A technician is connecting USB interfaces on a computer case to the motherboard. Which of the following would be commonly used for this connectivity?","choices":[{"letter":"A","text":"PCIe","explanation":"PCIe (Peripheral Component Interconnect Express) is a common expansion slot for adapter cards. PCIe interfaces are not commonly used to connect the motherboard with buttons or interfaces on a computer case."},{"letter":"B","text":"eSATA","explanation":"eSATA (External Serial AT Attachment) is commonly used as an external interface for storage devices. An eSATA interface is not used to connect USB interfaces to a motherboard."},{"letter":"C","text":"TPM","explanation":"A TPM (Trusted Platform Module) is cryptographic hardware used on a motherboard to manage encryption keys, digital signatures, and other cryptographic functions. A TPM is not used to connect the USB interfaces on a computer case."},{"letter":"D","text":"Headers","explanation":"A header, or pin header, is a group of pins on the motherboard. These pins provide connectivity to different motherboard features, such as power, lights, peripheral connections, and more"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.5 - Motherboard Connectors","link":"https://professormesser.link/1201030503","source":"book"},{"id":"B28","stem":"A company is building an ARM-based IoT device for the consumer market. Which of the following would be an advantage of using the ARM architecture for this product? (Choose TWO)","choices":[{"letter":"A","text":"Redundancy","explanation":"Although redundancy is an important consideration for any product, the ARM processor does not inherently provide duplicate systems."},{"letter":"B","text":"High speed networking","explanation":"An ARM processor is not a requirement for high speed network connections."},{"letter":"C","text":"Low power use","explanation":"ARM (Advanced RISC [Reduced Instruction Set Computer] Machine) processors use a simplified instruction set for efficient processing using relatively minimal power and heat"},{"letter":"D","text":"NAS","explanation":"A NAS (Network Attached Storage) system usually provides file storage that can be accessed across the network. An ARM processor isn't required for NAS services."},{"letter":"E","text":"Load balancing","explanation":"Load balancing separates a load into multiple instances for redundancy and performance. The ARM architecture does not inherently provide load balancing functionality."},{"letter":"F","text":"Minimal heat","explanation":"ARM (Advanced RISC [Reduced Instruction Set Computer] Machine) processors use a simplified instruction set for efficient processing using relatively minimal power and heat"}],"correct":["C","F"],"multi":true,"objective":"220-1201, Objective 3.5 - CPU Features","link":"https://professormesser.link/1201030508","source":"book"},{"id":"B29","stem":"A manufacturing company uses a specialized printer which connects to a Windows computer over a USB connection. Which of the following would be the best way to allow all Windows devices in the company to send print jobs to this printer?","choices":[{"letter":"A","text":"Connect the printer to an Ethernet switch","explanation":"Although many printers include built-in Ethernet connectivity, this printer appears to connect over a USB cable. There's no mention of an Ethernet interface, so a switch connection would not be available."},{"letter":"B","text":"Configure Windows Printer Sharing","explanation":"Windows Printer Sharing allows the Windows computer to act as a print server. All devices on the network can view the printer and send print jobs to the printer using the Printer Sharing feature"},{"letter":"C","text":"Use Print to File and copy the file to the printer","explanation":"Using Print to File would create a local print file, but that file would need to be manually copied from the Windows computer to the printer. This process would be time consuming and would interrupt the local Windows user each time a print job was needed."},{"letter":"D","text":"Copy the print jobs to a USB drive","explanation":"Similar to the Print to File option, putting the print jobs on a USB drive would require a manual process by the user connected to the printer. This can be easily avoided by enabling Printer Sharing and having the users submit the print jobs themselves."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"B30","stem":"Which of these would commonly be used to connect to an external storage device?","choices":[{"letter":"A","text":"F-connector","explanation":"An F-connector is the screw-on connector commonly associated with coax used for cable television or cable modems. F-connectors and coax are not commonly used to connect external storage devices."},{"letter":"B","text":"ST","explanation":"An ST (Straight Tip) connector is an optical fiber connection and is commonly associated with data center connections or extended length network runs."},{"letter":"C","text":"eSATA","explanation":"eSATA (External Serial ATA) is the external version of the SATA standard. The connectors for eSATA are slightly different than the internal SATA connectors"},{"letter":"D","text":"Molex","explanation":"Molex commonly refers to the four-pin power connection used for internal computer peripherals. Legacy storage devices, fans, and other internal components may use Molex to power the component."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.2 - Storage Cables","link":"https://professormesser.link/1201030206","source":"book"},{"id":"B31","stem":"A company has acquired computers that were previously part of a third-party lease. All of the computers prompt for a password when powering on the system before the operating system will load, but the password was not included with the computers. Which of the following would be the best way to resolve this issue?","choices":[{"letter":"A","text":"Replace the primary storage drive","explanation":"The BIOS password configuration isn't saved on a storage drive, so replacing the drive will not bypass the password."},{"letter":"B","text":"Boot from the Windows installation media","explanation":"The boot password applies to all boot media, including any attempts to boot from an optical drive or USB drive."},{"letter":"C","text":"Reset the BIOS using jumpers on the motherboard","explanation":"The BIOS (Basic Input Output System) of a computer can often be assigned configuration or management passwords to prevent any changes to the BIOS settings. The BIOS also supports a boot or user password, and the system will not boot until the correct password is entered. This password can often be reset by shorting a jumper on the motherboard and restarting"},{"letter":"D","text":"Disconnect the power cable for ten minutes","explanation":"The password and BIOS configuration is saved on the motherboard in non-volatile memory. Disconnecting the power will not reset the password or change the BIOS configuration."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.5 - BIOS Settings","link":"https://professormesser.link/1201030506","source":"book"},{"id":"B32","stem":"A user has complained that a laptop will not charge the battery past 25% percent, and the laptop only operates for fifteen minutes when on battery power. The battery and the AC adapter have already been replaced. Which of the following components would be the most likely cause of this issue?","choices":[{"letter":"A","text":"Motherboard","explanation":"The motherboard on a laptop usually contains all of the major subsystems, including the CPU (Central Processing Unit), memory, video, and power. If the laptop will not charge a battery or power the system, then the entire motherboard will need to be replaced"},{"letter":"B","text":"Backlight inverter","explanation":"A backlight inverter is used on CCFL (Cold Cathode Fluorescent Lamp) displays to convert the internal laptop DC (Direct Current) power source to AC (Alternating Current). The backlight inverter is not part of the laptop's battery charging system."},{"letter":"C","text":"802.11 adapter","explanation":"An 802.11 wireless adapter is usually connected directly to the motherboard, and is responsible for managing the wireless communication to the 802.11 network. A faulty 802.11 adapter would not commonly prevent the laptop battery from charging."},{"letter":"D","text":"CPU","explanation":"The CPU is the primary processor for the laptop. A CPU does not manage the charging process for a laptop battery, and the charging subsystem can operate even when the laptop is completely powered down."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"B33","stem":"A field engineer is working at a remote site that is under construction, but the site does not have an Ethernet or Wi-Fi Internet connection. Which of the following would be the best way to get access to the Internet at this location?","choices":[{"letter":"A","text":"Bluetooth","explanation":"Bluetooth is a useful personal area network (PAN), but it won't provide any Internet access by itself."},{"letter":"B","text":"Hotspot","explanation":"Configuring a mobile phone as a hotspot allows one or more people to use the phone's Internet connection over Wi-Fi. If Internet isn't currently available from another 802.11 wireless network, then using the hotspot feature can provide an option for Internet access"},{"letter":"C","text":"MAN","explanation":"A MAN (Metropolitan Area Network) is a network connecting multiple sites in a single city or metropolitan area. A MAN is usually installed by a network service provider and would not commonly be available to a remote site that's currently under construction."},{"letter":"D","text":"NFC","explanation":"NFC (Near Field Communication) is a short-range networking method designed to send small amounts of data at a time. It's common to use NFC with a smartphone or smart watch to pay for items in a store, but NFC can't be used to gain Internet access through a smartphone."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"B34","stem":"Which of the following would be the most likely reason the finishing function of a printer would punch two holes in a page instead of three?","choices":[{"letter":"A","text":"The incorrect paper tray is selected","explanation":"Many printers include different paper trays and often use different types of paper in each tray. The paper punch occurs after the output is printed, so the choice of paper tray should not cause any issues with the finishing process."},{"letter":"B","text":"The print driver is not configured properly","explanation":"Some large printers include finishing features for adding staples or holes to the final document. If the print driver is not set correctly, these options may be placed in the incorrect location or not used at all. The printer driver may need to be reconfigured or updated to support these finishing features"},{"letter":"C","text":"The printer is low on toner","explanation":"If the printer toner is low, the printer will usually show a \"low toner\" error and the output will print normally. Because the toner is low, the output will usually be a bit more faded than normal. A low toner message would not change the printer's hole punching process."},{"letter":"D","text":"The connection between the computer and the printer is faulty","explanation":"A faulty connection between the computer and printer will usually result in no output or an interruption to the output process. This will not commonly result in problems with the finishing process."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"B35","stem":"A technician is upgrading the RAM on a laptop computer. Which of the following would best describe the memory required for this upgrade?","choices":[{"letter":"A","text":"SSD","explanation":"An SSD (Solid-state Drive) is used as storage on computing devices and is not a RAM (Random Access Memory) technology."},{"letter":"B","text":"SO-DIMM","explanation":"The SO-DIMM (Small Outline Dual In-line Memory Module) form factor is about half the length of standard DIMMs. This smaller size makes it a common option for memory modules in laptop computers where size is limited"},{"letter":"C","text":"Memory card","explanation":"Flash memory cards are commonly used as storage and would not be used as primary system memory on a computer."},{"letter":"D","text":"ECC","explanation":"ECC (Error Correcting Code) memory is a type of RAM that corrects memory errors on the fly. It's common to see ECC RAM used in servers and other important devices, but laptops would not commonly use ECC memory."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.3 - An Overview of Memory","link":"https://professormesser.link/1201030301","source":"book"},{"id":"B36","stem":"A hospital would like to use a hands-free authentication system based on the user's proximity to the computer. Which of the following technologies would be the best choice for this system?","choices":[{"letter":"A","text":"NFC","explanation":"NFC (Near-Field Communication) is a short-distance networking technology which communicates over short distances of approximately 4 centimeters or less. An NFC-based authentication system would recognize when a user comes into close proximity of a device and provide the proper authentication"},{"letter":"B","text":"5G","explanation":"The 5G (Fifth Generation) mobile device technology for mobile devices is designed for wide scale communications and does not provide a granular location-based authentication system."},{"letter":"C","text":"MDM","explanation":"Many organizations will use an MDM (Mobile Device Manager) to provide administration for mobile phones and tablets. The use of an MDM does not provide any hands-free authentication functionality."},{"letter":"D","text":"SSD","explanation":"An SSD (Solid State Drive) is a flash-based storage device, and it's commonly used on many computing devices. However, an SSD does not provide any proximity-based authentication features."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.2 - Wireless Network Technologies","link":"https://professormesser.link/1201020201","source":"book"},{"id":"B37","stem":"An IT department is building out a new floor of office space for the company. Which of the following cables would be the best choice to install in the active airspace above the drop ceiling?","choices":[{"letter":"A","text":"Plenum-rated","explanation":"The plenum space is the area above a drop ceiling used for building air circulation. In the case of a fire, this area should contain objects which have specific characteristics when heated. Network cables in this area are categorized as plenum-rated, and their construction will limit smoke and toxic fumes"},{"letter":"B","text":"Shielded twisted-pair","explanation":"Shielded twisted-pair cables are useful in environments with high amounts of interference. Shielded twisted-pair cabling isn't the first choice for a drop ceiling, and you wouldn't necessarily find more interference in a drop ceiling than in any other network run."},{"letter":"C","text":"Coaxial","explanation":"Coaxial cable is a good choice for network runs that need to be shielded and run in a more durable environment, but the bulk and difficulty of managing large coaxial cable drops would not make it a good choice for most local area networks."},{"letter":"D","text":"PVC jacketed twisted-pair","explanation":"PVC (Polyvinyl chloride) is a common jacket type for twisted-pair cabling, but PVC does not provide any protection or suppression of smoke or chemicals during a fire. PVC jacketed cable would not be a good choice for a plenum."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Network Cables","link":"https://professormesser.link/1201030201","source":"book"},{"id":"B38","stem":"A developer is connecting a laptop to an LCD projector, but the projected image is flickering and occasionally part of the output will appear blocky and difficult to read. Which of the following should resolve this issue?","choices":[{"letter":"A","text":"Replace the projector's video cable","explanation":"The visual \"glitches\" displayed by the LCD projector are often associated with a failure of the digital signal. The only connection between the laptop and the projector is the cable, so most of these issues can be resolved by replacing the faulty cable"},{"letter":"B","text":"Turn the projector off and back on again","explanation":"An LCD (Liquid Crystal Display) projector is displaying what's sent across the video cable, so restarting the projector wouldn't help to resolve the issue. If the problem is associated with a faulty cable, restarting the projector probably won't help either."},{"letter":"C","text":"Update the laptop's video driver","explanation":"Since the video display is working on the laptop, the issue is probably not related to the driver. Replacing or updating the driver would probably not resolve symptoms associated with flickering or signal issues to an external display device."},{"letter":"D","text":"Connect the laptop to a power source","explanation":"A low battery or lack of immediate power source would not cause the screen to display artifacts or glitches. Adding additional power to the laptop will help the laptop battery last longer, but it won't change what's displayed on the screen."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"B39","stem":"A graphics designer needs to connect their macOS computer to a second monitor and an external storage drive. Which of the following interface types would provide this connectivity?","choices":[{"letter":"A","text":"Lightning","explanation":"Apple Lightning connections are use to connect a mobile device to a remote peripheral or computer. Lightning connections are not associated with desktop or laptop computers."},{"letter":"B","text":"DisplayPort","explanation":"As the name implies, DisplayPort connections are commonly used to connect display output devices to computers. DisplayPort is not used to connect external storage devices."},{"letter":"C","text":"DVI-D","explanation":"DVI-D (Digital Visual Interface-Digital) is used to connect display devices and does not support the connection of external storage devices."},{"letter":"D","text":"Thunderbolt","explanation":"The Thunderbolt standard was created by Intel to connect external peripherals to a computer at high speeds. The Thunderbolt standard supports many different peripheral types, including displays, external storage, Ethernet network connections, and many others"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.2 - Peripheral Cables","link":"https://professormesser.link/1201030204","source":"book"},{"id":"B40","stem":"What cloud-based service provides hardware, but still requires the user to setup, configure, and manage the operating system and applications?","choices":[{"letter":"A","text":"SaaS","explanation":"SaaS (Software as a Service) is a complete application offering in the cloud. The customer does not install, manage, or support the applications used with a SaaS deployment."},{"letter":"B","text":"PaaS","explanation":"PaaS (Platform as a Service) is a cloud model for an application framework in the cloud. The customer is responsible for developing their own application based on this cloud-based framework."},{"letter":"C","text":"IaaS","explanation":"IaaS (Infrastructure as a Service) is an option that provides CPU, memory, network connections, and storage, and the customer installs and manages all of the software running on the infrastructure hardware"},{"letter":"D","text":"DaaS","explanation":"DaaS (Desktop as a Service) provides cloud-based desktop access and centralized workstation management."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","source":"book"},{"id":"B41","stem":"Which of the following would be most associated with a SAN?","choices":[{"letter":"A","text":"Bluetooth","explanation":"Bluetooth describes the short-range networks used on many mobile devices. These networks are designed for an individual and are categorized as PANs (Personal Area Networks)."},{"letter":"B","text":"RAID","explanation":"A SAN (Storage Area Network) provides access to a relatively large storage system over the network. RAID (Redundant Array of Independent Disks) is a common method of providing data redundancy for storage systems"},{"letter":"C","text":"APIPA","explanation":"APIPA (Automatic Private IP Addressing) is used by IPv4 to automatically assign a link-local IP addresses when a DHCP (Dynamic Host Configuration Protocol) server is not available. APIPA is not generally associated with a SAN."},{"letter":"D","text":"Cellular","explanation":"The connectivity to a SAN often requires high-speed connections, and most cellular links do not provide the required speed or throughput."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.7 - Network Types","link":"https://professormesser.link/1201020702","source":"book"},{"id":"B42","stem":"A network administrator is using a laptop computer to configure a switch over a direct cable connection. Which of the following would best describe this connectivity?","choices":[{"letter":"A","text":"Bluetooth","explanation":"Bluetooth technology is a popular wireless networking method, and it would not be an option for a wired terminal or management interface connection."},{"letter":"B","text":"Thunderbolt","explanation":"Thunderbolt connections are usually associated with video and peripheral connectivity. Thunderbolt is not a common connection type for management or console interfaces."},{"letter":"C","text":"Serial","explanation":"Most infrastructure devices provide a management or console interface over a serial link. These have traditionally used DB-9 (D-Subminiature size B - 9 pin) interfaces, but newer devices often use USB (Universal Serial Bus) connections"},{"letter":"D","text":"Lightning","explanation":"A Lightning cable is almost exclusively used for connectivity from an Apple iOS smartphone or iPadOS tablet."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.2 - Peripheral Cables","link":"https://professormesser.link/1201030204","source":"book"},{"id":"B43","stem":"A manager in the accounting department is complaining of slow performance on her computer. Initial troubleshooting shows low utilization of CPU and memory. A network speed test reports normal throughput to the local network devices. Which of the following would be the best next step for troubleshooting this issue?","choices":[{"letter":"A","text":"Boot to Safe Mode","explanation":"Booting to Safe Mode would only provide limited information about this slowdown problem, and it would not be able to verify that the underlying hardware was working properly. Before attempting to identify software issues, it would be useful to know if the hardware was operating as expected."},{"letter":"B","text":"Upgrade the BIOS","explanation":"The BIOS of a computer would only require upgrading if there was a significant security requirement or feature enhancement. Most computers will never need a BIOS upgrade, and the BIOS would not commonly be modified when troubleshooting performance issues."},{"letter":"C","text":"Replace the memory modules","explanation":"Bad RAM (Random Access Memory) modules would cause the system to hang, reboot, or cause operating system or application errors. Faulty RAM would not commonly cause a system to perform slower than normal."},{"letter":"D","text":"Perform a hard drive diagnostic","explanation":"If a slowdown is not associated with CPU, memory, or the network, then the issue may be with some other type of hardware. A diagnostic of the hard drive would identify any issues that may be slowing down the computer"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"B44","stem":"A server administrator has moved a database server from a lab to a data center. After installing the server in a data center rack, the system does not power on. None of the system lights are on, and the power supply and cooling fans do not spin up. Which of the following should be the first troubleshooting step for this issue?","choices":[{"letter":"A","text":"Replace the power supply","explanation":"Before replacing hardware, it would be useful to learn more about the issue and what the problem could possibly be."},{"letter":"B","text":"Reseat all of the internal components","explanation":"Before making any changes or moving things inside of the computer, it would be best to gather more information about the problem. Reseating all of the internal components is time consuming and may not be necessary to resolve the issue."},{"letter":"C","text":"Check the power cable","explanation":"When troubleshooting, the easiest possible solution should usually be the first one to check. This particular system has already been in use, and the system administrator was the person who moved it from one location to another. Of the available options, checking the power cable should be the first thing to check when power issues arise"},{"letter":"D","text":"Replace the motherboard","explanation":"There's nothing in this question that indicates that the issue is related to the motherboard. Before changing any hardware, it would be best to check the simple things first."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"B45","stem":"A user is traveling and has enabled airplane mode on their laptop, but they would still like to use their wireless headset. Which of these settings should be enabled to allow this functionality?","choices":[{"letter":"A","text":"Wi-Fi","explanation":"Wireless headsets don't commonly use 802.11 Wi-Fi connectivity, and most headsets will use Bluetooth because of the lower power consumption and shorter distance requirement."},{"letter":"B","text":"USB","explanation":"USB connections are wired links and are not affected by airplane mode."},{"letter":"C","text":"Bluetooth","explanation":"Bluetooth networks are PANs (Personal Area Networks) that provide a short-distance connection to local peripherals. For example, it's common to use a Bluetooth link to connect to headsets, wireless mice, keyboards, or speakers"},{"letter":"D","text":"Cellular","explanation":"Connectivity to cellular networks is useful for Internet or VPN connectivity, but it would not be used for wireless headsets."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"B46","stem":"A user has submitted a job to a network printer, but the printer will not begin to print until the user has typed their PIN on the printer console. Which of the following would best describe this scenario?","choices":[{"letter":"A","text":"Badging","explanation":"Instead of using a PIN, some printers will require a badge to begin the printing process. This is usually integrated into an identification badge and requires the user to physically scan the badge as authentication before printing."},{"letter":"B","text":"Secured prints","explanation":"With secured prints, the user can define a PIN (Personal Identification Number) on their computer, and this PIN must be used on the printer to start the printing process. This process ensures the output is not sitting unattended on the printer"},{"letter":"C","text":"Active Directory","explanation":"Active Directory is a database for centralized user and device management on a Windows-based network. Active Directory does not inherently provide authentication features for printers or individual print jobs."},{"letter":"D","text":"ADF","explanation":"An ADF (Automatic Document Feeder) is often used with copiers or scanners to individually feed large groups of pages into a device without any user intervention."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.7 - Multifunction Devices","link":"https://professormesser.link/1201030701","source":"book"},{"id":"B47","stem":"An error message has appeared when starting up a laptop computer with the message \"SMART Failure Predicted.\" Which of the following would be most related to this notification message?","choices":[{"letter":"A","text":"Storage drive is failing","explanation":"SMART ( Self-Monitoring, Analysis, and Reporting Technology), or S.M.A.R.T., refers to a storage drive monitoring feature integrated with most modern hard drives and solid state drives. A message indicating a SMART error is specific to the storage subsystem of the device"},{"letter":"B","text":"RAM failed a memory diagnostic","explanation":"Although a quick check of RAM (Random Access Memory) is made during the startup process, any resulting errors would not be categorized as a SMART issue."},{"letter":"C","text":"Battery life is below 20%","explanation":"The battery life of a laptop can be impacted when running without main power. Problems with the battery are usually identified in the operating system and would not be displayed as a SMART failure."},{"letter":"D","text":"Network connectivity is intermittent","explanation":"Intermittent network connectivity can impact uptime and availability, but a network communication issue would not be identified as a SMART error."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"B48","stem":"A system administrator needs to install an access point using PoE. However, the installed Ethernet switch does not support any PoE interfaces. Which of the following would be the best way to provide PoE functionality?","choices":[{"letter":"A","text":"Use a different access point","explanation":"The goal of PoE is to provide power to a device in an area where a traditional power connection would be difficult or impossible. Replacing the access point would not solve the problem of powering the access point."},{"letter":"B","text":"Replace the switch with a router","explanation":"Switches and routers manage different parts of the communication process, and it's not possible to simply replace a router with a switch without making some changes to the underlying network infrastructure. Adding a router would also not generally provide any PoE functionality."},{"letter":"C","text":"Upgrade the switch's power supply","explanation":"The power supply of a switch is almost always configured to support all features of the switch without requiring an upgrade. Upgrading or modifying the switch power supply would not add PoE functionality to the switch."},{"letter":"D","text":"Add an injector","explanation":"An injector sits inline with an existing wired Ethernet connection to add PoE (Power over Ethernet) voltage to the existing Ethernet cable"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"B49","stem":"A network administrator is capturing all network traffic from a specific NIC. Which of the following would best describe the unique network identifier associated with this NIC?","choices":[{"letter":"A","text":"MAC address","explanation":"The MAC (Media Access Control) address is a unique identifier burned- in to the NIC (Network Interface Card) hardware. All traffic sent over the network from this device contains the MAC address of this NIC"},{"letter":"B","text":"APIPA","explanation":"An APIPA (Automatic Private IP Address) is temporarily assigned to a device if an IP address has not been manually configured and a DHCP server is not available to provide IP addresses. An APIPA address is not a unique identifier associated with a NIC."},{"letter":"C","text":"Serial number","explanation":"A NIC might have a unique serial number, but that serial number is not used as a network identifier. MAC addresses are always used as network- level identification, regardless of what other serial numbers or identifiers may be associated with the NIC."},{"letter":"D","text":"Subnet mask","explanation":"A device uses the subnet mask to determine its IP subnet. Subnet masks are not unique, and they don't provide any network identification functionality."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"B50","stem":"An organization has implemented a cloud solution using a third-party data center. Access to the cloud service is available to anyone on the Internet. Which of the following describes this deployment model?","choices":[{"letter":"A","text":"Hybrid","explanation":"Some organizations will provide services to everyone over a public cloud, but provide internal company services on their own private cloud. This type of model is a hybrid cloud deployment."},{"letter":"B","text":"Public","explanation":"Public cloud deployments are for organizations that would like to provide services to anyone on the Internet. Google Mail is an example of a public cloud service"},{"letter":"C","text":"Community","explanation":"Purchasing and maintaining an infrastructure of cloud resources can be costly, so one common way to split the cost across several organizations is to combine their resources into a community cloud deployment model."},{"letter":"D","text":"Private","explanation":"A private cloud deployment consists of internal resources that are only available to a limited group or single company."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Models","link":"https://professormesser.link/1201040201","source":"book"},{"id":"B51","stem":"What voltages would be commonly found on a motherboard's power supply connector?","choices":[{"letter":"A","text":"120 V AC","explanation":"One hundred and twenty volts of alternating current (AC) is a common power configuration from the wall outlet to the power supply input. Alternating current is not provided at the motherboard power supply connection."},{"letter":"B","text":"12 V AC, 5 V AC, 3.3 V AC","explanation":"A motherboard power supply connector does not receive alternating current from the power supply."},{"letter":"C","text":"12 V DC, 5 V DC, 3.3 V DC","explanation":"A computer's power supply provides direct current (DC) at twelve volts, five volts, and 3.3 volts"},{"letter":"D","text":"120 V DC","explanation":"A computer motherboard and the associated components do not require one hundred and twenty volts of direct current."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.6 - Power","link":"https://professormesser.link/1201030601","source":"book"},{"id":"B52","stem":"A user is reporting this message on their Windows computer taskbar icon: \"Limited or No connectivity.\" Which of the following would be the best next troubleshooting step?","choices":[{"letter":"A","text":"Check the local IP address configuration","explanation":"The message of limited connectivity is usually based on a system with no access to network resources. This is often occurs when a system is unable to contact a DHCP (Dynamic Host Configuration Protocol) server and instead assigns itself an APIPA (Automatic Private IP Addressing) address. A check of the local IP address may identify a configuration error or a link-local address"},{"letter":"B","text":"Restart the computer","explanation":"Restarting the computer might be a good troubleshooting task once the root cause of the issue is identified, but it's not the first step in the troubleshooting process."},{"letter":"C","text":"Ping the default gateway","explanation":"Pinging the default gateway would probably be a good option once the initial network configuration was validated, but it would not be the next step in the list of troubleshooting tasks."},{"letter":"D","text":"Check the switch VLAN configuration","explanation":"Most switch VLAN configurations don't change, so verifying the VLAN details would probably not be the next step for troubleshooting."},{"letter":"E","text":"Check for a duplicate IP address","explanation":"Most operating systems will identify duplicate error messages with a clear notification that a duplicate has been identified on the network."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"B53","stem":"What kind of device is installed into a computer and directly connects the computer to an Ethernet network?","choices":[{"letter":"A","text":"NIC","explanation":"A NIC (Network Interface Card) is the hardware used to connect a device to a network. Some NICs are integrated into computer motherboards, and other NICs are separate interface cards"},{"letter":"B","text":"Switch","explanation":"A switch is a network infrastructure device. Switches are not installed into computer systems."},{"letter":"C","text":"Repeater","explanation":"Repeaters are infrastructure devices which receive network signals, regenerate the signals, and resend those signals to the next network segment. Repeaters are not usually installed into computers."},{"letter":"D","text":"Bridge","explanation":"Bridges were devices used prior to the introduction of switches, and bridges are not installed into computers."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"B54","stem":"A network administrator is planning to connect the network of two buildings together with a Category 6A cable. Ten Ethernet cables have been run from a wiring closet, through a conduit, and into a wiring closet on the other side. The network administrator needs to identify the ends of the cables so they can be properly terminated on each side. Which of the following should be used to complete this task?","choices":[{"letter":"A","text":"Cable stripper","explanation":"A cable stripper is used to remove the outer layer of a cable and prepare it for the crimping process."},{"letter":"B","text":"Loopback plug","explanation":"Loopback plugs are commonly used to troubleshoot physical network interfaces. Loopback plugs aren't used for identifying cable runs."},{"letter":"C","text":"Tone generator","explanation":"A tone generator places an analog audio tone onto the wires of a cable, and an inductive probe is used on the other end to precisely identify the cable with the tone. By moving the tone generator to each of the ten cables, the other end of the cable can be easily identified and labeled"},{"letter":"D","text":"Crimper","explanation":"A crimper is used to attach modular connectors to the ends of cables. Crimpers aren't used to locate the two ends of a cable run."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.8 - Network Tools","link":"https://professormesser.link/1201020801","source":"book"},{"id":"B55","stem":"A server administrator has configured a database server with a RAID 0 array containing four hard drives. An error notification from the RAID controller states that disk 3 has failed. Which of the following would be the BEST way to address this disk failure?","choices":[{"letter":"A","text":"Replace the drive and re-mirror the array","explanation":"Since a portion of the data is lost when the RAID 0 drive failed, there's no way to re-mirror the lost data. The RAID 0 data must be restored from backup."},{"letter":"B","text":"Replace the drive and resynchronize the array","explanation":"A RAID 5 array would maintain parity information if a drive was lost, and RAID 5 data would only need to be resynchronized after replacing the bad drive. Unfortunately, when a RAID 0 drive fails, data is lost and must be restored from backup."},{"letter":"C","text":"Replace the drive and restore from backup","explanation":"RAID 0 (Redundant Array of Independent Disks, Level 0) provides an efficient storage method at the expense of redundancy. Data in RAID 0 is striped across multiple drives, and if one drive is lost the data in the array is also lost. To repair a failed RAID 0 array, the bad drive will need to be replaced and all of the data must be restored from a backup"},{"letter":"D","text":"Replace all drives and restore from backup","explanation":"Only the bad drive would need to be replaced when recovering from any drive failure with RAID arrays."},{"letter":"E","text":"Replace all drives and resynchronize the array","explanation":"Only the bad drive would need to be replaced when recovering from any drive failure with RAID arrays. Replacing perfectly good drives would be an unnecessary and costly step."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"B56","stem":"A company is installing a new communications link using SC interfaces. Which of the following would best describe this connection?","choices":[{"letter":"A","text":"Fiber optic","explanation":"An SC (Subscriber Connector) interface is a common fiber optic connection type. Some network administrators refer to this connection as the \"square connector\" due to the unique shape of the interface"},{"letter":"B","text":"USB-C","explanation":"The USB-C (Universal Serial Bus Type-C) interface is the name of the connection used for many different types of signals, including USB, Thunderbolt, and others. The USB-C interface is not associated with the SC connector type."},{"letter":"C","text":"10GBASE-T","explanation":"10GBASE-T is the Ethernet standard for 10 gigabit per second Ethernet over twisted pair copper wiring. Fiber optic SC connectors would not be used for a twisted pair copper network connection."},{"letter":"D","text":"M.2","explanation":"The M.2 interface is a motherboard interface specification and is not associated with fiber optic links or SC connectors."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Fiber Connectors","link":"https://professormesser.link/1201030209","source":"book"},{"id":"B57","stem":"A technician believes the photosensitive drum on a network
