8C (eight position, eight conductor) interfaces, commonly used for copper/wired Ethernet network connections."},{"label":"Picture 3","correct":["HDMI","Connect to a monitor"],"explanation":"HDMI is a common video connection type used across computing devices, LCD projectors, and display monitors."},{"label":"Picture 4","correct":["SC","Run fiber to a building"],"explanation":"Fiber connections may use SC (Subscriber Connector) connections to attach the fiber run to a network device."},{"label":"Picture 5","correct":["DB-9","Use a console interface"],"explanation":"DB-9 connectors can be used to communicate with modems, firewalls, servers, console interfaces, and other serial devices."},{"label":"Picture 6","correct":["USB-C","Use an external SSD"],"explanation":"USB-C connections are commonly used to connect and power external devices. The USB-C connector is reversible, so it can be inserted without a particular orientation."}],"objective":"220-1201, Objective 3.2 - Copper Connectors","gallery":[{"label":"1","key":"conn_lightning"},{"label":"2","key":"conn_rj45"},{"label":"3","key":"conn_hdmi_plug"},{"label":"4","key":"conn_sc"},{"label":"5","key":"conn_db9_f"},{"label":"6","key":"conn_usbc"}]},{"id":"A2","type":"order","prompt":"A technician is crimping an RJ45 connector using the T568B color standard. Place the wire colors in the correct pin order (pin 1 through pin 8).","items":["Green","Blue / White","Orange","Brown","Green / White","Orange / White","Blue","Brown / White"],"correct":["Orange / White","Orange","Green / White","Blue","Blue / White","Green","Brown / White","Brown"],"explanation":"Most organizations standardize on either the T568A or T568B color scheme. It's important to maintain the same standard cabling and color scheme on both sides of an Ethernet connection.","objective":"220-1201 - Section 3.2 - 568A and 568B Colors","source":"book"},{"id":"A3","type":"match","prompt":"Match the port number to the protocol. Not all port numbers will be used.","pool":["tcp/389","tcp/80","tcp/110","tcp/3389","tcp/25","tcp/445","udp/67","tcp/143","tcp/22","tcp/23","udp/53","tcp/443"],"prompts":[{"text":"HTTPS - Hypertext Transfer Protocol Secure","correct":"tcp/443","explanation":"HTTPS carries encrypted web traffic on tcp/443. Plain HTTP is tcp/80, which was one of the unused numbers."},{"text":"LDAP - Lightweight Directory Access Protocol","correct":"tcp/389","explanation":"LDAP reads and searches a network directory, such as Active Directory, on tcp/389."},{"text":"DNS - Domain Name System","correct":"udp/53","explanation":"DNS resolves names (FQDNs) to IP addresses. The book lists it as udp/53."},{"text":"IMAP - Internet Message Access Protocol","correct":"tcp/143","explanation":"IMAP reads email that stays on the mail server, on tcp/143. POP3 (tcp/110) is the other mail-retrieval protocol and was unused here."},{"text":"SMB - Server Message Block","correct":"tcp/445","explanation":"SMB shares files and printers between Windows systems on tcp/445."},{"text":"RDP - Remote Desktop Protocol","correct":"tcp/3389","explanation":"RDP views and controls a remote Windows desktop on tcp/3389."},{"text":"SSH - Secure Shell","correct":"tcp/22","explanation":"SSH gives an encrypted terminal connection on tcp/22. Telnet (tcp/23) does the same job with no encryption and was unused here."}],"unused":["tcp/80","tcp/110","udp/67","tcp/23","tcp/25"],"objective":"220-1201, Objective 2.1 - Common Ports","source":"book","note":"Unused numbers: tcp/80 is HTTP, tcp/110 is POP3, udp/67 is DHCP, tcp/23 is Telnet and tcp/25 is SMTP. The book suggests building your own firewall rules in Windows Firewall (or a similar firewall) for some of these ports. Working with the numbers makes them much easier to remember."},{"id":"A4","type":"imagematch","source":"book","prompt":"Identify each labeled component on this motherboard (A through F).","questionImageKeys":["A4_q"],"columns":["Component"],"pools":[["CPU","Memory slots","Main Power","PCI Express slot","SATA interfaces","Headers"]],"rows":[{"label":"A","correct":["CPU"],"explanation":"The large square socket near the top-left holds the CPU."},{"label":"B","correct":["Memory slots"],"explanation":"The row of long parallel slots holds the memory (RAM) modules."},{"label":"C","correct":["Main Power"],"explanation":"The large multi-pin white connector at the edge is the main power connector from the power supply."},{"label":"D","correct":["PCI Express slot"],"explanation":"PCI Express slots are the expansion slots used for graphics cards and other add-in cards."},{"label":"E","correct":["SATA interfaces"],"explanation":"The small right-angle connectors are SATA interfaces used to attach storage devices."},{"label":"F","correct":["Headers"],"explanation":"Headers are the small pin blocks used for front-panel buttons, LEDs, USB, and audio connections."}],"objective":"220-1201, Objective 3.5 - Motherboard Connections"},{"id":"A5","type":"match","prompt":"Match the symptoms to the most likely resolution.","pool":["Replace the display","Disable time-of-day color shifting","Monitor input is incorrect","Replace the video data cable","Increase the scaling percentage","Clean dust from the air filters","Non-native resolution is configured"],"prompts":[{"text":"The laptop is on, but a connected external monitor is blank","correct":"Monitor input is incorrect","explanation":"Many monitors have several inputs, such as HDMI, DisplayPort and VGA. If the laptop is plugged into the HDMI port but the monitor is set to accept DisplayPort, the screen stays blank until the input is changed on the monitor."},{"text":"The LCD display output is fuzzy and isn't as crisp as other displays","correct":"Non-native resolution is configured","explanation":"An LCD has a fixed number of horizontal and vertical pixels, called its native resolution. If the computer outputs a different resolution, the picture often looks fuzzy and can be hard to read. Setting the native resolution fixes it."},{"text":"The colors on the screen look different than the actual printed colors","correct":"Disable time-of-day color shifting","explanation":"Many operating systems change the color temperature by time of day. At night the amount of blue light is reduced, which changes how colors look on screen compared with a printed page."},{"text":"The image on the screen is visible after the app is closed","correct":"Replace the display","explanation":"An image left on a monitor for a long time can burn in and stay behind as a faded copy after the original is gone. Extensive burn-in cannot be reversed, so the display has to be replaced."},{"text":"The icons on the screen are very small","correct":"Increase the scaling percentage","explanation":"On 4K and larger displays, text and icons can look very small at the default scaling. Increasing the scaling percentage (200% or more is common on large, high-resolution displays) makes on-screen objects bigger."},{"text":"An LCD monitor occasionally will turn completely black for three seconds","correct":"Replace the video data cable","explanation":"Digital video needs a reliable connection between the computer and the monitor. If the signal is not received properly, the picture looks blocky or the screen goes completely black. Replacing the cable often fixes it."},{"text":"An LCD projector turns off after less than 5 minutes of use","correct":"Clean dust from the air filters","explanation":"The bulb in an LCD projector is very bright and makes a lot of heat, so a fan pulls cool air through it. If the air filter is clogged or the fan is not running, the projector overheats and turns itself off to avoid damage."}],"unused":[],"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","source":"book"}],"B":[{"id":"B1","type":"match","prompt":"Match the printer issue to the best troubleshooting task. Not all troubleshooting options will be used.","pool":["Update the printer driver configuration","Replace the fuser assembly","Restart the print spooler","Print a test page from the printer console","Clean the pickup rollers","Replace the toner cartridge","Clean the print heads","Change the page description language"],"prompts":[{"text":"Laser printer output is faded and difficult to read","correct":"Replace the toner cartridge","explanation":"Laser printers use heat and pressure to permanently attach toner to the page. As the toner in the cartridge runs low, the output progressively fades until the toner is completely gone."},{"text":"Every page printed on an inkjet printer is garbled text","correct":"Change the page description language","explanation":"A page full of garbled text often means the printer is set to one page description language while the print job uses a different one. The result is a page of unusual graphics characters and garbled text."},{"text":"Almost every page jams inside of a network laser printer","correct":"Clean the pickup rollers","explanation":"The pickup rollers grab a single page from the paper tray and feed it through the printer. If more than one page feeds at once, or pages keep jamming, the pickup rollers may need cleaning or replacing."},{"text":"Five print jobs are sitting in the print queue and not printing","correct":"Restart the print spooler","explanation":"The print spooler receives, queues and sends print jobs to the printer. If it has crashed or hung, the best practice is to remove any problem jobs and restart the print spooler."},{"text":"The printer trays do not match the paper options in the application","correct":"Update the printer driver configuration","explanation":"The printer driver lives on the user's computer and supplies the list of printer options and paper tray settings. If the driver is wrong or misconfigured, the options in the application may not match the real printer. Using the correct driver, or updating its configuration, usually fixes it."},{"text":"An inkjet printer outputs unwanted lines across the printed page","correct":"Clean the print heads","explanation":"Inkjet ink tends to clog the print heads and leave streaks of ink across the page. Most printers run an automatic cleaning each day, but a manual cleaning, or replacing the print heads or cartridges, may be needed."}],"unused":["Replace the fuser assembly","Print a test page from the printer console"],"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","source":"book"},{"id":"B2","type":"imagematch","source":"book","prompt":"Match each pictured interface with its name and most common use (pictures 1 to 6).","columns":["Interface name","Common use"],"pools":[["F connector","SATA","HDMI","Molex","DB-9","RJ11"],["Install a cable modem","Connect an SSD","Replace an external monitor","Add power for internal fans","Connect to a switch console","Replace a DSL modem"]],"rows":[{"label":"Picture 1","correct":["F connector","Install a cable modem"],"explanation":"An F connector is commonly associated with coaxial cable, and is a common cable type for cable modem installations."},{"label":"Picture 2","correct":["SATA","Connect an SSD"],"explanation":"SATA connectors attach storage devices to a motherboard. A single SATA connector supports one device, commonly hard drives and SSDs."},{"label":"Picture 3","correct":["HDMI","Replace an external monitor"],"explanation":"HDMI is a video standard common for displays, televisions, and monitors, connecting directly to a similar HDMI connector on the display."},{"label":"Picture 4","correct":["Molex","Add power for internal fans"],"explanation":"A Molex connector is provided by desktop power supplies to power internal devices - hard drives, SSDs, case fans, and more."},{"label":"Picture 5","correct":["DB-9","Connect to a switch console"],"explanation":"DB-9 serial interfaces were used extensively prior to USB. Many legacy infrastructure devices still use DB-9 for console access over serial."},{"label":"Picture 6","correct":["RJ11","Replace a DSL modem"],"explanation":"RJ11 is the standard modular connector for analog telephones. DSL uses phone lines for Internet, so RJ11 connects existing phone lines to a DSL modem."}],"objective":"220-1201, Objective 3.2 - Peripheral Cables","gallery":[{"label":"1","key":"conn_f"},{"label":"2","key":"conn_sata"},{"label":"3","key":"conn_hdmi_port"},{"label":"4","key":"conn_molex_black"},{"label":"5","key":"conn_db9_m"},{"label":"6","key":"conn_rj11"}]},{"id":"B3","type":"match","prompt":"Choose the best network tool. Not all tools will be used.","pool":["Crimper","Cable stripper","Toner probe","Punchdown tool","Cable tester","Loopback plug","Network tap"],"prompts":[{"text":"Locate one cable inside of a bundle of fifty cables","correct":"Toner probe","explanation":"A toner probe is two separate parts: a tone generator attached to one end of the cable, and an inductive probe used to find the other end. The probe picks up the tone quickly, even in a large bundle of cables."},{"text":"Verify the connected pins on both sides of an Ethernet cable","correct":"Cable tester","explanation":"A cable tester runs a continuity test through a network cable to build a simple wire map of the pins."},{"text":"Fasten an RJ45 connector to a Category 6 cable","correct":"Crimper","explanation":"A crimper physically attaches the connector to the end of a network cable. Crimpers are available for RJ45, RJ11, coax and other connector types."},{"text":"Capture a network conversation to measure bandwidth usage","correct":"Network tap","explanation":"A network tap intercepts network traffic and sends a copy of it to a packet capture or similar device."},{"text":"Perform a diagnostic test on a router interface","correct":"Loopback plug","explanation":"A loopback plug sends an outgoing signal straight back into the same interface. It is commonly used for diagnostics, to confirm that what is sent matches what is received."}],"unused":["Cable stripper","Punchdown tool"],"objective":"220-1201, Objective 2.8 - Network Tools","source":"book"},{"id":"B4","type":"imagematch","source":"book","prompt":"Fill in the blank with the name of each RAID configuration shown (top to bottom).","questionImageKeys":["B4_q"],"columns":["RAID level"],"pools":[["RAID 0","RAID 1","RAID 5","RAID 6","RAID 10"]],"rows":[{"label":"Diagram 1 (top)","correct":["RAID 5"],"explanation":"Striping with parity distributed across all drives is RAID 5, which survives a single drive failure."},{"label":"Diagram 2","correct":["RAID 1"],"explanation":"A straight mirror of identical blocks across two drives is RAID 1."},{"label":"Diagram 3","correct":["RAID 10"],"explanation":"Striping across mirrored pairs combines both techniques - this is RAID 10 (a stripe of mirrors)."},{"label":"Diagram 4 (bottom)","correct":["RAID 0"],"explanation":"Striping alone with no mirror and no parity is RAID 0 - fast, but with no redundancy."}],"objective":"220-1201, Objective 3.4 - RAID"},{"id":"B5","type":"match","prompt":"Match these network protocols to their description. Not all protocols will be used.","pool":["SMB","SSH","LDAP","IMAP","Telnet","SMTP","HTTPS","POP3","RDP","DHCP","DNS","FTP"],"prompts":[{"text":"Control the desktop of a remote computer","correct":"RDP","explanation":"RDP (Remote Desktop Protocol) is used to view and control the desktop of a remote device. It is commonly associated with controlling a computer running a Microsoft operating system."},{"text":"Send email messages from a mobile device","correct":"SMTP","explanation":"SMTP (Simple Mail Transfer Protocol) sends messages from a device, or transfers email between mail servers, over tcp/25."},{"text":"Logins use a centralized authentication server","correct":"LDAP","explanation":"LDAP (Lightweight Directory Access Protocol) is a standard protocol for accessing information in a network directory. It is common on authentication servers, and it is built into Microsoft Active Directory."},{"text":"Automatically assign IP addresses","correct":"DHCP","explanation":"DHCP (Dynamic Host Configuration Protocol) is the main protocol for automating IP addresses, subnet masks and other network settings. It uses both udp/67 and udp/68."},{"text":"Resolve an IP address from an FQDN","correct":"DNS","explanation":"DNS (Domain Name System) converts between an FQDN (fully qualified domain name) and an IP address, so we can refer to devices by name instead of typing an IPv4 or IPv6 address each time."},{"text":"Print from Windows to a network printer","correct":"SMB","explanation":"SMB (Server Message Block) is commonly used on Windows systems to share files and printers over tcp/445."},{"text":"Encrypt a terminal connection","correct":"SSH","explanation":"SSH (Secure Shell) connects to a terminal screen over an encrypted channel using tcp/22. Telnet does the same job with no encryption."}],"unused":["IMAP","Telnet","HTTPS","POP3","FTP"],"objective":"220-1201, Objective 2.1 - Common Ports","source":"book"}],"C":[{"id":"C1","type":"match","prompt":"Match the best network technology to the description.","pool":["ONT","Patch panel","Access point","Firewall","Router","Switch","Cable modem","PoE injector"],"prompts":[{"text":"Forward traffic over the network based on the destination MAC address","correct":"Switch","explanation":"A switch makes all of its forwarding decisions based on the destination MAC address in the Ethernet frame."},{"text":"Create a wireless guest network for visitors","correct":"Access point","explanation":"An access point provides a bridge between a wired Ethernet network and an 802.11 wireless network."},{"text":"Allow or deny the flow of traffic through the network","correct":"Firewall","explanation":"A switch or router can be set up with some traffic-control features, but the best choice from this list is a network firewall."},{"text":"Physically connect incoming and outgoing network cables","correct":"Patch panel","explanation":"A patch panel is commonly used to terminate connections between network runs."},{"text":"Provide power for Ethernet-connected security cameras","correct":"PoE injector","explanation":"PoE (Power over Ethernet) carries power over existing Ethernet cables. A PoE injector adds power if a switch isn't already providing the voltage."},{"text":"Convert from a fiber-based ISP to an internal copper network","correct":"ONT","explanation":"An ONT (Optical Network Terminal) is installed at the demarcation point between the service provider's fiber optic network and the internal copper network."},{"text":"Forward traffic based on the destination IP address","correct":"Router","explanation":"Routers make forwarding decisions based on the destination IP address in the IP header of a packet."},{"text":"Connect to an ISP over coax","correct":"Cable modem","explanation":"A cable modem connects to the ISP over coax. They are often all-in-one devices that terminate the cable Internet link, route traffic to a private internal network, and connect internal devices through a built-in switch."}],"unused":[],"objective":"220-1201, Objective 2.5 - Network Devices","source":"book"},{"id":"C2","type":"match","prompt":"Select the most likely cause for the following symptoms. Some possible causes will not be used.","pool":["CPU cooling fan is not running","Hard drive is failing","Motherboard battery depleted","OS not installed on boot drive","Faulty RAM","Damaged Ethernet cable","Power supply failure","Capacitor has failed"],"prompts":[{"text":"During startup, a computer beeps twice and shows a blank screen","correct":"Faulty RAM","explanation":"During startup the BIOS runs a quick hardware diagnostic called the POST (Power On Self Test). Beeps with a blank screen mean POST found a problem before video started, and in this question the cause is the memory. (Beep patterns differ by BIOS vendor.)"},{"text":"When power button is pressed, a computer is quiet with a blank screen","correct":"Power supply failure","explanation":"The power supply provides all of the voltages the motherboard and other components need. If the system gets no power at all, the power supply may have failed completely."},{"text":"The computer makes a grinding noise when saving documents","correct":"Hard drive is failing","explanation":"There should never be grinding noises inside a computer. Most modern components are solid-state with few moving parts, but a hard drive has many moving parts that can eventually fail. If the odd noises only happen when the storage drive is accessed, the drive is the likely cause."},{"text":"The computer randomly powers off multiple times a day","correct":"CPU cooling fan is not running","explanation":"If a computer works normally and then abruptly powers down, the most likely issue is thermal. Most computers shut down automatically when they get too hot, and a failed cooling fan could easily cause that."},{"text":"The PC makes a popping noise and immediately turns off","correct":"Capacitor has failed","explanation":"There are many capacitors on a motherboard and inside individual components. A failing capacitor can make whistling or popping noises. A loud pop followed by an immediate shutdown most likely points to a capacitor."},{"text":"A laptop occasionally shows an incorrect date and time","correct":"Motherboard battery depleted","explanation":"Most motherboards include a battery that powers the onboard clock, which keeps the date and time while the computer is unplugged. If the date and time are wrong at power-on, the battery on the motherboard is the most likely cause."}],"unused":["OS not installed on boot drive","Damaged Ethernet cable"],"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","source":"book"},{"id":"C3","type":"imagematch","source":"book","prompt":"Match each pictured interface (A through F) with the most applicable device.","columns":["Most applicable device"],"pools":[["Keyboard and mouse","Analog video to LCD projector","External SATA drive","Switch connection between buildings","Digital video to OLED display","Internal optical drive"]],"rows":[{"label":"Picture A","correct":["Digital video to OLED display"],"explanation":"DisplayPort connections send digital signals to video output devices. Unlike VGA, all DisplayPort data is sent digitally."},{"label":"Picture B","correct":["External SATA drive"],"explanation":"SATA focuses on internal storage, but the eSATA (External SATA) connector is used for devices outside the computer case."},{"label":"Picture C","correct":["Internal optical drive"],"explanation":"A Molex connector provides power to internal devices such as hard drives, optical drives, and fans, directly from the power supply."},{"label":"Picture D","correct":["Keyboard and mouse"],"explanation":"USB Type A connectors are often used to connect peripherals such as keyboards, mice, printers, and other wired devices."},{"label":"Picture E","correct":["Analog video to LCD projector"],"explanation":"VGA uses a 15-pin connector to provide analog video. Though a legacy format, many devices still support VGA connections."},{"label":"Picture F","correct":["Switch connection between buildings"],"explanation":"Connections exceeding 100 meters often require fiber. The LC (Lucent Connector) is a common fiber type for switches, routers, and servers."}],"objective":"220-1201, Objective 3.2 - Peripheral Cables","gallery":[{"label":"A","key":"conn_displayport"},{"label":"B","key":"conn_esata"},{"label":"C","key":"conn_molex_wires"},{"label":"D","key":"conn_usba"},{"label":"E","key":"conn_vga"},{"label":"F","key":"conn_lc"}]},{"id":"C4","type":"order","prompt":"Place these Bluetooth pairing steps in the correct order.","items":["Find a device for pairing","Enable Bluetooth","Enter the appropriate PIN code","Enable pairing","Test connectivity"],"correct":["Enable Bluetooth","Enable pairing","Find a device for pairing","Enter the appropriate PIN code","Test connectivity"],"stepExplanations":["The pairing process starts with enabling or confirming that Bluetooth is turned on for both devices - nothing else can happen until the radio is active.","For a device to appear as available to others, it must be placed into pairing mode. This is sometimes done through a menu, or with specific keystrokes or buttons.","The other Bluetooth device should now see the pairing device in its available list, and can select it for authentication in the next step.","The pairing process includes a security measure to confirm the device you're adding is the correct one, usually by entering or confirming a PIN code.","After pairing completes, confirm the devices actually communicate as expected - pairing successfully doesn't automatically guarantee the intended function works."],"explanation":"Bluetooth pairing follows a consistent sequence: turn the radio on, make the device discoverable, find it from the other device, authenticate with a PIN, then verify it works.","objective":"220-1201, Objective 1.3 - Mobile Device Connectivity","source":"book"},{"id":"C5","type":"command","autoCheck":"ports","prompt":"Fill in the blank with the applicable port number(s) for each task.","subtasks":[{"label":"Task 1","prompt":"Map a drive to a remote Windows share","answer":"445","explanation":"The Windows operating system uses SMB (Server Message Block) on TCP port 445 to map shared drives, transfer print jobs and perform numerous file system operations across the network."},{"label":"Task 2","prompt":"Transfer a file between Linux and Windows (two ports)","answer":"20, 21","explanation":"FTP (File Transfer Protocol) uses TCP ports 20 and 21 to transfer files to any device acting as an FTP server. This commonly lets different operating systems transfer files directly to each other over the network."},{"label":"Task 3","prompt":"View and control a remote Windows computer","answer":"3389","explanation":"RDP (Remote Desktop Protocol) provides remote control services for Windows computers using port 3389 over TCP. For example, an administrator can use RDP to control the mouse and keyboard of a remote server, workstation or other Windows-based computer."},{"label":"Task 4","prompt":"Connect to a console over an insecure connection","answer":"23","explanation":"Telnet was one of the first remote console protocols and allows terminal access to devices elsewhere on the network. It provides no privacy or encryption, so everything sent or received can easily be read with a protocol analyzer. Telnet uses TCP port 23."},{"label":"Task 5","prompt":"Send data to a web server over an encrypted channel","answer":"443","explanation":"A web server can send and receive encrypted data using HTTPS (Hypertext Transfer Protocol Secure) over TCP port 443. Ideally, all web server traffic should use HTTPS."},{"label":"Task 6","prompt":"Automatically assign an IP address to a device (two ports)","answer":"67, 68","explanation":"During startup a computer often leases an IP address from a DHCP (Dynamic Host Configuration Protocol) server. That conversation takes place over UDP port 67 and UDP port 68."}],"objective":"220-1201, Objective 2.1 - Common Ports","source":"book"}]},"images":{"conn_lightning":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA4KCw0LCQ4NDA0QDw4RFiQXFhQUFiwgIRokNC43NjMuMjI6QVNGOj1OPjIySGJJTlZYXV5dOEVmbWVabFNbXVn/2wBDAQ8QEBYTFioXFypZOzI7WVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVn/wgARCACGAQQDASIAAhEBAxEB/8QAGgABAAMBAQEAAAAAAAAAAAAAAAECAwQFBv/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAAB+kAAAAAAAAAAAAAAAAAAAeXie08Sp7rwx7jwoPcjk6EuoNGY0ZjRmNGY0ZyXnOxcKAAAy1xOBryxeMuyvDTCCT2+vj6S6guoLqC6guoLqi851OmeTQ3YjZiNgrHbE5uTr8mXq6vK9U8WtouUxY9jfDZEwJQJQJQJQJQLUmhfXHQuqWyo6ArDfnMOLu4ZXVz7njxK5i1bHs657JVIhIhIhIhIhIjPXMjTHQupJKB2hpjsPLp0c5OWlTzY9KE823cO7WkllSWVFlRZUWVFlRa+Wy6TJYSISAAAAAAKRoM2gzaDNoTNoM2gzaDO1igAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/8QAJhAAAAUEAgIBBQAAAAAAAAAAAAECAxEEEjAzFDIgMRATIUBgcP/aAAgBAQABBQL9OkSJEiRIkSJEiRIkSJxrqfv9dQ5ChyjHKMcoxyjHKMMKvRmLC50p0kFVbSVFWMmdUgrfCm05iwu9GNa1vXEt26p0+FPqEiRIkSJEiRIkT8q9Fgd6MdFIduSh6ajT4MasyvRYHejGtfEvRxL6jV ."},{"id":"ports","title":"Ports & protocols","blurb":"All fourteen core ports three ways (name to number, number to job, grouped by job), a fast quiz, and an extras section."},{"id":"cables","title":"Cables & connectors","blurb":"Connector photos from the book, what each connector is for, T568 wire colors, copper and fiber cable types, USB and Thunderbolt, and network tools."},{"id":"network","title":"Networking","blurb":"Devices, connection types, network sizes, IP address types, Wi-Fi bands, DNS and email protections."},{"id":"hardware","title":"Hardware","blurb":"Printers and multifunction devices, power connectors, displays, laptop parts, BIOS settings and memory."},{"id":"mobile","title":"Mobile devices","blurb":"Bluetooth, NFC, hotspots and airplane mode."},{"id":"cloud","title":"Cloud & virtualization","blurb":"Service models, deployment models, cloud traits, hypervisors and containers."},{"id":"trouble","title":"Troubleshooting (28% of the exam)","blurb":"Symptom to cause. Most clues are reworded from book questions, and the notes after each board point to which ones."},{"id":"terms","title":"Acronyms","blurb":"What the letters stand for."}],"boards":[{"id":"raid-basics","group":"storage","title":"RAID 0 / 1 / 5 / 10","blurb":"Sort every fact under the RAID level it describes. Every slot has to be filled before Submit lights up.","columns":[{"id":"r0","label":"RAID 0","cap":3,"sub":"striping","note":"Data is split across the drives for speed. There is no copy of anything, so one dead drive takes the whole array with it. Minimum 2 drives."},{"id":"r1","label":"RAID 1","cap":3,"sub":"mirroring","note":"Two drives hold identical data. You can lose one and keep running (the controller raises an alert). You only get half the raw capacity."},{"id":"r5","label":"RAID 5","cap":3,"sub":"striping + parity","note":"Data and parity are spread over every drive, so any one drive can fail. Two failures at once and the array is gone."},{"id":"r10","label":"RAID 10","cap":3,"sub":"a stripe of mirrors","note":"RAID 1 pairs, then RAID 0 across the pairs: fast and redundant, but half the capacity goes to copies. Also written 1+0."}],"tiles":[{"id":"t01","text":"Striping only: no mirror and no parity","col":"r0"},{"id":"t02","text":"If any one drive fails, the data on the remaining drives is useless","col":"r0"},{"id":"t03","text":"No fault tolerance","col":"r0"},{"id":"t04","text":"Mirroring only, no striping","col":"r1"},{"id":"t05","text":"Every drive holds a complete copy of the data","col":"r1"},{"id":"t06","text":"Fault tolerance with only 2 drives","col":"r1"},{"id":"t07","text":"Uses parity","col":"r5"},{"id":"t08","text":"Needs at least 3 drives","col":"r5"},{"id":"t09","text":"Rebuilds lost data by recalculating it from parity","col":"r5"},{"id":"t10","text":"Stripes and mirrors","col":"r10"},{"id":"t11","text":"Two RAID levels combined: a stripe of mirrored pairs","col":"r10"},{"id":"t12","text":"Needs at least 4 drives","col":"r10"}],"objective":"220-1201, Objective 3.4 - RAID","hook":"RAID is not a backup. RAID 1, 5 and 10 protect you from a drive dying, not from deleted files, ransomware or a fire that hits every drive. RAID 0 does not even protect you from the drive dying."},{"id":"raid-56-10","group":"storage","title":"RAID 5 vs RAID 6 vs RAID 10","blurb":"The three levels people mix up. Each fact is true for exactly one of them.","columns":[{"id":"r5","label":"RAID 5","cap":3,"sub":"single parity","note":"One drive of capacity goes to parity. Best usable capacity of the redundant options, but it only survives one failure."},{"id":"r6","label":"RAID 6","cap":3,"sub":"double parity","note":"RAID 5 with a second, independent parity. Needs at least 4 drives. RAID 6 is on the 220-1201 objectives; the book only uses it as a wrong answer (C87)."},{"id":"r10","label":"RAID 10","cap":3,"sub":"stripe of mirrors","note":"Needs at least 4 drives. Fast, quick to rebuild, and the usual answer for \"high performance and fault tolerance\". It survives two failures only if they hit different mirrors; book A77 still picks RAID 10 when RAID 6 is not offered."}],"tiles":[{"id":"t01","text":"A second failed drive means total data loss","col":"r5"},{"id":"t02","text":"Four 1 TB drives give 3 TB of usable space","col":"r5"},{"id":"t03","text":"Can be built with only 3 drives","col":"r5"},{"id":"t04","text":"Survives any two drives failing at once","col":"r6"},{"id":"t05","text":"Two parity blocks per stripe","col":"r6"},{"id":"t06","text":"Slowest writes of the three, because of the parity math","col":"r6"},{"id":"t07","text":"Every block is mirrored, so half the raw capacity holds copies","col":"r10"},{"id":"t08","text":"A rebuild just copies from the surviving mirror partner, with no parity math","col":"r10"},{"id":"t09","text":"Best write speed of the three","col":"r10"}],"objective":"220-1201, Objective 3.4 - RAID","hook":"Quick picks: most usable space with redundancy on four drives = RAID 5 (book B6). Survive any two failures = RAID 6. Speed plus redundancy = RAID 10."},{"id":"raid-drives","group":"storage","title":"RAID: minimum drives","blurb":"Drop each RAID level under the fewest drives it can be built with.","columns":[{"id":"d2","label":"2 drives","cap":2,"sub":"minimum","note":"Of these five levels, only RAID 0 and RAID 1 can be built with just two drives (both can use more)."},{"id":"d3","label":"3 drives","cap":1,"sub":"minimum","note":"Two drives' worth of data plus one drive's worth of parity, spread across all three."},{"id":"d4","label":"4 drives","cap":2,"sub":"minimum","note":"RAID 6 needs room for two parity blocks; RAID 10 needs two mirrored pairs."}],"tiles":[{"id":"t01","text":"RAID 0","col":"d2"},{"id":"t02","text":"RAID 1","col":"d2"},{"id":"t03","text":"RAID 5","col":"d3"},{"id":"t04","text":"RAID 6","col":"d4"},{"id":"t05","text":"RAID 10","col":"d4"}],"objective":"220-1201, Objective 3.4 - RAID","hook":"2: 0 and 1. 3: 5. 4: 6 and 10."},{"id":"raid-failed","group":"storage","title":"A drive just failed. Now what?","blurb":"Match the recovery step to the array the failed drive was in.","columns":[{"id":"r0","label":"RAID 0","cap":2,"sub":"no redundancy","note":"A RAID 0 failure is a restore-from-backup job (book B55)."},{"id":"r1","label":"RAID 1","cap":2,"sub":"mirror","note":"Replace the bad drive and resync the array (book A22)."},{"id":"r5","label":"RAID 5","cap":2,"sub":"parity","note":"Replace the failed disk and rebuild the array (book C55)."}],"tiles":[{"id":"t01","text":"All the data is gone: replace the drive and restore from backup","col":"r0"},{"id":"t02","text":"Nothing to rebuild from, because there is no copy and no parity","col":"r0"},{"id":"t03","text":"Replace the bad drive and let it resync from the surviving mirror","col":"r1"},{"id":"t04","text":"The other drive already holds a complete copy of everything","col":"r1"},{"id":"t05","text":"Replace the disk and rebuild the array from parity","col":"r5"},{"id":"t06","text":"Missing data is recalculated from the remaining drives while the array runs degraded","col":"r5"}],"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","hook":"Audible alarm in the data center, or every file on a SAN suddenly inaccessible? Check the RAID array status first (book A27, B78)."},{"id":"storage-kinds","group":"storage","title":"HDD vs SATA SSD vs NVMe","blurb":"Sort the facts by drive type.","columns":[{"id":"hdd","label":"HDD","cap":3,"sub":"spinning disk","note":"Moving parts = noise, heat and wear. Clicking plus slow file opens is a replace-the-drive ticket (book C84)."},{"id":"sata","label":"SATA SSD","cap":3,"sub":"flash, SATA interface","note":"The easy upgrade for an old HDD: image the old drive onto the SSD (book A41, C66)."},{"id":"nvme","label":"NVMe SSD","cap":3,"sub":"flash, PCIe","note":"NVMe is the fastest option. (In book B22 the \"fastest possible storage\" answer is simply the SSD, against an HDD, a NAS and a SAN.)"}],"tiles":[{"id":"t01","text":"Spinning platters with a moving read/write head","col":"hdd"},{"id":"t02","text":"Rated by speed in RPM: 5400, 7200, 10,000 or 15,000","col":"hdd"},{"id":"t03","text":"Clicking or grinding is a warning sign that it is failing","col":"hdd"},{"id":"t04","text":"No moving parts, but it still talks over the SATA interface","col":"sata"},{"id":"t05","text":"A 2.5-inch drive that swaps straight in for a laptop hard drive","col":"sata"},{"id":"t06","text":"Capped by the SATA interface at about 600 MB/s","col":"sata"},{"id":"t07","text":"Talks to the CPU over PCIe lanes","col":"nvme"},{"id":"t08","text":"Usually a small M.2 stick that plugs straight into the motherboard","col":"nvme"},{"id":"t09","text":"The fastest of the three, several times quicker than a SATA SSD","col":"nvme"}],"objective":"220-1201, Objective 3.4 - Storage Devices","hook":"M.2 is a shape (form factor). NVMe is the protocol. An M.2 SSD can be SATA or NVMe, and an M.2 slot may support one or both, so check what the board supports."},{"id":"ports-protocols","group":"ports","title":"Protocol to port number","blurb":"Pick the port number for each protocol. Two of the numbers are decoys you will not need, the same trick as the book's port-matching question (book A3: \"Not all port numbers will be used\").","columns":[{"id":"ftp","label":"FTP","cap":1,"sub":"File Transfer Protocol","note":"TCP 20 and 21. Moves files, unencrypted. (SFTP rides on SSH instead.)"},{"id":"ssh","label":"SSH","cap":1,"sub":"Secure Shell","note":"TCP 22. Encrypted terminal access; SFTP and SCP also use it."},{"id":"telnet","label":"Telnet","cap":1,"sub":"unencrypted console","note":"TCP 23. Anyone with a packet capture can read it, so use SSH instead."},{"id":"smtp","label":"SMTP","cap":1,"sub":"Simple Mail Transfer","note":"TCP 25. Sends mail, and moves it between mail servers."},{"id":"dns","label":"DNS","cap":1,"sub":"Domain Name System","note":"UDP 53 for normal lookups (the book shows udp/53). TCP 53 shows up for big answers."},{"id":"dhcp","label":"DHCP","cap":1,"sub":"Dynamic Host Config","note":"UDP 67 (server) and UDP 68 (client)."},{"id":"http","label":"HTTP","cap":1,"sub":"Hypertext Transfer","note":"TCP 80. Web traffic with no encryption."},{"id":"pop3","label":"POP3","cap":1,"sub":"Post Office Protocol 3","note":"TCP 110. Downloads mail from the server."},{"id":"netbios","label":"NetBIOS / NetBT","cap":1,"sub":"old Windows naming","note":"UDP 137 name service, UDP 138 datagrams, TCP 139 sessions. NetBIOS over TCP/IP is NetBT, the older Windows way to find and reach computers. DNS took over the naming and SMB straight on TCP 445 took over the sessions."},{"id":"imap","label":"IMAP","cap":1,"sub":"Internet Message Access","note":"TCP 143. Syncs mail and leaves it on the server, so every device sees the same inbox."},{"id":"ldap","label":"LDAP","cap":1,"sub":"Lightweight Directory Access","note":"TCP 389. Directory lookups, the language of Active Directory."},{"id":"https","label":"HTTPS","cap":1,"sub":"HTTP Secure","note":"TCP 443. Web traffic over TLS."},{"id":"smb","label":"SMB","cap":1,"sub":"Server Message Block","note":"TCP 445. Windows file and printer sharing, and mapping a drive. CompTIA writes it SMB/CIFS (CIFS is the older name)."},{"id":"rdp","label":"RDP","cap":1,"sub":"Remote Desktop","note":"TCP 3389. Control a remote Windows desktop."}],"tiles":[{"id":"t01","text":"20/21","col":"ftp"},{"id":"t02","text":"22","col":"ssh"},{"id":"t03","text":"23","col":"telnet"},{"id":"t04","text":"25","col":"smtp"},{"id":"t05","text":"53","col":"dns"},{"id":"t06","text":"67/68","col":"dhcp"},{"id":"t07","text":"80","col":"http"},{"id":"t08","text":"110","col":"pop3"},{"id":"t09","text":"137-139","col":"netbios"},{"id":"t10","text":"143","col":"imap"},{"id":"t11","text":"389","col":"ldap"},{"id":"t12","text":"443","col":"https"},{"id":"t13","text":"445","col":"smb"},{"id":"t14","text":"3389","col":"rdp"},{"id":"t15","text":"69","col":null},{"id":"t16","text":"161","col":null}],"objective":"220-1201, Objective 2.1 - Common Ports","layout":"rows","shuffleCols":true,"hook":"Say them in order: 20/21 FTP, 22 SSH, 23 Telnet, 25 SMTP, 53 DNS, 67/68 DHCP, 80 HTTP, 110 POP3, 137-139 NetBIOS, 143 IMAP, 389 LDAP, 443 HTTPS, 445 SMB, 3389 RDP. The decoys were TFTP (69) and SNMP (161), which are not on the core list."},{"id":"ports-jobs","group":"ports","title":"Port number to job","blurb":"Each port number is a row. Put the job it does in the slot. The protocol name is in parentheses as a bonus.","columns":[{"id":"p2021","label":"20 / 21","cap":1,"sub":"TCP","note":"Two ports. FTP moves files between operating systems, with no encryption."},{"id":"p22","label":"22","cap":1,"sub":"TCP","note":"SSH is the secure replacement for Telnet."},{"id":"p23","label":"23","cap":1,"sub":"TCP","note":"Everything it sends can be read in a packet capture."},{"id":"p25","label":"25","cap":1,"sub":"TCP","note":"Think \"S\" for send."},{"id":"p53","label":"53","cap":1,"sub":"UDP","note":"Without it you can ping 8.8.8.8 but not browse to google.com (book C50)."},{"id":"p6768","label":"67 / 68","cap":1,"sub":"UDP","note":"Two ports. If it is down, clients self-assign a 169.254.x.x address."},{"id":"p80","label":"80","cap":1,"sub":"TCP"},{"id":"p110","label":"110","cap":1,"sub":"TCP","note":"POP3 pulls mail down to one device."},{"id":"p137","label":"137 - 139","cap":1,"sub":"UDP / TCP","note":"NetBIOS over TCP/IP (NetBT): UDP 137 names, UDP 138 datagrams, TCP 139 sessions."},{"id":"p143","label":"143","cap":1,"sub":"TCP","note":"IMAP keeps every device in sync. To get mail onto a phone the book accepts both IMAP and POP3 (C20)."},{"id":"p389","label":"389","cap":1,"sub":"TCP","note":"Centralized logins use a directory server (book B5)."},{"id":"p443","label":"443","cap":1,"sub":"TCP"},{"id":"p445","label":"445","cap":1,"sub":"TCP","note":"Mapping a network drive uses SMB (book C5), and book B15 pairs SMB with Windows file transfer."},{"id":"p3389","label":"3389","cap":1,"sub":"TCP"}],"tiles":[{"id":"t01","text":"Uploads and downloads files (FTP)","col":"p2021"},{"id":"t02","text":"Encrypted remote command line (SSH)","col":"p22"},{"id":"t03","text":"Remote command line with no encryption (Telnet)","col":"p23"},{"id":"t04","text":"Sends email, from a mail client and between servers (SMTP)","col":"p25"},{"id":"t05","text":"Turns names into IP addresses (DNS)","col":"p53"},{"id":"t06","text":"Hands out IP addresses automatically (DHCP)","col":"p6768"},{"id":"t07","text":"Web pages with no encryption (HTTP)","col":"p80"},{"id":"t08","text":"Downloads email from the server (POP3)","col":"p110"},{"id":"t09","text":"Older Windows computer names and sessions (NetBIOS)","col":"p137"},{"id":"t10","text":"Reads email and leaves it on the server (IMAP)","col":"p143"},{"id":"t11","text":"Looks up users and resources in a directory (LDAP)","col":"p389"},{"id":"t12","text":"Encrypted web traffic (HTTPS)","col":"p443"},{"id":"t13","text":"Windows file and printer sharing (SMB)","col":"p445"},{"id":"t14","text":"Controls a remote Windows desktop (RDP)","col":"p3389"}],"objective":"220-1201, Objective 2.1 - Common Ports","layout":"rows","shuffleCols":true,"hook":"Email: SMTP sends (25); POP3 (110) and IMAP (143) receive. Remote access: SSH 22 (encrypted), Telnet 23 (not), RDP 3389 (full Windows desktop)."},{"id":"ports-groups","group":"ports","title":"Protocols by job","blurb":"Group each protocol under what it is for. The port is in parentheses so you see it again.","columns":[{"id":"web","label":"Web","cap":2,"note":"Browsing. HTTPS is the encrypted one."},{"id":"mail","label":"Email","cap":3,"note":"SMTP sends. POP3 and IMAP receive."},{"id":"remote","label":"Remote access","cap":3,"note":"SSH is encrypted text, Telnet is plain text, RDP is a whole Windows desktop."},{"id":"files","label":"Files and Windows sharing","cap":3,"note":"FTP moves files between systems, with no encryption. SMB shares folders and printers on Windows networks over 445; NetBIOS/NetBT (137-139) is the older naming-and-session layer Windows sharing ran on before that."},{"id":"services","label":"Network services","cap":3,"sub":"DNS names, IP addresses, directory","note":"DNS (Internet names), DHCP (addresses) and LDAP (directory): services other things depend on."}],"tiles":[{"id":"t01","text":"HTTP (80)","col":"web"},{"id":"t02","text":"HTTPS (443)","col":"web"},{"id":"t03","text":"SMTP (25)","col":"mail"},{"id":"t04","text":"POP3 (110)","col":"mail"},{"id":"t05","text":"IMAP (143)","col":"mail"},{"id":"t06","text":"SSH (22)","col":"remote"},{"id":"t07","text":"Telnet (23)","col":"remote"},{"id":"t08","text":"RDP (3389)","col":"remote"},{"id":"t09","text":"FTP (20/21)","col":"files"},{"id":"t10","text":"SMB (445)","col":"files"},{"id":"t11","text":"NetBIOS (137-139)","col":"files"},{"id":"t12","text":"DNS (53)","col":"services"},{"id":"t13","text":"DHCP (67/68)","col":"services"},{"id":"t14","text":"LDAP (389)","col":"services"}],"objective":"220-1201, Objective 2.1 - Common Ports","hook":"Fourteen protocols, five jobs: web, email, remote access, files and network services."},{"id":"ports-extra","group":"ports","title":"Extra ports (beyond the core list)","blurb":"Not on the core list of fourteen. The book mentions Syslog and NTP in its questions (C64), but never gives their port numbers; the rest are real-world extras. Protocol to port number.","columns":[{"id":"snmp","label":"SNMP","cap":1,"sub":"monitoring","note":"UDP 161 for queries, 162 for traps (alerts a device sends on its own)."},{"id":"tftp","label":"TFTP","cap":1,"sub":"simple file transfer","note":"UDP 69. No login, used for firmware and network boot."},{"id":"ntp","label":"NTP","cap":1,"sub":"time sync","note":"UDP 123. Keeps clocks matching."},{"id":"syslog","label":"Syslog","cap":1,"sub":"log collection","note":"UDP 514. Sends device logs to a central server (book C64)."},{"id":"ldaps","label":"LDAPS","cap":1,"sub":"LDAP over TLS","note":"The encrypted version of 389."},{"id":"imaps","label":"IMAPS","cap":1,"sub":"IMAP over TLS","note":"The encrypted version of 143."},{"id":"pop3s","label":"POP3S","cap":1,"sub":"POP3 over TLS","note":"The encrypted version of 110."},{"id":"submit","label":"SMTP submission","cap":1,"sub":"mail client to server","note":"TCP 587 upgrades to TLS with STARTTLS; TCP 465 uses TLS from the first byte. Both are in use."}],"tiles":[{"id":"t01","text":"161/162","col":"snmp"},{"id":"t02","text":"69","col":"tftp"},{"id":"t03","text":"123","col":"ntp"},{"id":"t04","text":"514","col":"syslog"},{"id":"t05","text":"636","col":"ldaps"},{"id":"t06","text":"993","col":"imaps"},{"id":"t07","text":"995","col":"pop3s"},{"id":"t08","text":"587","col":"submit"}],"layout":"rows","shuffleCols":true,"extra":true,"hook":"Pattern: the TLS versions of LDAP, IMAP and POP3 move to 636, 993 and 995. SMTP is the exception: 587 (STARTTLS) or 465."},{"id":"conn-network","group":"cables","title":"Network and serial connectors","blurb":"Match each connector to what it is used for.","columns":[{"id":"rj45","label":"RJ45","cap":1,"sub":"8 pins","note":"Terminates a copper Ethernet patch cable (book B67)."},{"id":"rj11","label":"RJ11","cap":1,"sub":"phone / DSL","note":"DSL runs over telephone wiring (book A89)."},{"id":"f","label":"F-connector","cap":1,"sub":"screw-on","note":"Cable TV and cable Internet (book A55, C33)."},{"id":"db9","label":"DB-9","cap":1,"sub":"serial","note":"Serial management connection (book B21, C49)."},{"id":"sc","label":"SC","cap":1,"sub":"fiber","note":"SC is the square push-pull one (book B56, C36)."},{"id":"lc","label":"LC","cap":1,"sub":"fiber","note":"LC is the small one with a clip, common on switches, routers and servers."},{"id":"st","label":"ST","cap":1,"sub":"fiber","note":"ST (Straight Tip) is on the 220-1201 connector list. The book only uses it as a wrong answer (B30, C49)."}],"tiles":[{"id":"t01","text":"Ethernet network cable","col":"rj45"},{"id":"t02","text":"Phone line, such as DSL modem to the wall jack","col":"rj11"},{"id":"t03","text":"Coax to a cable modem","col":"f"},{"id":"t04","text":"Serial (RS-232) cable used to configure a router or switch","col":"db9"},{"id":"t05","text":"Square fiber connector that pushes in and pulls out","col":"sc"},{"id":"t06","text":"Small latch-clipped fiber connector for switches and transceivers","col":"lc"},{"id":"t07","text":"Round fiber connector you push in and twist to lock","col":"st"}],"objective":"220-1201, Objective 3.2 - Cables and Connectors","layout":"rows","shuffleCols":true,"hook":"Copper: RJ45 = Ethernet, RJ11 = phone/DSL, F = coax, DB-9 = serial console. Fiber: ST twists to lock, SC is square, LC is small."},{"id":"conn-device","group":"cables","title":"Device, storage and power connectors","blurb":"Match each connector to its most common use.","columns":[{"id":"usbc","label":"USB-C","cap":1,"sub":"oval, reversible","note":"Reversible, carries power and data (book B84, C42)."},{"id":"lightning","label":"Lightning","cap":1,"sub":"Apple","note":"Proprietary to Apple (book C46, A30)."},{"id":"thunderbolt","label":"Thunderbolt","cap":1,"sub":"fast, Mac-friendly","note":"The Mac answer for a second monitor plus an external drive (book B39). Thunderbolt 3 and 4 use the USB-C connector, so look for the daisy-chaining and the speed."},{"id":"usba","label":"USB-A","cap":1,"sub":"flat rectangle","note":"The classic peripheral port."},{"id":"sata","label":"SATA","cap":1,"sub":"internal","note":"One connector per drive (book B2)."},{"id":"esata","label":"eSATA","cap":1,"sub":"external","note":"External storage (book B30, C3)."},{"id":"molex","label":"Molex","cap":1,"sub":"4-pin power","note":"Power from the PSU to internal devices (book B2)."}],"tiles":[{"id":"t01","text":"Android charging and file transfer, or an external SSD","col":"usbc"},{"id":"t02","text":"Apple's own charging port, plugs in either way up","col":"lightning"},{"id":"t03","text":"Mac port that daisy-chains a second monitor and fast external storage","col":"thunderbolt"},{"id":"t04","text":"Keyboards, mice and printers","col":"usba"},{"id":"t05","text":"Data cable from the motherboard to a drive inside the case","col":"sata"},{"id":"t06","text":"SATA for a drive outside the case","col":"esata"},{"id":"t07","text":"Old-style power plug for drives and case fans","col":"molex"}],"objective":"220-1201, Objective 3.2 - Cables and Connectors","layout":"rows","shuffleCols":true,"hook":"Power is Molex (and SATA power), data is SATA/eSATA, charging is USB-C or Lightning."},{"id":"conn-video","group":"cables","title":"Video connectors","blurb":"Match each video connector to what makes it different.","columns":[{"id":"vga","label":"VGA","cap":1,"sub":"15-pin, blue","note":"The only analog one here (book C3)."},{"id":"dvid","label":"DVI-D","cap":1,"sub":"digital only","note":"A DVI-D to HDMI adapter bridges the two (book C41)."},{"id":"hdmi","label":"HDMI","cap":1,"sub":"TVs and projectors","note":"Projectors usually take HDMI (book C90)."},{"id":"dp","label":"DisplayPort","cap":1,"sub":"latching","note":"Sends everything digitally (book C3)."}],"tiles":[{"id":"t01","text":"Analog video, the legacy one","col":"vga"},{"id":"t02","text":"Digital video with no audio; needs an adapter to reach HDMI","col":"dvid"},{"id":"t03","text":"Digital video and audio on one cable, standard on TVs and projectors","col":"hdmi"},{"id":"t04","text":"Digital video and audio with a locking plug, common on PC graphics cards and monitors","col":"dp"}],"objective":"220-1201, Objective 3.2 - Video Cables","layout":"rows","shuffleCols":true,"hook":"Analog = VGA. Digital with no sound = DVI-D. Digital with sound = HDMI and DisplayPort."},{"id":"t568b","group":"cables","title":"T568B pin order","blurb":"Put the eight wires in pin order. Hold the plug with the contacts facing you and the cable hanging down (clip on the far side): pin 1 is on your left.","columns":[{"id":"p1","label":"Pin 1","cap":1},{"id":"p2","label":"Pin 2","cap":1},{"id":"p3","label":"Pin 3","cap":1},{"id":"p4","label":"Pin 4","cap":1},{"id":"p5","label":"Pin 5","cap":1},{"id":"p6","label":"Pin 6","cap":1},{"id":"p7","label":"Pin 7","cap":1},{"id":"p8","label":"Pin 8","cap":1}],"tiles":[{"id":"t01","text":"Orange / White","col":"p1","style":"OW"},{"id":"t02","text":"Orange","col":"p2","style":"O"},{"id":"t03","text":"Green / White","col":"p3","style":"GW"},{"id":"t04","text":"Blue","col":"p4","style":"B"},{"id":"t05","text":"Blue / White","col":"p5","style":"BW"},{"id":"t06","text":"Green","col":"p6","style":"G"},{"id":"t07","text":"Brown / White","col":"p7","style":"BrW"},{"id":"t08","text":"Brown","col":"p8","style":"Br"}],"objective":"220-1201 - Section 3.2 - 568A and 568B Colors","layout":"rows","hook":"T568B: orange pair, then green/white, blue pair, green, brown pair. Pins 1, 2, 3 and 6 carry the data on 10/100 Ethernet; gigabit uses all four pairs. Use the same standard on both ends of a normal (straight-through) cable."},{"id":"t568a","group":"cables","title":"T568A pin order","blurb":"Same eight wires and the same way of holding the plug (contacts facing you, cable hanging down, pin 1 on your left). A swaps the orange and green pairs compared with B.","columns":[{"id":"p1","label":"Pin 1","cap":1},{"id":"p2","label":"Pin 2","cap":1},{"id":"p3","label":"Pin 3","cap":1},{"id":"p4","label":"Pin 4","cap":1},{"id":"p5","label":"Pin 5","cap":1},{"id":"p6","label":"Pin 6","cap":1},{"id":"p7","label":"Pin 7","cap":1},{"id":"p8","label":"Pin 8","cap":1}],"tiles":[{"id":"t01","text":"Green / White","col":"p1","style":"GW"},{"id":"t02","text":"Green","col":"p2","style":"G"},{"id":"t03","text":"Orange / White","col":"p3","style":"OW"},{"id":"t04","text":"Blue","col":"p4","style":"B"},{"id":"t05","text":"Blue / White","col":"p5","style":"BW"},{"id":"t06","text":"Orange","col":"p6","style":"O"},{"id":"t07","text":"Brown / White","col":"p7","style":"BrW"},{"id":"t08","text":"Brown","col":"p8","style":"Br"}],"objective":"220-1201 - Section 3.2 - 568A and 568B Colors","layout":"rows","hook":"T568A is T568B with the orange and green pairs swapped: green/white and green come first, orange lands on pins 3 and 6. Use the same standard on both ends of a normal patch cable (the book stresses this). A on one end and B on the other is the old crossover wiring, so never mix them by accident."},{"id":"cable-media","group":"cables","title":"Which cable for which job?","blurb":"Plenum, direct burial, fiber or coax: sort the situation under the cable that fits.","columns":[{"id":"plenum","label":"Plenum-rated","cap":2,"sub":"ceilings","note":"Plenum is the air space above the ceiling (book B37)."},{"id":"burial","label":"Direct burial","cap":2,"sub":"underground","note":"The cable with gel and a ground wire is direct burial (book C53)."},{"id":"fiber","label":"Fiber optic","cap":2,"sub":"light, not electricity","note":"Fiber is the answer for long runs between buildings (book C19)."},{"id":"coax","label":"Coaxial","cap":2,"sub":"F-connector","note":"Cable broadband is delivered over coax (book A72)."}],"tiles":[{"id":"t01","text":"Runs through the air-handling space above a drop ceiling","col":"plenum"},{"id":"t02","text":"Jacket limits flame and smoke if there is a fire","col":"plenum"},{"id":"t03","text":"Installed straight in the ground with no conduit","col":"burial"},{"id":"t04","text":"Gel-filled to keep moisture out, and carries a ground wire","col":"burial"},{"id":"t05","text":"Carries light instead of electricity, so electrical interference does not touch it","col":"fiber"},{"id":"t06","text":"Joins buildings that are farther apart than copper's 100 meters","col":"fiber"},{"id":"t07","text":"Ends in a screw-on F-connector for a cable modem","col":"coax"},{"id":"t08","text":"Carries cable TV and Internet over the same wire","col":"coax"}],"objective":"220-1201, Objective 3.2 - Network Cables","hook":"Plenum = ceiling air space. Direct burial = ground. Fiber = distance and no interference. Coax = cable TV and Internet."},{"id":"copper-cat","group":"cables","title":"Copper cable categories and shielding","blurb":"Match each copper cable to the fact that sets it apart. Distances are for Ethernet runs.","columns":[{"id":"cat5e","label":"Cat 5e","cap":1,"note":"The everyday gigabit cable. 100 meters is the standard copper Ethernet limit."},{"id":"cat6","label":"Cat 6","cap":1,"note":"Shielded Cat 6 can carry 10 Gbps up to 100 meters."},{"id":"cat6a","label":"Cat 6A","cap":1,"sub":"augmented","note":"The A stands for Augmented."},{"id":"stp","label":"STP","cap":1,"sub":"shielded","note":"Shielded twisted pair."},{"id":"utp","label":"UTP","cap":1,"sub":"unshielded","note":"Unshielded twisted pair."}],"tiles":[{"id":"t01","text":"Gigabit (1000BASE-T) to 100 meters, but not 10 Gbps","col":"cat5e"},{"id":"t02","text":"10GBASE-T, but only to about 55 meters when unshielded","col":"cat6"},{"id":"t03","text":"10GBASE-T over the full 100 meters, even when unshielded","col":"cat6a"},{"id":"t04","text":"A shield inside the cable protects against interference","col":"stp"},{"id":"t05","text":"No shielding at all","col":"utp"}],"objective":"220-1201, Objective 3.2 - Network Cables","layout":"rows","shuffleCols":true,"hook":"Gigabit = Cat 5e. 10 Gbps = Cat 6 for 55 meters unshielded (100 meters if shielded), or Cat 6A for the full 100 meters even unshielded. STP has a shield, UTP does not."},{"id":"fiber-modes","group":"cables","title":"Single-mode vs multimode fiber","blurb":"Sort each fact under the fiber type it describes.","columns":[{"id":"sm","label":"Single-mode","cap":3,"sub":"long range","note":"Professor Messer's fiber lesson: single-mode is designed for long-range communication, and a laser keeps the light going all the way through."},{"id":"mm","label":"Multimode","cap":3,"sub":"short range","note":"Professor Messer's fiber lesson: multimode reaches about 2 kilometers and is common inside buildings. The usable distance shrinks as speed rises, to a few hundred meters at 10 Gbps."}],"tiles":[{"id":"t01","text":"A very narrow core that carries a single path of light","col":"sm"},{"id":"t02","text":"Uses a laser as its light source","col":"sm"},{"id":"t03","text":"Built for long-range links of many kilometers without regenerating the signal","col":"sm"},{"id":"t04","text":"A wider core that carries multiple paths of light","col":"mm"},{"id":"t05","text":"Can use a cheaper light source, even an LED","col":"mm"},{"id":"t06","text":"Typically used inside a building or on other short runs","col":"mm"}],"objective":"220-1201, Objective 3.2 - Optical Fiber","hook":"Single-mode = narrow core, laser, long distance. Multimode = wider core, cheaper light source such as an LED, shorter distance. Both carry light, so electrical interference does not affect either one."},{"id":"periph-cables","group":"cables","title":"USB, Thunderbolt and serial","blurb":"Match each peripheral interface to the fact that identifies it.","columns":[{"id":"usb2","label":"USB 2.0","cap":1},{"id":"usb3","label":"USB 3.0","cap":1,"sub":"SuperSpeed"},{"id":"tb","label":"Thunderbolt 3 / 4","cap":1,"note":"Thunderbolt 1 and 2 used a Mini DisplayPort connector instead."},{"id":"serial","label":"Serial (RS-232)","cap":1,"note":"Still the classic console port on routers and switches (book B21, C49)."}],"tiles":[{"id":"t01","text":"Up to 480 Mbps, with cables limited to about 5 meters","col":"usb2"},{"id":"t02","text":"5 Gbps, with cables limited to about 3 meters","col":"usb3"},{"id":"t03","text":"40 Gbps over a USB-C connector","col":"tb"},{"id":"t04","text":"Decades-old standard, usually on a DB-9 connector","col":"serial"}],"objective":"220-1201, Objective 3.2 - Peripheral Cables","layout":"rows","shuffleCols":true,"hook":"USB 2.0 = 480 Mbps. USB 3.0 = 5 Gbps. Thunderbolt 3 and 4 = 40 Gbps on USB-C. Serial = RS-232 on DB-9."},{"id":"net-tools","group":"cables","title":"Which tool for which job?","blurb":"Each tool is a row. Drop the job it does into its slot.","columns":[{"id":"crimper","label":"Crimper","cap":1,"note":"A broken RJ45 or loose wires at the connector means re-crimp (book A26, B86)."},{"id":"stripper","label":"Cable stripper","cap":1},{"id":"punch","label":"Punch-down tool","cap":1,"note":"Use it when wires are not properly seated in a 110 block or patch panel (book A32)."},{"id":"tone","label":"Tone generator and probe","cap":1,"note":"CompTIA's objective list calls it a toner probe. The book says tone generator in A9 and B54, and toner probe in B3 (where it is the right answer) and as a wrong answer in C27 and C71."},{"id":"tester","label":"Cable tester","cap":1,"note":"Verifies a finished run end to end (book C27)."},{"id":"loopback","label":"Loopback plug","cap":1,"note":"Used to check the physical interface (book C71)."},{"id":"tap","label":"Network tap","cap":1,"note":"Sits in line and copies the packets (book B77)."},{"id":"wifi","label":"Wi-Fi analyzer","cap":1,"note":"The first stop for intermittent wireless complaints."}],"tiles":[{"id":"t01","text":"Attach an RJ45 connector to the end of a cable","col":"crimper"},{"id":"t02","text":"Remove the outer jacket without nicking the wires","col":"stripper"},{"id":"t03","text":"Seat wires into a patch panel or keystone jack","col":"punch"},{"id":"t04","text":"Find the other end of one cable in a bundle","col":"tone"},{"id":"t05","text":"Check every pin on a new run (a wire map)","col":"tester"},{"id":"t06","text":"Test a network port by sending its own signal back to it","col":"loopback"},{"id":"t07","text":"Copy the traffic on a live link for packet capture","col":"tap"},{"id":"t08","text":"Show signal strength and which channels are crowded","col":"wifi"}],"objective":"220-1201, Objective 2.8 - Network Tools","layout":"rows","shuffleCols":true,"hook":"Build it: stripper, crimper or punch-down. Find it: tone and probe. Test it: cable tester or loopback plug. Watch it: network tap. Wireless: Wi-Fi analyzer."},{"id":"net-devices","group":"network","title":"Switch, router, access point, firewall","blurb":"Which box does which job? Two facts per device.","columns":[{"id":"switch","label":"Switch","cap":2,"sub":"layer 2","note":"Switches look at MAC addresses; routers look at IP addresses (book A86, C38). An 802.1Q trunk means a managed switch (book C17)."},{"id":"router","label":"Router","cap":2,"sub":"layer 3","note":"The default gateway is a router."},{"id":"ap","label":"Access point","cap":2,"sub":"wireless","note":"Wireless clients in, wired network out (book C7, C1)."},{"id":"fw","label":"Firewall","cap":2,"sub":"filtering","note":"Blocking email or SSH is a firewall rule on the port (book A17, C23, A71, C1)."}],"tiles":[{"id":"t01","text":"Forwards frames by destination MAC address","col":"switch"},{"id":"t02","text":"A managed one supports VLANs and 802.1Q trunks","col":"switch"},{"id":"t03","text":"Picks the next hop by destination IP address","col":"router"},{"id":"t04","text":"Connects your LAN to other networks, like the Internet","col":"router"},{"id":"t05","text":"Bridges wireless clients onto the wired Ethernet network","col":"ap"},{"id":"t06","text":"Where you create a guest Wi-Fi network for visitors","col":"ap"},{"id":"t07","text":"Allows or denies traffic using predefined rules","col":"fw"},{"id":"t08","text":"The place to block a port such as 25 or 22","col":"fw"}],"objective":"220-1201, Objective 2.5 - Network Devices","hook":"MAC address = switch. IP address = router. Wi-Fi to wire = access point. Allow or deny = firewall."},{"id":"net-isp","group":"network","title":"Cable, DSL or fiber?","blurb":"Sort the clue under the kind of Internet connection it belongs to.","columns":[{"id":"cable","label":"Cable","cap":2,"sub":"cable modem","note":"An F-connector on coax most likely means a cable modem (book A55, A72, C33). TVs and satellite dishes use F-connectors too."},{"id":"dsl","label":"DSL","cap":2,"sub":"DSL modem","note":"DSL uses twisted-pair telephone wiring (book A89, B89, C43)."},{"id":"fiber","label":"Fiber","cap":2,"sub":"ONT","note":"The ONT is the demarcation point for fiber to the premises (book C38, C1)."}],"tiles":[{"id":"t01","text":"Coax with a screw-on F-connector","col":"cable"},{"id":"t02","text":"Internet, TV and voice share one coax wire","col":"cable"},{"id":"t03","text":"RJ11 jack on an ordinary phone line","col":"dsl"},{"id":"t04","text":"Internet over a single pair of copper wires","col":"dsl"},{"id":"t05","text":"An ONT turns the ISP's light signal into copper Ethernet at the demarcation point","col":"fiber"},{"id":"t06","text":"Glass strands run all the way to the building","col":"fiber"}],"objective":"220-1201, Objective 2.7 - Internet Connection Types","hook":"Coax = cable. Phone line = DSL. Light = fiber, and an ONT sits at the end of it."},{"id":"net-types","group":"network","title":"PAN, LAN, MAN, WAN, SAN","blurb":"Two examples for each network type.","columns":[{"id":"pan","label":"PAN","cap":2,"sub":"personal","note":"Bluetooth is the classic PAN (book A36)."},{"id":"lan","label":"LAN","cap":2,"sub":"local"},{"id":"man","label":"MAN","cap":2,"sub":"city","note":"Opposite sides of the city = MAN (book B87)."},{"id":"wan","label":"WAN","cap":2,"sub":"wide area","note":"Different countries = WAN (book A66, C35)."},{"id":"san","label":"SAN","cap":2,"sub":"storage","note":"SAN = storage (book B41, C56)."}],"tiles":[{"id":"t01","text":"A Bluetooth headset paired to a phone","col":"pan"},{"id":"t02","text":"Devices within arm's reach of one person","col":"pan"},{"id":"t03","text":"Computers and printers on one office floor, joined by a switch","col":"lan"},{"id":"t04","text":"One building's wired and Wi-Fi network","col":"lan"},{"id":"t05","text":"Two sites on opposite sides of the same city linked together","col":"man"},{"id":"t06","text":"A network that spans a metropolitan area","col":"man"},{"id":"t07","text":"Four company locations in different countries","col":"wan"},{"id":"t08","text":"A point-to-point link to an office in another country","col":"wan"},{"id":"t09","text":"A high-speed network that gives servers access to a large array of hard drives","col":"san"},{"id":"t10","text":"Storage network typically built around RAID arrays","col":"san"}],"objective":"220-1201, Objective 2.7 - Network Types","hook":"Smallest to biggest: PAN, LAN, MAN, WAN. SAN is the odd one out: it is about storage, not distance."},{"id":"ip-types","group":"network","title":"IP address types","blurb":"Is it private, APIPA, loopback or public? Two of the public ones look private on purpose.","columns":[{"id":"private","label":"Private","cap":4,"sub":"RFC 1918","note":"10.x.x.x, 172.16.x.x to 172.31.x.x and 192.168.x.x. Not routable on the Internet. (172.20.122.45 is the one the book calls private, C45.)"},{"id":"apipa","label":"APIPA","cap":2,"sub":"link-local","note":"169.254.x.x: the PC could not reach DHCP and gave itself an address. It can only talk to its own subnet (book A85, A33)."},{"id":"loopback","label":"Loopback","cap":2,"sub":"127.0.0.0/8","note":"The device talking to itself. Pinging 127.0.0.1 proves the TCP/IP stack is working."},{"id":"public","label":"Public","cap":4,"sub":"Internet-routable","note":"Everything else on this board. 172.32.x.x is just past the private 172.16 to 172.31 block, and 192.169.x.x is not 192.168.x.x."}],"tiles":[{"id":"t01","text":"10.4.7.22","col":"private"},{"id":"t02","text":"172.20.122.45","col":"private"},{"id":"t03","text":"172.31.255.254","col":"private"},{"id":"t04","text":"192.168.0.12","col":"private"},{"id":"t05","text":"169.254.228.109","col":"apipa"},{"id":"t06","text":"169.254.12.7","col":"apipa"},{"id":"t07","text":"127.0.0.1","col":"loopback"},{"id":"t08","text":"127.8.9.10","col":"loopback"},{"id":"t09","text":"8.8.8.8","col":"public"},{"id":"t10","text":"9.9.9.9","col":"public"},{"id":"t11","text":"172.32.0.10","col":"public"},{"id":"t12","text":"192.169.1.5","col":"public"}],"objective":"220-1201, Objective 2.6 - IPv4 and IPv6","hook":"Private blocks start with 10, 172.16 to 172.31, or 192.168. A 169.254 address means DHCP failed."},{"id":"wifi-bands","group":"network","title":"802.11 standards and bands","blurb":"Which radio band does each Wi-Fi standard use?","columns":[{"id":"b24","label":"2.4 GHz only","cap":2,"note":"The old pair. (Extra detail: b is 11 Mbps, g is 54 Mbps.)"},{"id":"b5","label":"5 GHz only","cap":2,"note":"(Extra detail: a is 54 Mbps; ac reaches gigabit speeds.)"},{"id":"both","label":"Both 2.4 and 5 GHz","cap":2,"sub":"dual-band","note":"Wi-Fi 6E extends ax into the 6 GHz band, and 802.11be (Wi-Fi 7) uses 2.4, 5 and 6 GHz. (Extra detail: n tops out around 600 Mbps.)"}],"tiles":[{"id":"t01","text":"802.11b","col":"b24"},{"id":"t02","text":"802.11g","col":"b24"},{"id":"t03","text":"802.11a","col":"b5"},{"id":"t04","text":"802.11ac (Wi-Fi 5)","col":"b5"},{"id":"t05","text":"802.11n (Wi-Fi 4)","col":"both"},{"id":"t06","text":"802.11ax (Wi-Fi 6)","col":"both"}],"objective":"220-1201, Objective 2.2 - Wireless Network Technologies","hook":"Remember: b and g are 2.4 only, a and ac are 5 only, n and ax do both. Channel width (like 40 MHz) is the bandwidth setting, not the frequency (book A78)."},{"id":"email-auth","group":"network","title":"SPF, DKIM, DMARC","blurb":"Three DNS-based email protections that are easy to blur together.","columns":[{"id":"spf","label":"SPF","cap":2,"sub":"who may send","note":"Published as a DNS TXT record (book A67, B73, C48)."},{"id":"dkim","label":"DKIM","cap":2,"sub":"signed mail","note":"Proves the signed parts of the message were not changed, and that the signing domain really sent it."},{"id":"dmarc","label":"DMARC","cap":2,"sub":"what to do","note":"Builds on SPF and DKIM by adding a policy and reporting."}],"tiles":[{"id":"t01","text":"Lists the mail servers allowed to send mail for the domain","col":"spf"},{"id":"t02","text":"The receiver checks the sending server's IP address against that list","col":"spf"},{"id":"t03","text":"Adds a digital signature to every outgoing message","col":"dkim"},{"id":"t04","text":"Receivers verify the signature with a public key published in DNS","col":"dkim"},{"id":"t05","text":"Tells receivers whether to reject or quarantine mail that fails the checks","col":"dmarc"},{"id":"t06","text":"Asks receivers to send you reports about who is sending mail as your domain","col":"dmarc"}],"objective":"220-1201, Objective 2.4 - DNS Configuration","hook":"All three are published in DNS. SPF = who may send. DKIM = was it signed. DMARC = what to do about failures, plus reports."},{"id":"dns-records","group":"network","title":"DNS record types","blurb":"Match each record type to what it holds. One tile is a decoy.","columns":[{"id":"a","label":"A record","cap":1,"sub":"IPv4"},{"id":"aaaa","label":"AAAA record","cap":1,"sub":"IPv6","note":"Four A's because IPv6 addresses are four times as long as IPv4."},{"id":"cname","label":"CNAME record","cap":1,"sub":"alias","note":"Handy for pointing www at the main site name, so only one A record needs to change."},{"id":"mx","label":"MX record","cap":1,"sub":"mail exchanger"},{"id":"txt","label":"TXT record","cap":1,"sub":"text","note":"SPF goes in a TXT record (book C48)."}],"tiles":[{"id":"t01","text":"Name to an IPv4 address","col":"a"},{"id":"t02","text":"Name to an IPv6 address","col":"aaaa"},{"id":"t03","text":"Makes one name an alias of another name","col":"cname"},{"id":"t04","text":"Which servers accept email for the domain","col":"mx"},{"id":"t05","text":"Free text, and where SPF, DKIM and DMARC records are published","col":"txt"},{"id":"t06","text":"PTR: maps an IP address back to a name","col":null}],"objective":"220-1201, Objective 2.4 - DNS Configuration","layout":"rows","shuffleCols":true,"hook":"A = IPv4. AAAA = IPv6. CNAME = alias. MX = mail. TXT = text, including SPF, DKIM and DMARC. The decoy, PTR, is a real record type, but it is not one of the five you need here."},{"id":"printer-parts","group":"hardware","title":"Printer types and their parts","blurb":"Which printer uses which part or trait?","columns":[{"id":"laser","label":"Laser","cap":3,"note":"Toner is fused to the page with heat and pressure. A solid line on the page points at a scratched drum."},{"id":"inkjet","label":"Inkjet","cap":3,"note":"Clogged nozzles and a dry cartridge are the classic inkjet problems."},{"id":"thermal","label":"Thermal","cap":2,"note":"Receipt printers. Use the paper made for the model (book C32). Thermal is also the quietest printer type (book A79)."},{"id":"impact","label":"Impact (dot matrix)","cap":3,"note":"The ink ribbon is the dot-matrix supply to order (book C61). Replace it when the print fades."},{"id":"3d","label":"3-D printer","cap":3,"note":"Filament printers melt plastic; resin printers cure liquid with light."}],"tiles":[{"id":"t01","text":"Imaging drum","col":"laser"},{"id":"t02","text":"Fuser assembly","col":"laser"},{"id":"t03","text":"Toner cartridge","col":"laser"},{"id":"t04","text":"Ink cartridges","col":"inkjet"},{"id":"t05","text":"Print head nozzles that clog if unused","col":"inkjet"},{"id":"t06","text":"Sprays liquid ink in tiny droplets","col":"inkjet"},{"id":"t07","text":"Heating element that darkens special paper","col":"thermal"},{"id":"t08","text":"Heat-sensitive paper roll","col":"thermal"},{"id":"t09","text":"Inked fabric ribbon","col":"impact"},{"id":"t10","text":"Tractor-feed continuous paper","col":"impact"},{"id":"t11","text":"Pins strike a ribbon against the page, so it can print multipart carbon-copy forms","col":"impact"},{"id":"t12","text":"Filament","col":"3d"},{"id":"t13","text":"Resin","col":"3d"},{"id":"t14","text":"Builds an object layer by layer","col":"3d"}],"objective":"220-1201, Objective 3.8 - Printer Maintenance","hook":"Laser = drum, fuser, toner. Inkjet = nozzles and ink. Thermal = a heating element and special paper. Impact = pins and an inked ribbon. 3-D = filament or resin."},{"id":"laser-steps","group":"hardware","title":"Laser printer imaging process","blurb":"Put the seven steps in order, first to last.","columns":[{"id":"s1","label":"Step 1","cap":1,"note":"Processing: the raster image processor (RIP) turns the page into a bitmap of dots the printer can draw."},{"id":"s2","label":"Step 2","cap":1,"note":"Charging: a primary charge roller (or corona wire) gives the drum a uniform negative charge."},{"id":"s3","label":"Step 3","cap":1,"note":"Exposing: the laser writes the image onto the drum by removing the negative charge where toner should stick."},{"id":"s4","label":"Step 4","cap":1,"note":"Developing: toner is attracted to the exposed areas of the drum."},{"id":"s5","label":"Step 5","cap":1,"note":"Transferring: the toner image moves from the drum onto the paper."},{"id":"s6","label":"Step 6","cap":1,"note":"Fusing: the fuser uses heat and pressure to melt the toner into the paper."},{"id":"s7","label":"Step 7","cap":1,"note":"Cleaning: leftover toner is removed and the drum is reset for the next page."}],"tiles":[{"id":"t01","text":"Processing","col":"s1"},{"id":"t02","text":"Charging","col":"s2"},{"id":"t03","text":"Exposing","col":"s3"},{"id":"t04","text":"Developing","col":"s4"},{"id":"t05","text":"Transferring","col":"s5"},{"id":"t06","text":"Fusing","col":"s6"},{"id":"t07","text":"Cleaning","col":"s7"}],"objective":"220-1201, Objective 3.8 - Laser Printer Maintenance","layout":"rows","hook":"P-C-E-D-T-F-C: Processing, Charging, Exposing, Developing, Transferring, Fusing, Cleaning."},{"id":"printer-maint","group":"hardware","title":"Printer maintenance","blurb":"Which maintenance step belongs to which printer type?","columns":[{"id":"laser","label":"Laser","cap":3,"note":"Resetting the page counter is the last step of a maintenance kit (book A43). A damp cloth beats compressed air, which just blows toner into the air (book B88)."},{"id":"thermal","label":"Thermal","cap":3,"note":"Book C32 is about matching the paper to the model. On direct thermal paper the heating element, not ink or toner, makes the image. Printed thermal receipts also fade over time."},{"id":"impact","label":"Impact (dot matrix)","cap":3,"note":"The ribbon is the supply to order (book C61)."}],"tiles":[{"id":"t01","text":"After installing a maintenance kit with new feed rollers and a fuser, reset the page counter","col":"laser"},{"id":"t02","text":"Do not touch the fuser: it gets very hot and takes time to cool down","col":"laser"},{"id":"t03","text":"Clean toner out with a damp cloth, not compressed air","col":"laser"},{"id":"t04","text":"Load the paper roll made for that printer model","col":"thermal"},{"id":"t05","text":"Clean the heating element with a cleaning pen or cleaning card","col":"thermal"},{"id":"t06","text":"Store spare paper away from heat, which turns thermal paper dark","col":"thermal"},{"id":"t07","text":"Replace the ink ribbon when it runs low","col":"impact"},{"id":"t08","text":"Swap the print head when its pins stop firing","col":"impact"},{"id":"t09","text":"Make sure the continuous tractor-feed paper runs smoothly","col":"impact"}],"objective":"220-1201, Objective 3.8 - Printer Maintenance","hook":"Laser: maintenance kit, reset the counter, hot fuser, damp cloth. Thermal: the right paper, clean the heating element. Impact: ribbon, print head, tractor feed."},{"id":"mfd-settings","group":"hardware","title":"Multifunction device: print settings and security","blurb":"Which setting or security feature goes with each situation?","columns":[{"id":"duplex","label":"Duplex","cap":2,"sub":"two-sided","note":"Duplex is the two-sided setting (book A20, C82)."},{"id":"tray","label":"Tray settings","cap":2,"sub":"paper source","note":"Choose the right tray in the print dialog (book B24)."},{"id":"secured","label":"Secured prints","cap":2,"sub":"PIN at the printer","note":"Book B46."},{"id":"badging","label":"Badging","cap":2,"sub":"ID card","note":"Badging is authentication with a card. Secured prints uses a PIN instead."},{"id":"audit","label":"Audit logs","cap":2,"sub":"who printed what","note":"Audit logs are how you track and manage printing costs (book B59)."}],"tiles":[{"id":"t01","text":"A contract designed for both sides of the page prints on only one side","col":"duplex"},{"id":"t02","text":"The accounting form has to print on the front and back of each sheet","col":"duplex"},{"id":"t03","text":"Letterhead is loaded in one tray, but the job prints on plain paper from another","col":"tray"},{"id":"t04","text":"A job has to pull from the tray that holds a different paper size","col":"tray"},{"id":"t05","text":"The job will not print until the user types a PIN on the printer console","col":"secured"},{"id":"t06","text":"Pages stay in the queue until the owner enters a PIN at the printer","col":"secured"},{"id":"t07","text":"Users tap an employee ID card on a reader at the printer to sign in","col":"badging"},{"id":"t08","text":"A card reader at the device replaces typing a username and password","col":"badging"},{"id":"t09","text":"Printing costs have jumped, and management wants a record of who printed what","col":"audit"},{"id":"t10","text":"A history of jobs, users and page counts is kept for later review","col":"audit"}],"objective":"220-1201, Objective 3.7 - Multifunction Devices","hook":"Both sides = duplex. Wrong paper = tray settings. PIN at the printer = secured prints. Card tap = badging. Who printed what = audit logs."},{"id":"mfd-scan","group":"hardware","title":"Multifunction device: scanning","blurb":"Where do the scans go, and which scanner type is it? Sort each scenario.","columns":[{"id":"smb","label":"Scan to SMB","cap":2,"sub":"network folder","note":"SMB is Windows file sharing, so the destination is a Windows share (book A28, B85)."},{"id":"email","label":"Scan to email","cap":2,"sub":"inbox","note":"Email is one of the three network scan services (email, SMB and cloud)."},{"id":"cloud","label":"Scan to cloud","cap":2,"sub":"online storage","note":"Cloud storage is the third network scan destination."},{"id":"flatbed","label":"Flatbed scanner","cap":2,"sub":"glass",
