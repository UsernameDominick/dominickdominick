":"In this example, the issue is related to the APIPA link-local address assigned to the workstation. Although the Internet provider could potentially be experiencing issues, it would not be the most likely cause of the problem."},{"letter":"C","text":"The DHCP server is down","explanation":"If a DHCP (Dynamic Host Configuration Protocol) server is not responding, the local workstation will configure itself with an APIPA (Automatic Private IP Addressing) address. The usable APIPA addresses range between 169.254.1.0 through 169.254.254.255. An APIPA address is a link-local address, so network communication is limited to the local IP subnet"},{"letter":"D","text":"The wireless adapter is not working properly","explanation":"The wireless adapter has configured itself and assigned a link-local APIPA address, so it appears the adapter itself is functional."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"A34","stem":"A help desk technician needs to use different Windows versions to study for an industry certification exam. The technician currently uses a Windows desktop computer with 4 GB of RAM and a 750 GB free on the hard drive. Which of the following would be the best way to perform this task? (Choose TWO)","choices":[{"letter":"A","text":"Install a second monitor","explanation":"Multiple monitors can certainly improve overall efficiency and can expand the working desktop of a computer, but it doesn't provide any features specific to multiple operating systems or virtual machines."},{"letter":"B","text":"Install an additional hard drive","explanation":"The available hard drive is large enough to support the installation of multiple virtual machines."},{"letter":"C","text":"Create a Windows Recovery Environment boot drive","explanation":"A Windows Recovery Environment drive is useful for troubleshooting the existing Windows installation, but it won't help with multiple operating systems."},{"letter":"D","text":"Upgrade the system RAM","explanation":"The easiest way to use multiple operating systems on a single machine is to run them as virtual machines. Although 750 GB (Gigabytes) is plenty of storage space for multiple virtual machines, the 4 GB of RAM (Random Access Memory) on the host computer is too small to support multiple Windows operating systems at the same time. Once the memory upgrade is complete, it's a relatively easy process to install the guest virtual machines on the existing hard drive"},{"letter":"E","text":"Install Windows guest VMs","explanation":"The easiest way to use multiple operating systems on a single machine is to run them as virtual machines. Although 750 GB (Gigabytes) is plenty of storage space for multiple virtual machines, the 4 GB of RAM (Random Access Memory) on the host computer is too small to support multiple Windows operating systems at the same time. Once the memory upgrade is complete, it's a relatively easy process to install the guest virtual machines on the existing hard drive"}],"correct":["D","E"],"multi":true,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","source":"book"},{"id":"A35","stem":"While configuring a new workstation in the lab, one of the engineers recommends using 255.255.255.0. What part of the configuration is this associated with?","choices":[{"letter":"A","text":"Default gateway","explanation":"A default gateway on an internal lab network will most likely be using private IP (Internet Protocol) addressing starting with 10, 172, or a 192. IP addresses cannot start with an octet of 255. Therefore, a default gateway in this environment would not have an IP address of 255.255.255.0."},{"letter":"B","text":"Subnet mask","explanation":"Subnet masks are used by a device to determine what subnet it's connected to. Subnet masks are a series of binary ones that are used to \"mask\" the subnet address from the host address. Instead of representing this mask in binary, it's almost always shown in decimal form. Common decimal representations of subnet mask start with 255, such as 255.255.255.0"},{"letter":"C","text":"DNS server","explanation":"Since an IP address cannot start with the octet of 255, this address would not be associated with a DNS server."},{"letter":"D","text":"IP address","explanation":"The IP address of a device cannot start with 255. It's most likely that a device in a lab would use an internal IP address that starts with an octet of 10, 172, or 192."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.6 - IPv4 and IPv6","link":"https://professormesser.link/1201020601","source":"book"},{"id":"A36","stem":"Which of the following best describes a Bluetooth network?","choices":[{"letter":"A","text":"PAN","explanation":"A PAN (Personal Area Network) is designed for a small area and usually is associated with an individual. Bluetooth devices such as headsets, speakers, and automobile connections are considered PANs"},{"letter":"B","text":"WAN","explanation":"A WAN (Wide Area Network) usually connects locations over an extended geographical distance. A network link between cities, states, or countries would be considered a WAN connection."},{"letter":"C","text":"LAN","explanation":"The network in your building or home is a LAN (Local Area Network). If you're connected to an Ethernet or 802.11 wireless network, then you're connected to a LAN."},{"letter":"D","text":"MAN","explanation":"A MAN (Metropolitan Area Network) is a bit bigger than a LAN, but smaller than a WAN. Connecting sites in the same city or metropolitan area would commonly use a MAN link."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.7 - Network Types","link":"https://professormesser.link/1201020702","source":"book"},{"id":"A37","stem":"During the onboarding process, an employee's phone has been added to the corporate MDM. Which of the following would best describe this deployment strategy?","choices":[{"letter":"A","text":"COPE","explanation":"The COPE (Corporate owned, personally enabled) deployment model uses devices owned by the corporation and assigned to individual employees. A user's personal phone would not be part of a COPE deployment model."},{"letter":"B","text":"SaaS","explanation":"SaaS (Software as a Service) describes a cloud deployment model associated with application instances. SaaS does not describe the use of personal devices in an organization."},{"letter":"C","text":"BYOD","explanation":"BYOD (Bring Your Own Device) describes the use of personal devices in corporate settings. These devices are often managed through a centralized MDM (Mobile Device Manager)"},{"letter":"D","text":"SMB","explanation":"SMB (Server Message Block) is a protocol commonly associated with Windows file and printer sharing. SMB is not part of a mobile device deployment strategy."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Management","link":"https://professormesser.link/1201010302","source":"book"},{"id":"A38","stem":"A user's smartphone shows a black screen and does not respond to any screen taps or button presses. A check of the SIM card shows a red label but no physical damage. Which of the following is the most likely reason for these issues?","choices":[{"letter":"A","text":"Overheating","explanation":"An overheated device will remain off until the system has cooled. A message will be displayed on the screen describing the overheating condition."},{"letter":"B","text":"Digitizer failure","explanation":"A digitizer failure may cause the screen to become unresponsive, but the device should still respond to button presses."},{"letter":"C","text":"Liquid damage","explanation":"Most smartphones and tablets include a liquid contact indicator (LCI). This indicator is usually white, and it can often be seen without disassembling the device. If the LCI turns pink or red, the device has been in close contact with liquid"},{"letter":"D","text":"Invalid SIM card","explanation":"An invalid SIM card would cause the device to lose connectivity with the mobile provider, but the smartphone would still work normally and respond to user input."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"A39","stem":"An administrator needs to obtain the MAC address of a print server. Which of the following would be the best source of this information?","choices":[{"letter":"A","text":"Router","explanation":"A router is used to forward traffic based on the destination IP address of a packet. A router does not contain the MAC address of a print server."},{"letter":"B","text":"NIC","explanation":"A MAC (Media Access Control) address is commonly associated with a NIC (Network Interface Card). Each MAC address is a unique value and is burned-in to the ROM (Read Only Memory) of the NIC"},{"letter":"C","text":"Firewall","explanation":"A firewall allows or blocks traffic based on predefined rules or ACLs (Access Control Lists). A firewall does not manage the MAC addresses of other devices."},{"letter":"D","text":"ONT","explanation":"An ONT (Optical Network Terminal) is used to connect an ISPs (Internet Service Provider's) fiber network to the copper network at a home or office."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"A40","stem":"A user would like to access email from their Windows 11 laptop using a smartphone’s Internet connection. Which of these technologies needs to be enabled on the laptop?","choices":[{"letter":"A","text":"5G","explanation":"The fifth generation of cellular technologies would be commonly associated with the connection between the smartphone and the cellular network. The hotspot connection between the laptop and phone would not use 5G as the communication method."},{"letter":"B","text":"802.11","explanation":"An Internet hotspot commonly uses 802.11 wireless connections to connect a laptop and a smartphone together. The laptop will communicate to the smartphone over 802.11, and the smartphone is used to connect to resources on the Internet using 5G or a similar cellular technology"},{"letter":"C","text":"NFC","explanation":"NFC (Near Field Communication) is a short-distance wireless technology commonly used for payment systems or in-person information exchange. NFC is not used for connecting to a hotspot on a smartphone."},{"letter":"D","text":"GPS","explanation":"GPS (Global Positioning System) is useful for determining a specific location, but it's not used for Internet connectivity."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"A41","stem":"A system administrator needs to upgrade a laptop from a hard drive to an SSD. Which of the following would provide the most efficient method of upgrading this system?","choices":[{"letter":"A","text":"Create an image of the hard drive and restore to the SSD","explanation":"A system image contains everything on the storage drive, so the restored system will have the same operating system, configuration options, user documents, and installed applications as the original system"},{"letter":"B","text":"Install a new Windows license and application files on the SSD","explanation":"The process of installing a new version of Windows and installing every application will take much longer than creating an image and restoring that image to the SSD."},{"letter":"C","text":"Backup all user documents and copy them to another computer","explanation":"This would provide a copy of all of the user's spreadsheets, pictures, movies, and other important files, but it wouldn't install an operating system or all of the user's applications on the new SSD."},{"letter":"D","text":"Compress the home directory and upload it to cloud storage","explanation":"Compressing the user's home directory would conserve storage space during the backup process, but it won't install an operating system or the user's applications on the new SSD."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 1.1 - Laptop Hardware","link":"https://professormesser.link/1201010101","source":"book"},{"id":"A42","stem":"A new employee has been assigned a corporate smartphone, but the camera and the installation of third- party apps has been disabled. Which of the following is the most likely reason for these issues?","choices":[{"letter":"A","text":"The smartphone is out of storage space","explanation":"A lack of storage space could cause issues with the installation of new software, but the phone would provide messages and feedback regarding the lack of space."},{"letter":"B","text":"The smartphone OS needs to be upgraded","explanation":"An outdated operating system would not prevent the use of the camera or the installation of third-party apps."},{"letter":"C","text":"An MDM has disabled the features","explanation":"An MDM (Mobile Device Manager) can enable or disable effectively any feature on the smartphone, including the camera and the app installation process"},{"letter":"D","text":"The smartphone hardware is faulty","explanation":"This could certainly cause some of the issues with the camera or app installation, but it's unlikely that both of those systems would be faulty on the same device."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Connectivity","link":"https://professormesser.link/1201010302","source":"book"},{"id":"A43","stem":"A system administrator is using a maintenance kit on a network-connected laser printer. Which of the following should be the last step when performing this maintenance?","choices":[{"letter":"A","text":"Examine the feed rollers","explanation":"Examining or replacing the feed rollers is a normal part of the maintenance process, but it would not often be the last step in the maintenance process."},{"letter":"B","text":"Wait until the fuser unit cools down and replace it","explanation":"Fusers can sometimes be replaced during maintenance, but this would not be the last step in the process."},{"letter":"C","text":"Reset the page counter","explanation":"The page counter is a helpful metric to determine how much the printer is used, which in turn determines when the next maintenance should be scheduled. After performing the current maintenance cycle and verifying the printer's operation, the page counter should be reset so the next maintenance time-frame can be properly estimated"},{"letter":"D","text":"Replace the power cord","explanation":"Replacing the power cord is not commonly part of the maintenance process. The only time the power cord would need replacing is if it has been damaged. Power cords do not generally wear out or need replacement."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.8 - Laser Printer Maintenance","link":"https://professormesser.link/1201030802","source":"book"},{"id":"A44","stem":"An application developer needs to test an application across all of the operating systems used by the company. Each operating system will be tested individually in a lab environment. The company would like to minimize any additional hardware purchases for this project. Which of the following would be the best way to test this application?","choices":[{"letter":"A","text":"Purchase a system configured just above the hardware requirements for the highest-end operating system. Create separate VMs for each operating system.","explanation":"Creating virtual machines for these tests would be a great way to minimize hardware costs, and the machine used for the testing should be able to properly virtualize the testing OS while the host OS is running. Purchasing a system that is slightly more powerful than the highest-level operating system configuration should cover any technical requirements"},{"letter":"B","text":"Purchase individual test computers which match the hardware requirements for each OS. Install different operating systems on each test computer.","explanation":"requirements for each OS. Install different operating systems on each test computer.\n\nSince one of the project requirements was to minimize the hardware cost, purchasing separate computers for all of these systems would be much more expensive than purchasing a single computer and virtualizing the operating systems."},{"letter":"C","text":"Designate existing user workstations to be used as testing systems. Run all application tests during non-working hours.","explanation":"all application tests during non-working hours.\n\nThis solution would certainly minimize the hardware cost, but the process of using existing user workstations would be difficult to manage. This solution would also require the testing to occur during hours when the application developer would, by definition, not be working."},{"letter":"D","text":"Purchase a system which matches the minimum hardware requirements for the highest-end operating system. Create a system image for each operating system and reimage the computer between tests.","explanation":"for the highest-end operating system. Create a system image for each operating system and reimage the computer between tests.\n\nAlthough this would technically be a valid alternative, it would be time consuming to constantly image and reimage the test system for every operating system. Using virtual machines would allow the application developer to instantly stop and start any operating system at any time."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Concepts","link":"https://professormesser.link/1201040101","source":"book"},{"id":"A45","stem":"A graphics editor is purchasing a new monitor which will best match the color output of their laser printer. Which of the following specifications would best meet this requirement?","choices":[{"letter":"A","text":"Pixel density","explanation":"A pixel density describes the number of pixels contained in an inch of the display. A higher pixel density provides higher clarity and sharpness, but neither of those will help match a printer's color output."},{"letter":"B","text":"Screen resolution","explanation":"The screen resolution defines the total number of pixels on a device, and the resolution is often shown as the total number of pixels wide and the total number of pixels high. A higher resolution creates a more detailed output, but it doesn't change the color representation on a device."},{"letter":"C","text":"Color gamut","explanation":"The color gamut describes the range of colors available on a device. A display with a comprehensive color gamut can best match the colors on other devices, including color laser printers"},{"letter":"D","text":"Refresh rate","explanation":"A refresh rate defines the number of times the image on a screen is updated. A higher refresh rate does not provide any additional color matching functionality."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 3.1 - Display Attributes","link":"https://professormesser.link/1201030102","source":"book"},{"id":"A46","stem":"A user in the manufacturing department reports every page printed from the central networked laser printer is jamming inside of the printer. Which of the following is the most likely cause of this issue?","choices":[{"letter":"A","text":"The printer driver is outdated","explanation":"A printer driver provides access to printer trays and features on a specific printer model. An outdated or incorrect printer driver would not cause paper to jam inside of the printer."},{"letter":"B","text":"The printer language is not properly configured","explanation":"Using an incorrect printer control language will result in garbled or unusual output. An incorrect printer language will not cause the paper to jam or get stuck in the paper path."},{"letter":"C","text":"The paper is an incorrect weight","explanation":"The paper path of a printer has been engineered for a specific range of paper weights, and going outside of this range can cause paper jams and creased pages in the final output"},{"letter":"D","text":"The toner is low","explanation":"If the printer output was very faint or difficult to read, the toner levels may be low. Most printers will provide a message when it's time to replace the toner cartridge. A low toner cartridge would not cause a paper jam."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"A47","stem":"Which mobile device connection is commonly used for making payments at a store checkout?","choices":[{"letter":"A","text":"NFC","explanation":"NFC (Near Field Communication) is designed to transfer small amounts of data wirelessly over a limited area. It's common to use a smart phone or smart watch with a credit card terminal to pay for goods or services"},{"letter":"B","text":"Infrared","explanation":"An infrared link is a line-of-sight wireless connection commonly associated with television remotes, home audio systems, and multimedia devices. An infrared connection would not be used during the checkout process."},{"letter":"C","text":"Cellular","explanation":"Cellular networks are used for voice and data communication, but those cellular networks are not part of the in-store purchase process."},{"letter":"D","text":"Bluetooth","explanation":"Although Bluetooth supports many different features, it's not used during the checkout process in a store."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 1.2 - Connecting Mobile Devices","link":"https://professormesser.link/1201010201","source":"book"},{"id":"A48","stem":"A company hosts a cloud-based application which includes redundant servers located in different data centers around the world. Which of the following cloud computing characteristics would best describe this application design?","choices":[{"letter":"A","text":"Elasticity","explanation":"Elasticity provides a way to quickly scale up and down as needed. Although this is a common cloud computing characteristic, this specific example does not describe any scalability features."},{"letter":"B","text":"Availability","explanation":"If a single server fails, there are other servers available in different data centers for clients to access. This highly available design ensures the services are always available to the users"},{"letter":"C","text":"Non-metered","explanation":"A cloud service with a flat-fee for access to a resource is defined as non-metered. This example does not describe the billing for the service or the usage costs for any part of the service."},{"letter":"D","text":"VDI","explanation":"VDI, or Virtual Desktop Infrastructure, is a technology for running a user's desktop in the cloud. In this example, there's no mention of the application type or how a user's desktop would be integrated into this application."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Characteristics","link":"https://professormesser.link/1201040202","source":"book"},{"id":"A49","stem":"An administrator is installing a new database server. Which of the following technologies would maximize the data bandwidth when accessing memory modules?","choices":[{"letter":"A","text":"Multiple channels","explanation":"A motherboard supporting multi-channel memory can use multiple memory modules to increase overall throughput"},{"letter":"B","text":"Error correcting code","explanation":"Error correcting code (ECC) RAM (Random Access Memory) can identify and correct memory errors in real-time. ECC RAM does not provide any additional throughput, however."},{"letter":"C","text":"SDRAM","explanation":"SDRAM (Synchronous Dynamic RAM) is the standard memory type used on modern computers. SDRAM uses a centralized clock to synchronize data flows across the motherboard, but this process does not provide any additional throughput."},{"letter":"D","text":"NVMe storage","explanation":"The storage of data using NVMe (Non-Volatile Memory Express) does not increase the available throughput to a computer's memory modules."},{"letter":"E","text":"Parity storage","explanation":"Memory modules can use parity to identify and potentially correct memory errors. The storage of this parity information does not provide any additional RAM module throughput."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.3 - Memory Technologies","link":"https://professormesser.link/1201030302","source":"book"},{"id":"A50","stem":"A manager’s computer is able to connect to Internet sites while in conference rooms or in the building courtyard. When the laptop is brought back to the manager’s desk and placed into the docking station, the Internet access is unavailable but all other features are working. Which of the following should be the first troubleshooting task for this issue?","choices":[{"letter":"A","text":"Replace the docking station power supply","explanation":"If other docking station features were not working, there could be an issue with the power connection on the docking station. In this situation, all of the other features appeared to be working properly when connected to the docking station."},{"letter":"B","text":"Upgrade the laptop BIOS","explanation":"A BIOS upgrade is a significant change, and it's rarely the first step in the troubleshooting process."},{"letter":"C","text":"Replace the docking station","explanation":"Although it's certainly possible the docking station could be faulty, there are no obvious issues with other features. Before replacing the entire docking station, it would be useful to check the individual components associated with the problem."},{"letter":"D","text":"Check the docking station network cable","explanation":"The Internet access on the laptop appears to be working properly on the wireless network, but the docking station connection would use a wired Ethernet connection. If everything else is working properly, then the issue would most likely be associated with the Ethernet interface in the docking station"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.2 - Mobile Device Accessories","link":"https://professormesser.link/1201010202","source":"book"},{"id":"A51","stem":"The manager of the Accounting department would like to add another phone number to their iPhone to use while working at a regional site in another country. Which of the following would provide this functionality?","choices":[{"letter":"A","text":"MDM","explanation":"An MDM (Mobile Device Manager) provides a service for managing and monitoring mobile devices, but an MDM does not provide additional phone numbers for smartphones."},{"letter":"B","text":"eSIM","explanation":"An eSIM (Embedded Subscriber Identity Module) is an electronic method of applying carrier and user information to a smartphone. No additional hardware is required when using an eSIM, and the additional phone number can be updated in the phone software directly"},{"letter":"C","text":"Bluetooth","explanation":"Bluetooth is a useful networking technology for connecting headsets, speakers, and other wireless devices to a smartphone, tablet, or desktop operating system. Bluetooth does not provide an additional phone number on a smartphone."},{"letter":"D","text":"Tether","explanation":"A tether describes a method of accessing the Internet using a smartphone as the connection. An Internet tether does not provide any additional phone numbers."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Networks","link":"https://professormesser.link/1201010301","source":"book"},{"id":"A52","stem":"Which of the following would be most associated with an IoT device?","choices":[{"letter":"A","text":"Multithreading","explanation":"Multithreading is a common feature across most modern processors, so this would not be a feature most associated with IoT devices."},{"letter":"B","text":"ARM","explanation":"An ARM (Advanced RISC Machine) processor architecture provides efficient processing, less power, and less heat than other processor types. This efficiency makes ARM a common choice for mobile and IoT (Internet of Things) devices"},{"letter":"C","text":"Virtualization support","explanation":"Although virtualization support is common on larger computer systems, virtualization support is not commonly used with IoT devices."},{"letter":"D","text":"ECC RAM","explanation":"ECC (Error Correction Code) RAM (Random Access Memory) is commonly associated with larger servers and not with low-power IoT devices."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.5 - CPU Features","link":"https://professormesser.link/1201030508","source":"book"},{"id":"A53","stem":"A technician is working with a desktop computer where the display shows a completely black screen. Powering the computer and monitor off and back on does not correct the issue. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"The computer resolution is different than the monitor","explanation":"Most monitors will adjust their display to match the resolution provided by the computer or video adapter. A resolution mismatch will usually result in a fuzzy image and not a blank screen."},{"letter":"B","text":"The monitor input is incorrect","explanation":"Many monitors have multiple input interfaces, but not all monitors will automatically switch to the active interface. Adjusting the input interface on the monitor controls will resolve any issues associated with the interface type and connection"},{"letter":"C","text":"Image scaling is disabled","explanation":"Image scaling will fill the screen if the image is smaller than the size of the display. If scaling is disabled, the image will most likely be a smaller image in the middle of the screen and a large amount of black space around each side."},{"letter":"D","text":"The monitor has a dead pixel","explanation":"A dead pixel is usually displayed as a single black dot on an otherwise normal display. A dead pixel would not result in a completely blank screen."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"A54","stem":"An engineer has manually configured IP addresses for a small office which uses a cable modem for Internet connectivity. However, none of the devices configured with a manual IP address are able to browse Internet websites. All devices are connected to the cable modem with twisted-pair Ethernet cables. This is the configuration of one device: IP address: 192.168.1.7 Subnet mask: 255.255.255.0 Default gateway: 192.168.1.1 DNS: 192.168.1.7 The engineer can successfully ping the local IP address and the default gateway address. Which of the following should be the next troubleshooting step?","choices":[{"letter":"A","text":"Check for duplicate IP addresses","explanation":"No mention was made of an duplicate IP address warning, and the ping tests worked properly to devices on the local subnet."},{"letter":"B","text":"Replace the Ethernet cable","explanation":"Since the ping tests worked locally, we can conclude that the Ethernet cable is most likely not related to this issue."},{"letter":"C","text":"Check the DNS configuration","explanation":"One of the most noticeable IP (Internet Protocol) configuration settings was the DNS (Domain Name Service) server IP address set to the same IP address the local device. Since DNS servers are commonly separate devices, it would be unusual to see a DNS configured with the same IP address of the local device. The next step should be to confirm the DNS settings with the local network administrator"},{"letter":"D","text":"Replace the cable modem","explanation":"The cable modem is most likely the default gateway, and a ping of that IP address worked properly. More tests would need to be performed before replacing any hardware."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.6 - IPv4 and IPv6","link":"https://professormesser.link/1201020601","source":"book"},{"id":"A55","stem":"A user in a remote office is connecting a device using an F-connector. Which of the following would be most likely associated with this connection?","choices":[{"letter":"A","text":"Cable modem","explanation":"A cable modem is commonly associated with a coaxial cable input using an F-connector. The output from the cable modem commonly uses an RJ45 Ethernet connector"},{"letter":"B","text":"Switch","explanation":"A switch is usually associated with Ethernet connections, and Ethernet commonly uses RJ45 connectors and not F-connectors."},{"letter":"C","text":"Punchdown block","explanation":"A punchdown block is often used instead of connectors, and individual wires will be physically pressed or \"punched\" into the block. A punchdown block is not commonly associated with F-connectors."},{"letter":"D","text":"DSL modem","explanation":"A DSL (Digital Subscriber Line) modem uses POTS (Plain Old Telephone Service) with RJ11 connectors to provide connectivity to the Internet service provider. A DSL modem does not commonly include F-connector interfaces."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.2 - Copper Connectors","link":"https://professormesser.link/1201030208","source":"book"},{"id":"A56","stem":"A user in the accounting department has turned on their computer and received the message “Date and Time not set.” Which of the following would be the most likely reason for this message?","choices":[{"letter":"A","text":"The motherboard battery has discharged","explanation":"The battery on a motherboard is used to maintain the date and time configuration when the computer is not connected to a power source. If the battery has discharged, the computer will not be able to maintain the proper time and an error message will appear during startup"},{"letter":"B","text":"Windows update has rebooted the computer","explanation":"Rebooting the computer will not cause the date and time to be reset."},{"letter":"C","text":"Daylight Saving Time occurred during the weekend","explanation":"Daylight Saving Time does not cause the computer's date and time to be reset, and any changes to the clock in Windows will be reflected in the BIOS."},{"letter":"D","text":"The BIOS was just upgraded","explanation":"A BIOS upgrade does not commonly reset the date and time on the system clock."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"A57","stem":"A user in the accounting department is connecting to their monitor using HDMI. The video appears normal, but the user does not hear any audio through the monitor's speakers. Which of the following would be the two most likely reasons for this audio issue? (Select TWO)","choices":[{"letter":"A","text":"Video output does not match the native resolution","explanation":"To get the sharpest image, the output from the computer should match the native resolution of the LCD (Liquid Crystal Display) monitor. However, this configuration setting does not disable or prevent the audio output."},{"letter":"B","text":"Audio controls are muted","explanation":"If the audio controls are muted, then no audio will be heard on any output device. The muted controls may be on the monitor or the operating system, so both will need to be checked during the troubleshooting process. The operating system will also need to be configured with the correct audio output location, and in this example the audio output should be configured for the HDMI (High-Definition Multimedia Interface) link"},{"letter":"C","text":"Not enough bandwidth for audio","explanation":"The HDMI connection has dedicated bandwidth for audio, so the audio signal will always be available to the monitor."},{"letter":"D","text":"Internet connectivity is unavailable","explanation":"The network connectivity from the computer does not have any impact on the monitor's ability to play audio."},{"letter":"E","text":"OS is not configured for HDMI audio output","explanation":"If the audio controls are muted, then no audio will be heard on any output device. The muted controls may be on the monitor or the operating system, so both will need to be checked during the troubleshooting process. The operating system will also need to be configured with the correct audio output location, and in this example the audio output should be configured for the HDMI (High-Definition Multimedia Interface) link"},{"letter":"F","text":"Display has a dead pixel","explanation":"A dead pixel on the display will always show as a blank dot, even if the rest of the monitor is showing a white page. However, this visual issue does not cause any problems with the audio output over HDMI."}],"correct":["B","E"],"multi":true,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"A58","stem":"A system administrator has created a cloud configuration which automatically monitors utilization for usage-based billing. Which of the following describes this cloud computing characteristic?","choices":[{"letter":"A","text":"Metered","explanation":"Metering will measure transaction activity, CPU utilization, storage use, and other important metrics. These are often used for billing purposes, where the customer will pay for CPU or storage by the application instance. However, this metering does not automatically add or remove instances"},{"letter":"B","text":"File synchronization","explanation":"File synchronization keeps all shared data identical between multiple application instances, but synchronizing the data doesn't add or remove resources from the application instance."},{"letter":"C","text":"Elasticity","explanation":"Elasticity is the characteristic of scaling up or down cloud resources with demand. More resources will be made available during busy times, and those resources will be seamlessly removed when the demand is low."},{"letter":"D","text":"Availability","explanation":"Many cloud implementations will have methods for maintaining uptime and availability if an outage occurs. This redundancy doesn't provide a method of dynamically increasing or decreasing the available application instance resources."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Characteristics","link":"https://professormesser.link/1201040202","source":"book"},{"id":"A59","stem":"A group of wireless laptops in a conference room are reporting intermittent connectivity issues. The wired computers in the room are not experiencing any network problems. A check of the laptops shows the IP addresses and configurations appear to be correct. Which of the following would be the best next troubleshooting step?","choices":[{"letter":"A","text":"Verify the wireless signal strength","explanation":"Since the wired devices are working properly, the troubleshooting process should focus on the wireless network. The connectivity is also intermittent, which means that the network is operating normally during certain periods. This would move the focus from the network configuration to a connectivity or signal strength issue"},{"letter":"B","text":"Check the ARP table on the default gateway","explanation":"Since the wired devices are working normally and the network is intermittently working, the overall configuration of the network would not be the first place to start the troubleshooting process."},{"letter":"C","text":"Confirm the operation of the DHCP server","explanation":"An inoperable DHCP (Dynamic Host Configuration Protocol) server would cause the local devices to automatically configure a link-local IP address. Since there are no reports beyond general connectivity issues and DHCP server outages are relatively unusual, checking on the DHCP server would not be the next step in the troubleshooting process."},{"letter":"D","text":"Perform a wire map on the network drops","explanation":"The issue reported in this scenario is relating to the wireless network only. The wired devices are not experiencing any issues with connectivity, so obtaining a wire map would not be the next troubleshooting step."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"A60","stem":"A server administrator has been asked to troubleshoot a system which has been slowing down over time. While examining the computer, the administrator can hear a series of clicks from the inside of the case. Which of the following should be the first step to address this issue?","choices":[{"letter":"A","text":"Replace the motherboard","explanation":"Motherboards don't tend to have moving parts, so a clicking noise would probably not be related to the motherboard. There's also not enough information to definitively identify the source of the noise, so replacing hardware would not commonly be the first step."},{"letter":"B","text":"Power the system off and back on","explanation":"Although software can often be corrected with a reset, hardware isn't commonly fixed with a power cycle. Before making any changes, it would be useful to confirm a good backup exists and perform more investigation regarding the noise."},{"letter":"C","text":"Replace the hard drive","explanation":"If the sound was related to a problem with the hard drive, it would be even more important to have a good backup of the data."},{"letter":"D","text":"Perform a full backup of the server","explanation":"A clicking noise indicates some type of hardware issue with the computer, so the first step would be to confirm that a recent backup is available for all of the data on this system. If the computer fails completely, at least the data will be secure"},{"letter":"E","text":"Replace the power supply","explanation":"There's no evidence that the power supply is faulty, but it would be useful to investigate the source of the noise after backing up the data."}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.2 - Troubleshooting Storage Devices","link":"https://professormesser.link/1201050201","source":"book"},{"id":"A61","stem":"When pressing the power button on a desktop computer, the power indicator lights up but the computer does not display any message on the screen. The voltage at the wall outlet has been checked and it appears to be normal. The motherboard power connector voltage was checked, and the 12 volt pin was showing 6 volts. What is the most likely cause of this issue?","choices":[{"letter":"A","text":"The components using 12 volt power are faulty","explanation":"Even if the components are faulty, the power supply should still be providing 12 volts for those devices."},{"letter":"B","text":"The power supply is faulty","explanation":"If the 12 volt line from the power supply to the motherboard is showing 6 volts, it's likely a problem with the power supply itself. A power supply replacement should be the next troubleshooting step for this system"},{"letter":"C","text":"The wall outlet voltage does not match the power supply","explanation":"Many power supplies can automatically switch to the correct input voltage from the wall outlet. A mismatch would result in a non-working system or damage to the computer's components."},{"letter":"D","text":"The motherboard is faulty","explanation":"A bad motherboard would not prevent the power supply from operating at the correct voltage."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 3.6 - Power","link":"https://professormesser.link/1201030601","source":"book"},{"id":"A62","stem":"A manager would like print jobs sent to a network laser printer to use paper from the third tray. However, no tray options are listed when submitting the print job. Which of the following would resolve this issue?","choices":[{"letter":"A","text":"Restart the printer","explanation":"Restarting the printer can reconnect the printer to the print server and clear out the memory of the printer. However, the tray configuration option isn't part of the printer and won't change based on a printer restart."},{"letter":"B","text":"Update the printer driver","explanation":"The printer driver contains information about the printer, available printing configurations, and a list of trays to use for the print job. The printer driver determines if these configurations will appear on a user's print options"},{"letter":"C","text":"Stop and restart the print server","explanation":"The print server accepts print jobs and queues them for the printing process. If no jobs are printing, then restarting the print server might be a good troubleshooting step. However, the print server does not determine what options are shown when submitting a print job."},{"letter":"D","text":"Change the printer permissions","explanation":"The permissions associated with a networked printer can allow or prevent access from other devices. The available print trays are not managed through the printer permissions."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"A63","stem":"A remote user is visiting their corporate office. They have connected their laptop to the wireless network, but the corporate Internet access is performing much slower than their remote site network. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"The default gateway is incorrect","explanation":"An incorrect default gateway configuration would prevent access to remote networks, including all access to the Internet. The reported issue is related to slow performance to the Internet, so the default gateway would therefore be correctly configured."},{"letter":"B","text":"The laptop has been assigned an APIPA address","explanation":"APIPA (Automatic Private IP Addressing) is an automated method of assigning IP addresses when a DHCP server is not available. An APIPA address would limit all network traffic to the local subnet and Internet access would not be available."},{"letter":"C","text":"The user does not have permission to use the wireless network","explanation":"The wireless authentication process occurs after a device has attempted to connect to the wireless network. An authentication issue would not cause the network to perform slowly."},{"letter":"D","text":"There is interference with the wireless signal","explanation":"Poor performance can be caused by many different variables, but the only choice which would cause a performance problem is interference. A disruption to the wireless signal could potentially cause slowdowns and disconnections for anyone using the wireless network"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.5 - Troubleshooting Networks","link":"https://professormesser.link/1201050501","source":"book"},{"id":"A64","stem":"Which of the following would best describe the use of a port replicator?","choices":[{"letter":"A","text":"Increase the number of available USB interfaces","explanation":"A port replicator is used to increase or duplicate interfaces on a device. Port replicators usually connect to a computer using USB and provide numerous USB, video, flash card, and other assorted interfaces"},{"letter":"B","text":"Extend the length of an HDMI cable","explanation":"A port replicator may include an HDMI interface, but it doesn't extend the length of an existing HDMI connection."},{"letter":"C","text":"Send a copy of network frames to a protocol analyzer","explanation":"A network tap is a physical device used to sit in the middle of a connection and direct copies of network frames to a protocol analyzer or similar device."},{"letter":"D","text":"Maintain a redundant array of storage drives","explanation":"A hardware-based RAID array requires a specialized storage adapter or interface card. A port replicator does not contain the hardware necessary to configure a RAID array."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 1.2 - Mobile Device Accessories","link":"https://professormesser.link/1201010202","source":"book"},{"id":"A65","stem":"A user is reporting a shared laser printer in the marketing department is not printing from one particular application. The front panel of the printer shows the printer is online and ready to receive print jobs. Other users in the department are able to successfully print to the printer. Which of the following would be the best next troubleshooting step?","choices":[{"letter":"A","text":"Power cycle the printer","explanation":"We know the printer is working for other users, so power cycling the printer would not resolve this particular issue."},{"letter":"B","text":"Restart the print spooler","explanation":"Other users are printing to the network printer, so we know the print spooler is working properly. Restarting the spooler would not resolve this issue."},{"letter":"C","text":"Perform a test print from the printer console","explanation":"A test print from the printer console would verify that the printer itself is working properly, but we already know this because of the print jobs sent by other users on the network."},{"letter":"D","text":"Verify the network printer name in the application","explanation":"We know that the printer is working normally because other people are able to print successfully. This also means that the spooling process is working and the print server is successfully queuing the print jobs. Given the other options, it's most likely that the user is directing the print job to a different printer"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.6 - Troubleshooting Printers","link":"https://professormesser.link/1201050601","source":"book"},{"id":"A66","stem":"A network administrator is connecting four company locations in different countries. Which of the following would best describe this configuration?","choices":[{"letter":"A","text":"LAN","explanation":"LANs (Local Area Networks) are located in the same building or group of buildings located nearby. Ethernet and 802.11 wireless networks are generally considered to be LAN connections."},{"letter":"B","text":"PAN","explanation":"A private network designed for an individual is a PAN (Personal Area Network). Bluetooth, infrared, and near field communication links are categorized as PAN connections."},{"letter":"C","text":"MAN","explanation":"A local network provider can sometimes connect sites in the same city. These connections would be MANs (Metropolitan Area Networks)."},{"letter":"D","text":"WAN","explanation":"A WAN (Wide Area Network) connects LANs across a long geographical distance. Once the link extends past the local city area, the connection would be considered a WAN link"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.7 - Network Types","link":"https://professormesser.link/1201020702","source":"book"},{"id":"A67","stem":"A system administrator has received a report of customers receiving email messages from the company, but upon further analysis the administrator finds the messages were not actually sent by the corporation. Which of the following should be implemented to prevent these spoofed email messages?","choices":[{"letter":"A","text":"Add multi-factor authentication to all email logins","explanation":"The spoofed email messages did not originate from the corporate network, so modifying the authentication process would not prevent customers from receiving spoofed email messages."},{"letter":"B","text":"Change the passwords on all email accounts","explanation":"Since the email messages did not originate from a corporate account, changing the passwords would not prevent the spoofed emails."},{"letter":"C","text":"Configure an SPF record in the DNS","explanation":"An SPF (Sender Policy Framework) record in the DNS (Domain Name System) server provides a list of all servers authorized to send emails for a domain. Any emails not originating from an authorized source can be dismissed as unauthorized or invalid"},{"letter":"D","text":"Modify the firewall rules to prevent outgoing emails","explanation":"The spoofed email messages were sent from a different network, so modifying the corporate firewall would not block any email spoofing."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 2.4 - DNS Configuration","link":"https://professormesser.link/1201020401","source":"book"},{"id":"A68","stem":"A system administrator has configured a VM for dual processors, 16 GB of RAM, and 120 GB of disk space. Which of the following is required to start this VM?","choices":[{"letter":"A","text":"Shared network address","explanation":"There are many options for a virtual machine, including shared, bridged, and private network addresses. A shared network address is not required to start a virtual machine."},{"letter":"B","text":"Hypervisor","explanation":"A hypervisor, or virtual machine manager, is the software that manages the virtual platform and guest operating systems"},{"letter":"C","text":"Virtual switch","explanation":"Like physical switches, virtual switches can be used to provide connectivity and segmentation for virtual machines. A virtual switch is not a requirement to start or use a virtual machine"},{"letter":"D","text":"Video display","explanation":"Many servers operate without a video display, mouse, or keyboard. These systems are \"headless,\" and a video display is not required to start a virtual machine."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","source":"book"},{"id":"A69","stem":"A site manager has noticed her smartphone has a short battery life when used at work, and the battery life is normal when working from home. The work location has limited mobile service reception, but most office services are provided over the local 802.11 Wi-Fi network. The site manager does not enable Bluetooth on her smartphone. Which of the following would be the best way to extend the battery life of her mobile device?","choices":[{"letter":"A","text":"Disable 802.11 Wi-Fi","explanation":"The Wi-Fi network is used at work for office services, so disabling Wi-Fi is not a good option. Since Wi-Fi does not require a constant connection, it's unlikely that the battery usage is associated with the Wi-Fi radio."},{"letter":"B","text":"Disable the cellular radio at work","explanation":"When a mobile provider's network isn't available, a phone will constantly try to find and reconnect to a cellular network. This reconnection process constantly uses the radio, and subsequently more of the battery is used in the process. To conserve battery life, it would be useful to disable the cellular network connection when outside of a coverage area"},{"letter":"C","text":"Replace the battery","explanation":"It's possible that the battery in the mobile device could need replacing, but the battery problem doesn't appear to happen while at home. If the battery was the primary issue, the battery would work just as poorly at home as the office."},{"letter":"D","text":"Enable Bluetooth on the mobile device","explanation":"Enabling a feature like the Bluetooth radio would increase battery usage. If the battery is the biggest concern and no Bluetooth features are in use, it's a better idea to keep Bluetooth disabled."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"A70","stem":"A desktop computer has just abruptly shut off, and pressing the power button doesn’t restart the system. There are no fans spinning, no lights are on, and no messages appear on the display. Which of these would be the most likely cause of this issue?","choices":[{"letter":"A","text":"The BIOS is configured with a startup password","explanation":"A startup password would not cause the system to power down, and the password prompt would be presented if the computer was powering on."},{"letter":"B","text":"The LCD display backlight has failed","explanation":"A failure of the LCD backlight would make it appear the screen is not working, but the fans and lights would still be working normally."},{"letter":"C","text":"The power supply is faulty","explanation":"A faulty power supply could cause a loss of power across all computer systems, and the lack of fans, lights, and output on the display would be the most likely cause given the available options"},{"letter":"D","text":"The master boot record is corrupted","explanation":"A corrupted master boot record may prevent a system from booting, but the fans, lights, and screen output would still be working properly."},{"letter":"E","text":"The boot sector is missing","explanation":"A missing boot sector would not prevent the fans and lights from working properly. The screen would commonly show an error explaining that an operating system was not able to properly start."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.1 - Troubleshooting Hardware","link":"https://professormesser.link/1201050101","source":"book"},{"id":"A71","stem":"What kind of device is commonly used to filter traffic based on a predefined set of rules?","choices":[{"letter":"A","text":"PoE switch","explanation":"PoE (Power over Ethernet) switches are used to provide power to Ethernet-connected devices. This allows devices such as access points, security cameras, and VoIP phones to connect with a single Ethernet link for both data connectivity and device power."},{"letter":"B","text":"ONT","explanation":"An ONT (Optical Network Terminal) is a device commonly used to convert between a network provider's fiber connection to a customer's copper network. The ONT does not generally provide any filtering or access restrictions."},{"letter":"C","text":"DSL modem","explanation":"DSL (Digital Subscriber Line) is a common Internet connection technology provided over the same twisted pair copper used by analog telephone services. A DSL modem allows the end-user to connect their existing network to the DSL network, but the DSL modem does not filter traffic based on a set of access rules."},{"letter":"D","text":"Firewall","explanation":"A firewall is designed to evaluate inbound traffic, compare that traffic to predefined security policies, and allow or block that traffic from passing through the firewall. Firewalls are common security appliances between an organization's internal network and the Internet"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.5 - Network Devices","link":"https://professormesser.link/1201020501","source":"book"},{"id":"A72","stem":"Which of these connection types are commonly delivered using coax to provide Internet data, voice, and video over the same wire?","choices":[{"letter":"A","text":"DSL","explanation":"DSL (Digital Subscriber Line) uses a pair of copper wires to provide Internet access over the same connection as a traditional telephone service."},{"letter":"B","text":"Cable broadband","explanation":"Cable television brought video into everyone's home, and now voice and Internet services are included on the same coax cable"},{"letter":"C","text":"ONT","explanation":"An ONT (Optical Network Terminal) is a demarcation point commonly used for fiber to the premises. Although the ONT may include a coax connection for television, the ONT itself does not commonly combine voice, video, and Internet over coax."},{"letter":"D","text":"PoE","explanation":"PoE (Power over Ethernet) is a convenient way to provide a power source for a device without connecting to a power outlet. PoE does not provide any consolidation of services over coax cable, however."}],"correct":["B"],"multi":false,"objective":"220-1201, Objective 2.7 - Internet Connection Types","link":"https://professormesser.link/1201020701","source":"book"},{"id":"A73","stem":"A manager's smartphone will normally update applications automatically, but the update app doesn't show any new upgrades in over two weeks. Which of the following would be the most likely reason for this issue?","choices":[{"letter":"A","text":"The digitizer is damaged","explanation":"The digitizer is associated with screen input through the use of fingers or a stylus. A damaged stylus might not allow direct input to the system, but it wouldn't prevent any apps from updating."},{"letter":"B","text":"The battery is swollen","explanation":"A swollen battery is a safety concern, and even if the system continues to operate the battery would need to be replaced. A swollen battery would be a very obvious physical issue, but it would not cause problems with the automated update process."},{"letter":"C","text":"Storage space is low","explanation":"An operating system needs enough available storage space to download, uncompress, and install a new version of an app. If storage space is slow, the upgrade process cannot proceed due to this lack of space"},{"letter":"D","text":"Bluetooth is disabled","explanation":"Bluetooth is not used during the app upgrade process. Disabling Bluetooth might prevent the use of wireless headphone or headsets, but it wouldn't prevent the upgrade process from working normally."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"A74","stem":"A user is pairing a Bluetooth headset to their smartphone. What type of security is used during the pairing process to authorize this connection?","choices":[{"letter":"A","text":"802.1X","explanation":"802.1X is a standard for port-based network access control (NAC). This is commonly used for network authentication, but it is not part of the Bluetooth pairing process."},{"letter":"B","text":"Client certificate","explanation":"Adding a client certificate to a device can help with an authentication process, but a client certificate is not used when pairing a Bluetooth accessory."},{"letter":"C","text":"Pre-shared key","explanation":"A pre-shared key is a passphrase two devices can use to validate the authentication process. These are commonly used with private wireless networks, but they are not part of the Bluetooth pairing process."},{"letter":"D","text":"PIN","explanation":"A PIN (Personal Identification Number) is used to validate the device connecting during the Bluetooth pairing process. This authorization prevents a third-party from connecting to a smartphone or tablet without permission"},{"letter":"E","text":"Username and password","explanation":"A username and password are some of the most common ways to provide authentication, but the Bluetooth pairing process does not use usernames or passwords."}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.3 - Mobile Device Networks","link":"https://professormesser.link/1201010301","source":"book"},{"id":"A75","stem":"A company is deploying cloud-hosted virtual desktops for training room classes. The VMs have already been configured in the cloud. Which of the following is required to access these VMs using thin clients in the training room?","choices":[{"letter":"A","text":"High-end video cards","explanation":"Cloud-based virtual desktops are being processed on servers in the cloud, so the local thin clients do not require any advanced graphics capabilities."},{"letter":"B","text":"Separate Internet connection","explanation":"The communication to the virtual desktops is sending video, keyboard, and mouse updates, and all of this can operate with a minimum of network bandwidth. A separate or dedicated Internet connection is not required."},{"letter":"C","text":"Mouse, keyboard, and monitor","explanation":"Cloud-hosted virtual desktops are a type of VDI (Virtual Desktop Infrastructure). Access to the desktop is provided over a remote access- style client, and access can be provided from almost any operating system using a low-bandwidth network connection. The client device is usually a thin-client that has a minimum set of resources, a mouse, keyboard, and a monitor"},{"letter":"D","text":"Category 6A cabling","explanation":"Category 6A cabling would commonly be associated with high-speed 10 gigabit per second Ethernet networking. A thin client communicating to a cloud-hosted virtual desktop can operate at relatively low bandwidths."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 4.1 - Virtualization Services","link":"https://professormesser.link/1201040102","source":"book"},{"id":"A76","stem":"A technician has connected a laptop to an LCD. The LCD is displaying the correct information, but all of the content appears to be fuzzy and difficult to read. Which of the following is the most likely reason for this issue?","choices":[{"letter":"A","text":"The LCD display is faulty","explanation":"If the LCD display is showing information (however skewed), then it may not be a hardware failure. Adjusting the operating system's video settings to match the LCD display hardware will often resolve any odd visual display quirks."},{"letter":"B","text":"The laptop display adapter is incompatible with the LCD display","explanation":"Most display adapters will include a video output format that is compatible with most LCD displays. It would be unusual to find an LCD display that would not operate with a specific video adapter."},{"letter":"C","text":"The laptop resolution is incorrect","explanation":"An LCD (Liquid Crystal Display) has a native resolution based on the physical dimensions of the display. If the resolution settings in the operating system don't match the native resolution of the physical display, the information on the screen may appear blurry or distorted. Matching the native resolution in the operating system will resolve this issue"},{"letter":"D","text":"The LCD display cable is faulty","explanation":"A bad cable will commonly show flashes of information or intermittent periods of a black screen. A bad cable would not commonly display information in a fuzzy or skewed format."}],"correct":["C"],"multi":false,"objective":"220-1201, Objective 5.3 - Troubleshooting Display Issues","link":"https://professormesser.link/1201050301","source":"book"},{"id":"A77","stem":"An engineering firm is upgrading their storage array to include additional drive space for documents and designs. The primary goal is to provide high performance and uptime, even if two drives were to fail. Which of the following would be the best choice for this firm?","choices":[{"letter":"A","text":"RAID 1","explanation":"RAID 1 is also called mirroring, because file blocks are duplicated between two or more physical drives. Losing a single drive in a RAID 1 array will still allow access to the data on the other mirrored drive, but losing two drives would cause the data to be inaccessible."},{"letter":"B","text":"RAID 5","explanation":"RAID 5 is striping with parity, where file blocks are striped across multiple storage drives and one storage drive maintains parity data. Data would still be available after a single drive failure in RAID 5, but two failed drives would cause data loss."},{"letter":"C","text":"RAID 0","explanation":"RAID 0 is also called striping, where file blocks are split across multiple physical drives. However, RAID 0 does not include any redundancy features. A single drive failure in RAID 0 results in data loss."},{"letter":"D","text":"RAID 10","explanation":"RAID (Redundant Array of Independent Disks) is a method of combining storage drives together to add speed and/or redundancy. A RAID 10 array is a nested RAID configuration that creates a mirrored set of RAID 0 drives. As long as only one drive fails in each RAID 0 mirror, the redundancy will remain valid and the user's data will continue to be available"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.4 - RAID","link":"https://professormesser.link/1201030402","source":"book"},{"id":"A78","stem":"The installation parameters for an access point specify a configuration option for 40 MHz. Which of the following best describes this configuration option?","choices":[{"letter":"A","text":"Bandwidth","explanation":"The bandwidth describes how much of the frequency range will be used when transmitting or receiving information. Generally speaking, larger bandwidths allow for faster data transfers"},{"letter":"B","text":"Channel","explanation":"802.11 wireless channels are generally numbered between 1 and 233, and additional channels will be added as newer 802.11 standards are ratified."},{"letter":"C","text":"Category","explanation":"In networking, a category is usually referenced as a standard of copper cabling. Cable categories are not generally associated with wireless network bandwidth values."},{"letter":"D","text":"Frequency","explanation":"802.11 wireless frequencies are usually found in the 2.4 GHz, 5 GHz, and 6 GHz frequency bands. A value as small as 40 MHz would not be associated with an 802.11 frequency."},{"letter":"E","text":"802.11 standard","explanation":"802.11 standards are usually referenced with a letter, such as 802.11n, 802.11ac, or 802.11ax. The 802.11 standards do not use megahertz as an identification method."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 2.2 - Wireless Network Technologies","link":"https://professormesser.link/1201020201","source":"book"},{"id":"A79","stem":"A company needs to purchase a new printer for an open work area. The primary requirement of this printer is to be as quiet as possible. Which of these printer types would be the best fit for this requirement?","choices":[{"letter":"A","text":"Dot-matrix","explanation":"Dot matrix printers are probably the loudest option in this list. The metal pins in a dot matrix print head are impacting the page, and that printing process makes a significant amount of noise."},{"letter":"B","text":"Inkjet","explanation":"An inkjet printer's printing process is a bit quieter than a dot matrix printer, but it's not as quiet as thermal printing. The sound of the carriage moving the print heads across the page and the printing process itself would not provide the quietest printing option given the available options."},{"letter":"C","text":"Laser","explanation":"A laser printer uses many moving parts, high voltages, and a large motor to print a single page. This process makes more noise than a thermal printer, so it wouldn't fit the requirements."},{"letter":"D","text":"Thermal","explanation":"Of the available options, thermal printers are the quietest. The only moving parts in a thermal printer are the motors that push the paper through the printer, and those motors are small and run almost silently"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.8 - Thermal Printers","link":"https://professormesser.link/1201030805","source":"book"},{"id":"A80","stem":"A user in the marketing department would like to use a stylus to provide input through an external digitizer. Which of the following would be the best choice for this requirement?","choices":[{"letter":"A","text":"LCD touchscreen","explanation":"An LCD touchscreen is integrated into the display and uses fingers as the input method."},{"letter":"B","text":"Port replicator","explanation":"A port replicator is used in conjunction with a laptop to provide a quick and easy way to connect and disconnect from external peripherals. A port replicator does not provide any type of input function with a stylus."},{"letter":"C","text":"Wireless mouse","explanation":"A wireless mouse is a common input device, but it does not provide any input functionality with a stylus."},{"letter":"D","text":"Drawing pad","explanation":"A drawing pad connects to a desktop or laptop computer to provide very precise input using a digitizer and stylus"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 1.2 - Mobile Device Accessories","link":"https://professormesser.link/1201010202","source":"book"},{"id":"A81","stem":"A company has designed a platform to scale up when the application use increases during the day, and scale back down at night. Which of the following best describes this characteristic of cloud computing?","choices":[{"letter":"A","text":"Resource pooling","explanation":"To provide elasticity, there should be plenty of resources available when needed. Resource pooling puts all of the computing power in one place, and portions of the pool can be distributed as-needed."},{"letter":"B","text":"Measured service","explanation":"Tracking costs and utilization is useful for tracking and billing, and a measured service provides a way to monitor and view the use of cloud- based resources."},{"letter":"C","text":"Hybrid","explanation":"A hybrid cloud model combines both public and private clouds together. The hybrid cloud does not describe the scalability of these cloud deployment models."},{"letter":"D","text":"Elasticity","explanation":"Scaling up and down as needed is a significant characteristic of cloud computing. This allows organizations to manage and pay for resources when busy, but save time and money when the resources are no longer needed"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 4.2 - Cloud Characteristics","link":"https://professormesser.link/1201040202","source":"book"},{"id":"A82","stem":"A user’s tablet has stopped responding to any type of finger input on the screen. The clock and other tablet functions appear to be working. Which of the following would be the best way to correct this issue?","choices":[{"letter":"A","text":"Replace the screen","explanation":"Without running additional tests, it's impossible to know if the screen is actually the issue. Before switching out any hardware, it's useful to restart the system and run some hardware diagnostics."},{"letter":"B","text":"Reset the wireless network","explanation":"The wireless network would not have any impact on the screen digitizer. If the tablet was experiencing network issues, then resetting the wireless network may resolve any problems."},{"letter":"C","text":"Connect to a power source","explanation":"A tablet will continue to provide input to the digitizer, even in situations of low battery life. Connecting to a power source would not be a common solution for this issue."},{"letter":"D","text":"Restart the tablet","explanation":"Before making any changes to hardware or software, it's useful to restart the tablet to see if a software glitch may have been the underlying issue"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 5.4 - Troubleshooting Mobile Devices","link":"https://professormesser.link/1201050401","source":"book"},{"id":"A83","stem":"A system administrator needs a secure method of storing encryption keys. Which of the following would be the best choice for this requirement?","choices":[{"letter":"A","text":"BIOS","explanation":"A computer's BIOS (Basic Input-Output System) is the software used during the startup process of a computer. The BIOS does not provide a method of securely storing cryptographic keys."},{"letter":"B","text":"Secure Boot","explanation":"Secure Boot is a UEFI (Unified Extensible Firmware Interface) BIOS feature used to protect against any unauthorized changes to the BIOS or operating system."},{"letter":"C","text":"NTFS","explanation":"The NTFS (New Technology File System) file system is the primary storage system used on Windows devices. Although NTFS can encrypt objects in the file system, it does not use that encryption as a secure key backup system."},{"letter":"D","text":"HSM","explanation":"An HSM (Hardware Security Module) is commonly used as a secure method of key backup. The HSM can be deployed as a standalone server or in a lightweight form with Smart Cards or USB keys"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 3.5 - TPM and HSM","link":"https://professormesser.link/1201030507","source":"book"},{"id":"A84","stem":"A server administrator is upgrading the memory in a web server from 16 GB of non-ECC RAM to 64 GB of ECC RAM. After starting the system with the new memory, the computer beeps and nothing is displayed on the screen. Changing the number and location of new RAM modules results in the same beeping sounds and blank screen. After replacing the original 16 GB modules, the system starts normally. Which of the following is the most likely reason for this issue?","choices":[{"letter":"A","text":"The new memory is not compatible with the motherboard","explanation":"ECC (Error Correcting Code) memory is designed to detect errors and correct the errors on the fly. Not all systems use ECC memory, and it's important the memory match the motherboard requirements. If non- ECC RAM (Random Access Memory) is replaced with ECC RAM and the system fails to start, then the issue is most likely associated with the change from non-ECC to ECC RAM"},{"letter":"B","text":"The new memory is faulty","explanation":"Although it's possible that the new RAM is faulty, the more likely and obvious issue is the switch from non-ECC to ECC memory. Before blaming the RAM, it would be useful to know what type of memory the motherboard is expecting."},{"letter":"C","text":"The BIOS needs to be updated","explanation":"Although a BIOS upgrade may be a rare upgrade requirement, the more obvious issue with this upgrade is related to the memory type."},{"letter":"D","text":"The system is overheating during the startup process","explanation":"It takes a bit of time to heat up the components inside of a computer, so a failure that occurs at startup is most likely not related to thermal or heat issues inside of the computer."}],"correct":["A"],"multi":false,"objective":"220-1201, Objective 3.3 - Memory Technologies","link":"https://professormesser.link/1201030302","source":"book"},{"id":"A85","stem":"A workstation has been assigned an APIPA address. Which of the following would be the most likely reason for this assignment?","choices":[{"letter":"A","text":"The workstation is not connected to the wireless network","explanation":"APIPA addresses are used for any IP connected device, regardless of the type of network in use."},{"letter":"B","text":"The DNS server is misconfigured","explanation":"APIPA addresses are related to the local IP address and the availability of a DHCP server. The DNS server is not involved in the assigning of an APIPA address."},{"letter":"C","text":"The network is using public Internet addresses","explanation":"Assigned APIPA addresses include the range between 169.254.1.0 and 169.254.254.255. These addresses are considered \"link-local\" addresses and can only communicate within the same local IP subnet. APIPA addresses are not routable and devices with an APIPA address cannot send or receive traffic to the Internet. APIPA addresses are not public Internet addresses."},{"letter":"D","text":"The DHCP server is down","explanation":"APIPA (Automatic Private IP Addressing) is an IPv4 (Internet Protocol version 4) link-local addressing scheme. If a device does not have a static IP address and an address is not available from a DHCP server, the local device will assign itself an APIPA address and communication to other APIPA devices on the same subnet will be available"}],"correct":["D"],"multi":false,"objective":"220-1201, Objective 2.6 - Assigning IP Addresses","link":"https://profe
