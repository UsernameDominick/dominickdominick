name: Deploy

# A push to main puts the site live: Cloudflare gets whatever is in public/ (see wrangler.jsonc). It needs the repository secrets
# CLOUDFLARE_API_TOKEN (a token that can edit Workers Scripts) and CLOUDFLARE_ACCOUNT_ID; without them the job skips itself with a notice
# instead of failing. There are no tests or other checks: what is on main is what ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: ready
        name: Are the Cloudflare credentials set?
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets, so nothing was deployed."
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        if: steps.ready.outputs.ready == 'true'
        run: npx --yes wrangler@4.149.0 deploy
