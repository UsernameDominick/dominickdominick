name: Monitor

# A smoke test of the live site every six hours (and on demand), so a problem that no deploy caused (an expired setting, a Cloudflare
# incident, the maintenance switch left on) is noticed. A failure opens one issue; later failures add a comment to it instead of
# opening more.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Smoke test the live site
        id: smoke
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
        run: node scripts/smoke.mjs https://dominickdominick.com
      - name: Tell someone
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --repo "${{ github.repository }}" --label live-site-down --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Still failing: $run_url"
          else
            gh label create live-site-down --repo "${{ github.repository }}" --color B60205 --description "The scheduled smoke test of the live site failed" 2>/dev/null || true
            gh issue create --repo "${{ github.repository }}" --label live-site-down --title "The live site failed its smoke test" --body "The scheduled check of https://dominickdominick.com failed: $run_url"
          fi
