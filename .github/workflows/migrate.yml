name: Migrate

# Applies the files in migrations/ to the PRODUCTION database. It only runs when someone starts it by hand and types "migrate production",
# which is the approval step: GitHub's required-reviewer environments are not available on a free private repository, so the typed word
# and the fact that only a repository admin can start a workflow are the gate. A database backup is taken first and kept for 30 days.
#
# The order is always: merge the pull request, run this, then the deploy goes through (a deploy refuses to ship while a migration waits).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate production" to apply the waiting migrations to the live database'
        required: true

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the confirmation and the credentials
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate production" ]; then
            echo "::error::Nothing was applied. Type exactly: migrate production"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set (outline.md, section 0)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Show what is waiting
        run: npx wrangler d1 migrations list DB --remote
      - name: Back the database up first
        run: |
          mkdir -p backup
          npx wrangler d1 export DB --remote --output "backup/before-migration-$(date -u +%Y%m%dT%H%M%SZ).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: database-backup-before-migration
          path: backup/
          retention-days: 30
      - name: Apply
        run: npx wrangler d1 migrations apply DB --remote
