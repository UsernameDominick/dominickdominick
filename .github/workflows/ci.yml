name: CI

# Every pull request is checked. Every push to main is checked again and then shipped: the deploy only runs if the checks are green, the
# live site is smoke-tested right after, and a failed smoke test rolls the deploy back. Database changes are NOT part of this: they go
# through migrate.yml, which only runs when asked.
#
# Until the Cloudflare secrets exist (see outline.md, section 0) the deploy job skips itself with a notice and Cloudflare's own git build
# keeps deploying main; the "verify" job then waits for that deploy and smoke-tests it instead.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # The path filter lists a pull request's changed files through the API, which needs this read permission.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'worker/**'
              - 'public/**'
              - 'tests/**'
              - 'schema.sql'
              - 'migrations/**'
              - 'seed/**'
              - 'package.json'
              - 'package-lock.json'
              - 'wrangler.jsonc'
              - '.github/workflows/ci.yml'

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Every script parses
        run: find worker public scripts tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Pure tests
        run: npm test
      - name: The Worker bundles
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle"

  browser:
    needs: [changes, checks]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Local database
        run: npm run db:local
      - name: Browser tests
        run: node tests/e2e/run.mjs
      # test_sound_render.js writes every voice, every drum of every kit and every starter song as a WAV file: download this artifact from the run
      # and listen, to judge a change to how things sound by ear (report.json has each sound's peak, level and render time).
      - name: Sound library (WAV files to listen to)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-library
          path: tests/e2e/sound-library
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: [checks, browser]
    # Only after a push to main, and only when the checks passed (the browser job may have been skipped for a change that touches no site code).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      shipped: ${{ steps.ready.outputs.ready }}
    steps:
      - id: ready
        name: Are the Cloudflare credentials set?
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so this workflow does not deploy. Cloudflare's own build deploys main until they are added (outline.md, section 0)."
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.ready.outputs.ready == 'true'
        run: npm ci
      - name: Refuse to deploy while a database migration is waiting
        if: steps.ready.outputs.ready == 'true'
        run: |
          out="$(npx wrangler d1 migrations list DB --remote 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -qi "no migrations to apply"; then exit 0; fi
          echo "::error::A database migration is waiting. Run the Migrate workflow first, then re-run this deploy."
          exit 1
      - name: Deploy
        if: steps.ready.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Smoke test the live site
        id: smoke
        if: steps.ready.outputs.ready == 'true'
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
        run: node scripts/smoke.mjs https://dominickdominick.com
      - name: Roll back
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: npx wrangler rollback --message "smoke test failed after ${{ github.sha }}" --yes

  verify:
    # The deploy job did not ship (no Cloudflare credentials yet): wait for Cloudflare's own build of this commit, then smoke-test the live site.
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.shipped == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Wait for Cloudflare's build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cloudflare reports its build as a check on the commit. Give it a few minutes to appear, then until it finishes.
          for i in $(seq 1 60); do
            runs="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '[.check_runs[] | select(.name | test("Workers Builds|cloudflare"; "i"))]')"
            n="$(echo "$runs" | jq length)"
            if [ "$n" -gt 0 ]; then
              pending="$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')"
              if [ "$pending" -eq 0 ]; then echo "Cloudflare build finished"; break; fi
            elif [ "$i" -ge 12 ]; then
              echo "No Cloudflare build check appeared; testing the live site anyway"; break
            fi
            sleep 20
          done
          sleep 30
      - name: Smoke test the live site (retrying while the new version goes out)
        id: smoke
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
        run: |
          for i in $(seq 1 20); do
            if node scripts/smoke.mjs https://dominickdominick.com; then exit 0; fi
            echo "Attempt $i failed; the new version may still be going out. Waiting 30 seconds."
            sleep 30
          done
          exit 1
      - name: Open an issue if it failed
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Live site failed its smoke test after ${GITHUB_SHA::7}" \
            --body "The smoke test failed against https://dominickdominick.com after the deploy of ${{ github.sha }}. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Roll back in the Cloudflare dashboard (Workers > dominickdominick > Deployments) if the site is broken."
