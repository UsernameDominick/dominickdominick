	}

	// PROTOTYPE ONLY: the swipe-right queue. Press a key and swipe right: instead of sounding it you queue it. Keep your finger down after the
	// swipe (a quarter of a second or more) and that hold is how long the note sounds, and it becomes the step length for the notes after it;
	// a quick flick just uses the current step length (half a second to begin with), so you can queue fast. Up to 16 notes per track. They play one after another, starting at once
	// (the first when you let go, each next one right after the one before). Swipe left on any queued key to cancel the whole queue. A swipe-up
	// hold while a queue is waiting becomes its last step: it starts when the queue ends and stays held. Each track has its own queue.
	const QMAX = 16,
		CHORD_S = 0.15;

	// PITCH BEND of a queued step: while the finger is still down after a swipe-right, moving it up or down bends that step (one signed byte, 1/8 semitone a unit, +-16 = +-2 semitones over about 60 px;
	// the value when the finger lifts is kept). It rides in the queued item (`bend`), its log entry (`b`) and saved queues (`b`, absent = 0). Melodic steps only (FM, analog, wavetable: `v.bend`).
	const BEND_MAX = 16,
		bendSt = (b) => (b > 0 ? "+" : b < 0 ? "-" : "") + (Math.abs(b) / 8).toFixed(1) + " ST",
		bendMel = (t) => {
			const e = engOf(t);
			return e === "FM" || e === "ANA" || e === "WAVE";
		};
	const keyNotes = (kind, i, t) => {
		const e = engOf(t == null ? S.trk : t);
		return e === "DRUM" || e === "SMP"
			? [36 + i]
			: chordNotes((kind === "w" ? WH[i] : BL[i]) + S.oct * 12 + S.glob.gtr);

	}; /* a pad (white key 1-8) is queued as note 36+pad, the same notes the drum grid folds */
	const padOf = (n) =>
		n >= 36 && n <= 43
			? n - 36
			: ((n % 8) + 8) %

				8; /* notes 36-43 are pads 0-7; any other note folds mod 8, as dgFold does */
	// Queue settings (hold the mod strip, QUEUE tab). MODE: NORMAL starts at once, PAUSE waits WAIT seconds after your last swipe and plays once,
	// LOOP repeats until you cancel it, waiting WAIT seconds between one pass and the next (the first pass starts at once). HOLD OVERLAP: how long a swipe-up held note keeps sounding after you play the next key. TIMING: SYNC snaps note
	// lengths and the gap to the tempo (1/16 steps) and starts a queue on the beat; FREE uses your swipe lengths and the gap in milliseconds as they are.
	const QS = { on: 1, mode: 0, wait: 1.5, tail: 0, sync: 1, gapS: 0, gapF: 0, kb: 0 },
		QS0 = Object.assign({}, QS);
	try {
		const o = JSON.parse(localStorage.getItem("mellow-qs"));
		if (o && typeof o === "object") {
			for (const k in QS) {
				if (typeof o[k] === "number" && isFinite(o[k])) {
					QS[k] = o[k];
				}
			}
			QS.on = QS.on ? 1 : 0;
			QS.mode = clamp(QS.mode | 0, 0, 2);
			QS.wait = clamp(QS.wait, 0.3, 5);
			QS.tail = clamp(QS.tail, 0, 3);
			QS.sync = QS.sync ? 1 : 0;
			QS.gapS = clamp(QS.gapS | 0, 0, 8);
			QS.gapF = clamp(QS.gapF, 0, 1000);
			QS.kb = clamp(QS.kb | 0, 0, 3);
		}
	} catch (e) {}
	const saveQS = () => {
		try {
			localStorage.setItem("mellow-qs", JSON.stringify(QS));
		} catch (e) {}
	};
	const QMODES = ["NORMAL", "PAUSE", "LOOP"],
		gridSec = () => 60 / S.bpm / 4,
		gapSec = () => (QS.sync ? QS.gapS * gridSec() : QS.gapF / 1000),
		qGap = (q) => (q.gap != null ? q.gap : gapSec());
	const qBusy = (t) => {
		const q = A.q[t];
		return q.pend.length > 0 || q.live.length > 0 || (QS.mode === 2 && q.cyc.length > 0);
	};
	const qHas = (t, id) => {
		const q = A.q[t],
			h = (x) => x.id === id || (x.ids && x.ids.includes(id));
		return q.pend.some(h) || q.live.some(h) || q.cyc.some(h);
	};
	const deferNote = () =>
		queueable() && (QS.mode !== 0 || qBusy(S.trk) || AC.currentTime - A.q[S.trk].lastUse < 8);

	function queueable() {
		const e = engOf(S.trk),
			pads = e === "DRUM" || (e === "SMP" && S.screen === "smp");
		return (
			QS.on &&
			AC &&
			(pads ||
				((e === "FM" || e === "ANA" || e === "WAVE") &&
					!(S.screen === "drum" || S.screen === "smp"))) &&
			!S.arp.on &&
			!(S.screen === "seq" && S.seqPage === 2 && !S.rec) &&
			!qsSaved()
		);

	} /* drums and the sampler's slices queue too (their keys are white keys 1-8) */
	const qKeyOk = (kind, i) => {
		const e = engOf(S.trk);
		return ((e !== "DRUM" && e !== "SMP") || (kind === "w" && i < 8)) && !keyBlocked(kind, i);
	};

	function qAdd(t, item) {
		const q = A.q[t],
			last = q.pend[q.pend.length - 1];
		if (item.hold && last && last.hold) {
			q.pend.pop();
		} // only one held finish
		if (q.pend.length >= QMAX) {
			S.pop = null;
			S.toast = { s: "QUEUE FULL (16)", t: performance.now() };
			return false;
		}
		if (!item.hold && last && last.hold) {
			q.pend.splice(q.pend.length - 1, 0, item);
		} else {
			q.pend.push(item);
		}
		return true;
	}

	function qRelease(v, from) {
		if (v && v.off && !v.done) {
			v.off(Math.max(AC.currentTime, (v.start || 0) + 0.002));
		}
	}

	// A held note is playing and a queue starts: the held note is let go (its own release is the fade) and the queue's first note is eased in
	// behind it, after about as long as that release takes, instead of starting on the spot.
	function handoffSec(t) {
		const e = engOf(t);
		let rel = 0.5;
		if (e === "FM") {
			const cs = ALG[S.alg].c,
				r4 = cs.reduce((a, c) => a + S.ops[c - 1].R[3], 0) / Math.max(1, cs.length);
			rel = 8 * Math.exp(-0.065 * r4);
		} else if (e === "ANA") {
			rel = (0.08 + (S.ana.rel / 99) * 2.4) * 0.9;
		}
		return clamp(rel, 0.25, 1);
	}

	function qCommit(t, item) {
		const q = A.q[t];
		if (AC) {
			q.lastUse = AC.currentTime;
		}
		if (!item.hold && !qBusy(t)) {
			q.log.length = 0;
			q.gap = null;
		} /* q.log: the steps of this queue as swiped in, so SAVE THIS QUEUE still works after it has played */
		if (!item.hold && QS.sync) {
			const g = gridSec();
			item.dur = Math.max(g, Math.round(item.dur / g) * g);
		} /* SYNC: the note length is a whole number of 1/16 steps */
		if (AC && !qBusy(t) && latch[t].vs.length) {
			releaseLatch(t);
			q.nextT = Math.max(q.nextT, AC.currentTime + handoffSec(t));
		}
		if (AC && QS.mode === 1) {
			q.holdUntil = AC.currentTime + QS.wait;
		} /* PAUSE: every new swipe restarts the wait */
		/* several fingers: swipes that let go within CHORD_S of each other on the same track are ONE step that plays together (a chord; one queue slot, at most 6 notes) */
		if (AC && !item.hold) {
			item.at = AC.currentTime;
			const last = q.pend[q.pend.length - 1];
			if (

				!last.hold &&
				!last.rep &&
				last.at != null &&

				!last.kb &&

					if (!last.notes.includes(n)) {

					}
				});

					last.bend = item.bend;
				}
				if (last.lg) {
					last.lg.n = last.notes.slice();
					last.lg.d = last.dur;
					last.lg.b = last.bend | 0;
				}

			}

			return false;
		}

			q.log.push(item.lg);
		}
		return true;
	}

	function qClear(t) {
		const q = A.q[t];
		if (AC) {
			q.live.forEach((x) => x.vs.forEach((v) => qRelease(v)));
		}
		q.pend.length = 0;
		q.live.length = 0;
		q.cyc.length = 0;
		q.log.length = 0;
		q.gap = null;
		q.nextT = 0;
		q.started = false;
		q.holdUntil = 0;
	}

	function qTick(ct) {
		for (let t = 0; t < 4; t++) {
			const q = A.q[t];
			for (let k = q.live.length - 1; k >= 0; k--) {
				const x = q.live[k];
				if (!x.ended && x.end <= ct + A.la) {

						if (v && v.off && !v.done) {

						}
					});

					}

				}
			}

			}

			}

					}

					en = engOf(t);

				if (en === "DRUM" || en === "SMP") {

				else {
					it.notes.forEach((n) => {

						if (v) {
							v.start = when;
							vs.push(v);
						}
					});
					heardNote(it.notes[0]);
					if (it.bend) {
						vs.forEach((v) => {
							if (v.bend) {

							}
						});
					} /* the step's pitch bend: glides from 0 over the first part of the step */
					{
						const h = recAt(t, it.notes[0], 0.8, when, 0);

							const v0 = vs.find(Boolean);
							if (it.hold) {
								if (v0) {
									recVoice(h, v0);
								} else {
									recClose(h, when);
								}
							} else {
								rec = h;
							}
						}
					}
				}

					vs.forEach((v) => {

					});

					latch[t].ids.add(it.id);
					q.nextT = when;
					q.cyc.length = 0;
				} /* the last step stays held, like a swipe-up hold; it ends a loop */
				else {
					if (QS.mode === 2 && !it.rep) {
						q.cyc.push(it);
					}
					if (rec) {
						const v0 = vs.find(Boolean);
						if (v0) {
							recVoice(rec, v0);
						} else {
							recClose(rec, when + it.dur);
						}
					} /* the recorded note ends when its voice is let go (STOP cuts it short); with no voice it is the step's own length */
					q.live.push({
						id: it.id,
						ids: it.ids,
						vs,
						end: when + it.dur,
						ended: false,
						b: it.bend | 0,
						bend: it.bend | 0,
						rec,
						notes: it.notes,
						dur: it.dur,
					});

				}
			}
		}
	}

	/* A queued step on a drum or sampler track: its notes fold to pads (36-43 = pads 0-7, any other note mod 8) and the track's own voice plays them (drumHit keeps its 16-hits-in-120-ms cap). Two notes that fold to one pad are one hit. */
	let qSmpRec = 0;

	function qPads(t, en, notes, when) {
		qSmpRec = 0;
		[...new Set(notes.map(padOf))]
			.sort((a, b) => a - b)
			.forEach((p) => {
				if (A.nvLog) {
					A.nvLog.push({ trk: t, n: 36 + p, pad: p, eng: en, vel: 0.8, when, ct: AC.currentTime });
				}
				if (en === "DRUM") {
					drumHit(t, p, 0.8, when);
					if (t === DT && S.rec && S.playing && AC && when >= A.t0 - 0.005) {
						const ss = stepSec(),
							N = nstT(t),
							i = ((snapPos(Math.round((when - A.t0) / ss)) % N) + N) % N;

						recLive(t, i, when, p);
					} /* REC writes a queued drum step into the grid at the step it lands on (and the scheduler leaves that cell alone this pass: the queue already hit it) */
					S.padHits[p] = performance.now();
					if (S.glob.out !== 3 && MIDI.outs.length) {
						dgMidi(t, p, 102, when);
					}
				} else {
					sampVoice(t, p, 60, 0.8, when);
					if (!qSmpRec && S.rec && S.playing && AC && when >= A.t0 - 0.005) {
						qSmpRec = 1;
						const h = recAt(t, 36 + p, 0.8, when, 0, 1);
						if (h) {
							recClose(h, when + stepSec() * 0.5);
						}
					}
				}
			});

	} /* the sampler's step data holds ONE note per step, so a chord records its first pad */
	// ---- SAVED QUEUES (the bottom of the QUEUE popup; PROTOTYPE ONLY, `mellow-queues` stands in for flash). A saved queue belongs to no track: steps of MIDI notes (up to 6 per step) with their lengths in seconds, plus the gap. Playing one on a track
	// uses that track's engine: melodic tracks play the notes (clamped to C1-C8, the track's transpose applies as for keys), a drum track and the sampler fold them to pads / slices with padOf. Up to 12; not part of a project export or of any reset.
	const QSVMAX = 12,
		PADN = ["KICK", "SNARE", "HAT", "OPEN", "CLAP", "RIM", "SHAKER", "PERC"];
	let QSV = [];

	function qsvClean(a) {
		const out = [];
		if (!Array.isArray(a)) {
			return out;
		}
		for (const e of a) {
			if (out.length >= QSVMAX) {
				break;
			}
			if (!e || !Array.isArray(e.s)) {
				continue;
			}
			const s = e.s
				.slice(0, QMAX)
				.map((x) => {
					if (!(x && Array.isArray(x.n))) {
						return null;
					}
					const o = {
							n: [
								...new Set(
									x.n
										.filter((n) => typeof n === "number")
										.map((n) => Math.round(n))
										.filter((n) => isFinite(n) && n >= 0 && n <= 127),
								),
							]
								.sort((a, b) => a - b)
								.slice(0, 6),

						},

					if (b) {

					}

				})
				.filter((x) => x && x.n.length); /* b = the step's pitch bend; an older queue has none */
			if (s.length) {
				out.push({
					n:
						String(e.n || "Q" + (out.length + 1))
							.toUpperCase()
							.replace(/[^A-Z0-9 .-]/g, "")
							.slice(0, 10) || "Q" + (out.length + 1),
					g: isFinite(+e.g) ? clamp(Math.round(e.g * 100) / 100, 0, 2) : 0,
					s,
				});
			}
		}
		return out;
	}
	try {
		QSV = qsvClean(JSON.parse(localStorage.getItem("mellow-queues")));
	} catch (e) {
		QSV = [];
	}
	const saveQSV = () => {
		try {
			localStorage.setItem("mellow-queues", JSON.stringify(QSV));
		} catch (e) {}
	};
	const qsvTime = (e) => e.s.reduce((a, x) => a + x.d + e.g, 0);

	function qsvSum(e) {
		const dr = e.s.every((x) => x.n.every((n) => n >= 36 && n <= 43));
		return e.s
			.map(
				(x) =>
					x.n.map((n) => (dr ? PADN[n - 36] : note(n))).join("+") +
					(x.b ? (x.b > 0 ? "\u0002" : "\u0003") + (Math.abs(x.b) / 8).toFixed(1) : ""),
			)
			.join("  ");

	} /* a bent step shows an arrow and the semitones (\u0002 up, \u0003 down: the LCD's pixel arrows) */
	function qSaveCurrent(t) {
		const q = A.q[t];
		if (!q.log.length) {
			return "NOTHING QUEUED";
		}
		if (QSV.length >= QSVMAX) {
			return "FULL: DELETE ONE";
		}
		let k = 1;
		while (QSV.some((e) => e.n === "Q" + k)) {
			k++;
		}
		QSV.push({
			n: "Q" + k,
			g: Math.round(qGap(q) * 100) / 100,
			s: q.log.map((x) => ({
				n: x.n.slice().sort((a, b) => a - b),
				d: Math.round(x.d * 100) / 100,
				b: x.b | 0,
			})),
		});
		QSV = qsvClean(QSV);
		saveQSV();
		return "";
	}

	function qKeyIds(t, notes) {
		const en = engOf(t),
			ids = [];
		if (en === "DRUM" || en === "SMP") {
			notes.forEach((n) => {
				const id = "w" + padOf(n);
				if (!ids.includes(id)) {
					ids.push(id);
				}
			});
		} else {
			const sh = S.oct * 12 + S.glob.gtr;
			notes.forEach((n) => {
				let i = WH.findIndex((m) => m + sh === n),
					id = i >= 0 ? "w" + i : "";
				if (i < 0) {
					i = BL.findIndex((m) => m + sh === n);
					if (i >= 0) {
						id = "b" + i;
					}
				}
				if (id && !ids.includes(id)) {
					ids.push(id);
				}
			});
		}
		return ids;
	}

	/* play a saved queue on track t as if it had just been swiped in (same start rules, MODE and TIMING of the popup; the steps keep their saved lengths) */
	function qApply(e, t) {
		if (!QS.on) {
			return "QUEUE IS OFF";
		}
		if (S.arp.on && t === S.trk) {
			return "TURN ARP OFF";
		}
		ensureAudio();
		if (!AC) {
			return "SOUND IS OFF";
		}
		const q = A.q[t],
			en = engOf(t),
			mel = en !== "DRUM" && en !== "SMP";
		qClear(t);
		q.lastUse = AC.currentTime;
		if (mel && latch[t].vs.length) {
			releaseLatch(t);
			q.nextT = AC.currentTime + handoffSec(t);
		}
		if (QS.mode === 1) {
			q.holdUntil = AC.currentTime + QS.wait;
		}
		e.s.forEach((x, i) => {
			const notes = mel ? x.n.map((n) => clamp(n, 24, 108)) : x.n.slice(),
				ids = qKeyIds(t, notes);
			qAdd(t, {
				id: ids[0] || "s" + i,
				ids: ids.length > 1 ? ids : undefined,
				notes,
				dur: x.d,
				hold: false,
				at: AC.currentTime - 1,
				lg: null,
				bend: mel ? x.b | 0 : 0,
			});
			q.log.push({ n: x.n.slice(), d: x.d, b: x.b | 0 });
		});
		q.gap = e.g;
		return "";
	}

	// ---------- MIDI (Web MIDI: desktop Chrome/Edge/Opera and Chrome on Android; Safari on iPhone has none) ----------
	// In: notes play the current track (MIDI MODE OMNI) or channel CH..CH+3 = tracks 1-4 (TRACKS); CC moves the knobs. Out: every note played on a
	// melodic track goes out on its channel; MIDI CLOCK OUT sends clock, start and stop while the sequencer runs. Long-press a slider, then move a
	// slider on your controller: that CC is tied to that slider until you do it again.
	const MIDI = {
		acc: null,
		ins: [],
		outs: [],
		err: "",
		tried: false,
		learn: null,
		map: {},
		def: { 7: "master", 1: "k0", 74: "k1", 71: "k2", 91: "k3" },
		held: {},
		eng: {},
	};
	try {
		const m = JSON.parse(localStorage.getItem("mellow-midi"));
		if (m && typeof m === "object") {
			MIDI.map = m;
		}
	} catch (e) {}
	const saveMidi = () => {
		try {
			localStorage.setItem("mellow-midi", JSON.stringify(MIDI.map));
		} catch (e) {}
	};
	const toast = (t) => {
		S.pop = null;
		S.toast = { s: t, t: performance.now() };
	};

	function midiStatus() {
		return MIDI.err
			? MIDI.err
			: MIDI.acc
				? MIDI.ins.length + " IN " + MIDI.outs.length + " OUT"
				: "TAP TO START";
	}

	function midiWire() {
		const a = MIDI.acc;
		if (!a) {
			return;
		}
		const was = MIDI.ins.map((i) => i.id),
			now = [...a.inputs.values()];
		MIDI.ins = now;
		MIDI.outs = [...a.outputs.values()];
		MIDI.ins.forEach((i) => {
			i.onmidimessage = midiIn;
		});
		if (
			was.some((id) => {
				const i = now.find((x) => x.id === id);
				return !i || i.state === "disconnected";
			})
		) {
			/* a controller went away: its note-offs and bend release will never come */
			Object.keys(MIDI.held).forEach((k) => {
				const [t, n] = k.split(":").map(Number);
				midiNoteOff(t, n);
			});
			for (let t = 0; t < 4; t++) {
				if (!MOD.sprT.has(t) && A.bnd[t]) {
					A.fromMidi = true;
					try {
						setBend(0, t);
					} finally {
						A.fromMidi = false;
					}
				}
			}
		}
	}

	async function midiInit() {
		if (MIDI.tried) {
			return;
		}
		MIDI.tried = true;
		if (!navigator.requestMIDIAccess) {
			MIDI.err = "NOT SUPPORTED";
			return;
		}
		try {
			MIDI.acc = await navigator.requestMIDIAccess({ sysex: false });
			midiWire();
			MIDI.acc.onstatechange = midiWire;
		} catch (e) {
			MIDI.err = "BLOCKED";
		}
	}
	const midiCh = (t) => (S.glob.mmode ? (S.glob.ch - 1 + t) & 15 : (S.glob.ch - 1) & 15);

	/* audio-clock time -> performance.now() time for a MIDI timestamp. getOutputTimestamp is the device clock (steady to 0.1 ms) and counts the output latency, so MIDI lands when the internal sound is heard; AC.currentTime only moves in chunks and made the timestamps jitter by several ms. */
	function perfOf(w) {
		try {
			const o = AC.getOutputTimestamp && AC.getOutputTimestamp();
			if (o && o.performanceTime > 0 && o.contextTime > 0) {
				return o.performanceTime + (w - o.contextTime) * 1000;
			}
		} catch (e) {}
		return performance.now() + (w - AC.currentTime) * 1000;
	}

	function midiSend(bytes, whenAC, force) {
		if (!MIDI.outs.length || (!force && (S.glob.out === 3 || A.fromMidi))) {
			return;
		}
		/* force: note-offs always go out, so switching MIDI OUT off mid-note can't leave one hanging */ const ts =
			whenAC && AC && whenAC > AC.currentTime ? perfOf(whenAC) : 0;
		MIDI.outs.forEach((o) => {
			try {
				o.send(bytes, ts);
			} catch (e) {}
		});
	}

	// every voice noteVoice makes also goes out as MIDI, and its release does too
	function midiOutVoice(t, m, vel, when, v) {
		if (S.glob.out === 3 || !MIDI.outs.length || A.fromMidi) {
			return;
		}
		const ch = midiCh(t),
			n = clamp(Math.round(m), 0, 127);
		midiSend([0x90 | ch, n, clamp(Math.round(vel * 127), 1, 127)], when);
		const o = v.off;
		v.off = function (tt) {
			if (!v._mo) {
				v._mo = 1;
				midiSend([0x80 | ch, n, 0], Math.max(tt, when + 0.001), 1);
			}
			return o.call(v, tt);
		};
		const oc = v.cut;
		if (oc) {
			v.cut = function () {
				midiSend([0x80 | ch, n, 0], 0, 1);
				return oc.call(v);
			};
		}
	}

	function startLearn(id) {
		ensureAudio();
		midiInit();
		if (id === "select") {
			toast("PAGE CANNOT BE TIED");
			return;
		}
		setTimeout(
			() => {
				if (MIDI.err) {
					toast(MIDI.err === "NOT SUPPORTED" ? "NO MIDI IN THIS BROWSER" : "MIDI " + MIDI.err);
					return;
				}
				if (MIDI.learn === id) {
					MIDI.learn = null;
					toast("LEARN CANCELLED");
					return;
				}
				MIDI.learn = id;
				toast("MOVE A SLIDER ON YOUR CONTROLLER");
			},
			MIDI.acc || MIDI.err ? 0 : 700,
		);
	}

	function slMark(d, id) {
		const cc = ccOf(id),
			b = d.querySelector("b"),
			txt = (d.dataset.lab || "") + (cc != null ? " \u00b7 CC" + cc : "");
		if (b.textContent !== txt) {
			b.textContent = txt;
			measureLater(d);
		}
		d.classList.toggle("learning", MIDI.learn === id);
	}

	function ccTarget(cc) {
		if (MIDI.map[cc]) {
			return MIDI.map[cc];
		}
		const d = MIDI.def[cc];
		return d && ccOf(d) == null ? d : null;

	} // the usual CCs work until you tie that slider yourself
	function ccOf(id) {
		for (const k in MIDI.map) {
			if (MIDI.map[k] === id) {
				return +k;
			}
		}
		return null;
	}

	function midiApply(id, val) {
		// val 0..1
		ensureAudio();
		if (id === "master") {
			S.vol = Math.round(val * 100);
			pop("VOLUME", S.vol + "%", val);
			return;
		}
		if (id === "algorithm") {
			S.screen = "alg";
			S.alg = 1 + Math.round(val * 31);
			adsrFromOps();
			pop("ALGORITHM", pad(S.alg), val);
			return;
		}
		if (id === "presets") {
			loadPreset(Math.round(val * (PRESETS.length - 1)));
			return;
		}
		if (id[0] === "k") {
			const i = +id[1];
			let ks = knobs();
			if (!ks || !ks[i] || !ks[i].set) {
				return;
			}
			if (S.glob.km) {
				// KNOB PICKUP = CATCH: a CC takes over only once it reaches (or passes through) the parameter's current value, so nothing jumps
				const lab = ks[i].l,
					e =
						MIDI.eng[id] && MIDI.eng[id].l === lab
							? MIDI.eng[id]
							: (MIDI.eng[id] = { l: lab, on: false, last: null }),
					n = ks[i].n;
				if (!e.on) {
					const hit =
						Math.abs(val - n) <= 0.06 || (e.last != null && (e.last - n) * (val - n) <= 0);
					e.last = val;
					if (!hit) {
						return;
					}
					e.on = true;
				}
			}
			for (let it = 0; it < 3; it++) {
				ks = knobs();
				const k = ks[i],
					d = Math.round((val - k.n) * (k.r || 100));
				if (!d) {
					break;
				}
				k.set(d);
			}
			const k = knobs()[i];
			S.hot = { c: i, t: now() };
			pop(k.l, k.v, k.n);
		}
	}

	function midiIn(ev) {
		const d = ev.data;
		if (!d || d.length < 1) {
			return;
		}
		const st = d[0];
		if (st >= 0xf8) {
			if (st === 0xfc || st === 0xff) {
				/* transport stop from a DAW: let go of everything */
			}
			return;
		}
		const type = st & 0xf0,
			ch = st & 0x0f;
		let trk = S.trk;
		if (S.glob.mmode) {
			trk = (ch - (S.glob.ch - 1) + 16) & 15;
			if (trk > 3) {
				return;
			}
		}
		if (type === 0x90 && d[2] > 0) {
			midiNoteOn(trk, d[1], d[2] / 127);
		} else if (type === 0x80 || (type === 0x90 && d[2] === 0)) {
			midiNoteOff(trk, d[1]);
		} else if (type === 0xe0) {
			MOD.sprT.delete(trk);
			A.fromMidi = true;
			try {
				setBend((((d[2] << 7) | d[1]) - 8192) / 8192, trk);
			} finally {
				A.fromMidi = false;
			}
		} else if (type === 0xb0) {
			const cc = d[1],
				v = d[2];
			if (cc === 123 || cc === 120) {
				kbqFlush();
				for (const k in MIDI.held) {
					midiNoteOff(+k.split(":")[0], +k.split(":")[1]);
				}
				return;
			}
			if (MIDI.learn) {
				const id = MIDI.learn;
				MIDI.learn = null;
				for (const k in MIDI.map) {
					if (MIDI.map[k] === id || +k === cc) {
						delete MIDI.map[k];
					}
				}
				MIDI.map[cc] = id;
				saveMidi();
				toast(
					"CC " +
						cc +
						" TIED TO " +
						((id[0] === "k" ? (knobs()[+id[1]] || {}).l : id.toUpperCase()) || id),
				);
				return;
			}
			const id = ccTarget(cc);
			if (id) {
				midiApply(id, v / 127);
			}
		}
	}

	function midiNoteOn(trk, n, vel) {
		ensureAudio();
		if (!AC) {
			return;
		}
		wake();
		if (trk === S.trk && kbqUse("midi")) {
			kbqMidi(n);
			return;
		}
		A.fromMidi = true;
		try {
			const key = trk + ":" + n;
			if (MIDI.held[key]) {
				midiNoteOff(trk, n);
			}
			const e = engOf(trk);
			if (e !== "DRUM") {
				heardNote(n);
			}
			if (TK(trk).arp.on) {
				const set = A.arps[trk];
				if (
					TK(trk).arp.latch &&
					!Object.keys(MIDI.held).some((k) => MIDI.held[k].arp && +k.split(":")[0] === trk)
				) {
					set.clear();
				} /* LATCH: a new chord replaces the old one, as with the keys */
				set.add(n);
				MIDI.held[key] = { arp: true };
				return;
			}
			const v = noteVoice(trk, n, Math.max(0.25, vel), 0);
			if (v) {
				v.pin = true;
			}
			MIDI.held[key] = { v };
			if (e !== "DRUM" && e !== "SMP" && trk === S.trk) {
				const h = recNote(n, vel);
				if (h) {
					recVoice(h, v);
				}
			}
		} finally {
			A.fromMidi = false;
		}
	}

	function midiNoteOff(trk, n) {
		kbqUp("m" + n);
		const ks = S.glob.mmode
			? [trk + ":" + n]
			: Object.keys(MIDI.held).filter(
					(k) => +k.split(":")[1] === n,
				); /* OMNI: the controller has one key per note, whatever track is selected now */
		ks.forEach((key) => {
			const h = MIDI.held[key];
			if (!h) {
				return;
			}
			delete MIDI.held[key];
			const t = +key.split(":")[0];
			if (h.arp) {
				if (!TK(t).arp.latch) {
					A.arps[t].delete(n);
				}
				return;
			}
			if (h.v) {
				h.v.pin = false;
			}
			if (h.v && h.v.off && !h.v.done && AC) {
				h.v.off(AC.currentTime + 0.01);
			}
		});
	}

	// MIDI clock: 24 pulses per beat from the sequencer's start, scheduled ahead like the notes
	function midiClockTick(ct) {
		if (!MIDI.outs.length) {
			return;
		}
		if (!S.glob.mclk || S.glob.out === 3 || !S.playing) {
			if (A.mcOn) {
				A.mcOn = false;
				MIDI.outs.forEach((o) => {
					try {
						o.send([0xfc]);
					} catch (e) {}
				});
			}
			return;
		}
		if (!A.mcOn) {
			A.mcOn = true;
			A.mcT = A.t0;
			midiSend([0xfa], A.t0);
		}
		let n = 0;
		while (A.mcT < ct + A.la && n++ < 12) {
			midiSend([0xf8], A.mcT);
			A.mcT += 60 / S.bpm / 24;
		}
	}

	// ---------- the mod strip: pitch bend by default, or anything from the list (hold the strip to choose) ----------
	// Pitch bend uses the stock PITCH UP / DOWN ranges (GLO, in semitones) and is also what MIDI pitch bend does, in and out, so the strip stands
	// in for a bend wheel. The other targets move an ordinary parameter. Touch anywhere on the strip and slide: it moves from where you touched.
	const MODT = [
		["PITCH"],
		["MOOD", (v) => (S.mac[0] = Math.round(v * 127)), () => S.mac[0] / 127],
		["WARMTH", (v) => (S.mac[1] = Math.round(v * 127)), () => S.mac[1] / 127],
		["SPACE", (v) => (S.mac[2] = Math.round(v * 127)), () => S.mac[2] / 127],
		["DRIFT", (v) => (S.mac[3] = Math.round(v * 127)), () => S.mac[3] / 127],
		["CUTOFF", (v) => (S.fx.cut = Math.round(v * 127)), () => S.fx.cut / 127],
		["RESO", (v) => (S.fx.res = Math.round(v * 99)), () => S.fx.res / 99],
		["REVERB", (v) => (S.fx.rmix = Math.round(v * 100)), () => S.fx.rmix / 100],
		["ECHO", (v) => (S.fx.emix = Math.round(v * 100)), () => S.fx.emix / 100],
		["VIBRATO", (v) => (S.lfo.pm = Math.round(v * 99)), () => S.lfo.pm / 99],
		["TREMOLO", (v) => (S.lfo.am = Math.round(v * 99)), () => S.lfo.am / 99],
		[
			"VOLUME",
			(v) => (S.tracks[S._trk].vol = Math.round(v * 100)),
			() => S.tracks[S._trk].vol / 100,
		],
	];
	const MOD = { t: 0, down: false, act: false, sprT: new Set() };
	try {
		const t = +localStorage.getItem("mellow-mod");
		if (Number.isInteger(t) && t >= 0 && t < MODT.length) {
			MOD.t = t;
		}

	} catch (e) {} /* a whole number: 1.5 used to index the target list at a hole and throw on every frame */
	// ---------- automation ----------
	// An automation is the recorded movement of ONE parameter (any value on the screen: a strip target, a knob, a graph point) over 1 to 16 bars, 64
	// samples a bar, stored by the parameter's address (`S.auto['fx|cut']`). It plays LOOP (endlessly) or TAP (once each time you tap the strip), and
	// it either FOLLOWS THE SONG (its length laid along the song's position, so bar 5 is always bar 5; silent while stopped) or runs on its own FREE clock.
	// Two ways to record: arm RECORD in the strip popup and move the strip (any length, any time), or switch on RECORD AUTOMATION (SETTINGS) and move
	// any knob, graph or the strip while recording: the movement is written at the song position, pass after pass.
	// The player wins: a parameter you touch is yours until 0.35 s after your last move (or until you let go of the strip), then it snaps back.
	S.auto = {};
	const AUR = {},
		AUC = { bars: 1, armed: false, rec: null, tid: 0 };
	const AU_N = 64,
		AU_BARS = [1, 2, 4, 8, 16],
		aLen = (a) => a.bars * SPB() * stepSec() * 1000;
	const aRt = (id) =>
		AUR[id] ||
		(AUR[id] = { t0: performance.now(), run: 0, last: -1, man: 0, ri: -1, rg: 0, rl: 0 });
	const STRIPA = [
		null,
		["mac", 0, 0, 127],
		["mac", 1, 0, 127],
		["mac", 2, 0, 127],
		["mac", 3, 0, 127],
		["fx", "cut", 0, 127],
		["fx", "res", 0, 99],
		["fx", "rmix", 0, 100],
		["fx", "emix", 0, 100],
		["lfo", "pm", 0, 99],
		["lfo", "am", 0, 99],
		["", "vol", 0, 100],
	];

	// every strip target belongs to the track it was recorded on: 'tk.2.fx|cut' is track 3's cutoff, 'tracks.1|vol' is track 2's volume, 'bend0' is track 1's pitch
	const stripAddr = (t, trk) => {
		const d = STRIPA[t];
		return d[0] === "" ? ["tracks." + trk, "vol"] : ["tk." + trk + "." + d[0], d[1]];
	};
	const stripId = (t, trk) => {
		if (trk == null) {
			trk = S._trk;
		}
		if (t === 0) {
			return "bend" + trk;
		}
		const a = stripAddr(t, trk);
		return a[0] + "|" + a[1];
	};

	function stripLane(t, mode, bars, sync, v, trk) {
		if (trk == null) {
			trk = S._trk;
		}
		const d = STRIPA[t],
			a = d ? stripAddr(t, trk) : ["", ""];
		return {
			name: MODT[t][0] + " T" + (trk + 1),
			path: a[0],
			key: a[1],
			lo: d ? d[2] : 0,
			hi: d ? d[3] : 1,
			v,
			bars,
			mode,
			sync,
		};
	}

	function aObj(path) {
		let o = S;
		if (path) {
			for (const p of path.split(".")) {
				o = o == null ? null : o[p];
			}
		}
		return o;
	}
	const AP = new WeakMap();

	function aPathOf(target) {
		if (target === S) {
			return "";
		}
		if (AP.has(target)) {
			return AP.get(target);
		}
		let found = null;
		const seen = new Set();
		const dfs = (o, path, d) => {
			if (found !== null) {
				return;
			}
			if (o === target) {
				found = path;
				return;
			}
			if (d > 3 || o == null || typeof o !== "object" || seen.has(o)) {
				return;
			}
			seen.add(o);
			for (const k in o) {
				dfs(o[k], path ? path + "." + k : k, d + 1);
			}
		};
		for (const k of PARK()) {
			dfs(S[k], k, 0);
		}
		if (found !== null) {
			AP.set(target, found);
		}
		return found;
	}

	function aPhase(a, r, now) {
		return ((((now - r.t0) / aLen(a)) % 1) + 1) % 1;
	}

	function aValue(a, p) {
		const n = a.v.length,
			x = clamp(p, 0, 0.9999) * n,
			i = Math.floor(x),
			j = (i + 1) % n,
			f = x - i;
		return (a.v[i] * (1 - f) + a.v[j] * f) / 255;
	}
	const aActive = (id) => {
		const a = S.auto[id];
		return !!(a && a.v && (a.mode === 1 || (a.mode === 2 && aRt(id).run)));
	};

	function applyAuto(id, lane, v) {
		const r = aRt(id),
			q = Math.round(v * 1000);
		if (q === r.last) {
			return;
		}
		r.last = q;
		if (aBase(id).startsWith("bend")) {
			setBend(v * 2 - 1, +aBase(id).slice(4));
			return;
		}
		const o = aObj(lane.path);
		if (!o) {
			return;
		}
		const rg = laneRange(lane.path, lane.key),
			val = Math.round(
				clamp(
					lane.lo + v * (lane.hi - lane.lo),
					rg ? Math.max(lane.lo, rg[0]) : lane.lo,
					rg ? Math.min(lane.hi, rg[1]) : lane.hi,
				),
			);
		/* never outside the parameter's own range (a list index, an algorithm number), whatever the lane says */ if (
			o[lane.key] !== val
		) {
			o[lane.key] = val;
			if (lane.path === "adsr") {
				applyAdsr();
			}
			if (AC) {
				syncSoon();
			}
		}
	}
	const aCur = (t) => (t === 0 ? (A.bend + 1) / 2 : MODT[t][2]());

	// the song's position in steps (bars of the chain so far, then the playhead)
	const aSongSteps = () => (S.song.base || 0) + playPosF();

	function songTotalBars() {
		let n = 0;
		songChain().forEach((e) => (n += S.plen[e.pat] * e.rep));
		return n || S.plen[S.pat];
	}

	// the player moved a parameter: it is theirs for a moment, and while recording with RECORD AUTOMATION on the movement is written into its lane
	function aNoteId(id, path, key, lo, hi, name, v01) {
		const r = aRt(id),
			now = performance.now();
		r.man = now;
		r.last = -1;
		if (!(S.glob.arec && S.rec && S.playing && AC && A.on && !S.countdown)) {
			return;
		}
		let lane = S.auto[id];
		const b = Math.round(clamp(v01, 0, 1) * 255);
		if (!lane) {
			if (aFull()) {
				if (!r.rg || now - r.rg > 3000) {
					toast("AUTOMATION LIMIT " + NLANES);
				}
				r.rg = now;
				return;
			}
			const tb = S.song.on ? songTotalBars() : S.plen[S.pat];
			lane = {
				name,
				path,
				key,
				lo,
				hi,
				v: null,
				bars: AU_BARS.find((x) => x >= tb) || 16,
				mode: 1,
				sync: 0,
			};
			lane.v = new Array(AU_N * lane.bars).fill(b);
			undoPush();
			S.auto[id] = lane;
			toast("AUTOMATING " + name);
		} else if (!r.rg || now - r.rg > 1500) {
			undoPush();
		} // the first write of a gesture is one undo step
		r.rg = now;
		const N = lane.v.length,
			idx = Math.floor(((aSongSteps() / (lane.bars * SPB())) % 1) * N);
		if (r.ri < 0 || now - r.rl > 400) {
			r.ri = idx;
		}
		let i = r.ri,
			g = 0;
		lane.v[idx] = b;
		while (i !== idx && g++ < N) {
			i = (i + 1) % N;
			lane.v[i] = b;
		}
		r.ri = idx;
		r.rl = now;
	}

	function aName(l) {
		let c = "";
		if (S.screen === "pp") {
			const pg = ppPages(),
				cur = pg[clamp(S.ppPage, 0, pg.length - 1)];
			c = String(cur.t || "").replace(/^\d+\/\d+ /, "");
		}
		return (c && !String(l).startsWith(c) ? c + " " : "") + l;
	}

	function aNote(q) {
		if (!q || !q.ref) {
			return;
		}
		const [o, k, lo, hi] = q.ref,
			path = aPathOf(o);
		if (path === null) {
			return;
		}
		aNoteId(path + "|" + k, path, k, lo, hi, aName(q.l), (o[k] - lo) / (hi - lo));
	}

	function aNoteRaw(o, k, lo, hi, name) {
		const path = aPathOf(o);
		if (path === null) {
			return;
		}
		aNoteId(path + "|" + k, path, k, lo, hi, name, (o[k] - lo) / (hi - lo));
	}

	// every frame: drive the automations (not what the player is holding) and capture an armed strip recording
	// ---- lanes scoped to a slot (`lane.slot` = chain index, absent or -1 = the whole song; id = address + '@' + slot, so one parameter can have a lane in every slot) ----
	const NLANES = 16,
		aBase = (id) => id.split("@")[0],
		aIdOf = (b, s) => (s >= 0 ? b + "@" + s : b),
		aSlotOf = (a) => (a && a.slot >= 0 ? a.slot | 0 : -1),
		aFull = () => Object.keys(S.auto).length >= NLANES;

	// the slot whose lanes may act now: the one the song is walking, or the dropped-down one that loops; -1 = none
	function autoSlot() {
		if (!(S.playing && AC && A.on)) {
			return -1;
		}
		const sg = S.song;
		if (sg.on && sg.go) {
			return sg.pos;
		}
		if (nestOn()) {
			const e = sg.chain[NEST.i];
			if (e && e.pat >= 0 && e.pat === S.pat) {
				return NEST.i;
			}
		}
		return -1;
	}

	// steps since the slot began (its repeats so far plus the playhead in this pass)
	function aSlotSteps() {
		const n = nst(),
			sg = S.song;
		return (sg.on && sg.go ? sg.rc * n : 0) + (Math.max(0, playPosF()) % n);
	}
	const aCurOf = (id, a) => {
		const b = aBase(id);
		if (b.startsWith("bend")) {
			return A.bnd[+b.slice(4)];
		}
		const o = aObj(a.path);
		return o ? o[a.key] : undefined;
	};

	function aRelease(id, a, r) {
		const b = aBase(id),
			was = r.base;
		r.base = undefined;
		r.last = -1;
		if (was === undefined || r.man > r.bt) {
			return;
		} // the player touched it meanwhile: it stays theirs
		if (b.startsWith("bend")) {
			setBend(was, +b.slice(4));
			return;
		}
		const o = aObj(a.path);
		if (o && o[a.key] !== was) {
			o[a.key] = was;
			if (a.path === "adsr") {
				applyAdsr();
			}
			if (AC) {
				syncSoon();
			}
		}
	}

	function autoStep(now) {
		const as = autoSlot(),
			sh = new Set();
		if (as >= 0) {
			for (const id in S.auto) {
				const a = S.auto[id];
				if (a && a.v && a.mode && aSlotOf(a) === as) {
					sh.add(aBase(id));
				}
			}
		} // the slot that plays, and the parameters its own lanes hold right now
		for (const id in S.auto) {
			const lane = S.auto[id];
			if (!lane || !lane.v) {
				continue;
			}
			const r = aRt(id),
				ls = aSlotOf(lane);
			if (ls >= 0 && (ls !== as || !lane.mode)) {
				if (r.on) {
					r.on = 0;
					aRelease(id, lane, r);
				}
				continue;
			} // a lane scoped to a slot acts only while that slot plays, then the parameter goes back to where it was
			if (!lane.mode) {
				continue;
			}
			if (ls < 0 && sh.has(aBase(id))) {
				r.last = -1;
				continue;
			} // a slot's own lane wins over the song-wide one on the same parameter while that slot plays
			if (now - r.man < 350 || (MOD.act && id === stripId(MOD.t))) {
				continue;
			}
			let v;
			if (ls >= 0 && !r.on) {
				r.on = 1;
				r.bt = now;
				r.base = aCurOf(id, lane);
				if (lane.mode === 2) {
					r.run = 1;
					r.t0 = now;
				}
			}
			if (lane.mode === 1) {
				if (lane.sync === 1) {
					v = aValue(lane, aPhase(lane, r, now));
				} else {
					if (!(S.playing && AC && A.on)) {
						continue;
					}
					const L = lane.bars * SPB();
					v = aValue(lane, ((ls >= 0 ? aSlotSteps() : aSongSteps()) % L) / L);
				}
			} else if (r.run) {
				const el = now - r.t0,
					L = aLen(lane);
				if (el >= L) {
					r.run = 0;
					v = aValue(lane, 0.9999);
				} else {
					v = aValue(lane, el / L);
				}
			} else {
				continue;
			}
			applyAuto(id, lane, v);
		}
		const rc = AUC.rec;
		if (rc) {
			if (!MOD.act) {
				aFinish();
			} else {
				const N = AU_N * AUC.bars,
					cur = Math.round(clamp(aCur(rc.t), 0, 1) * 255);
				let idx;
				if (S.playing && AC && A.on) {
					idx = Math.floor(((aSongSteps() / (AUC.bars * SPB())) % 1) * N);
					if (rc.last < 0) {
						rc.last = idx;
						rc.v[idx] = cur;
						rc.cnt = 1;
					} else if (idx !== rc.last) {
						let i = rc.last;
						while (i !== idx) {
							i = (i + 1) % N;
							rc.v[i] = cur;
							rc.cnt++;
						}
						rc.last = idx;
						if (rc.cnt >= N) {
							aFinish();
						}
					} else {
						rc.v[idx] = cur;
					}
				} else {
					idx = Math.floor(((now - rc.t0) / (AUC.bars * SPB() * stepSec() * 1000)) * N);
					if (idx >= N) {
						for (let i = Math.max(0, rc.last + 1); i < N; i++) {
							rc.v[i] = cur;
						}
						rc.last = N - 1;
						aFinish();
					} else {
						for (let i = Math.max(0, rc.last + 1); i <= idx; i++) {
							rc.v[i] = cur;
						}
						rc.last = idx;
					}
				}
			}
		}
	}

	function aFinish() {
		const rc = AUC.rec;
		AUC.rec = null;
		AUC.armed = false;
		if (!rc) {
			return;
		}
		const N = AU_N * AUC.bars,
			v = rc.v;
		let first = -1;
		for (let i = 0; i < N; i++) {
			if (v[i] !== undefined) {
				first = i;
				break;
			}
		}
		if (first < 0) {
			return;
		}
		let prev = v[first];
		for (let k = 0; k < N; k++) {
			const i = (first + k) % N;
			if (v[i] === undefined) {
				v[i] = prev;
			} else {
				prev = v[i];
			}
		}
		const id = stripId(rc.t, rc.trk),
			old = S.auto[id];
		if (!old && aFull()) {
			toast("AUTOMATION LIMIT " + NLANES);
			return;
		}
		undoPush("AUTOMATION");
		S.auto[id] = stripLane(
			rc.t,
			(old && old.mode) || 1,
			AUC.bars,
			rc.playing ? 0 : 1,
			Array.from(v, (x) => x | 0),
			rc.trk,
		);
		const r = aRt(id);
		r.t0 = performance.now();
		r.run = 0;
		r.last = -1;
		toast("AUTOMATION RECORDED");
	}

	function aStart(t) {
		AUC.armed = true;
		AUC.rec = null;
		AUC.tid = t;
		toast("TOUCH THE STRIP AND MOVE");
	}

	function fmTuneNow(trk) {
		return Math.round(Math.log2(S.glob.tune / 440) * 16777216) + (A.bndU[trk] || 0);
	}

	function pushFmTune() {
		const tn = [0, 1, 2, 3].map(fmTuneNow),
			k = tn.join();
		if (A.fmTune !== k) {
			A.fmTune = k;
			if (A.fmw) {
				A.fmw.port.postMessage({ k: "cfg", tunes: tn });
			}
		}
	}

	// pitch bend is per track: each track has its own bend, its own spring and its own automation lane
	function setBend(b, trk) {
		if (trk == null) {
			trk = S._trk;
		}
		b = clamp(b, -1, 1);
		if (Math.abs(b) < 0.004) {
			b = 0;
		}
		if (b === A.bnd[trk]) {
			return;
		}
		A.bnd[trk] = b;
		const semi = b > 0 ? b * S.glob.pu : b * S.glob.pdn;
		A.bndC[trk] = semi * 100;
		A.bndU[trk] = Math.round((semi / 12) * 16777216);
		if (AC) {
			pushFmTune();
			const c = A.bendCs[trk];
			if (c) {
				bendSync(trk);
				c.offset.setTargetAtTime(A.bndC[trk], AC.currentTime, 0.012);
			}
		}
		midiBend(b, trk);
	}

	function midiBend(b, trk) {
		if (A.fromMidi || S.glob.out === 3 || !MIDI.outs.length) {
			return;
		}
		const v = clamp(Math.round(((b + 1) / 2) * 16383), 0, 16383),
			ch = midiCh(trk);
		midiSend([0xe0 | ch, v & 127, v >> 7]);
	}

	function modStripInit(strip) {
		let sx = 0,
			v0 = 0.5,
			w = 1,
			moved = false,
			id = -1,
			t0 = 0;
		const note = () => {
			const t = MOD.t,
				i = stripId(t);
			if (t === 0) {
				aNoteId(i, "", "", 0, 1, "PITCH T" + (S._trk + 1), (A.bend + 1) / 2);
			} else {
				const d = STRIPA[t],
					ad = stripAddr(t, S._trk);
				aNoteId(i, ad[0], ad[1], d[2], d[3], MODT[t][0] + " T" + (S._trk + 1), aCur(t));
			}
		};
		const apply = (x) => {
			const dv = (x - sx) / w;
			if (MOD.t === 0) {
				MOD.sprT.add(S._trk);
				setBend(clamp((v0 + dv) * 2 - 1, -1, 1));
			} // half the strip's width is full bend
			else {
				const T = MODT[MOD.t],
					v = clamp(v0 + dv, 0, 1);
				T[1](v);
				if (AC) {
					syncSoon();
				}
				S.hot = null;
			}
			note();
		};
		strip.addEventListener("pointerdown", (e) => {
			e.preventDefault();
			ensureAudio();
			id = e.pointerId;
			sx = e.clientX;
			w = Math.max(60, strip.getBoundingClientRect().width);
			moved = false;
			MOD.down = true;
			t0 = performance.now();
			try {
				strip.setPointerCapture(e.pointerId);
			} catch (x) {}
		});
		strip.addEventListener("pointermove", (e) => {
			if (!MOD.down || e.pointerId !== id) {
				return;
			}
			if (!moved && Math.abs(e.clientX - sx) > 6) {
				moved = true;
				MOD.act = true; /* the player takes the strip: from where the value is now (an automation's current value too) */
				v0 = MOD.t === 0 ? (aActive(stripId(0)) ? (A.bend + 1) / 2 : 0.5) : MODT[MOD.t][2]();
				if (AUC.armed && !AUC.rec) {
					AUC.rec = {
						t: MOD.t,
						trk: S._trk,
						t0: performance.now(),
						v: new Array(AU_N * AUC.bars),
						last: -1,
						cnt: 0,
						playing: !!(S.playing && AC && A.on),
					};
				}
			}
			if (moved) {
				apply(e.clientX);
			}
		});
		const end = (e) => {
			if (e.pointerId !== id) {
				return;
			}
			const tap = !moved && e.type === "pointerup" && performance.now() - t0 < 400,
				wasAct = MOD.act;
			MOD.down = false;
			MOD.act = false;
			id = -1; // pitch springs back to centre by itself (see frame), an automation snaps back in
			if (wasAct) {
				const r = AUR[stripId(MOD.t)];
				if (r) {
					r.man = 0;
					r.last = -1;
				}
			}
			if (tap) {
				const a = S.auto[stripId(MOD.t)];
				if (a && a.v && a.mode === 2) {
					const r = aRt(stripId(MOD.t));
					r.run = 1;
					r.t0 = performance.now();
					r.last = -1;
				}
			}
		};
		["pointerup", "pointercancel"].forEach((ev) => strip.addEventListener(ev, end));
	}

	// ---------- the QUEUE and STRIP screens (PROTOTYPE ONLY screens; they replaced the old popups) ----------
	// Each button opens real LCD pages, like MIXER: S.screen 'pp' with S.ppMode 'queue' or 'strip', so they use the same parameter grid (K1-K4 are the settings, PAGE steps the pages, the four values
	// at the bottom follow), the same wheel / swipe / tap editing as every other page, and a graphic area under the grid. The button toggles: again = back to where you were (QRET). Every setting of the old popups is
	// here: QUEUE 1/3 QUEUE (on/off, keyboard to queue, mode, wait), 2/3 TIMING (hold overlap, sync or free, note gap, clear), 3/3 SAVED QUEUES (K1 picks, K2 plays, K3 saves, K4 deletes with two turns;
	// white keys 1-12 pick a saved queue too; the list scrolls by dragging it and has PLAY / DELETE chips); STRIP 1/2 STRIP TARGET (K1 target, K3 clear the lane), 2/2 AUTOMATE (K1 length, K2 record, K3 plays, K4 follows).
	// Nothing here is a new control: they are the existing K1-K4 and white keys; the chips, the drag-scroll and the page-title tap are phone-only ways to reach the same values.
	const QRET = { s: "home", m: "edit", p: 0 },
		QL = { sc: 0, arm: null, at: 0, last: {} };
	let QSEL = 0;
	const inQS = (k) => S.screen === "pp" && S.ppMode === k,
		onQS = () => S.screen === "pp" && (S.ppMode === "queue" || S.ppMode === "strip"),
		qsSaved = () => inQS("queue") && S.ppPage === 2;

	function qsToggle(k) {
		if (inQS(k)) {
			const r = QRET;
			S.screen = r.s;
			if (r.s === "pp") {
				S.ppMode = r.m;
				S.ppPage = r.p;
			}
			return;
		} /* the button again: back to where you were */
		if (!onQS()) {
			QRET.s = S.screen === "boot" ? "home" : S.screen;
			QRET.m = S.ppMode;
			QRET.p = S.ppPage;
		}
		S.screen = "pp";
		S.ppMode = k;
		S.ppPage = 0;
	}
	const qsOnce = (k, ms = 700) => {
		const n = performance.now();
		if (QL.last[k] && n - QL.last[k] < ms) {
			return false;
		}
		QL.last[k] = n;
		return true;

	}; /* a drag on a knob is many steps: an action (play, save, clear) happens once per sweep */
	function stripTarget(i) {
		MOD.t = i;
		try {
			localStorage.setItem("mellow-mod", String(i));
		} catch (x) {}
		if (i !== 0) {
			setBend(0);
		}
	}
	const qlMax = () => Math.max(0, QSV.length * 24 - 78);

	function qlShow() {
		const top = QSEL * 24;
		if (top < QL.sc) {
			QL.sc = top;
		} else if (top + 24 > QL.sc + 78) {
			QL.sc = top + 24 - 78;
		}
		QL.sc = clamp(QL.sc, 0, qlMax());
	}

	function qsPlay(e) {
		const res = qApply(e, S.trk);
		if (res) {
			toast(res);
			return;
		}
		toast("PLAYING " + e.n + " ON T" + (S.trk + 1));
	}

	function qsSave() {
		const r = qSaveCurrent(S.trk);
		if (r) {
			toast(r);
			return;
		}
		QSEL = QSV.length - 1;
		qlShow();
		toast("SAVED " + QSV[QSEL].n);
	}

	function qsDelete(e) {
		if (!e) {
			return;
		}
		const n =
			performance.now(); /* DELETE needs two taps (or turns), the second not instantly and within 2.5 s */
		if (QL.arm === e && n - QL.at >= 350 && n - QL.at < 2500) {
			QSV.splice(QSV.indexOf(e), 1);
			saveQSV();
			QL.arm = null;
			QSEL = clamp(QSEL, 0, Math.max(0, QSV.length - 1));
			QL.sc = clamp(QL.sc, 0, qlMax());
			return;
		}
		if (QL.arm !== e || n - QL.at >= 2500) {
			QL.arm = e;
			QL.at = n;
		}
	}

	function qsKey(i) {
		if (i < QSV.length) {
			QSEL = i;
			qlShow();
			pop(
				"SAVED",
				QSV[i].n + "  ·  " + QSV[i].s.length + (QSV[i].s.length > 1 ? " STEPS" : " STEP"),
				QSV.length > 1 ? i / (QSV.length - 1) : 0,
			);
		} else {
			toast("NO SAVED QUEUE " + (i + 1));
		}

	} /* white keys 1-12 on the saved page */
	function qsPages(k) {
		const o = (l, st, si, v, set) => ({
			l,
			nu: 1,
			st,
			si,
			sn: si + 1,
			v,
			n: st > 1 ? si / (st - 1) : 0,
			set,
		});
		if (k === "queue") {
			QSEL = clamp(
				QSEL,
				0,
				Math.max(0, QSV.length - 1),
			); /* the list can shrink under it (a delete, a reload) */
			const q = A.q[S.trk],
				pend = q.pend.length + q.live.filter((e) => !e.ended).length,
				tag = QS.kb ? "  KB>Q" : "";
			return [
				{
					t: "1/3 QUEUE" + tag,
					p: [
						o("QUEUE", 2, QS.on, QS.on ? "ON" : "OFF", (d) => {
							const on = d > 0 ? 1 : 0;
							if (on === QS.on) {
								return;
							}
							QS.on = on;
							if (!on) {
								for (let t = 0; t < 4; t++) {
									qClear(t);
								}
							}
							saveQS();
						}),
						o("KEYBOARD", 4, QS.kb, ["OFF", "MIDI", "QWERTY", "BOTH"][QS.kb], (d) => {
							const v = clamp(QS.kb + d, 0, 3);
							if (v === QS.kb) {
								return;
							}
							QS.kb = v;
							KBQ.warn = "";
							kbqFlush();
							saveQS();
						}),
						o("MODE", 3, QS.mode, QMODES[QS.mode], (d) => {
							QS.mode = clamp(QS.mode + d, 0, 2);
							saveQS();
						}),
						{
							l: "WAIT",
							nu: 1,
							v: QS.wait.toFixed(1) + " S",
							n: (QS.wait - 0.3) / 4.7,
							r: 47,
							set: (d) => {
								QS.wait = clamp(Math.round((QS.wait + d * 0.1) * 10) / 10, 0.3, 5);
								saveQS();
							},

	// 1/3 and 2/3: this track's queue as 16 slots (the playing step filled, the waiting ones outlined, a bent step with its arrow), what it is doing, and how to make one
	function gQueue(x, y, w, h, now, live) {
		const t = S.trk,
			q = A.q[t];
		R(x, y, w, h, P.grid);
		const cyc = QS.mode === 2 && q.cyc.length,
			seq = cyc ? q.cyc.slice() : [...q.live.filter((e) => !e.ended), ...q.pend],
			n = seq.length,
			pads = engOf(t) === "DRUM" || engOf(t) === "SMP";
		T("T" + (t + 1) + " QUEUE  " + (n ? n + " OF " + QMAX : "EMPTY"), x + 4, y + 3, P.dim);
		T(QMODES[QS.mode] + (QS.on ? "" : "  OFF"), x + w - 4, y + 3, QS.on ? P.acc : P.rec, 1, "r");
		for (let i = 0; i < QMAX; i++) {
			const cx = x + 3 + Math.round((i & 7) * 28.2),
				cy = y + 15 + (i >> 3) * 27,
				it =
					seq[
						i
					]; /* (i&7): slots 9-16 are the second row; they were drawn off the right edge of the screen (UI hunt) */
			if (!it) {
				B(cx, cy, 26, 24, P.faint);
				continue;
			}
			const on = q.live.some((e) => !e.ended && e.notes === it.notes),
				nt = it.notes,
				b = it.bend || 0;
			if (on) {
				R(cx, cy, 26, 24, P.acc);
			} else {
				B(cx, cy, 26, 24, it.hold ? P.acc : P.fg);
			}
			const c = on ? P.selfg : P.fg;
			T(pads ? PADN[padOf(nt[0])].slice(0, 4) : note(nt[0]), cx + 13, cy + 4, c, 0.85, "c");
			T(
				nt.length > 1 ? "+" + nt.length : it.hold ? "HOLD" : (it.dur || 0).toFixed(1),
				cx + 13,
				cy + 14,
				on ? P.selfg : P.dim,
				0.7,
				"c",
			);
			if (b) {
				T(b > 0 ? "\u0002" : "\u0003", cx + 2, cy + 2, on ? P.selfg : P.acc);
			}
		}
		T(
			q.pend.length || q.live.length
				? "SWIPE LEFT ON A QUEUED KEY: CANCEL"
				: "SWIPE A KEY RIGHT TO QUEUE IT",
			x + w / 2,
			y + h - 22,
			P.dim,
			1,
			"c",
		);

	}

	// 3/3: the saved queues; the list scrolls by dragging it, the chips act on lift

	function openSettings() {
		let m = document.getElementById("settings");
		if (!m) {
			m = document.createElement("div");
			m.id = "settings";
			m.className = "sheet";
			m.hidden = true;
			document.body.appendChild(m);
		}
		SET.open = true;
		m.hidden = false;
		renderSettings();
	}

	function closeSettings() {
		const m = document.getElementById("settings");
		if (m) {
			m.hidden = true;
		}
		SET.open = false;
	}

	// a value row: tap the left/right half or swipe sideways (one step per 26 px) to change it
	function swipeStep(el, step, after) {
		let x0 = 0,
			moved = false,
			id = -1;
		el.addEventListener("pointerdown", (e) => {
			id = e.pointerId;
			x0 = e.clientX;
			moved = false;
			try {
				el.setPointerCapture(id);
			} catch (z) {}
		});
		el.addEventListener("pointermove", (e) => {
			if (e.pointerId !== id) {
				return;
			}
			const d = e.clientX - x0;
			if (Math.abs(d) < 8 && !moved) {
				return;
			}
			const n = Math.trunc(d / 26);
			if (n !== 0) {
				moved = true;
				for (let i = 0; i < Math.abs(n); i++) {
					step(n > 0 ? 1 : -1);
				}
				x0 += n * 26;
				after && after();
			}
		});
		el.addEventListener("pointerup", (e) => {
			if (e.pointerId !== id) {
				return;
			}
			id = -1;
			if (!moved) {
				const r = el.getBoundingClientRect();
				step(e.clientX < r.left + r.width / 2 ? -1 : 1);
				after && after();
			}
		});
		["pointercancel"].forEach((ev) =>
			el.addEventListener(ev, () => {
				id = -1;
			}),
		);
	}

			rows.push([
				"sr",
				a.name + (aSlotOf(a) >= 0 ? " \u00b7 SLOT " + (aSlotOf(a) + 1) : ""),

			rows.push([

	function resetDevice() {
		const sel = S.glob.sel;
		Object.assign(S.glob, JSON.parse(JSON.stringify(GLOB0)));
		S.glob.sel = sel;
		Object.assign(QS, QS0);
		saveQS();
		MOD.t = 0;
		for (let t = 0; t < 4; t++) {
			setBend(0, t);
		}
		try {
			localStorage.setItem("mellow-mod", "0");
		} catch (e) {}
		saveDev();
		if (AC) {
			audioSync();
		}
		toast("DEVICE SETTINGS RESET");
	}

	function renderSettings() {
		const m = document.getElementById("settings");
		if (!m) {
			return;
		}
		const keepY = (m.querySelector(".sb") || {}).scrollTop || 0;
		m.innerHTML = "";
		const hd = document.createElement("div");
		hd.className = "sh";
		const tb = (t, i) => {
			const b = document.createElement("button");
			b.textContent = t;
			b.setAttribute("aria-pressed", String(SET.tab === i));
			b.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				if (SET.tab !== i) {
					const o = m.querySelector(".sb");
					if (o) {
						o.scrollTop = 0;
					}
				}
				SET.tab = i;
				renderSettings();
			});
			hd.appendChild(b);
		}; /* another tab starts at its top, not at the old tab's scroll position */
		tb("SETTINGS", 0);
		tb("SHORTCUTS", 1);
		tb("AUTOMATION", 2);
		const x = document.createElement("button");
		x.className = "x";
		x.textContent = "✕";
		x.setAttribute("aria-label", "Close");
		x.addEventListener("pointerdown", (e) => {
			e.preventDefault();
			closeSettings();
		});
		hd.appendChild(x);
		m.appendChild(hd);
		const sb = document.createElement("div");
		sb.className = "sb";
		m.appendChild(sb);
		if (SET.tab !== 1) {
			(SET.tab === 0 ? settingsRows() : autoRows()).forEach((r) => {
				if (r[0] === "sc") {
					const c = document.createElement("div");
					c.className = "sc";
					c.textContent = r[1];
					if (r[2]) {
						const n = document.createElement("div");
						n.className = "scn";
						n.textContent = r[2];
						c.appendChild(n);
					}
					sb.appendChild(c);
					return;
				}
				if (r[0] === "bt") {
					const [, label, fn, confirm, note, vt] = r,
						row = document.createElement("div");
					row.className = "sr bt" + (confirm ? " danger" : "");
					const l = document.createElement("span");
					l.textContent = label;
					if (note) {
						const n = document.createElement("div");
						n.className = "n";
						n.textContent = note;
						l.appendChild(n);
					}
					row.appendChild(l);
					const v = document.createElement("span");
					v.className = "v";
					v.textContent = confirm ? "TAP" : vt ? vt() : "OPEN";
					row.appendChild(v);
					sb.appendChild(row);
					let armed = 0,
						tm = 0,
						x0 = 0,
						mv = false;
					row.addEventListener("pointerdown", (e) => {
						x0 = e.clientX;
						mv = false;
					});
					row.addEventListener("pointermove", (e) => {
						if (Math.abs(e.clientX - x0) > 8) {
							mv = true;
						}
					});
					row.addEventListener("pointerup", () => {
						if (mv) {
							return;
						}
						if (!confirm) {
							fn();
							return;
						}
						if (!armed) {
							armed = 1;
							v.textContent = "TAP AGAIN";
							row.classList.add("armed");
							tm = setTimeout(() => {
								armed = 0;
								v.textContent = "TAP";
								row.classList.remove("armed");
							}, 3000);
							return;
						}
						clearTimeout(tm);
						fn();
						renderSettings();
					});
					return;
				}
				const [, label, get, step, ro, , note] = r,
					row = document.createElement("div");
				row.className = "sr" + (ro ? " ro" : "");
				const l = document.createElement("span");
				l.textContent = label;
				if (note) {
					const n = document.createElement("div");
					n.className = "n";
					n.textContent = note;
					l.appendChild(n);
				}
				const v = document.createElement("span");
				v.className = "v";
				v.textContent = get();
				row.appendChild(l);
				row.appendChild(v);
				sb.appendChild(row);
				if (!ro) {
					swipeStep(v, step, () => {
						v.textContent = get();
					});
					const ws = { wh: 0 };
					row.addEventListener(
						"wheel",
						(e) => {
							if (
								!DESK.matches ||
								e.clientX <
									row.getBoundingClientRect().left + row.getBoundingClientRect().width * 0.45
							) {
								return;
							}
							e.preventDefault();
							const d = wheelDir(e, ws);
							if (d) {
								step(d);
								v.textContent = get();
							}
						},
						{ passive: false },
					);
				}
			});
		} /* desktop: the wheel over the value half of a row steps it (over the label half it scrolls the list) */
		else {
			SHORTS.forEach(([h, list]) => {

	// ---------- export / import (PROTOTYPE ONLY: on the FM-1 this is a file over USB or Bluetooth) ----------
	// The whole project as one small JSON file: patterns and lengths, the song chain, time signature, grid and snap, tempo, the four tracks' sounds
	// and levels and the current sound's settings, and your saved USER presets. Importing is undoable (one step).
	function projectJSON() {
		const o = JSON.parse(songSnap(true));
		return JSON.stringify({
			app: "mellow",
			v: 2,
			snap: o,
			bpm: S.bpm,
			rate: S.rate,
			swing: S.swing,
			sgate: S.sgate,
			tracks: S.tracks.map((t) => ({ preset: PRESETS[t.pre][0], vol: t.vol })),
			user: USERP,
		});
	}

	function importProject(txt) {
		let d;
		try {
			d = JSON.parse(txt);
		} catch (e) {
			return "THAT IS NOT A MELLOW PROJECT";
		}
		if (!d || d.app !== "mellow" || !d.snap || typeof d.snap !== "object") {
			return "THAT IS NOT A MELLOW PROJECT";
		}
		const keep = songSnap(true);
		undoPush("IMPORT");
		if (S.playing) {
			S.playing = false;
			stopSeq();
		}
		S.rec = false;
		S.recExt = false;
		S.countdown = null;
		if (d.user && typeof d.user === "object" && !Array.isArray(d.user)) {
			let nu = PRESETS.filter((p) => p[1] === "USER").length;
			for (const nm in d.user) {
				const u = d.user[nm];
				if (nu >= USERMAX) {
					break;
				}
				if (!userOk(nm, u) || Object.prototype.hasOwnProperty.call(USERP, nm)) {
					continue;
				}
				USERP[nm] = { en: u.en, snap: u.snap };
				PRESETS.push([nm, "USER", u.en]);
				nu++;
			}
			try {
				localStorage.setItem("mellow-user", JSON.stringify(USERP));
			} catch (e) {}
		}
		try {
			songRestore(JSON.stringify(d.snap), true);
		} catch (e) {
			songRestore(keep, true);
			afterRestore();
			return "THAT PROJECT IS DAMAGED";
		} /* all or nothing: a file that still cannot be read leaves the project as it was */
		if (d.bpm >= 30 && d.bpm <= 300) {
			S.bpm = d.bpm;
		}
		if (d.rate >= 0 && d.rate <= 2) {
			S.rate = d.rate | 0;
		}
		if (d.swing >= 50 && d.swing <= 75) {
			S.swing = d.swing;
		}
		if (d.sgate >= 20 && d.sgate <= 100) {
			S.sgate = d.sgate;
		}
		if (Array.isArray(d.tracks)) {
			d.tracks.forEach((t, i) => {
				if (i > 3 || !t) {
					return;
				}
				const k = PRESETS.findIndex((p) => p[0] === t.preset);
				if (k >= 0) {
					S.tracks[i].pre = k;
				}
				if (t.vol >= 0 && t.vol <= 100) {
					S.tracks[i].vol = t.vol | 0;
				}
			});
		}
		S.preset = clamp(S.preset | 0, 0, PRESETS.length - 1);
		S.pat = clamp(S.pat | 0, 0, 15);
		S.patNext = -1;
		S.song.pos = 0;
		S.song.rc = 0;
		S.song.jump = -1;
		S.song.go = 0;
		S.seqs.forEach((q) => {
			if (q.sel >= nst()) {
				q.sel = nst() - 1;
			}
		});
		dgForceKit();
		applyGrid();
		if (AC) {
			audioSync();
		}
		saveSong();
		return "IMPORTED";
	}

	// ---------- bounce to audio / MIDI (PROTOTYPE ONLY) ----------
	// BOUNCE plays the pattern (or the whole song) from the start, in real time, and records the master output, then adds a short tail for the reverb and echo.
	// The result is a WAV (16-bit stereo) or a MIDI file of the notes, each wrapped in a ZIP (the artifact viewer only saves a short list of file types, and wav and mid
	// are not on it). The metronome is switched off while bouncing. PLAY cancels. On the device this would be USB audio or a MIDI file.
	const BNC = { on: false, last: null, info: null };

	function crc32(u8) {
		let c,
			crc = -1;
		if (!crc32.t) {
			crc32.t = [];
			for (let n = 0; n < 256; n++) {
				c = n;
				for (let k = 0; k < 8; k++) {
					c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
				}
				crc32.t[n] = c >>> 0;
			}
		}
		for (let i = 0; i < u8.length; i++) {
			crc = crc32.t[(crc ^ u8[i]) & 255] ^ (crc >>> 8);
		}
		return (crc ^ -1) >>> 0;
	}

	function zipStore(files) {
		const enc = new TextEncoder(),
			parts = [],
			cd = [];
		let off = 0;
		const u16 = (n) => [n & 255, (n >> 8) & 255],
			u32 = (n) => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
		files.forEach((f) => {
			const nm = enc.encode(f.name),
				crc = crc32(f.data),
				sz = f.data.length;
			const lh = new Uint8Array([
				0x50,
				0x4b,
				3,
				4,
				...u16(20),
				...u16(0),
				...u16(0),
				...u16(0),
				...u16(33),
				...u32(crc),
				...u32(sz),
				...u32(sz),
				...u16(nm.length),
				...u16(0),
			]);
			parts.push(lh, nm, f.data);
			cd.push(
				new Uint8Array([
					0x50,
					0x4b,
					1,
					2,
					...u16(20),
					...u16(20),
					...u16(0),
					...u16(0),
					...u16(0),
					...u16(33),
					...u32(crc),
					...u32(sz),
					...u32(sz),
					...u16(nm.length),
					...u16(0),
					...u16(0),
					...u16(0),
					...u16(0),
					...u32(0),
					...u32(off),
				]),
				nm,
			);
			off += lh.length + nm.length + sz;
		});
		const cdSize = cd.reduce((n, x) => n + x.length, 0),
			end = new Uint8Array([
				0x50,
				0x4b,
				5,
				6,
				...u16(0),
				...u16(0),
				...u16(files.length),
				...u16(files.length),
				...u32(cdSize),
				...u32(off),
				...u16(0),
			]);
		const all = [...parts, ...cd, end],
			out = new Uint8Array(all.reduce((n, x) => n + x.length, 0));
		let o = 0;
		all.forEach((x) => {
			out.set(x, o);
			o += x.length;
		});
		return out;
	}

	function wavBytes(L, R, sr) {
		const n = L.length,
			out = new Uint8Array(44 + n * 4),
			dv = new DataView(out.buffer);
		const w = (o, t) => {
			for (let i = 0; i < t.length; i++) {
				out[o + i] = t.charCodeAt(i);
			}
		};
		w(0, "RIFF");
		dv.setUint32(4, 36 + n * 4, true);
		w(8, "WAVE");
		w(12, "fmt ");
		dv.setUint32(16, 16, true);
		dv.setUint16(20, 1, true);
		dv.setUint16(22, 2, true);
		dv.setUint32(24, sr, true);
		dv.setUint32(28, sr * 4, true);
		dv.setUint16(32, 4, true);
		dv.setUint16(34, 16, true);
		w(36, "data");
		dv.setUint32(40, n * 4, true);
		for (let i = 0; i < n; i++) {
			dv.setInt16(44 + i * 4, Math.round(clamp(L[i], -1, 1) * 32767), true);
			dv.setInt16(46 + i * 4, Math.round(clamp(R[i], -1, 1) * 32767), true);
		}
		return out;
	}

	// the passes the song (or the pattern) plays: [{pat, steps}] in order
	function bouncePasses(kind) {
		if (kind === "song") {
			const out = [];
			songChain().forEach((e) => {
				const L = S.plen[e.pat];
				for (let r = 0; r < e.rep; r++) {
					out.push({ pat: e.pat, mute: SGM(e), dmute: SGDM(e), steps: SPB() * L });
				}
			});
			return out;
		} /* a slot lasts its pattern's own length (songAdvance), whatever a track's own length is: a longer track is cut off there, a shorter one loops inside it */ // mute: the slot's muted tracks (the MIDI file leaves them out; the audio bounce plays through the scheduler, which already honours them)
		return [
			{ pat: S.pat, steps: SPB() * Math.max(S.plen[S.pat], ...S.tl[S.pat].map((x) => x || 0)) },
		];
	}

	function bounceStart(kind) {
		ensureAudio();
		if (!AC || BNC.on) {
			return;
		}
		if (kind === "song" && !songChain().length) {
			toast("THE SONG IS EMPTY");
			return;
		}
		if (S.playing) {
			S.playing = false;
			stopSeq();
		}
		S.rec = false;
		S.recExt = false;
		S.countdown = null;
		const keep = { song: S.song.on, pat: S.pat, patNext: S.patNext, metro: S.glob.metro };
		S.glob.metro = 0;
		S.song.on = kind === "song" ? 1 : 0;
		S.patNext = -1;
		const ss = stepSec(),
			steps = bouncePasses(kind).reduce((n, x) => n + x.steps, 0),
			main = steps * ss,
			tail = 3,
			sr = AC.sampleRate;
		const chunks = [],
			sp = AC.createScriptProcessor(4096, 2, 2),
			z = AC.createGain();
		z.gain.value = 0;
		A.master.connect(sp);
		sp.connect(z);
		z.connect(AC.destination);
		sp.onaudioprocess = (e) => {
			const b = e.inputBuffer;
			chunks.push({
				t: e.playbackTime,
				l: new Float32Array(b.getChannelData(0)),
				r: new Float32Array(b.getChannelData(b.numberOfChannels > 1 ? 1 : 0)),
			});
		};
		S.seqEn = true;
		S.playing = true;
		startSeq();
		audioSync();
		const t0 = A.t0,
			tEnd = t0 + main,
			tAll = tEnd + tail;
		BNC.on = true;
		BNC.info = { kind, t0, tEnd, tAll, main };
		let stopped = false;
		const finish = (ok) => {
			clearInterval(BNC.iv);
			BNC.on = false;
			try {
				A.master.disconnect(sp);
			} catch (e) {}
			try {
				sp.disconnect();
				z.disconnect();
			} catch (e) {}
			sp.onaudioprocess = null;
			if (S.playing) {
				S.playing = false;
				stopSeq();
			}
			S.song.on = keep.song;
			S.pat = keep.pat;
			S.patNext = keep.patNext;
			S.glob.metro = keep.metro;
			audioSync();
			if (!ok || !chunks.length) {
				toast("BOUNCE CANCELLED");
				return;
			}
			const first = chunks[0].t,
				skip = Math.max(0, Math.round((t0 - first) * sr)),
				n = Math.round((tAll - t0) * sr),
				L = new Float32Array(n),
				R = new Float32Array(n);
			let o = -skip;
			chunks.forEach((c) => {
				for (let i = 0; i < c.l.length; i++, o++) {
					if (o >= 0 && o < n) {
						L[o] = c.l[i];
						R[o] = c.r[i];
					}
				}
			});
			const wav = wavBytes(L, R, sr),
				name = kind === "song" ? "mellow-song" : "mellow-pattern";
			BNC.last = {
				filename: name + "-bounce.zip",
				data: zipStore([{ name: name + ".wav", data: wav }]),
				secs: n / sr,
				kind: "audio",
			};
			toast("BOUNCED " + BNC.last.secs.toFixed(1) + " S");
			try {
				openShare();
				const st = document.getElementById("shSt");
				if (st) {
					st.textContent =
						"BOUNCED " +
						BNC.last.secs.toFixed(1) +
						" S. Tap SAVE LAST BOUNCE to keep it (a ZIP with the WAV in it).";
				}
			} catch (e) {}
		};
		BNC.finish = finish;
		BNC.iv = setInterval(() => {
			const t = AC.currentTime;
			if (!stopped && t >= tEnd) {
				stopped = true;
				if (S.playing) {
					S.playing = false;
					stopSeq();
				}
			}
			if (t >= tAll + 0.1) {
				finish(true);
			}
		}, 80);
	}

	function bounceCancel() {
		if (BNC.on && BNC.finish) {
			BNC.finish(false);
		}
	}

	// the notes as a standard MIDI file (format 1: a tempo track and one track per Mellow track)
	function midiFileBytes(kind) {
		const PPQ = 96,
			tps = PPQ / [2, 4, 8][S.rate],
			passes = bouncePasses(kind),
			ev = [[], [], [], []],
			push = (a, b) => a.push(...b);
		const vlq = (n) => {
				const b = [n & 127];
				while ((n >>= 7)) {
					b.unshift((n & 127) | 128);
				}
				return b;
			},
			str = (t) => [...new TextEncoder().encode(t)];
		let base = 0;
		passes.forEach((ps) => {
			for (let t = 0; t < 4; t++) {
				if (((ps.mute | 0) >> t) & 1) {
					continue;
				}
				const q = S.pats[ps.pat][t],
					len = SPB() * (S.tl[ps.pat][t] || S.plen[ps.pat]),
					en = engOf(t),
					ch = en === "DRUM" || en === "SMP" ? 9 : Math.min(t, 8);
				if (t === DT) {
					dgMidiEv(ev[t], base, ps.steps, len, ps.pat, tps, ps.dmute | 0);
					continue;
				}
				for (let j = 0; j < ps.steps; j++) {
					const i = j % len,
						n = q.st[i];
					if (n < 0) {
						continue;
					}
					const on = Math.round((base + j) * tps),
						dur = Math.max(1, Math.round(((q.gate[i] / 100) * tps * S.sgate) / 100));
					ev[t].push(
						{
							k: on,
							o: 1,
							b: [0x90 | ch, clamp(n, 0, 127), clamp(Math.round(q.vel[i] || 100), 1, 127)],
						},
						{ k: on + dur, o: 0, b: [0x80 | ch, clamp(n, 0, 127), 0] },
					);
				}
			}
			base += ps.steps;
		});
		const trk = (evs, pre) => {
			evs.sort((a, b) => a.k - b.k || a.o - b.o);
			const d = [...pre];
			let last = 0;
			evs.forEach((e) => {
				d.push(...vlq(e.k - last), ...e.b);
				last = e.k;
			});
			d.push(0, 0xff, 0x2f, 0);
			const h = [
				0x4d,
				0x54,
				0x72,
				0x6b,
				(d.length >>> 24) & 255,
				(d.length >> 16) & 255,
				(d.length >> 8) & 255,
				d.length & 255,
			];
			return [...h, ...d];
		};
		const mpq = Math.round(60e6 / S.bpm),
			tn = TSIGS[S.ts],
			dd = Math.round(Math.log2(tn[1]));
		const tempo = [
			0,
			0xff,
			0x58,
			4,
			tn[0],
			dd,
			24,
			8,
			0,
			0xff,
			0x51,
			3,
			(mpq >> 16) & 255,
			(mpq >> 8) & 255,
			mpq & 255,
			0,
			0xff,
			0x03,
			...(() => {
				const n = str("MELLOW");
				return [n.length, ...n];
			})(),
		];
		const out = [
			0x4d,
			0x54,
			0x68,
			0x64,
			0,
			0,
			0,
			6,
			0,
			1,
			0,
			5,
			PPQ >> 8,
			PPQ & 255,
			...trk([], tempo),
		];
		for (let t = 0; t < 4; t++) {
			const nm = str("T" + (t + 1) + " " + ENGN[engOf(t)]);
			out.push(...trk(ev[t], [0, 0xff, 0x03, nm.length, ...nm]));
		}
		return { bytes: new Uint8Array(out), notes: ev.reduce((n, a) => n + a.length / 2, 0) };
	}

	async function saveFile(file, st) {
		// through the viewer's downloads capability inside the artifact, a plain download link elsewhere
		let dl = null;
		try {
			dl = null;
		} catch (e) {}
		if (dl) {
			try {
				await dl.save({ filename: file.filename, data: file.data });
				st && st("SAVED " + file.filename);
				return true;
			} catch (e) {
				st && st(e && e.code === "declined" ? "Cancelled." : "The viewer could not save the file.");
				return false;
			}
		}
		try {
			const a = document.createElement("a");
			a.href = URL.createObjectURL(new Blob([file.data], { type: "application/zip" }));
			a.download = file.filename;
			document.body.appendChild(a);
			a.click();
			setTimeout(() => {
				URL.revokeObjectURL(a.href);
				a.remove();
			}, 500);
			st && st("DOWNLOADING " + file.filename);
			return true;
		} catch (e) {
			st && st("Downloads are blocked here.");
			return false;
		}
	}

				}
			} catch (e) {}

		return S.pcol;
	}

	function togglePGroup(c) {
		const o = pcol();

			localStorage.setItem("mellow-pcol", JSON.stringify(o));
		} catch (e) {}
	}

	// Favourites: one bit per preset (on the device 64 factory + 128 user presets = 192 bits = 24 bytes of flash; here a list of names in localStorage).

	let FAVS = new Set();
	try {
		const o = JSON.parse(localStorage.getItem("mellow-fav"));
		if (Array.isArray(o)) {
			o.forEach((n) => {
				if (typeof n === "string" && n.length <= 10) {
					FAVS.add(n);
				}
			});
		}
	} catch (e) {}
	const isFav = () => FAVS.has(PRESETS[S.preset][0]);

	function favSet(nm, on) {
		if (on === FAVS.has(nm)) {
			return;
		}
		if (on) {
			FAVS.add(nm);
		} else {
			FAVS.delete(nm);
		}
		try {
			localStorage.setItem(
				"mellow-fav",
				JSON.stringify([...FAVS].filter((n) => PRESETS.some((p) => p[0] === n))),
			);
		} catch (e) {}
	}

	// The category tabs that fit in the row (the row follows the selected tab; ptabs().less / .more: tabs are hidden to the left / right) and the

	// (PVW.top) until the category, sort, track, groups or the preset change by a knob.
	function ptabs() {
		const ws = CATS.map((c) => TW(c) + 6),
			N = CATS.length,
			fit = (c0) => {
				let x = c0 ? 12 : 6;
				const o = [];
				for (let i = c0; i < N; i++) {
					if (x + ws[i] > (i < N - 1 ? 229 : 236)) {
						break;
					}
					o.push({ i, x, w: ws[i] });
					x += ws[i] + 2;
				}
				return o;
			};
		let c0 = 0,
			t = fit(0);
		while (c0 < N - 1 && !t.some((q) => q.i === S.pcat)) {
			c0++;
			t = fit(c0);
		}

	}
	const PVW = { top: null, key: "" },
		pvKey = () =>
			[
				S.pcat,
				S.psort,
				S._trk,
				S.preset,
				PRESETS.length,
				FAVS.size,
				PGROUPS.map((c) => (pcol()[c] ? 1 : 0)).join(""),
			].join("|");

	function ptop(rows) {
		const mx = Math.max(0, rows.length - 8);
		if (PVW.top != null && PVW.key !== pvKey()) {
			PVW.top = null;
		}
		if (PVW.top != null) {
			return (PVW.top = clamp(PVW.top, 0, mx));
		}
		return clamp(
			Math.max(
				0,
				rows.findIndex((r) => r.i === S.preset),
			) - 3,
			0,
			mx,
		);
	}

	function pscroll(v) {
		PVW.top = clamp(Math.round(v), 0, Math.max(0, prows().length - 8));
		PVW.key = pvKey();
	}

	function prows() {
		const c = CATS[S.pcat],
			all = c === "ALL" || c === "DEVICE" || c === "FAV",
			cats = all ? PGROUPS : [c],
			rows = [];
		cats.forEach((cat) => {
			const L = PRESETS.map((p, i) => i).filter(
				(i) =>
					PRESETS[i][1] === cat &&
					presetFits(i) &&
					(c !== "DEVICE" || !PHONEP.has(PRESETS[i][0])) &&
					(c !== "FAV" || FAVS.has(PRESETS[i][0])),
			);
			if (S.psort) {
				L.sort((a, b) =>
					PRESETS[a][0] < PRESETS[b][0] ? -1 : PRESETS[a][0] > PRESETS[b][0] ? 1 : a - b,
				);
			}
			if (c === "FAV") {
				L.forEach((i) => rows.push({ i }));

			if (!L.length && all) {
				return;
			}
			rows.push({ h: 1, cat, n: L.length, shut: !!pcol()[cat] });
			if (!pcol()[cat]) {
				L.forEach((i) => rows.push({ i }));
			}
		});
		if (c === "FAV" && S.psort) {
			rows.sort((a, b) =>
				PRESETS[a.i][0] < PRESETS[b.i][0] ? -1 : PRESETS[a.i][0] > PRESETS[b.i][0] ? 1 : a.i - b.i,
			);
		}

	}

		return prows()
			.filter((r) => !r.h)

	}

		const L = plist();
		if (!L.length) {
			return;
		}
		let k = L.indexOf(S.preset);
		k = k < 0 ? (d > 0 ? 0 : L.length - 1) : clamp(k + d, 0, L.length - 1);
		if (L[k] === S.preset) {
			return;
		}
		loadPreset(L[k]);
		if (S.paud) {
			audition();
		}
	}

	function audition() {
		if (!AC || BNC.on) {
			return;
		} /* a bounce records what you hear: changing sounds while it runs must not add the preview note to it */
		const t = AC.currentTime + 0.02,
			en = engOf(S.trk);
		if (en === "DRUM") {
			drumHit(S.trk, 0, 0.8, t);
			drumHit(S.trk, 2, 0.5, t + 0.25);
			drumHit(S.trk, 1, 0.7, t + 0.5);

			sampVoice(S.trk, S.smp.slice, 60, 0.8, t).off(t + 0.9);
		} else {
			noteVoice(S.trk, 60, 0.75, t, 0.5);
		}
	}

	function savePreset() {
		const nm = S.save.name.trim().slice(0, 10) || "UNTITLED",
			en = engOf(S.trk);
		const snap = JSON.parse(
			JSON.stringify(
				en === "FM"
					? {
							alg: S.alg,
							fb: S.fb,
							ops: S.ops,
							lfo: S.lfo,
							pegR: S.pegR,
							pegL: S.pegL,
							sync: S.sync,
							tr: S.tr,
						}
					: en === "ANA"
						? S.ana
						: en === "WAVE"
							? S.wt
							: en === "SMP"
								? { slice: S.smp.slice, st: S.smp.st, pitch: S.smp.pitch, dir: S.smp.dir }
								: {
										tune: S.drum.tune,
										dec: S.drum.dec,

									},
			),
		);

			(k) => k >= 0,
		); /* slot n = the n-th user patch; the bank holds 128 */

			const k = clamp(S.save.slot, 1, 128) - 1;

			const o = {};

		}

	}

		}

		if (!L.length) {

		}

			ss = stepSec(),
			ct = AC ? AC.currentTime : 0;

			const e = L[j];
			if (e.when < ct - 2) {

			}

	}

	function recNote(n, vel) {
		if (!S.rec || !S.playing || !AC || S.screen === "smp" || AC.currentTime < A.t0 - 0.005) {
			return null;
		}
		if (S.trk === DT) {
			const ss = stepSec(),
				lat = AC.outputLatency || AC.baseLatency || 0,
				pos = snapPos(Math.round((AC.currentTime - lat - A.t0) / ss)),
				i = ((pos % nstT()) + nstT()) % nstT(),
				q = S.seqs[S.trk],
				idx = clamp(n - 36, 0, 7) * SMAX + i,

	}

			return;
		}

		} /* (a replaced note that ends meanwhile remembers when, in case it is given back) */
		if (h.drum) {

			return;
		}

		}

			clamp(
				Math.round(((Math.max(0, e - h.t0) / stepSec()) * 10000) / clamp(S.sgate, 20, 100)),

	}

		if (!h || h.done) {
			return;
		}

			h.done = 1;
			h.q.dg[h.idx] = h.prev;
			return;
		}
		h.done = 1;
		const k = A.recOpen.indexOf(h);
		if (k >= 0) {

		}

			h.q.st[h.i] = h.prev[0];
			h.q.vel[h.i] = h.prev[1];

			}

		}

		};

	} // the voice's note-off is the end of the recorded note

			return;
		}
		const ss = stepSec(),
			pos = snapPos(Math.round((when - A.t0) / ss)),
			i = ((pos % nstT(t)) + nstT(t)) % nstT(t),
			q = S.seqs[t];

			return;
		}

		q.vel[i] = 95;
		q.gate[i] = gateQ(
			clamp(
				Math.round((((sd * TK(t).arp.gate) / ss) * 100) / clamp(S.sgate, 20, 100)),
				5,
				gateMax(t),
			),

	const KK_MAJ = [6.35, 2.23, 3.48, 2.33, 4.38, 4.09, 2.52, 5.19, 2.39, 3.66, 2.29, 2.88],

		const h = A.heard;
		for (let i = 0; i < 12; i++) {
			h[i] *= 0.96;
		}
		h[((Math.round(m) % 12) + 12) % 12] += 1;
	}

		const h = A.heard.slice();
		S.pats.forEach((P, pi) =>
			P.forEach((q, t) => {
				const e = engOf(t);
				if (e === "DRUM" || e === "SMP") {
					return;
				}
				q.st.slice(0, SPB() * (S.tl[pi][t] || S.plen[pi])).forEach((n) => {
					if (n >= 0) {
						h[n % 12] += 0.7;
					}
				});
			}),
		);

		for (let i = 0; i < 12; i++) {
			tot += h[i];
		}

			return null;
		}
		const mean = tot / 12;
		let sd = 0;
		for (let i = 0; i < 12; i++) {

		}

	let keyCache = null,
		keyAt = 0;

	function currentKey() {
		const t = performance.now();

			keyAt = t;
			keyCache = detectKey();
		}
		return keyCache;
	}

		keyVel = () => [0.6, 0.85, 1, 0.8][S.glob.vel];
	[0, 5, 7, 8].forEach((i) => applyPreset(i));

	// ---------- stock FM-1 layout (page names and order from the stock firmware's menu strings) + Mellow extras ----------
	S.ppMode = "edit";
	S.ppPage = 0;
	S.seqEn = false;
	S.mono = false;
	S.pegR = [99, 99, 99, 99];
	S.pegL = [50, 50, 50, 50];
	S.adsr = { a: 0, d: 30, s: 0, r: 30 };

		ech: 1,
		pu: 2,
		pdn: 2,

		cin: 0,

			ech: [1, 16],
			out: [0, 3],
			bt: [0, 1],
			vel: [0, 3],

	function adsrFromOps() {
		const c = (ALG[S.alg].c[0] || 1) - 1,
			o = S.ops[c],
			q = (r) => clamp(Math.round((99 - r) / 0.9), 0, 99);
		S.adsr = { a: q(o.R[0]), d: q(o.R[1]), s: o.L[2], r: q(o.R[3]) };
	}

	function applyAdsr() {
		const a = S.adsr,
			q = (v) => 99 - Math.round(v * 0.9);
		ALG[S.alg].c.forEach((c) => {
			const o = S.ops[c - 1];
			o.R[0] = q(a.a);
			o.R[1] = q(a.d);
			o.R[2] = q(a.d);
			o.R[3] = q(a.r);
			o.L[2] = a.s;
		});
	}
	const ADS = (l, k) => ({
		ref: [S.adsr, k, 0, 99],
		l,
		v: String(S.adsr[k]),
		n: S.adsr[k] / 99,
		set: (d) => {
			S.adsr[k] = clamp(S.adsr[k] + d, 0, 99);
			applyAdsr();
		},
	});
	const fixedHz = (o) => Math.pow(2, ((4458616 * ((o.co & 3) * 100 + o.fi)) >> 3) / 16777216);

	function ratioTxt(o) {
		if (o.mode) {
			const f = fixedHz(o);
			return (f >= 1000 ? (f / 1000).toFixed(2) + "K" : f.toFixed(f < 10 ? 2 : 1)) + "HZ";
		}
		return ((o.co || 0.5) * (1 + o.fi / 100)).toFixed(2);
	}
