	// ---------- sequencer, arp, drift ----------
	function stepPlay(t, k, when) {
		if (t === DT) {
			drumStep(t, k, when);
			return;
		} /* the drum track plays its grid */
		const q = S.seqs[t],
			i = k % nstT(t),
			n = q.st[i];
		if (n < 0) {
			return;
		}
		if (A.recLive.length && recLiveSkip(t, k, when, -1)) {
			return;
		}
		if (SPLOG.l) {
			SPLOG.l.push([t, S.pat, S.song.pos]);
		}
		const vel = q.vel[i] / 127,
			en = engOf(t),
			ss = stepSec();
		if (en === "DRUM") {
			drumHit(t, clamp(n - 36, 0, 7), vel, when);
			return;
		}
		if (en === "SMP") {
			const v = sampVoice(t, clamp(n - 36, 0, 7), 60, vel, when);
			A.seqV.push(v);
			sqAdd(t, when, v);
			return;
		}
		const v = noteVoice(t, n, vel, when, Math.max(0.03, ((q.gate[i] / 100) * ss * S.sgate) / 100));
		A.seqV.push(v);
		sqAdd(t, when, v);
	}

	/* A.sq: the sequenced sounds of the last few seconds (voices and drum hits, by track), so a song mute can cancel what is already scheduled in the look-ahead and let go of what sounds. A.sl: the steps the scheduler passed recently with the mask each had, so an un-mute can fill in the steps it skipped. */
	function sqAdd(t, when, v) {
		if (v) {
			A.sq.push({ t, when, v });
		}
		if (A.sq.length > 400) {
			A.sq.splice(0, 100);
		}
	}

	function songMuteCut(t) {
		const now = AC.currentTime;
		A.sq = A.sq.filter((e) => {
			if (e.t !== t) {
				return e.when > now - 4;
			}
			if (e.v) {
				if (!e.v.dead && !e.v.stolen && e.v.cut) {
					e.v.cut(true);
				}
			} else if (e.g && e.end > now) {
				const p = e.g.gain;
				try {
					p.cancelScheduledValues(now);
					p.setTargetAtTime(0, now, 0.004);
				} catch (x) {}
			}
			return false;
		});
	}

	function songUnmuteFill(t) {
		const ct = AC.currentTime,
			sg = S.song;
		A.sl.forEach((e) => {
			if ((e.sm >> t) & 1 && e.pos === sg.pos && e.pat === S.pat && e.when > ct + 0.012) {
				e.sm &= ~(1 << t);
				if (!(S.rec && TK(t).arp.on && A.arps[t].size)) {
					A.sqOn = t;
					A.dmCur = t === DT ? songPadMask() : 0;
					stepPlay(t, e.sn, e.when);
					A.sqOn = -1;
					A.dmCur = 0;
				}
			}
		});
	}

	/* a mute edit while playing: the scheduler used the old mask for the steps already in the look-ahead, so cancel (muted) or fill in (un-muted) just those, at once */
	/* per-pad mutes (the drum track's 8 pads, `dmute` on the slot): the same two moves as for tracks, on the hits of just those pads */
	function songPadCut(bits) {
		const now = AC.currentTime;
		A.sq = A.sq.filter((e) => {
			if (e.t !== DT || e.pad == null || !((bits >> e.pad) & 1)) {
				return e.when > now - 4;
			}
			if (e.g && e.end > now) {
				const p = e.g.gain;
				try {
					p.cancelScheduledValues(now);
					p.setTargetAtTime(0, now, 0.004);
				} catch (x) {}
			}
			return false;
		});
	}

	function songPadFill(bits) {
		const ct = AC.currentTime,
			sg = S.song;
		A.sl.forEach((e) => {
			const b = bits & e.dm;
			if (b && e.pos === sg.pos && e.pat === S.pat && e.when > ct + 0.012) {
				e.dm &= ~b;
				if (!((e.sm >> DT) & 1)) {
					A.sqOn = DT;
					A.dmCur = 255 & ~b;
					drumStep(DT, e.sn, e.when);
					A.sqOn = -1;
					A.dmCur = 0;
				}
			}
		});
	}

	function songMaskSync() {
		if (!AC || !S.playing) {
			return;
		}
		const m = songMask(),
			d = m ^ A.sqMask,
			dm = songPadMask(),
			dd = dm ^ A.sqDm;
		if (!d && !dd) {
			return;
		}
		A.sqMask = m;
		A.sqDm = dm;
		if (!A.sl.length && !A.sq.length) {
			return;
		}
		for (let t = 0; t < 4; t++) {
			if ((d >> t) & 1) {
				if ((m >> t) & 1) {
					songMuteCut(t);
				} else {
					songUnmuteFill(t);
				}
			}
		}
		if (dd && !((m >> DT) & 1)) {
			if (dd & dm) {
				songPadCut(dd & dm);
			}
			if (dd & ~dm) {
				songPadFill(dd & ~dm);
			}
		}
	}

	function songChain() {
		const c = [];
		for (const e of S.song.chain) {
			if (e.pat < 0) {
				break;
			}
			c.push(e);
		}
		return c;
	}

	// ---- per-slot track mutes: `mute` on a chain slot is 4 bits (bit t set = track t is silent while that slot plays). Only the sequenced notes are muted, and only while the song is on and
	// the scheduler is walking the chain (`go`): live keys, the arp from held keys and audition taps never are. A missing mute (an older save) is 0.
	const SPLOG = { l: null }; // test hook: [track, pattern, song slot] for every sequenced note that sounds (tests/songmute.js)
	A.sq = [];
	A.sl = [];
	A.sqMask = 0;
	A.sqDm = 0;
	A.sqOn = -1;
	A.dmCur = 0;
	const SGM = (e) => (e && e.mute | 0) & 15,
		SGDM = (e) => (e && e.dmute | 0) & 255;
	const songMask = () => {
		const sg = S.song;
		if (!sg.on || !sg.go) {
			return nestMask();
		}
		const e = sg.chain[sg.pos];
		return e && e.pat >= 0 ? SGM(e) : 0;
	};
	const songPadMask = () => {
		const sg = S.song;
		if (!sg.on || !sg.go) {
			return nestPadMask();
		}
		const e = sg.chain[sg.pos];
		return e && e.pat >= 0 ? SGDM(e) : 0;

	}; // the drum pads this slot mutes (bit p = pad p), on the same terms as the track mask
	function songClean(ch) {
		return Array.from({ length: 16 }, (_, i) => {
			const e = (ch && ch[i]) || {};
			return {
				pat: e.pat == null ? -1 : clamp(e.pat | 0, -1, 15),
				rep: clamp(e.rep | 0 || 1, 1, 8),
				mute: (e.mute | 0) & 15,
				dmute: (e.dmute | 0) & 255,
				col: [0, 1, 2, 3].map((t) => clamp((e.col && e.col[t]) | 0, 0, NCOLN - 1)),
			};
		});

	} // 16 slots, every field in range, whatever was saved
	function songStart() {
		const sg = S.song;
		sg.base = 0;
		sg.jump = -1;
		sg.go = 0;
		const c = songChain();
		if (!sg.on || !c.length) {
			return;
		}
		sg.pos = 0;
		sg.rc = 0;
		sg.go = 1;
		S.pat = c[0].pat;
		S.patNext = -1;
	}
	const songBaseOf = (j) => {
		let n = 0;
		songChain()
			.slice(0, j)
			.forEach((e) => (n += SPB() * S.plen[e.pat] * e.rep));
		return n;
	};

	// at the end of a pass of the playing pattern: a requested jump, else the next repeat, or the next pattern in the chain (the chain loops)
	function songAdvance(ps) {
		const c = songChain(),
			sg = S.song;
		if (!c.length) {
			return;
		}
		sg.go = 1;
		if (sg.jump >= 0) {
			const j = Math.min(sg.jump, c.length - 1);
			sg.jump = -1;
			sg.pos = j;
			sg.rc = 0;
			sg.base = songBaseOf(j);
			S.patNext = c[j].pat;
			return;
		}
		const e = c[sg.pos] || c[0];
		sg.rc++;
		sg.base = (sg.base || 0) + ps;
		if (sg.rc >= e.rep) {
			sg.rc = 0;
			sg.pos = (sg.pos + 1) % c.length;
			if (sg.pos === 0) {
				sg.base = 0;
			}
		}
		S.patNext = c[sg.pos].pat;

	} // base: steps of the chain played so far (automations follow it)
	// song mode on or off (the PAGE knob, the ON chip). Stopped: just armed, PLAY starts at slot 1. Playing: the chain starts at the selected slot when this pass ends.
	function songSetOn(on) {
		on = on ? 1 : 0;
		const sg = S.song;
		if (on === sg.on) {
			return;
		}
		undoPush("SONG");
		sg.on = on;
		sg.jump = -1;
		sg.go = 0;
		if (on) {
			const c = songChain();
			if (S.playing && AC && c.length) {
				sg.jump = Math.min(sg.sel, c.length - 1);
			} else {
				sg.pos = 0;
				sg.rc = 0;
			}
		}
	}

	// select a slot. Stopped: the sequencer now shows its pattern. Playing: `go` asks for it (song on: playback jumps there when the pass ends; song off: the pattern is queued like the PATTERN knob).
	function songSelect(i, go) {
		const sg = S.song,
			e = sg.chain[i];
		sg.sel = clamp(i, 0, 15);
		if (!e || e.pat < 0) {
			return;
		}
		if (!(S.playing && AC)) {
			S.pat = e.pat;
			S.patNext = -1;
			return;
		}
		if (go) {
			songJump(i);
		}
	}

	// playing: play slot i next, when this pass ends (white key 5 on the song screen, or a tap on a row). Song off: queue its pattern like the PATTERN knob.
	function songJump(i) {
		const sg = S.song,
			e = sg.chain[i];
		if (!e || e.pat < 0 || !(S.playing && AC)) {
			return;
		}
		if (sg.on) {
			if (NEST.pv) {
				nestCollapse();
			} /* a looping dropdown: jumping leaves the loop, the song carries on from that slot */
			sg.jump = i;
			toast("NEXT: SLOT " + (i + 1));
		} else {
			S.patNext = e.pat === S.pat ? -1 : e.pat;
		}
	}

	/* a jump while the song plays lands on the next BAR line (the next beat when the playing pattern is one bar, since a bar is its whole pass): the slot starts from its first bar, or, from a one-bar pattern, keeps the position inside the bar. The sequencer follows at that moment (S.pat) */
	function songJumpNow(ss) {
		const c = songChain(),
			sg = S.song,
			j = Math.min(sg.jump, c.length - 1),
			off = S.plen[S.pat] === 1 ? A.sn % SPB() : 0;
		sg.jump = -1;
		sg.go = 1;
		sg.pos = j;
		sg.rc = 0;
		sg.base = songBaseOf(j);
		S.pat = c[j].pat;
		S.patNext = -1;
		const sh = (A.sn - off) * ss;
		A.t0 += sh;
		A.sn = off;
		S.t0 += sh * 1000;
	}

	// ---- every slot has its own pattern number: no two slots of the chain hold the same pattern (to play one again use REPEAT, or DUPE for a copy you can vary). The rule is for edits only:
	// a save, project or undo step that already holds a repeated number loads and plays as it always did, and a slot is only moved when the owner edits its PAT cell.
	const patUsed = (p, except) => S.song.chain.some((e, i) => i !== except && e.pat === p);
	const patFirstFree = () => {
		for (let p = 0; p < 16; p++) {
			if (!patUsed(p, -1)) {
				return p;
			}
		}
		return -1;
	};

	// the pattern a PAT cell or the PATTERN knob lands on, d steps (or +-1) from slot i's: only free patterns and the empty state (-1) count. wrapIt: the cell wraps, the knob stops at the ends
	function patStep(i, d, wrapIt) {
		const e = S.song.chain[i],
			dir = d < 0 ? -1 : 1;
		let k = e.pat;
		for (let n = 0, m = Math.max(1, Math.abs(d | 0)); n < m; n++) {
			let q = k;
			for (let g = 0; g < 17; g++) {
				q += dir;
				if (q > 15) {
					if (wrapIt) {
						q = -1;
					} else {
						q = k;
						break;
					}
				}
				if (q < -1) {
					if (wrapIt) {
						q = 15;
					} else {
						q = k;
						break;
					}
				}
				if (q < 0 || !patUsed(q, i)) {
					break;
				}
			}
			k = q;
		}
		return k;
	}

	function patSet(i, p) {
		const e = S.song.chain[i],
			w = e.pat;
		e.pat = p;
		if (w < 0 && p >= 0) {
			e.mute = 0;
			e.dmute = 0;
			e.col = [0, 0, 0, 0];
		}
	}

	// a free pattern to put a copy in: an unused empty one first, else the pasted-over slot's own pattern, else the first unused one (its notes are replaced; undo brings them back)
	function patCopyTarget(except) {
		const o = except >= 0 ? S.song.chain[except].pat : -1;
		let b = o >= 0 && !patUsed(o, except) ? o : -1;
		for (let p = 0; p < 16; p++) {
			if (patUsed(p, except)) {
				continue;
			}
			if (b < 0) {
				b = p;
			}
			if (patEmpty(p)) {
				return p;
			}
		}
		return b;

	} // no empty one: the pattern of the slot being pasted over, else the first unused
	// slot i is to hold `pat`: that pattern itself when no other slot has it, else a copy of its content in a free pattern ({p, cp}); null (with a toast) when none is left
	function slotPatFor(i, pat, except) {
		if (!patUsed(pat, except)) {
			return { p: pat, cp: false };
		}
		const fp = patCopyTarget(except);
		if (fp < 0) {
			toast("NO FREE PATTERN");
			return null;
		}
		return { p: fp, cp: true, wipe: !patEmpty(fp) };
	}

	function songAdd() {
		const c = songChain(),
			n = c.length;
		if (n >= 16) {
			return;
		}
		const fp = patFirstFree();
		if (fp < 0) {
			toast("NO FREE PATTERN");
			return;
		}
		undoPush("SONG");
		const e = S.song.chain[n];
		e.pat = fp;
		e.rep = 1;
		e.mute = 0;
		e.dmute = 0;
		e.col = [0, 0, 0, 0];
		songSelect(n, false);
	}

	function songToggleMute(i, t) {
		const e = S.song.chain[i];
		if (!e || e.pat < 0 || !(t >= 0 && t < 4)) {
			return;
		}
		undoPush("SONG MUTE");
		e.mute = ((e.mute | 0) ^ (1 << t)) & 15;
		songSelect(i, false);
		songMaskSync();
		toast("SLOT " + (i + 1) + "  T" + (t + 1) + ((e.mute >> t) & 1 ? " MUTED" : " PLAYS"));
	}

	// one drum pad of one slot muted or let go (bit p of `dmute`): the drum track's pads inside the slot dropdown, white keys 1-8 while they are shown. Heard at once, like a track mute.
	function songTogglePad(i, pd) {
		const e = S.song.chain[i];
		if (!e || e.pat < 0 || !(pd >= 0 && pd < DGN)) {
			return;
		}
		undoPush("PAD MUTE");
		e.dmute = ((e.dmute | 0) ^ (1 << pd)) & 255;
		songSelect(i, false);
		songMaskSync();
		toast("SLOT " + (i + 1) + "  " + PADS[pd] + ((e.dmute >> pd) & 1 ? " MUTED" : " PLAYS"));
	}

	// the song screen -> a track's sequencer (or its drum grid) showing the selected slot's pattern (a playing song keeps the pattern that plays)
	function songToSeq() {
		if (S.screen !== "song") {
			return;
		}
		const e = S.song.chain[S.song.sel];
		if (!(S.playing && AC) && e && e.pat >= 0) {
			S.pat = e.pat;
			S.patNext = -1;
		}
		S.screen = "seq";
		S.seqPage = 0;
		S.seqEn = true;
		pop("TRACK", "T" + (S.trk + 1) + "  PAT " + pad(S.pat + 1), S.trk / 3);
	}

	function songGoTrack(t) {
		S.trk = t;
		songToSeq();
	}

	function songOpen() {
		const sg = S.song;
		if (sg.on && sg.go && S.playing && AC) {
			sg.sel = clamp(sg.pos, 0, 15);
		} else if (!(sg.chain[sg.sel] && sg.chain[sg.sel].pat === S.pat)) {
			const k = songChain().findIndex((e) => e.pat === S.pat);
			if (k >= 0) {
				sg.sel = k;
			}
		}
		S.screen = "song";
		S.seqEn = true;
		audioSync();
	}

	function startSeq() {
		if (!AC) {
			return;
		}
		songStart();
		A.sq = [];
		A.sl = [];
		A.sqMask = 0;
		A.sqDm = 0;
		S.t0 = performance.now() + 25;
		A.t0 = AC.currentTime + 0.025;
		A.sn = 0;
		if (S.rec) {
			undoPush("RECORDING");
		}
		nestStart();
		tick();

	} /* the first step is 25 ms away (was 60) and is scheduled now, not at the next 25 ms timer tick */
	// ---- COPY / PASTE / INSERT / DELETE on the song screen, and the NESTED VIEW of one slot (PROTOTYPE ONLY screens; the data is device-sized) ----
	// The song screen's chips work on a SLOT (pattern number, repeat, mutes, colours, the lanes scoped to it) or, with the SLOT / PAT chip on PAT, on a PATTERN's content (four tracks' notes, the drum grid,
	// the lengths). One clipboard each (`NCLIP`: a slot is 4 numbers + its lanes, a pattern is 4 x 128 steps x 3 bytes + the 1 KB drum grid, about 1.5 KB). Every operation is one undo step.
	// The dropdown (tap the chevron next to a slot's PAT): the slot's four tracks open under its row, in the same list (mute, colour, a strip of the track's steps, its automation lanes, and + ADD AUTOMATION with a menu of what
	// that track can automate); one slot at a time, and the slot's pattern loops while it is open. A lane is `S.auto` as before (one parameter, 64 samples a bar x 1 byte, at most 16 lanes in all); `lane.slot` scopes it to one slot.
	const NCOLN = 6,
		NCOLNM = ["NONE", "RED", "GRAY", "WASHI", "PALE", "DIM"],
		ncol = (e, t) => ((e && e.col && e.col[t]) | 0) % NCOLN;
	const NCLIP = { slot: null, pat: null, padc: null, lane: null, mode: 1, trk: -1 },

		NEST = { i: -1, sel: null, pv: 0, pi: 0, nob: 0, dr: 0, pd: 0 }; // NEST.dr: the drum track's 8 pads are shown under it; NEST.pd: the pad chosen in the dropdown (PAD copy / paste / clear work on its row); NEST.sel: the lane chosen (LANE mode)
	// the mode chip's cycle: SLOT, PATTERN, T1-T4 (one track of the pattern), PAD (one drum pad's row of hits), LANE (one automation lane); [mode, track]
	const NCMODES = [
			[0, -1],
			[1, -1],
			[1, 0],
			[1, 1],
			[1, 2],
			[1, 3],
			[2, -1],
			[3, -1],
		],
		ncIdx = () => {
			const k = NCMODES.findIndex((q) => q[0] === NCLIP.mode && q[1] === NCLIP.trk);
			return k < 0 ? 1 : k;
		};
	const NCH = [
		{ k: "copy", x: 4, w: 42 },
		{ k: "paste", x: 48, w: 46 },
		{ k: "ins", x: 96, w: 46 },
		{ k: "del", x: 144, w: 46 },
		{ k: "mode", x: 194, w: 42 },
	];

	const NV = { x: 11, hd: 14, hh: 22, lh: 13, eh: 34, ah: 15, ph: 13 }; // the dropdown's row heights (LCD pixels): header, track, lane (+ the drawing box when open), add chip
	const nstP = (pi, t) => SPB() * (S.tl[pi][t] || S.plen[pi]);

	// ---- the clipboard ----
	function songClipDraw() {
		const y = SG.cy,
			m = NCLIP.mode,
			c = NCLIP,
			pm =
				m === 0
					? "SLOT"
					: m === 1
						? c.trk >= 0
							? "T" + (c.trk + 1)
							: "PAT"
						: m === 2
							? "PAD"
							: "LANE",
			lb =
				m === 0
					? ["COPY", "PASTE", "INSERT", "DELETE"]
					: m === 1
						? ["COPY", "PASTE", "DUPE", "CLEAR"]
						: ["COPY", "PASTE", "", "CLEAR"],
			has = m === 0 ? c.slot : m === 1 ? c.pat : m === 2 ? c.padc : c.lane;
		NCH.forEach((h, k) => {
			const off = m >= 2 && k === 2,
				dim = off || (k === 1 && !has);
			if (k === 4) {
				R(h.x, y, h.w, SG.ch2, m ? P.sel : P.faint);
				T(pm, h.x + h.w / 2, y + 2, m ? P.selfg : P.fg, 1, "c");
			} else if (k === 0 && has) {
				R(h.x, y, h.w, SG.ch2, P.bar);
				B(h.x, y, h.w, SG.ch2, P.acc);
				T(lb[k], h.x + h.w / 2, y + 2, P.fg, 1, "c");
			} // something is on the clipboard: COPY stays lit
			else {
				B(h.x, y, h.w, SG.ch2, dim ? P.faint : P.dim);
				T(lb[k], h.x + h.w / 2, y + 2, dim ? P.faint : P.fg, 1, "c");
			}
		});
	}

	// ---- the song preview: the whole chain as a timeline under the chips. One block per slot, one pixel per step, so a block is as wide as its bars x repeats; five lanes: a header (slot number) and T1-T4
	// (a tick per note, T4 the drum hits of all pads); a muted track is dim and struck, a muted pad dims its hits. A playhead moves while the song or the slot loop plays and the view follows it; stopped, drag it sideways.
	function pvLay() {
		const o = [];
		let x = 0;
		songChain().forEach((e, i) => {
			const st = SPB() * S.plen[e.pat],
				w = st * e.rep;
			o.push({ i, x, w, st, rep: e.rep });
			x += w;
		});
		return { B: o, W: x };
	}

	const pvClamp = (v, g = PV) => clamp(Math.round(v), 0, Math.max(0, pvLay().W - g.w)); // g: which instance (PV on the song screen, HV = the mini player on Home; both draw the same chain with their own position, width and scroll)
	// where the playhead is, in preview steps ({i: slot, x}), or null: the walked slot of a playing song, the slot looping in the dropdown, or the first slot that holds the pattern that plays
	function pvHead() {
		if (!S.playing || !AC) {
			return null;
		}
		const sg = S.song,
			ch = songChain();
		if (!ch.length) {
			return null;
		}
		let i,
			rc = 0;
		if (sg.on && sg.go && !NEST.pv) {
			i = sg.pos;
			rc = sg.rc | 0;
		} else {
			i = nestOn() ? NEST.i : ch.findIndex((e) => e.pat === S.pat);
			if (i < 0 || i >= ch.length || ch[i].pat !== S.pat) {
				return null;
			}
		}
		if (i >= ch.length) {
			return null;
		}
		const st = SPB() * S.plen[ch[i].pat],
			pf = playPosF(),
			inP = ((pf % st) + st) % st;
		let base = 0;
		for (let k = 0; k < i; k++) {
			base += SPB() * S.plen[ch[k].pat] * ch[k].rep;
		}
		return { i, x: base + Math.min(rc, ch[i].rep - 1) * st + inP };
	}

	function songPreviewDraw(now, live, g = PV) {
		const sg = S.song,
			{ B: bl, W } = pvLay(),
			hd = live ? pvHead() : null,
			x0 = g.x,
			x1 = g.x + g.w;
		R(x0, g.y, g.w, g.h, P.bg);
		if (!bl.length) {
			T(
				g === PV ? "NO PATTERNS YET" : "NO SONG YET: SONG BUTTON, + ADD",
				x0 + g.w / 2,
				g.y + 14,
				P.faint,
				1,
				"c",
			);
			return;
		}
		const key = sg.sel + ":" + W;
		if (key !== g.key) {
			g.key = key;
			const b = bl[sg.sel];
			if (b && !(S.playing && AC)) {
				if (b.x < g.sc) {
					g.sc = b.x - 4;
				} else if (b.x + Math.min(b.w, g.w) > g.sc + g.w) {
					g.sc = b.x + Math.min(b.w, g.w) - g.w + 4;
				}
			}
		}
		if (hd && (hd.x < g.sc + 3 || hd.x > g.sc + g.w - 14)) {
			g.sc = hd.x - 24;
		}
		g.sc = pvClamp(g.sc, g);
		const ly = (t) => g.y + 10 + t * 7;
		for (const b of bl) {
			const e = sg.chain[b.i],
				bx = x0 + b.x - g.sc;
			if (bx + b.w <= x0 || bx >= x1) {
				continue;
			}
			const c0 = Math.max(bx, x0),
				c1 = Math.min(bx + b.w, x1),
				sel = b.i === sg.sel,
				play = hd && hd.i === b.i,
				mk = SGM(e),
				dm = SGDM(e);
			R(c0, g.y, c1 - c0, 8, sel ? P.sel : play ? P.rec : P.bar);
			const lab = pad(b.i + 1),
				lw = TW(lab),
				lx = Math.max(bx, x0) + 2;
			if (lx + lw <= Math.min(bx + b.w, x1) - 1) {
				T(lab, lx, g.y + 1, sel ? P.selfg : play ? P.selfg : P.dim);
			}
			for (let t = 0; t < 4; t++) {
				R(c0, ly(t), c1 - c0, 6, P.grid);
			}
			R(bx, g.y + 8, 1, g.h - 8, P.bg);
			for (let r = 1; r < b.rep; r++) {
				const rx = bx + r * b.st;
				if (rx >= x0 && rx < x1) {
					R(rx, g.y + 9, 1, g.h - 9, P.faint);
				}
			}
			for (let t = 0; t < 4; t++) {
				const q = S.pats[e.pat][t],
					n = nstP(e.pat, t),
					mu = (mk >> t) & 1,
					col = ncol(e, t),
					cc = mu ? P.faint : col ? P.tag[col] : P.fg,
					g = t === DT ? q.dg : null;
				for (let px = c0; px < c1; px++) {
					const j = ((px - bx) % b.st) % n;
					if (t === DT) {
						if (!g) {
							continue;
						}
						let on = 0,
							off = 0;
						for (let r = 0; r < DGN; r++) {
							if (g[r * SMAX + j]) {
								if ((dm >> r) & 1) {
									off = 1;
								} else {
									on = 1;
								}
							}
						}
						if (on) {
							R(px, ly(t) + 1, 1, 5, cc);
						} else if (off) {
							R(px, ly(t) + 3, 1, 3, mu ? P.faint : P.hint);
						}
					} else if (q.st[j] >= 0) {
						const hh = 3 + Math.round((q.vel[j] / 127) * 2);
						R(px, ly(t) + 6 - hh, 1, hh, cc);
					}
				}
				if (mu) {
					R(c0, ly(t) + 3, c1 - c0, 1, P.hint);
				}
			}
		}
		if (hd) {
			const hx = x0 + hd.x - g.sc;
			if (hx >= x0 && hx < x1) {
				R(hx, g.y, 1, g.h, P.fg);
			}
		}
	}

	function songClip(k) {
		const sg = S.song,
			i = sg.sel,
			e = sg.chain[i];
		if (
			NEST.i >= 0 &&
			k !== "mode" &&
			k !== "copy" &&
			k !== "paste" &&
			(NCLIP.mode === 0 ? k === "ins" || k === "del" : NCLIP.mode === 1 && k === "ins")
		) {
			nestCollapse();
		} // INSERT / DELETE / DUPE shift the slots: the dropdown closes
		if (k === "mode") {
			const n = (ncIdx() + 1) % NCMODES.length;
			NCLIP.mode = NCMODES[n][0];
			NCLIP.trk = NCMODES[n][1];
			toast(
				"CLIPBOARD: " +
					(NCLIP.mode === 0
						? "SLOT"
						: NCLIP.mode === 1
							? NCLIP.trk < 0
								? "PATTERN"
								: "PATTERN, T" + (NCLIP.trk + 1) + " ONLY"
							: NCLIP.mode === 2
								? "DRUM PAD ROW: " + PADS[NEST.pd]
								: "AUTOMATION LANE"),
			);
			return;
		} /* SLOT, PATTERN, one track of a pattern (T1-T4: copy, paste and clear only that track), one drum pad's row, one automation lane */
		if (NCLIP.mode === 0) {
			if (k === "copy") {
				slotCopy(i);
			} else if (k === "paste") {
				slotPaste(i);
			} else if (k === "ins") {
				slotInsert(i);
			} else {
				slotDelete(i);
			}
			return;
		}
		if (!e || e.pat < 0) {
			toast("EMPTY SLOT");
			return;
		}
		if (NCLIP.mode === 2) {
			padClip(k, e);
			return;
		}
		if (NCLIP.mode === 3) {
			laneClip(k, i);
			return;
		}
		if (k === "copy") {
			NCLIP.pat = patGrab(e.pat, NCLIP.trk);
			toast(
				"COPIED " +
					(NCLIP.trk >= 0 ? "T" + (NCLIP.trk + 1) + " OF " : "") +
					"PATTERN " +
					pad(e.pat + 1),
			);
		} else if (k === "paste") {
			if (!NCLIP.pat) {
				toast("NOTHING COPIED");
				return;
			}
			undoPush("PASTE PATTERN");
			patPut(e.pat, NCLIP.pat);
			toast(
				"PASTED " +
					(NCLIP.pat.trk >= 0 ? "T" + (NCLIP.pat.trk + 1) + " " : "") +
					"INTO PATTERN " +
					pad(e.pat + 1),
			);
		} else if (k === "ins") {
			patDupe(i);
		} else {
			undoPush("CLEAR PATTERN");
			for (let t = 0; t < 4; t++) {
				if (NCLIP.trk >= 0 && t !== NCLIP.trk) {
					continue;
				}
				const o = S.pats[e.pat][t];
				o.st.fill(-1);
				o.gate.fill(50);
				o.vel.fill(100);
				o.sel = 0;
				if (o.dg) {
					o.dg.fill(0);
				}
			}
			toast(
				"CLEARED " +
					(NCLIP.trk >= 0 ? "T" + (NCLIP.trk + 1) + " OF " : "") +
					"PATTERN " +
					pad(e.pat + 1),
			);
		}
	}

	// ---- finer than a track: one drum pad's row of hits (T4's grid, `q.dg[pad * SMAX + step]`) and one automation lane, copied into another pattern / slot. PAD works on the pad chosen in the dropdown (NEST.pd: tap a pad row, or K2 PADS),
	// LANE on the lane chosen there (NEST.sel); COPY reads the selected slot's pattern, PASTE and CLEAR act on the selected slot (the same slot rule as the other modes). A memory copy of at most 128 bytes (a row) or 64 bytes a bar (a lane).
	const padHits = (pi, pd) => {
		const g = S.pats[pi][DT].dg;
		let n = 0;
		if (g) {
			for (let j = 0; j < SMAX; j++) {
				if (g[pd * SMAX + j]) {
					n++;
				}
			}
		}
		return n;
	};

	function padGrab(pi, pd) {
		const g = S.pats[pi][DT].dg;
		return {
			from: pi,
			pad: pd,
			v: g ? Array.from(g.subarray(pd * SMAX, pd * SMAX + SMAX)) : new Array(SMAX).fill(0),
		};
	}

	function padPut(pi, pd, c) {
		const g = S.pats[pi][DT].dg;
		if (!g) {
			return;
		}
		for (let j = 0; j < SMAX; j++) {
			g[pd * SMAX + j] = c.v[j] | 0;
		}
	}

	function padClear(pi, pd) {
		const g = S.pats[pi][DT].dg;
		if (g) {
			g.fill(0, pd * SMAX, pd * SMAX + SMAX);
		}
	}

	function padClip(k, e) {
		const pd = NEST.pd,
			nm = PADS[pd],
			pn = "PATTERN " + pad(e.pat + 1);
		if (k === "copy") {
			NCLIP.padc = padGrab(e.pat, pd);
			const n = padHits(e.pat, pd);
			toast(
				"COPIED " +
					nm +
					" OF " +
					pn +
					(n ? "  " + n + (n === 1 ? " HIT" : " HITS") : "  (EMPTY ROW)"),
			);
		} else if (k === "paste") {
			const c = NCLIP.padc;
			if (!c) {
				toast("NOTHING COPIED");
				return;
			}
			undoPush("PASTE PAD ROW");
			padPut(e.pat, pd, c);
			toast("PASTED " + PADS[c.pad] + (c.pad === pd ? "" : " AS " + nm) + " INTO " + pn);
		} else if (k === "del") {
			undoPush("CLEAR PAD ROW");
			padClear(e.pat, pd);
			toast("CLEARED " + nm + " OF " + pn);
		}
	}

	function laneGrab(id) {
		const a = S.auto[id];
		return a
			? { base: aBase(id), a: Object.assign({}, a, { v: a.v.slice() }), from: aSlotOf(a) }
			: null;
	}

	function lanePut(i, c) {
		const id = aIdOf(c.base, i),
			old = S.auto[id];
		if (!old && aFull()) {
			toast("AUTOMATION LIMIT " + NLANES);
			return;
		}
		undoPush("PASTE AUTOMATION");
		if (old) {
			const r = AUR[id];
			if (r && r.on) {
				r.on = 0;
				aRelease(id, old, r);
			}
		}
		S.auto[id] = Object.assign({}, c.a, { v: c.a.v.slice(), slot: i });
		const r = aRt(id);
		r.last = -1;
		r.on = 0;
		if (NEST.i === i) {
			NEST.sel = id;
		}
		toast("PASTED " + c.a.name.replace(/ T\d$/, "") + " INTO SLOT " + (i + 1));
	}

	function laneDelete(id) {
		const a = S.auto[id];
		if (!a) {
			return;
		}
		undoPush("DELETE AUTOMATION");
		const r = AUR[id];
		if (r && r.on) {
			r.on = 0;
			aRelease(id, a, r);
		}
		delete S.auto[id];
		if (NEST.sel === id) {
			NEST.sel = null;
		}
	}

	function laneClip(k, i) {
		const id = NEST.sel && S.auto[NEST.sel] ? NEST.sel : null;
		if (k === "copy") {
			if (!id) {
				toast("OPEN A SLOT AND TAP A LANE");
				return;
			}
			NCLIP.lane = laneGrab(id);
			toast("COPIED LANE " + S.auto[id].name.replace(/ T\d$/, ""));
		} else if (k === "paste") {
			if (!NCLIP.lane) {
				toast("NOTHING COPIED");
				return;
			}
			lanePut(i, NCLIP.lane);
		} else if (k === "del") {
			if (!id) {
				toast("OPEN A SLOT AND TAP A LANE");
				return;
			}
			const nm = S.auto[id].name.replace(/ T\d$/, "");
			laneDelete(id);
			toast("DELETED LANE " + nm);
		}
	}

	function slotGrab(i) {
		const e = S.song.chain[i],
			ln = [];
		for (const id in S.auto) {
			const a = S.auto[id];
			if (aSlotOf(a) === i) {
				ln.push(Object.assign({}, a, { v: a.v.slice(), _b: aBase(id) }));
			}
		}
		return {
			pat: e.pat,
			rep: e.rep,
			mute: SGM(e),
			dmute: SGDM(e),
			col: [0, 1, 2, 3].map((t) => ncol(e, t)),
			ln,
		};
	}

	function slotPut(i, c, pp) {
		const e = S.song.chain[i];
		e.pat = pp == null ? c.pat : pp;
		e.rep = c.rep;
		e.mute = c.mute;
		e.dmute = c.dmute | 0;
		e.col = c.col.slice();
		for (const id in S.auto) {
			if (aSlotOf(S.auto[id]) === i) {
				delete S.auto[id];
			}
		}
		let drop = 0;
		c.ln.forEach((a) => {
			if (aFull()) {
				drop++;
				return;
			}
			const n = Object.assign({}, a, { v: a.v.slice(), slot: i });
			delete n._b;
			S.auto[aIdOf(a._b, i)] = n;
		});
		if (drop) {
			toast("LANE LIMIT " + NLANES + ": " + drop + " NOT COPIED");
		}
	}

	function slotCopy(i) {
		const e = S.song.chain[i];
		if (!e || e.pat < 0) {
			toast("EMPTY SLOT");
			return;
		}
		NCLIP.slot = slotGrab(i);
		toast(
			"COPIED SLOT " +
				(i + 1) +
				(NCLIP.slot.ln.length ? "  +" + NCLIP.slot.ln.length + " AUTOMATION" : ""),
		);
	}

	function slotPaste(i) {
		const sg = S.song,
			n = songChain().length;
		if (!NCLIP.slot) {
			toast("NOTHING COPIED");
			return;
		}
		if (i > n) {
			i = n;
		}
		if (i > 15) {
			return;
		}
		const c = NCLIP.slot,
			t = slotPatFor(i, c.pat, i);
		if (!t) {
			return;
		}
		undoPush("PASTE SLOT");
		if (t.cp) {
			patPut(t.p, patGrab(c.pat));
		}
		slotPut(i, c, t.p);
		sg.jump = -1;
		songSelect(i, false);
		toast(
			t.cp
				? "PASTED INTO SLOT " + (i + 1) + "  PATTERN " + pad(t.p + 1) + " IS A COPY"
				: "PASTED INTO SLOT " + (i + 1),
		);
	}

	function aShift(from, delta, dropAt) {
		const n = {};
		for (const id in S.auto) {
			const a = S.auto[id],
				s = aSlotOf(a);
			if (s < 0) {
				n[id] = a;
				continue;
			}
			if (s === dropAt) {
				continue;
			}
			const ns = s >= from ? s + delta : s;
			if (ns < 0 || ns > 15) {
				continue;
			}
			a.slot = ns;
			n[aIdOf(aBase(id), ns)] = a;
		}
		S.auto = n;
	}

	function slotInsert(i) {
		const sg = S.song,
			n = songChain().length;
		if (n >= 16) {
			toast("CHAIN FULL (16)");
			return;
		}
		if (i > n) {
			i = n;
		}
		if (!n) {
			songAdd();
			return;
		}
		const c = NCLIP.slot || slotGrab(Math.min(i, n - 1)),
			t = slotPatFor(i, c.pat, -1);
		if (!t) {
			return;
		}
		undoPush("INSERT SLOT");
		if (t.cp) {
			patPut(t.p, patGrab(c.pat));
		}
		aShift(i, 1, -2);
		sg.chain.splice(i, 0, { pat: t.p, rep: 1, mute: 0, dmute: 0, col: [0, 0, 0, 0] });
		sg.chain.pop();
		slotPut(i, c, t.p);
		if (sg.pos >= i) {
			sg.pos++;
		}
		sg.jump = -1;
		songSelect(i, false);
		toast(
			t.cp
				? "INSERTED SLOT " + (i + 1) + "  PATTERN " + pad(t.p + 1) + " IS A COPY"
				: "INSERTED SLOT " + (i + 1),
		);
	}

	function slotDelete(i) {
		const sg = S.song,
			n = songChain().length;
		if (i >= n) {
			toast("EMPTY SLOT");
			return;
		}
		undoPush("DELETE SLOT");
		aShift(i + 1, -1, i);
		sg.chain.splice(i, 1);
		sg.chain.push({ pat: -1, rep: 1, mute: 0, dmute: 0, col: [0, 0, 0, 0] });
		if (sg.pos > i) {
			sg.pos--;
		}
		sg.jump = -1;
		if (sg.pos >= n - 1) {
			sg.pos = 0;
		}
		songSelect(clamp(i, 0, Math.max(0, n - 2)), false);
		toast("DELETED SLOT " + (i + 1));
	}

	function patGrab(pi, trk) {
		trk = trk >= 0 ? trk : -1;
		return {
			from: pi,
			trk,
			len: S.plen[pi],
			tl: S.tl[pi].slice(),
			q: S.pats[pi].map((q, t) =>
				trk >= 0 && t !== trk
					? null
					: {
							sel: q.sel,
							st: q.st.slice(),
							gate: q.gate.slice(),
							vel: q.vel.slice(),
							dg: q.dg ? q.dg.slice() : null,
						},
			),
		};
	}

	function patPut(pi, c) {
		const old = pi === S.pat ? nst() : 0;
		const one = c.trk >= 0;
		if (!one || patEmpty(pi)) {
			S.plen[pi] = c.len;
		}
		c.tl.forEach((v, t) => {
			if (!one || t === c.trk) {
				S.tl[pi][t] = v;
			}
		}); /* a single-track copy leaves the other tracks and the pattern's length alone (unless the pattern is still empty) */
		c.q.forEach((s, t) => {
			if (!s) {
				return;
			}
			const o = S.pats[pi][t];
			o.sel = s.sel;
			for (let j = 0; j < SMAX; j++) {
				o.st[j] = s.st[j];
				o.gate[j] = s.gate[j];
				o.vel[j] = s.vel[j];
			}
			if (o.dg && s.dg) {
				o.dg.set(s.dg);
			}
		});
		if (pi === S.pat) {
			realign(old);
		}
	}
	const patEmpty = (pi) =>
		S.pats[pi].every((q) => q.st.every((n) => n < 0) && (!q.dg || !q.dg.some((v) => v)));

	// DUPE (pattern mode): the copied pattern goes into the first unused empty pattern and a new slot after the selected one plays it, ready to be varied
	function patDupe(i) {
		const sg = S.song,
			ch = songChain(),
			e = sg.chain[i];
		if (!NCLIP.pat) {
			toast("NOTHING COPIED");
			return;
		}
		if (ch.length >= 16) {
			toast("CHAIN FULL (16)");
			return;
		}
		if (!e || e.pat < 0) {
			toast("EMPTY SLOT");
			return;
		}
		const fp = patCopyTarget(-1);
		if (fp < 0) {
			toast("NO FREE PATTERN");
			return;
		}
		undoPush("DUPLICATE PATTERN");
		patPut(fp, NCLIP.pat);
		aShift(i + 1, 1, -2);
		sg.chain.splice(i + 1, 0, {
			pat: fp,
			rep: e.rep,
			mute: SGM(e),
			dmute: SGDM(e),
			col: [0, 1, 2, 3].map((t) => ncol(e, t)),
		});
		sg.chain.pop();
		if (sg.pos > i) {
			sg.pos++;
		}
		sg.jump = -1;
		songSelect(i + 1, false);
		toast("PATTERN " + pad(fp + 1) + " IS A COPY");
	}

	// ---- opening, leaving and playing the dropdown ----
	// A slot is dropped down while NEST.i is its index and the song screen shows (leaving the screen collapses it: the frame hook). Its knobs and white keys apply while it is also the selected slot (`nestFocus`).
	const nestOn = () => {
			const e = S.song.chain[NEST.i];
			return S.screen === "song" && NEST.i >= 0 && !!e && e.pat >= 0;
		},
		nestFocus = () => nestOn() && S.song.sel === NEST.i;

	function nestOpen(i) {
		const sg = S.song,
			e = sg.chain[i];
		if (!e || e.pat < 0) {
			return;
		}
		closeNestMenu();
		if (NEST.i !== i) {
			NEST.sel = null;
		}
		sg.sel = i;
		NEST.i = i;
		S.seqEn = true;
		if (!(S.playing && AC)) {
			S.pat = e.pat;
			S.patNext = -1;
		} else if (!(sg.on && sg.go) && S.pat !== e.pat) {
			S.patNext = e.pat;
		} // playing: this pass finishes, then the slot's pattern loops
		audioSync();
	}

	function nestLeave() {
		const sg = S.song;
		if (NEST.pv) {
			NEST.pv = 0;
			const e = sg.chain[NEST.i];
			if (sg.on && S.playing && AC && e && e.pat >= 0 && e.pat === S.pat) {
				sg.pos = NEST.i;
				sg.rc = 0;
				sg.go = 1;
				sg.base = songBaseOf(NEST.i);
			}
		}
		closeNestMenu();

	} // collapsing: the song carries on from this slot
	function nestCollapse() {
		if (NEST.i < 0) {
			return;
		}
		nestLeave();
		NEST.i = -1;
		NEST.sel = null;
		NEST.dr = 0;
	}
	const nestBack = nestCollapse;

	function nestToggle(i) {
		if (nestOn() && NEST.i === i) {
			S.song.sel = i;
			nestCollapse();
		} else {
			nestOpen(i);
		}
	}

	function nestToSeq(t) {
		const i = NEST.i;
		nestCollapse();
		S.song.sel = i;
		songGoTrack(t);
	}

	// while a slot is dropped down and its pattern plays on its own, the slot's mutes apply (a walking song uses the playing slot's, as before)
	const nestMask = () => {
		if (!nestOn() || !S.playing) {
			return 0;
		}
		const e = S.song.chain[NEST.i];
		return e && e.pat >= 0 && e.pat === S.pat ? SGM(e) : 0;
	};
	const nestPadMask = () => {
		if (!nestOn() || !S.playing) {
			return 0;
		}
		const e = S.song.chain[NEST.i];
		return e && e.pat >= 0 && e.pat === S.pat ? SGDM(e) : 0;
	};

	function nestStart() {
		NEST.pv = 0;
		if (nestOn() && !NEST.nob) {
			const e = S.song.chain[NEST.i];
			if (e && e.pat >= 0) {
				S.song.go = 0;
				S.song.jump = -1;
				S.pat = e.pat;
				S.patNext = -1;
				NEST.pv = S.song.on ? 1 : 0;
			}
		}

	} // PLAY here loops just this pattern, song mode on or off (startSeq calls it before it schedules the first step)
	{
		const _sa = songAdvance;
		songAdvance = function (ps) {
			if (NEST.pv) {
				if (nestOn()) {
					S.patNext = -1;
					return;
				}
				nestLeave();
			}
			return _sa(ps);
		};
		const _bs = bounceStart;
		bounceStart = function (k) {
			NEST.nob = 1;
			try {
				return _bs(k);
			} finally {
				NEST.nob = 0;
			}
		};
	}

	// ---- lanes: which belong to a track, what a track can automate, adding, re-scoping ----
	function aTrackOf(a, id) {
		const m =
			/^tk\.(\d)\./.exec(a.path || "") ||
			/^tracks\.(\d)$/.exec(a.path || "") ||
			/^bend(\d)/.exec(aBase(id));
		return m ? +m[1] : -1;
	}

	function nestLanes(t) {
		const o = [];
		for (const id in S.auto) {
			const a = S.auto[id];
			if (!a || !a.v) {
				continue;
			}
			const s = aSlotOf(a);
			if (s >= 0 && s !== NEST.i) {
				continue;
			}
			if (aTrackOf(a, id) === t) {
				o.push(id);
			}
		}
		return o;
	}

	function nestParams(t) {
		const k = "tk." + t + ".",
			o = [],
			A = (g, n, path, key, lo, hi) => o.push({ g, n, path, key, lo, hi }),
			en = engOf(t);
		A("FILTER AND EFFECTS", "CUTOFF", k + "fx", "cut", 0, 127);
		A("FILTER AND EFFECTS", "RESONANCE", k + "fx", "res", 0, 99);
		A("FILTER AND EFFECTS", "REVERB SEND", k + "fx", "rmix", 0, 100);
		A("FILTER AND EFFECTS", "ECHO SEND", k + "fx", "emix", 0, 100);
		A("FILTER AND EFFECTS", "DISTORTION", k + "fx", "dmix", 0, 100);
		A("FILTER AND EFFECTS", "CHORUS", k + "fx", "cmix", 0, 100);
		A("FILTER AND EFFECTS", "PHASER", k + "fx", "pmix", 0, 100);
		A("FILTER AND EFFECTS", "TAPE DRIVE", k + "fx", "drv", 0, 99);
		A("LEVEL AND PITCH", "VOLUME", "tracks." + t, "vol", 0, 100);
		o.push({ g: "LEVEL AND PITCH", n: "PITCH BEND", bend: 1, path: "", key: "", lo: 0, hi: 1 });
		A("MACROS AND LFO", "MOOD", k + "mac", 0, 0, 127);
		A("MACROS AND LFO", "WARMTH", k + "mac", 1, 0, 127);
		A("MACROS AND LFO", "SPACE", k + "mac", 2, 0, 127);
		A("MACROS AND LFO", "DRIFT", k + "mac", 3, 0, 127);
		A("MACROS AND LFO", "VIBRATO", k + "lfo", "pm", 0, 99);
		A("MACROS AND LFO", "TREMOLO", k + "lfo", "am", 0, 99);
		if (en === "ANA") {
			A("ANALOG", "ANALOG CUTOFF", k + "ana", "cut", 0, 127);
			A("ANALOG", "ANALOG RESO", k + "ana", "res", 0, 99);
			A("ANALOG", "ANALOG DETUNE", k + "ana", "det", 0, 99);
		}
		if (en === "WAVE") {
			A("WAVETABLE", "WT POSITION", k + "wt", "pos", 0, 127);
			A("WAVETABLE", "WT WARP", k + "wt", "warp", 0, 99);
			A("WAVETABLE", "WT DRIVE", k + "wt", "drv", 0, 99);
			A("WAVETABLE", "WT TONE", k + "wt", "tone", 0, 99);
		}
		if (en === "SMP") {
			A("SAMPLER", "SAMPLER PITCH", k + "smp", "pitch", -12, 12);
		}
		if (en === "DRUM") {
			PADS.forEach((n, i) => {
				A("DRUMS", n + " TUNE", k + "drum.tune", i, 0, 99);
				A("DRUMS", n + " DECAY", k + "drum.dec", i, 0, 99);
			});
		}
		return o;
	}

	function nestAddLane(t, p) {
		const slot = NEST.i,
			base = p.bend ? "bend" + t : p.path + "|" + p.key,
			id = aIdOf(base, slot);
		if (S.auto[id]) {
			NEST.sel = id;
			toast("ALREADY AUTOMATED HERE");
			return;
		}
		if (aFull()) {
			toast("AUTOMATION LIMIT " + NLANES);
			return;
		}
		const o = p.bend ? null : aObj(p.path),
			cur = p.bend ? (A.bnd[t] + 1) / 2 : o ? (o[p.key] - p.lo) / (p.hi - p.lo) : 0;
		undoPush("ADD AUTOMATION");
		S.auto[id] = {
			name: p.n + " T" + (t + 1),
			path: p.path,
			key: p.key,
			lo: p.lo,
			hi: p.hi,
			v: new Array(AU_N).fill(Math.round(clamp(cur, 0, 1) * 255)),
			bars: 1,
			mode: 1,
			sync: 0,
			slot,
		};
		const r = aRt(id);
		r.last = -1;
		r.on = 0;
		NEST.sel = id;
		toast("AUTOMATING " + p.n + " T" + (t + 1) + "  DRAG TO DRAW");
	}

	function aSetSlot(id, slot) {
		const a = S.auto[id];
		if (!a) {
			return;
		}
		slot = slot >= 0 ? slot : -1;
		if (aSlotOf(a) === slot) {
			return;
		}
		const nid = aIdOf(aBase(id), slot);
		if (S.auto[nid]) {
			toast("IT ALREADY HAS ONE THERE");
			return;
		}
		undoPush("AUTOMATION");
		const r = AUR[id];
		if (r && r.on) {
			r.on = 0;
			aRelease(id, a, r);
		}
		const n = {};
		for (const k in S.auto) {
			if (k === id) {
				a.slot = slot;
				n[nid] = a;
			} else {
				n[k] = S.auto[k];
			}
		}
		S.auto = n;
		if (NEST.sel === id) {
			NEST.sel = nid;
		}
		toast(slot < 0 ? "PLAYS THE WHOLE SONG" : "PLAYS IN SLOT " + (slot + 1) + " ONLY");
	}

	function aResize(a, bars) {
		const m = a.v.length,
			n = AU_N * bars,
			v = new Array(n);
		for (let i = 0; i < n; i++) {
			const ph = ((i / AU_N) % a.bars) / a.bars;
			v[i] = a.v[Math.min(m - 1, Math.floor(ph * m))];
		}
		a.v = v;
		a.bars = bars;

	} // longer: the shape repeats; shorter: its first part
	// where a lane's playhead is (0..1) while it acts, else -1
	function aPlayPhase(a, id) {
		if (!S.playing || !AC || !A.on || !a.mode) {
			return -1;
		}
		if (a.sync === 1) {
			return aPhase(a, aRt(id), performance.now());
		}
		const ls = aSlotOf(a);
		if (ls >= 0 && ls !== autoSlot()) {
			return -1;
		}
		const L = a.bars * SPB();
		return ((ls >= 0 ? aSlotSteps() : aSongSteps()) % L) / L;
	}

	function nestColour(i, t, d) {
		const e = S.song.chain[i];
		if (!e || e.pat < 0) {
			return;
		}
		undoPush("COLOUR");
		if (!e.col) {
			e.col = [0, 0, 0, 0];
		}
		e.col[t] = wrap(ncol(e, t) + d, NCOLN);
		toast("SLOT " + (i + 1) + "  T" + (t + 1) + "  " + NCOLNM[e.col[t]]);
	}

	function nestKnobs() {
		const i = NEST.i,
			e = S.song.chain[i] || {},
			t = S.trk,
			ls = nestLanes(t),
			k = NEST.sel && ls.includes(NEST.sel) ? ls.indexOf(NEST.sel) : ls.length,
			sel = k < ls.length ? ls[k] : null,
			a = sel && S.auto[sel],
			pr = nestParams(t),
			pi = clamp(NEST.pi | 0, 0, pr.length - 1),
			c = ncol(e, t);
		return [
			{
				l: "TRACK",
				st: 4,
				si: t,
				sn: t + 1,
				v: "T" + (t + 1) + " " + ENGL[engOf(t)],
				n: t / 3,
				set: (d) => {
					S.trk = wrap(S.trk + d, 4);
					NEST.sel = null;
				},
			},
			t === DT
				? {
						l: "PADS",
						st: 9,
						si: NEST.dr ? 1 + NEST.pd : 0,
						sn: NEST.dr ? 2 + NEST.pd : 1,
						v: NEST.dr ? PADS[NEST.pd] : "HIDDEN",
						n: NEST.dr ? (1 + NEST.pd) / 8 : 0,
						set: (d) => {
							const n = clamp((NEST.dr ? 1 + NEST.pd : 0) + (d > 0 ? 1 : -1), 0, 8);
							NEST.dr = n > 0 ? 1 : 0;
							if (n > 0) {
								NEST.pd = n - 1;
							}
						},
					}
				: {
						l: "COLOUR",
						st: NCOLN,
						si: c,
						sn: c + 1,
						v: NCOLNM[c],
						n: c / (NCOLN - 1),
						set: (d) => nestColour(i, t, d > 0 ? 1 : -1),
					},
			{
				l: "AUTOMATION",
				st: ls.length + 1,
				si: k,
				sn: k + 1,
				v: a ? a.name.replace(/ T\d$/, "") : "+ NEW",
				n: ls.length ? k / ls.length : 0,
				set: (d) => {
					const j = clamp(k + d, 0, ls.length);
					NEST.sel = j < ls.length ? ls[j] : null;
				},
			},
			a
				? {
						l: "MODE",
						st: 3,
						si: a.mode,
						sn: a.mode + 1,
						v: ["OFF", "LOOP", "TAP"][a.mode],
						n: a.mode / 2,
						set: (d) => {
							undoPush("AUTOMATION");
							a.mode = clamp(a.mode + d, 0, 2);
							const r = aRt(sel);
							r.run = 0;
							r.last = -1;
						},
					}
				: {
						l: "PARAMETER",
						st: pr.length,
						si: pi,
						sn: pi + 1,
						v: pr[pi].n,
						n: pr.length > 1 ? pi / (pr.length - 1) : 0,
						set: (d) => {
							NEST.pi = clamp(pi + d, 0, pr.length - 1);
						},
					},
		];
	}

	// the device way in: white keys 1-4 mute, 5-8 colour, 9 adds the lane the PARAMETER knob shows, 10 deletes the chosen lane, 11 moves it between this slot and the whole song (no lane chosen: closes the dropdown)
	function nestKey(i) {
		const t = S.trk,
			ls = nestLanes(t),
			sel = NEST.sel && ls.includes(NEST.sel) ? NEST.sel : null;
		if (NEST.dr && t === DT && i < DGN) {
			songTogglePad(NEST.i, i);
			return;
		} // the drum track's pads are shown and T4 is the chosen track: keys 1-8 mute the pads
		if (i < 4) {
			songToggleMute(NEST.i, i);
		} else if (i < 8) {
			nestColour(NEST.i, i - 4, 1);
		} else if (i === 8) {
			if (!sel) {
				const pr = nestParams(t);
				nestAddLane(t, pr[clamp(NEST.pi | 0, 0, pr.length - 1)]);
			}
		} else if (i === 9) {
			if (sel) {
				laneDelete(sel);
			}
		} else if (i === 10) {
			if (sel) {
				aSetSlot(sel, aSlotOf(S.auto[sel]) < 0 ? NEST.i : -1);
			} else {
				nestCollapse();
			}
		} else if (i === 11) {
			songClip("copy");
		} else if (i === 12) {
			songClip("paste");
		} // 12-13: COPY and PASTE of what the mode chip says (slot, pattern, one track, a pad row, a lane)
		else if (i === 13) {
			if (NCLIP.mode === 0) {
				toast("SLOT MODE: DELETE IS ON THE CHIP");
			} else {
				songClip("del");
			}
		} // 14: CLEAR (the pad row or lane chosen, one track, the pattern)
		else if (i === 14) {
			songClip("mode");
		}

	} // 15: the mode chip
	// ---- the dropdown: what this track can automate (the same popup style as the strip's menu) ----
	const NMENU = { open: false };

	function openNestMenu(t) {
		let m = document.getElementById("nestmenu");
		if (!m) {
			m = document.createElement("div");
			m.id = "nestmenu";
			m.className = "modmenu";
			m.hidden = true;
			document.body.appendChild(m);
		}
		m.innerHTML = "";
		let g = "";
		const cap = (x) => {
			const c = document.createElement("div");
			c.className = "mt cap";
			c.textContent = x;
			m.appendChild(c);
		};
		cap("AUTOMATE  T" + (t + 1) + "  ON SLOT " + (NEST.i + 1));
		nestParams(t).forEach((p) => {
			if (p.g !== g) {
				g = p.g;
				cap(g);
			}
			const b = document.createElement("button");
			b.className = "mt";
			b.style.minHeight = "34px";
			b.textContent = p.n;
			const has = S.auto[aIdOf(p.bend ? "bend" + t : p.path + "|" + p.key, NEST.i)];
			b.setAttribute("aria-pressed", String(!!has));
			b.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				e.stopPropagation();
				closeNestMenu();
				nestAddLane(t, p);
			});
			m.appendChild(b);
		});
		const r = document.getElementById("big").getBoundingClientRect();
		m.style.top = Math.round(r.top + (r.height * 30) / 240) + "px";
		m.style.bottom = "auto";
		m.hidden = false;
		NMENU.open = true;
		setTimeout(() => document.addEventListener("pointerdown", outsideNest, true), 0);
	}

	function outsideNest(e) {
		const m = document.getElementById("nestmenu");
		if (m && m.contains(e.target)) {
			return;
		}
		closeNestMenu();
	}

	function closeNestMenu() {
		const m = document.getElementById("nestmenu");
		if (m) {
			m.hidden = true;
		}
		NMENU.open = false;
		document.removeEventListener("pointerdown", outsideNest, true);
	}

	// ---- the list: the song's 16 slot rows, and under the open slot its dropdown (header, four tracks with lanes and an add chip). Drag up and down on the LCD to scroll ----
	function nestLay() {
		const L = [];
		let y = 0; // y is relative to the dropdown's top
		L.push({ k: "hdr", y, h: NV.hd });
		y += NV.hd;
		for (let t = 0; t < 4; t++) {
			L.push({ k: "trk", t, y, h: NV.hh });
			y += NV.hh;
			if (t === DT && NEST.dr) {
				for (let p = 0; p < DGN; p++) {
					L.push({ k: "pad", t, p, y, h: NV.ph });
					y += NV.ph;
				}
			}
			nestLanes(t).forEach((id) => {
				const ex = id === NEST.sel,
					h = NV.lh + (ex ? NV.eh : 0);
				L.push({ k: "lane", t, id, y, h, ex });
				y += h;
			});
			L.push({ k: "add", t, y, h: NV.ah });
			y += NV.ah;
		}
		const o = nestLanes(-1);
		if (o.length) {
			L.push({ k: "sec", y, h: 11 });
			y += 11;
			o.forEach((id) => {
				const ex = id === NEST.sel,
					h = NV.lh + (ex ? NV.eh : 0);
				L.push({ k: "lane", t: -1, id, y, h, ex });
				y += h;
			});
		}
		L.push({ k: "end", y, h: 3 });
		y += 3;
		return { L, H: y };
	}

	function songLay() {
		const L = [],
			open = nestOn();
		let y = 0;
		for (let i = 0; i < 16; i++) {
			L.push({ k: "slot", i, y, h: SG.rh });
			y += SG.rh;
			if (open && i === NEST.i) {
				const b = nestLay();
				b.L.forEach((it) => {
					it.y += y;
					L.push(it);
				});
				y += b.H;
			}
		}
		return { L, H: y };
	}

	// the layout, with the scroll kept in range; when the selection or the open slot changes, the selected row (and a dropdown that belongs to it) is brought into the window
	function songView() {
		const { L, H } = songLay(),
			sg = S.song,
			view = SG.n * SG.rh,
			key = sg.sel + ":" + (nestOn() ? NEST.i : -1);
		if (key !== SGV.key) {
			SGV.key = key;
			const k = L.findIndex((it) => it.k === "slot" && it.i === sg.sel);
			if (k >= 0) {
				const nx = L.findIndex((it, j) => j > k && it.k === "slot"),
					top = L[k].y,
					bot = nx >= 0 ? L[nx].y : H;
				let end = L[k].y + L[k].h;
				if (nestOn() && NEST.i === sg.sel) {
					end = bot;
				}
				if (end > SGV.sc + view) {
					SGV.sc = end - view;
				}
				if (top < SGV.sc) {
					SGV.sc = top;
				}
			}
		}
		SGV.sc = clamp(SGV.sc, 0, Math.max(0, H - view));
		return { L, H, view };
	}
	const fitTxt = (s, w) => {
		s = String(s);
		while (s.length > 1 && TW(s) > w) {
			s = s.slice(0, -1);
		}
		return s;
	};

	function nestDraw(it, y, live) {
		const sg = S.song,
			e = sg.chain[NEST.i],
			mk = SGM(e),
			pi = e.pat,
			playing = live && S.playing && AC && S.pat === pi,
			x0 = NV.x;
		if (it.k === "end") {
			R(4, y + 1, 232, 1, P.faint);
			return;
		}
		R(7, y, 2, it.h, P.acc);
		if (it.k === "hdr") {
			T(
				playing
					? NEST.pv || !sg.on || !sg.go
						? "LOOPING PAT " + pad(pi + 1)
						: "PLAYING"
					: "PLAY LOOPS PAT " + pad(pi + 1),
				x0,
				y + 4,
				P.dim,
			);
			if (S.playing) {
				R(186, y + 1, 44, 12, P.sel);
				T("STOP", 208, y + 4, P.selfg, 1, "c");
			} else {
				B(186, y + 1, 44, 12, P.dim);
				T("PLAY", 208, y + 4, P.fg, 1, "c");
			}
		} else if (it.k === "trk") {
			const t = it.t,
				sel = t === S.trk,
				col = ncol(e, t),
				cc = col ? P.tag[col] : P.fg,
				mu = (mk >> t) & 1,
				q = S.pats[pi][t],
				n = nstP(pi, t);
			if (sel) {
				R(9, y + 3, 1, 16, P.acc);
			}
			if (mu) {
				B(x0, y + 4, 24, 14, P.hint);
				T("T" + (t + 1), x0 + 12, y + 8, P.hint, 1, "c");
				R(x0 + 3, y + 11, 18, 1, P.hint);
			} else {
				R(x0, y + 4, 24, 14, cc);
				T("T" + (t + 1), x0 + 12, y + 8, P.selfg, 1, "c");
			}
			T(fitTxt(PRESETS[S.tracks[t].pre][0], 58), 39, y + 3, mu ? P.dim : cc);

	// what is under a touch in the dropdown (it: its layout item, dy: how far down the item the touch is, y0: the item's top on the LCD)
	function nestZone(it, x, dy, y0) {
		const tr = it.t,
			Z = (o) => Object.assign({ t: "nest", tap: true }, o),
			bg = { t: "nest", k: "bg" };
		if (it.k === "hdr") {
			return x >= 184 && x < 236 ? Z({ k: "play" }) : bg;
		}
		if (it.k === "pad") {
			return x >= 19 && x < 61 && dy >= 0 && dy < it.h - 1
				? Z({ k: "pmute", tr: it.t, pd: it.p })
				: x >= 61 && x < 236
					? Z({ k: "psel", tr: it.t, pd: it.p })
					: bg;
		} // the chip mutes the pad (and chooses it); the rest of the row only chooses it
		if (it.k === "trk") {
			if (it.t === DT && x >= 226 && dy >= 2 && dy < 20) {
				return Z({ k: "dchev", tr });
			}
			if (x < 37 && dy >= 2 && dy < 20) {
				return Z({ k: "mute", tr });
			}
			if (x >= 194 && x < 226 && dy >= 2 && dy < 20) {
				return Z({ k: "col", tr });
			}
			if (x >= 37 && x < 100) {
				return Z({ k: "name", tr });
			}
			return Z({ k: "sel", tr });
		}
		if (it.k === "add") {
			return x < 132 ? Z({ k: "add", tr }) : bg;
		}
		if (it.k === "lane") {
			if (it.ex && dy >= 14) {
				return { t: "nest", k: "draw", lid: it.id, by: y0 + 14, bh: 32 };
			}
			const k =
				x < 137 ? "lsel" : x < 163 ? "lscope" : x < 193 ? "lmode" : x < 215 ? "llen" : "ldel";
			return Z({ k, lid: it.id, tr });
		}
		return bg;
	}

	function nestTap(z) {
		const k = z.k;
		if (z.tr != null && z.tr >= 0 && S.trk !== z.tr) {
			S.trk = z.tr;
		}
		if (k === "play") {
			press("play");
		} else if (k === "mute") {
			songToggleMute(NEST.i, z.tr);
		} else if (k === "pmute") {
			NEST.pd = z.pd;
			songTogglePad(NEST.i, z.pd);
		} else if (k === "psel") {
			NEST.pd = z.pd;
			toast("PAD: " + PADS[z.pd]);
		} else if (k === "dchev") {
			nestPads();
		} else if (k === "name") {
			nestToSeq(z.tr);
		} else if (k === "col") {
			nestColour(NEST.i, z.tr, 1);
		} else if (k === "add") {
			openNestMenu(z.tr);
		} else {
			const a = S.auto[z.lid];
			if (k === "lsel") {
				if (a) {
					NEST.sel = NEST.sel === z.lid ? null : z.lid;
				}
			} else if (!a) {
				return;
			} else if (k === "lmode") {
				undoPush("AUTOMATION");
				a.mode = (a.mode + 1) % 3;
				const r = aRt(z.lid);
				r.run = 0;
				r.t0 = performance.now();
				r.last = -1;
			} else if (k === "lscope") {
				aSetSlot(z.lid, aSlotOf(a) < 0 ? NEST.i : -1);
			} else if (k === "llen") {
				undoPush("AUTOMATION");
				aResize(a, AU_BARS[(AU_BARS.indexOf(a.bars) + 1) % AU_BARS.length]);
				aRt(z.lid).last = -1;
			} else if (k === "ldel") {
				undoPush("DELETE AUTOMATION");
				const r = AUR[z.lid];
				if (r && r.on) {
					r.on = 0;
					aRelease(z.lid, a, r);
				}
				delete S.auto[z.lid];
				if (NEST.sel === z.lid) {
					NEST.sel = null;
				}
			}
		}

	// the chevron on the drum track's row: show or hide its 8 pads (the list scrolls so the pads are in view)
	function nestPads() {
		NEST.dr ^= 1;
		if (NEST.dr) {
			const { L, view } = songView(),
				it = L.find((q) => q.k === "trk" && q.t === DT);
			if (it && it.y + it.h + DGN * NV.ph > SGV.sc + view) {
				SGV.sc = Math.max(0, it.y - 4);
			}
		}
	}

	function nestDown(z, x, y) {
		z.y0 = y;
		z.sc0 = SGV.sc;
		if (z.k === "draw") {
			undoPush("DRAW AUTOMATION");
			nestPaint(z, x, y);
		}
	}

	function nestMove(z, x, y) {
		if (z.k === "draw") {
			nestPaint(z, x, y);
			return;
		}
		if (!z.moved && Math.abs(y - z.y0) < 4) {
			return;
		}
		z.moved = true;
		SGV.sc = Math.max(0, z.sc0 - (y - z.y0));
	}

	// a vertical drag that starts on a slot row scrolls the list too (a sideways one still steps the cell under the finger)
	function songDrag(z, x, y) {
		if (z.k === "prev") {
			const g = z.g || PV;
			if (!z.sc) {
				const dx = Math.abs(x - z.x),
					dy = Math.abs(y - z.y0);
				if (dy >= 5 && dy > dx) {
					z.moved = true;
					return false;
				}
				if (z.moved || dx < 5 || dx <= dy) {
					return false;
				}
				if (S.playing && AC) {
					z.moved = true;
					return false;
				}
				z.sc = 1;
				z.moved = true;
				z.sc0 = g.sc;
				z.x1 = x;
			}
			g.sc = pvClamp(z.sc0 - (x - z.x1), g);
			return true;
		}
		if (!z.sc) {
			if (z.moved || Math.abs(y - z.y0) < 5 || Math.abs(y - z.y0) <= Math.abs(x - z.x)) {
				return false;
			}
			z.sc = 1;
			z.moved = true;
			z.sc0 = SGV.sc;
			z.y0 = y;
		}
		SGV.sc = Math.max(0, z.sc0 - (y - z.y0));
		return true;
	}

	function nestPaint(z, x, y) {
		const a = S.auto[z.lid];
		if (!a) {
			return;
		}
		const N = a.v.length,
			i = clamp(Math.round(((x - NV.x) / 216) * (N - 1)), 0, N - 1),
			v = clamp(Math.round((1 - (y - z.by - 1) / (z.bh - 2)) * 255), 0, 255);
		z.moved = true;
		const p = z.pi == null ? i : z.pi,
			pv = z.pv == null ? v : z.pv,
			s = i >= p ? 1 : -1,
			n = Math.abs(i - p);
		for (let k = 0; k <= n; k++) {
			a.v[p + s * k] = Math.round(pv + (v - pv) * (n ? k / n : 1));
		}
		z.pi = i;
		z.pv = v;
		aRt(z.lid).last = -1;
	}

	function stopSeq() {
		if (!AC) {
			return;
		}
		recCloseAll();
		A.seqV.forEach(
			(v) => v && v.cut && v.cut(),
		); /* STOP: notes that have not started never sound, notes that sound are let go now (they used to ring out their whole gate, and the ones in the look-ahead still started) */
		A.seqV = [];
		A.sq = [];
		A.sl = [];
		A.sqMask = 0;
		A.sqDm = 0;
		S.padHits = [];
		S.song.jump = -1;
		S.song.go = 0;
	}

	// STOP: stops the sequencer and leaves everything else (never starts it). Double-tap STOP is KILL.
	function stopOnly() {
		const rec0 = S.rec && S.playing;
		S.countdown = null;
		if (S.playing) {
			S.playing = false;
			stopSeq();
		}
		if (rec0) {
			finishRec();
		}
		if (AC) {
			audioSync();
		}
	}

	// KILL: silence everything now. The sequencer stops and its queued notes never sound; every key, hold, latch, queue, arp and Drift note on every track is let go and every voice of
	// every engine fades out in a few milliseconds (never a hard cut); the shared reverb and echo are ducked, flushed and brought back, so no tail is left. The output guard (limiter, soft clip) is untouched.
	function killAll() {
		const rec0 = S.rec && S.playing;
		S.playing = false;
		S.countdown = null;
		stopSeq();
		if (rec0) {
			finishRec();
		}
		S.rec = false;
		S.recExt = false;
		S.gen.on = false;
		A.arps.forEach((x) => x.clear());
		A.arpKeys = {};
		if (A.arpSet) {
			A.arpSet.clear();
		}
		for (let t = 0; t < 4; t++) {
			HOLD[t] = 0;
			releaseLatch(t, true, true);
			qClear(t);
		}
		latchMark.clear();
		Object.keys(heldK).forEach((id) => keyOff(id[0], +id.slice(1)));
		A.down = 0;
		if (AC) {
			const now = AC.currentTime;
			for (let t = 0; t < 4; t++) {
				fmSend(t, { t: 0, k: "kill" });
			}
			A.vox.forEach((L) =>
				L.forEach((v) => {
					if (v && !v.dead && !v.stolen) {
						if (v.cut) {
							v.cut();
						} else if (v.off && !v.done) {
							v.off(now);
						}
					}
				}),
			);
			(A.sv || []).forEach((V) =>
				V.forEach((v) => {
					if (v && !v.done && v.off) {
						v.off(now);
					}
				}),
			);
			A.smpLast.forEach((v) => v && !v.done && v.off && v.off(now));
			(A.dv || []).forEach((D) =>
				D.forEach((o) => {
					if (o && o.g) {
						try {
							o.g.gain.cancelScheduledValues(now);
							o.g.gain.setTargetAtTime(0, now, 0.004);
						} catch (e) {}
					}
				}),
			);
			fxFlush();
			audioSync();
		}
		toast("KILLED");
	}

	function fxFlush() {
		if (!AC || !A.eW) {
			return;
		}
		const t = AC.currentTime;
		A.killT =
			performance.now() +
			450; /* audioSync leaves the returns alone until the new echo and reverb are in */
		[A.eW, A.rW, A.eFb].forEach((n) => {
			n.gain.cancelScheduledValues(t);
			n.gain.setTargetAtTime(0, t, 0.006);
			n.gain._v = undefined;
		}); /* (audioSync's P() only writes a value that changed: forget the cached one so it sets them again) */
		clearTimeout(A.flushT);
		A.flushT = setTimeout(() => {
			if (!AC) {
				return;
			}
			[A.eIn, A.eD, A.eLP, A.eHP, A.eSat, A.eFb].forEach((x) => {
				try {
					x.disconnect();
				} catch (e) {}
			});
			echoMake();

			A.eFb.gain.value = 0; /* a new gain node starts at 1: keep the feedback closed until audioSync opens it */
			try {
				A.reverbIn.disconnect();
				A.conv.disconnect();
			} catch (e) {}
			convMake();
			A.killT = 0;
			audioSync();
		}, 90);
	}

	function rebase(oss, obpm) {
		if (!AC) {
			return;
		}
		if (S.playing) {
			const nss = stepSec(),
				pos = (AC.currentTime - A.t0) / oss;
			A.t0 = AC.currentTime - pos * nss;
			S.t0 = performance.now() - pos * nss * 1000;
		}
		if (S.gen.on && obpm !== S.bpm) {
			S.gen.t0 = performance.now();
			A.gA = AC.currentTime;
			A.gk = 0;
		}
	}

	function arpPattern(notes, t) {
		const ar = TK(t),
			m = ar.arp.mode,
			set = A.arps[t == null ? S.trk : t],
			base = m === 5 && set.size ? [...set] : notes,
			seq = [];
		for (let o = 0; o < ar.arp.oct; o++) {
			base.forEach((n) => seq.push(n + 12 * o));
		}
		if (m === 1) {
			return seq.slice().reverse();
		}
		if (m === 2) {
			return seq.concat(seq.slice().reverse());
		}
		if (m === 3) {
			return seq.length > 2 ? seq.concat(seq.slice(1, -1).reverse()) : seq;
		}
		if (m === 4) {
			return [seq[Math.floor(Math.random() * seq.length)]];
		}
		if (m === 6) {
			return seq.flatMap((n) => [n, n]);
		}
		return seq;
	}

	function genAt(st) {
		const g = S.gen,
			sc = SCALES[S.scale.type][1],
			rows = Math.max(7, sc.length * g.rng);
		if (hsh(st * 1.37) > (g.den / 100) * 1.5) {
			return null;
		}
		const walk = 0.5 + 0.35 * Math.sin(st * 0.37) + (hsh(st * 3.9) - 0.5) * 0.5,
			rr = clamp(Math.round(walk * (rows - 1)), 0, rows - 1);
		return {
			rr,
			rows,
			wd: 6 + Math.round(hsh(st * 7.7) * 18),
			hm: Math.round(((hsh(st * 2.1) - 0.5) * g.hum) / 25),
			vel: 0.4 + 0.3 * hsh(st * 5.5),
			midi: 48 + S.scale.root + sc[rr % sc.length] + 12 * Math.floor(rr / sc.length),
		};
	}

	/* a drag can deliver 60-120 steps a second; the audio parameters only need the latest state, so turn() and the mod strip mark them dirty and tick() runs audioSync once per 25 ms */
	function syncSoon() {
		A.syncDirty = 1;
	}
	const arpOn = [0, 0, 0, 0];

	/* The scheduler looks LA seconds ahead (140 ms) and runs every 25 ms. If the page stalls for longer than that (a slow phone, a busy tab) the notes that were due run out and come late or are dropped, so a tick that
   arrives more than 110 ms after the last one widens the look-ahead (stall + 60 ms, at most 320 ms) and it relaxes back by 80 ms a second once the page has been calm for 8 s. While the page is calm it is exactly 140 ms, so latency and mute / jump timing are as before. */
	const LA0 = 0.14,
		LA_MAX = 0.32;

	function laStep() {
		const np = performance.now();
		if (A.tkP && np - A.tkP < 5000) {
			const g = np - A.tkP;
			if (g > 110) {
				A.la = Math.min(LA_MAX, Math.max(A.la, g / 1000 + 0.06));
				A.laCalm = np;
				A.laN = (A.laN || 0) + 1;
				A.laMax = Math.max(A.laMax || 0, g);
			} else if (np - A.laCalm > 8000 && A.la > LA0) {
				A.la = Math.max(LA0, A.la - 0.002);
			}
		} /* (a gap of 5 s or more is a hidden page, not a stall) */
		A.tkP = np;
		return A.la;
	}

	function tick() {
		if (!AC) {
			return;
		}
		const ct = AC.currentTime,
			LA = laStep();
		if (A.syncDirty) {
			A.syncDirty = 0;
			audioSync();
		}
		if (S.playing) {
			songMaskSync();
		}
		if (S.countdown) {
			const c = S.countdown;
			while (c.next < c.n && c.t0 + c.next * c.beat < ct + LA) {
				clickAt(c.t0 + c.next * c.beat, c.next === 0);
				c.next++;
			}
			if (ct >= c.t0 + c.n * c.beat) {
				S.countdown = null;
			}
		}
		if (S.playing) {
			const ss = stepSec(),
				sw = ((S.swing - 50) / 50) * ss;
			let n = 0;
			while (
				A.t0 + A.sn * ss < ct + LA &&
				!(BNC.on && BNC.info && A.t0 + A.sn * ss >= BNC.info.tEnd - 0.0005) &&
				n++ < 8
			) {
				/* a bounce ends at tEnd: the look-ahead used to schedule the first step of the NEXT pass (a stray downbeat at the very end of the file) before the 80 ms poll stopped it */ if (
					S.recExt &&
					A.sn > 0 &&
					A.sn % nst() === 0
				) {
					extendOne();
				}
				let NS = nst();
				if (
					S.song.on &&
					S.song.jump >= 0 &&
					!S.recExt &&
					A.sn > 0 &&
					A.sn % (S.plen[S.pat] === 1 ? BSTEPS() : SPB()) === 0
				) {
					songJumpNow(ss);
					NS = nst();
				}
				if (S.song.on && !S.recExt && A.sn > 0 && A.sn % NS === 0) {
					songAdvance(NS);
				}
				if (A.sn % NS === 0 && S.rec && A.sn > 0 && !S.recExt) {
					undoPush("RECORDING");
				}
				if (A.sn % NS === 0 && S.patNext >= 0 && !S.recExt) {
					S.pat = S.patNext;
					S.patNext = -1;
					{
						const sh = A.sn * ss;
						A.t0 += sh;
						A.sn = 0;
						S.t0 += sh * 1000;
					}
				} /* the new pattern starts from its first step (and may have a different length) */
				const when = A.t0 + A.sn * ss + (A.sn % 2 ? sw : 0),
					i0 = A.sn % NS;
				A.recW.forEach((w, t) => {
					if (A.sn % nstT(t) === 0) {
						w.clear();
					}
				});
				if (S.glob.metro && A.sn % BSTEPS() === 0) {
					clickAt(A.t0 + A.sn * ss, i0 % SPB() === 0);
				}
				const it = A.sn % nstT(S.trk),
					rep =
						S.rec &&
						S.glob.rmode === 1 &&
						!S.recExt &&
						!A.recW[S.trk].has(
							it,
						); /* REPLACE: what the playhead passes on the recording track is wiped, unless it was just played in this pass */
				if (rep) {
					S.seqs[S.trk].st[it] = -1;
				}
				if (when >= ct - 0.1) {
					const sm = songMask();
					A.sqMask = sm;
					const dm = songPadMask();
					A.sqDm = dm;
					A.sl.push({ sn: A.sn, when, pos: S.song.pos, pat: S.pat, sm, dm });
					if (A.sl.length > 24) {
						A.sl.shift();
					}
					for (let t = 0; t < 4; t++) {
						if (!((sm >> t) & 1) && !(S.rec && TK(t).arp.on && A.arps[t].size)) {
							A.sqOn = t;
							A.dmCur = t === DT ? dm : 0;
							stepPlay(t, A.sn, when);
							A.sqOn = -1;
							A.dmCur = 0;
						}
					}
				} /* sm: the tracks this song slot mutes. A step the scheduler reached more than 100 ms late (the page was stalled) is skipped, not played in a burst with the next ones */
				A.sn++;
			}
		}
		qTick(ct);
		midiClockTick(ct);
		for (let t = 0; t < 4; t++) {
			const arp = TK(t).arp,
				notes = [...A.arps[t]].sort((a, b) => a - b); // each track has its own arp notes (held or latched on that track)
			if (arp.on && notes.length) {
				const sb = [1, 1.5, 2, 3, 4, 6, 8, 12][arp.rate],
					sd = 60 / S.bpm / sb,
					lk =
						S.playing &&
						A.t0 >
							0; /* while the sequencer plays the arp sits on its grid (a multiple of its step from the pattern start), so it can't flam against the pattern, and a tempo change can't drift it */
				if (A.arpNext[t] < ct - 0.2 || !arpOn[t]) {
					arpOn[t] = 1;
					let st = ct + 0.02;
					if (lk) {
						const nx = A.t0 + Math.ceil((ct + 0.01 - A.t0) / sd - 1e-6) * sd;
						if (nx - ct <= 0.18) {
							st = nx;
						}
					}
					A.arpNext[t] = st;
				}
				let n = 0;
				while (A.arpNext[t] < ct + LA && n++ < 6) {
					const pat = arpPattern(notes, t),
						sw = A.ais[t] % 2 ? ((arp.sw - 50) / 50) * sd : 0,
						nn = pat[A.ais[t] % pat.length],
						when = A.arpNext[t] + sw;
					noteVoice(t, nn, 0.75, when, (sd * arp.gate) / 100);
					recArp(t, nn, when, sd);
					A.ais[t]++;
					if (lk) {
						const T = A.arpNext[t];
						let nx = A.t0 + (Math.floor((T - A.t0) / sd + 1e-6) + 1) * sd;
						if (nx - T < 0.5 * sd) {
							nx += sd;
						}
						A.arpNext[t] = nx;
					} else {
						A.arpNext[t] += sd;
					}
				}
			} else {
				A.arpNext[t] = ct;
				A.ais[t] = 0;
				arpOn[t] = 0;
			}
		}
		const g = S.gen;
		if (g.on) {
			const sec = 30 / S.bpm;
			let n = 0;
			while (A.gA + (A.gk + 0.25) * sec < ct + LA && n++ < 4) {
				const e = genAt(A.gk + 12);
				if (e) {
					noteVoice(
						S.trk,
						e.midi,
						e.vel,
						A.gA + (A.gk + 0.25) * sec + Math.max(0, (e.hm / 12) * sec),
						(e.wd / 12) * sec * 1.6,
					);
				}
				A.gk++;
			}
		}
		A.tk = (A.tk || 0) + 1;
		if (A.tk % 2 === 0) {
			A.an.getFloatTimeDomainData(A.buf);
			let s = 0;
			for (let i = 0; i < A.buf.length; i++) {
				s += A.buf[i] * A.buf[i];
			}
			A.rms = Math.sqrt(s / A.buf.length);
			if (!(A.rms < 4)) {
				guardWatch();
			}
			for (let i = 0; i < 4; i++) {
				A.trAn[i].getFloatTimeDomainData(A.trBuf);
				let q = 0;
				for (let j = 0; j < A.trBuf.length; j++) {
					q += A.trBuf[j] * A.trBuf[j];
				}
				A.trRms[i] = Math.sqrt(q / A.trBuf.length);
			}
			A.bedAn.getFloatTimeDomainData(A.trBuf);
			let q = 0;
			for (let j = 0; j < A.trBuf.length; j++) {
				q += A.trBuf[j] * A.trBuf[j];
			}
			A.bedRms = Math.sqrt(q / A.trBuf.length);
		}
		if (A.tk % 40 === 0) {
			saveDev();
			A.seqV = A.seqV.filter(
				(v) =>
					v && !v.dead && !v.cutd && !v.stolen && (v.until ? v.until > AC.currentTime : !v.done),
			);
			A.vox = A.vox.map((L) => L.filter((v) => v && !v.dead));
			audioSync();
			sleepCheck();
		}
	}

	// resample the master output into the sampler (one bar, at most SMP_MAX seconds)
	/* Capture: a ScriptProcessor tap on the master (the only way to read the output on every browser, iOS included) that does nothing but copy each 4096-sample block; the sinc decimation to 22,050 Hz then runs in 3 ms tasks, so neither the audio callback nor the page stalls. A tap that never completes (the page was hidden, the context suspended) is dropped after the bar's length plus 2 s instead of blocking the next resample, and any NaN is cleared. */
	function startResample() {
		if (!AC || A.rec) {
			return;
		}
		const dur = Math.min(SMP_MAX, (60 / S.bpm) * 4),
			fs = AC.sampleRate,
			n = Math.floor(fs * dur),
			chunks = [];
		let got = 0;
		const sp = AC.createScriptProcessor(4096, 1, 1),
			z = AC.createGain();
		z.gain.value = 0;
		A.warm.connect(sp);
		sp.connect(z);
		z.connect(AC.destination);
		const rec = (A.rec = { sp, z });
		S.resampling = true;
		const end = () => {
			sp.onaudioprocess = null;
			try {
				A.warm.disconnect(sp);
			} catch (x) {}
			try {
				sp.disconnect();
				z.disconnect();
			} catch (x) {}
			clearTimeout(rec.to);
			if (A.rec === rec) {
				A.rec = null;
			}
			S.resampling = false;
		};
		rec.to = setTimeout(
			() => {
				if (A.rec === rec) {
					end();
					S.toast = { s: "SAMPLE FAILED", t: performance.now() };
				}
			},
			(dur + 2) * 1000,
		);
		sp.onaudioprocess = (e) => {
			chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
			got += 4096;
			if (got >= n) {
				end();
				const d = new Float32Array(n);
				let o = 0;
				for (const c of chunks) {
					d.set(c.subarray(0, Math.min(c.length, n - o)), o);
					o += c.length;
					if (o >= n) {
						break;
					}
				}
				for (let i = 0; i < n; i++) {
					if (!isFinite(d[i])) {
						d[i] = 0;
					}
				}
				smpResample(d, fs, SMP_RATE, (ds) => {
					setSample(ds, SMP_RATE);
					S.toast = { s: "SAMPLED " + dur.toFixed(1) + " S", t: performance.now() };
				});
			}
		};
	}

	// ---------- keys ----------
	const heldK = {};

	function chordNotes(m) {
		const sc = SCALES[S.scale.type][1],
			root = S.scale.root,
			c = S.scale.chord;
		if (c === 0) {
			return [m];
		}
		const rel = (((m - root) % 12) + 12) % 12,
			base = m - rel;
		let idx = 0,
			best = 99;
		sc.forEach((x, i) => {
			const dd = Math.abs(x - rel);
			if (dd < best) {
				best = dd;
				idx = i;
			}
		});
		if (sc[0] + 12 - rel < best) {
			idx = sc.length;
		} /* the root of the next octave can be the nearest note (PENTA, B -> C) */
		const n = sc.length,
			at = (k) => base + sc[(idx + k) % n] + 12 * Math.floor((idx + k) / n);
		if (c === 1) {
			return [at(0)];
		}
		const deg = c === 2 ? [0, 2, 4] : c === 3 ? [0, 2, 4, 6] : [0, 3, 4],
			sp = S.scale.spread;
		return deg.map((k, j) => at(k) + (sp >= 2 && j === 1 ? 12 : 0) + (sp >= 3 && j === 2 ? 12 : 0));
	}

	function stepDefault(i) {
		const en = engOf(S.trk);
		return en === "DRUM" ? 36 : en === "SMP" ? 36 + Math.min(i, 7) : WH[i] + 12;
	}

	function stepOn(j, on) {
		const q = S.seq;
		if (on) {
			if (q.st[j] < 0) {
				q.st[j] = newPitch(j);
			}
			if (!q.vel[j]) {
				q.vel[j] = 100;
			}
			if (!q.gate[j]) {
				q.gate[j] = 50;
			}
		} else {
			if (q.st[j] >= 0) {
				S.ghost = { j, v: q.vel[j] || 100, t: performance.now() };
			}
			q.st[j] = -1;
		}
	}

	function stepTap(i) {
		const q = S.seq;
		i = clamp(snapIdx(i), 0, nstT() - 1);
		if (q.sel === i) {
			undoPush("STEP");
			stepOn(i, q.st[i] < 0);
		}
		q.sel = i;
		if (AC && q.st[i] >= 0) {
			stepPlay(S.trk, i, AC.currentTime);
		}
	}

	function keyOn(kind, i, keep) {
		// keep: the touch keys let go of a held note a moment later, in case this press turns into a queue swipe
		ensureAudio();
		wake();
		const id = kind + i;
		latchMark.delete(id);
		if (!keep) {
			releaseLatch(S.trk);
		}
		if (HOLD[S.trk]) {
			holdDrop(S.trk, id);
		}
		if (heldK[id]) {
			keyOff(kind, i);
		} // a missed release must not leave the old note stuck
		if (kind === "w") {
			if (qsSaved()) {
				if (i < 12) {
					qsKey(i);
				}
				return;
			} /* the SAVED QUEUES page: white keys 1-12 pick a saved queue (they do not sound) */
			if (S.screen === "song" && nestFocus()) {
				nestKey(i);
				return;
			} /* the selected slot is dropped down: white keys 1-4 mute T1-T4, 5-8 colour T1-T4, 9 adds the chosen automation, 10 deletes the chosen one, 11 moves it between this slot and the whole song (none chosen: closes it) */
			if (S.screen === "song") {
				if (i < 4) {
					songToggleMute(S.song.sel, i);
				} else if (i === 4) {
					songJump(S.song.sel);
				} else if (i <= 9) {
					songClip(NCH[i - 5].k);
				} else if (i === 10) {
					nestToggle(S.song.sel);
				}
				return;
			} /* 6-9 COPY PASTE INSERT DELETE, 10 SLOT / PATTERN, 11 drops the slot down */ /* the song screen: white keys 1-4 mute or unmute T1-T4 in the selected slot, key 5 plays the selected slot next */
			if (S.screen === "seq" && S.seqPage === 2 && !S.rec) {
				if (dgOn()) {
					dgKey(i);
					return;
				}
				if (i < SPB()) {
					stepTap(seqViewBar() * SPB() + i);
				}
				return;
			}
			if (S.screen === "drum" && i < 8) {
				S.drum.sel = i;
				S.padHits[i] = performance.now();
			}
			if (S.screen === "smp" && i < 8) {
				S.smp.slice = i;
			}
		} else {
			if (S.screen === "pp" && ["edit", "pit", "voice"].includes(S.ppMode)) {
				if (i < 6) {
					S.op = i;
					if (S.ppMode !== "edit") {
						S.ppMode = "edit";
						S.ppPage = 0;
					}
					return;
				}
				if (i === 6) {
					S.ppMode = "pit";
					S.ppPage = 0;
					return;
				}
				if (i === 7) {
					S.ppMode = "voice";
					S.ppPage = 0;
					return;
				}
				if (i === 8 || i === 9) {
					S.mono = i === 8;
					pop("VOICE", S.mono ? "MONO" : "POLY", S.mono ? 0 : 1);
					return;
				}
			}
			if (i < 6 && S.screen === "alg") {
				S.op = i;
				return;
			}
		}
		if (keyBlocked(kind, i)) {
			return;
		}
		S.hits.push(performance.now());
		if (S.hits.length > 6) {
			S.hits.shift();
		}
		if (!AC) {
			return;
		}
		const en = engOf(S.trk),
			vs = [];
		A.down++;
		if (A.down === 1 && S.arp.on) {
			A.arpSet.clear();
		}
		const kv = keyVel();
		if (en === "DRUM") {
			if (kind === "w" && i < 8) {
				drumHit(S.trk, i, kv, AC.currentTime);
				S.padHits[i] = performance.now();
				const h = recNote(36 + i, kv);
				if (h) {
					vs.rec = h;
				}
			}
		} else if (en === "SMP" && S.screen === "smp" && kind === "w" && i < 8) {
			vs.push(sampVoice(S.trk, i, 60, kv, AC.currentTime));
			{
				const h = recAt(S.trk, 36 + i, kv, AC.currentTime, 1, 1);
				if (h) {
					vs.rec = h;
				}
			}
		} /* a sampler pad records like a drum pad: the slice is the note (36+pad), a one-shot, so its length does not matter; a swipe-right on it cancels the press' record like any key's */
		else {
			const m = (kind === "w" ? WH[i] : BL[i]) + S.oct * 12 + S.glob.gtr,
				ns = chordNotes(m);
			heardNote(ns[0]);
			lastPlayed = { m, t: performance.now() };
			if (S.arp.on) {
				ns.forEach((n) => A.arpSet.add(n));
				A.arpKeys[id] = ns;
			} else {
				ns.forEach((n) => {
					const v = noteVoice(S.trk, n, kv, 0);
					if (v) {
						vs.push(v);
					}
				});
				{
					const h = recNote(en === "SMP" ? 36 + S.smp.slice : ns[0], kv);
					if (h) {
						vs.rec = h;
						recVoice(h, vs.find(Boolean));
					}
				}
			}
		}
		vs.forEach((v) => {
			if (v) {
				v.pin = true;
			}
		}); /* a key that is down is never trimmed from the voice list */
		vs.trk = S.trk;
		heldK[id] = vs;
	}

	// PROTOTYPE ONLY: press a key and flick up to hold it; it sounds until you play another key. The real FM-1's keys
	// are plain on/off switches with no slide, so this is a phone gesture, not firmware (stock ARP has its own LATCH).
	// Each track holds its own latched notes: hold a note on track 1, go to track 2 and play, come back to track 1 and playing a key there lets go of its held note.
	const latch = [0, 1, 2, 3].map(() => ({ ids: new Set(), vs: [], arp: [], by: new Map() })),
		latchMark = new Set();

	// HOLD (the button on the piano page; a sustain pedal for the phone): while it is on for a track, a key that lets go keeps sounding (for every engine, and with the arp the
	// notes stay in the arpeggio). Held keys pile up (a chord can be built one note at a time) until HOLD is turned off, KILL, or the same key is played again, which
	// replaces its own note. At most HOLDMAX keys are held per track (the oldest lets go first), and the engines' own voice caps still apply. Mock-only, like the flick-up hold.
	const HOLD = [0, 0, 0, 0],
		HOLDMAX = 6;
	const holdable = (t) => engOf(t) !== "DRUM" && !(S.screen === "smp" && engOf(t) === "SMP");

	function holdDrop(t, id) {
		const L = latch[t],
			vs = L.by.get(id);
		if (!vs) {
			return;
		}
		L.by.delete(id);
		L.ids.delete(id);
		vs.forEach((v) => {
			if (!v) {
				return;
			}
			v.pin = false;
			const k = L.vs.indexOf(v);
			if (k >= 0) {
				L.vs.splice(k, 1);
			}
			if (AC && v.off && !v.done) {
				v.off(AC.currentTime + 0.01);
			}
		});
	}

	function holdToggle() {
		const t = S.trk;
		HOLD[t] ^= 1;
		if (!HOLD[t]) {
			releaseLatch(t, false, true);
		}
		if (AC) {
			audioSync();
		}
		return HOLD[t];
	}

	function holdKey(kind, i) {
		if (engOf(S.trk) === "DRUM" || (S.screen === "smp" && engOf(S.trk) === "SMP")) {
			return;
		}
		latchMark.add(kind + i);
	}

	function releaseLatch(t, instant, force) {
		if (HOLD[t] && !force) {
			return;
		} /* with HOLD on a key press or a queue start does not let the held keys go */
		const L = latch[t];
		if (AC) {
			L.vs.forEach((v) => {
				if (v) {
					v.pin = false;
					if (v.off && !v.done) {
						/* HOLD OVERLAP: the held note keeps sounding for a while after the next key (FM releases by note number, so a key playing the same note lets go at once) */
						const same =
							v.note != null &&
							Object.keys(heldK).some(
								(id) =>
									heldK[id].trk === t &&
									heldK[id].some &&
									heldK[id].some((x) => x && x.note === v.note),
							);
						v.off(AC.currentTime + 0.01 + (instant || same ? 0 : QS.tail));
					}
				}
			});
		}
		if (!S.arp.latch) {
			L.arp.forEach((n) => {
				if (
					!Object.keys(A.arpKeys).some(
						(id) => heldK[id] && heldK[id].trk === t && A.arpKeys[id].includes(n),
					)
				) {
					A.arps[t].delete(n);
				}
			});
		}
		L.ids.clear();
		L.vs.length = 0;
		L.arp.length = 0;
		L.by.clear();
	}

	function keyOff(kind, i) {
		const id = kind + i,
			vs = heldK[id];
		if (!vs) {
			return;
		}
		delete heldK[id];
		const lt = latchMark.delete(id),
			t = vs.trk == null ? S.trk : vs.trk,
			ph = !!HOLD[t] && holdable(t);
		vs.forEach((v) => {
			if (v) {
				v.pin = false;
			}
		});
		if (A.arpKeys[id]) {
			const ns = A.arpKeys[id];
			if (lt || ph) {
				latch[t].arp.push(...ns);
			} else if (!S.arp.latch) {

		if (vs.rec && !lt && !ph && AC) {

		}
		if (lt && AC && qBusy(t) && A.q[t].pend.length < QMAX) {
			if (vs.rec) {
				recCancel(vs.rec);
			}
			vs.forEach((v) => v && v.off && !v.done && v.off(AC.currentTime + 0.01));
			qAdd(t, { id, notes: keyNotes(kind, i, t), hold: true });
			return;
		} /* the press that became the queue's last held step is not recorded as a note of its own: the queue records the step */
		if (lt || ph) {
			const L = latch[t];
			if (L.by.has(id)) {
				holdDrop(t, id);
			}
			L.ids.add(id);
			vs.forEach((v) => {
				if (v) {
					v.pin = true;
				}
			});
			L.vs.push(...vs);
			L.by.set(id, vs);
			while (ph && L.by.size > HOLDMAX) {
				holdDrop(t, L.by.keys().next().value);
			}

		}
		if (AC) {
			vs.forEach((v) => v && v.off && !v.done && v.off(AC.currentTime + 0.01));
