	// ---- page graphics (area 228 x 88 under the four parameter rows) ----
	function gFilter(x, y, w, h) {
		R(x, y, w, h, P.grid);
		filtCurve(x, y, w, h, S.fx.ft, S.fx.cut, S.fx.res, P.ops[0]);
	}

	function gReverb(x, y, w, h) {
		const f = S.fx;
		R(x, y, w, h, P.grid);
		let seed = 7;
		const rnd = () => {
			seed = (seed * 16807) % 2147483647;
			return seed / 2147483647;
		};
		const len = 30 + f.size * 1.6,
			base = y + h - 4;
		R(x + 6, y + 8, 3, base - y - 8, P.ops[3]);
		for (let i = 14; i < w - 6; i += 3) {
			const e = Math.exp(-((i - 14) / len) * 3) * (0.4 + 0.6 * rnd()),
				hh = Math.round(e * (base - y - 14));
			if (hh > 0) {
				R(x + i, base - hh, 2, hh, f.rt === 3 && ((i / 3) | 0) % 2 ? P.ops[0] : P.ops[3]);
			}
		}
	}

	function gDelay(x, y, w, h) {
		const f = S.fx;
		R(x, y, w, h, P.grid);
		const sp = 24 + f.et * 14,
			base = y + h - 4,
			r = 0.35 + (f.efb / 99) * 0.6;
		for (let k = 0; k < 9; k++) {
			const xx = x + 8 + k * sp;
			if (xx > x + w - 8) {
				break;
			}
			const hh = Math.round((h - 10) * Math.pow(r, k));
			if (hh > 0) {
				R(xx, base - hh, 4, hh, k ? P.ops[3] : P.fg);
			}
		}
	}

	function gDist(x, y, w, h) {
		R(x, y, w, h, P.grid);
		const k = 1 + (S.fx.dg / 99) * 30,
			cx = x + w / 2,
			cy = y + h / 2;
		DH(x, cy, w, P.faint, 1, 3);
		DV(cx, y, h, P.faint, 1, 3);
		let py = null;
		for (let i = 0; i < w; i++) {
			const v = Math.tanh(((i / w) * 2 - 1) * k) / Math.tanh(k),
				yy = Math.round(cy - v * (h / 2 - 4));
			if (py != null) {
				L(x + i - 1, py, x + i, yy, P.ops[0]);
			}
			py = yy;
		}
	}

	function gMod(x, y, w, h, rate, depth, now, live) {
		R(x, y, w, h, P.grid);
		const cy = y + h / 2,
			ph = live ? (now / 1000) * (0.2 + rate / 30) : 0;
		DH(x, cy, w, P.faint, 1, 3);
		let py = null;
		for (let i = 0; i < w; i++) {
			const v = Math.sin(ph + (i / w) * Math.PI * 2 * (1 + rate / 25)) * (0.1 + (depth / 99) * 0.9),
				yy = Math.round(cy - v * (h / 2 - 4));
			if (py != null) {
				L(x + i - 1, py, x + i, yy, P.ops[3]);
			}
			py = yy;
		}
	}

	function gTape(x, y, w, h, now, live) {
		const f = S.fx;
		R(x, y, w, h, P.grid);
		const mid = y + h / 2,
			wow = f.wow / 99,
			flu = f.flu / 99,
			drv = f.drv / 99,
			tm = live ? now / 1000 : 0;
		let py = null;
		for (let i = 0; i < w; i++) {
			const u = i / w,
				ph =
					u * Math.PI * 9 +
					Math.sin(u * Math.PI * 2 + tm) * wow * 5 +
					Math.sin(u * Math.PI * 23 + tm * 3) * flu * 0.8,
				v = Math.tanh(Math.sin(ph) * (1 + drv * 4)) / Math.tanh(1 + drv * 4),
				yy = Math.round(mid - v * (h / 2 - 6));
			if (py != null) {
				L(x + i - 1, py, x + i, yy, P.ops[0]);
			}
			py = yy;
		}
		const fr = Math.floor(tm * 6);
		for (let k = 0; k < Math.round(f.dust / 4); k++) {
			R(
				x + ((hsh(k * 5.1 + fr) * w) | 0),
				y + 2 + ((hsh(k * 9.7 + fr) * (h - 4)) | 0),
				1,
				1,
				P.ops[4],
			);
		}
	}

	function gADSR(x, y, w, h) {
		const a = S.adsr;
		R(x, y, w, h, P.grid);
		const base = y + h - 14,
			top = y + 6,
			sy = base - Math.round(((base - top) * a.s) / 99);
		const aw = 4 + a.a * 0.5,
			dw = 4 + a.d * 0.5,
			sw = 46,
			rw = 4 + a.r * 0.5,
			k = Math.min(1, (w - 12) / (aw + dw + sw + rw)),
			xs = [0, aw, aw + dw, aw + dw + sw, aw + dw + sw + rw].map((v) => x + 6 + Math.round(v * k)),
			ys = [base, top, sy, sy, base];
		for (let i = 0; i < 4; i++) {
			L(xs[i], ys[i], xs[i + 1], ys[i + 1], P.ops[2]);
			L(xs[i], ys[i] - 1, xs[i + 1], ys[i + 1] - 1, P.ops[2]);
		}
		let lx = -9;
		["A", "D", "S", "R"].forEach((c, i) => {
			const cx = Math.max(lx + 8, Math.round((xs[i] + xs[i + 1]) / 2));
			lx = cx;
			T(c, cx, y + h - 10, P.dim, 1, "c");
		});
	}

	function gAnaEnv(x, y, w, h) {
		const a = S.ana;
		R(x, y, w, h, P.grid);
		const base = y + h - 14,
			top = y + 6,
			sy = top + Math.round((base - top) * 0.4),
			aw = 10 + (a.atk / 99) * 60,
			dw = 30,
			sw = 44,
			rw = 10 + (a.rel / 99) * 70,
			k = Math.min(1, (w - 12) / (aw + dw + sw + rw)),
			xs = [0, aw, aw + dw, aw + dw + sw, aw + dw + sw + rw].map((v) => x + 6 + Math.round(v * k)),
			ys = [base, top, sy, sy, base];
		for (let i = 0; i < 4; i++) {
			L(xs[i], ys[i], xs[i + 1], ys[i + 1], P.ops[2]);
			L(xs[i], ys[i] - 1, xs[i + 1], ys[i + 1] - 1, P.ops[2]);
		}
		T("A", Math.round((xs[0] + xs[1]) / 2), y + h - 10, P.dim, 1, "c");
		T("R", Math.round((xs[3] + xs[4]) / 2), y + h - 10, P.dim, 1, "c");
	}

	function lfoShape(ph) {
		ph = ((ph % 1) + 1) % 1;
		switch (S.lfo.w) {
			case 0:
				return ph < 0.5 ? ph * 4 - 1 : 3 - ph * 4;
			case 1:
				return 1 - ph * 2;
			case 2:
				return ph * 2 - 1;
			case 3:
				return ph < 0.5 ? 1 : -1;
			case 4:
				return Math.sin(ph * Math.PI * 2);
			default:
				return Math.sin(Math.floor(ph * 8) * 12.9898) * 0.9;
		}
	}

	function gLfo(x, y, w, h, now, live) {
		R(x, y, w, h, P.grid);
		const mid = y + h / 2;
		DH(x, mid, w, P.faint, 1, 3);
		let py = null;
		for (let i = 0; i < w; i++) {
			const yy = Math.round(mid - lfoShape((i / w) * 2) * (h / 2 - 6));
			if (py != null) {
				L(x + i - 1, py, x + i, yy, P.ops[4]);
			}
			py = yy;
		}
		const t = live ? ((now / 1000) * (0.2 + S.lfo.sp / 25)) % 2 : 0.7;
		R(
			x + Math.round((t / 2) * w) - 2,
			Math.round(mid - lfoShape(t) * (h / 2 - 6)) - 2,
			5,
			5,
			P.acc,
		);
	}

	function gOpEnv(x, y, w, h) {
		R(x, y, w, h, P.grid);
		drawEnv(S.ops[S.op], x + 4, y + 4, w - 8, h - 8, P.ops[S.op], true, false);
	}

	function gTune(x, y, w, h) {
		const o = S.ops[S.op];

	function gLevel(x, y, w, h) {

	function gScale(x, y, w, h) {
		const o = S.ops[S.op];
		R(x, y, w, h, P.grid);
		const mid = y + h / 2,
			bx = x + Math.round((o.bp / 99) * w);
		DV(bx, y, h, P.acc, 2, 2);
		DH(x, mid, w, P.faint, 1, 3);
		const side = (dep, cur, dir) => {
			const s = cur < 2 ? 1 : -1,
				ex = cur === 1 || cur === 2;
			let py = mid;
			for (let i = 1; i <= Math.abs(dir > 0 ? x + w - bx : bx - x); i++) {
				const t = i / w,
					v = ex ? ((Math.exp(t * 4) - 1) / (Math.exp(4) - 1)) * 2 : t * 2,
					yy = clamp(Math.round(mid + ((s * v * dep) / 99) * (h / 2 - 4)), y + 2, y + h - 2),
					xx = bx + dir * i;
				L(xx - dir, py, xx, yy, P.ops[S.op]);
				py = yy;
			}
		};
		side(o.ld, o.lc, -1);
		side(o.rd, o.rc, 1);
		T(note(o.bp + 9), Math.min(bx + 3, x + w - 20), y + 4, P.acc);
	}

	function gPeg(x, y, w, h) {

		DH(x, mid, w, P.faint, 1, 3);
		let cx = x + 4,
			py = ly(S.pegL[3]);
		for (let i = 0; i < 3; i++) {
			const nx = cx + seg(S.pegR[i]),
				ny = ly(S.pegL[i]);
			L(cx, py, nx, ny, P.ops[1]);
			cx = nx;
			py = ny;
		}
		L(cx, py, cx + 40, py, P.ops[1]);
		const nx = cx + 40 + seg(S.pegR[3]);
		L(cx + 40, py, nx, ly(S.pegL[3]), P.ops[1]);

	// the four parameters of a page as a 2 x 2 grid of cells with separators (the K number says which slider moves it).
	// A cell shows its name, its value big, and a bar (or one block per choice for a short list). It lights while a finger is on it or
	// it has just changed, with an arrow for the direction of the last change.
	function paramGrid(p, now) {
		const cw = 120,
			ch = 39,
			y0 = 29;
		R(0, y0 + ch, 240, 1, P.faint);
		R(cw, y0, 1, ch * 2, P.faint);
		p.forEach((q, k) => {
			const cx = (k % 2) * cw + (k % 2 ? 1 : 0),
				cy = y0 + (k >> 1) * ch + (k >> 1);
			if (!q.l) {
				DH(cx + cw / 2 - 8, cy + ch / 2, 16, P.faint);
				return;
			}
			const lv = hotLevel(k, now),
				w = cw - 1;
			if (lv > 0.7) {
				R(cx, cy, w, ch, P.faint);
			}
			if (lv) {
				R(cx, cy, w, 2, P.acc);
			}
			T(q.l, cx + 7, cy + 6, lv ? P.acc : P.dim);
			T(String(k + 1), cx + w - 6, cy + 6, lv ? P.acc : P.faint, 1, "r");
			const d = lv ? hotDir(k) : 0;
			if (d) {
				const ax = cx + w - 24,
					ay = cy + 5;
				if (d > 0) {
					R(ax + 3, ay, 1, 1, P.acc);
					R(ax + 2, ay + 1, 3, 1, P.acc);
					R(ax + 1, ay + 2, 5, 1, P.acc);
					R(ax, ay + 3, 7, 1, P.acc);
				} else {
					R(ax, ay, 7, 1, P.acc);
					R(ax + 1, ay + 1, 5, 1, P.acc);
					R(ax + 2, ay + 2, 3, 1, P.acc);
					R(ax + 3, ay + 3, 1, 1, P.acc);
				}
			}
			const v = String(q.v),
				big = TW(v, 2) <= w - 14 ? 2 : 1;
			T(v, cx + 7, cy + (big === 2 ? 16 : 19), lv ? P.acc : P.fg, big);
			const bx = cx + 7,
				bw = w - 14,
				by = cy + ch - 6;
			if (q.st > 1 && q.st <= 8) {
				const n = q.st,
					g = 2,
					sw = Math.floor((bw - g * (n - 1)) / n);
				for (let i = 0; i < n; i++) {
					R(bx + i * (sw + g), by, sw, 3, i === q.si ? (lv ? P.acc : P.fg) : P.faint);
				}
			} else {
				R(bx, by, bw, 3, P.faint);
				R(bx, by, Math.round(bw * clamp(q.n, 0, 1)), 3, lv ? P.acc : P.fg);
			}
		});
	}

	// ---- buttons, stock behaviour first ----
	function press0(id) {
		if (S.dlg) {
			S.dlg = null;
			if (id !== "play" && id !== "rec") {
				return;
			}
		}
		if (S.screen === "boot") {
			S.screen = "home";
		}
		const pp = (m, pg) => {
				S.screen = "pp";
				S.ppMode = m;
				S.ppPage = pg || 0;
			},
			inPP = (m) => S.screen === "pp" && S.ppMode === m,
			msg = (s) => {
				S.pop = null;
				S.toast = { s, t: performance.now() };
			};
		switch (id) {
			case "fx":
				if (inPP("fx")) {
					S.ppPage = (S.ppPage + 1) % 7;
				} else {
					pp("fx");
				}
				return;
			case "env":
				if (engOf(S.trk) !== "FM" && engOf(S.trk) !== "ANA") {
					msg("ENV: FM AND ANALOG TRACKS");
					return;
				}
				pp("env");
				return; /* the other engines have no envelope to edit: say so instead of opening a page that changes nothing */
			case "lfo":
				if (engOf(S.trk) !== "FM") {
					msg("LFO: FM TRACKS ONLY");
					return;
				}
				if (inPP("lfo")) {
					S.ppPage = (S.ppPage + 1) % 2;
				} else {
					pp("lfo");
				}
				return;
			case "op":
				if (engOf(S.trk) !== "FM") {
					S.screen = ENGSCR[engOf(S.trk)];
					return;
				}
				if (inPP("edit")) {
					S.ppPage = (S.ppPage + 1) % 6;
				} else {
					pp("edit");
				}
				return;
			case "global":
				if (inPP("glob")) {
					if (S.ppPage < ppPages().length - 1) {
						S.ppPage++;
					} else {
						S.screen = "mix";
					}
				} else {
					pp("glob");
				}
				return;
			case "arp":
				if (!S.arp.on) {
					S.arp.on = true;
					A.arps.forEach((x) => x.clear());
					A.arpKeys = {};
					pp("arp");
					return;
				}
				if (inPP("arp")) {
					if (S.ppPage === 0) {
						S.ppPage = 1;
					} else {
						S.screen = "gen";
					}
					return;
				}
				if (S.screen === "gen") {
					S.arp.on = false;
					A.arps.forEach((x) => x.clear());
					A.arpKeys = {};
					S.screen = "home";
					msg("ARP OFF");
					return;
				}
				pp("arp");
				return;
			case "seq":
				if (nestOn()) {
					nestCollapse();
					return;
				}
				if (S.screen === "song") {
					S.screen = "seq";
					S.seqPage = 0;
					return;
				}
				if (!S.seqEn) {
					S.seqEn = true;
					S.seqPage = 0;
					S.screen = "seq";
					return;
				}
				if (S.screen === "seq") {
					if (S.seqPage < 4) {
						S.seqPage++;
					} else {
						S.seqEn = false;
						S.rec = false;
						if (S.playing) {
							S.playing = false;
							stopSeq();
						}
						S.screen = "home";
						msg("SEQ OFF");
					}
					return;
				}
				S.screen = "seq";
				return;
			case "song" /* the SONG button: opens the song screen; again goes back to the sequencer (or home when it is off) */:
				if (nestOn()) {
					nestCollapse();
					return;
				}
				if (S.screen === "song") {
					if (S.seqEn) {
						S.screen = "seq";
						S.seqPage = 0;
					} else {
						S.screen = "home";
					}
					return;
				}
				songOpen();
				return;
			case "play":
				if (!S.seqEn && !S.playing) {
					msg("ENABLE SEQ FIRST: PRESS SEQ");
					return;
				}
				break;
			case "mixer":
				S.screen = S.screen === "mix" ? "home" : "mix";
				return;
			case "browser" /* the presets screen with its categories; pressing it again jumps to the USER tab (what you saved) and back to ALL */:
				if (S.screen !== "presets") {
					S.screen = "presets";
					return;
				}
				{
					const u = CATS.indexOf("USER");
					S.pcat = S.pcat === u ? 0 : u;
					msg(S.pcat === u ? "YOUR SAVED PRESETS" : "ALL PRESETS");
				}
				return;
			case "settings":
				if (SET.open) {
					closeSettings();
				} else {
					openSettings();
				}
				return;
			case "key" /* KEY: opens the scale screen and lights the scale on the keys; pressed again on that screen it switches the lights off and leaves */:
				if (S.screen === "scale") {
					S.screen =
						KEYFROM && KEYFROM !== "scale" && KEYFROM !== "pp" && SCR[KEYFROM] ? KEYFROM : "home";
					return;
				}
				KEYFROM = S.screen;
				S.screen = "scale";
				return;
			case "hold": {
				const on = holdToggle();
				msg(on ? "HOLD ON: KEYS KEEP SOUNDING" : "HOLD OFF");
				return;
			}
			case "queue":
			case "strip":
				qsToggle(id);
				return; /* QUEUE and STRIP: a screen of their own (like MIXER): tap opens it, tap again goes back to where you were */
		}
		press0old(id);
	}

	function ledOn(id) {
		if (id === "hold") {
			return !!HOLD[S.trk];
		}
		if (id === "queue") {
			return !!QS.on || inQS("queue");
		}
		if (id === "strip") {
			return MOD.t !== 0 || aActive(stripId(0)) || inQS("strip");
		}
		if (id === "key") {
			return S.screen === "scale" || keyMode() > 0;
		}
		if (id === "settings") {
			return SET.open;
		}
		if (id === "mixer") {
			return S.screen === "mix";
		}
		if (id === "browser") {
			return S.screen === "presets";
		}
		if (id === "play") {
			return S.playing;
		}
		if (id === "rec") {
			return S.rec;
		}
		if (id === "arp") {
			return S.arp.on;
		}
		if (id === "seq") {
			return S.seqEn;
		}
		if (id === "song") {
			return S.screen === "song" || !!S.song.on;
		}
		if (S.screen === "pp") {
			return (
				id ===
				{ fx: "fx", env: "env", lfo: "lfo", edit: "op", pit: "op", voice: "op", glob: "global" }[
					S.ppMode
				]
			);
		}
		const m = { home: ["home", "scape"], save: ["save"], op: ["ana", "wt", "smp", "drum"] }[id];
		return !!(m && m.includes(S.screen));
	}

	function blackLit(i) {
		const pp = S.screen === "pp" && ["edit", "pit", "voice"].includes(S.ppMode);
		if (!pp && S.screen !== "alg") {
			return false;
		}
		if (i < 6) {
			return (S.screen === "alg" || S.ppMode === "edit") && i === S.op;
		}
		if (!pp) {
			return false;
		}
		if (i === 6) {
			return S.ppMode === "pit";
		}
		if (i === 7) {
			return S.ppMode === "voice";
		}
		if (i === 8) {
			return S.mono;
		}
		if (i === 9) {
			return !S.mono;
		}
		return false;
	}

		tapTimes.push(now);

			return;

	// ---------- touch editing on the screen (PROTOTYPE ONLY: the real screen is not a touch screen) ----------
	// Touch a graph and drag: it draws the shape, and the sliders and the four values under it follow at once (they read the same numbers).
	// Swipe sideways on any value (a parameter row, a Global row, a track tile, one of the four values at the bottom) to change it, right = up.
	// Each of these just moves the same parameters the real knobs move, so the firmware never depends on touch.
	const GB = { x: 6, y: 110, w: 228, h: 88 };

	function gEdit(cur, x, y, st, first) {
		if (S.screen === "pp") {
			const pg = ppPages();

		} /* fresh parameter objects: their current values are read at call time */
		const tc = [],
			g = cur.g,
			P4 = cur.p,

				tc.push(P4.indexOf(q));
				const c = q.sn != null ? q.sn : +q.v,
					d = Math.round(v) - c;
				if (d) {

				}
			};

			fy = (lo, hi) => lo + clamp((GB.y + GB.h - y) / GB.h, 0, 1) * (hi - lo);

		if (g === gFilter) {
			put(P4[1], fx(0, 127));
			put(P4[2], fy(0, 99));
		} else if (g === gReverb) {
			put(P4[1], fx(0, 99));
			put(P4[3], fy(0, 100));
		} else if (g === gDelay) {
			put(P4[1], fx(0, 99));
			put(P4[3], fy(0, 100));
		} else if (g === gDist) {
			put(P4[0], fx(0, 99));
			put(P4[2], fy(0, 100));
		} else if (g === gTape) {
			put(P4[0], fx(0, 99));
			put(P4[2], fy(0, 99));
		} else if (g === gLfo) {
			if (cur.t === "1/2 LFO") {
				put(P4[0], fx(0, 99));
				put(P4[2], fy(0, 99));
			} else if (first) {
				S.lfo.w = wrap(S.lfo.w + 1, 6);
				tc.push(1);
			}
		} else if (g === gArp) {
			if (cur.t === "1/2 ARPEGGIO") {
				put(P4[3], fx(5, 100));
				put(P4[2], fy(1, 4));
			} else {
				put(P4[1], fx(50, 75));
			}
		} else if (g === gTune) {
			put(P4[1], fx(0, 31));
			put(P4[2], fy(0, 99));

			}
			tc.push(0);
		} else if (g === gLevel) {
			if (y < GB.y + 48) {
				o.lv = Math.round(fx(0, 99));
				tc.push(3);
			} else {
				o.kvs = clamp(Math.floor((x - GB.x - 6) / 14), 0, 7);
				tc.push(2);
			}

			const bx = GB.x + Math.round((o.bp / 99) * GB.w),
				mid = GB.y + GB.h / 2;

				st.bp = Math.abs(x - bx) <= 14;
			}
			if (st.bp) {
				o.bp = Math.round(fx(0, 99));
				tc.push(0);
			} else {
				const dep = Math.round(clamp(Math.abs(y - mid) / (GB.h / 2 - 4), 0, 1) * 99);

					o.ld = dep;
					tc.push(1);
				} else {
					o.rd = dep;
					tc.push(2);
				}

			const ex = GB.x + 4,
				ey = GB.y + 4,
				ew = GB.w - 8,
				eh = GB.h - 8;
			if (first) {
				const p = envPts(o, ex, ey, ew, eh);
				let bd = 1e9;
				st.i = 0;
				[1, 2, 3, 5].forEach((k, i) => {
					const d = Math.hypot(p[k].x - x, p[k].y - y);
					if (d < bd) {
						bd = d;
						st.i = i;
					}
				});
			}
			const p = envPts(o, ex, ey, ew, eh),
				i = st.i,
				k = [1, 2, 3, 5][i],
				base = ey + eh - 1,
				seg = i === 3 ? ex + ew - 1 - x : x - p[k - 1].x;
			o.L[i] = clamp(Math.round(((base - y) / (eh - 1)) * 99), 0, 99);

			const x0 = GB.x + 4,
				mid = GB.y + GB.h / 2,
				ly = (l) => Math.round(mid - ((l - 50) / 50) * (GB.h / 2 - 4)),
				sg = (r) => 4 + Math.round(((100 - r) / 100) * 40);
			const pts = [];
			let cx = x0;
			for (let i = 0; i < 3; i++) {
				cx += sg(S.pegR[i]);
				pts.push({ x: cx, y: ly(S.pegL[i]) });
			}
			pts.push({ x: cx + 40 + sg(S.pegR[3]), y: ly(S.pegL[3]) });
			if (first) {
				let bd = 1e9;
				st.i = 0;
				pts.forEach((q, i) => {
					const d = Math.hypot(q.x - x, q.y - y);
					if (d < bd) {
						bd = d;
						st.i = i;
					}
				});
			}
			const i = st.i,
				prev = i === 0 ? x0 : i === 3 ? pts[2].x + 40 : pts[i - 1].x;
			S.pegL[i] = clamp(Math.round(50 + ((mid - y) / (GB.h / 2 - 4)) * 50), 0, 99);
			S.pegR[i] = clamp(Math.round(100 - ((x - prev - 4) / 40) * 100), 0, 99);
			tc.push(i);
		} else if (g === gADSR) {
			const a = S.adsr,
				base = GB.y + GB.h - 14,
				top = GB.y + 6,
				xs = [
					0,
					4 + a.a * 0.5,
					4 + a.a * 0.5 + 4 + a.d * 0.5,
					4 + a.a * 0.5 + 4 + a.d * 0.5 + 46,
					4 + a.a * 0.5 + 4 + a.d * 0.5 + 46 + 4 + a.r * 0.5,
				].map((v) => GB.x + 6 + v);
			if (first) {
				let bd = 1e9;
				st.i = 0;
				[1, 2, 4].forEach((k, i) => {
					const d = Math.abs(xs[k] - x);
					if (d < bd) {
						bd = d;
						st.i = i;
					}
				});
			}
			const i = st.i;
			if (i === 0) {
				a.a = clamp(Math.round((x - xs[0] - 4) / 0.5), 0, 99);
			} else if (i === 1) {
				a.d = clamp(Math.round((x - xs[1] - 4) / 0.5), 0, 99);
				a.s = clamp(Math.round(((base - y) / (base - top)) * 99), 0, 99);
			} else {
				a.r = clamp(Math.round((x - xs[3] - 4) / 0.5), 0, 99);
			}
			tc.push(...(i === 0 ? [0] : i === 1 ? [1, 2] : [3]));
			applyAdsr();
		} else if (g === gAnaEnv) {
			if (first) {
				st.i = x < GB.x + GB.w / 2 ? 0 : 3;
			}
			put(
				P4[st.i],
				st.i
					? clamp((x - GB.x - GB.w / 2) / (GB.w / 2), 0, 1) * 99
					: clamp((x - GB.x) / (GB.w / 2), 0, 1) * 99,
			);
		} /* left half: ATTACK, right half: RELEASE */
		else if (S.screen === "pp" && cur.t === "CHORUS") {
			put(P4[0], fx(0, 99));
			put(P4[1], fy(0, 99));
		} else if (S.screen === "pp" && cur.t === "PHASER") {
			put(P4[0], fx(0, 99));
			put(P4[1], fy(0, 99));
		}
		if (tc.length) {
			const u = tc.filter((i) => i >= 0);
			if (u.length) {
				S.hot = { c: u[0], cs: u, t: performance.now(), d: 0 };
			}
			u.forEach((i) => aNote(P4[i]));
		}
		if (g === gOpEnv && st.i != null) {
			const i = st.i;
			aNoteRaw(o.L, i, 0, 99, "OP" + (S.op + 1) + " LEVEL " + (i + 1));
			aNoteRaw(o.R, i, 0, 99, "OP" + (S.op + 1) + " RATE " + (i + 1));
		} else if (g === gPeg && st.i != null) {
			const i = st.i;
			aNoteRaw(S.pegL, i, 0, 99, "PITCH ENV LEVEL " + (i + 1));
			aNoteRaw(S.pegR, i, 0, 99, "PITCH ENV RATE " + (i + 1));
		}
	}

	// what is under a touch on the screen: a graph to draw on, a value to swipe, or nothing special
	function lcdZone(x, y) {
		if (S.dlg || S.screen === "boot") {
			return null;
		}
		const s = S.screen;
		if (y >= 205) {
			const c = clamp(Math.floor(x / 60), 0, 3),
				k = knobs()[c];
			return k && k.set ? { t: "knob", c, tap: true } : null;
		}
		if (s === "pp") {
			const pg = ppPages(),
				cur = pg[clamp(S.ppPage, 0, pg.length - 1)];
			if (cur.z) {
				const zz = cur.z(x, y);
				if (zz) {
					return zz;
				}
				if (y >= GB.y && y < GB.y + GB.h) {
					return null;
				}
			} /* the QUEUE and STRIP pages draw their own pictures (no graph editing) and name their own touch zones */
			if (cur.g && x >= GB.x && x < GB.x + GB.w && y >= GB.y && y < GB.y + GB.h) {
				return onQS() ? null : { t: "graph", cur };
			}
			if (y >= 29 && y < 108) {
				const k = (y < 69 ? 0 : 2) + (x < 120 ? 0 : 1),
					q = cur.p[k];
				if (q && q.set) {
					return { t: "knob", c: k, tap: DESK.matches || onQS() };
				}
			}
			return null;
		}
		if (s === "home") {
			if (x >= HM.wx && x < HM.wx + HM.ww && y >= HM.wy && y < HM.wy + HM.wh) {
				return { t: "home" };
			}
			if (y >= HM.ty && y < HM.ty + HM.th && x >= 6 && x < 234) {
				return { t: "tile", i: clamp(Math.floor((x - 6) / 57), 0, 3), tap: true };
			}
			return pvZone(HV, x, y);
		} /* the mini song player: tap a block = that slot (the song screen's row tap), drag sideways = scroll while stopped */
		if (s === "seq" && dgOn()) {
			return dgZone(x, y);
		}
		if (s === "seq" && !S.clr) {
			if (barZone(x, y)) {
				return { t: "bs", tap: true };
			}
			const gh = sqGateHit(x, y);
			if (gh) {
				return { t: "sq", kind: "gate", j: gh.j, x0g: gh.x0 };
			}
			const kind =
				y >= SQ.y0 - 2 && y < SQ.ny - 2
					? "bars"
					: y >= SQ.ky - 2 && y < SQ.ky + SQ.kh + 3
						? "box"
						: null;
			if (kind && x >= sqX0() && x < sqX0() + sqCW() * SPB()) {
				return { t: "sq", kind };
			}
		}
		if (s === "mix" && y >= 32 && y < 174 && x >= 4 && x < 236) {
			const i = Math.floor((x - 6) / 38);
			if (i >= 0 && i < 6 && i !== 4) {
				return { t: "mixv", i };
			}
		}
		if (s === "song") {
			return songZone(x, y);
		}
		if (s === "global" && y >= 32 && y < 200) {
			const top = clamp(S.glob.sel - 3, 0, GROWS.length - 8),
				i = top + Math.floor((y - 32) / 21);
			return i < GROWS.length ? { t: "grow", i, tap: true } : null;
		}
		if (s === "presets" && y >= 32 && y < 200) {
			return {
				t: "plist",
				tap: true,
				t0: ptop(prows()),
			};
		} /* the preset list: a drag scrolls it, a tap is the row */
		return null;
	}

	// ---- the sequencer screen by touch: the bars are the velocities. Touch an empty step and a note is placed at the height you touched; tap a note to delete it;
	// drag a bar up or down to change its velocity (dragging across steps paints them). The row of boxes also adds and removes steps (a drag paints the same on or off).
	// With SNAP on, only the grid's steps can be touched. Each of these is the NOTE / VELOCITY knob or a white key doing the same thing, so the firmware never depends on touch.
	function sqStep(x, z) {
		const j0 = clamp(Math.floor((x - sqX0()) / sqCW()), 0, SPB() - 1);
		return clamp(snapIdx(z.vb * SPB() + j0), 0, nstT() - 1);
	}

	function sqApply(z, x, y, first) {
		const q = S.seq,
			perc = ["DRUM", "SMP"].includes(engOf(S.trk));
		let ch = false,
			hc = 0,
			j;
		if (z.kind === "gate") {
			j = z.j;
			q.sel = j;
			hc = 2;
			let g = ((x - z.x0g + 3) / sqCW()) * 100;
			if (snapOn()) {
				const un = unitSteps() * 100;
				g = Math.max(un, Math.round(g / un) * un);
			}
			g = clamp(Math.round(g / 5) * 5, 5, gateMax());
			if (g > 100) {
				g = gateQ(g);
			}
			if (q.gate[j] !== g) {
				q.gate[j] = g;
				ch = true;
			}
		} else {
			j = sqStep(x, z);
			if (z.kind === "box") {
				if (first) {
					z.add = q.st[j] < 0;
				}
				if (z.add !== q.st[j] >= 0) {
					stepOn(j, z.add);
					ch = true;
				}
				q.sel = j;
				hc = 1;
			} else {
				q.sel = j;
				hc = [3, 1, 2][UI.sqe];
				if (first) {
					z.had = q.st[j] >= 0;
				} /* a bare tap on a note deletes it (on release); on an empty step it places one at that height; editing any attribute adds the note until it is deleted */
				if (z.moved || (first && !z.had)) {
					if (q.st[j] < 0) {
						stepOn(j, true);
						ch = true;
					}
					const b = UI.sqe === 0 ? q.vel[j] : UI.sqe === 1 ? q.st[j] : q.gate[j];
					sqSet(q, j, y, perc);
					if ((UI.sqe === 0 ? q.vel[j] : UI.sqe === 1 ? q.st[j] : q.gate[j]) !== b) {
						ch = true;
					}
				}
			}
		}
		if (S.seqPage === 2) {
			S.hot = { c: hc, t: performance.now(), d: 0 };
		}
		const key = j + ":" + q.st[j] + ":" + q.vel[j];
		if (ch && AC && q.st[j] >= 0 && z.last !== key && z.kind !== "gate") {
			z.last = key;
			stepPlay(S.trk, j, AC.currentTime);
		}
	}

	// one undo step per touch, pushed when the touch ends and only if it changed something (a tap that just selects a note used to leave a step that undid nothing)
	function sqUndo(z) {
		const js = z.us;
		if (!js) {
			return;
		}
		z.us = null;
		if (songSnap(true) === js) {
			return;
		}
		UND.u.push("STEPS\x1f" + js);
		if (UND.u.length > 16) {
			UND.u.shift();
		}
		UND.r.length = 0;
	}

	// the dropdown that picks what the sequencer's bars edit (a small popup under the chip in the screen's top right)
	const EMENU = { open: false };
	const menuOpen = (k) => k === "edit" && EMENU.open;

	function openEditMenu() {
		let m = document.getElementById("editmenu");
		if (!m) {
			m = document.createElement("div");
			m.id = "editmenu";
			m.className = "modmenu";
			m.hidden = true;
			m.style.gridTemplateColumns = "repeat(3,1fr)";
			document.body.appendChild(m);
		}
		m.innerHTML = "";
		SQE.forEach((n, i) => {
			const b = document.createElement("button");
			b.className = "mt";
			b.textContent = n;
			b.setAttribute("aria-pressed", String(UI.sqe === i));
			b.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				e.stopPropagation();
				UI.sqe = i;
				saveUI();
				closeEditMenu();
				toast("BARS EDIT " + n);
			});
			m.appendChild(b);
		});
		const r = document.getElementById("big").getBoundingClientRect();
		m.style.top = Math.round(r.top + (r.height * 28) / 240) + "px";
		m.style.bottom = "auto";
		m.hidden = false;
		EMENU.open = true;
		setTimeout(() => document.addEventListener("pointerdown", outsideEdit, true), 0);
	}

	function outsideEdit(e) {
		const m = document.getElementById("editmenu");
		if (m && m.contains(e.target)) {
			return;
		}
		closeEditMenu();
		if (e.target === big) {
			e.stopPropagation();
			e.preventDefault();
		}

	} /* a tap on the screen that closes the dropdown is only that (it used to place or delete a note under the finger as well) */
	function closeEditMenu() {
		const m = document.getElementById("editmenu");
		if (m) {
			m.hidden = true;
		}
		EMENU.open = false;
		document.removeEventListener("pointerdown", outsideEdit, true);
	}
	let lz = null;

	function lcdSwipe(n, sg) {
		// one step (sg = +1 / -1) on the value under the finger
		const z = lz;
		if (z.t === "knob") {
			turn("k" + z.c, sg);
		} else if (z.t === "tile") {
			const t = S.tracks[z.i];
			t.vol = clamp(t.vol + sg, 0, 100);
			aNoteRaw(t, "vol", 0, 100, "T" + (z.i + 1) + " VOLUME");
			pop("T" + (z.i + 1) + " VOLUME", t.vol + "%", t.vol / 100);
			syncSoon();
		} else if (z.t === "grow") {
			S.glob.sel = z.i;
			turn("k1", sg);
		} else if (z.t === "srow") {
			songSwipe(z, sg);
		}
	}

	function lcdPps(z) {
		const w = (big.getBoundingClientRect().width * 228) / 240;
		if (z.t === "tile") {
			return 3;
		}
		const ks = knobs(),
			k = z.t === "knob" ? ks[z.c] : z.t === "grow" ? null : null;
		if (z.t === "grow" || z.t === "srow") {
			return 30;
		}
		const r = (k && (k.r || (k.st > 1 ? k.st : 100))) || 100;
		return clamp(w / r, 2.2, 30);
	}
	big.addEventListener("pointerdown", (e) => {
		e.preventDefault();
		const r = big.getBoundingClientRect(),
			x = ((e.clientX - r.left) / r.width) * 240,
			y = ((e.clientY - r.top) / r.height) * 240;
		ensureAudio();
		if (gearHit(x, y)) {
			gearOn = true;
			clearTimeout(gearT);
			gearT = setTimeout(() => {
				gearOn = false;
				toggleGrid();
				try {
					navigator.vibrate && navigator.vibrate(14);
				} catch (z) {}
			}, 600);
			return;
		}
		if (playHit(x, y)) {
			press("play");
			return;
		}
		if (bpmHit(x, y)) {
			bpmDrag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, bpm0: S.bpm, moved: false };
			try {
				big.setPointerCapture(e.pointerId);
			} catch (q) {}
			return;
		}
		if (keyModeHit(x, y)) {
			return;
		}
		const z = lcdZone(x, y);
		if (lz && lz.t === "sq") {
			sqUndo(lz);
		}
		if (z) {
			lz = Object.assign({}, z, { id: e.pointerId, x0: e.clientX, x, y, moved: false, st: {} });
			try {
				big.setPointerCapture(e.pointerId);
			} catch (q) {}
			if (z.t === "knob") {
				HELD = z.c;
			}
			if (z.t === "dg") {
				dgDown(lz, x, y);
			}
			if (z.t === "dq") {
				dqDown(lz, x, y);
			}
			if (z.t === "nest") {
				nestDown(lz, x, y);
			}
			if (z.ls) {
				lz.y0 = y;
				lz.sc0 = SGV.sc;
			}
			if (z.t === "sq") {
				lz.us = songSnap(true);
				lz.vb = seqViewBar();
				lz.y0 = y;
				lz.prev = S.seq.sel;
				if (z.kind === "gate") {
					S.seq.sel = z.j;
				}
				sqApply(lz, x, y, true);
			}
			if (z.t === "graph" || z.t === "home" || z.t === "tile") {
				undoPush();
			}
			if (z.t === "mixv") {
				undoPush("VOLUME");
				if (z.i < 4) {
					S.trk = z.i;
				}
				lz.y0 = y;
			}
			if (z.t === "graph") {
				wake();
				gEdit(z.cur, x, y, lz.st, true);
				syncSoon();
			} else if (z.t === "home") {
				wake();
				lz.h0 = { x, y, a: S.mac[0], b: S.mac[1] };
			}
			return;
		}
		screenDown(x, y);
		try {
			navigator.vibrate && navigator.vibrate(4);
		} catch (z) {}
	});
	big.addEventListener("pointermove", (e) => {
		if (bpmDrag && e.pointerId === bpmDrag.id) {
			const moved = bpmDrag.x0 - e.clientX + (bpmDrag.y0 - e.clientY);
			if (Math.abs(moved) > 6) {
				bpmDrag.moved = true;
			}
			if (bpmDrag.moved) {
				const want = clamp(
					bpmDrag.bpm0 + Math.round((e.clientX - bpmDrag.x0 - (e.clientY - bpmDrag.y0)) / 4),
					30,
					300,
				);
				if (want !== S.bpm) {
					nudgeTempo(want - S.bpm);
				}
			}
			return;
		}
		if (!lz || e.pointerId !== lz.id) {
			return;
		}
		const r = big.getBoundingClientRect(),
			x = ((e.clientX - r.left) / r.width) * 240,
			y = ((e.clientY - r.top) / r.height) * 240;
		if (lz.t === "graph") {
			gEdit(lz.cur, x, y, lz.st, false);
			syncSoon();
			return;
		}
		if (lz.t === "dg") {
			dgMove(lz, x, y);
			return;
		}
		if (lz.t === "nest") {
			nestMove(lz, x, y);
			return;
		}
		if (lz.t === "bs") {
			const dx = lz.x - x;
			if (!lz.moved && Math.abs(dx) < 4) {
				return;
			}
			lz.moved = true;
			const n = Math.trunc(dx / BSTEP);
			if (n) {
				barStep(n);
				lz.x -= n * BSTEP;
			}
			return;

		} /* the bar strip scrolls: drag left = later bars, one bar per 24 px */
		if (lz.t === "dq") {
			dqMove(lz, x, y);
			return;
		}
		if (lz.ls && songDrag(lz, x, y)) {
			return;
		}
		if (lz.sc) {
			return;
		}
		if (lz.t === "sq") {
			if (!lz.moved && (Math.abs(y - lz.y0) > 3 || Math.abs(e.clientX - lz.x0) > 4)) {
				lz.moved = true;
			}
			sqApply(lz, x, y, false);
			return;
		}
		if (lz.t === "qlist") {
			if (!lz.moved && Math.abs(y - lz.y) < 5) {
				return;
			}
			lz.moved = true;
			QL.sc = clamp(lz.sc0 - (y - lz.y), 0, qlMax());
			return;

		} /* drag the saved-queue list: it scrolls, no button is pressed */
		if (lz.t === "plist") {
			if (!lz.moved && Math.abs(y - lz.y) < 5) {
				return;
			}
			lz.moved = true;
			pscroll(lz.t0 - (y - lz.y) / 21);
			return;

		} /* drag the preset list: it scrolls, nothing loads */
		if (lz.t === "mixv") {
			if (!lz.moved && Math.abs(y - lz.y0) < 4) {
				return;
			}
			lz.moved = true;
			const v = clamp(Math.round(150 - y), 0, 100);
			if (lz.i < 4) {
				S.tracks[lz.i].vol = v;
				aNoteRaw(S.tracks[lz.i], "vol", 0, 100, "T" + (lz.i + 1) + " VOLUME");
			} else {
				S.vol = v;
				aNoteRaw(S, "vol", 0, 100, "MASTER VOLUME");
			}
			wake();
			syncSoon();
			return;
		}
		if (lz.t === "home") {
			const h = lz.h0;
			if (!lz.moved) {
				if (Math.hypot(x - h.x, y - h.y) < 4) {
					return;
				}
				lz.moved = true;
			}
			S.mac[0] = clamp(Math.round(h.a + ((x - h.x) / HM.ww) * 127), 0, 127);
			S.mac[1] = clamp(Math.round(h.b - ((y - h.y) / HM.wh) * 127), 0, 127);
			aNoteRaw(S.mac, 0, 0, 127, "MOOD");
			aNoteRaw(S.mac, 1, 0, 127, "WARMTH");
			syncSoon();
			return;

		} /* it grabs from where the values are: a bare tap changes nothing */
		const dx = e.clientX - lz.x0;
		if (!lz.moved && Math.abs(dx) < 7) {
			return;
		}
		const pps = lcdPps(lz),
			n = Math.trunc(dx / pps);
		if (n !== 0) {
			lz.moved = true;
			wake();
			for (let i = 0; i < Math.abs(n); i++) {
				lcdSwipe(1, n > 0 ? 1 : -1);
			}
			lz.x0 += n * pps;
		}
	});
	const lcdEnd = (e) => {
		if (bpmDrag && e.pointerId === bpmDrag.id) {
			const drag = bpmDrag;
			bpmDrag = null;
			if (e.type === "pointerup" && !drag.moved) {
				tapTempo();
			}
			return;
		}
		if (gearOn && e.type === "pointerup") {
			gearOn = false;
			clearTimeout(gearT);
			openSettings();
		} else if (e.type !== "pointerup") {
			gearOn = false;
			clearTimeout(gearT);
		}
		if (lz && e.pointerId === lz.id) {
			const z = lz;
			lz = null;
			HELD = -1;
			if (z.t === "dg") {
				dgUp(z, e);
			}
			if (z.t === "dq") {
				dqUp(z);
			}
			if (z.t === "sq" && e.type === "pointerup" && !z.moved && z.kind === "bars" && z.had) {
				const jj = sqStep(z.x, z);
				if (z.prev === jj) {

				row.appendChild(b);
				if (id !== "octdn" && id !== "octup") {
					mobBtns[id] = b;
				}
			});
		});
		DESK.addEventListener && DESK.addEventListener("change", () => btnPageSet(bpage, true));
		view.appendChild(strip);
		grid.appendChild(view);
		grid.appendChild(dots);
		btnPageSet(bpage, true);
		window.__mellow.btnGo = (k) => {
			const pg = PAGES.findIndex((r) => r.some(([id, lab]) => id === k || lab === k));
			if (pg >= 0) {
				btnPageSet(pg, true);
			}
		}; /* test hook: flip to the page a button is on */
		mobEl.appendChild(grid);
		const kb = document.createElement("div");
		kb.className = "mkb";
		kb.innerHTML =
			'<div class="mkbtop"><button id="mk-l" aria-label="Keys lower"><i class="tri"></i></button><span id="mk-r" aria-label="Mod strip: slide to modulate (the STRIP button chooses what it controls)"><i class="mid"></i><i class="thumb"></i><b id="mod-l">PITCH</b></span><button id="mk-h" aria-label="Keys higher"><i class="tri"></i></button></div><div class="mkeys" id="mkeys"></div>';
		mobEl.appendChild(kb);
		const shift = (d) => {
			mobStart = clamp(mobStart + d, 0, WH.length - MVIS);
			buildKeys();
		};
		kb.querySelector("#mk-l").addEventListener("pointerdown", (e) => {
			e.preventDefault();
			shift(-3);
		});
		kb.querySelector("#mk-h").addEventListener("pointerdown", (e) => {
			e.preventDefault();
			shift(3);
		});
		// PROTOTYPE ONLY: the mod strip (see modStripInit)
		modStripInit(kb.querySelector("#mk-r"));
	}
	const LAND = window.matchMedia(
		"(orientation:landscape) and (max-height:600px) and (max-width:1000px)",
	);

	function fitKeys() {
		deskFit();
		if (DESK.matches) {
			document.getElementById("mk-l").style.display = document.getElementById(
				"mk-h",
			).style.display = "none";
			if (MVIS !== 16 || mobStart !== 0) {
				MVIS = 16;
				mobStart = 0;
				buildKeys();
			}
			return;
		} /* desktop: every key of the FM-1 (F3-G5), no arrows */
		const kb = document.querySelector(".mkb");
		if (!kb || !kb.clientWidth) {
			return;
		}
		const avail = kb.clientWidth - 16 - (LAND.matches ? 104 : 0);
		const v = clamp(Math.floor(avail / 36), 7, 16);
		const full = v >= 16;
		document.getElementById("mk-l").style.display = document.getElementById("mk-h").style.display =
			full ? "none" : "";
		if (v !== MVIS || (full && mobStart !== clamp(mobStart, 0, WH.length - v))) {
			MVIS = v;
			mobStart = clamp(mobStart, 0, WH.length - MVIS);
			buildKeys();
		}
	}
	let fitT = null;
	const refit = () => {
		clearTimeout(fitT);
		fitT = setTimeout(fitKeys, 120);
	};
	window.addEventListener("resize", refit);
	window.addEventListener("orientationchange", refit);

	function buildKeys() {
		const box = document.getElementById("mkeys");
		mobKeys.forEach(([el, kind, i]) => {
			if (heldK[kind + i]) {
				keyOff(kind, i);
			}
		});
		box.innerHTML = "";
		mobKeys = [];
		const W = 100 / MVIS;
		for (let wi = mobStart; wi < mobStart + MVIS; wi++) {
			const k = document.createElement("button");
			k.className = "mk white";
			k.style.left = (wi - mobStart) * W + "%";
			k.style.width = W + "%";
			k.textContent = note(WH[wi]);
			k.setAttribute("aria-label", note(WH[wi]));
			bindMobKey(k, "w", wi);
			box.appendChild(k);
			mobKeys.push([k, "w", wi]);
		}
		BL.forEach((m, j) => {
			const wi = WH.indexOf(m - 1);
			if (wi < mobStart || wi >= mobStart + MVIS - 1) {
				return;
			}
			const k = document.createElement("button");
			k.className = "mk black";
			k.style.width = W * 0.62 + "%";
			k.style.left = (wi + 1 - mobStart) * W - W * 0.31 + "%";
			k.textContent = BLL[j];
			k.setAttribute("aria-label", BLL[j] || note(m));
			bindMobKey(k, "b", j);
			box.appendChild(k);
			mobKeys.push([k, "b", j]);
		});
		document.getElementById("mk-r").dataset.range =
			note(WH[mobStart]) + " – " + note(WH[mobStart + MVIS - 1]);
	}

	function bindMobKey(k, kind, i) {
		let sx = 0,
			sy = 0,
			st = 0,
			mode = "",
			tq = 0,
			qt = 0,
			relDone = true,
			relT = 0,
			deferT = 0,
			started = false,
			isDown = false,
			qy = 0,
			qb = 0;
		const id = kind + i;
		// the swipe-right's hold is also a pitch bend: from where the finger was when the swipe was recognised, up or down moves it (6 px dead zone, then +-2 semitones over about 54 px more), the value at lift is kept
		const bendStart = (e) => {
			qy = e.clientY;
			qb = 0;
			delete k.dataset.lv;
			delete k.dataset.ld;
		};
		const bendMove = (e) => {
			if (!bendMel(qt)) {
				return;
			}
			const dy = qy - e.clientY,
				d = Math.abs(dy) < 6 ? 0 : dy - Math.sign(dy) * 6,
				b = clamp(Math.round((d / 54) * BEND_MAX), -BEND_MAX, BEND_MAX);
			if (b === qb) {
				return;
			}
			qb = b;
			if (b) {
				k.dataset.lv = bendSt(b).replace(" ST", "");
				k.dataset.ld = b > 0 ? "u" : "d";
			} else {
				delete k.dataset.lv;
				delete k.dataset.ld;
			}
			pop("BEND", b ? bendSt(b) : "0.0 ST", (b + BEND_MAX) / (2 * BEND_MAX));
		}; /* the LCD's pop-up shows it live too */
		// a press lets go of this track's held note, but a moment later (or when you lift, or flick up to hold a new one): if the press turns
		// out to be a swipe-right queue, the held note keeps sounding and fades into the queue instead
		const relHeld = () => {
			clearTimeout(relT);
			if (!relDone) {
				relDone = true;
				releaseLatch(qt);
			}
		};
		// While you are queuing (a queue mode other than NORMAL, a queue still waiting or playing, or one used in the last 8 s) the press is held back for up to
		// 100 ms to see whether it is a swipe-right: if it is, the note is queued silently and was never sounded; if not, it sounds at that point.
		const startNote = () => {
			if (started) {
				return;
			}
			started = true;
			clearTimeout(deferT);
			keyOn(kind, i, true);
		};
		k.addEventListener("pointerdown", (e) => {
			e.preventDefault();
			sx = e.clientX;
			sy = e.clientY;
			st = e.timeStamp;
			mode = "";
			qt = S.trk;
			relDone = false;
			started = false;
			isDown = true;
			clearTimeout(relT);
			clearTimeout(deferT);
			relT = setTimeout(() => {
				if (!mode) {
					relHeld();
				}
			}, 180);
			try {
				k.setPointerCapture(e.pointerId);
			} catch (x) {}
			k.classList.add("down");
			try {
				navigator.vibrate && navigator.vibrate(4);
			} catch (x) {}
			if (deferNote()) {
				deferT = setTimeout(startNote, 100);
			} else {
				startNote();
			}
		});
		k.addEventListener("pointermove", (e) => {
			if (!isDown) {
				return;
			}
			const dx = e.clientX - sx,
				dy = e.clientY - sy;
			if (!started) {
				if (
					!mode &&
					dx >= 16 &&
					dx > 1.5 * Math.abs(dy) &&
					e.timeStamp - st <= 450 &&
					queueable() &&
					qKeyOk(kind, i)
				) {
					mode = "q";
					started = true;
					clearTimeout(deferT);
					clearTimeout(relT);
					tq = performance.now();
					latchMark.delete(id);
					k.classList.add("qhold");
					bendStart(e);
					return;
				} /* silent queue: the note was never sounded */
				if (!mode && dx <= -16 && -dx > 1.5 * Math.abs(dy) && qHas(qt, id)) {
					mode = "x";
					started = true;
					clearTimeout(deferT);
					relDone = true;
					clearTimeout(relT);
					qClear(qt);
					return;
				}
				if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
					startNote();
				} else {
					return;
				}
			}
			if (mode === "q") {
				bendMove(e);
				return;
			}
			if (!heldK[id]) {
				return;
			}

			// a quick upward slide (28 px within a third of a second) holds the key
			if (!latchMark.has(id) && sy - e.clientY >= 28 && e.timeStamp - st <= 330) {
				relHeld();
				holdKey(kind, i);
				if (latchMark.has(id)) {
					try {
						navigator.vibrate && navigator.vibrate(10);
					} catch (x) {}
				}
			}
			if (
				!mode &&
				dx >= 22 &&
				dx > 1.5 * Math.abs(dy) &&
				e.timeStamp - st <= 450 &&
				queueable() &&
				qKeyOk(kind, i)
			) {
				mode = "q";
				clearTimeout(relT);
				tq = performance.now();
				latchMark.delete(id);
				{
					const h = heldK[id] && heldK[id].rec;
					if (h) {
						recCancel(h);
					}
				}
				keyOff(kind, i);
				k.classList.add("qhold");
				bendStart(e);
			} // swipe right: queue it, and time the hold
			else if (!mode && dx <= -22 && -dx > 1.5 * Math.abs(dy) && qHas(qt, id)) {
				mode = "x";
				relDone = true;
				clearTimeout(relT);
				keyOff(kind, i);
				qClear(qt);
			}
		}); // swipe left on a queued key: cancel the queue
		["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
			k.addEventListener(ev, () => {
				if (!isDown) {
					return;
				}
				isDown = false;
				k.classList.remove("down");
				if (mode === "q") {
					mode = "";
					relDone = true;
					k.classList.remove("qhold");
					delete k.dataset.lv;
					delete k.dataset.ld;
					if (AC) {
						const h = (performance.now() - tq) / 1000,
							q = A.q[qt];
						if (h >= 0.25) {
							q.len = clamp(h, 0.25, 8);
						}
						qCommit(qt, {
							id,
							notes: keyNotes(kind, i, qt),
							dur: q.len,
							hold: false,
							bend: bendMel(qt) ? qb : 0,
						});
					}
					qb = 0;
					return;
				}
				if (mode === "x") {
					mode = "";
					return;
				}
				if (!started) {
					/* a quick tap that ended inside the 80 ms: sound it now and let it ring for a short moment */
					startNote();
					relHeld();
					const h = heldK[id];
					setTimeout(() => {
						if (heldK[id] === h) {
							keyOff(kind, i);
						}
					}, 90);
					return;
				}
				mode = "";
				relHeld();
				keyOff(kind, i);
			}),
		);
	}
	buildKeys();
	fitKeys();
	setTimeout(fitKeys, 300);

	/* iOS: when the app is switched away, locked or a system gesture takes the touches, the keys never see their pointerup; let go of every key that is down so no note is left sounding (latched keys stay) */
	function releaseAllKeys() {
		Object.keys(heldK).forEach((id) => {
			if (!latchMark.has(id)) {
				keyOff(id[0], +id.slice(1));
			}
		});
		mobKeys.forEach(([el]) => el.classList.remove("down"));
	}
	document.addEventListener("visibilitychange", () => {
		if (document.hidden) {
			releaseAllKeys();
		}
	});
	window.addEventListener("pagehide", releaseAllKeys);

	// loop
	if (document.fonts && document.fonts.ready) {
		document.fonts.ready.then(() => {
			document.querySelectorAll(".bigknob").forEach(measureLabel);
		});
	}
	window.addEventListener("resize", () =>
		document.querySelectorAll(".bigknob").forEach(measureLabel),
	);
	let last = 0;

	function frame(t) {
		requestAnimationFrame(frame);
		if (t - last < 30) {
			return;
		}
		const dtf = Math.min(6, Math.max(0.5, (t - last) / 33));
		last = t; // dtf: frames are 30-35 ms apart on a good phone, longer on a busy one
		fitScreenCanvas();
		draw(bctx, t, true);
		recFlush(t);
		autoStep(performance.now());
		MOD.sprT.forEach((t) => {
			if (A.bnd[t] === 0) {
				MOD.sprT.delete(t);
				return;
			}
			if (MOD.act && t === S._trk) {
				return;
			}
			if (!aActive(stripId(0, t))) {
				setBend(Math.abs(A.bnd[t]) < 0.03 ? 0 : A.bnd[t] * Math.pow(0.55, dtf), t);
			}
		}); // a bend from the strip springs back to centre (a bend from a MIDI controller stays until the controller lets go)
		{
			const st = document.getElementById("mk-r");
			if (st) {
				const T = MODT[MOD.t],
					v = MOD.t === 0 ? (A.bend + 1) / 2 : T[2]();
				st.style.setProperty("--m", v.toFixed(3));
				const l = document.getElementById("mod-l"),
					lt =
						T[0] +
						(AUC.rec || AUC.armed
							? "  \u00b7  REC"
							: aActive(stripId(MOD.t))
								? "  \u00b7  AUTO"
								: "");
				if (l.textContent !== lt) {
					l.textContent = lt;
				}
				st.querySelector(".mid").style.display = MOD.t === 0 ? "" : "none";
			}
		}
		if (S.glob.akey) {
			const k = currentKey();
			if (k) {
				const ty = k.minor ? 1 : 0;
				if (S.scale.root !== k.root || S.scale.type !== ty) {
					S.scale.root = k.root;
					S.scale.type = ty;
				}
			}
		} // AUTO KEY: the scale follows the detected key
		if ((A.gf = (A.gf || 0) + 1) % 20 === 0) {
			const cv = document.getElementById("big"),
				r = cv.getBoundingClientRect(),
				key = Math.round(r.left) + "|" + Math.round(r.top) + "|" + Math.round(r.width);
			if (key !== A.gk2) {
				A.gk2 = key;
				applyGrid();
			}
		}
		document.body.classList.toggle("gs-seq", S.screen === "seq");
		{
			const pu = UI.grid && S.screen === "seq" ? gridPulse() : null,
				pc = pu ? String(pu.col) : "0",
				pa = pu ? (1 - pu.f) * (1 - pu.f) * 0.9 : 0,
				pas = pa.toFixed(2),
				bn = document.documentElement.style;
			if (bn._pc !== pc) {
				bn._pc = pc;
				bn.setProperty("--pc", pc);
			}
			if (bn._pa !== pas) {
				bn._pa = pas;
				bn.setProperty("--pa", pas);
			}
		}
		const ks = knobs() || [NONE, NONE, NONE, NONE];
		ks.forEach((k, i) => {
			setSlider(
				bigEls[i],
				k.n,
				k.l || "—",
				stepInfo(k),
				k.v != null && k.v !== "" && String(k.v).length <= 7 ? String(k.v) : null,
			);
			slMark(bigEls[i], "k" + i);
		});
		const cur = stepNow();
		const dv = (0.65 * (1 - S.glob.bri / 100)).toFixed(3);
		if (dimEl._v !== dv) {
			dimEl._v = dv;
			dimEl.style.opacity = dv;
		}
		{
			const q = A.q[S.trk],
				pos = {},
				bn = {};
			q.pend.forEach((x, n) => {
				(pos[x.id] = pos[x.id] || []).push(n + 1);
				if (x.bend) {
					bn[x.id] = x.bend;
				}
			});
			q.live.forEach((x) => {
				if (x.b && !bn[x.id]) {
					bn[x.id] = x.b;
				}
			});
			mobKeys.forEach(([el, kind, i]) => {
				const id = kind + i,
					p = pos[id],
					qd = !!p || q.live.some((x) => x.id === id);
				el.classList.toggle("queued", qd);
				if (qd) {
					const tx = p ? p.join(",") : "";
					if (el.dataset.q !== tx) {
						el.dataset.q = tx;
					}
				}
				const bd = qd && bn[id] ? (bn[id] > 0 ? "u" : "d") : "";
				if ((el.dataset.bd || "") !== bd) {
					if (bd) {
						el.dataset.bd = bd;
					} else {
						delete el.dataset.bd;
					}
				}
			});
		} /* a bent step: an arrow under its badge */
		mobKeys.forEach(([el, kind, i]) =>
			el.classList.toggle(
				"lit",
				latch[S.trk].ids.has(kind + i) ||
					latchMark.has(kind + i) ||
					A.q[S.trk].live.some((x) => x.id === kind + i && !x.ended) ||
					(kind === "w"
						? (S.screen === "seq" && !dgOn() && (i === cur || i === S.seq.sel)) ||
							(S.screen === "drum" && i < 8 && t - (S.padHits[i] || -1e9) < 170) ||
							(S.screen === "smp" && i === S.smp.slice)
						: blackLit(i)),
			),
		);
		{
			const beat = 60 / Math.max(30, S.bpm),
				qq = A.q[S.trk];
			for (const id in mobBtns) {
				const b = mobBtns[id],
					on = !!ledOn(id);
				b.classList.toggle("on", on);
				let cp = 0;
				if (on) {
					if (S.playing && (id === "play" || id === "seq" || id === "song" || id === "rec")) {
						cp = beat;
					} /* a lap a beat while the song runs */
					else if (S.playing && id === "arp") {
						cp = stepSec() * 4;
					} /* the arpeggio: a lap every four steps, so a changed RATE shows */
					else if (id === "queue" && (qq.pend.length || qq.live.length)) {
						cp = clamp(qq.len || 0.5, 0.15, 8);
					}
				} /* a queue is playing: a lap per queued step */
				const w = cp ? cp.toFixed(3) : "";
				if (b._cp !== w) {
					b._cp = w;
					if (cp) {
						b.style.setProperty("--cp", w + "s");
					}
					b.classList.toggle("chase", !!cp);
				}
			}
		}
		{
			scaleShare();
			const hl =
					!!S.scale.only && engOf(S.trk) !== "DRUM" && S.screen !== "drum" && S.screen !== "smp",
				kb =
					document.getElementById(
						"mkeys",
					); /* KEY: light the keys that are in the scale, dim the others */
			if (kb) {
				kb.classList.toggle("kh", hl);
				const sc = SCALES[S.scale.type][1],
					root = S.scale.root,
					tr = S.glob.gtr;
				mobKeys.forEach(([el, kind, i]) => {
					let c = "";
					if (hl) {
						const pc = ((((kind === "w" ? WH[i] : BL[i]) + tr - root) % 12) + 12) % 12;
						c =
							pc === 0
								? "sin sroot"
								: sc.includes(pc)
									? "sin"
									: S.scale.only
										? "sout sblock"
										: "sout";
					}
					if (el._sc !== c) {
						el._sc = c;
						el.classList.remove("sin", "sout", "sroot", "sblock");
						if (c) {
							c.split(" ").forEach((x) => el.classList.add(x));
						}
					}
				});
			}
		}
		if (mobDials.master) {
			setSlider(mobDials.master, S.vol / 100);
			setSlider(
				mobDials.select,
				(S.bpm - 30) / 270,
				selInfo() ? "PAGE" : "TEMPO",
				selInfo(),
				selInfo() ? null : String(S.bpm),
			);
			setSlider(mobDials.presets, 0, null, { N: PRESETS.length, i: S.preset, num: S.preset + 1 });
			{
				const en = engOf(S.trk);
				if (en === "FM") {
					setSlider(mobDials.algorithm, 0, null, { N: 32, i: S.alg - 1, num: S.alg });
				} else if (en === "ANA") {
					setSlider(mobDials.algorithm, 0, null, { N: 4, i: S.ana.w2, num: S.ana.w2 + 1 });
				} else {
					setSlider(mobDials.algorithm, 0, null, null, "");
				}
			}
			/* what ALGO turns on this track: the FM algorithm, the analog OSC 2 wave, or nothing */ for (const id in mobDials) {
				slMark(mobDials[id], id);
			}
		}
		flushMeasure();
	}
	S.t0 = performance.now();
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
