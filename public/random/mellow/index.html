			}
			v.killed = true;
			v.done = true;
			const tt = Math.max(t, AC.currentTime);
			r.gain.setTargetAtTime(0, tt, 0.008);
			v.endT = tt + 0.1;
			v.stopAt(v.endT);
		};
		L.push({ v, m });
		return v;
	}

	/* Wavetable. Bank 0 (CHOIR) is the original formula. Banks 1-5 are 8 frames x 32 harmonics of 8-bit amplitudes (all sine phase) that POSITION morphs through smoothly: 256 bytes a bank, 1,280 bytes for the five (constant tables in flash on the device; here the recipes below write them once at first use). WARP bends the waveform's phase, DRIVE is a tanh waveshaper on one 256-sample cycle, then the cycle is read back as 32 harmonics (about 25,000 multiply-adds, only when a setting changed) and scaled to a fixed RMS, so every bank, position and warp plays at the same loudness. */
	const WTN = ["CHOIR", "VOWEL", "REED", "GLASS", "ORGAN", "SYNC"],
		WRMS = 0.79;
	let WTB = null;

	function wtBanks() {
		if (WTB) {
			return WTB;
		}
		const H = 32,
			F = 8,
			mk = (fn) => {
				const t = new Uint8Array(H * F);
				for (let f = 0; f < F; f++) {
					const a = new Float64Array(H + 1);
					fn(f, a);
					let mx = 1e-9;
					for (let h = 1; h <= H; h++) {
						mx = Math.max(mx, a[h]);
					}
					for (let h = 1; h <= H; h++) {
						t[f * H + h - 1] = Math.round(255 * Math.sqrt(Math.max(0, a[h]) / mx));
					}
				}
				return t;
			};
		const VW = [
				[730, 1090, 2440],
				[530, 1840, 2480],
				[270, 2290, 3010],
				[570, 840, 2410],
				[300, 870, 2240],
				[660, 1720, 2410],
				[490, 1350, 1690],
				[800, 1150, 2800],
			],
			PD = [0, 0.5, 0.4, 0.3, 0.2, 0, 0, 0.1];
		const sets = [
			[
				[1, 1],
				[2, 0.5],
				[3, 0.25],
			],
			[
				[1, 1],
				[3, 0.6],
				[4, 0.5],
				[5, 0.4],
			],
			[
				[1, 0.7],
				[4, 1],
				[5, 0.8],
				[6, 0.3],
			],
			[
				[2, 0.6],
				[3, 0.5],
				[5, 1],
				[7, 0.5],
			],
			[
				[1, 0.4],
				[5, 0.9],
				[6, 0.7],
				[8, 0.6],
				[9, 0.5],
			],
			[
				[3, 1],
				[7, 0.8],
				[8, 0.6],
				[11, 0.5],
				[13, 0.4],
			],
			[
				[4, 1],
				[7, 0.8],
				[9, 0.7],
				[11, 0.6],
				[13, 0.5],
				[17, 0.4],
				[19, 0.3],
			],
		];
		const og = [
			[[1, 1]],
			[
				[1, 1],
				[2, 0.7],
			],
			[
				[1, 1],
				[2, 0.6],
				[4, 0.5],
			],
			[
				[1, 1],
				[2, 0.8],
				[3, 0.7],
				[4, 0.6],
				[5, 0.4],
				[6, 0.4],
				[8, 0.3],
			],
			[
				[1, 1],
				[2, 0.2],
				[3, 0.9],
				[4, 0.1],
			],
			[
				[1, 0.6],
				[2, 0.5],
				[4, 0.9],
				[8, 0.8],
				[16, 0.6],
				[12, 0.4],
				[6, 0.5],
			],
		];
		let sd = 12345;
		const rnd = () => (sd = (sd * 1664525 + 1013904223) >>> 0) / 4294967296;
		const T = new Float64Array(2048),
			C = new Float64Array(2048);
		for (let i = 0; i < 2048; i++) {
			T[i] = Math.sin((2 * Math.PI * i) / 2048);
			C[i] = Math.cos((2 * Math.PI * i) / 2048);
		}
		return (WTB = [
			mk((f, a) => {
				for (let h = 1; h <= H; h++) {
					let s = 0;
					VW[f].forEach((F0, k) => {
						const d = h * 130 - F0;
						s += [1, 0.7, 0.4][k] / (1 + (d * d) / Math.pow(60 + F0 * 0.05, 2));
					});
					a[h] = s / h;
				}
			}), // VOWEL: three formants (A E I O U and between), the fundamental fixed at 130 Hz so the formants sit on harmonic numbers
			mk((f, a) => {
				for (let h = 1; h <= H; h++) {
					a[h] =
						f === 0
							? h % 2
								? 1 / (h * h)
								: 0
							: f === 1
								? h % 2
									? 1 / h
									: 0
								: f === 5
									? 1 / h
									: f === 6
										? (1 / h) * (1 + 4 * Math.exp(-Math.pow((h - 7) / 2.5, 2)))
										: Math.abs(Math.sin(Math.PI * h * PD[f])) / h;
				}
			}), // REED: triangle, square, pulses 40-10%, saw, oboe
			mk((f, a) => {
				if (f < 7) {
					sets[f].forEach(([h, x]) => (a[h] = x));
				} else {
					for (let h = 5; h <= 16; h++) {
						a[h] = 0.3 + rnd() * 0.7;
					}
				}
			}), // GLASS: a few partials, moving up
			mk((f, a) => {
				if (f < 6) {
					og[f].forEach(([h, x]) => (a[h] = x));
				} else if (f === 6) {
					for (let h = 1; h <= 12; h++) {
						a[h] = 1 / h;
					}
				} else {
					[1, 3, 5, 7, 9].forEach((h) => (a[h] = 1 / Math.pow(h, 0.8)));
				}
			}), // ORGAN: drawbar registrations
			mk((f, a) => {
				const r = [1, 1.5, 2, 2.5, 3, 3.7, 4.6, 5.5][f],
					N = 2048,
					x = new Float64Array(N);
				for (let n = 0; n < N; n++) {
					const u = (r * n) / N;
					x[n] = 2 * (u - Math.floor(u)) - 1;
				}
				for (let h = 1; h <= H; h++) {
					let c = 0,
						s = 0;
					for (let n = 0; n < N; n++) {
						c += x[n] * C[(h * n) & 2047];
						s += x[n] * T[(h * n) & 2047];
					}
					a[h] = Math.hypot(c, s) / N;
				}
			}),
		]); // SYNC: a saw hard-synced to a faster one, ratio 1 to 5.5
	}

	function wtAmps(tab, pos, tone) {
		const B = wtBanks()[tab - 1],
			p = (clamp(pos, 0, 127) / 127) * 7,
			i = Math.min(6, Math.floor(p)),
			fr = p - i,
			a = new Float64Array(33);
		for (let h = 1; h <= 32; h++) {
			const u0 = B[i * 32 + h - 1] / 255,
				u1 = B[(i + 1) * 32 + h - 1] / 255;
			a[h] = (u0 * u0 * (1 - fr) + u1 * u1 * fr) * Math.exp(-h / (6 + tone / 10));
		}
		return a;
	}
	let WTC = null;

	function wtWave(w) {
		const tab = clamp(Math.round(fin(w.tab, 0)), 0, WTN.length - 1),
			pos = clamp(fin(w.pos, 52), 0, 127),
			warp = clamp(fin(w.warp, 0), 0, 99),
			drv = clamp(fin(w.drv, 0), 0, 99),
			tone = clamp(fin(w.tone, 64), 0, 99);
		if (!tab) {
			const k = Math.round((pos / 127) * 13) / 13,
				n = 32,
				re = new Float32Array(n),
				im = new Float32Array(n); // the original formula
			for (let h = 1; h < n; h++) {
				let a = h === 1 ? 1 : 1 / h;
				if (h % 2 === 0) {
					a *= (warp / 99) * 1.2;
				} else if (h > 2) {
					a *= k * (1 + drv / 40);
				}
				a *= Math.exp(-h / (6 + tone / 10));
				im[h] = a;
			}
			return AC.createPeriodicWave(re, im);
		}
		const a = wtAmps(tab, pos, tone),
			re = new Float32Array(33),
			im = new Float32Array(33);
		if (!WTC) {
			WTC = new Float64Array(256);
			for (let i = 0; i < 256; i++) {
				WTC[i] = (2 * Math.PI * i) / 256;
			}
		}
		if (warp > 0 || drv > 0) {
			const N = 256,
				x = new Float64Array(N),
				mw = (warp / 99) * 0.9;
			let pk = 1e-9;
			for (let n = 0; n < N; n++) {
				const p0 = WTC[n],
					ph = p0 + mw * Math.sin(p0);
				let s = 0;
				for (let h = 1; h <= 32; h++) {
					if (a[h] > 1e-3) {
						s += a[h] * Math.sin(h * ph);
					}
				}
				x[n] = s;
				if (Math.abs(s) > pk) {
					pk = Math.abs(s);
				}
			}
			if (drv > 0) {
				const g = 1 + (drv / 99) * 5,
					tg = Math.tanh(g);
				for (let n = 0; n < N; n++) {
					x[n] = Math.tanh((g * x[n]) / pk) / tg;
				}
			}
			for (let h = 1; h <= 32; h++) {
				let c = 0,
					s = 0;
				for (let n = 0; n < N; n++) {
					const k = (h * n) & 255,
						ph = WTC[k];
					c += x[n] * Math.cos(ph);
					s += x[n] * Math.sin(ph);
				}
				re[h] = (2 * c) / N;
				im[h] = (2 * s) / N;
			}
		} else {
			for (let h = 1; h <= 32; h++) {
				im[h] = a[h];
			}
		}
		let e = 0;
		for (let h = 1; h <= 32; h++) {
			e += re[h] * re[h] + im[h] * im[h];
		}
		const sc = e > 1e-12 ? WRMS / Math.sqrt(e / 2) : 1;
		for (let h = 1; h <= 32; h++) {
			re[h] = fin(re[h] * sc, 0);
			im[h] = fin(im[h] * sc, 0);
		}
		try {
			return AC.createPeriodicWave(re, im, { disableNormalization: true });
		} catch (e2) {
			return AC.createPeriodicWave(re, im);
		}
	}

	/* waves are kept per track in a small cache (12 settings), so a note on never rebuilds a wave it has played before */
	function wtGet(trk, w) {
		const M = A.wtm || (A.wtm = [new Map(), new Map(), new Map(), new Map()]),
			key = (w.tab | 0) + "|" + w.pos + "|" + w.warp + "|" + w.drv + "|" + w.tone,
			c = M[trk];
		let x = c.get(key);
		if (!x) {
			x = wtWave(w);
			c.set(key, x);
			if (c.size > 12) {
				c.delete(c.keys().next().value);
			}
		}
		return x;
	}

	function wtVoice(trk, m, vel, t0) {
		m = fin(m, 60);
		vel = clamp(fin(vel, 1), 0, 1);
		t0 = fin(t0, AC.currentTime);
		const w = TK(trk).wt,
			f = mf(m),
			dr = (fin(TK(trk).mac[3], 0) / 127) * 30,
			tone = clamp(fin(w.tone, 64), 0, 99),
			L = capVoices(trk, m, t0),
			pw = wtGet(trk, w);
		const nodes = [],
			oscs = [],
			fmax = Math.min(20000, AC.sampleRate * 0.45),
			flt = AC.createBiquadFilter();
		flt.type = "lowpass";
		flt.frequency.value = Math.min(
			fmax,
			Math.max(
				600 * Math.pow(20, tone / 99) * Math.pow(Math.max(1, f / 262), 0.5),
				Math.min(1.6 * f, fmax),
			),
		);
		flt.Q.value = 0.8; // tone follows high notes by half and never closes on the fundamental
		const g = AC.createGain();
		g.gain.value = 0;
		[-7, 7].forEach((d) => {
			const o = AC.createOscillator(),
				d0 = d + tuneC() + (Math.random() - 0.5) * dr;
			o.setPeriodicWave(pw);
			o.frequency.value = f;
			o.detune.value = d0;
			wander(o.detune, d0, dr, t0);
			bendHook(o.detune, trk);
			o.connect(flt);
			oscs.push(o);
			nodes.push(o);
		});
		const r = AC.createGain();
		flt.connect(g);
		g.connect(r);
		r.connect(vbus(trk));
		nodes.push(flt, g, r);
		g.gain.setValueAtTime(0, t0);
		g.gain.linearRampToValueAtTime(vel * 0.13, t0 + 0.12);
		oscs.forEach((o) => o.start(t0));
		const v = mkv(oscs, nodes, trk);
		v.off = (t) => {
			if (v.done) {
				return;
			}
			v.done = true;
			const tt = Math.max(t, AC.currentTime);
			r.gain.setTargetAtTime(0, tt, 0.4);
			r.gain.setTargetAtTime(0, tt + 2, 0.03);
			v.endT = tt + 2.4;
			v.stopAt(v.endT);
		};
		v.kill = (t) => {
			if (v.killed) {
				return;
			}
			v.killed = true;
			v.done = true;
			const tt = Math.max(t, AC.currentTime);
			r.gain.setTargetAtTime(0, tt, 0.008);
			v.endT = tt + 0.1;
			v.stopAt(v.endT);
		};
		L.push({ v, m });
		return v;
	}

	/* Sampler voice. One voice per track: a new trigger fades the one still sounding over 8 ms (linear, from its own choke gain, so the envelope underneath is never edited mid-ramp), Each voice is source -> envelope gain -> choke gain -> the track's soft bus (hard ceiling 1.0), so any number of triggers cannot push the track above full scale. The envelope is a 4 ms attack and an 8 ms release scaled down on very short slices (high pitch), so a slice never ends on a step. The slice is played with start(when, offset) and stopped at its end instead of start(when, offset, duration), which older iOS Safari mishandles when the rate isn't 1; the rate is kept in 0.05-8. Nodes are disconnected the moment the source ends. */
	function sampVoice(trk, slice, m, vel, t0) {
		ensureBuf();
		const s = TK(trk).smp,
			rev = s.dir === 1 || (s.dir === 2 && (A.ping = !A.ping)),
			buf = rev ? A.smpRev : A.smpBuf,
			sl = buf.duration / 8,
			sli = clamp(Math.round(isFinite(slice) ? slice : 0), 0, 7),
			si = rev ? 7 - sli : sli,
			st = clamp(isFinite(s.st) ? s.st : 0, 0, 99),
			off = si * sl + (st / 99) * sl * 0.8,
			dur = sl * (1 - (st / 99) * 0.8);
		if (!isFinite(t0)) {
			t0 = AC.currentTime;
		}
		const L = A.sv || (A.sv = [[], [], [], []]),
			V = L[trk];
		for (let i = V.length - 1; i >= 0; i--) {
			if (V[i].end < t0 - 0.5) {
				V.splice(i, 1);
			}
		}
		const src = AC.createBufferSource(),
			g = AC.createGain(),
			c = AC.createGain(),
			rate = clamp(
				Math.pow(
					2,
					((isFinite(m) ? m : 60) - 60) / 12 +
						(isFinite(s.pitch) ? s.pitch : 0) / 12 +
						tuneC() / 1200,
				) || 1,
				0.05,
				8,
			),
			tl = dur / rate,
			tEnd = t0 + tl,
			vv = clamp(+vel || 0, 0, 1),
			lvl = 0.8 * vv,
			at = Math.min(0.004, tl * 0.25),
			rl = Math.min(0.008, tl * 0.25);
		src.buffer = buf;
		src.playbackRate.value = rate;
		if (A.bendCs[trk] && src.detune) {
			bendHook(src.detune, trk);
			src.addEventListener("ended", () => bendFree(src.detune, trk));
		}
		g.gain.setValueAtTime(0, t0);
		g.gain.linearRampToValueAtTime(lvl, t0 + at);
		g.gain.setValueAtTime(lvl, tEnd - rl);
		g.gain.linearRampToValueAtTime(0, tEnd);
		src.connect(g);
		g.connect(c);
		c.connect(softBus("sbus", trk));
		src.start(t0, off);
		src.stop(tEnd + 0.005);
		const v = {
			dead: false,
			done: false,
			t: t0,
			end: tEnd,
			chopped: false,
			c,
			cutAt(tc, ft) {
				if (v.chopped || tc >= v.end) {
					return;
				}
				v.chopped = true;
				c.gain.setValueAtTime(1, tc);
				c.gain.linearRampToValueAtTime(0, tc + ft);
			},
		};
		v.cut = v.steal = () => {
			v.off(AC.currentTime);
		}; /* STOP / keyboard voice cap: let go now */
		v.off = (t) => {
			if (v.done) {
				return;
			}
			v.done = true;
			const tc = Math.max(t, AC.currentTime);
			if (!v.chopped) {
				v.chopped = true;
				c.gain.setValueAtTime(1, tc);
				c.gain.setTargetAtTime(0, tc, 0.012);
			}
		};
		/* steal: anything on this track that started earlier and is still sounding at t0 is faded out (this works for triggers that arrive out of time order too) */
		V.forEach((o) => {
			if (o.t < t0 - 0.001 && o.end > t0) {
				o.cutAt(t0, 0.008);
			}
		});
		V.push(v);
		if (V.length > 12) {
			V.shift();
		}
		src.onended = () => {
			v.done = true;
			v.dead = true;
			[src, g, c].forEach((n) => {
				try {
					n.disconnect();
				} catch (e) {}
			});
			const k = V.indexOf(v);
			if (k >= 0) {
				V.splice(k, 1);
			}
		};
		A.smpLast[trk] = v;
		return v;
	}

	/* Drums. Every pad is cheap per-sample maths that a 360 MHz MCU can run: sine oscillators with an exponential pitch drop, noise (one LFSR / white buffer) through one or two biquads, one-pole exponential envelopes, and for the hats six squares plus noise (a 0.5 s loop with a whole number of cycles per square, so it has no seam; on the device six phase counters and an LFSR). A hit is at most 2 oscillators, 3 biquads and a handful of multiplies per sample, and a pad is monophonic (a new hit of the same pad, or a closed HAT on the OPEN hat, fades the old one out in 4-12 ms instead of stacking). CRUSH is a real bit-depth quantiser (11 bits down to 7) in front of the one-pole low-pass; velocity changes level (^1.3), brightness and each pad's click/noise content. A hit is 5-11 Web Audio nodes (the first versions needed 7-16) and no buffer is allocated per hit: the white and metal buffers and the quantiser / saturator curves are built once. */
	/* Each engine's output goes through one soft-clip bus per track (linear up to 0.7, tanh knee, hard ceiling 1.0 for any input, even if every pad of a kit is hit at once): a sum of drum hits or sample voices can never reach the master above full scale. On the device it is one table lookup (or a rational function) per sample. */
	function softBus(key, trk) {
		const B = A[key] || (A[key] = []);
		if (!B[trk]) {
			const pre = AC.createGain(),
				sh = AC.createWaveShaper(),
				c =
					A.sbc ||
					(A.sbc = (() => {
						const N = 4097,
							c = new Float32Array(N);
						for (let i = 0; i < N; i++) {
							const u = (i / (N - 1)) * 2 - 1,
								x = Math.abs(u) * 4,
								y = x < 0.7 ? x : 0.7 + 0.3 * Math.tanh((x - 0.7) / 0.3);
							c[i] = u < 0 ? -y : y;
						}
						return c;
					})());
			pre.gain.value = 0.25;
			sh.curve = c;
			pre.connect(sh);
			sh.connect(A.tr[trk]);
			B[trk] = pre;
		}
		return B[trk];
	}

	function drumHit(trk, pad, vel, t) {
		/* hits of one track within 120 ms are bounded: past 16 they are dropped, past 8 they get a little quieter (a drum-grid step with all 8 pads is untouched), so a mashed pad can't pile up nodes or level */
		{
			if (A.dhAC !== AC) {
				A.dhAC = AC;
				A.dh = [[], [], [], []];
			}
			const D = A.dh,
				tn = isFinite(t) ? t : AC.currentTime,
				H = (D[trk] = D[trk].filter((h) => Math.abs(h - tn) < 0.12));
			if (H.length >= 16) {
				return null;
			}
			vel = vel / Math.sqrt(1 + Math.max(0, H.length - 8) * 0.15);
			H.push(tn);
		}
		const D = TK(trk).drum,
			num = (x, d) => (isFinite(x) ? x : d),
			tf = Math.pow(2, (num(D.tune[pad], 50) - 50) / 50),
			dc = clamp(num(D.dec[pad], 40), 0, 99) / 99,
			cr = clamp(num(D.crush[pad], 30), 0, 99) / 99,
			nodes = [],
			vv = clamp(num(+vel, 0), 0, 1),
			v2 = vv * vv;
		let endT;
		if (!isFinite(t)) {
			t = AC.currentTime;
		}
		endT = t + 0.1;
		const dv = A.dv || (A.dv = [[], [], [], []]),
			chk = (p, ft) => {
				const o = dv[trk][p];
				if (o && o.t < t - 0.001) {
					const g = o.g.gain;
					g.setValueAtTime(o.lvl, t);
					g.linearRampToValueAtTime(0, t + ft);
				}

			});
		} /* an older save is just the patterns (one bar each) */
		/* every cell is coerced: a note is a whole number -1..127, a gate 0..12800 (percent of a step), a velocity 0..127; anything else (a string, null, NaN, a missing array) becomes an empty step as emptyPat() makes it */
		const cell = (x, a, b, e) => (typeof x === "number" && isFinite(x) ? clamp(x, a, b) : e);
		d.slice(0, 16).forEach((P, pi) => {
			if (Array.isArray(P)) {
				P.slice(0, 4).forEach((q, t) => {
					const o = S.pats[pi] && S.pats[pi][t];
					if (!o || !q || !Array.isArray(q.st)) {
						return;
					}
					const g = Array.isArray(q.gate) ? q.gate : [],
						v = Array.isArray(q.vel) ? q.vel : [];
					for (let i = 0; i < q.st.length && i < SMAX; i++) {
						o.st[i] = Math.round(cell(q.st[i], -1, 127, -1));
						o.gate[i] = cell(g[i], 0, 12800, 50);
						o.vel[i] = cell(v[i], 0, 127, 100);
					}
					if (t === DT) {
						dgRestore(o, q);
					}
				});
			}
		});
		S.seqs.forEach((q) => {
			if (q.sel >= nst()) {
				q.sel = nst() - 1;
			}
		});
	}

	function undoPush(lb) {
		const js = songSnap(true),
			tail = UND.u.length ? UND.u[UND.u.length - 1] : null;
		if (tail !== null && tail.endsWith("\x1f" + js)) {
			return;
		}
		UND.u.push((lb || "") + "\x1f" + js);
		if (UND.u.length > 16) {
			UND.u.shift();
		}
		UND.r.length = 0;
	}
	const UNDO_TXT = (e) => {
		const i = e.indexOf("\x1f");
		return [e.slice(0, i), e.slice(i + 1)];
	};

	function undo() {
		if (!UND.u.length) {
			toast("NOTHING TO UNDO");
			return;
		}
		const [lb, js] = UNDO_TXT(UND.u.pop());
		UND.r.push(lb + "\x1f" + songSnap(true));
		songRestore(js, true);
		afterRestore();
		toast("UNDO" + (lb ? " " + lb : "") + "  \u00b7  " + UND.u.length + " LEFT");
	}

	function redo() {
		if (!UND.r.length) {
			toast("NOTHING TO REDO");
			return;
		}
		const [lb, js] = UNDO_TXT(UND.r.pop());
		UND.u.push(lb + "\x1f" + songSnap(true));
		songRestore(js, true);
		afterRestore();
		toast("REDO" + (lb ? " " + lb : "") + "  \u00b7  " + UND.r.length + " LEFT");
	}

	// after undo or redo the sound may have changed: tell the audio engine, drop the glow
	function afterRestore() {
		S.hot = null;
		S.pop = null;
		pT = 0;
		pK = "";
		if (AC) {
			syncSoon();
			audioSync();
		}

	} /* pT / pK: a knob turn right after an undo is a NEW step (it used to join the undone gesture, push nothing and be thrown away by the next redo) */
	// parameter edits (a knob turn, a graph drag, a swipe on a value) are undone as one step per gesture: a turn that carries on within 0.65 s is the same step
	let pT = 0,
		pK = "";

	function pPush(key, lb) {
		const t = performance.now();
		if (t - pT > 650 || key !== pK) {
			undoPush(lb);
		}
		pT = t;
		pK = key;
	}

	/* The whole project (patterns, lengths, song chain, automation AND every track's sound and settings, `songSnap(true)`) is written to localStorage (the stand-in for flash)
   by `autoSave`: every 4 s while something changed, whenever the page is hidden or closed, and when a recording stops or a file is imported. It is skipped while a
   bounce is running (the bounce borrows the song state) and in a locked tab. The JSON is compared first, so an idle page writes nothing. */
	let SAVED = "";

	function autoSave() {
		try {
			if (
				(typeof tabLocked !== "undefined" && tabLocked) ||
				(typeof BNC !== "undefined" && BNC.on)
			) {
				return false;
			}
			const js = JSON.stringify({
				p: songSnap(true),
				full: 1,
				bpm: S.bpm,
				rate: S.rate,
				swing: S.swing,
				sgate: S.sgate,
			});
			if (js === SAVED) {
				return false;
			}
			localStorage.setItem("mellow-song", js);
			SAVED = js;
			return true;
		} catch (e) {
			return false;
		}
	}

	function saveSong() {
		autoSave();
	}
	setInterval(autoSave, 4000);
	document.addEventListener("visibilitychange", () => {
		if (document.hidden) {
			autoSave();
		}
	});
	addEventListener("pagehide", autoSave);

	function loadSong() {
		try {
			const d = JSON.parse(localStorage.getItem("mellow-song"));
			if (d && typeof d.p === "string") {
				songRestore(d.p, !!d.full);
				if (d.full) {
					try {
						dgForceKit();
					} catch (e) {}
				}
				if (d.bpm >= 30 && d.bpm <= 300) {
					S.bpm = d.bpm;
				}
				if (d.rate >= 0 && d.rate <= 2) {
					S.rate = d.rate | 0;
				}
				if (d.swing >= 50 && d.swing <= 75) {
					S.swing = d.swing;
				}
				if (d.sgate >= 20 && d.sgate <= 100) {
					S.sgate = d.sgate;
				}
			}
		} catch (e) {}
	}

	function clickAt(t, acc) {
		if (!AC) {
			return;
		}
		const o = AC.createOscillator(),
			g = AC.createGain();
		o.frequency.value = acc ? 1500 : 1000;
		g.gain.setValueAtTime(0, t);
		g.gain.linearRampToValueAtTime(acc ? 0.28 : 0.18, t + 0.002);
		g.gain.exponentialRampToValueAtTime(0.0008, t + 0.05);
		o.connect(g);
		g.connect(A.master);
		o.start(t);
		o.stop(t + 0.06);
		o.onended = () => {
			try {
				g.disconnect();
			} catch (e) {}
		};
	}

	function startCountIn(ext) {
		if (!AC) {
			return;
		}
		stopSeq();
		S.seqEn = true;
		S.rec = true;
		S.playing = true;
		S.patNext = -1;
		S.recExt = !!ext;
		songStart();
		if (S.screen !== "seq") {
			S.screen = "seq";
		}
		const beat = ((60 / S.bpm) * 4) / TSIGS[S.ts][1],
			n = TSN() * S.glob.cin,
			t0 = AC.currentTime + 0.08;
		S.countdown = n ? { t0, beat, n, next: 0 } : null;
		A.t0 = t0 + n * beat;
		A.sn = 0;
		S.t0 = performance.now() + (A.t0 - AC.currentTime) * 1000;
		undoPush("RECORDING");
	}

	// RECORD LENGTH = GROWS (extend recording): the pattern is not looped, it grows a bar at a time as you play past its end; stopping cuts it back to the
	// last bar you reached and saves it.
	function extendOne() {
		const L = S.plen[S.pat];
		if (L >= maxBars()) {
			S.recExt = false;
			toast("LONGEST LENGTH: NOW LOOPING");
			return false;
		}
		const a = L * SPB(),
			b = (L + 1) * SPB();
		S.plen[S.pat] = L + 1;
		S.seqs.forEach((q, t) => {
			if (t === DT) {
				dgClearCols(q, a, b);
			}
			if (S.tl[S.pat][t]) {
				return;
			}
			for (let i = a; i < b; i++) {
				q.st[i] = -1;
				q.gate[i] = 50;
				q.vel[i] = 100;
			}
		});
		return true;
	}

	function trimToPlayed() {
		if (!AC) {
			return;
		}
		const lat = AC.outputLatency || AC.baseLatency || 0,
			played = Math.max(0, (AC.currentTime - lat - A.t0) / stepSec());
		const bars = clamp(Math.ceil(played / SPB() - 1e-6), 1, maxBars());
		S.plen[S.pat] = Math.min(S.plen[S.pat], bars);
		S.seqs.forEach((q) => {
			if (q.sel >= nst()) {
				q.sel = nst() - 1;
			}
		});
	}

	function finishRec() {
		S.countdown = null;
		if (S.recExt) {
			S.recExt = false;
			trimToPlayed();
		}
		saveSong();
		toast("SAVED");
	}

	// ---------- the drum track and its grid ----------
	// T4 (index 3, DT) is ALWAYS the drum track: it can only hold DRUM kits (presets of other engines are hidden and refused on it), and the other three tracks are untouched.
	// SEQ on T4 opens the DRUM GRID instead of the step sequencer: one row per pad (KICK SNARE HAT OPEN CLAP RIM SHAKER PERC), one column per step, so every drum part is
	// visible at once and several can sit on one step. The grid lives on T4's pattern object (q.dg, flat: pad * SMAX + step, a velocity 0..127, 0 = no hit), so it follows the 16 patterns,
	// song mode, per-track length, swing, undo, save, export and bounce like any track's data. A hit is a one-shot (no gate, no ratchet). T4's old note arrays (q.st) are folded into
	// the grid once and stay empty. Hardware: 8 x 128 x 16 patterns x 1 byte = 16 KB, replacing T4's 3 byte-per-step note arrays (6 KB); it packs to 8 KB at 4-bit velocity.
	// The screen, its touches and the white keys are prototype conveniences for what K1-K4 do on SEQ page 3 (STEP, PAD, VELOCITY, CLEAR): `dgKnobs`.
	const DT = 3,
		DGN = 8,
		DGL = [50, 100, 127],
		DGLN = ["SOFT", "MED", "LOUD"],

		DGM = [36, 38, 42, 46, 39, 37, 70, 56]; // DGM: the pads as General MIDI drum notes (kick, snare, closed hat, open hat, clap, side stick, shaker, cowbell)

	const DG = { row: 1, lvl: 1, arm: null, log: null, fill: -1 }; // the selected pad row, the brush level (new hits), an armed clear chip, an optional log of played hits (tests)
	const DGX0 = 44,
		DGW = 192,
		DGY0 = 38,
		DGRH = 12,

		DGB = 139; // LCD pixels: where the 16 columns start and how wide they are, the first row and its height, the bar strip
	const dgOn = () => S.trk === DT && engOf(DT) === "DRUM";
	const presetFits = (i) => S.trk !== DT || PRESETS[i][2] === "DRUM";
	const dgLvl = (v) => (v <= 74 ? 0 : v <= 113 ? 1 : 2);
	const dgCW = () => Math.max(4, Math.floor(DGW / SPB())),
		dgX = () => DGX0 + Math.floor((DGW - dgCW() * SPB()) / 2);

	function dgGridGeom() {
		const cw = dgCW();
		return {
			cell: unitSteps() * cw,
			minor: S.gu === 1 ? BSTEPS() * cw : cw,
			ax: dgX() - 1,
			ay: DGY0 + DGN * DGRH,
		};
	}

	function dgRefuse() {
		toast("T4 IS THE DRUM TRACK: KITS ONLY");
	}

	// an older project could hold any engine on T4: put the default kit there
	function dgForceKit() {
		if (engOf(DT) === "DRUM") {
			return false;
		}
		const k = Math.max(
				0,
				PRESETS.findIndex((p) => p[0] === "DUSTY KIT"),
			),
			t0 = S._trk;
		S.tracks[DT].pre = k;
		S._trk = DT;
		applyPreset(k);
		S._trk = t0;
		bindTrack(t0);
		return true;
	}

	// ---- data: migration of the old single-note step data, undo / save snapshots
	const dgPadOf = (n) => (n >= 36 && n <= 43 ? n - 36 : ((n % 8) + 8) % 8); // the note a drum step used to hold -> its pad (stepPlay played note - 36; anything else folds mod 8 like noteVoice)
	function dgFold(q, n) {
		const g = q.dg;
		for (let i = 0; i < n; i++) {
			const m = q.st[i];
			if (m >= 0) {
				if (q.vel[i] > 0) {
					g[dgPadOf(m) * SMAX + i] = clamp(Math.round(q.vel[i]), 1, 127);
				}
				q.st[i] = -1;
			}
		}
	}

	function dgMigrateAll() {
		S.pats.forEach((P) => {
			const q = P[DT];
			if (!q.dg) {
				q.dg = new Uint8Array(DGN * SMAX);
			}
			dgFold(q, Math.min(q.st.length, SMAX));
		});
	}

	function dgSnap(q, t, n) {
		if (t !== DT || !q.dg) {
			return {};
		}
		const o = [];
		for (let r = 0; r < DGN; r++) {
			for (let j = 0; j < n; j++) {
				const v = q.dg[r * SMAX + j];
				if (v) {
					o.push([r, j, v]);
				}
			}
		}
		return { dg: o };

	} // [pad, step, velocity] for the steps in play
	function dgRestore(o, q) {
		const n = Math.min(q.st.length, SMAX);
		if (!o.dg) {
			o.dg = new Uint8Array(DGN * SMAX);
		}
		const g = o.dg;
		for (let r = 0; r < DGN; r++) {
			g.fill(0, r * SMAX, r * SMAX + n);
		}
		if (Array.isArray(q.dg)) {
			q.dg.forEach((h) => {
				if (!Array.isArray(h)) {
					return;
				}
				const r = h[0] | 0,
					j = h[1] | 0,
					v = h[2] | 0;
				if (r >= 0 && r < DGN && j >= 0 && j < n && v > 0) {
					g[r * SMAX + j] = Math.min(127, v);
				}
			});
		} else {
			dgFold(o, n);
		}

	} // an older save has only notes: they become hits
	function dgClearCols(q, a, b) {
		if (!q.dg) {
			return;
		}
		for (let r = 0; r < DGN; r++) {
			q.dg.fill(0, r * SMAX + a, r * SMAX + b);
		}
	}

	// ---- playing: every hit of the step, through drumHit with its velocity (swing and per-track length come with `when` and `k`), and out as MIDI
	function dgMidi(t, r, v, when) {
		const ch = midiCh(t);
		midiSend([0x90 | ch, DGM[r], clamp(v, 1, 127)], when);
		midiSend([0x80 | ch, DGM[r], 0], when + 0.08, 1);
	}

	function drumStep(t, k, when) {
		const q = S.seqs[t],
			g = q.dg,
			i = k % nstT(t);
		if (!g) {
			return;
		}
		if (S.rec && S.glob.rmode === 1 && !S.recExt && t === S.trk && !A.recW[t].has(i)) {
			dgClearCols(q, i, i + 1);
			return;
		} /* REPLACE: what the playhead passes is wiped unless it was just played in this pass */
		const skip = A.dmCur | 0;
		for (let r = 0; r < DGN; r++) {
			const v = g[r * SMAX + i];
			if (!v || (skip >> r) & 1) {
				continue;
			}
			if (A.recLive.length && recLiveSkip(t, i, when, r)) {
				continue;
			}
			drumHit(t, r, v / 127, when);
			dgMidi(t, r, v, when);
			if (DG.log) {
				DG.log.push({ step: i, pad: r, vel: v, when, pat: S.pat, pos: S.song.pos });
			}
		}
	}

	// the grid of one pattern as MIDI file events (General MIDI drum notes on channel 10)
	function dgMidiEv(evs, base, steps, len, pat, tps, dm = 0) {
		const g = S.pats[pat][DT].dg;
		if (!g) {
			return;
		}
		const dur = Math.max(1, Math.round(tps * 0.5));
		for (let j = 0; j < steps; j++) {
			const i = j % len;
			for (let r = 0; r < DGN; r++) {
				const v = g[r * SMAX + i];
				if (!v || (dm >> r) & 1) {
					continue;
				}
				const on = Math.round((base + j) * tps);
				evs.push(
					{ k: on, o: 1, b: [0x99, DGM[r], clamp(v, 1, 127)] },
					{ k: on + dur, o: 0, b: [0x89, DGM[r], 0] },
				);
			}
		}
	}

	// REC while playing: a pad you hit lands in the grid at the playhead (several pads on one step are fine)
	function dgRec(q, i, n, vel) {
		q.dg[clamp(n - 36, 0, 7) * SMAX + i] = clamp(Math.round(vel * 127), 1, 127);
		A.recW[DT].add(i);
	}

	// ---- editing (touch, knobs and white keys all end up here)
	const dgAud = (r, v) => {
		if (!AC) {
			return;
		}
		const t = AC.currentTime + 0.005;
		drumHit(DT, r, v / 127, t);
		dgMidi(DT, r, v, t);
		S.padHits[r] = performance.now();
	};

	function dgClearRow(r = DG.row) {
		undoPush("CLEAR ROW");
		const g = S.seqs[DT].dg;
		g.fill(0, r * SMAX, (r + 1) * SMAX);
		toast("CLEARED " + PADS[r]);

	} /* (the drum track's own pattern, S.seqs[DT]: the CLEAR dialog can outlive a track change) */
	function dgClearStep() {
		undoPush("CLEAR STEP");
		const q = S.seqs[DT];
		dgClearCols(q, q.sel, q.sel + 1);
		toast("CLEARED");
	}

	function dgClearPat() {
		undoPush("CLEAR DRUMS");
		S.seqs[DT].dg.fill(0);
		toast("DRUMS CLEARED");
	}

	function dgClearDlg() {
		S.pop = null;
		S.dlg = {
			t: "CLEAR",
			lines: [
				"CLEAR STEP TURN THE K3",
				"CLEAR ROW TURN THE K2",
				"CLEAR PATTERN TURN THE K4",
				"NEW SONG TURN THE K1",
			],
			k: ["NEW SONG", "ROW", "STEP", "PATTERN"],
			a: [
				() => {
					S.clr = 3;
					doClear();
				},
				() => dgClearRow(),
				dgClearStep,
				() => {
					S.clr = 2;
					doClear();
				},
			],
		};
	}

	function dgKnobs() {
		const q = S.seq,
			i = q.sel,
			N = nstT(),
			r = DG.row,
			idx = r * SMAX + i,
			v = q.dg[idx];
		return [
			{
				l: "STEP",
				nu: 1,
				st: N,
				si: i,
				sn: i + 1,
				v: pad(i + 1, N > 99 ? 3 : 2),
				n: i / (N - 1),
				r: N,
				set: (d) => (q.sel = clamp(snapIdx(q.sel + d * (snapOn() ? unitSteps() : 1)), 0, N - 1)),
			},
			{
				l: "PAD",
				nu: 1,
				st: DGN,
				si: r,
				sn: r + 1,
				v: PADS[r],
				n: r / (DGN - 1),
				set: (d) => {
					const nr = clamp(DG.row + d, 0, DGN - 1);
					if (nr !== DG.row) {
						DG.row = nr;
						dgAud(nr, DGL[DG.lvl]);
					}
				},
			},
			{
				l: "VELOCITY",
				v: v ? String(v) : "OFF",
				n: v / 127,
				set: (d) => {
					if (!v) {
						if (d > 0) {
							q.dg[idx] = DGL[DG.lvl];
							dgAud(r, DGL[DG.lvl]);
						}
					} else {
						q.dg[idx] = clamp(v + d * 4, 0, 127);
					}
				},
			},
			{ l: "CLEAR", nu: 1, v: "---", n: 0, set: () => openClearDlg() },
		];
	}

	function dgKey(i) {
		if (i >= DGN) {
			return;
		}
		const q = S.seq,
			idx = i * SMAX + q.sel;
		undoPush("DRUM STEP");
		DG.row = i;
		if (q.dg[idx]) {
			q.dg[idx] = 0;
		} else {
			q.dg[idx] = DGL[DG.lvl];
			dgAud(i, DGL[DG.lvl]);
		}
		S.hot = { c: 1, t: performance.now(), d: 0 };

	} // page 3: white key n toggles pad n at the selected step
	function dgChipTap(k) {
		const n = performance.now();
		if (DG.arm && DG.arm.k === k && n - DG.arm.t < 2500) {
			DG.arm = null;
			if (k === "row") {
				dgClearRow();
			} else {
				dgClearPat();
			}
			return;
		}
		DG.arm = { k, t: n };

	} // a clear chip needs two taps
	function dgCell(x, y, vb) {
		const SP = SPB(),
			c = clamp(Math.floor((x - dgX()) / dgCW()), 0, SP - 1);
		return {
			r: clamp(Math.floor((y - DGY0) / DGRH), 0, DGN - 1),
			j: clamp(snapIdx(vb * SP + c), 0, nstT() - 1),
		};
	}

	// what is under a touch on the grid screen
	function dgZone(x, y) {
		const SP = SPB(),
			cw = dgCW();
		if (y >= DGY0 && y < DGY0 + DGN * DGRH) {
			if (x < DGX0 - 2) {
				return { t: "dg", kind: "label", r: clamp(Math.floor((y - DGY0) / DGRH), 0, DGN - 1) };
			}
			if (x >= dgX() && x < dgX() + cw * SP) {
				return { t: "dg", kind: "cell" };
			}
			return null;
		}
		if (barZone(x, y)) {
			return { t: "bs", tap: true };
		}
		if (y >= DQ.y - 1 && y < DQ.y + DQ.h && x >= 4 && x < 236) {
			return { t: "dq", k: clamp(Math.floor((x - 6) / DQ.dx), 0, 3) };
		}
		if (y >= DQ.fy - 2 && y < 187 && x < DQ.fx + DQ.fw + 8) {
			return { t: "dg", kind: "fill" };
		}
		const f = footHit(x, y);
		if (f) {
			return { t: "dg", kind: f === "u" ? "undo" : "redo" };
		}
		if (y >= 187 && y < 205) {
			if (x >= DF.lv.x - 2 && x < DF.rw.x - 2) {
				return { t: "dg", kind: "lvl" };
			}
			if (x >= DF.rw.x - 2 && x < DF.al.x - 2) {
				return { t: "dg", kind: "chip", k: "row" };
			}
			if (x >= DF.al.x - 2 && x < 221) {
				return { t: "dg", kind: "chip", k: "all" };
			}
		}
		return null;
	}

	// cells: touch an empty one and a hit is placed (at the brush level) and sounds; drag sideways to paint along the row; drag up or down to set its velocity.
	// Touch a hit: a bare tap removes it, a sideways drag erases along the row, an up/down drag sets its velocity. One undo step per touch.
	function dgDown(z, x, y) {
		const q = S.seq;
		if (z.kind === "label") {
			DG.row = z.r;
			dgAud(z.r, DGL[DG.lvl]);
			return;
		}
		if (z.kind === "lvl") {
			DG.lvl = (DG.lvl + 1) % 3;
			return;
		} /* the LEVEL chip cycles SOFT, MED, LOUD (it used to be three boxes) */
		if (z.kind === "chip") {
			dgChipTap(z.k);
			return;
		}
		if (z.kind === "fill") {
			openFillMenu();
			return;
		}
		if (z.kind === "undo") {
			footTap("u");
			return;
		}
		if (z.kind === "redo") {
			footTap("r");
			return;
		}
		undoPush("DRUM STEPS");
		z.vb = seqViewBar();
		const c = dgCell(x, y, z.vb),
			idx = c.r * SMAX + c.j;
		z.r = c.r;
		z.j0 = c.j;
		z.last = c.j;
		z.had = q.dg[idx] > 0;
		DG.row = c.r;
		q.sel = c.j;
		if (z.had) {
			z.mode = "tap";
		} else {
			q.dg[idx] = DGL[DG.lvl];
			z.mode = "add";
			dgAud(c.r, DGL[DG.lvl]);
		}
		z.v0 = q.dg[idx];
		S.hot = { c: 1, t: performance.now(), d: 0 };
	}

	function dgMove(z, x, y) {
		if (z.kind !== "cell") {
			return;
		}
		const q = S.seq,
			g = q.dg,
			dx = x - z.x,
			dy = y - z.y;
		if (!z.moved) {
			if (Math.abs(dx) < 3 && Math.abs(dy) < 3) {
				return;
			}
			z.moved = true;
			z.axis = Math.abs(dy) > Math.abs(dx) ? "v" : "h";
		}
		if (z.axis === "v") {
			const idx = z.r * SMAX + z.j0;
			if (g[idx]) {
				g[idx] = clamp(Math.round(z.v0 - dy * 4), 1, 127);
				S.hot = { c: 2, t: performance.now(), d: 0 };
			}
			return;
		}
		const SP = SPB(),
			c = clamp(Math.floor((x - dgX()) / dgCW()), 0, SP - 1),
			j = clamp(snapIdx(z.vb * SP + c), 0, nstT() - 1);
		if (j === z.last) {
			return;
		}
		if (z.mode === "tap") {
			z.mode = "erase";
			g[z.r * SMAX + z.j0] = 0;
		}
		const dir = j > z.last ? 1 : -1;
		for (let k = z.last + dir; ; k += dir) {
			const jj = clamp(snapIdx(k), 0, nstT() - 1),
				idx = z.r * SMAX + jj;
			if (z.mode === "erase") {
				g[idx] = 0;
			} else if (!g[idx]) {
				g[idx] = DGL[DG.lvl];
				if (AC && jj === j) {
					dgAud(z.r, DGL[DG.lvl]);
				}
			}
			if (k === j) {
				break;
			}
		}
		z.last = j;
		q.sel = j;
	}

	function dgUp(z, e) {
		if (z.kind === "cell" && e.type === "pointerup" && !z.moved && z.mode === "tap") {
			S.seq.dg[z.r * SMAX + z.j0] = 0;
		}
	}

	// the screen
	// ---- the drum grid's quick strip (PROTOTYPE ONLY touch; the device way in is the EDIT page's TUNE / DECAY / CRUSH knobs for the first three and the FILL knob on this page 2/2).
	// Four small bars for the SELECTED pad row (the one you tapped): TUNE, DECAY and CRUSH (S.drum.tune / dec / crush, 0-99 like the EDIT knobs) and the pad's CLICK (the kit voicing field that is that pad's attack or click:
	// DQV is the field, DQL its lowest useful value; the bar shows 0-99 like the others, the field has 16 steps). A kit with no voicing (`vo` null) gets the NEUTRAL voice for that pad (DQN0) on the first CLICK edit, so the
	// field has something to move; no engine field is added. Drag sideways on a bar (a relative drag: a bare tap changes nothing, the bar's width sweeps the whole range): one undo step per gesture, an audition hit while it moves.
	const DQ = {
		y: 152,
		h: 21,
		dx: 57,
		w: 52,
		by: 163,
		bh: 7,
		fy: 174,
		fx: 8,
		fw: 112,
		held: -1,
		k: -1,
		t: 0,
		at: 0,
		wt: 0,

	}; // LCD pixels: the first bar column, its label line, bar and size, the FILL chip row

	const DF = { lv: { x: 54, w: 46 }, rw: { x: 104, w: 56 }, al: { x: 164, w: 56 } }; // the footer's own chips: LEVEL (cycles), CLEAR ROW, CLEAR ALL, after the UNDO / REDO icons
	const DQV = [4, 4, 5, 6, 0, 2, 2, 4],
		DQL = [0, 0, 8, 8, 0, 0, 0, 0],

		DQN = ["CLICK", "SNAP", "ATTACK", "ATTACK", "BURSTS", "TICK", "ATTACK", "NOISE"]; // per pad: the voicing field that is its attack or click, its lowest value, its name (kick click, snare snap, hat attack burst, clap bursts, rim tick level, shaker attack, perc noise)
	const DQN0 = [
		[8, 8, 0, 8, 8, 8, 0, 9],
		[8, 8, 8, 8, 8, 8, 8, 9],
		[8, 8, 8, 0, 8, 8, 8, 9],
		[8, 8, 8, 0, 8, 8, 8, 9],
		[8, 8, 8, 8, 8, 8, 8, 9],
		[8, 8, 8, 8, 8, 8, 8, 9],
		[8, 8, 8, 8, 8, 0, 8, 9],
		[8, 8, 8, 8, 8, 8, 8, 9],

	]; // a pad's neutral voicing (8 = the original voice's value, 0 for the layers the original lacks, 9 = 0 dB)
	const dqName = (k, r) => (k === 0 ? "TUNE" : k === 1 ? "DECAY" : k === 2 ? "CRUSH" : DQN[r]);
	const dqVo = (D, r) => (Array.isArray(D.vo) && Array.isArray(D.vo[r]) ? D.vo[r] : null);

	function dqRaw(k, r) {
		const D = TK(DT).drum;
		if (k === 0) {
			return D.tune[r];
		}
		if (k === 1) {
			return D.dec[r];
		}
		if (k === 2) {
			return D.crush[r];
		}
		const vo = dqVo(D, r),
			x = vo && vo[DQV[r]] != null ? vo[DQV[r]] : DQN0[r][DQV[r]];
		return x;
	}
	const dqField = (k, r, v) =>
		k < 3
			? clamp(Math.round(v), 0, 99)

			: clamp(DQL[r] + Math.round((clamp(v, 0, 99) / 99) * (15 - DQL[r])), 0, 15); // the number a bar value of 0-99 is stored as
	const dqGet = (k, r) => {
		const x = dqRaw(k, r);
		return k < 3 ? x : Math.round(clamp((x - DQL[r]) / (15 - DQL[r]), 0, 1) * 99);
	};

	function dqSet(k, r, v) {
		const D = TK(DT).drum,
			x = dqField(k, r, v);
		if (k === 0) {
			D.tune[r] = x;
		} else if (k === 1) {
			D.dec[r] = x;
		} else if (k === 2) {
			D.crush[r] = x;
		} else {
			if (!Array.isArray(D.vo)) {
				D.vo = [null, null, null, null, null, null, null, null];
			}
			if (!Array.isArray(D.vo[r])) {
				D.vo[r] = DQN0[r].slice();
			}
			D.vo[r][DQV[r]] = x;
		}
	}

	function dqAud(r) {
		const n = performance.now();
		if (n - DQ.at < 110) {
			return;
		}
		DQ.at = n;
		dgAud(r, DGL[DG.lvl]);

	} // at most one audition hit per 110 ms while a bar moves
	function dqDown(z, x, y) {
		z.r = DG.row;
		z.v0 = dqGet(z.k, z.r);
		z.last = null;
		z.pushed = false;
		DQ.held = z.k;
		DQ.k = z.k;
		dqAud(z.r);
	}

	function dqMove(z, x, y) {
		const dx = x - z.x;
		if (!z.moved && Math.abs(dx) < 3) {
			return;
		}
		z.moved = true;
		const nv = clamp(Math.round(z.v0 + (dx / DQ.w) * 99), 0, 99);
		if (nv === z.last) {
			return;
		}
		z.last = nv;
		if (dqField(z.k, z.r, nv) === dqRaw(z.k, z.r)) {
			return;
		}
		if (!z.pushed) {
			undoPush("DRUM " + dqName(z.k, z.r));
			z.pushed = true;
		}
		dqSet(z.k, z.r, nv);
		DQ.t = performance.now();
		dqAud(z.r);
	}

	function dqUp(z) {
		DQ.held = -1;
	}

	function dqWheel(k, d) {
		const r = DG.row,
			nv = clamp(dqGet(k, r) + d * (k === 3 ? 7 : 3), 0, 99);
		if (dqField(k, r, nv) === dqRaw(k, r)) {
			return;
		}
		const n = performance.now();
		if (n - DQ.wt > 700) {
			undoPush("DRUM " + dqName(k, r));
		}
		DQ.wt = n;
		dqSet(k, r, nv);
		DQ.k = k;
		DQ.t = n;
		dqAud(r);
	}

	// ---- FILL: one pattern for the selected pad across the whole pattern length at the LEVEL velocity, replacing that pad's row (steps past the pattern's length are left alone). A step is a 1/16, a beat is BSTEPS() steps, a bar SPB().
	// Device: the FILL knob (K1 of SEQ page 2/2 on the drum grid) steps through the same list and writes each one as you turn (one undo step per turn, like any knob); the dropdown is the phone's way.
	const FILLS = [
		["FOUR ON THE FLOOR", (j) => j % BSTEPS() === 0],
		["OFFBEATS", (j) => j % BSTEPS() === BSTEPS() / 2],
		["EIGHTHS", (j) => j % 2 === 0],
		["SIXTEENTHS", () => true],
		["EVERY 2 BEATS", (j) => j % (2 * BSTEPS()) === 0],
		["EVERY BAR", (j) => j % SPB() === 0],
		["EVERY 2 BARS", (j) => j % (2 * SPB()) === 0],
		["EVERY 4 BARS", (j) => j % (4 * SPB()) === 0],
		["CLEAR PAD", () => false],
	];

	function dgFill(i, own = true, r = DG.row) {
		const f = FILLS[i];
		if (!f) {
			return;
		}
		if (own) {
			undoPush("FILL " + f[0]);
		}
		const g = S.seqs[DT].dg,
			N = nstT(DT),
			v = DGL[DG.lvl];
		for (let j = 0; j < N; j++) {
			g[r * SMAX + j] = f[1](j) ? v : 0;
		}
		DG.fill = i;
		toast(f[0] + "  " + PADS[r]);
	}
	const FMENU = { open: false };

	function openFillMenu() {
		closeEditMenu();

		if (!m) {

			m.hidden = true;

		}
		m.innerHTML = "";
		const cap = document.createElement("div");

		cap.textContent = "FILL " + PADS[DG.row] + " ACROSS THE PATTERN AT " + DGLN[DG.lvl];
		m.appendChild(cap);
		FILLS.forEach((f, i) => {

			}
			b.setAttribute("aria-pressed", String(DG.fill === i));
			b.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				e.stopPropagation();
				dgFill(i);
				closeFillMenu();
			});
			m.appendChild(b);
		});
		const r = document.getElementById("big").getBoundingClientRect();
		m.style.top = Math.round(r.top + (r.height * 28) / 240) + "px";
		m.style.bottom = "auto";
		m.hidden = false;
		FMENU.open = true;
		setTimeout(() => document.addEventListener("pointerdown", outsideFill, true), 0);
	}

	function outsideFill(e) {
		const m = document.getElementById("fillmenu");
		if (m && m.contains(e.target)) {
			return;
		}
		closeFillMenu();
		if (e.target === big) {
			e.stopPropagation();
			e.preventDefault();
		}

	} /* a tap on the screen that closes the dropdown is only that */
	function closeFillMenu() {
		const m = document.getElementById("fillmenu");
		if (m) {
			m.hidden = true;
		}
		FMENU.open = false;
		document.removeEventListener("pointerdown", outsideFill, true);
	}

	function dgKnobs2() {
		const fi = DG.fill;
		return [
			{
				l: "FILL",
				st: FILLS.length,
				si: Math.max(0, fi),
				sn: fi + 1,
				v: fi < 0 ? "---" : FILLS[fi][0],
				n: fi < 0 ? 0 : fi / (FILLS.length - 1),
				set: (d) =>
					dgFill(
						DG.fill < 0 ? (d > 0 ? 0 : FILLS.length - 1) : clamp(DG.fill + d, 0, FILLS.length - 1),
						false,
					),
			},
			{
				l: "SWING",
				v: S.swing + "%",
				n: (S.swing - 50) / 25,
				set: (d) => (S.swing = clamp(S.swing + d, 50, 75)),
			},
			{ l: "UNDO", nu: 1, v: UND.u.length + " LEFT", n: UND.u.length ? 1 : 0, set: () => undo() },
			{ l: "REDO", nu: 1, v: UND.r.length + " LEFT", n: UND.r.length ? 1 : 0, set: () => redo() },

	}
	SCR.dgrid = (now, live) => {
		const L = tbars(),
			SP = SPB(),
			cw = dgCW(),
			X0 = dgX(),
			q = S.seq,
			g = q.dg,
			cur = seqPos(now, live),
			bs = BSTEPS(),
			u = unitSteps();
		const vb =
				live && S.playing && cur >= 0
					? Math.min(L - 1, Math.floor(cur / SP))
					: clamp(Math.floor(q.sel / SP), 0, L - 1),
			o = vb * SP;
		if (q.sel >= nstT()) {

		}
		let hits = 0;
		for (let r = 0; r < DGN; r++) {

					hits++;
				}
			}
		}
		title(
			["1/2 DRUM GRID", "2/2 DRUM GRID", "STEP EDIT", "SEQ LENGTH", "TRACK LENGTH"][S.seqPage],
			hits + (hits === 1 ? " HIT" : " HITS"),
		);
		R(0, 28, 240, 1, P.faint);
		seqPips();
		songChipDraw();
		for (let i = 0; i < SP; i++) {
			const j = o + i,
				x = X0 + i * cw;
			if (i % bs === 0) {
				T(String(j + 1), x + ((cw - 1) >> 1), 30, P.dim, 1, "c");
			}
			if (j === q.sel) {
				R(x, DGY0 - 2, cw - 1, 1, P.acc);
			}
		}
		for (let r = 0; r < DGN; r++) {
			const ry = DGY0 + r * DGRH,
				sel = r === DG.row,
				flash = now - (S.padHits[r] || -1e9) < 160 || (live && cur >= 0 && g[r * SMAX + cur] > 0);
			if (sel) {

			for (let i = 0; i < SP; i++) {

					x = X0 + i * cw,
					v = g[r * SMAX + j],

				if (v) {

					R(x, ry + DGRH - 1 - hh, cw - 1, hh, on ? P.fg : [P.ops[3], P.ops[5], P.acc][dgLvl(v)]);

		{

				lit = now - DQ.t < 900;
			for (let k = 0; k < 4; k++) {
				const x = 8 + k * DQ.dx,
					v = dqGet(k, r),
					hot = DQ.held === k || (lit && DQ.k === k);
				T(dqName(k, r), x, DQ.y + 1, hot ? P.acc : P.dim);
				T(String(v), x + DQ.w, DQ.y + 1, hot ? P.acc : P.fg, 1, "r");
				R(x, DQ.by, DQ.w, DQ.bh, P.faint);
				R(x, DQ.by, Math.round((DQ.w * v) / 99), DQ.bh, hot ? P.acc : P.fg);
			}
		}
		/* the FILL dropdown chip, and what the cursor is on (or what the recording is doing) on the same row */
		{
			const x = DQ.fx,
				w = DQ.fw,
				y = DQ.fy;
			B(x, y, w, 12, FMENU.open ? P.acc : P.faint);
			T("FILL " + PADS[DG.row], x + 6, y + 3, P.fg);
			R(x + w - 10, y + 5, 5, 1, P.acc);
			R(x + w - 9, y + 6, 3, 1, P.acc);
			R(x + w - 8, y + 7, 1, 1, P.acc);
		}
		{
			const sl = q.sel,
				v = g[DG.row * SMAX + sl],
				ty = DQ.fy + 3;
			if (S.recExt && S.rec) {
				T("REC: GROWING", 232, ty, P.rec, 1, "r");
			} else if (S.rec) {
				T("REC: PLAY PADS", 232, ty, P.rec, 1, "r");

		footUR();
		{
			const y = FOOT.y,
				lv = DF.lv;
			B(lv.x, y, lv.w, FOOT.h, P.faint);
			for (let i = 0; i < 3; i++) {

			});

	};
	window.__mellowDrum = {
